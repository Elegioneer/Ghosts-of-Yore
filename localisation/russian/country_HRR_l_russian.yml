### Decisions ###
HRR_resource_extraction_cat:0 "Расширение горнодобывающих работ"
 HRR_resource_extraction_cat_desc:0 "Чтобы полностью использовать мощь промышленности Герцланда, нам нужно больше ресурсов. К счастью, наши геологоразведчики открыли новые месторождения, готовые к освоению."
 HRR_osnabeak_oilfield:0 "Расширить нефтяное месторождение Оснабика"
 HRR_bronzehill_crystal:0 "Добыча кристаллов Бронзхилла"
 HRR_bronzekreuz_steel:0 "Расширить сталелитейный завод Бронзхилл"
 HRR_feathisia_oil:0 "Разработка нефтяных месторождений Фетизии"
 HRR_reitscheid_mine:0 "Новые рудники Райтшайда"
 HRR_greenback_aluminium:0 "Инвестировать в плавильный завод Гринбэк"
 HRR_whitetail_mines:0 "Расширить рудники Уайттейл"
 HRR_herzland_scheme_cat:0 "Программа развития Герцланда"
 HRR_herzland_scheme_cat_desc:0 "Благодаря восстановлению и оздоровлению нашей экономики у нас теперь есть излишки ресурсов, которые можно направить на крупные проекты, считавшиеся невозможными для ранее разобщённых стран Герцланд. Эти инвестиции  заложат основу для новой эпохи процветания!"
 HRR_clear_scheisswald:0 "Очистить Шайсвальд"
 HRR_clear_scheisswald_desc:0 "Шайсвальд на протяжении поколений сопротивлялся любым попыткам заселить его и цивилизовать. Однако теперь, благодаря чудесам современных технологий, мы наконец-то можем сделать этот регион продуктивным и готовым к дальнейшему развитию."
 HRR_rottendendam_development:0 "Расширить порт Роттендедама"
 HRR_rottendendam_development_desc:0 "Благодаря стратегическому положению в устье реки Гриффкинг Роттендедам является одним из важнейших портов Грифонии. Однако до сих пор он находился в тени близлежащего Скайфолла. С помощью нескольких инвестиций это можно изменить и сделать Роттендедам главным портом Герцланда и ещё одной жемчужиной Грифонии."
 HRR_low_griffking_zone:0 "Промышленная зона Нижний Гриффкинг"
 HRR_low_griffking_zone_desc:0 "Агломерация Мирабель–Де Влейгельс–Ридеветтер — один из самых индустриально развитых и урбанизированных регионов Герцланда. Стимулирование бизнеса, общественных работ и расширение городов региона должны ещё больше  повысить его значение и расширить наши производственные мощности."
 HRR_dam_griffking:0 "Дамба на Гриффкинге"
 HRR_dam_griffking_desc:0 "Гриффкинг, самая мощная из рек Грифонии, открывает перед нами уникальную возможность. Благодаря изобретению новых гидроэлектростанций появилась возможность преобразовывать энергию реки в электроэнергию для нужд нашего населения и растущей промышленности."

### Ideas ###
 HRR_terror_tactics:0 "Тактика террора"
 HRR_terror_tactics_desc:0 "Северные пони прибегали ко всем видам жестокой и откровенно геноцидной тактики, чтобы остановить нас. Пока мы их не победим, они будут продолжать жестоко обращаться с нашим населением."
 HRR_war_winter:0 "Война с Зимой"
 HRR_war_winter_desc:0 "Грифоны, независимо от их национальности или политических взглядов, массово присоединяются к нашей армии, чтобы сражаться за свободу Герцланда."
 HRR_economic_devastation:0 "Экономическое опустошение"
 HRR_economic_devastation_desc:0 "Разнообразные зверства, совершённые армией Морозного Короля, опустошили Сердцеземье."
 HRR_disorganized_army:0 "Дезорганизованная армия"
 HRR_disorganized_army_desc:0 "Командиры различных ополчений и остатков бывших армий Герцландера часто расходятся во мнениях о том, как следует вести войну."
 HRR_military_governing:0 "Военное руководство"
 HRR_military_governing_desc:0 "Наши государственные институты носят временный характер, и в настоящее время страной руководит коалиция военных лидеров. Очевидно, что это ограничивает нашу способность управлять контролируемыми территориями."
 HRR_reconstruction_effort:0 "Усилия по восстановлению"
 HRR_reconstruction_effort_desc:0 "Многое было потеряно, но мы победили, и теперь настало время восстановить нашу родину."
 HRR_peace_prosperity_idea:0 "Строим лучшее будущее"
 HRR_peace_prosperity_idea_desc:0 "С полным освобождением наших земель и окончанием вторжения Морозного короля правительство Герцланда приняло политику, направленную на восстановление промышленности и сельского хозяйства Хартлендса и помощь населению."
 HRR_extra_resources:0 "Инвестиции в горнодобывающую промышленность"
 HRR_extra_resources_desc:0 "Наша добывающая промышленность быстро развивается благодаря щедрым государственным субсидиям."
 HRR_yale_universities:0 "Йельский университет"
 HRR_yale_universities_desc:0 "Благодаря поддержке правительства учёные Йельского университета продолжают разрабатывать новые, передовые технологии."
 HRR_welfare_politics:0 "Социальная помощь грифонам"
 HRR_welfare_politics_desc:0 "В рамках наших реформ мы запустили ряд новых программ социальной помощи, призванных помочь нашему населению обрести новое жильё, работу и семьи."
 HRR_rottendendam_port:0 "Порт Роттендедам"
 HRR_rottendendam_port_desc:0 "Refurbished and expanded, the port of Rottendedam became a major trade center of Griffonia."
 HRR_griffking_dammed:0 "Дамбы Гриффкинга"
 HRR_griffking_dammed_desc:0 "Благодаря новым плотинам Гриффкинга, электричество в Хартлендсе дёшево и в изобилии."
 HRR_agriculture_expanded_desc:0 "Благодаря притоку денежных средств и технологий наш сельскохозяйственный сектор достиг нового уровня эффективности."
 HRR_reinvigorated_economy:0 "Возрождение экономики"
 HRR_reinvigorated_economy_desc:0 "Послевоенное восстановление подходит к концу, и Герцланд и Северная Грифония вступают в новую эпоху экономического процветания."
 HRR_silberkralle_legacy:0 "Наследие Сильберкралле"
 HRR_silberkralle_legacy_desc:0 "Вновь рыцари защищают Герцланд. На этот раз они не подведут и выполнят свой долг."
 HRR_military_gendarmerie:0 "Военная жандармерия"
 HRR_military_gendarmerie_desc:0 "Вновь организованная жандармерия охраняет закон и порядок в недавно аннексированных регионах."
 HRR_reformed_officer_corps:0 "Реформированный офицерский корпус"
 HRR_reformed_officer_corps_desc:0 "Следуя лучшим традициям армий Герцланда и пройдя обучение в новых военных академиях, наши офицеры являются одними из лучших в мире."
 HRR_reformed_airforce:0 "Современные Военно-воздушные силы"
 HRR_reformed_airforce_desc:0 "Теперь с металлическими самолетами и полноценной программой подготовки пилотов!"
 HRR_high_command:0 "Главное командование Герцланда"
 HRR_high_command_desc:0 "Реорганизованное высшее командование наших вооруженных сил готово эффективно руководить ими в современном конфликте."
 HRR_fleet_reformed:0 "Современный флот" 
 HRR_fleet_reformed_desc:0 "Защитит наши берега от врагов."
 HRR_expedition_corps:0 "Экспедиционные силы"
 HRR_expedition_corps_desc:0 "Мы сражаемся за свободу не только для самих себя, но и для всех существ."
 HRR_new_panzerkorps:0 "Новый танковый корпус"
 HRR_new_panzerkorps_desc:0 "Стальные звери готовы к бою!"
 HRR_reichsarmee_doctrines:0 "Наследие Рейхсармии"
 HRR_reichsarmee_doctrines_desc:0 "Наши вооружённые силы — прямые наследники традиций Имперской армии Грифонов."
 HRR_fierce_defenders:0 "Свирепые защитники"
 HRR_fierce_defenders_desc:0 "Возможно, мы победили Короля Мороза, но есть много других врагов свободы. Мы должны быть готовы сразиться с ними, если они решат прийти за нами."
 HRR_lib_army:0 "Армия освобождения"
 HRR_lib_army_desc:0 "Каждый грифон должен быть готов принять участие в нашей борьбе за свободу!"
 HRR_rationing:0 "Жёсткое нормирование"
 HRR_rationing_desc:0 "Все доступные ресурсы должны быть использованы для нужд военной промышленности. Гражданским придётся отказаться от многих предметов роскоши, но другого пути к победе нет."
 HRR_retooled_for_war:0 "Переоборудовано для войны"
 HRR_retooled_for_war_desc:0 "Мы переоборудовали как можно больше гражданских заводов, чтобы обеспечить себя военной техникой."
 HRR_GOY_groverfirst:0 "Гровер I"
 HRR_GOY_groverfirst_desc:0 "Гровер I Грифонстоунский, король Герцланда. Хотя его прямое влияние на государство ограничено конституцией, благодаря наследию своего рода он служит мощным объединяющим символом для грифонов Герцланда."
 HRR_freemedia:0 "Свободные СМИ"
 HRR_freemedia_desc:0 "Свобода слова стимулирует научный дискурс и снижает политическую напряжённость".
 HRR_principles:0 "Три принципа"
 HRR_principles_desc:0 "Свобода, процветание и демократия. Наше государство следует принципам Республиканской революции 978 года".
 HRR_tolerantsociety:0 "Терпимое общество"
 HRR_tolerantsociety_desc:0 "В нашем государстве проживают представители многих рас, вероисповеданий и национальностей, и мы делаем всё возможное, чтобы ко всем им относились равноправно".
 HRR_temples_controlled:0 "Освобождение Храмов"
 HRR_temples_controlled_desc:0 "Мы установили государственный контроль над Архонтами, но они всё ещё сохраняют значительное политическое влияние".
 HRR_secular_state:0 "Светское государство"
 HRR_secular_state_desc:0 "Мы отделили Три Храма от государства, серьёзно ограничив влияние архонтов в правительстве."
 HRR_GOY_groverfirst_1:0 "Гровер I"
 HRR_GOY_groverfirst_1_desc:0 "Гровер I Грифонстоунский, король Герцланда. Благодаря недавним реформам он обладает обширными полномочиями и, благодаря наследию своего рода, является символом единства грифонов Герцланда."
 HRR_parliamentary_kingdom:0 "Сильный парламент"
 HRR_parliamentary_kingdom_desc:0 "Полномочия парламента были расширены для обеспечения демократического характера нашего королевства."
 HRR_provinces_strenghened:0 "Провинциальная автономия"
 HRR_provinces_strenghened_desc:0 "Автономия местного провинциального правительства значительно возросла, что привело к децентрализации нашего королевства."
 HRR_decentralized_state:0 "Децентрализованное государство"
 HRR_decentralized_state_desc:0 "Правительство позволяет местным общинам сохранять значительную степень автономии, позволяя дворянам контролировать свои феоды, при условии соблюдения законов и уплаты налогов."
 HRR_centralized_state:0 "Централизованное государство"
 HRR_centralized_state_desc:0 "Все пережитки феодальной системы были ликвидированы, и вся власть передана центральному правительству. Благодаря этому Грифенхейм имеет гораздо лучший контроль над подконтрольными ему территориями."
 HRR_parliamentary_republic:0 "Парламентская республика"
 HRR_parliamentary_republic_desc:0 "Постоянно грызущийся парламент, как правило, усложняет управление, но обеспечивает надлежащее представительство всех политических движений в стране".
 HRR_presidential_republic:0 "Президентская республика"
 HRR_presidential_republic_desc:0 "Хотя некоторые называют это диктатурой, нет сомнений, что сильный президент создаёт сильную республику".

### Focus ###
 HRR_reconstruction:0 "Реконструкция"
 HRR_reconstruction_desc:0 "Война выиграна, но наша земля и народ изуродованы зверствами прошлых лет. Теперь нам нужно сосредоточиться на исцелении нашей страны и восстановлении наших домов."
 HRR_rebuild_romau:0 "Восстановить Ромау"
 HRR_rebuild_romau_desc:0 "Мы не смогли защитить Ромау от северных варваров. Некогда великий город лежит в руинах. Всё, что мы можем сделать сейчас, – это похоронить погибших и попытаться спасти то, что осталось от Вечного города."
 HRR_rebuild_griffenheim:0 "Восстановить Грифенхейм"
 HRR_rebuild_griffenheim_desc:0 "Руины Грифенхейма навсегда останутся напоминанием о нашей неудаче. Мы выиграли войну, но так много было потеряно... Грифенхейм, возможно, никогда не вернёт себе былое величие, но те немногие, кто выжил, вернутся, и наш долг – восстановить их дома – показать, что мы никогда не сдадимся."
 HRR_heal_north:0 "Исцелим Север"
 HRR_heal_north_desc:0 "Северная Грифония больше всего пострадала от правления Морозного Короля: её города были разорены, а грифоны порабощены. Теперь пришло время восстановить эту несчастную землю."
 HRR_finance_civres:0 "Финансирование гражданских исследований"
 HRR_finance_civres_desc:0 "Если мы хотим полностью оправиться от ужасов войны, нам нужно сосредоточиться не только на военной технике, но и на совершенствовании наших гражданских технологий."
 HRR_integrate_infra:0 "Интеграция инфраструктуры"
 HRR_integrate_infra_desc:0 "Многие железные дороги и шоссе были повреждены во время недавних войн. Это, в сочетании с бывшим разделом Герцланда и северных земель, делает нашу транспортную систему несколько запутанной. Пора это исправить."
 HRR_peace_and_prosperity:0 "Мир и процветание"
 HRR_peace_and_prosperity_desc:0 "Основной частью нашего нового плана экономических реформ является переход от военной экономики к мирной. Больше тостеров, меньше танков!"
 HRR_herzland_dev_scheme:0 "Программа развития Герцланда"
 HRR_herzland_dev_scheme_desc:0 "Поскольку наша экономика медленно восстанавливается, мы можем перенаправить средства на несколько крупных проектов развития, направленных на улучшение экономики Герцланда."
 HRR_support_uni:0 "Поддержка университетов"
 HRR_support_uni_desc:0 "Герцланд известен своими знаменитыми университетами, а йельские университеты являются важнейшими центрами исследований и образования во всей Грифонии. Мы должны предоставлять этим учреждениям государственные субсидии."
 HRR_welfare_pol:0 "Политика социального обеспечения"
 HRR_welfare_pol_desc:0 "Мы не можем сосредоточиться только на экономике и инфраструктуре. Наш долг – помочь всем грифонам, чья жизнь была разрушена недавними событиями, и создание системы социального обеспечения – хороший способ сделать это."
 HRR_new_age:0 "Новый золотой век"
 HRR_new_age_desc:0 "Потребовалось время, но мы снова можем смотреть в будущее с надеждой. Наша экономика восстановилась, и раны войны постепенно заживают, поскольку мы приближаемся к новой эпохе процветания."
 HRR_resource_extraction:0 "Увеличить добычу ресурсов"
 HRR_resource_extraction_desc:0 "Огромные богатства скрыты под нашими землями. С небольшими инвестициями мы могли бы начать их добычу, что обеспечит нашу промышленность необходимым сырьем."
 HRR_agriculture_investment:0 "Инвестиции в сельское хозяйство"
 HRR_agriculture_investment_desc:0 "Герцланд имеет потенциал стать житницей Грифонии, и при грамотных инвестициях мы гарантируем, что будущие поколения никогда не узнают о голоде."
 HRR_restructure_industrial_companies:0 "Реструктуризация промышленных компаний"
 HRR_restructure_industrial_companies_desc:0 "Война оставила множество компаний в плачевном состоянии. Объединив и национализировав некоторые из них, мы сможем вернуть их к работе."
 #
 HRR_melt_ice:0 "Растопить лёд"
 HRR_melt_ice_desc:0 "Мы не будем порабощены! Морозный король, возможно, и победил нас однажды, но мы восстаём вновь, чтобы освободить грифонов от его тиранического правления. Мы либо сделаем это, либо погибнем, пытаясь."
 HRR_mobilise_griffs:0 "Мобилизовать ополчение"
 HRR_mobilise_griffs_desc:0 "Нам нужно, чтобы каждый боеспособный грифон был на передовой, если мы хотим победить наших угнетателей. В отличие от них, мы не можем просто так воскрешать мёртвых!"
 HRR_fortify_cities:0 "Укрепить города"
 HRR_fortify_cities_desc:0 "Мы должны готовиться к худшему. Если линия фронта рухнет, мы должны быть готовы защищать наши ключевые населённые пункты и мирных жителей."
 HRR_uncover_caches:0 "Обнаружить военные тайники"
 HRR_uncover_caches_desc:0 "При отступлении различные военные герцландцев тщательно прятали свою технику, надеясь вернуться и использовать её в другой день. Теперь, когда этот день настал, нам нужно её вернуть."
 HRR_sacrifices:0 "Необходимые жертвы"
 HRR_sacrifices_desc:0 "Если мы хотим победить, мы должны быть готовы к жертвам. Хотя это непростой выбор, военные должны получить абсолютный приоритет, а для населения будет введено строгое нормирование. Нам нужно всё, что мы можем получить, чтобы выиграть войну."
 HRR_guns_for_liberators:0 "Оружие для освободителей"
 HRR_guns_for_liberators_desc:0 "Мы воспользуемся относительной безопасностью наших южных территорий для строительства новых оружейных заводов."
 HRR_integrate_vets:0 "Интеграция ветеранов"
 HRR_integrate_vets_desc:0 "Бывшие республиканские партизаны, члены Рейхсармии и армий местной знати — все они теперь входят в состав наших вооружённых сил, однако сотрудничество между ними, как правило, затруднено. Чтобы раскрыть потенциал этих ветеранов, необходимо создать специальные формирования."
 HRR_volunteer_brigades:0 "Добровольческие бригады"
 HRR_volunteer_brigades_desc:0 "С каждым днём всё больше добровольцев со всей Грифонии присоединяются к нашему делу. Нам необходимо создать отдельное командование для этих отважных грифонов."
 HRR_last_crusade:0 "Последний крестовый поход"
 HRR_last_crusade_desc:0 "Различные рыцарские ордена решили присягнуть на верность нашему делу, объединённые общей целью — сражаться с безумным тираном Севера."
 HRR_retool_factories:0 "Переоборудование фабрик"
 HRR_retool_factories_desc:0 "Наши враги многочисленны. Чтобы сражаться с ними, нам нужно оружие, ещё больше оружия! Поэтому каждый завод должен быть переключён на военное производство."
 HRR_purchase_guns:0 "Приобретение иностранного оружия"
 HRR_purchase_guns_desc:0 "Хотя многие по всей Грифонии предлагают свою помощь, ничего не ожидая взамен, не все были столь щедры. Однако их тоже можно убедить помочь нам, предоставив достаточно денег..."
 HRR_heart_darkness:0 "Сердце Тьмы"
 HRR_heart_darkness_desc:0 "Армии Морозного Короля, возможно, и пали, но мы ещё не победили самого Тирана – пока он жив, мы никогда не сможем быть в полной безопасности..."
 HRR_fate_of_defeated:0 "Судьба побеждённых"
 HRR_fate_of_defeated_desc:0 "Пришло время решить, что делать с оставшимися пони. Они тоже виноваты в резне и разрушениях. В конце концов, Морозный Король не смог бы вести войну против грифоньего рода, если бы не поддержка его соотечественников..."
 HRR_liberate_slaves:0 "Освободить рабов"
 HRR_liberate_slaves_desc:0 "Морозный король превратил Северную Грифонию в сеть лагерей рабского труда. Наш долг — избавиться от остатков этого ужаса, восстановить городское управление и включить эти земли в состав нашего государства."
 HRR_restore_civ_government:0 "Восстановить гражданское правительство"
 HRR_restore_civ_government_desc:0 "С нашей победой нам больше не нужны генералы. Пришло время передать власть гражданским и создать надлежащее правительство."
 HRR_groverite_restoration:0 "Возвращение Гровера"
 HRR_groverite_restoration_desc:0 "Компромисс с роялистами необходим для обеспечения стабильности нашего нового государства. Поэтому мы согласились короновать юного Гровера новым королём Герцланда."
 HRR_heirs_of_republic:0 "Наследники Старой Республики"
 HRR_heirs_of_republic_desc:0 "Хотя Республика Грифонов стала одной из первых жертв Морозного Короля, республиканская мечта не умерла. Сегодня мы принимаем их мантию и создаём новую республику."
 HRR_free_media:0 "Свобода СМИ"
 HRR_free_media_desc:0 "Важным элементом наших реформ является свобода слова, поскольку она необходима для защиты нашей демократии."
HRR_adopt_principles:0 "Принять Три Принципа"
HRR_adopt_principles_desc:0 "Благодаря восстановлению Трех Республиканских Принципов как руководящей идеологии нашей нации мы станем наследниками Революции 978 года."
 HRR_many_races_nations:0 "Много рас, много наций"
 HRR_many_races_nations_desc:0 "Мы — страна множества существ: разных рас, религий, идеологий и национальностей. Только благодаря сотрудничеству мы сможем обеспечить мирное и гармоничное сосуществование."
 HRR_herzlandism:0 "Герцландизм"
 HRR_herzlandism_desc:0 "Поскольку наше государство прочно устоялось, многие требуют, чтобы мы защитили наших братьев в рамках "Великого Герцланда" и обеспечили их безопасность и свободу от тиранов и безумцев, терзающих Грифонию."
 HRR_religion_in_gov:0 "Религия в правительстве"
 HRR_religion_in_gov_desc:0 "Веками архонты слишком сильно контролировали имперскую политику. Пришло время положить этому конец."
 HRR_new_chancellor:0 "Новый канцлер"
 HRR_new_chancellor_desc:0 "Пришло время организовать первые выборы Королевского парламента, а затем выбрать нового канцлера, который возглавит правительство."
 HRR_king_constitution:0 "Король и Конституция"
 HRR_king_constitution_desc:0 "Укомплектовав парламент должным образом, мы можем приступить к созданию надлежащей конституции для нашего Королевства."
 HRR_elections:0 "Федеральные выборы"
 HRR_elections_desc:0 "День выборов наконец настал! Сегодня грифоны решат, кто поведет Федерацию к новому, светлому будущему."
 HRR_nobles_revolutionaries:0 "Дворяне и революционеры"
 HRR_nobles_revolutionaries_desc:0 "До сих пор мы боролись с общим врагом, поэтому внутренние разногласия в Армии освобождения игнорировались. Однако теперь, когда очевидная угроза нашему существованию миновала, нам необходимо устранить внутренние разногласия."
 HRR_president_parliament:0 "Президент и парламент"
 HRR_president_parliament_desc:0 "В рамках создания гражданского правительства нам необходимо решить, какой объём контроля над государством будут иметь различные ветви власти."
 #
 HRR_from_rebels:0 "От мятежников к армии"
 HRR_from_rebels_desc:0 "Теперь, когда война с Тиранией окончена, пришло время распустить все ополчения и реформировать наши вооружённые силы в единую, полностью единую силу."
 HRR_study_herz:0 "Изучить разработки Герцландера"
 HRR_study_herz_desc:0 "Мы унаследовали довольно разнообразный набор снаряжения от различных армий Герцланда. В рамках объединения наших вооружённых сил мы постараемся изучить конструкции этого оружия и формализовать передовой опыт в оружейном деле."
 HRR_reorg_knight:0 "Реорганизация рыцарских орденов"
 HRR_reorg_knight_desc:0 "В наших землях много рыцарских орденов. Большинство из них едва держатся на плаву после тяжёлых потерь во время вторжения в Герцланд и Освободительной войны; они остро нуждаются в нашей помощи."
 HRR_gendarmerie:0 "Военная жандармерия"
 HRR_gendarmerie_desc:0 "Создание новой военной полиции значительно повысит нашу способность подавлять тех, кто пытается дестабилизировать наше новое государство."
 HRR_new_officers:0 "Новое поколение офицеров"
 HRR_new_officers_desc:0 "Создавая новые военные академии, мы сможем восполнить потери, понесённые нашим офицерским корпусом во время войны."
 HRR_reclaim_skies:0 "Вернуть небо"
 HRR_reclaim_skies_desc:0 "Самолёты оказались краеугольным камнем любой современной армии. Нам необходимо реструктурировать наши разношёрстные ВВС в полноценные формирования."
 HRR_new_command:0 "Реформировать Верховное командование"
 HRR_new_command_desc:0 "Часть нашего плана военной реформы — переукомплектовать Верховное командование. Благодаря повышению в должности многих опытных бывших офицеров рейхсармии мы сможем создать гораздо более дисциплинированную и лучше организованную армию."
 HRR_navy:0 "Наш новый флот"
 HRR_navy_desc:0 "У нас нет настоящего флота, и если мы хотим защитить наши моря, нам нужно его построить — и сделать это как можно скорее."
 HRR_military_research:0 "Военный научно-исследовательский институт"
 HRR_military_research_desc:0 "Если мы не хотим отставать от наших соседей, нам необходимо инвестировать в создание новых исследовательских центров, специализирующихся на военных технологиях."
 HRR_liberators:0 "Освободители"
 HRR_liberators_desc:0 "Пока мы свободны, в мире есть много стран, которые страдают от тираний или подвергаются прямой угрозе с их стороны. Наш долг — помочь этим беднягам."
 HRR_reichsarmee_legacy:0 "Наследие Рейхсармии"
 HRR_reichsarmee_legacy_desc:0 "Ветераны бывшей Рейхсармии составляют значительную часть нашего офицерского корпуса. Мы должны в полной мере использовать их знания и опыт на благо нашей армии."
 HRR_magic_of_war:0 "Магия войны"
 HRR_magic_of_war_desc:0 "Магия стала важнейшим элементом современной войны. Благодаря правильной интеграции магии с нашей доктриной мы значительно усилим возможности наших вооружённых сил."
 HRR_griffonia_shield:0 "Щит Грифонии"
 HRR_griffonia_shield_desc:0 "Первостепенная задача нашей армии — защитить нашу страну, чтобы в будущем не допустить такой катастрофы, как вторжение Морозного Короля. Мы больше никогда не будем рабами!"
 HRR_changeling_lessons:0 "Уроки миссии Чейнджлингов"
 HRR_changeling_lessons_desc:0 "Военный атташе Чейнджелингов внёс огромный вклад в усовершенствование технологий имперской бронетехники. Изучая оставленные ими документы и сотрудничая с офицерами, обученными Чейнджлингами, мы сможем улучшить военную доктрину наших бронетанковых войск."

## Events ##
herzland_liberation_goy.01.t:0 "Падший"
 herzland_liberation_goy.01.d:0 "Вечноснежный город смердел смертью и дымом – как любой другой город после долгой битвы. И битва за Эверфрост была долгой. Пони-воины сражались до последнего – либо из ненависти к грифонам, либо из страха перед расправой своего правителя. Улицы были усеяны телами как (недавно) живых, так и немертвых, а многие районы были сровнены с землей. Однако среди всех разрушений Дворец Сноуфлэйк стоял невредимым, насмехаясь над грифонами. Все повреждения, нанесенные дворцу, были практически мгновенно устранены магическим льдом. Морозной Король, возможно, и был загнан в угол в своем логове, но нападавшие не могли добраться до него. Все отряды, вошедшие во дворец, не вернулись. Гектор Арденссон стоял перед воротами. Несколько дней, сначала во сне, а теперь даже днем, он слышал голос. Морозной Король говорил в его голове, насмехаясь над ним и требуя встретиться с ним лицом к лицу. И хотя другие командиры пытались отговорить его от похода, Гектор знал, что это его долг. \n\n\n\nСтарый рыцарь прошёл через остатки некогда замысловатых ворот и вошёл во дворец. Внутри всё было покрыто льдом, образующим всевозможные причудливые орнаменты и скульптуры. Он не знал, как долго бродил по коридорам и пустым комнатам, прежде чем наткнулся на большой зал, внутри которого стояло одно существо – грифон. Эрик Гримкло, казалось, спал, опираясь на меч и опустив голову. Однако, когда Гектор приблизился, он заговорил: "Арденссон. Морозный Король сказал мне, что ты придёшь. Он был прав, как всегда".\n\n\n\n— "Когда мне сказали, что тебя видели на передовой, командующим чудовищной нежитью..." – презрительно ответил Гектор, — "я не поверил. Я думал, ты погиб, и Тиран воскресил тебя, как и многих других, как какую-то жестокую шутку. Но вот ты здесь. Живой. Почему?" \n\n\n\nЭрик долго молчал, глядя в пространство... — "Грифоны слабы. Мы просто сражаемся, обманываем и предаем друг друга. Неужели эти жалкие создания действительно заслуживают свободы? Более тридцати лет мы убивали друг друга из-за мелочей. Думаешь, что-то изменится с твоей победой? Эти слабаки разнесут всё, что ты построил".\n\n\n\n— Гектор обнажил меч. — "Если бы мы были такими, как ты говоришь, меня бы здесь не было. Армии твоего "короля" не были бы побеждены. Мы можем казаться слабыми, но внутри каждого грифона есть искра, потенциал величия. Эта искра сияет ярче всего перед лицом невзгод. Когда мы победим, мы построим лучшую Грифонию". \n\n\n\nЭрик взвизгнул и прыгнул на Гектора, занеся меч. Его скорость и сила были удивительны даже для молодого грифона. Старый рыцарь, вынужденный отчаянно защищаться, чувствовал, как его силы тают с каждым отражённым ударом. Атака Эрика была неумолимой, и Гектор понимал, что ему нужно как можно скорее закончить этот бой. Его единственным шансом было использовать ярость Эрика против него самого. Гектор притворился, что поскользнулся, и когда Эрик попытался сразить его, ему удалось нанести решающий удар. Падший рыцарь резко остановился, уставившись на торчащий из его груди клинок, отступил на несколько шагов и упал на пол. Рана была, очевидно, смертельной. \n\n\n\nГектор взял меч Эрика и встал над ним. Молодой рыцарь закрыл глаза, смирившись со своей участью. Одним точным ударом Гектор отрубил ему голову. "Могу лишь надеяться, что боги смилостивятся над тобой, Эрик", — сказал он на прощание... Осталось сделать только одно..."
 herzland_liberation_goy.01.a:0 "...убить Тирана"
 herzland_liberation_goy.02.t:0 "Убить Тирана"
 herzland_liberation_goy.02.d:0 "Старый Зал Собраний, ныне тронный зал Морозного Короля... Это место напоминало бойню. Десятки убитых грифонов покрывали пол, как и стражники-нежить – очевидно, убитые магией, а не мечами. Тиран Севера восседал на своём грандиозном ледяном троне. Как бы он ни старался казаться устрашающим и величественным, было очевидно, что выдержать артиллерийский обстрел и битву за Эверфрост было тяжело. Части его тела гнили, местами до костей, словно чрезмерное использование магических сил медленно разрушало его.\n\n\n\nЭто было почти жалкое зрелище: одинокий самопровозглашённый бог, скрывающийся в своём дворце, и даже украденные силы предают его... Но Гектор не жалел существо, погубившее столько невинных душ, – и хотевшее поработить ещё больше. "Итак, ты наконец-то пришёл. Пологаю, моя пешка мертва? Я не особо удивлён, он был больше болтуном, чем бойцом... Но предполагал, что он хотя бы ранит тебя. Какое разочарование..." — Гектор не ответил, лишь медленно приблизился к трону с обнажённым мечом. —   — "Никаких угроз? Никаких обвинений? Никаких молитв твоим жалким богам, грифон? Ты рыцарь, тебе следует быть верным и говорить о великих делах. Мне ведь не смешно!"\n\n\n\n— "Ты заслуживаешь только смерти, демон!" — сказал Гектор и ринулся вперёд. \n\n\n\nПони слегка приподнял копыто, словно ему наскучило это зрелище. Волна ледяного воздуха обрушилась на Гектора с силой, которая сбила бы с ног взрослого минотавра и превратила бы его в ледяную скульптуру. Но Гектор отмахнулся от неё, словно от порыва ветра. Равнодушие в глазах Морозного Короля сменилось удивлением и страхом. Осколки льда поднимались с пола, пронзая тело Гектора, но он продолжал атаковать. В явном отчаянии Морозной Король поднял копыто, и в нём появилась сосулька в форме меча. Лёд ударил по стали... И сталь разлетелась на куски.\n\n\n\nГектор упал на пол, измученный и ослабленный ранами. Морозной Король на мгновение замолчал. А затем рассмеялся:\n\n\n\n"Глупец!" — прохрипел он. — "Ты думал, что сможешь убить меня? Что сможешь убить бога?!" — Он шагнул вперёд и встал прямо над поверженным врагом. — "Я убью тебя. Но не сейчас. Я хочу, чтобы ты стал свидетелем того момента, как я обрушу свой гнев на твоих жалких товарищей и..." — В этот момент Гектор внезапно протянул коготь, прорвав кожу на груди Морозного Короля и схватив его ледяное сердце. Прежде чем колдун успел среагировать, Гектор вырвал его из груди и ударил об пол, разбив его вдребезги. С ужасающим воплем Морозной Король рухнул, его тело быстро разлагалось, пока от него не остались лишь кости. \n\n\n\nГектор поднялся. Сначала у него задрожало сердце, затем вокруг него начали рушиться куски потолка – пора было бежать. Несмотря на раны, он бросился к ближайшему выходу. Он едва успел выбраться из дворца, поскольку через несколько мгновений после того, как он прошёл мимо ворот, дворец рухнул прямо за его спиной. Гектор бросил на него последний взгляд. К нему с криками подбежали другие грифоны... Но он не слышал, о чём они говорили..."
 herzland_liberation_goy.02.a:0 "...так как потерял сознание от кровопотери."
 herzland_liberation_goy.03.t:0 "Простить монстра"
 herzland_liberation_goy.03.d:0 "Со смертью Морозного Короля большая часть его армии – нежить – обратилась в прах, но его смертные подчинённые остались. Хотя некоторые продолжали преследовать наши войска, смерть их господина вскоре каким-то образом лишила их всякой воли к борьбе. Многие из тех, кого мы захватили, просто сидели и отказывались даже от еды и питья. Никто не ожидал, что их боевой дух упадёт так низко, и даже наши самые закалённые в боях солдаты начали жалеть этих существ. Есть также много мирных пони, которые не имели никакого отношения к событиям последних лет, продолжая жить под властью Морозного Короля, как и всегда, не причинив вреда ни одному грифону. Теперь они и многие другие в нашей власти. Хотя некоторые горячие головы призывали к мести – как можно более жестокой, – Гектор Арденссон, использовав весь свой авторитет, убедил других лидеров повстанцев, что вместо повторения цикла угнетения и насилия, приведшего к этому моменту, они должны простить невиновных, и что грифоны и пони должны научиться жить вместе без ненависти и войны. Однако оставался вопрос, что же делать с Тир Дейге — некоторые предлагали предоставить кланы самим себе, в то время как другие призывали оставить там гарнизоны на случай, если пони выпустят на волю ещё какое-нибудь древнее зло..."
 herzland_liberation_goy.03.a:0 "Проявим снисходительность." 
 herzland_liberation_goy.03.b:0 "Мы должны быть осторожны!"
 herzland_liberation_goy.04.t:0 "Трон и Алтарь"
 herzland_liberation_goy.04.d:0 "Религия всегда была важной частью общества грифонов, играя даже значительную роль в политике. Три архоната занимали важное положение в Империи и даже сейчас продолжают оказывать большое влияние на новообразованное государство. Однако с созданием Королевства Герцланд умеренные дворяне и республиканцы не желали позволить Трём Храмам вернуть себе прежние позиции власти. Возник спор о том, как ограничить власть архонтов: одни утверждали, что их следует подчинить короне и, по сути, сделать ещё одним инструментом для короля, исполняющего его волю, в то время как другие предлагали полную секуляризацию государства, предоставив Храмам свободу действий, но запретив им влиять на политику."
 herzland_liberation_goy.04.a:0 "Лучше просто контролировать архонтов."
 herzland_liberation_goy.04.b:0 "Секуляризация – лучший выбор."
 herzland_liberation_goy.05.t:0 "Канцлер для королевства"
 herzland_liberation_goy.05.d:0 "После создания нового парламента встал вопрос о назначении нового канцлера. Учитывая ограниченность роли короля в повседневном управлении государством, эта должность предполагала значительный объём власти. Хотя было предложено множество кандидатов, благодаря осторожным политическим маневрам и переговорам между партиями и другими влиятельными группами лишь троим удалось заручиться достаточной поддержкой, чтобы сформировать стабильное правительство, получая при этом негласную поддержку со стороны Королевской армии и влиятельной знати.\n\nПервый из них – Генрих Кингфезер, ставший заметной фигурой в возрожденной Национальной республиканской партии. Будучи известным центристом, он апеллировал к более либеральным взглядам.\n\nВторой кандидат, Уинстон Копперхилл, – фаворит лоялистов из Герцланда, которого также поддерживают многие грифоны-республиканцы, – его кандидатура вызывает наименьшие разногласия.\n\nПоследняя, продвинутая влиятельной знатью в правительстве, – Регина Иглкло, дальняя родственница нашего короля и бывшая герцогиня Строберри. Несмотря на очень хорошие связи с элитой, из всех трех кандидатов она пользуется наименьшей поддержкой народа.\n\nВсе жители Герцланда с нетерпением ждут, кто из трех кандидатов будет назначен парламентом и утвержден королем в качестве нового канцлера."
 herzland_liberation_goy.05.a:0 "Канцлер Кингфезер."
 herzland_liberation_goy.05.b:0 "Канцлер Копперхил."
 herzland_liberation_goy.05.c:0 "Канцлер Иглкло."
 herzland_liberation_goy.06.t:0 "Новая политическая система"
 herzland_liberation_goy.06.d:0 "Хотя Королевство Герцланд предположительно является конституционной монархией, детали государственного устройства пока не определены. Пока что правительство действует на временной основе, но наконец-то пришло время укрепить нашу политическую систему, объединить различные законы, принятые парламентом, в четкий кодекс и внести последние штрихи в нашу конституцию. Конечно, всё не так просто, как может показаться, и различные фракции пытаются формировать Королевство в соответствии со своими убеждениями и интересами.\n\nРеспубликанцы надеются прочно закрепить за парламентом статус высшей власти Королевства, усилив выборного канцлера и подчиненный ему аппарат, одновременно ограничив влияние Короля на все ветви власти.\n\nРоялисты настаивают на предоставлении Королю права вето на любые решения, принимаемые парламентом, и на расширении системы государственной службы, подчиняющейся непосредственно ему.\n\nТем временем различные региональные движения выступают за децентрализацию государства и расширение законодательных полномочий отдельных провинций Королевства."
 herzland_liberation_goy.06.a:0 "Усилим парламент."
 herzland_liberation_goy.06.b:0 "Увеличим власть короля."
 herzland_liberation_goy.06.c:0 "Децентрализируем королевство."
 herzland_liberation_goy.07.t:0 "Федеральные выборы"
 herzland_liberation_goy.07.d:0 "С момента окончания войны в Герцланде и Северной Грифонии кипела политическая жизнь. Движения то возникали, то исчезали, то объединялись, различные лидеры пытались склонить грифонов на свою сторону, убеждая широкую общественность в том, что они являются самым популярным лидером новообразованной Федерации. Гектор Арденссон оставил пост лидера и ушёл из политики, после чего новый парламент единогласно провозгласил его "Отцом Федерации".\n\nВажнейшее событие в короткой истории Федерации – первые президентские выборы – стремительно приближалось. За последние несколько недель появились три основных кандидата:\n\nГабриэлла ди Карфин (недавно дистанцировавшаяся от остатков Национальной республиканской партии), бывший сенатор от Ромау, обещала дальнейшую демократизацию Федерации.\n\nГенрих Кингфезер – старый политик-республиканец из Клаудбьюри – баллотировался на пост президента, выступая за сохранение традиционных ценностей и расширение прав и возможностей меньшинств. \n\nИ Гербен Когхель, социал-демократ, сумевший объединить разнообразные и внутренне разобщенные коммунистические движения Герцланда."
 herzland_liberation_goy.07.a:0 "Президент ди Карфин!"
 herzland_liberation_goy.07.b:0 "Президент Кингфезер!"
 herzland_liberation_goy.07.c:0 "Президент Когхель!"
 herzland_liberation_goy.08.t:0 "Вопросы централизации" 
 herzland_liberation_goy.08.d:0 "Армия Освобождения состояла из множества групп, поскольку лишь самые отъявленные грифоны отказывались вступать в неё. Хотя общая борьба с Морозным Королем создала уникальное единство, не зависящее от политических взглядов, становилось очевидно, что социалисты-революционеры и старые лоялисты империи больше не могут сотрудничать, и конец этого странного союза был близок. К счастью, достаточное количество грифонов было готово пойти на некоторые уступки, чтобы не ввергнуть наше молодое государство в гражданскую войну. Большинство, за исключением самых ярых лоялистов империи, не стремилось к восстановлению Империи, а ужасы войны сделали идею развязывания новой войны и создания пангрифонского государства довольно непопулярной. \n\nКонечно, было и множество других важных вопросов, таких как дебаты о земельной реформе и привилегиях дворянства. Если правительство собирается отобрать у дворян землю, им должна быть выплачена компенсация – эта идея не встретила особого сопротивления. Однако более радикальные республиканцы предлагают полностью отменить дворянские титулы и все остатки феодализма. Однако империалисты, желая сохранить хотя бы часть старой системы, предложили интегрировать дворянские поместья в Федерацию, подчинив её новым законам и налогам. Как ни странно, это предложение получило достаточно поддержки, чтобы рассматриваться как вариант, поскольку многие регионалисты видели в нём шаг к большей децентрализации: влиятельные региональные лорды, становясь противовесом государству, могли добиваться большей автономии для своих провинций."
 herzland_liberation_goy.08.a:0 "Лучше добиться компромисса с дворянами."
 herzland_liberation_goy.08.b:0 "Централизовать Федерацию."
 herzland_liberation_goy.09.t:0 "Сбалансировать власть."
 herzland_liberation_goy.09.d:0 "В преддверии первых выборов пришло время определить политическую систему Федерации Грифонов. Хотя ограничение полномочий президента и предоставление парламенту всех исполнительных полномочий понравятся как массам, так и политикам-регионалистам, многие утверждают, что война с Морозным Королём доказала необходимость сильного лидера, способного активно руководить своей страной во время конфликта. Поэтому президенту необходимо было иметь более широкие полномочия в управлении страной, чтобы страна могла быстро мобилизоваться в случае неминуемой опасности."
 herzland_liberation_goy.09.a:0 "Власть парламенту!"
 herzland_liberation_goy.09.b:0 "Власть президенту!"
 herzland_liberation_goy.10.t:0 "Последняя победа"
 herzland_liberation_goy.10.d:0 "Боль. Это было первое, что он почувствовал после пробуждения, задолго до того, как смог открыть глаза. Это было долгожданным изменением после, казалось бы, бесконечных кошмаров, где он чувствовал лишь ужас, страх и неестественный холод. Теперь, по крайней мере, он снова обрёл своё тело. Он также слышал голоса, но не мог понять, что происходит вокруг. Даже когда ему удалось открыть глаза, всё было... размытым. Какие-то грифоны в белых одеждах (медсёстры?) бегали вокруг и что-то кричали. Спустя мгновение он снова поддался пустоте, однако на этот раз его сон был глубоким и без сновидений.\n\nВ следующий раз, проснувшись, он почувствовал себя лучше – настолько хорошо, насколько это вообще возможно в таком состоянии. Покрытый таким количеством бинтов, что напоминал мумию, он чувствовал боль в многочисленных ранах на теле и ещё более глубокую, странную боль где-то в костях, которая словно говорила ему: "Ты больше не юноша, ты не в состоянии сражаться с древним злом". Он пролежал в коме уже неделю, и прошло ещё несколько дней, прежде чем он смог встать. Хотя врачи из военного госпиталя делали всё возможное, его раны казались... в каком-то смысле сверхъестественными, сопротивляясь всем их усилиям, словно последней местью падшего Бога Севера. Тем не менее, Гектор был более чем рад узнать, что его подчинённые прекрасно справились без него, уничтожив последние оплоты пони. Что ещё важнее, единство Армии освобождения было по-прежнему крепким. Даже когда он был на грани смерти, не было никаких ссор, бывшие имперцы и республиканцы продолжали сотрудничать, стабилизируя обстановку на освобождённых землях, распределяя припасы среди бывших рабов и начиная процесс восстановления. Несколько дней спустя, вопреки предписаниям врачей, Гектор посетил заседание Верховного командования. Он тогда говорил мало, споры решались мирно, без его вмешательства. Столкнувшись с общим, страшным врагом, бывшие противники больше не искали конфликта, словно война сделала их взрослее и внимательнее. \n\nИменно тогда он понял, что его работа завершена. Благодаря его усилиям у Герцланда появилось будущее. И всё, чего он хотел, — это наслаждаться им мирно. Эти последние годы принесли ему столько кровопролития, ужаса и войн, что хватит на несколько жизней. Вскоре после этого, на другой встрече, грандмастер Гектор Арденнсон, командующий Армией освобождения Герцланда, объявил о своих планах..."
 herzland_liberation_goy.10.a:0 "...уйти на пенсию."
 
## News Events ##
herzland_liberation_goy_news.1.t:0 "Оттепель"
 herzland_liberation_goy_news.1.d:0 "[This.GetNewspaperHeader]Морозной Король повержен! После долгой и разрушительной войны повстанцы-грифоны сумели отбросить орды нежити и двинулись прямо на Эверфрост. Хотя подробности неясны, похоже, что Грандмастер Сильберкралле и лидер восстания, Гектор Арденссон, лично убил Морозного Короля, положив конец его безумной попытке завоевать Грифонию. Со смертью своего предводителя оставшиеся слуги-нежить обратились в прах, а северные пони потеряли всякую волю к борьбе. Хотя многие погибли, а война опустошила Центральную и Северную Грифонию, выжившие празднуют на улицах разрушенного Грифенхейма, Ромау и Эверфроста – кошмар наконец-то закончился!"
 herzland_liberation_goy_news.1.a:0 "Победа!"
 herzland_liberation_goy_news.1.b:0 "Лёд расстаял!"
 herzland_liberation_goy_news.1.c:0 "Очередной безумец пал..."
 herzland_liberation_goy_news.2.t:0 "Реставрация Монархии"
 herzland_liberation_goy_news.2.d:0 "[This.GetNewspaperHeader]После победы над Морозным Королем, жители Герцланда, перестав быть просто разрозненной разрозненной армией повстанцев, нуждались в стабильном гражданском правительстве. Совместные усилия по борьбе с северными захватчиками привели к заключению маловероятных союзов и, по крайней мере, частично смягчили раскол между бывшими сторонниками империи и различными группами республиканцев. После продолжительных переговоров было достигнуто соглашение: Империя Грифонов упраздняется, а на её месте образуется новое Королевство Герцланд во главе с бывшим императором, королём Гровером. Его власть будет ограничена новой конституцией, а страна будет придерживаться республиканских принципов, включая создание нового Парламента. Хотя радикалы с обеих сторон осуждают это как предательство всего, за что они боролись, большинство сходится во мнении, что такой исход – наилучший путь к прочному миру в регионе и сближению с другими народами Грифонии."
 herzland_liberation_goy_news.2.a:0 "Ура!"
 herzland_liberation_goy_news.2.b:0 "Ну, посмотрим..."
 herzland_liberation_goy_news.2.c:0 "Интересно."
 herzland_liberation_goy_news.3.t:0 "Рождение новой Республики"
 herzland_liberation_goy_news.3.d:0 "[This.GetNewspaperHeader]После победы над Морозным Королем, Герцланд, перестав быть просто разрозненной кучей повстанческих армий, нуждался в стабильном гражданском правительстве. С угасанием династии Гроверов роялисты не смогли назначить приемлемого наследника престола, что привело к распаду их партии и образованию республиканцами Федерации Герцланда. Хотя определённый уровень старых дворянских привилегий будет сохранен по соглашению с имперскими лоялистами, похоже, будущее Герцланда будет связано с приверженностью республиканским принципам."
 herzland_liberation_goy_news.3.a:0 "Да здравствует Федерация!"
 herzland_liberation_goy_news.3.b:0 "Это было, конечно, неожиданно."
 herzland_liberation_goy_news.3.c:0 "Интересно."
