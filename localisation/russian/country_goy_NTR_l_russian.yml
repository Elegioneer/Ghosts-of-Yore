 ntribes.58.t:0 "Перерождение"
 ntribes.58.d:0 "После метели Новая Скайнавия стояла совершенно безжизненной, и даже животные, казалось, обходили её стороной. Гэвин прекрасно понимал причину – город не был по-настоящему заброшен: призраки его обитателей всё ещё бродили по руинам, навеки прикованные к своей снежной гробнице. Все живые существа, вошедшие в город, чувствовали тревогу, и воины, сопровождавшие верховного друида, инстинктивно жались друг к другу, продвигаясь дальше. Что касается Гэвина, то ему пришлось гораздо, гораздо хуже: он ясно ощущал все эти мёртвые души, их гнев, страх и боль. Но он должен был быть здесь. Ему нужно было увидеть плоды своих действий – теперь его долг нести это бремя, и это было правильным решением. Сотни тысяч, должно быть, погибли здесь, и Скайнавия навсегда будет запятнана тёмной магией – и всё это напрямую связано с его поступками...\n\nГэвин шёл по пустым улицам, и давление всё росло. Призраки грифонов чувствовали его присутствие и слетались к своему мучителю, пристально глядя и осуждая. Поток мучительной ярости изливался из каждого дюйма духовного эфира на Архдруида, пока он не перестал с этим справляться. Всё, чего он хотел, – это уйти в себя и отгородиться от душ, которые он проклял навечно...\n\nОн обратился к себе за помощью, но не нашёл покоя – Духов больше не было рядом, чтобы вести его, с тех пор как он убил их. Он слышал голоса давно умерших, мстительных тиранов прошлого, шепчущих о мести, власти и контроле. Они долго ждали, когда он проявит слабость, и вот наконец настал их шанс нанести удар!\n\nАрхидруид Гэвин рухнул на землю, казавшийся безжизненным, и, когда его товарищи собрались вокруг, не зная, что делать, он внезапно открыл глаза. Больше не было Гэвина Морозной Бороды, не было Королей Метели. Родилось новое существо — существо без сожаления и страданий, и от старого друида осталась только одна сторона — жгучее желание защитить своих сородичей, пони, которыми он пытался руководить многие десятилетия, и которым он хотел дать то, чего они по-настоящему заслуживали — больше не жить в страхе, а править Грифонией..."
 ntribes.58.a:0 "И так родился Морозный Король."
 ntribes.32.t:0 "Пейзаж после битвы"
 ntribes.32.d:0 "Это было одно из многих подобных мест в Сердце Империи: обширная равнина, некогда кипевшая земледельцами, теперь была безлюдна, и серые поля были усеяны разлагающимися трупами солдат и брошенным оружием. Те из местных жителей, кто не успел спастись до резни, скорее всего, разделили судьбу павших воинов, и единственным следом от них остались фундаменты сгоревших домов.\n\nСолнце уже садилось, когда к окраинам поля боя подошла небольшая группа грифонов. Большинство из них были ранены и покрыты грязью, они выглядели жалко для гордых рыцарей ордена Зильберкралле. Они были в бегах большую часть дня. Хотя, как надеялись, преследователи уже отстали от них, им пришлось двигаться дальше, поскольку здесь всё ещё было небезопасно оставаться. По опустевшим полям бродили едва заметные фигуры грифонов. Возможно, это были всего лишь мародёры или отчаявшиеся выжившие, но могли быть и гораздо хуже – нежить, созданная магией тёмных пони. Рыцари не могли рисковать и столкнуться с другими этими созданиями в их плачевном состоянии.\n\nГрандмастер Гектор на мгновение остановился. У них не было времени похоронить хотя бы часть тех, кого они сегодня потеряли, поэтому всё, что он мог сделать, – это помолиться об их мирном упокоении. Минута молчаливой молитвы всегда помогала рыцарям собраться с духом в тёмные времена. Скоро им придётся выдвинуться – на юг, к лесам, где они найдут убежище, чтобы перегруппироваться и подготовиться к предстоящему."
 ntribes.32.a:0 "Ещё не всё потеряно."
 ntribes.33.t:0 "Долгий марш на Север"
 ntribes.33.d:0 "Пройти через Герцланд было для грифонов проще всего – захватчики в основном были заняты уничтожением остатков местного ополчения и разграблением крупных городов, поэтому избежать отрядов пони было легко, двигаясь по сельской местности. Самую большую угрозу представляли бродячие группы нежити, над которыми пони либо потеряли контроль, либо те, которые восстали из-за тёмной магии, оставшейся после заклинаний чёрных пони-магов. Тем не менее, отряд Эрика Гримкло быстро пересёк Герцланд и теперь входил в Клаудбьюри, где всё стало гораздо сложнее. Пони успели укрепить свою власть здесь, и местные жители познали цену неповиновения. Первой ошибкой Эрика стала остановка в небольшой деревне с целью отдыха и пополнения запасов провианта. Хотя местные жители были бедны, они казались гостеприимными и щедрыми... Но они тут же послали гонца в ближайший гарнизон пони, и рыцарей обнаружили. Если бы не осторожность Эрика, из-за которой он выставил часовых, их бы всех перебили. Тем не менее, последовавшая за этим схватка с пони стоила жизни половине воспитанников Аргентумдаммерунга, последовавших за ним на север.\n\nПо улицам, между горящими домами, рыцари тащили старейшину деревни к своему предводителю. Рыдая, он молил о пощаде, объяснял Эрику, что у него не было выбора. Он сказал, что если бы пони когда-нибудь узнали, что он помог рыцарям, то убили бы его на месте, а всех селян отправили бы в шахты на верную гибель. Но в награду за то, что он выдал рыцарей, им обещали понизить оброк, и у них было бы больше еды, чтобы пережить зиму. Что-то надломилось в Эрике, пока он выслушивал эти жалкие оправдания. Он обнажил меч и одним движением обезглавил предателя.\n\n— Они не заслуживают пощады. Убейте их всех и заберите их еду, — приказал он своим грифонам. — И поторопитесь. Нам нужно напасть на гарнизон сегодня, если мы не хотим оставить улик."
 ntribes.33.a:0 "Небольшая цена за спасение."
 ntribes.35.t:0 "Богопротивный Эдикт"
 ntribes.35.d:0 "Герхард никогда не отличался храбростью. Когда появились пони, он сбежал из храма, оставив старого священника Генриха – старый дурак отказывался покидать храм, где десятилетиями читал проповеди. Герхарду оставалось лишь надеяться на быструю смерть своего наставника и на то, что он обретёт покой в золотых садах Борея. Теперь он прятался в кустах в нескольких сотнях метров от храма, со слезами на глазах наблюдая, как северные варвары сжигают его. Они уже забрали всё, что казалось ценным, и некоторые из них спорили о том, как поделить добычу. Между двумя пылкими юнцами завязалась небольшая драка из-за особенно богато украшенного кодекса. Спор прервал их начальник, буквально разрезавший книгу пополам. Пони поспешно подобрали две получившиеся книжечки и спрятали их в сумки. Через час-другой отряд двинулся дальше на юг, оставив горящий храм позади. У Герхарда ушёл ещё час на то, чтобы собраться с духом и покинуть своё убежище. Он вернулся в место, которое так долго называл домом, чтобы подобрать остатки священных книг и символов, затерявшихся в грязи и пепле...\n\nПо всем завоеванным землям грифонов вступал в силу новый указ: все формы поклонения богам грифонов были запрещены, и единственным богом, которому грифоны могли поклоняться, был Морозный Король – тот, кто покарал их за зло и слабость, и тот, кто теперь будет править ими вечно. В качестве демонстрации превосходства над поверженными грифонами, воины-пони начали осквернять храмы Троицы и сжигать их. Как когда-то пони убили своих слабых божеств — Северных духов, так теперь они поступали и с грифонами.\n\nПодобные акты святотатства встретили практически немедленный ответ: по всей стране грифоны восставали на защиту своих мест поклонения, а жрецы по всему Герцланду призывали к священному походу."
 ntribes.35.a:0 "Истина та вера, что гонима..."
 ntribes.36.t:0 "Миссия"
 ntribes.36.d:0 "Хотя они в основном передвигались по ночам и старались избегать поселений, потери продолжали расти. Редкие стычки с воинами-пони и суровая погода сказывались на рыцарях, не готовых к жестокости северных земель. Но они продолжали идти. В тот день сильный ветер не позволил им лететь, и им пришлось идти через холодный болотистый лес. Все оставшиеся рыцари были измотаны и ослаблены неделями трудного пути. Наконец, последний в строю, который сильно отставал последнее время, после серьёзного ранения в бою, рухнул на землю. Группа остановилась, но Эрик, быстро осмотрев павшего брата, скомандовал: "Заберите его припасы и оставьте его. Мы не можем задерживаться."\n\n— Но, Магистр..., — возразил один из рыцарей.\n\n— Никаких "но." Наша миссия важнее жизни любого из нас. Мы должны войти в сердце тьмы и сразить врага, чтобы спасти наш вид, — провозгласил Гримкло.\n\n— По крайней мере, мы должны оставить ему немного еды. Он ещё может нас догнать! — Эрик надвинулся на инакомыслящего, крича — Разве ты не видишь, что он уже мёртв? Ему больше не нужна еда. \n\nИзмученные рыцари молча забрали всё необходимое у своего павшего товарища и предоставили его своей судьбе. Долгие часы после этого никто не произнес ни слова..."
 ntribes.36.a:0 "Победа требует жертв..."
 ntribes.34.t:0 "Имперский город"
 ntribes.34.d:0 "Грифенхейм, столица Империи Грифонов, часто называется самым желанным городом в Грифонии. Битва за город была кровавой и долгой. И когда воины-пони наконец одержали победу, Морозный Король приказал им уничтожить все грандиозные символы Империи в городе. И вот северная орда разграбила Императорский дворец – а вскоре за ним последовали и другие достопримечательности. Дворянские особняки были разграблены, храмы сравнены с землей, а памятники взорваны. Однако, когда пони напали на Великий Храм Борея, население города, которое, как они думали, было побеждено и покорено, восстало. Сотни тысяч грифонов взялись за оружие и дали отпор – и вскоре весь город погрузился в полную анархию. Пожары, поджигаемые пони, вышли из-под контроля, поглощая целые районы, и некому было их тушить. Возможно, впервые и революционеры, и лоялисты Империи сражались плечом к плечу с чужеземцами, стремившимися уничтожить сердце Грифонии. После трёх дней жестоких столкновений с ополченцами грифонов, воины-пони в основном отступили из разрушенного города, оставив его мятежникам. Тем не менее, вожди заверяют нас, что вскоре мы сможем вернуть Грифенхейм и наказать грифонов за их дерзкое сопротивление."
 ntribes.34.a:0 "Подготовить контратаку!"
 ntribes.37.t:0 "Шайсвальдский Пакт"
 ntribes.37.d:0 "Лес Шайсвальд всегда служил убежищем для всех бандитов, мятежников и революционеров Южного Герцланда, и не без причины: это кишащее монстрами место отражало любые попытки его укротить, а тех, кто был достаточно смел и отчаян, чтобы обосноваться в нём, делал ещё более закалёнными в боях. И вот история повторилась: Герцланд был захвачен иноземными захватчиками, и все способные сопротивляться грифоны устремились в Шайсвальд, ища не постоянного места жительства, а плацдарма для восстания.\n\nНебольшая хижина в дремучем лесу – некогда убежище бандитов – была заполнена предводителями грифонов. Бывшая имперская знать, командиры повстанцев Блюма, несколько священников и главы побеждённых рыцарских орденов... Гектору Андерссону потребовались немалые усилия, чтобы собрать их всех здесь и предотвратить внутренние распри. Даже перед лицом общей угрозы большинство держалось своими группами, с подозрением поглядывая на остальных.\n\n— Братья и сёстры... друзья, — Гектор открыл собрание. — Я благодарен всем, кто согласился приехать сюда и забыть о своих разногласиях...\n\n— Давайте не будем так спешить! — перебил его грифон в форме капитана Рейхсармии.\n\nТолпа загудела, но Гектор продолжил: "В эти трудные времена мы должны сотрудничать..."\n\n— Ага, эти лоялисты ведь такие сговорчивые!, — усмехнулся грифон в красной бандане.\n\n— Сотрудничество с вами было бы изменой! — крикнул ему другой бывший имперский офицер.\n\nГектор прервал назревающий спор громким ударом бронированным кулаком по ближайшему столу.\n\n— Всем замолчать! Вот почему, — он поднял коготь и продолжил, — мы здесь, и наши дома горят. Мы, воины, продолжаем спорить друг с другом, пока пони-дикари грабят наши города и убивают мирных жителей. Да, раньше мы были врагами, но теперь мы должны объединиться. Если мы продолжим сражаться друг с другом, скоро нам не из-за чего будет сражаться. Вы видели, что творит этот Морозный Король и его чудовища. Армии нежити, тёмная магия... Вы слышали рассказы беженцев о рабстве, угнетении и геноциде на Севере. Когда мы бежали, оставив Грифенхейм позади, его жители восстали на защиту своего города. Они не спорили о политике, они сражались и выбили захватчиков. Если мы продолжим бездействовать, пони вернутся и добьют их. Грифенхейм падет навсегда. И Царство Террора продолжится. Порознь мы умрём, вместе – победим. Нас мало, но силы нашего врага расстянуты и потому он уязвим. Сейчас наш последний шанс нанести удар. Только вместе мы сможем освободить Герцланд!\n\nДолгое молчание повисло в толпе, когда Гектор замолчал. Наконец, один из имперских офицеров громко провозгласил:\n\n— Арденссон, я и мои грифоны с вами. За Герцланд! — Его клятву верности вскоре поддержали другие – как лоялисты, так и мятежники."
 ntribes.37.a:0 ""За свободу! За Грифонию!""
 ntribes.38.t:0 "Южное восстание"
 ntribes.38.d:0 "Наш контроль над Центральными землями был... в лучшем случае шатким. Однако теперь по всему Югу многочисленные повстанческие группы объединились и подняли восстание против нас. Караваны с припасами и отряды добровольцев со всей Грифонии пересекают наши границы, а мятежники врываются в скрытые склады оружия Рейхсармии, которую нам не удалось полностью разгромить. Всё это делает контрнаступление на Грифенхейм невозможным, поскольку нам необходимо реорганизовать наши силы и подготовиться к отражению восстания, которое представляет собой гораздо большую угрозу, чем голодающие и плохо вооружённые жители Грифенхейма."
 ntribes.38.a:0 "Отступить и перегруппироваться!"
 ntribes.39.t:0 "Отступник"
 ntribes.39.d:0 "На этот раз отряд Гримкло нашел убежище в небольшой, полуразрушенной хижине – вероятно, охотничьей, заброшенной много лет назад по неизвестным грифонам причинам – хотя они и не стремились это выяснить. Осталось всего полдюжины рыцарей Аргентумдаммерунга, и они уже ничем не напоминали гордых воинов-грифонов. Раненые, грязные, больные и истощенные, они выглядели как закованные в железо бродяги. И все же они продолжали упорно идти к "Престолу Тьмы" в Эверфросте. Эрик, однако, чувствовал, что его спутники давно потеряли веру в успех своей миссии – и в его лидерство. Они были ужасно молчаливы в его присутствии, они, казалось, избегали его.\n\nСолнце садилось – пора было выдвигаться.\n\n— Мы должны продолжить путь. Мы близко, — сказал Эрик и поднялся с пола. Никто из спутников не последовал за ним. После короткой паузы один из них тихо произнёс:\n\n— Ты повторяешь это каждый день. Каждый день: "Мы близко." И что?! Эверфроста нигде не видно, а нас всё меньше и меньше! Нам следовало остаться в Катерине, Эрик, и сражаться за своих грифонов, а не отправляться на эти безумные поиски.\n\n— Это никому не поможет. Нам нужно ударить по источнику зла. Убийство этого самопровозглашённого бога положит конец войне. А теперь двигайся, нет времени на бессмысленные разговоры, — приказал Эрик.\n\n— К Маару тебя! — ответил рыцарь, выйдя из себя. — Я возвращаюсь домой. Твоё безумие погубило достаточно хороших грифонов, и я не собираюсь стать следующей жертвой! — и направился к выходу.\n\n— Я не потерплю измены! — прикрикнул Гримкло и обнажил меч. — Вы все присягнули мне на верность; вы должны подчиняться моим приказам! — В ответ рыцарь выхватил оружие и повернулся к своему магистру.\n\n— Я отвергаю твою власть, Эрик, ты уничтожил Аргентумдаммерунг – и всё, во что мы верили. Ты приказал нам убивать невинных сельчан, отбирать их еду, бросать наших измождённых братьев. Ты не достоин быть нашим лидером!\n\nС диким криком Эрик бросился в атаку. Разъярённый грифон был быстр – слишком быстр, чтобы ослабевший рыцарь успел парировать. Хотя первого удара было достаточно, чтобы убить цель, он продолжал кромсать безжизненное тело. И когда Эрик наконец пришёл в себя, то понял, что теперь он один – все остальные разбежались во время боя."
 ntribes.39.a:0 "Только я способен завершить дело..."
 ntribes.40.t:0 "Огонь разгорается"
 ntribes.40.d:0 "По всему Герцланду к восстанию присоединяются повстанцы-грифоны. Наши силы, слишком разрозненные и занятые попытками подчинить себе местных жителей, разрушая их веру и гордость, оказались неспособны усмирить мятежников и были отброшены из Южного Герцланда. Ещё одно крупное восстание произошло в Ромау, тысячи грифонов присоединились к освободительным армиям, и нам пришлось отступить дальше на север. Хуже того, наша магия, похоже, ослабла, поскольку повстанцы часто оказываются невосприимчивы к ней, сражаясь с нашими воинами-нежитью с поистине неестественной энергией, словно сама Троица решила поддержать своих верных грифонов."
 ntribes.40.a:0 "Всё слишком быстро выходит из-под контроля!"
 ntribes.41.t:0 "Сердце"
 ntribes.41.d:0 "Никто не мог ожидать, что хоть один грифон зайдёт так далеко на север, как Эрик Гримкло, шагающий теперь по пустым улицам Эверфроста. Для города, нетронутого войной, здесь было ужасно тихо, словно все его обитатели ушли вместе с армиями Морозного Короля.\n\nСтражи Королевского Дворца не обращали на него внимания. Вероятность того, что враг доберётся до Эверфроста, была поистине ничтожной – и даже в этом случае, как простой смертный мог убить бога? Эрик быстро взобрался на стены замка, перепрыгнул на другую сторону и спланировал на балкон самого дворца. Внутреннее пространство огромного сооружения, некогда украшенного витиеватыми рельефами и картинами, изображающими историю северных пони, теперь было покрыто сплошным льдом, часто образующим причудливые... неестественные фигуры. Внутри никого не было, и Эрик бродил по коридорам, слыша лишь звук своих шагов. Он был здесь впервые, но каким-то образом знал, куда ему идти.\n\nМорозный Король занимал старый Зал Собраний, теперь превращённый в его тронный зал. Мёртвые стражники расступились, когда Эрик вошёл в зал, пропуская его. Сам Морозный Король восседал на изящном ледяном троне – пожилой пони, такой хрупкий по сравнению с этим грандиозным залом – но Эрик чувствовал исходящую от него огромную силу.\n\n— Добро пожаловать, Эрик Гримкло, Магистр павшего ордена. Я ждал тебя, — тепло сказал пони.\n\n— Ждал? Ты знал, что я приду?\n\n— Да, конечно знал. Здесь, в моих владениях, мало что ускользает от моего взгляда. Должен сказать, я... впечатлён. Ты превзошёл все мои ожидания. — Морозный Король слегка улыбнулся. — Грифоны – такие жалкие существа, такие слабые, почти никчёмные... Но ты превзошёл пределы своей расы. \n\n— Жалкие? Слабые? — недоверчиво спросил Эрик, а затем воскликнул — Но вот я стою перед тобой, чтобы уничтожить тебя и освободить грифонов от тирании.\n\n— Ты можешь попробовать. Но сначала ответь на этот вопрос: достойны ли грифоны освобождения? Твои товарищи, трусы и слабаки, подвели тебя. А их считали лучшими из лучших. У них была миссия, цель. И всё же они бросили тебя. Раз за разом, век за веком, грифоны сражались друг с другом ни за что. Я взял несколько северных пони, тех, над кем ты смеялся, – и под моим командованием они завоевали Город Императоров. Они доказали свою силу и теперь правят от моего имени. Слабые не заслуживают ни пощады, ни свободы – они существуют лишь для того, чтобы ими правили. Я считаю тебя сильным. Присоединяйся ко мне, и ты возвысишься над своими никчёмными сородичами и станешь одним из моих воинов. Присоединяйся ко мне и стань одним из новых правителей Грифоньего рода.\n\nЭрик Гримкло обнажил меч..."
 ntribes.41.a:0 "...и положил его перед троном."
 ntribes.42.t:0 "Отступление продолжается"
 ntribes.42.d:0 "После падения Ромау грифоны объединились с повстанцами в Грифенхейме и двинулись дальше на север, отвоевав большую часть Фетизии, Клубники и Бронзхилла. К счастью, их упорное наступление ослабевает, и нам в основном удалось сдержать восстание в северной части Герцланда, куда вскоре должны прибыть наши отступающие войска. Нам нужно подготовиться к неизбежному формированию линии фронта и спланировать контрнаступление."
 ntribes.42.a:0 "Они все должны умереть!"
 ntribes.43.t:0 "Герцландское Восстание"
 ntribes.43.d:0 "Даже слуги-пони Морозного Короля боятся его гнева. Многие из них были наказаны за свою некомпетентность, и теперь армии Тирании собираются в Северном Герцланде, готовясь вновь сразиться за своего господина с грифонами. Страх наказания, лютая, почти навязанная ненависть к грифонам, жажда добычи... Многое побуждает армию пони двигаться вперёд, в то время как нежить движима исключительно волей своего господина. \n\nТем временем выжившие грифоны восстают, готовые к решающему бою. Если они проиграют, то навсегда станут рабами зимы, угнетёнными и раздавленными. Священники благословляют отряды добровольцев, идущие на фронт, и, в редком проявлении единства, кажется, что вся Грифония впервые поддерживает – пусть даже скорее на словах – борьбу герцландцев за свободу."
 ntribes.43.a:0 "За Морозного Короля!"
 ntribes.43.b:0 "За свободу грифоньего рода!"
 ntribes.63.t:0 "Последний рубеж"
 ntribes.63.d:0 "Казалось, весь Герцланд пропах дымом и разлагающимися телами. Повстанцы желали лишь победить, либо пасть в отчаянной схватке. Так они и сделали – город за городом, деревня за деревней, пони продвигались на юг, оставляя за собой разрушения и горы трупов. Конец сопротивления был лишь вопросом времени, и грифоны окончательно пали под копытами северных захватчиков.\n\nЭрик смутно помнил это место, небольшой городок в Катерине. Должно быть, он бывал здесь раньше – хотя сейчас это не имело значения. Это было ещё одно место, которое нужно было усмирить, прежде чем его новые подчинённые – сборище нежити, воинов-пони и нескольких, отобранных им, грифонов-ренегатов – двинутся вперёд. Задача казалась простой: застрельщики, прибывшие несколькими часами ранее, похоже, уже расправились с защитниками, поскольку отряд беспрепятственно продвигался вперёд. Однако... было слишком тихо, и солдат нигде не было видно. Трупов, на удивление, было немного, словно местные жители успели сбежать. Или это засада? По мере того, как группа продвигалась вглубь города, были обнаружены ещё несколько мёртвых грифонов и пони, но, если не считать птиц-падальщиков, место было безлюдным. Наконец, они добрались до городской площади. Площадь была усеяна трупами: и грифонов, и пони. Среди трупов, облачённых в позолоченные доспехи, лежал последний выживший – старый раненый рыцарь-грифон, прислонившийся к стене, под которым медленно растекалась лужа крови. Увидев приближающуюся группу, он крикнул: "Гримкло! Я надеялся, что ты умрёшь, надеялся, что эти слухи о том, что ты командуешь нежитью, — клевета. Скажи мне... Почему? Почему ты предал своих братьев, своих богов и своих сородичей? Я всегда знал, что ты властолюбивый ублюдок, но никогда не думал, что ты опустишься так низко."\n\n— Грифоны заслуживают того, чтобы их сокрушили, Гектор, заслуживают наказание за слабость. — Эрик встал на задние лапы. — Мы все просто обманывали себя, думая, что нас ждёт лучшее будущее, что для нас есть какой-то божественный план. Даже если он и был, он провалился. Этот цикл бесконечен, одно и то же: грифоны режут грифонов – и ничего не выходит. Новые глупцы приходят к власти в бесконечной борьбе за объедки. Трусы, глупцы и предатели. Вот кто вы!\n\n— Ты сошёл с ума. Я не знаю, что с тобой случилось, но ты – лишь жалкая оболочка самого себя. Ты – глупец, обманывающий себя в том, что дух грифонов можно сокрушить. Ты – трус, вставший на сторону чудовищ. Ты – предатель вида.\n\n— Этот разговор меня утомляет. — Прорычал Эрик. — Скажи мне, где остальные мятежники, и не пытайся меня задержать!\n\n— Их нет. Я последний... А, ты имеешь в виду гражданских? Они давно ушли. Мы должны были лишь отвлечь твоих мясников, чтобы они могли эвакуироваться. Ты не вкусишь больше крове сегодня, маньяк. — Эрик поднял коготь, подавая знак своим телохранителям, и они взяли Гектора на мушку.\n\n— И что теперь? Ты прикажешь меня застрелить? — издевался над ним Арденнсон. — Великий воин смерти боится сразиться с раненым, старым грифоном?\n\nЭрик вышел из себя. Даже не пытаясь сдержать гнев, он бросился вперёд с криком. То, что произошло дальше, было не дракой — это была унизительная казнь. Гектор едва успел поднять меч, когда Гримкло обезглавил его одним ударом. Несколько секунд он стоял над безголовым телом, тяжело дыша. Когда он обернулся, его товарищи — те, кто был жив — вздрогнули, увидев его искажённое лицо."
 ntribes.63.a:0 ""Сожгите здесь всё дотла!""
 ntribes.64.t:0 "Судьба Скайфола"
 ntribes.64.d:0 "Город Скайфол наконец-то наш. Этот великий мегаполис грифонов, обитель гордыни и жадности, теперь унижен нашими воинами. Его богатства будут разграблены, а жители обращены в рабство. Однако остаётся один вопрос: как лучше всего использовать Скайфол? Очевидным выбором было бы сосредоточиться на его знаменитых верфях, что позволило бы нам быстро построить могучую армаду. В качестве альтернативы мы могли бы отправить недавно приобретённых рабов на фабрики, чтобы обеспечить нас огромным количеством оружия. Есть и третий вариант: заставить грифонов-техников производить промышленные товары и разрабатывать новые инструменты и оружие."
 ntribes.64.a:0 "Сфокусируемся на верфях."
 ntribes.64.b:0 "Нужно больше пушек!"
 ntribes.64.c:0 "Изучать и разрабатывать!"
 ntribes.65.t:0 "Очищение Аквелии"
 ntribes.65.d:0 "Последние несколько месяцев были настоящим кровавым кошмаром. С тех пор, как сюда пришли северные дикари, поддерживаемые нежитью и тёмной магией, Аквелия превратилась в одно гигантское кладбище. Города были разграблены, деревни жгли при малейшем сопротивлении, храмы сравнивали с землёй. Но худшее было ещё впереди. Хотя особенно ярые воины всегда охотились на местных пони, недавно словно появился новый приказ: "Убить их всех." Все пони в Аквелии должны быть убиты, ни один не должен остаться в живых.\n\nСильвертейлу повезло, что он сбежал за несколько часов до нового вторжения северян в его город. В первый раз они разграбили его магазин и избили до потери сознания. А теперь даже из своего убежища в ближайшем лесу он слышал крики расправы над своими соотечественниками. Всё, что ему оставалось, – это бежать. Он путешествовал в основном по ночам, надеясь не попасться.\n\nОднако, после нескольких дней страха и голода, он наконец потерял бдительность и угодил прямо в ловушку. Три грифона в масках и с оружием, хорошо спрятавшись среди деревьев, набросились на него из засады. Сильвертейл слышал о предателях-грифонах, которые помогали захватчикам. Смирившийся со смертью и слишком слабый чтобы сопротивляться, пони просто стоял, ожидая выстрела... которого так и не последовало.\n\n— Он не похож на их заблудившегося разведчика, — сказал один из грифонов, который, как заметил Сильвертейл, носил обрывки аквелийской военной формы. — Нам повезло, что мы тебя не послушали, — отругал он другого партизана, — и не подстрелили его. Что дальше, Гийом? Корову за танк примешь? Он безоружен, без брони и костяных украшений, как у тех маньяков.\n\n— У меня есть вопрос получше: что мы с ним будем делать? — ответил Гийом. — Мы не можем просто так его здесь бросить — охотники его обязательно поймают. А ближайший пункт эвакуации беженцев далеко.\n\n— Верно, это смертный приговор. Эй, ты, не стой как истукан. Ты идёшь с нами!\n\n— Но... куда? — Сильвертейл наконец смог пробормотать несколько слов — Они повсюду... Они убьют меня, убьют вас... Бежать некуда...\n\n— Хех, если ты так и будешь рыдать, то, возможно, это и сбудется. Пошли. Дорога длинная, но мы вытащим тебя отсюда. На побережье есть контрабандисты, которые помогают таким, как ты, перебраться за море. Это займёт несколько недель, но мы обязательно доберёмся. Ты не первый пони, которого нам удалось спасти."
 ntribes.65.a:0 ""А теперь пошли!""
 ntribes.66.t:0 "Аквелийские беженцы"
 ntribes.66.d:0 "Мы получаем ужасные новости из Аквелии. Судя по всему, после завоевания региона, армии Морозного Короля начали жестокий (даже по их собственным меркам) геноцид местного населения пони, утверждая, что их "заразили грифоны". Все пони в Аквелии должны быть убиты на месте. Пока армия Тирании продолжает свою чистку, тысячи выживших прибывают в Новый Мейрленд, в основном благодаря помощи контрабандистов-грифонов. Наш долг — помочь этим бедным пони, и мы не можем игнорировать их судьбу. Пока мы не подвергаемся прямому нападению северян, нам определённо следует начать готовиться к вторжению, которое, похоже, приближается с каждым днём всё ближе."
 ntribes.66.a:0 "Метель близко..."
 ntribes.67.t:0 "Могила Грифоньего Рода"
 ntribes.67.d:0 "Святой Грифонстоун, Первый Город, Колыбель Грифоньего Рода – место, известное под множеством лестных имён. Поначалу казалось, что северная орда пощадила этот почтенный город. Армии Морозного Короля остановились, и, за исключением нескольких магических бомбардировок, призванных уничтожить очаги скопления грифонов-солдат, пони, похоже, довольствовались тем, что окружили и изолировали Грифонстоун. Хотя многие грифоны бежали в горы, город всё ещё был полон как местных жителей, так и многочисленных беженцев, надеявшихся на то, что боги защитят колыбель их вида от захватчиков.\n\nЭрик Гримкло наблюдал за разворачивающимся "зрелищем" с одной из передовых позиций. Он был отправлен сюда по приказу Морозного Короля, чтобы "контролировать" разрушение города, хотя, когда он прибыл, большая часть подготовки уже была сделана присутствовавшими на месте слугами. И вот оно началось. Артиллерийские батареи начали стрелять зажигательными снарядами в унисон с сотнями магов, что высвобождали всю доступную им силу. Вспышки магического пламени последовали за более привычными тяжёлыми снарядами к основанию древнего дерева. Город был охвачен огнём и быстро превратился в гигантский факел. Даже издалека Эрик видел сотни грифонов, переживших первоначальную бомбардировку и пытавшихся спастись бегством из обречённого города, но сбитых волнами заклинаний. И всё же, несмотря на апокалиптическую мощь артиллерии и северного колдовства, дерево продолжало стоять в последнем акте неповиновения. Словно в безумии, возможно, чувствуя гнев своего господина, маги напрягали все силы, какие только могли. Но что-то было не так... Даже Эрик чувствовал это – что-то приближалось, он почти ощущал вибрацию воздуха. Внезапно, с громким треском, дерево сломалось пополам, его верхняя часть рухнула в Великую Бездну внизу. Спустя мгновение земля затряслась, и все северные маги закричали в ужасе. Сила, которую они использовали, теперь обернулась против них: беспрецедентный магический катаклизм в виде волны пламени в сочетании с землетрясением обрушился на колдунов, поглотив через несколько мгновений весь северный лагерь. Эрик выжил лишь благодаря своему удаленному расположению от остальной армии. Но даже он мог лишь съежиться от ужаса, надеясь, что бедствие закончится... И в глубине души надеясь, что оно убьет и его... Спустя несколько ужасных минут всё внезапно закончилось. Остались лишь жалкие остатки некогда могущественной армии и горящие руины Грифонстоуна.\n\nЭрик просто стоял молча, глядя, как дерево продолжает гореть. Он хотел почувствовать что-нибудь. Хотя бы что-то..."
 ntribes.67.a:0 "...но в его сердце уже ничего не осталось."
 ntribes.68.t:0 "Забвение"
 ntribes.68.d:0 "Это свершилось. Грифоны были повержены. От Эверфроста до Карфина всем правит Морозный Король. Все грифоны, пытавшиеся противостоять ему, были раздавлены один за другим. Его огромные армии продолжали угнетать население и грабить города. И вот Эрик Гримкло оказался в Грифусских горах – одном из последних оплотов грифонов, который удалось покорить. Годами он просто переходил от одной битвы к другой, не имея ничего в своей "жизни", кроме этого бесконечного кровопролития и надежды всё забыть... или, может быть, надежды наконец-то быть убитым в бою? Так он и жил, жалкий, жаждущий смерти. Похоже, Морозный Король давно потерял интерес к своему слуге – и поэтому он остался наедине с горсткой рыцарей-отступников, которым, как и ему, некуда было идти. Всё было кончено. Грифоны были повержены, и их будущее – в подчинении безумному Богу Севера. И Эрик в этом участвовал, возглавляя армии Морозного Короля. А теперь он оказался брошенным в дальних уголках Грифонии. Воистину, это было самое подходящее наказание за его гордыню. Быть забытым, брошенным, словно сломанный инструмент.\n\nВсё, что Эрик делал в эти дни, – просто смотрел в далёкий горизонт и вспоминал прошлое. У него ничего другого не оставалось, он был грифоном, не заслуживающим будущего и не имевшим его. Он мало чем отличался от нежити, которой когда-то командовал – ничего не чувствовал, просто выполнял приказы своего тёмного повелителя... А теперь приказы перестали поступать.\n\nЭтот день ничем не отличался от других. Его оставшиеся подчинённые привыкли к "рутине" своего командира, занимаясь вымогательством еды у местных жителей, используя свою власть по праву марионеток северного тирана. Лишь когда Гримкло не возвратился в лагерь поздно вечером, несколько из них приходили проверить прибрежный утёс, где он проводил большую часть дня. Всё, что они нашли, – это его меч, брошенный в траве неподалёку. Гримкло нигде не было видно, и, честно говоря, никого это не волновало. Хотя в последующие годы некоторые сообщали о том, что они видели белого грифона в лохмотьях, бродящего по близлежащим горам и лесам. Его существование со временем было полностью забыто: его жизнь, ранние достижения и последующее предательство затерялись во времени..."
 ntribes.68.a:0 "...будто их никогда и не было" #Достойная участь для этого говнюка
 ntribes.101.t:0 "Зимние Ветра"
 ntribes.101.d:0 "Все они пали, ни один из врагов Морозного Короля не смог долго противостоять его власти. Не было никаких сомнений, что это единственный исход. Все армии грифоньего рода были разгромлены, храмы их богов и дворцы их правителей лежали в руинах. Грифоны были обращены в рабство, а пони правили своими землями без сопротивления. Это был его окончательный триумф. Остальной мир дрожал от ужаса и нашёл утешение лишь в надежде, что он никогда не придёт за ними. Возможно, когда-нибудь он это сделает, но сейчас он просто наслаждался их страхом. Месть ещё далека от свершения – она никогда не будет по-настоящему свершена – ведь он мог продолжать мучить грифонов вечно. Правление Морозного Короля продлится до конца времён, пока солнце не померкнет, и от этого мира не останется ничего, кроме льда и тьмы.\n\nИ всё же, время от времени, слушая донесения своих приспешников и военачальников, Морозный Король испытывал раздражение. Казалось, грифоны просто не хотели сдаваться. Время от времени вспыхивали очередные восстания, поднималась очередная группа глупцов в тщетной попытке противостоять ему. И каждый раз он посылал своих слуг подавить их – и каждый раз им это удавалось, как и прежде. И всё же, спустя какое-то время, цикл начинался заново. Что ж, по крайней мере, это не давало его слугам полностью расслабиться. Но где-то в глубине души Морозного Короля зарождалось новое чувство – то, которого он не испытывал до сих пор..."
 ntribes.101.a:0 "Страх."
 ntribes.102.t:0 "Мечты о Весне"
 ntribes.102.d:0 "Они встречались тайно – не более нескольких грифонов – чтобы избежать подозрений и уничтожения всей подпольной сети. Хотя власть захватчиков в последнее время ослабла, они всё ещё представляли серьёзную опасность. И по мере того, как их власть угасала, пони и нежить-прислужники становились всё более жестокими. Место встречи повстанцев представляло собой всего лишь старый подвал под разрушенным районом города, но с годами они превратили его в один из своих многочисленных бункеров, храня оружие, выкапывая туннели для запасных выходов и расставляя ловушки. Местные жители представляли собой в основном отвратительную компанию отчаянных бандитов и беглых, полубезумных рабов. И всё же даже эти жалкие пародии на грифонов всё ещё питали уважение к тем, кто сражался с Тираном – однако никогда нельзя было предугадать, когда они попытаются украсть собранное оружие. Поэтому ловушки были разумной идеей, защищавшей повстанцев не от врага, а от самих себя.\n\nЗдесь, в главном бункере, они встречались, чтобы спланировать действия своих ячеек. Прошло некоторое время, прежде чем разрозненные группы партизан начали сотрудничать, но теперь, когда они наконец объединились, к ним прибывал постоянный приток новых членов. Прошло немало времени, прежде чем они смогли напрямую вступить в бой с захватчиками, каждый день они уничтожали отставших воинов Тирании и дальние аванпосты, преследовали рабовладельцев и освобождали трудовые лагеря. Каждый день они продолжали сражаться – некоторые из них не останавливались со времён Последней Войны. Независимо от их прежних убеждений, у них была одна цель – освобождение. Ветераны старых войн: бывшие солдаты Рейхсармии, идейные республиканцы и грифоны, сражавшиеся за всевозможные армии и правительства, о которых все, кроме них, уже забыли, продолжали вести партизанскую войну и обучать новые поколения тех, кто уже родился под гнётом Бесконечной зимы. Они рассказывали им о славных днях прошлого, о рыцарях в железных доспехах, доблестных защитниках рода грифонов, о богатстве и величии павшей Империи, о мечтах о равной, единой Грифонии, о богах, которые, несомненно, всё ещё оберегают своих детей. Они сражались. И хотя победа казалась далёкой, они продолжали мечтать..."
 ntribes.102.a:0 "...о Весне."
 ntribes.103.t:0 "Оттепель"
 ntribes.103.d:0 "Старый грифон тяжело дышал, поднимаясь на холм. Его крылья, сломанные давным-давно, так и не срослись как следует, не давая ему превратить этот трудный путь в короткий полёт. Каждый шаг он проклинал саму мысль о том, чтобы прийти сюда. Ему следовало бы сидеть на скамейке перед домом и купаться в лучах солнца, наслаждаясь последним днём весны, а не отправляться в такие приключения, недостойные такого почтенного дедушки. Его внуки давно уже прорвались вперёд, гоняясь друг за другом по вершине холма – как это обычно делают птенцы. Детской энергией взрослые учатся восхищаться только тогда, когда дыхание становится учащённым, а незнакомые части тела начинают болеть по утрам. Тем не менее, пройдя ещё несколько шагов, старый грифон достиг вершины холма и тяжело опустился на землю. Зрелище действительно стоило долгого подъёма. Озеро Румейр в это время года было прекрасным: голубая, чистая вода отражала небольшие фермы и виноградники вдоль берегов, разделённые лесными массивами – поистине захватывающее зрелище. А вдали он видел шпиль разрушенной Башни – одной из многих, некогда господствовавших над землями Грифонии. Теперь, сломанные много лет назад, остатки её шпиля лежали вокруг разрушенного мегалитического сооружения, которое больше напоминало небольшой остров. Каждый раз, глядя на него, он испытывал смесь страха из-за давно прошедших дней и гордости за то, что Башня была в конце концов разрушена. Они пробивались к ней с боем, сражаясь со всё более обезумевшими пони-воинами и такими зверями, которых даже сам Маар не мог создать. И всё же они продвигались вперёд, зная, что победа близка. День, когда эта крепость наконец поддалась артиллерийскому обстрелу, несмотря на то, что пони-колдуны метали заклинания в атакующих изнутри, тот момент, когда Башня рухнула... Это было незабываемо...\n\n— Дедушкааааа! Она забрала тот сверкающий камень, который я нашёл! — Младший из внуков тянул его за лилию на манжете старого пальто, почти крича ему в ухо — Я нашёл этот камень, а она его забрала!\n\n— Эм, что? — он был совершенно растерян, так внезапно вырванный из своих воспоминаний. — Камень? Неужели нельзя найти новый? Вокруг полно хороших!\n\n— Не-е-ет! Этот был мой! — Птенец устремился к сестре, которая бросилась бежать, торжествующе держа в лапах предмет спора.\n\n— Вернитесь, маленькие негодники! — Дедушка поднялся с земли и побежал за грифятами, надеясь их поймать. Если родители не могли заставить их вести себя хорошо, то он должен был научить птенцов не ссориться из-за каждой мелочи...\n\nПозади него солнце медленно садилось за разрушенную Башню. На мгновение, вода озера Румейр в красном свете заходящего солнца стала похожа на кровь, но затем снова приобрела свой обычный голубой цвет. Где-то в траве застрекотали сверчки."
 ntribes.103.a:0 "Лето началось."
 ntribes.104.t:0 "Холодная ночь в Эверфросте"
 ntribes.104.d:0 "Холодный ветер продувал ледяную крепость, когда-то известную как Эверфрост. Звук, издаваемый им при столкновении со льдом, мог мгновенно заморозить кровь. Крик банши не шёл ни в какое сравнение. Но для тех, кто жил здесь сейчас, это был почти приятный звук приближающейся смерти. И всё же сегодня один пони не мог спокойно спать из-за него.\n\nКапли холодного пота стекали по лбу спящего. Его сны были расплывчатыми, он то появлялся, то исчезал, часто просыпаясь. Сны о том, что было много веков назад, о надеждах, взлётах и падениях, предательствах, целях тех, кто был забыт временем.\n\nИ вот новый сон захватил его. Было трудно разобрать детали или кому он мог принадлежать. Молодой жеребёнок, не старше четырнадцати лет, сидел в пещере. На нём была шуба, защищавшая его от холода, пока он практиковал изученную магию. Выглядывала лишь часть его рыжих локонов. Он был так увлечён своей магией, что не заметил, как кто-то вошёл в пещеру, пока копыто не ударило его по плечу. \n\n— Ух ты, твои навыки всё лучше и лучше! — раздался звонкий голос кобылки, не старше жеребёнка, стоявшей перед ним. Прежде чем он успел что-либо сказать, она схватила его за копыто и потянула ко входу: "Пошли поиграем на улицу. Сегодня такая красота." Наконец ему удалось высвободиться: "У меня нет времени играть, мне нужно как можно скорее освоить магию. Я обязательно защищу деревню и покажу им, на что я способен", — заявил он, как всегда. — Ах, ты безнадёжен. Что мне с тобой делать, ты всегда такой серьёзный, — поддразнила она.\n\n— А ты заболеешь, если будешь ходить без пальто, — заметил он.\n\n— Теперь ты говоришь как мой отец. — Она надула губы. Но она ещё не сдалась. Она продолжала говорить и беспокоить его, как и много дней назад, пока он не сдался: "Ладно, но только пять минут."\n\nПо какой-то причине сновидец чувствовал себя счастливым, наблюдая за этими событиями. Размытое чувство на краю сознания, отгоняющее тьму того, что могло бы быть.\n\nСон снова изменился. Пряный ветер сразу ударил в глаза сновидца. Было трудно держать их открытыми среди всего этого пепла, дыма и огня вокруг. Сновидец стоял посреди горящей деревни. Повсюду были разбросаны тела пони и грифонов-налётчиков. Последствия битвы. Плач тех, кто выжил, доносился со всех сторон. Сновидец заметил одну пони, присмотревшись внимательнее, он узнал кобылку из пещеры, хотя и несколько старше. Он плакал, прижимая к себе тело своей подруги. Кобылки, которая так его донимала. Однако теперь её тело было слабым и безвольным в его объятиях. Её живот был распорот. "Нет, ты не можешь меня бросить! Ты мой единственный друг", — умоляюще заскулил жеребёнок. — Ты... защитил деревню... Я уверена... теперь они всё поймут. — Её слова звучали тихо, словно доносились издалека. — Ты же помнишь... — Жеребёнок удивился, что она сейчас заговорила о чём-то столь неловком. — Я всегда буду с тобой. Так что, пожалуйста, улыбнись, Гэ...вин... — Её голос наконец затих, и остался лишь вой ветра."
 ntribes.104.a:0 "Чьи эти воспоминания?" #Блин... Даже не знаю)))
 ntribes.105.t:0 "Рабство в смерти"
 ntribes.105.d:0 "Железнодорожная бригада уже почти достигла великих северных гор. Именно тогда начали замертво падать первые рабочие. Это не смутило их надсмотрщиков, и вскоре мёртвые грифоны восстали, чтобы присоединиться к своим ещё живым товарищам. После этого несколько грифонов, ещё не сломленных голодом, истощением и страхом, попытались сбежать...\n\nНа следующий день их безжизненные тела были выставлены на кольях вдоль железной дороги, чтобы "мотивировать" остальных.\n\nПока они продвигались через горы Брэнтбика, возводя мосты и роя туннели, всё больше грифонов умирало – а затем их возрождённые тела падали наземь, когда их кости наконец ломались от бесконечной работы. Лавины и камнепады смывали целые группы рабочих-грифонов. И всё же их работа продолжалась. Те немногие, кому не повезло выжить, внешне почти не отличались от своих неживых собратьев – лишь призраки их прежних личностей, бездумно откалывающие камни c очередной скалы.\n\nГеорг ненавидел себя за трусость, за страх смерти – и за то, что будет после неё. Он продолжал служить, пока не остался единственным живым грифоном. И однажды, они наконец достигли последней горы на своём пути. Они приближались к Силкхорну – конечной точке их путешествия – теперь отчётливо видной с высоты, а вдали Георг видел прекрасные зелёные долины Герцланда.\n\nЭто зрелище вселило ужас в Георга. Что-то было не так. Он огляделся.\n\nСотни оживлённых тёмной магией грифонов укладывали рельсы, в то время как колонны воинов нежити шли впереди, развевая знамёна Морозного Короля. Георга осенило. Теперь он ясно видел, какое будущее он помог создать... Он замер на мгновение. Перед его глазами промелькнули картины бесчисленных невинных грифонов – теперь рабов Морозного Короля – их заталкивали в поезда, бегущие по рельсам, которые он спроектировал и построил. Стыд был слишком сложным чувством для его разума, которое поглотил ужас от мысли о том, что должно было произойти. Георг бросился к ближайшему обрыву и прыгнул со скалы, сложив крылья. Он должен был сделать это давно. Он должен был положить этому конец.\n\nНикто не пытался его остановить. Никто даже не обернулся..."
 ntribes.105.a:0 "Он был уже не нужен."
 ntribes.106.t:0 "Рабство в жизни"
 ntribes.106.d:0 "Георг не мог и представить, что профессия инженера-железнодорожника когда-нибудь спасёт ему жизнь. Но это случилось, дважды. Первый раз, когда ему пришлось покинуть Скайнавию, чтобы осмотреть участок путей к югу от города. Даже находясь за много миль оттуда, Георг и его спутники видели, как над городом собираются огромные тучи, и чувствовали что-то... неестественное. Затем на них обрушилась магическая метель, и рельсы начали трескаться от холода. Георг бежал как угорелый, едва избежав смерти от холода. В наступившем хаосе его железнодорожная бригада была схвачена наступающими воинами-пони и отправлена в лагерь рабов. На самом деле, "лагерь" был слишком щедрым термином для колонии землянок, которые грифоны были вынуждены расширять голыми когтями и простейшими инструментами, наказывая за малейшее неповиновение. Воины даже не утруждали себя сами наказаниями – они делегировали это сопровождающим их мерзким мертвецам. Их захватчики почти не беспокоились о кормлении рабов, но их пребывание в лагере было довольно коротким. У пони было множество дел для своих новоприобретённых рабочих: одних отправляли разбирать руины Скайнавии, других – трудиться в шахтах. Надсмотрщики давали шанс тем, кто обладал ценными навыками, проявить себя, и Георг был одним из немногих инженеров, кто нерешительно это сделал. Несомненно, бездушные монстры, в которых превратились эти пони, имели злые намерения, но он был готов помочь им, чтобы остаться живым и сытым.\n\nМорозному Королю нужна была армия – и даже армия нежити нуждалась в логистике. Им нужны были железные дороги для доставки оружия и боеприпасов – железные дороги, которые Георг спроектирует, а другие пленённые грифоны построят.\n\nТак началось их спуск в Тартар.\n\nСначала они расчищали себе путь через обширные северные леса, прокладывая великую железную дорогу от столицы пони, Эверфросте, чьи зловещие хрустальные шпили сияли позади них. Грифоны Скайнавии, закалённые годами жизни и войн на Севере, усердно трудились под молчаливым взором своих надсмотрщиков – некоторые живые, некоторые - нет. С этими пони было что-то не так. Глаза у живых пони были такими же пустыми, как и у мёртвых, словно они что-то потеряли, и единственными эмоциями, которые они выражали, были гнев и ненависть к грифоньему роду. Иногда по ночам они пели на своём странном языке, из которого Георг понимал несколько слов. Это были песни утраты, одиночества... и обещания мести."
 ntribes.106.a:0 "От этих песен его пробила дрожь."
 ntribes.108.t:0 "Посланник из Тир Дейге"
 ntribes.108.d:0 "В довольно неожиданном повороте событий нас посетил пони-дипломат из Северной Грифонии. Похоже, этим "северным пони" удалось создать современное, полностью функционирующее государство и даже завоевать несколько земель грифонов. Однако теперь, столкнувшись с нашей мощью, они готовы присоединиться к нам в качестве вассалов и присягнуть на верность, при условии, что им будет предоставлено самоуправление. Примем ли мы их предложение или отвоюем северные пределы Империи? Конечно, мы также можем потребовать возвращения всех ранее захваченных ими земель грифонов и позволить им сохранить северные пустоши."
 ntribes.108.a:0 "Они вольны править этими землями."
 ntribes.108.b:0 "Мы требуем вернуть земли грифонов!"
 ntribes.108.c:0 "Никаких сделок с пони!"
 ntribes.109.t:0 "Наши новые господа"
 ntribes.109.d:0 "Наш дипломат вернулся из Грифенхейма. Регент принял наше предложение, так что теперь мы вассалы Империи. Несмотря на то, что мы отказались от своего суверенитета, мы в основном вольны делать в своих владениях все, что захотим, и, учитывая наше удаленное местоположение, Империя, скорее всего, не будет вмешиваться в наше управление."
 ntribes.109.a:0 "Мир обеспечен."
 ntribes.110.t:0 "Условие Империи"
 ntribes.110.d:0 "Империя потребовала, чтобы мы вернули все их "законные земли", которые мы "оккупировали", – и только тогда они примут наше предложение, позволив нам сохранить контроль над северными территориями, а взамен к нам будут относиться как к союзникам, а не как к вассалам. Конечно, это не предложение, а скорее ультиматум, и если мы откажемся, грифоны, без сомнения, нападут на нас..."
 ntribes.110.a:0 "Мы вынуждены согласиться..."
 ntribes.110.b:0 "Никогда!"
 ntribes.111.t:0 "Пони согласны"
 ntribes.111.d:0 "Не желая навлекать на себя наш гнев, пони приняли наши требования. Это большая победа для нас, ведь нам удалось вернуть себе северные территории, не сделав ни единого выстрела!"
 ntribes.111.a:0 "Wunderbar!"
 ntribes.112.t:0 "Пони отказались"
 ntribes.112.d:0 "Видимо, у пони замёрзли мозги, раз они решили бросить нам вызов и отказаться отдавать захваченные грифоньи земли. Что ж, они сами выбрали такой путь."
 ntribes.112.a:0 "Готовьте панзеры!"
 ntribes.113.t:0 "Война с Империей"
 ntribes.113.d:0 "Империя отклонила наше предложение. Кажется, грифоны собираются пойти на нас войной..."
 ntribes.113.a:0 "Да защитят нас Духи!"
 ntribes.114.t:0 "Псу под хвост"
 ntribes.114.d:0 "Положение, в котором оказался Гровер, было мягко говоря... странным. После взятия Грифенхейма, пони-воины не брали Дворец штурмом. Вместо этого, их вожди начали долгие и напряжённые переговоры с оставшимися баркгинианскими гвардейцами, всё ещё верно охранявшими своего Императора. С тех пор посланцы почти ежедневно курсировали между Дворцом и ставкой пони. Прошло много недель, прежде чем командир Баркгинианской Гвардии – Бенито – с разбитым сердцем сообщил юному Императору, что посланник пони выдвинул ультиматум: Гровер должен отречься от претензий на императорский трон в обмен на титул герцога Бронзхилла. Старый пёс неохотно предложил согласиться, так как надежды на помощь, похоже, не осталось.\n\nИ вот Гровер покидал свой старый дом, вероятно, в последний раз. Он старался выглядеть как можно более достойно в окружении баркгинианцев в парадной форме. Шествие наблюдала группа пони в странных племенных нарядах. Среди них - кобыла с розовой гривой, которая, как слышал Гровер, была правительницей северян. Она грустно посмотрела на Гровера и произнесла несколько слов на странном, непонятном языке. Стоявший рядом голубой пегас с сильным акцентом перевёл на герцландский:\n\n— Принцессе жаль, что ваше правление заканчивается так. Она тоже когда-то была вынуждена наблюдать, как её страна погружается в хаос, будучи слишком юной, чтобы править, и бессильной что-либо изменить. Она надеется, что вы обретёте покой, и вам не придётся пережить то, что выпало на её долю. Жаль, что судьба свела нас таким образом.\n\nГровер, ещё более озадаченный, чем прежде, направился к вокзалу, где его уже ждал поезд в Бронзхилл."
 ntribes.114.a:0 "И так закончилось его правление..."
 ntribes.115.t:0 "Перенос столицы"
 ntribes.115.d:0 "Наша страна сейчас простирается на половину континента, и большинство подданных королевы Фианы – грифоны. Управлять такой огромной и разнообразной нацией становится все труднее и труднее. Хотя Эверфрост является традиционной столицей племен и крупнейшим поселением северных пони, она расположена слишком далеко на севере, чтобы обеспечить эффективное управление. Возможно, нам следует перенести нашу столицу на юг, в Клаудбьюри. Так мы сможем легче управлять нашим Соединенным Королевством и покажем наше уважение к грифонам. Конечно, какое бы место мы ни выбрали, оно, несомненно, будет стремительно расти, поскольку наши подданные будут массово приезжать в новую столицу..."
 ntribes.115.a:0 "Эверфрост – наш дом!"
 ntribes.115.b:0 "В Клаудбьюри!"
 ntribes.116.t:0 "Посланник из Тир Дейге"
 ntribes.116.d:0 "К нам обратился дипломат из северной страны пони, Тир Дейге. Исторически изоляционисты, пони недавно пересекли северные горные хребты и захватили Клаудбьюри, нарушив баланс сил в регионе. С обретением новых территорий пони были вынуждены занять более активную позицию и предложили нам союз. Что нам ответить?"
 ntribes.116.a:0 "Мы можем быть друзьями."
 ntribes.116.b:0 "Союз с дикарями? Зачем?"
 ntribes.117.t:0 "Ведина соглашается!"
 ntribes.117.d:0 "Мы только что получили известие от нашего дипломата, что Ведина согласилась с нашим предложением, и мы официально подписали союзный договор. Несомненно, вместе мы принесем прочный мир на Север Грифонии!"
 ntribes.117.a:0 "Великолепно."
 ntribes.118.t:0 "Ведина отвергает наше предложение"
 ntribes.118.d:0 "Эти высокомерные вединцы, очевидно, думают, что они лучше нас! С нашим дипломатом обошлись как с нежеланным гостем, а монарх Ведины отклонил наше предложение о союзе. Хотя это было невероятно глупо и грубо с их стороны, будем надеяться, что они не попытаются развязать войну против нас и просто продолжат упиваться своей прошлой, давно ушедшей славой."
 ntribes.118.a:0 "Надоедливые грифоны!"
 ntribes.119.t:0 "Спокойный день"
 ntribes.119.d:0 "Быть правителем — настоящим правителем, а не чьей-то марионеткой или размахивающей копытом "символом единства" — означало огромную работу. Хорошей стороной этого было то, что это занимало Фиану, отгоняя мрачные мысли и страхи. Всегда находился какой-нибудь общественный деятель, требующий аудиенции, решение, которое нужно принять, очередной "Офигеть Какой Важный Фестиваль", который нужно посетить... Однако теперь, когда проблема с грифонами была решена, всё успокоилось. После многих лет напряжённой работы Фиана внезапно обнаружила, что у неё нет ничего даже отдалённо важного. Ни единого спора между кланами, ни один из подчинённых не просил указаний... Мир и покой.\n\nОна некоторое время бродила по дворцу, отвлекая слуг, пока наконец не устроилась в одной из оранжерей, чтобы немного отдохнуть. Сады Дворца Сноуфлэйков были одним из его многочисленных чудес: торговцы привозили множество экзотических и красивых растений с Юга, которые затем выращивались здесь. Благодаря магии пони и мастерству стеклодувов эти удивительные сооружения поддерживали жизнь различных теплолюбивых растений в суровом климате Севера.\n\nКогда Фиана была кобылкой, она проводила много времени в этих садах, разыгрывая приключения в загадочных южных землях, путешествуя по бескрайним джунглям и исследуя потерянные храмы, как в одной из книг, которые она нашла в дворцовой библиотеке. То были более простые времена... Увы, им не суждено было длиться вечно.\n\nЭти несколько лет неустанной работы над своим королевством пробудили в Фиане чувство, которого раньше не было — ощущение цели, желание защитить своих сородичей. Неужели именно это чувствовал её отец Фотад, когда вёл своих пони в бой против грифонов? Она инстинктивно отпрянула от этой мысли, но вскоре поняла, что в ней нет ничего плохого. Её страхи и сожаления, преследовавшие её с тех пор, как погибла её семья, исчезли. Впервые в жизни она почувствовала себя свободной... сильной."
 ntribes.119.a:0 "Я всегда буду защищать моих пони."
 ntribes.120.t:0 "Специализация Академии"
 ntribes.120.d:0 "Академия Стормшилдов становится главным образовательным учреждением южного стиля в Тир Дейге. Она уже привлекла много любознательных исследователей из числа наиболее свободомыслящих клановых пони и нескольких опытных иностранцев. Мы можем осторожно повлиять на то, в каком направлении Академия будет развиваться, что позволит нам использовать её разработки для улучшения жизни на Севере."
 ntribes.120.a:0 "Исследования механики."
 ntribes.120.b:0 "Академия воздухоплавания."
 ntribes.120.c:0 "Продвинутая физика."
 #ntribes.120.t:0 "Ух ты, говорящая пони-рыба!"
 #ntribes.120.d:0 "— КТО ТАМ? \n\n— Это я, добрый Э-эх. Я здесь. \n\n— И я здесь! \n\n— А ты кто такой? Откуда взялся? \n\n— С того берега моря.\n\n— На чем приехал?\n\n— Оседлал хромого козла, сел и приехал.\n\n— Море, что, лужа?\n\n— Может и лужа, да только ту лужу грифон не перелетел.\n\n— Значит, грифон - птенец!\n\n— Наверно, птенец. Да только тень от его крыльев город закрывает, в городе ночь настает.\n\n— Город-то, небось, крооохотный! \n\n— Через тот город чейнджлинг бежал - не перебежал.\n\n— Выходит, чейнджлинг маааленький!\n\n— Чейнджлинг – как чейнджлинг. Из его хитина тулуп вышел.\n\n— Куда вышел?\n\n— Вышел из того города, где чейнджлинг бежал, на который тень от грифона упала, и пошел, куда глаза глядят.\n\n— Чьи глаза???\n\n— Глаза того тулупа, который из хитина чейнджлинга вышел, в городе, где ночь настает, когда над ним птенец пролетает верхом на хромом козле.\n\n— ЧЕГО?!!!!\n\n— Чего-чего. На хромом козле с того берега моря, которое чейнджлингу не перелететь, грифону не перебежать, хоть море - не море, а так - лужа посреди города, где тень от козла на чейнджлинга упала и насмерть убила, а из хитина чейнджлинга тулуп вышел и пошел, куда глаза глядят. Тут чейнджлинг кааак прыгнет!\n\n— КАКОЙ чейнджлинг???\n\n— Насмерть убитый – как прыгнет, куда глаза глядят, аж на тот берег моря, которое ни перелететь, ни перебежать, из которого тулуп вышел, на который тень от козла упала и чейнджлинга убила, хоть чейнджлинг – не чейнджлинг, а грифон! " 
 #ntribes.120.a:0 "— КАКОЙ ЧЕЙНДЖЛИНГ??? КАКОЙ ГРИФОН??? КАКОЙ КОЗЁЛ?? (наземка)"
 #ntribes.120.b:0 "— Повторить? Ну, значит, тот самый козёл с того берега лужи (авиация)"
 #ntribes.120.c:0 "— АААААААААААААААААААА!!!!! ДА ХВАААТИТ!!!! (ядерка)" 
 #Не, ну всё равно ведь этого ивента изначально в локе не было))) Хорошая шалость никогда не помешает
 
### News Events ###
ntribes_news.1.t:0 "Тирания Льда"
 ntribes_news.1.d:0 "[This.GetNewspaperHeader]Северные пределы Грифонии большинством игнорируются. Они считаются замёрзшей пустошью, где невозможно найти ничего интересного. Однако после победы над грифонами Скайнавии местные пони, по-видимому, попали под контроль таинственного культа, возглавляемого так называемым "Ледяным Королём", и начали свою кампанию геноцида против грифонов южнее. Орды воинов племён, сопровождаемые нежитью, используя тёмную магию, покорили многие народы грифонов, убивая всех, кто сопротивлялся, и порабощая остальных. Но это был не конец амбиций Морозного Короля, поскольку он каким-то образом умудрился поглотить силу Северных Духов, став, как некоторые утверждают, полубогом, способным соперничать с аликорнами. Вероятно, все маги мира почувствовали последствия этого события и ужаснулись. Мало кто знает, что происходит в так называемой Тирании Льда, но слухи и свидетельства беженцев рисуют ее как кошмарное воинственное государство, лидером которого движет исключительно жажда мести грифоньему роду."
 ntribes_news.1.a:0 "Родился новый Бог!"
 ntribes_news.1.b:0 "Подготовьтесь к войне."
 ntribes_news.1.c:0 "Тревожно..."
 ntribes_news.2.t:0 "Ромау в огне!"
 ntribes_news.2.d:0 "[This.GetNewspaperHeader]Ромау, один из крупнейших городов Герцланда, также был одним из центров восстания грифонов против Морозного Короля. Однако, несмотря на доблестные усилия грифонов-повстанцев, армии нежити отбили город и начали методичную резню его жителей. Артиллерийским огнём, взрывчаткой и магией пони и их слуги-нежить опустошали целые кварталы и убивали всех, кто пытался бежать из обречённого города. В результате одного из самых ужасных актов геноцида в истории Грифонии, Вечный город прекратил своё существование..."
 ntribes_news.2.a:0 "Delenda Est!"
 ntribes_news.2.b:0 "Тёмный день для грифоньего рода..."
 ntribes_news.2.c:0 "Ужасно..."
 ntribes_news.3.t:0 "Разрушение Грифенхейма"
 ntribes_news.3.d:0 "[This.GetNewspaperHeader]Новости разнеслись по всему миру: город Грифенхейм разрушен войсками так называемого "Ледяного короля." Пока его воины-пони и орды нежити продвигались на юг, сокрушая сопротивление мятежных герцландцев, их предводитель призвал к полному уничтожению непокорного города. Большинство его жителей были убиты, а сам город превратился в руины, а все его некогда знаменитые достопримечательности были стерты в прах. Это преступление против рода грифонов было единогласно осуждено мировым сообществом, но, похоже, это не беспокоит Тёмного Владыку Севера."
 ntribes_news.3.a:0 "Месть!"
 ntribes_news.3.b:0 "Конец близок..."
 ntribes_news.3.c:0 "Варвары!"
 ntribes_news.4.t:0 "Королевство Севера"
 ntribes_news.4.d:0 "[This.GetNewspaperHeader]Мало кому были по душе замёрзшие пустоши Северной Грифонии – земли, населённой исключительно изолированными племенами пони, которые в последнее время привлекали отчаянных коммунистов Скайнавии. Однако, к всеобщему удивлению, пони не только справились с ними, но и начали масштабную индустриализацию, позволив им соперничать с соседними грифоньими странами, а затем и полностью их подчинить. После этих завоеваний было провозглашено новое королевство, и Фиана Сноуфлэйк была коронована первой королевой Севера. Мало кто знает, что ждёт это молодое государство в будущем, но одно ясно: северные пони больше не могут просто игнорироваться остальным миром."
 ntribes_news.4.a:0 "Вперёд в светлое будущее!"
 ntribes_news.4.b:0 "Это было неожиданно!"
 ntribes_news.4.c:0 "Это было неожиданно!"
 ntribes_news.5.t:0 "Герцландское Восстание"
 ntribes_news.5.d:0 "[This.GetNewspaperHeader]Даже слуги-пони Морозного Короля боятся его гнева. Многие из них были наказаны за свою некомпетентность, и теперь армии Тирании собираются в Северном Герцланде, готовясь вновь сразиться за своего господина с грифонами. Страх наказания, лютая, почти навязанная ненависть к грифонам, жажда добычи... Многое побуждает армию пони двигаться вперёд, в то время как нежить движима исключительно волей своего господина. \n\nТем временем выжившие грифоны восстают, готовые к решающему бою. Если они проиграют, то навсегда станут рабами зимы, угнетёнными и раздавленными. Священники благословляют отряды добровольцев, идущие на фронт, и, в редком проявлении единства, кажется, что вся Грифония впервые поддерживает – пусть даже скорее на словах – борьбу герцландцев за свободу."
 ntribes_news.5.a:0 "За Морозного Короля!"
 ntribes_news.5.b:0 "За Свободу!"
 ntribes_news.5.c:0 "Интересно."
 ntribes_news.6.t:0 "Скайнавский катаклизм"
 ntribes_news.6.d:0 "[This.GetNewspaperHeader]Многие маги по всему миру ощущали некое магическое возмущение, по-видимому, зародившееся на крайнем Севере Грифонии. Из-за ограниченных контактов с этой частью света точные сведения о том, что именно там произошло, отсутствуют. Однако несколько торговцев, путешествовавших в Новую Скайнавию, сообщают, что эти земли захватили крайне агрессивные племена с востока, которые прогнали всех, кто пытался приблизиться к городу Новая Скайнавия. Среди прочих мрачных слухов о чистках среди кланов и повсеместном использовании тёмной магии можно только догадываться о катастрофе, постигшей город..."
 ntribes_news.6.a:0 "Победа, но какой ценой..."
 ntribes_news.6.b:0 "Кому не плевать на Скайнавию?"
 ntribes_news.6.c:0 "Кому не плевать на Скайнавию?"
 ntribes_news.7.t:0 "Разрушение Грифонстоуна"
 ntribes_news.7.d:0 "[This.GetNewspaperHeader]В своей войне против грифоньего рода армии Тирании Льда совершили множество зверств, по-видимому, просто наслаждаясь резней и страданиями невинных грифонов. Но одно из них выделяется даже среди бесчисленных актов геноцида. Вскоре после того, как армии северных воинов достигли Грифонстоуна, священного города грифонов, они просто сравняли его с землей. Хотя новостей об этом мало, маги по всей Грифонии ощутили эффекты от разрушительнего магического катаклизма, предположительно вызванного массовым применением тёмной магии для уничтожения древнего дерева, что, по слухам, нанесло ужасный урон самой армии Морозного Короля. Почти все народы осудили этот акт варварского разрушения, и решимость грифонов свергнуть Морозного Короля только укрепилась – но пока неизвестно, будет ли этого достаточно, чтобы остановить северных захватчиков."
 ntribes_news.7.a:0 "Наш величайший триумф!"
 ntribes_news.7.b:0 "МЫ ОТОМСТИМ!!!"
 ntribes_news.7.c:0 "Это ужасно!"
 ntribes_news.8.t:0 "Последний Альянс Грифонов"
 ntribes_news.8.d:0 "[This.GetNewspaperHeader]Веками грифоны сражались друг с другом. Даже расцвет Империи не положил конец их конфликтам. Казалось, что вечная война ещё долго будет уделом Грифонии. Однако теперь появился враг, чья единственная цель — поработить и вечно угнетать весь род грифонов. До сих пор никто не мог остановить Морозного Короля и его армии нежити. Однако впервые в истории, все грифоны, похоже, готовы забыть о разногласиях и сражаться вместе, чтобы положить конец Бесконечной Зиме и обеспечить будущее своему виду.\n\nВсе оставшиеся свободные народы Грифонии объявили войну Тирании Льда. Не только политики и генералы, но и всё общество грифонов нацелено на победу в этой войне, и каждый грифон старается внести свой вклад.\n\nВозможно, чтобы остановить Морозного Короля, потребуется нечто большее, чем Последний Союз Грифонов. Тем не менее, грифоны будут сражаться, и даже если погибнут, то на своих условиях."
 ntribes_news.8.a:0 "Жалкие надоедливые птицы!"
 ntribes_news.8.b:0 "Победа или смерть!"
 ntribes_news.8.c:0 "Последняя война за Грифонию?"
 ntribes_news.9.t:0 "Новый порядок в Герцланде"
 ntribes_news.9.d:0 "[This.GetNewspaperHeader]Случилось невероятное: Герцланд был завоеван северными племенами пони! Мало кто вообще слышал об этих скакунах, но они каким-то образом не только победили социалистов Скайнавии, а затем захватили Клаудбьюри, но и двинулись на юг, одолев Империю Грифонов. Принцесса – ныне объявленная королевой – Фиана, правительница Северных племен, объявила, что Империя будет распущена, а ее земли войдут в состав её королевства. Знать грифонов сохранит свою власть до тех пор, пока они будут верны ей."
 ntribes_news.9.a:0 "Да здравствует королева!"
 ntribes_news.9.b:0 "Да что вообще происходит?!"
 ntribes_news.9.c:0 "Да что вообще происходит?!"
 ntribes_news.10.t:0 "Рождение Соединённого Королевства"
 ntribes_news.10.d:0 "[This.GetNewspaperHeader]Никто не ожидал, что северные пони столкнутся лицом к лицу с Империей Грифонов и победят ее. Другие грифонские правители озадачены тем, что описывается как "странное" и "разочаровывающее" падение Империи Грифонов, а некоторые утверждают, что на стороне пони были высшие силы. Еще более ошеломляющим событием стало то, что принцесса Фиана была коронована королевой Севера и Герцланда сегодня в Грифенхейме, что привело к образованию нового государственного образования – Соединённого Королевства Герцланда и Северной Грифонии."
 ntribes_news.10.a:0 "Да здравствует королева пони и грифонов!"
 ntribes_news.10.b:0 "Это возмутительно!"
 ntribes_news.10.c:0 "Да что вообще происходит?!"

