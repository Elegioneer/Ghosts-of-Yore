### Unit Leader Traits ###
goy_blindness:0 "Слепой"
 goy_blindness_desc:0 "Этот персонаж слеп как крот."
 #goy_blindness_desc:1 "У этого персонажа серьёзное обострение болезни "Лигма Боллс.""

### Focus ###
NTR_grim_reality:0 "Наше мрачное положение"
 NTR_grim_reality_desc:0 "На протяжении веков мы жили в мире, и нас не беспокоили грифоны с юга. Все изменилось, когда группа республиканцев вторглась в западные племена и, несмотря на все наши усилия, установила контроль примерно над третью территории нашей прародины. За два десятилетия войны мы так и не смогли победить захватчиков..."
 NTR_druids:0 "Друиды"
 NTR_druids_desc:0 "Друиды, жрецы Шести Духов, имеют особенно сильную связь с этими сверхъестественными существами. Их помощь будет очень нужна, если мы хотим победить захватчиков-грифонов."
 NTR_rally_warriors:0 "Собрать воинов"
 NTR_rally_warriors_desc:0 "Стычки со скайнавцами дорого нам обошлись. Нам нужно снова сплотить воинов кланов. Если мы хотим иметь шанс на победу, каждый пони должен внести свой вклад в этот конфликт."
 NTR_holy_forge:0 "Священная Кузня"
 NTR_holy_forge_desc:0 "Единороги клана Молтенрок знают множество секретов создания магического оружия и инструментов. На протяжении сотен лет они ковали мечи, копья и доспехи, которыми пользовались величайшие герои племен. Времена изменились, Священная Кузня теперь нужна нам для производства современного оружия."
 NTR_meet_clans:0 "Встретиться с вождями"
 NTR_meet_clans_desc:0 "Без поддержки лидеров кланов принцесса – всего лишь символ единства, которое, по правде говоря, пошатнулось. Нам нужно попытаться уладить разногласия между враждующими кланами, если мы хотим спасти Север."
 NTR_look_east:0 "Взглянуть на Восток"
 NTR_look_east_desc:0 "Восточная Грифония – Речные земли – населена высокоразвитыми сообществами пони. Если мы хотим модернизироваться, сотрудничество с ними может быть нашим единственным шансом."
 NTR_great_council:0 "Великий Совет"
 NTR_great_council_desc:0 "Мы больше не можем сидеть сложа копыта – Великий совет всех племен должен собраться и попытаться выйти из тупика, в котором мы оказались. В нашей ситуации лучше принять любое решение, которое позволит нам двигаться вперед, а не оставаться на месте."
###
 NTR_clan_greenhoof:0 "Клан Гринхуф"
 NTR_clan_greenhoof_desc:0 "Гринхуф — крупнейший из всех северных кланов. Его пони славятся своей связью с землёй и считаются лучшими фермерами и шахтёрами."
 NTR_magically_modified_plants:0 "Магически модифицированные растения"
 NTR_magically_modified_plants_desc:0 "С помощью магии мы можем культивировать новые виды растений, дающие большие урожаи, растущие быстрее и обладающие повышенной устойчивостью к болезням."
 NTR_create_new_farmlands:0 "Освоить новые пахотные земли" 
 NTR_create_new_farmlands_desc:0 "Столетние северные методы земледелия и магическое регулирование погоды позволяют нам превращать ледяные пустоши в плодородные поля, способные прокормить растущее население."
 NTR_use_rockseekers:0 "Организовать Искателей камня"
 NTR_use_rockseekers_desc:0 "Некоторых гринхуфов Дух Земли благословил особым даром — они чувствуют жилы драгоценных металлов в породе. Этот дар делает их бесценными для клана и северных племён в целом. С их помощью мы сможем открыть новые месторождения для лёгкой добычи."
 NTR_plant_ironwood:0 "Расширить посадки железного дерева"
 NTR_plant_ironwood_desc:0 "Север — одно из немногих мест в Грифонии, где ещё можно найти редкое железное дерево, прочное как сталь. Исчезнувшие на большей части континента, последние такие деревья растут в наших землях. С помощью друидов клана Гринхуф мы сможем возродить обширные леса железного дерева и использовать их."
 NTR_age_of_plenty:0 "Эпоха изобилия"
 NTR_age_of_plenty_desc:0 "Мы заботимся о земле, и она щедро вознаграждает нас своими дарами."
 NTR_follow_call:0 "Следовать Зову"
 NTR_follow_call_desc:0 "Наши Искатели Камня последуют зову пород, чтобы найти великие богатства, которые обеспечат нам столь необходимую самодостаточность."
#
 NTR_clan_stormshield:0 "Клан Стормшилд"
 NTR_clan_stormshield_desc:0 "Клан северных пегасов, Стормшилд, всегда славился свободолюбием и отвагой. Его пони часто покидали наши земли — то как налетчики, то как торговцы, но в трудные времена они первыми вставали на защиту племён."
 NTR_open_frostbell:0 "Открыть Фростбелл для торговли"
 NTR_open_frostbell_desc:0 "По просьбе Эуана Стормшилда его клану будет разрешено торговать с чужеземцами через порт Фростбелл. Это поможет городу расти и позволит нам лучше контролировать контакты с иностранцами."
 NTR_riders_storm:0 "Всадники бури"
 NTR_riders_storm_desc:0 "Наши пегасы научились летать даже в самых опасных условиях. Ни снег, ни буря не остановят их. У нас есть большой резерв опытных летунов — осталось лишь научить их пользоваться ружьями..."
 NTR_limited_contacts:0 "Ограниченные контакты"
 NTR_limited_contacts_desc:0 "Хотя они нам и нужны, не стоит слишком сближаться с чужаками. Торговля с иностранными купцами будет ограничена несколькими выбранными местами и поручена клану Стормшилд, чтобы остальных не беспокоили."
 NTR_foreign_tech:0 "Иностранные технологии"
 NTR_foreign_tech_desc:0 "Нет сомнений, что, полагаясь только на свои силы, мы никогда не сможем соперничать с развитыми нациями. Стормшилд предлагают простое решение: они могут закупить необходимое исследовательское оборудование и чертежи у зарубежных торговцев."
 NTR_import_planes:0 "Импорт самолётов"
 NTR_import_planes_desc:0 "Самолёт — удивительное изобретение грифонов, от которого любой пегас приходит в восторг... Должно быть, дело в скорости. Надо наконец разрешить им купить несколько, чтобы перестали ныть."
 NTR_profit:0 "Прибыль от наших богатств"
 NTR_profit_desc:0 "Меха, древесина, минералы, изделия наших мастеров... Мы продавали множество востребованных товаров со значительной скидкой, чтобы привлечь покупателей. Теперь, когда мы известны в торговом мире, можно скорректировать цены и начать зарабатывать!"
 NTR_royal_academy:0 "Королевская Академия"
 NTR_royal_academy_desc:0 "Мы получили необычный запрос от клана Стормшилд. В то время как большинство жеребят обучаются у друидов или в качестве подмастерьев, Стормшилды хотят создать настоящий "университет", где пони будут учиться по-южному. Учитывая, что они сами его финансируют и просят лишь покровительства — почему бы и нет?"
 NTR_strike_enemies:0 "Удар по врагу"
 NTR_strike_enemies_desc:0 "Самолёты значительно превосходят пегасов в одном: если пони могут разве что бросать камни, то самолёты сбрасывают бомбы. Это куда эффективнее!"
 NTR_defend_skies:0 "Защитить наше небо"
 NTR_defend_skies_desc:0 "Вероятно, у врагов будет численное превосходство в воздухе. Поскольку активное использование авиации исключено, следует сосредоточиться на перехвате их самолётов и предотвращении бомбардировок."
#
 NTR_clan_brightflame:0 "Клан Брайтфлейм"
 NTR_clan_brightflame_desc:0 "Хотя и немногочисленный, клан Брайтфлейм славится своими искусными целителями, алхимиками и укротителями зверей. В политике они всегда выступают голосом разума среди племён и пользуются глубоким уважением вождей других кланов."
 NTR_teacher_village:0 "Учителя в каждой деревне"
 NTR_teacher_village_desc:0 "Многие члены клана Брайтфлейм живут среди других племён или странствуют по земле, оказывая помощь и давая советы всем просящим. Нам стоит последовать примеру этих мудрецов и направить учителей даже в самые отдалённые поселения наших владений."
 NTR_supplies_for_alchemists:0 "Припасы для алхимиков"
 NTR_supplies_for_alchemists_desc:0 "Удивительно, сколько времени алхимики тратят на поиски редких ингредиентов. Если мы обеспечим этих мудрых пони всем необходимым, сможем наладить массовое производство различных могущественных зелий."
 NTR_fortitude_elixir:0 "Эликсир стойкости"
 NTR_fortitude_elixir_desc:0 "Брайтфлеймы согласились поделиться с нами рецептом своего знаменитого эликсира стойкости. Это зелье спасло множество путешественников, попавших в снежные бури или заблудившихся в глуши, позволяя им идти вперёд без отдыха и пищи долгие часы."
 NTR_healing_herbs:0 "Выращивание целебных трав"
 NTR_healing_herbs_desc:0 "Редкость магических трав серьёзно ограничивает нашу способность производить лекарства в больших количествах. Эти растения требуют хорошей почвы и тщательного ухода, поэтому лишь немногие пони могут их культивировать. Государству следует развивать специализированные фермы для выращивания этих культур."
 NTR_tame_beasts:0 "Укрощение зверей"
 NTR_tame_beasts_desc:0 "Грозные урсы — одни из самых опасных созданий северных земель. Однако если их приручить, они могут стать чрезвычайно полезным дополнением к нашей армии."
#
 NTR_clan_moltenrock:0 "Клан Молтенрок"
 NTR_clan_moltenrock_desc:0 "Владельцы знаменитой Священной Кузни, единороги клана Молтенрок считаются остальными северянами... несколько не в себе. Однако они обладают обширными знаниями в зачаровании инструментов и современных технологиях."
 NTR_swords_into_guns:0 "Мечи на ружья"
 NTR_swords_into_guns_desc:0 "В одном реформаторы были безусловно правы: век мечей давно прошёл. Пришло время переплавить наше холодное оружие и вооружиться чем-то куда более смертоносным — и Расплавленные Камни более чем готовы это выковать."
 NTR_expand_holy_forge:0 "Расширить Священную Кузню"
 NTR_expand_holy_forge_desc:0 "При достаточных ресурсах Молтенрок обещают быстро расширить свои производственные мощности — к нашей великой выгоде."
 NTR_wisdom_metalshapers:0 "Мудрость Формовщиков металла"
 NTR_wisdom_metalshapers_desc:0 "Без сомнения, клан Молтенрок обладает самыми изобретательными пони в наших землях. Их опыт и смекалка необходимы, если мы хотим соперничать с грифонами в технологиях."
 NTR_no_limits:0 "Без ограничений!"
 NTR_no_limits_desc:0 "Зачем ограничиваться стрелковым оружием? Формовщики Металла пообещали создать оружие, достаточно мощное, чтобы уничтожить любого врага, как бы велик он ни был."
 NTR_strive_to_perfection:0 "Стремление к совершенству"
 NTR_strive_to_perfection_desc:0 "Перфекционизм Молтенроков порой раздражает: если созданная ими вещь не соответствует их высоким стандартам, они отправляют этот (совершенно годный) предмет в переплавку и начинают заново... и снова... и ещё раз..."
 NTR_weaponised_magic:0 "Магическое оружие"
 NTR_weaponised_magic_desc:0 "Древние ритуалы магического зачарования можно применить к современному оружию так же, как и в старину. Если легендарные зачарованные мечи могли низводить молнии, представьте, на что способна зачарованная пушка..."
 NTR_share_knowledge:0 "Распространение знаний"
 NTR_share_knowledge_desc:0 "До сих пор печально известная ревность Молтенрок защищала их знания от посторонних. Однако если мы убедим их поделиться некоторыми секретами с другими пони, всё наше общество от этого только выиграет."
 NTR_blessed_guns:0 "Благословлённые ружья"
 NTR_blessed_guns_desc:0 "Молтенрок верят, что при правильном ритуале Дух Металла благословит создаваемые ими магические ружья. Такая сверхъестественная помощь должна устранить многие типичные проблемы подобного оружия."
 NTR_spirit_machine:0 "Дух в машине"
 NTR_spirit_machine_desc:0 "Некоторые Формовщики Металла утверждают, что их покровитель-Дух особенно благоволит к таким великолепным творениям, как танки — и с радостью примет их как свои сосуды. Как может враг надеяться победить наши танки, если они суть аватары божества?"
#
 NTR_clan_barkcoat:0 "Клан Барккоут"
 NTR_clan_barkcoat_desc:0 "Члены клана Барккоут, одного из старейших северных кланов, славятся как искуснейшие ремесленники, строители и мастера наших земель."
 NTR_good_old_materials:0 "Проверенные материалы"
 NTR_good_old_materials_desc:0 "Дерево и камень служат нам сотни лет. С помощью этих простых материалов мы научились возводить прочные строения, способные выдержать суровый климат Северной Грифонии."
 NTR_crystal_clear:0 "Кристальная ясность"
 NTR_crystal_clear_desc:0 "Мы нашли множество способов использования кристаллов, особенно в строительстве — шпили нашей столицы лучший тому пример. Но для развития кристальной архитектуры потребуется разработка новых месторождений."
 NTR_master_builders:0 "Мастера-строители"
 NTR_master_builders_desc:0 "Мы пригласим самых опытных плотников и каменщиков Барккоут ко двору, поручив им курировать строительные проекты и обучать новых мастеров."
 NTR_new_shipyard:0 "Новая верфь"
 NTR_new_shipyard_desc:0 "С ростом потребности в защите побережья Барккоут пришли на помощь, предоставив сухие доки и чертежи современных кораблей."
 NTR_educate_apprentices:0 "Обучение подмастерьев"
 NTR_educate_apprentices_desc:0 "Создав школы ремёсел для молодых пони, мы обеспечим следующее поколение продуктивными членами общества."
 NTR_arts_and_crafts:0 "Искусства и ремёсла"
 NTR_arts_and_crafts_desc:0 "Индустрия губит нации, превращая существ в винтики механизмов, она оскверняет земли и души, заменяя уникальность единообразием. Наш путь — путь ремесленников, стремящихся к совершенству, достижимому только их копытами."
 NTR_many_shapes:0 "Многообразие кораблей"
 NTR_many_shapes_desc:0 "Корабелы Барккоут часами объясняли различия между типами судов, но в памяти остались лишь странные сложные термины. Мы не знаем, что они могут сделать с дизайном, но точно могут что-то — остаётся молиться, что сделают правильно."
 NTR_roam_the_waves_trad:0 "Покорение волн"
 NTR_roam_the_waves_trad_desc:0 "Кораблю нужна команда. К счастью, на Севере немало опытных моряков для нашего флота."
 NTR_polar_warships:0 "Полярные дредноуты"
 NTR_polar_warships_desc:0 "Наши корабелы горят желанием создавать всё более мощные линкоры. Сильный флот — наша необходимость, а его сердце — флагман!"
 NTR_floating_icebergs:0 "Плавучие айсберги"
 NTR_floating_icebergs_desc:0 "Удивительно, что до этого не додумались раньше: малые айсберги можно зачаровать как корпуса кораблей. Это ускорит постройку и сделает суда прочнее — расколоть плавучую ледяную гору непросто! Остаётся лишь проблема таяния..."
#
 NTR_age_of_magic:0 "Новая эра магии"
 NTR_age_of_magic_desc:0 "Времена меняются. Грифоны твердят, что наступает эра крови и стали, время промышленности и науки... Но они не правы. Мы возродим великую магию прошлого и создадим чудеса, каких свет не видывал."
 NTR_connect_clans:0 "Объединение кланов"
 NTR_connect_clans_desc:0 "Изоляция порождает подозрения и ослабляет связи между кланами. Чтобы по-настоящему объединить общество, мы должны быть услышаны даже в самых отдалённых общинах."
 NTR_crystal_architecture:0 "Кристальная архитектура"
 NTR_crystal_architecture_desc:0 "Кристальные шпили Дворца Сноуфлэйков — величайшее достижение зодчих прошлого. Новые открытия в магии позволят нам возводить такие сооружения проще, буквально выращивая здания из кристальных осколков."
 NTR_applications_of_ice:0 "Многообразие льда"
 NTR_applications_of_ice_desc:0 "Магические кристаллы редки. Но один из наших магов предложил зачаровывать лёд как альтернативу. Организация массового производства потребует усилий, но результат того стоит."
 NTR_limitless_potential:0 "Безграничный потенциал"
 NTR_limitless_potential_desc:0 "Множество магических тайн ещё не раскрыто. Каждый день наши маги находят новые применения старым заклинаниям и создают новые. Наше будущее будет ярким — и наполненным магией!"
 NTR_the_jewel:0 "Жемчужина Севера"
 NTR_the_jewel_desc:0 "Эверфрост, Город Кристальных Шпилей, Жемчужина Севера... Он и сейчас прекрасен, но с возвращением земель и новыми достижениями в магии и технологиях мы сделаем его поистине величайшим городом всей Северной Грифонии!"#
#
 NTR_follow_old:0 "Идти путём предков"
 NTR_follow_old_desc:0 "Мы победим не отвергая традиции отцов, а сплотившись и стойко перенеся испытания новой эры. Север ежедневно проверяет своих обитателей — и скайнавцы лишь еще одно испытание."
 NTR_redeem_ice:0 "Помиловать Круг Льда"
 NTR_redeem_ice_desc:0 "Многие Говорящие с мёртвыми последовали за Архидруидом, разделив его безумие. Но Круг Льда не был полностью уничтожен Гэвином, и выжившие члены клянутся искупить вину."
 NTR_rally_lodges:0 "Сбор дружин"
 NTR_rally_lodges_desc:0 "Воинские дружины сражаются на западе со скайнавцами и отражают набеги, но им не хватает единого командования. С поддержкой Гордина Лучника они прислушаются к зову Принцессы."
 NTR_meet_euan:0 "Встреча с Эуаном"
 NTR_meet_euan_desc:0 "Эуан Стормшилд, лидер реформаторов, подрывал авторитет Принцессы, однако, им движет желание защитить соплеменников. Он поддержит борьбу против скайнавцев."
 NTR_unity_call:0 "Призыв к Единству"
 NTR_unity_call_desc:0 "Наши воины разобщены, вожди погрязли в раздоре. Мы должны убедить их действовать сообща."
 NTR_solidarity:0 "Солидарность с изгнанниками"
 NTR_solidarity_desc:0 "Восточные кланы помогут переселенцам, предоставив земли и припасы. Пусть родственные узы возьмут верх над недовольством."
 NTR_mend_differences:0 "Залечить раны"
 NTR_mend_differences_desc:0 "Принцесса вновь утвердила власть над племенами. Время покажет, верное ли решение она приняла."
 NTR_necessary_concessions:0 "Необходимые уступки"
 NTR_necessary_concessions_desc:0 "Эуан выдвинул условия. Нам придется принять элементы современности — но на наших условиях."
 NTR_lightning_strike:0 "Молниеносный удар"
 NTR_lightning_strike_desc:0 "Мы используем знание местности для стремительных рейдов. Скайнавцы не поймут, что их поразило!"
 NTR_fortify_border:0 "Укрепить границу"
 NTR_fortify_border_desc:0 "Лучшая защита — надежная оборона. Мы станем неприступной скалой, о которую разобьются атаки грифонов."
 NTR_bring_down_skynavia:0 "Разгром Скайнавии"
 NTR_bring_down_skynavia_desc:0 "Пришло время покончить со скинавцами. Мы освободим наши земли и уничтожим угрозу нашей свободе! К оружию!"
 NTR_call_warriors:0 "Воззвать к воинам"
 NTR_call_warriors_desc:0 "Пони на скайнавских землях готовы присоединиться к нам. Мы вызовем их через границу."
 NTR_focus_on_sabotage:0 "Диверсионная война"
 NTR_focus_on_sabotage_desc:0 "Скайнавцы ошибочно считают покоренными оставшихся пони. Мы покажем им их ошибку."
 NTR_lessons_of_war:0 "Уроки войны"
 NTR_lessons_of_war_desc:0 "Мы извлечем уроки из побед и поражений, чтобы никогда впредь не стоять на грани катастрофы."
 NTR_vae_victis:0 "Горе побежденным"
 NTR_vae_victis_desc:0 "Скайнавцы разгромлены. Теперь предстоит решить судьбу побежденных грифонов."
 NTR_return_clans:0 "Возвращение кланов"
 NTR_return_clans_desc:0 "После победы изгнанные кланы смогут вернуться на западные земли предков."
 NTR_learn_from_defeated:0 "Учиться у побежденных"
 NTR_learn_from_defeated_desc:0 "Изучение трофейного вооружения даст ценные знания. Мы передадим образцы клану Молтенрок для изучения."
 NTR_discipline_them:0 "Дисциплинированные громилы" 
 NTR_discipline_them_desc:0 "Ополчения доказали эффективность, хоть и нуждаются в дисциплине. Племенная структура обеспечивает пополнение без затрат казны."
 NTR_princess_army:0 "Воины Её Высочества"
 NTR_princess_army_desc:0 "Мы победили скорее удачей, чем мастерством. Придется реформировать армию, заменив племенные дружины регулярными частями."
 NTR_princess_of_all:0 "Принцесса для всех"
 NTR_princess_of_all_desc:0 "Мы должны научиться сосуществовать со скайнавцами, создав единое государство пони и грифонов."
 NTR_ponies_land:0 "Земля пони"
 NTR_ponies_land_desc:0 "Это наша земля. Мы не потерпим чужаков-грифонов — только их изгнание принесет покой."
 NTR_reopen_refinery:0 "Восстановить НПЗ"
 NTR_reopen_refinery_desc:0 "Из-за неустойчивого характера своего правительства и суровых условий окружающей среды скайнавцы не смогли обеспечить постоянный приток нефти для нефтеперерабатывающего завода в Остфлое. Но старейшины клана Молтенрок заявили, что готовы возобновить его работу."
 NTR_mine_littlegriff:0 "Разработка Малогрифских гор"
 NTR_mine_littlegriff_desc:0 "Мы используем старые скайнавские шахты в Малогрифьих горах для добычи металлов."
 NTR_stratify_society:0 "Стратификация общества"
 NTR_stratify_society_desc:0 "Хоть мы и пощадили скайнавцев, мы не можем допустить их к власти. Дискриминация по расовому признаку, конечно, не вариант, особенно учитывая, что есть грифоны, веками жившие на этих землях. Нам просто нужна продуманная иерархия..."
 NTR_friendship_between_races:0 "Дружба народов"
 NTR_friendship_between_races_desc:0 "Давным-давно наши кланы объединились, забыв свои распри. Так почему же мы не можем протянуть копыто грифонам?"
 NTR_never_again:0 "Никогда снова!"
 NTR_never_again_desc:0 "Мы не допустим нового порабощения. Границы будут под бдительной охраной."
 NTR_we_are_different:0 "Мы разные..."
 NTR_we_are_different_desc:0 "Примирить различия пони и грифонов невозможно. Пусть живут обособленно под нашей мудрой властью."
 NTR_fate_of_communes:0 "Судьба коммун"
 NTR_fate_of_communes_desc:0 "Городских скайнавцев интегрировать легко, но радикальные коммуны в глухих районах — проблема посложнее."
 NTR_we_can_be_equals:0 "...но можем быть равными"
 NTR_we_can_be_equals_desc:0 "Вчерашние враги завтра могут стать друзьями. Это займёт некоторое время, но грифоны смогут жить с нами в гармонии. К тому же, наши пернатые соседи тоже могут многому нас научить"
 NTR_ice_curtain:0 "Северная Стена"
 NTR_ice_curtain_desc:0 "Линия укреплений на южной границе, дополненная горами и климатом, остановит любого врага."
 NTR_unification:0 "Объединение северян"
 NTR_unification_desc:0 "Мы освободим пони на оккупированных землях, объединив всех северян под нашей властью."
 NTR_north_ascendant:0 "Восходящий Север"
 NTR_north_ascendant_desc:0 "Победа вернула нам земли и сплотила нас. Закаленные в войне, мы преодолеем любые испытания."
 #
 NTR_final_sunset:0 "Последний закат"
 NTR_final_sunset_desc:0 "Бандиты клана Санстрайкер долго разоряли наши земли, превращая Брэнтбик в адскую дыру. Пришло время принести мир в этот горный край."
 NTR_fiana_break_knights:0 "Разгром рыцарей"
 NTR_fiana_break_knights_desc:0 "В былые времена наши земли часто становились мишенью вединских рыцарей, искавших славы. Мы не можем допустить повторения их набегов — теперь в большем масштабе. Наша безопасность — в упреждающем ударе."
 NTR_reach_out_vedina:0 "Протянуть копыто Ведине"
 NTR_reach_out_vedina_desc:0 "Хотя наши прошлые отношения не всегда были мирными, мы не позволим старым обидам определять будущее. Вместе с монархом Ведины мы установим прочный мир и отразим атаки внешних захватчиков!"
 NTR_southern_migration:0 "Южная миграция"
 NTR_southern_migration_desc:0 "С завоеванием плодородных южных земель многие северные пони решили переселиться. Следует поощрять этот процесс, выделяя земли малым кланам. Так мы создадим понийское меньшинство в новых регионах, облегчив управление."
 NTR_griffon_charter:0 "Грифонская Хартия"
 NTR_griffon_charter_desc:0 "Чтобы раз и навсегда урегулировать конфликты между пони и новыми грифонскими подданными, принцесса Фиана издаст хартию, гарантирующую справедливое обращение и расширенное самоуправление для грифонов."
 NTR_queen_of_hearts:0 "Королева сердец" 
 NTR_queen_of_hearts_desc:0 "Империя Грифонов, казалось бы обреченная, восстала из пепла. Возрожденная Империя непременно двинется на север. У нас один выбор — нанести удар, пока имперцы еще слабы."
 NTR_princess_and_emperor:0 "Принцесса и Кайзер" #Извините
 NTR_princess_and_emperor_desc:0 "Империя Грифонов возрождается, и нам грозит вторжение. Чтобы избежать кровопролития, мы принесем клятву верности Императору. Мир стоит любой цены." 
 NTR_south_sovereign:0 "Повелитель Юга"
 NTR_south_sovereign_desc:0 "Зачем управлять миллионами грифонов, если можно поручить это их знати? Им все равно, кто правит — Королева или Император — лишь бы владения оставались нетронутыми."
 NTR_princess_herzland:0 "Королева Герцланда"
 NTR_princess_herzland_desc:0 "Странные времена... пони во главе Герцланда... Наши грифоны убеждают Фиану занять трон, но ни один герцландец не примет пони на престоле Гроверов. Однако у нас есть решение..."
 NTR_born_to_rule:0 "Рождённые править"
 NTR_born_to_rule_desc:0 "Века подчинения Императору научили грифонскую знать миропорядку: в иерархии у каждого есть место — просто теперь мы на вершине."
 NTR_fate_of_emperor:0 "Судьба Императора"
 NTR_fate_of_emperor_desc:0 "С завоеванием Грифенхейма нам достался нежеланное бремя — Император-птенец Гровер VI. Хоть он всего лишь ребёнок, он всё ещё остается мощным символом для наших противников."
 NTR_northern_knights:0 "Северные рыцари"
 NTR_northern_knights_desc:0 "Грифонские рыцари славятся по всему миру. Пришло время призвать этих легендарных воинов на службу Королеве!"
 NTR_recruit_aux:0 "Грифонские вспомогательные войска"
 NTR_recruit_aux_desc:0 "Мы вправе требовать от вассалов присылать лучших воинов в нашу армию."
 NTR_remind_tribute:0 "Установить дань"
 NTR_remind_tribute_desc:0 "Наши новые герцландские подданные будут платить дань в обмен на защиту."
 NTR_capital_question:0 "Вопрос столицы"
 NTR_capital_question_desc:0 "Для лучшего управления обширными владениями некоторые предлагают перенести столицу южнее..."
 NTR_griffons_council:0 "Грифоны в Великом Совете"
 NTR_griffons_council_desc:0 "Теперь пони стали меньшинством в Объединенном Королевстве. Чтобы сохранить мир, мы должны дать грифонам представительство в Совете. Старики будут ворчать, но это единственный путь вперед."
#####
 NTR_reform_milita:0 "Реформировать наше ополчение"
 NTR_reform_milita_desc:0 "Племенные ополчения и дружины просто не могут сравниться с современной армией. Потребуются огромные усилия, но нам необходимо провести реформы, чтобы противостоять грифонским войскам."
 NTR_foreign_instructors:0 "Иностранные инструкторы"
 NTR_foreign_instructors_desc:0 "Вместо того чтобы учиться лишь на своих ошибках, мы будем перенимать чужой опыт. Надеюсь, приглашение зарубежных военных инструкторов сократит количество ошибок в процессе переобучения."
 NTR_from_warbands:0 "От дружин — к полкам"
 NTR_from_warbands_desc:0 "Первый шаг к созданию настоящей армии — отказ от старой племенной структуры дружин и замена их едиными подразделениями под командованием профессиональных офицеров, а не самых громких и сильных пони в клане, как это принято в нашем ополчении."
 NTR_copy_griffon:0 "Копировать грифонские образцы"
 NTR_copy_griffon_desc:0 "Будь то через торговлю или военные трофеи, мы заполучили множество грифонского оружия. Наши оружейники должны суметь его скопировать."
 NTR_big_guns:0 "Большие пушки"
 NTR_big_guns_desc:0 "Ружьё — это хорошо. А пушка — это просто прекрасно!"
 NTR_perils_logistics:0 "Трудности логистики"
 NTR_perils_logistics_desc:0 "Современная война — это не просто крики и атака на врага. Это сложная операция, сильно зависящая от организации снабжения. Надеюсь, мы сможем поручить это кому-то другому — пони, которые специализируются на этой... "логистике.""
 NTR_ponies_wheels:0 "Пони на колёсах"
 NTR_ponies_wheels_desc:0 "Автомобили! Грузовики! Северному воину больше не нужно стирать копыта в кровь — теперь он может ехать!"
 NTR_proper_army:0 "Настоящая армия"
 NTR_proper_army_desc:0 "Наконец-то нам удалось привить нашим ополченцам дисциплину и преобразовать их в подобие армии. Но работа ещё далека от завершения."
 NTR_our_gunsmiths:0 "Собственное оружие"
 NTR_our_gunsmiths_desc:0 "Нам больше не стоит полагаться на импортное оружие или копировать случайные образцы. Нужно поддержать наших оружейников и обеспечить их возможность снабжать нас современным вооружением."
 NTR_hide_in_metal:0 "Спрятаться в металлических коробках"
 NTR_hide_in_metal_desc:0 "Добавьте брони к машине — и получите танк! Оружие, которое несомненно изменит способ ведения войн."
 NTR_digging_trenches:0 "Копать, копать окопы"
 NTR_digging_trenches_desc:0 "С развитием военной доктрины становится ясно, что нужно уделять больше внимания обороне. Правильные укрепления позволят победить даже более сильного врага, истощив его. Так что берите лопаты и копайте окопы!"
 NTR_we_gotta_go_fast:0 "Нам нужно двигаться быстро"
 NTR_we_gotta_go_fast_desc:0 "Нам нужна скорость! Враги не смогут попасть по нам, если не сумеют догнать. Оборвав их линии снабжения и опустошив тылы, мы добьёмся победы."
 NTR_mass_production:0 "От артефактов — к массовому производству"
 NTR_mass_production_desc:0 "Мощные магические артефакты позволяли героям прошлого сражать десятки врагов одним ударом — но создание даже одного такого оружия было невероятно сложным. Вместо этого стоит сосредоточиться на массовом производстве современных маготехнических ружей и вооружить ими как можно больше пони."
 NTR_terrifying_tanks:0 "Ужасающие танки"
 NTR_terrifying_tanks_desc:0 "Мы раздавим врагов гусеницами наших танков!"
 NTR_advanced_artillery:0 "Передовая артиллерия"
 NTR_advanced_artillery_desc:0 "Один грифон сказал нам, что артиллерия — королева поля боя. Какая прекрасная фраза! Действительно, в пушках есть необъяснимая притягательность, и ради нашего блага стоит продолжать их развитие."
 NTR_everfrost_mil_college:0 "Военная академия Эверфроста"
 NTR_everfrost_mil_college_desc:0 "До сих пор наше военное обучение основывалось лишь на боевом опыте и знаниях, передаваемых старшими товарищами. Пора покончить с этим и создать настоящую школу, где молодые офицеры смогут получать профессиональную подготовку без риска быть убитыми."
 NTR_strength_in_numbers:0 "Сила в количестве"
 NTR_strength_in_numbers_desc:0 "Современные армии полагаются на подавляющую численность. Однако наше население невелико, и если мы хотим сражаться с южанами, придётся призвать ещё больше пони."
 NTR_revive_traditions:0 "Возродить наши традиции"
 NTR_revive_traditions_desc:0 "Давным-давно Стормшилды были бесстрашными рейдерами и первыми защитниками Тир Дейге. Наши пегасы были сильнейшими воинами среди пони, и ни один грифон не мог сравниться с их яростью. В эти тяжёлые времена мы должны возродить эти традиции. Вновь Стормшилды станут грозными воинами, и вновь они защитят Север!"
#
 NTR_through_skies:0 "Через небеса и моря"
 NTR_through_skies_desc:0 "Север — суровый край, где каждый день приходится бороться со стихией. Но с современными технологиями мы сможем покорить небеса и свободно бороздить моря."
 NTR_educate_shipwrights:0 "Обучить корабелов"
 NTR_educate_shipwrights_desc:0 "Пора наконец перейти от дерева к металлу и построить современные военные корабли. Конечно, сначала нужно научиться это делать..."
 NTR_expand_frostbell:0 "Расширить порт Фростбелла"
 NTR_expand_frostbell_desc:0 "Город Фростбелл может стать нашим главным центром судостроения. Но для этого придётся сначала модернизировать его портовые сооружения."
 NTR_airports_construction:0 "Построить аэродромы"
 NTR_airports_construction_desc:0 "Если мы хотим создать военно-воздушные силы, нам нужны настоящие аэродромы. Самолёты бесполезны без инфраструктуры."
 NTR_import_fighters:0 "Импортировать истребители"
 NTR_import_fighters_desc:0 "Мы пока не способны сами разработать самолёт, но можем просто купить несколько и позволить обратной инженерии творить чудеса!"
 NTR_sailing_underwater:0 "Плавать под водой?"
 NTR_sailing_underwater_desc:0 "Сначала это кажется абсурдом... Но рыбы плавают под водой — и ничего! Так почему бы и кораблям не делать то же самое? Построим железных рыб!"
 NTR_our_new_fleet:0 "Наш новый флот"
 NTR_our_new_fleet_desc:0 "Эсминцы, крейсеры... Все эти современные корабли станут основой нашего нового флота."
 NTR_make_ships_bigger:0 "Увеличить корабли!"
 NTR_make_ships_bigger_desc:0 "Говорят, что маленькое прекрасно... но большое может куда больше! По крайней мере, когда речь идёт о военных кораблях. На этом линкоре мы не пойдём на компромиссы!"
 NTR_bomber_development:0 "Разработка бомбардировщиков"
 NTR_bomber_development_desc:0 "Сбрасывать бомбы с самолётов куда эффективнее, чем с пегасов."
 NTR_improve_fighter_designs:0 "Улучшить конструкцию истребителей"
 NTR_improve_fighter_designs_desc:0 "Тщательно изучив самолёты, которые нам удалось добыть за эти годы, мы, возможно, наконец сможем разработать собственные истребители..."
 NTR_crystal_bombs:0 "Кристальные бомбы"
 NTR_crystal_bombs_desc:0 "Сочетая традиционные взрывчатые вещества с магическими кристаллами и заклинаниями, мы создали куда более мощные бомбы."
 NTR_refurbish_dinkau:0 "Модернизировать Динкау"
 NTR_refurbish_dinkau_desc:0 "Старая имперская военно-морская база Динкау долгое время оставалась без внимания Скайнавии. Нам стоит восстановить её и расширить, добавив новые доки для строительства линкоров."
 NTR_roam_the_waves:0 "Бороздить волны"
 NTR_roam_the_waves_desc:0 "Никакие грифоны, пони или морские чудовища не остановят наш новый флот!"
 NTR_new_raiders:0 "Новые рейдеры"
 NTR_new_raiders_desc:0 "Наши воинственные предки делали ставку на скорость, совершая набеги на соседей. Быстро напасть, разграбить и скрыться — такова была их тактика. Часто это выглядело как пегасы, взлетающие с кораблей и атакующие врага с воздуха. Возможно, стоит возродить некоторые из этих методов ведения войны..."
 NTR_rule_the_skies:0 "Господство в небе"
 NTR_rule_the_skies_desc:0 "Северные небеса станут нашей вотчиной. Ни один враг не посмеет вторгнуться в них, а тех, кто осмелится бросить вызов, мы уничтожим!"
 NTR_unleash_crystal:0 "Высвободить силу кристаллов"
 NTR_unleash_crystal_desc:0 "Магические кристаллы могут вызывать мощные взрывы, верно? Так что же произойдёт, если использовать по-настоящему огромные и качественные кристаллы? Надо это проверить!"
#
 NTR_world_awaits:0 "Мир ждёт нас!"
 NTR_world_awaits_desc:0 "Нам больше не место в северном углу Грифонии. Пришло время достичь величия, которого мы по-настоящему достойны!"
 NTR_send_out_diplomats:0 "Отправить дипломатов"
 NTR_send_out_diplomats_desc:0 "Мы не можем дальше оставаться в изоляции! Пора наладить связи с соседями и дальними странами, установив с ними дипломатические отношения."
 NTR_claim_destiny:0 "Исполнить нашу судьбу"
 NTR_claim_destiny_desc:0 "На юге грифоны грызутся между собой, разрушая свои же государства. Очевидно, именно нам предстоит спасти их от этого хаоса и повести к процветающему будущему — как для пони, так и для грифонов."
 NTR_reach_out_neighbours:0 "Протянуть копыто соседям"
 NTR_reach_out_neighbours_desc:0 "Может, вместо войн с грифонами стоит попробовать заключить с ними союзы? В конце концов, мы не так уж и отличаемся..."
 NTR_look_beyond_sea:0 "Взгляд за море"
 NTR_look_beyond_sea_desc:0 "Нова Грифония — старая грифонская колония на Эквусе и одна из сильнейших держав в регионе. Они стали бы прекрасным союзником! Возможно, перспектива получить плацдарм в Грифонии убедит их принять нас в Северный Блок?"
 NTR_bend_the_knee:0 "Склонить колено"
 NTR_bend_the_knee_desc:0 "Нет сомнений, что Империя Грифонов — доминирующая сверхдержава континента. У нас нет шансов против неё, и вместо этого стоит попытаться договориться, даже ценой потери свободы."
 NTR_friendship_between_ponies:0 "Дружба между пони"
 NTR_friendship_between_ponies_desc:0 "Мы могли отдалиться от остальных пони, но, возможно, они примут нас, если мы попросим? Мы все — пони, и только дружба и сотрудничество помогли нам объединить наши народы."
 NTR_march_on_brantbeak:0 "Поход на Брэнтбик"
 NTR_march_on_brantbeak_desc:0 "К югу от нас, в землях Брэнтбика, живут многочисленные грифонские кланы. Раньше мы иногда торговали с ними, но чаще они совершали набеги. Сейчас этот край заполнен бандитами, республиканцами и коммунистами. Пора навести порядок."
 NTR_reclamation_of_cloudbury:0 "Возвращение Клаудбьюри"
 NTR_reclamation_of_cloudbury_desc:0 "Веками у нас были хорошие отношения с Клаудбьюри. Некоторые из наших пони переселялись на их земли, и те не причиняли им вреда. Но теперь Клаудбьюри оказалось в лапах республиканцев, изгнавших законных правителей герцогства. Мы должны разгромить их и поставить у власти друга Эуана — Оскара Плюменьяра, как вассала Фианы."
 NTR_end_of_chivalry:0 "Конец рыцарства"
 NTR_end_of_chivalry_desc:0 "Рыцари Ведины — доблестнейшие из грифонских воинов. Хоть они веками нарушали наши границы, мы уважали их кодекс чести и боевое мастерство. Но теперь они стали угрозой для нас и соседей, и это нужно остановить."
 NTR_new_kingdom:0 "Провозгласить новое королевство"
 NTR_new_kingdom_desc:0 "После наших завоеваний мы контролируем куда больше, чем просто северные племена пони. Пришло время явить миру наше величие и занять законное место среди великих держав Грифонии!"
#
 NTR_times_changing:0 "Времена меняются,\nи мы тоже"
 NTR_times_changing_desc:0 "Слишком долго мы игнорировали внешний мир, и теперь расплачиваемся за это. Если мы хотим победить грифонов, нам нужно принять современность и как можно быстрее провести индустриализацию."
 NTR_mutual_deal:0 "Взаимовыгодная сделка"
 NTR_mutual_deal_desc:0 "Чтобы получить дивиденды, нужно сначала вложиться. Некоторые богатые бизнес-пони из Речных Земель заинтересованы в наших природных ресурсах — в обмен мы могли бы убедить их помочь нам в борьбе."
 NTR_get_rid_of_obstacles:0 "Устранить препятствия"
 NTR_get_rid_of_obstacles_desc:0 "Многие кланы всё ещё противятся нашим планам и пытаются задержать неизбежное. Главная проблема — старейшины и вожди, отказывающиеся признать реальность. К счастью, есть множество амбициозных молодых пони, которые при нашей поддержке смогут стать новыми лидерами."
 NTR_arm_refugees:0 "Вооружить беженцев"
 NTR_arm_refugees_desc:0 "Западные беженцы истощают наши и без того скудные запасы. Но многие из них жаждут мести и готовы на всё, чтобы вернуть свои дома. Мы можем направить их ярость в нужное русло — и получить мотивированных бойцов для войны."
 NTR_we_need_a_plan:0 "Нам нужен план"
 NTR_we_need_a_plan_desc:0 "Бессмысленные атаки на позиции Скайнавии ни к чему не приведут. Мы уже пробовали — это бесполезно, как биться головой о стену. Если мы хотим победить, нужен чёткий план."
 NTR_contact_smugglers:0 "Выйти на контрабандистов"
 NTR_contact_smugglers_desc:0 "Нам отчаянно нужно оружие, и, к счастью, есть множество 'честных' торговцев, готовых предоставить его — за соответствующую цену."
 NTR_skynavia_fall:0 "Скайнавия падёт!"
 NTR_skynavia_fall_desc:0 "Хотя нам не помешало бы больше времени на подготовку, если мы хотим застать Скайнавию врасплох — нужно ударить первыми!
#
 NTR_end_of_beginning:0 "Конец начала"
 NTR_end_of_beginning_desc:0 "Мы наконец разгромили социалистов Скайнавии и вернули утраченные земли. Эта победа окончательно укрепила позиции Эуана Стормшилда как фактического лидера племён. Однако нам ещё предстоит решить проблему многочисленного грифонского населения на западе."
 NTR_vengeance_forgiveness:0 "Месть или пощада"
 NTR_vengeance_forgiveness_desc:0 "Пришло время решить судьбу скайнавского руководства — точнее, того, что от него осталось..."
 NTR_issue_of_land:0 "Земельный вопрос"
 NTR_issue_of_land_desc:0 "После нашей победы изгнанники наконец могут вернуться домой... Вот только их дома теперь заняты грифонами! Эту проблему нужно решать..."
 NTR_learn_from_griffons:0 "Учиться у грифонов"
 NTR_learn_from_griffons_desc:0 "Грифоны несомненно технологически превосходят нас. Если мы хотим построить современное государство, нам нужна помощь наших новых пернатых друзей. К счастью, нам достаточно поговорить о братстве и единстве — и скайнавцы согласятся помочь. Эти идеалисты просто малыши..."
 NTR_embrace_their_idealism:0 "Принять их идеализм"
 NTR_embrace_their_idealism_desc:0 "Хотя большая часть этого... "коммунизма" — бред сумасшедших существ, нельзя отрицать, что скайнавцам удалось преодолеть внутренние разногласия и создать удивительно сплочённое общество. Переняв их идеи единства и терпимости, мы сможем легче интегрировать грифонов в нашу нацию."
 NTR_council_government:0 "От совета к правительству"
 NTR_council_government_desc:0 "Совет племён — ужасный орган управления. Нужно создать нечто новое — с настоящей бюрократией и правовой системой. Конечно, различные кланы и группы должны быть в нём представлены. Это значительно усилит наш контроль над северными землями..."
 NTR_mend_rift:0 "Залечить раскол"
 NTR_mend_rift_desc:0 "Это заняло время, но нам наконец удалось полностью интегрировать скайнавских грифонов в наше государство. Сопротивление практически исчезло, и теперь вместе мы сможем построить светлое будущее для обоих видов."
 NTR_griffon_volunteers:0 "Грифонские добровольцы"
 NTR_griffon_volunteers_desc:0 "Благодаря недавним положительным реформам число грифонов, желающих вступить в нашу армию, значительно возросло. Командование уже планирует сформировать первые полностью грифонские полки."
#
 NTR_aggressive_modernisation:0 "Агрессивная модернизация"
 NTR_aggressive_modernisation_desc:0 "Если мы хотим стать современной нацией, необходимо реформировать экономику. Опора на ремесленников и кустарей ни к чему не приведёт — нам нужна полноценная промышленность."
 NTR_progress_through_education:0 "Прогресс через образование"
 NTR_progress_through_education_desc:0 "Мы не сможем модернизироваться, если наша страна полна неграмотных крестьян, а единственные, кто умеет читать — отсталые друиды! Нужна всеобщая система образования, и немедленно!"
 NTR_fund_development:0 "Финансировать развитие"
 NTR_fund_development_desc:0 "Очевидно, что для закупки современного промышленного оборудования потребуются деньги. Надеюсь, нам удастся выжать их из пони через налоги... Хотя это может вызвать недовольство..."
 NTR_open_northern:0 "Открыть Северный проход"
 NTR_open_northern_desc:0 "Морской путь вдоль наших берегов и вокруг Полуострова Ужасов, известный как Северный проход, редко использовался из-за суровых условий и угрозы морских чудовищ. Но если сделать его безопаснее, он откроет нашу страну для торговли."
 NTR_import_modern_tech:0 "Импорт современных технологий"
 NTR_import_modern_tech_desc:0 "Иностранцы готовы продать нам столь нужные технологии в обмен на природные ресурсы. Идеальная сделка, где все остаются в выигрыше."
 NTR_northern_rail:0 "Северная железная дорога"
 NTR_northern_rail_desc:0 "Поезда — удивительное изобретение. Они перевозят больше грузов, чем даже самые сильные земные пони, и при этом не жалуются! Нам нужны такие."
 NTR_mining_operations:0 "Горнодобывающие предприятия"
 NTR_mining_operations_desc:0 "Наши земли богаты ресурсами, которые только и ждут, чтобы их добыли. Берите кирки и вперёд, кабанчики!"
 NTR_invite_merchants:0 "Пригласить купцов"
 NTR_invite_merchants_desc:0 "Свободная торговля с иностранцами принесёт нам инвестиции, богатство и — что важнее — их технологии."
 NTR_electronics_production:0 "Производство электроники"
 NTR_electronics_production_desc:0 "Богатые залежи кристаллов позволяют нам стать ключевым производителем электроники в Грифонии. Наши устройства, возможно, не такие прочные как продукты 'Локии', зато будут дешевле!"
 NTR_coal_and_steam:0 "Уголь и пар"
 NTR_coal_and_steam_desc:0 "Электричество! Без него не будет промышленности. К счастью, у нас есть уголь, а горячие источники, по словам инженеров, можно использовать для "геотермальной энергии." Звучит заманчиво!"
 NTR_foreign_arms_producers:0 "Иностранные оружейники"
 NTR_foreign_arms_producers_desc:0 "Нашей армии нужно современное оружие. Иностранцы производят его в избытке и готовы продавать. Нужно ли продолжать?"
 NTR_kickstart_urbanisation:0 "Запустить урбанизацию"
 NTR_kickstart_urbanisation_desc:0 "Растущей промышленности нужны рабочие, а значит — расширение городов. Это дорого, но необходимо."
 NTR_greenhouse_agriculture:0 "Тепличное сельское хозяйство"
 NTR_greenhouse_agriculture_desc:0 "Чтобы прокормить растущее население, нужны современные методы земледелия. Новые культуры и геотермальные теплицы позволят выращивать пищу круглый год."
 NTR_from_forge:0 "От кузницы к промзоне"
 NTR_from_forge_desc:0 "Святой Горн превращается в крупнейший промышленный центр всего Севера. Нужно поддержать Молтенроков в развитии их столицы."
 NTR_dawn_of_modern_age:0 "Заря современной эпохи"
 NTR_dawn_of_modern_age_desc:0 "Теперь мы не зависим от иностранцев! Наши учёные постигают тайны природы, и будущее принадлежит нам!"
 NTR_flames_of_north:0 "Пламя Севера"
 NTR_flames_of_north_desc:0 "Фабрики растут как грибы! Но чтобы соперничать с южными державами, предстоит ещё многое сделать."
 NTR_modern_nation:0 "Современная страна"
 NTR_modern_nation_desc:0 "Мы сделали это. После долгих лет усилий мы догнали грифонов. Нас больше не называют дикарями — теперь они восхищаются нашим успехом. Экономика растёт, и мы пожинаем плоды."
 NTR_gold_profits:0 "Прибыль от золотых рудников"
 NTR_gold_profits_desc:0 "Эксплуатация золотых рудников Брэнтбика приносит солидный доход."
 NTR_modern_mining_equipment:0 "Современное горное оборудование"
 NTR_modern_mining_equipment_desc:0 "Время кирок и лопат прошло — теперь наши шахтёры используют буры и экскаваторы."

#####
NTR_cold_hearted:0 "Холодное сердце"
NTR_cold_hearted_desc:0 "Если мы хотим выжить, у нас нет другого выбора. Надеюсь только, что я не обрёк своих собратьев. Но теперь уже слишком поздно сожалеть."
NTR_reclaim_holy_forge:0 "Вернуть Священную Кузню"
NTR_reclaim_holy_forge_desc:0 "Формовщики металла из клана Молтенрок — одни из самых ярых сторонников Эуана Стормшилда, но теперь они открыто отказываются признавать нашу власть. С ними нужно разобраться."
NTR_convince_them:0 "Убедить их"
NTR_convince_them_desc:0 "Хотя многие присоединились к нам, многочисленные более мелкие и традиционно настроенные кланы всё ещё не присягнули на верность Кругу Льда. Нам нужно объединить кланы, если мы хотим победить грифонов – здесь нет места разногласиям."
NTR_deal_with_stormshields:0 "Договориться со Стормшилдами"
NTR_deal_with_stormshields_desc:0 "Клан Стормшилд хотел продать нас грифонам, заставить отказаться от нашего образа жизни и стать подобными презренным птицам. Они всё ещё сопротивляются нам. Поэтому их нужно наказать за свои действия – иначе они продолжат подрывать нашу власть."
NTR_solidify_control:0 "Укрепить наш контроль"
NTR_solidify_control_desc:0 "Племена едины как никогда прежде – наши враги либо изгнаны, либо мертвы, пришло время двигаться к нашей конечной цели. Это будет нелегко, но с нашими вновь обретёнными силами мы добьёмся успеха."
NTR_demand_more:0 "Потребовать большего от ремесленников"
NTR_demand_more_desc:0 "У нас нет того, что чужаки называют "промышленностью", вместо этого мы полагаемся на ремесленников и мастеров. Теперь всем этим пони придётся работать усерднее, чем прежде, чтобы обеспечить нас товарами, необходимыми нашим живым воинам."
NTR_prepare_defensive:0 "Подготовить линию обороны"
NTR_prepare_defensive_desc:0 "Без сомнения, скайнавцы поймут, что мы задумали – у них более чем достаточно магов, которые чувствуют растущую мощь нашего заклинания, – и сделают всё возможное, чтобы остановить нас. Нам нужно сдерживать их армию достаточно долго, чтобы завершить ритуал."
NTR_dark_magic:0 "Тёмная магия"
NTR_dark_magic_desc:0 "За связь с тёмными силами всегда приходится платить высокую цену, но результат того стоит. Духи не смогли нас спасти, поэтому мы должны взять всё в свои копыта."
NTR_subordinate_clans:0 "Возглавить кланы"
NTR_subordinate_clans_desc:0 "До сих пор каждый клан сражался со Скайнавцами в одиночку. Если мы хотим победить, они должны стать единой силой под началом одного хозяина – все лидеры кланов должны подчиняться приказам верховного друида."
NTR_support_weaponsmiths:0 "Поддержать оружейников"
NTR_support_weaponsmiths_desc:0 "Нам нужны мечи, щиты и огнестрельное оружие, чтобы сражаться с мерзкими грифонами. Мы окажем нашим оружейникам всю необходимую помощь для производства большего количества оружия для предстоящей войны."
NTR_wisdom_of_circle:0 "Мудрость Круга"
NTR_wisdom_of_circle_desc:0 "Друиды всегда были одними из самых мудрых и образованных пони в Тир Дейге. Пришло время воспользоваться ими – применить наши знания для создания нового оружия для войны с грифонами."
NTR_unleash_blizzard:0 "Выпустить метель"
NTR_unleash_blizzard_desc:0 "Ритуал начнётся, как только закончится подготовка. Конечно, скайнавцы сделают всё возможное, чтобы остановить нас, ведь это их последний шанс."
NTR_learn_from_mistakes:0 "Учиться на ошибках прошлого"
NTR_learn_from_mistakes_desc:0 "Двадцать лет мы не могли дать отпор Скайнавцами. Если мы хотим победить, крайне важно извлечь уроки из прошлых сражений и соответствующим образом скорректировать нашу стратегию."
NTR_study_captured_eq:0 "Изучить захваченное снаряжение"
NTR_study_captured_eq_desc:0 "Нет ничего постыдного в том, чтобы учиться у врага, поэтому мы обратим оружие грифонов против них."
NTR_raise_warriors:0 "Поднять больше воинов!"
NTR_raise_warriors_desc:0 "Армия Скайнавцев гораздо лучше вооружена, чем наша, поэтому единственный способ победить их — затопить их бесчисленным количеством воскрешённых воинов."
NTR_hold_line:0 "Держать строй!"
NTR_hold_line_desc:0 "Ещё немного – наша победа близка!"
NTR_we_need_more:0 "Нам нужно больше оружия!"
NTR_we_need_more_desc:0 "Больше оружия для наших воинов! Работайте усерднее ради нашего общего дела, пони Севера!"
NTR_ruins_of_sky:0 "Руины Скайнавии"
NTR_ruins_of_sky_desc:0 "Преступник всегда возвращается на место преступления..."
NTR_north_awakens:0 "Север пробуждается"
NTR_north_awakens_desc:0 "Пони Севера восстанут и займут своё законное место в мире! Никто не сможет нас остановить!"
#
NTR_scavange_ruins:0 "Обыскать руины"
NTR_scavange_ruins_desc:0 "Руины Новой Скайнавии полны полезных предметов, которые нам стоит найти – мёртвым грифонам они всё равно не нужны."
NTR_return_to_homeland:0 "Вернуться на родину"
NTR_return_to_homeland_desc:0 "После вторжения грифонов многие кланы бежали на восток. Теперь, когда Скайнавцы ушли, они наконец могут вернуться и вернуть свои исконные земли."
NTR_protect_borders:0 "Защитить наши границы"
NTR_protect_borders_desc:0 "Мы не можем позволить чужеземцам свободно бродить по нашей земле и заражать наших пони опасными идеями. Мы должны ограничить контакты с ними, чтобы сохранить наш образ жизни."
NTR_fallen_gods:0 "Падшие боги"
NTR_fallen_gods_desc:0 "Духи оказались слабы и теперь отвернулись от нас. Они не смогли защитить пони и, следовательно, не заслуживают поклонения. Северу нужен новый бог... Тот, кто приведёт своих подданных к величию."
NTR_warrior_lodges:0 "Воинские дружины"
NTR_warrior_lodges_desc:0 "Дружины были основной формой организации северных воинов на протяжении веков. Поддерживая их, мы можем создать отряд воинов, всегда готовых к новым завоеваниям и готовых следовать за Морозным Королём в любой войне."
NTR_raise_dead:0 "Воскресить мёртвых"
NTR_raise_dead_desc:0 "Оставлять все эти тела лежать где попало — просто расточительство..."
NTR_recover_materials:0 "Добыть материалы"
NTR_recover_materials_desc:0 "В разрушенных зданиях Новой Скайнавии можно найти много полезных строительных материалов."
NTR_whole_again:0 "Снова вместе"
NTR_whole_again_desc:0 "Убив или поработив всех грифонов, мы полностью восстановили контроль над западными землями. Но многое ещё предстоит сделать, ведь нам предстоит отомстить грифонам Юга."
NTR_expand_circle:0 "Расширить Круг"
NTR_expand_circle_desc:0 "Друиды Круга Льда станут предвестниками могущества Морозного Короля, исполнителями его воли. Те, кто не последует за ним, умрут. Остальные будут править от его имени и направлять пони Севера."
NTR_elevate_druids:0 "Возвысить друидов"
NTR_elevate_druids_desc:0 "Друиды всегда отвечали за сохранение знаний и изучение тайн магии. Большинству наших пони не нужны "современные" технологии, и они предпочитают придерживаться старых обычаев. Поэтому друиды будут ответственны за создание оружия, чтобы победить наших врагов."
NTR_chosen_of_ice:0 "Избранные Льда"
NTR_chosen_of_ice_desc:0 "Мы поделимся нашей магической силой с самыми достойными воинами – они станут Избранными Морозного Короля, его самыми верными слугами и предвестниками гибели рода грифонов."
NTR_reclaim_dinkau:0 "Вернуть Динкау"
NTR_reclaim_dinkau_desc:0 "Небольшой городок Динкау — старая имперская военно-морская база. Мы поработим его жителей и захватим корабли, стоящие там. Изучая их, мы сможем дать старт разработке наших собственных боевых кораблей."
NTR_study_left:0 "Изучить то, что осталось"
NTR_study_left_desc:0 "В лабораториях, на заводах и в чертежах, оставленных мёртвыми грифонами, хранятся бесценные знания. Теперь мы обратим их же технологии против них и используем их же инструменты, чтобы победить их!"
NTR_total_reparations:0 "Подготовка к тотальной войне"
NTR_total_reparations_desc:0 "Нам предстоит великая задача: отомстить южанам и сделать пони законными правителями Грифонии. Это будет война, непохожая ни на одну из прежних, и мы должны подготовиться соответствующим образом."
NTR_slave_economy:0 "Рабская экономика"
NTR_slave_economy_desc:0 "Хотя большинство скайнавцев погибло, многие из тех, кто жил за пределами столицы, выжили. Мы поработим их, и то же самое сделаем со всеми остальными грифонами, которых покорим, — такова будет судьба грифоньего рода."
NTR_take_magic:0 "Поделиться магией"
NTR_take_magic_desc:0 "Друиды, оставшиеся без сил после смерти последней из династии Сноуфлэйков, стекались к своему новому правителю за помощью. Морозный Король проявит щедрость к своим подданным и поделится с ними своей магией."
NTR_undead_hordes:0 "Орды нежити"
NTR_undead_hordes_desc:0 "У нас практически безграничный запас трупов, которые мы можем воскресить и отправить сражаться за нас. Возможно, стоит сосредоточиться на усилении наших воскрешённых воинов и использовать их в качестве основной боевой силы."
NTR_elite_warriors:0 "Элитные взводы"
NTR_elite_warriors_desc:0 "Воинам-нежити не хватает... страсти. Они всего лишь ожившие трупы – живые, дышащие воины всегда будут превосходить их. Хотя наша армия по-прежнему будет состоять в основном из нежити, отряды элитных, живых воинов станут нашей основной боевой силой."
NTR_construct_navy:0 "Создать флот"
NTR_construct_navy_desc:0 "Раньше нам никогда не требовались полноценные военно-морские силы, но если мы хотим сражаться с грифонами, нам нужно обеспечить безопасность наших вод. Мы можем использовать остатки военно-морской базы Динкау для создания верфи."
NTR_refurbish_ostfloy:0 "Перезапустить остфлойский НПЗ"
NTR_refurbish_ostfloy_desc:0 "Скайнавцы обнаружили крупное месторождение нефти в Остфлое, однако суровые погодные условия помешали им непрерывно его разрабатывать. К счастью, нежить устойчива к холоду, и немногие выжившие инженеры-грифоны помогут нам запустить насосы – в обмен на сохранение их жизней."
NTR_break_knights:0 "Разбить рыцарей"
NTR_break_knights_desc:0 "Рыцари Ведины — одна из самых больших угроз нашей гегемонии. Мы сокрушим их и обратим этих закованных в броню крестьян-грифонов в рабство к их новым хозяевам, как и всех остальных."
NTR_crush_dream:0 "Уничтожить мечту"
NTR_crush_dream_desc:0 "Именно из Республики Грифонов пришли захватчики Скайнавии. Они наверняка нанесут новый удар, если им представится шанс — мы должны действовать первыми и уничтожить республиканцев!"
NTR_revenge_sunstriker:0 "Месть Санстрайкеру"
NTR_revenge_sunstriker_desc:0 "Грифоны Брэнтбика нападали на наши земли поколениями. Надо положить этому конец. Мы обрушимся на их земли, словно снежная буря, и уничтожим кланы грифонов, живущие там."
NTR_die_in_glory:0 "Мы умрём славно!"
NTR_die_in_glory_desc:0 "Погибшие в нашем великом крестовом походе будут помниться как герои Севера. Наши враги многочисленны, но это лишь сделает нашу победу ещё более славной."
NTR_gun_every_hoof:0 "Оружие в каждом копыте"
NTR_gun_every_hoof_desc:0 "Неважно, живы наши воины или мертвы, им нужно оружие, поэтому нам нужно оптимизировать и централизовать процесс его производства, чтобы обеспечить нашу армию достаточным количеством оружия."
NTR_ascension:0 "Вознесение"
NTR_ascension_desc:0 "Все грифоны Севера покорены. Теперь пришло время Морозному Королю занять своё законное место..."
#
NTR_the_slaves:0 "Рабы"
NTR_the_slaves_desc:0 "После недавних завоеваний мы повелеваем миллионами грифонов. Нет сомнений, что эти существа созданы для рабства, но для эффективного управления такой большой популяцией нам необходимо скорректировать нашу политику по отношению к ним."
NTR_twist_model:0 "Извращение вединской модели"
NTR_twist_model_desc:0 "Вединские грифоны хорошо понимали, что сильный должен править слабым, и их феодальное государство идеально подходило для этой цели. Мы перенимем их подход, создав систему, в которой нашим воинам будут предоставлены земли, которыми они будут править, и грифоны, которых они будут держать в подчинении."
NTR_blood_iron:0 "Кровь и железо"
NTR_blood_iron_desc:0 "Грифоны будут работать до смерти. Они всего лишь рабы, живущие ради создания оружия для нашей армии. Промышленность, созданная грифонами, создаёт прекрасные возможности и даёт нам несколько идей о том, как эффективно управлять нашими рабами..."
NTR_our_hounds:0 "Наши гончие"
NTR_our_hounds_desc:0 "Лучшие охотники на грифонов — другие грифоны. Мы позволим некоторым из наших рабов насладиться чуть большей "свободой" в обмен на службу в отрядах, призванных подавлять инакомыслие, охотиться на мятежников и беглых рабов. Таким образом, грифоны будут убивать грифонов и ненавидеть друг друга, а не нас."
NTR_encourage_scientists:0 ""Поощрить" учёных"
NTR_encourage_scientists_desc:0 "Удивительно, на что готово существо, чтобы не оказаться в кристальных шахтах... Если их как следует "поощрить", учёные-грифоны с радостью соглашаются работать на нас, разрабатывая оружие, которое мы обратим против них."
NTR_cloudbury_slaves:0 "Рабский город Клаудбьюри"
NTR_cloudbury_slaves_desc:0 "Город Клаудбьюри — крупнейший и наиболее промышленно развитый из завоёванных нами земель. Мы ещё больше расширим его фабрики и отправим туда грифонов трудиться."
NTR_the_undead:0 "Нежить"
NTR_the_undead_desc:0 "Чтобы реализовать наши великие планы, нам нужно больше воинов, а пони на Севере просто не хватает. К счастью, у нас более чем достаточно тел, а нежить уже доказала свою силу."
NTR_raise_more:0 "Поднять ещё больше"
NTR_raise_more_desc:0 "Есть простое решение любой проблемы на поле боя — использовать больше солдат."
NTR_increase_autonomy:0 "Повысить автономность"
NTR_increase_autonomy_desc:0 "Наделяя наших воинов-нежити более мощной магией, мы можем сделать их сильнее и, что ещё важнее, способными мыслить, а не просто бездумно выполнять приказы. Это сделает отряды нежити гораздо более гибкими на поле боя."
NTR_back_into_ranks:0 "Вернуть трупы в строй"
NTR_back_into_ranks_desc:0 "Те, кто пали, сражаясь за Морозного Короля, никогда по-настоящему не умирают. Они восстают, благословлённые его магией, чтобы продолжать сражаться. Даже самые тяжёлые раны не остановят наших воинов!"
NTR_the_champ:0 "Чемпион"
NTR_the_champ_desc:0 "Даже богу нужны полководцы, чтобы вести своих воинов. Сотни лет назад Лахлан Грифоноубийца, прославленный военачальник и налётчик, сеял хаос в землях грифонов. В конце концов он был побеждён и похоронен в Ведине. Мы воскресим его и сделаем генералом наших армий."
NTR_undead_overseers:0 "Неживые надзиратели"
NTR_undead_overseers_desc:0 "Пони лучше грифона, даже если этот пони мёртв. Мы будем использовать наших гораздо более мертвецов для надзора за рабами-грифонами. Грифоны, несомненно, будут работать гораздо усерднее, зная, что их хозяева не знают ни страха, ни жалости и всегда следят за ними!"
NTR_the_heart:0 "Сердце Грифоньего рода"
NTR_the_heart_desc:0 "Пришло время нанести удар на юг, двинуться прямиком в Герцланд. С их падением мы окончательно установим пони как правители континента, а грифонов — как наших рабов. Однако мы должны быть осторожны. Без сомнения, даже вечно враждующие герцландские грифоны объединятся перед лицом смертельной опасности..."
NTR_no_rest:0 "Нет покоя грешникам"
NTR_no_rest_desc:0 "Ничто и никто не мог нас остановить, и мы одержали победу над презренными грифонами. Теперь нам нужно укрепить наш контроль над Герцландом."
NTR_the_spoils:0 "Добыча"
NTR_the_spoils_desc:0 "Победителю достанется добыча. Пони разграбят земли грифонов; каждый воин получит свою долю богатств, и всё же мы получим достаточно добычи, чтобы подготовиться к будущим войнам."
NTR_reach_out_southern:0 "Обратитесь к южным кланам"
NTR_reach_out_southern_desc:0 "К югу от нас, в горах на границе грифонов, живут многочисленные кланы пони, большинство из которых птицы не пытались испортить, и они продолжают жить так же, как и их предки. Мы примем наших южных братьев и дадим им место в новом мировом порядке..."
NTR_salvage_guns:0 "Восстановить оружие"
NTR_salvage_guns_desc:0 "От побеждённых грифонов осталось много оружия. Некоторое из него могут починить и использовать наши войска."
NTR_steal_knowledge:0 "Украсть знания"
NTR_steal_knowledge_desc:0 "Технологии грифонов гораздо более развиты, чем наши. Лучший способ превзойти их — это добыть все чертежи и схемы, которые сможем, и разграбить оставшиеся исследовательские центры на Юге."
NTR_send_to_mines:0 "Отправить их на рудники"
NTR_send_to_mines_desc:0 "Горы Уайттейл полны ценных ресурсов, а у нас слишком много военнопленных, нарушителей спокойствия и, в целом, слишком много грифонов. Мы решим эту проблему, отправив их всех на рудники."
NTR_strip_air:0 "Разобрать аэродромы"
NTR_strip_air_desc:0 "Самолёты — прекрасное орудие разрушения. Копируя самолёты, оставленные грифонами, мы сможем быстро создать собственные военно-воздушные силы."
NTR_unleash_wrath:0 "Дать волю нашему гневу"
NTR_unleash_wrath_desc:0 "Эти презренные грифоны осмелились восстать против Морозного Короля! Пришло время наказать их как следует и гарантировать, что они больше никогда не смогут противостоять нашей власти."
NTR_destroy_city:0 "Уничтожить Вечный город"
NTR_destroy_city_desc:0 "Ромау — второй по величине город Герцланда, культурный центр и резиденция архонта Эйр... Чтобы сломить грифонов, мы сожжём город дотла и перебьём всех его жителей."
NTR_griffenheim_burn:0 "Грифенхейм в огне"
NTR_griffenheim_burn_desc:0 "Грифенхейм — сердце грифоньего рода, крупнейший город грифонов и резиденция их императоров, город, которому вся Грифония завидует и который все желают захватить. В этом богомерзком поселении также началось восстание против Морозного Короля. Его уничтожение станет последним гвоздем в гроб герцландского восстания."
NTR_purge_herz:0 "Очистить Герцланд"
NTR_purge_herz_desc:0 "После подавления восстания нам нужно искоренить все его следы. Мы заставим грифонов покориться и убьём всех нарушителей до последнего. Честно говоря, у нас слишком много рабов, чтобы эффективно их контролировать, поэтому сокращение их численности — разумный выбор."
NTR_raise_slain:0 "Воскресить павших"
NTR_raise_slain_desc:0 "Во время завоевания Герцланда наши воины убили тысячи грифонов. Мы воскресим этих отвратительных тварей и отправим их сражаться с их братьями и сёстрами."
NTR_force_harder:0 "Заставим их работать усерднее"
NTR_force_harder_desc:0 "Мы заставим наших рабов работать ещё усерднее! Нам понадобится всё оружие, которое они смогут произвести, чтобы выиграть эту войну. Если кто-то из них погибнет... Что ж, это не такая уж большая потеря, у нас достаточно рабов, чтобы заменить их!"
NTR_fools_traitors:0 "Дураки и предатели"
NTR_fools_traitors_desc:0 "Во время наших завоеваний мы получили огромное количество золота и других благ, которые нам ни к чему. К счастью для нас, идиотов-грифонов и жадных иностранных пони, готовых продать своё оружие за несколько золотых, более чем достаточно."
NTR_mobilise_all:0 "Мобилизовать всех"
NTR_mobilise_all_desc:0 "Несмотря на все наши усилия, грифоны каким-то образом побеждают! Нам нужно больше воинов, поэтому мы должны мобилизовать всех пони, которых сможем. Конечно, мы не можем поддерживать такой темп призыва слишком долго, иначе мы рискуем полностью потерпеть крах."
NTR_riverfed_trade:0 "Северная торговля"
NTR_riverfed_trade_desc:0 "Пони Тир Дейге выполнили своё обещание, и мы пользуемся выгодными условиями торговли с ними."
NTR_coalition_ties:0 "Связи с коалицией"
NTR_coalition_ties_desc:0 "Торговые соглашения, сотрудничество в исследованиях и помощь, предоставляемая Речными землями, значительно улучшили нашу страну."
NTR_symbol_of_power:0 "Символы власти"
NTR_symbol_of_power_desc:0 "Каждый раз, когда грифон осмеливается поднять голову, он должен знать, что сопротивление бесполезно. Мы создадим вечные символы нашего владычества, крепости невероятных размеров, чтобы напоминать грифонам, что они — всего лишь прах под нашими копытами."
NTR_stock_slave_mines:0 "Рабские шахты"
NTR_stock_slave_mines_desc:0 "С новым изобилием рабов мы столкнулись с проблемой нехватки рабочих мест. Решение простое: мы будем использовать их в качестве расходного материала на наших шахтах. Таким образом, мы сможем и обеспечить нашу промышленность большим количеством полезных ископаемых, и сократить число рабов."
NTR_dark_gift:0 "Тёмный дар"
NTR_dark_gift_desc:0 "Даже самый могущественный правитель не может править в одиночку. В рядах нашей армии много достойных воинов и колдунов, и пришло время вознаградить их верную службу силами, немыслимыми для простых смертных."
NTR_bring_down_the_sky:0 "Обрушить небо"
NTR_bring_down_the_sky_desc:0 "Нет более великого памятника порочной природе грифоньего рода, чем Скайфол. Город, где эти жалкие создания живут лишь ради того, чтобы раздобыть побольше золотых монет, предавая друг друга и паразитируя на своих столь же жалких собратьях. Эти жалкие стяжатели скоро увидят наше могущество."
NTR_extinguish_the_light:0 "Погасить огни"
NTR_extinguish_the_light_desc:0 "Далее на юге лежит Аквелия, проклятая земля, которую презренные грифоны делят с худшими из наших сородичей. Похоже, это место порождает только предателей и трусов, как пони, отступивших от своих путей, так и грифонов, снова и снова предававших своих правителей. Пришло время положить конец этому крысиному гнезду!"
NTR_the_last_crusade:0 "Последний крестовый поход"
NTR_the_last_crusade_desc:0 "Много поколений назад армии императора грифонов Гровера II начали свои "крестовые походы" против пони Востока. Пришло время освободить эти земли от когтей рыцарей-грифонов и их союзников-пони, которые безрассудно пытались стать похожими на своих хозяев."
NTR_turn_rumare_red:0 "Окрасить озеро Румейр кровью"
NTR_turn_rumare_red_desc:0 "Колыбель Грифоньего рода обратится в могилу. Её слабые, враждующие нации падут одна за другой, а наше продвижение на юг продолжится."
NTR_new_purpose:0 "Новая цель"
NTR_new_purpose_desc:0 "Стратегическое расположение, процветающая промышленность и изобилие рабов — у Скайфолла явно есть потенциал стать важным звеном нашей военной машины. Хотя мы ещё не решили, как именно он будет нам наиболее полезен."
NTR_griffon_stain:0 "Очистить Аквелию"
NTR_griffon_stain_desc:0 "Пони Аквелии — самые мерзкие создания из всех, пони, забывшие свои корни и ставшие бесклювыми грифонами. Если мы позволим им продолжать своё существование, они, несомненно, захотят свергнуть Морозного Короля и отравить разум наших подданных. С ними нужно покончить раз и навсегда."
NTR_tribute:0 "Дань"
NTR_tribute_desc:0 "Завоёванные нами земли изобильны, полны богатств и грифонов, которые явно их не заслуживают. Мы разграбим эти земли и заставим грифонов обеспечивать нас всеми необходимыми нам товарами. В конце концов, каждый завоеватель имеет право эксплуатировать тех, кого он завоевал."
NTR_fan_hatred:0 "Раздуть их ненависть"
NTR_fan_hatred_desc:0 "Пони Вартая долго страдали под властью рыцарей-грифонов. Мы должны найти среди них тех, кто будет более чем готов присоединиться к нашему делу и сражаться с грифонами. Они с радостью помогут нам контролировать этот далёкий край."
NTR_the_pyre:0 "Погребальный костёр"
NTR_the_pyre_desc:0 "Город на дереве Грифонстоун. Есть ли более подходящий погребальный костёр для злобного рода грифонов?"
NTR_delenda_est:0 "Delenda Est"
NTR_delenda_est_desc:0 "Карфиния, земля первых цивилизаций грифонов, падет последней. Их древняя история и воинское мастерство не спасут их. Южане будут повержены, как и все, кто был до них."
NTR_tame_valley:0 "Укротить долину"
NTR_tame_valley_desc:0 "Пришло время вторгнуться в самый отдалённый уголок грифонов, долину Эви. Её народы слабы и разобщены и станут лёгкой добычей. Скоро рисовые поля долины будут удобрены трупами грифонов!"
NTR_the_solstice:0 "Солнцестояние"
NTR_the_solstice_desc:0 "Грифоны повержены, и никто не может противостоять Морозному Королю. Пока его могущество находится в зените, наше господство над Грифонией будет вечным!"

## Order Of Battle ##
NTR_raised_warriors_OOB:0 "Восставшие воины"
 NTR_gavin_undead_OOB:0 "Воины-нежить"

### Events ###
ntribes.01.t:0 "Последняя в своём роду"
 ntribes.01.d:0 "Когда Фиана была маленькой, она любила играть в лабиринте коридоров Дворца Сноуфлэйков. Поколение за поколением, он расширялся – как вдоль, так и поперек – чтобы показать славу династии севера. Семь хрустальных башен возвышались значительно выше похожих сооружений в Эверфросте, не без оснований известном как Город хрустальных шпилей. Однако теперь Дворец казался... пустым. Не то что бы здесь не было других пони. Вовсе нет – тут и там несла караул королевская стража, библиотекари ухаживали за обширной коллекцией книг и многочисленные слуги называли это место своим домом. Однако, за исключением нескольких старых служанок, у Фианы не было никого, кому она могла бы доверить свои страхи и сомнения. Ее мать умерла давным-давно, сраженная болезнью, а отец и братья погибли на войне с проклятыми скайнавцами... Когда много лет назад ее, последнюю из Сноуфлэйков, – тогда еще просто испуганную кобылку – короновали, она еще не знала, какое бремя легло на ее плечи. Она старалась изо всех сил, но, похоже, все ее попытки провалились. Грифоны медленно побеждали, и она ничего не могла сделать, чтобы остановить их. Каждый день она прислушивалась к просьбам пони, пытаясь уладить споры между кланами, но с течением времени все меньше и меньше существ интересовались ее мнением. Они всё больше слушали Эуана Стормшилда и его друга-грифона Оскара Плюменьяра. Она не имела ничего личного против Оскара. Он много лет прожил среди пони, уважая их обычаи, и умел очаровывать окружающих. Но Эуан использовал его, чтобы проповедовать о том, что северные пони должны жить как грифоны. Неужели он был прав? Возможно, старые методы ее отца и бесчисленных предков действительно потерпели неудачу? Сомнения, бесконечные сомнения... Предстоящий Великий Совет будет судьбоносным – она это чувствовала. Её поддержка будет решающей..."
 ntribes.01.a:0 "...но сможет ли она сделать правильный выбор?"
 ntribes.02.t:0 "Запрещённые знания"
 ntribes.02.d:0 "Жрецы Льда редко посещали Дворец Сноуфлэйков. Они предпочитали оставаться в своих ледяных склепах, покидая их лишь в случае крайней необходимости. Поэтому было особенно странно, когда архидруид Гэвин Морозная Борода лично явился в столицу и потребовал аудиенции. Этот пони был... древним: хрупкий, с седой, как иней, бородой, он выглядел так, будто является ровесником самого дворца, а слухи о его возрасте варьировались от девяноста до трёхсот лет. Несмотря на это, он двигался на удивление проворно,\n\n— Принцесса Фиана... — друид слегка склонил голову, приближаясь к трону.\n\n— Архидруид Гэвин, рада видеть вас в столице... Принесите почтенному Гэвину кресло! — приказала она слугам. Друид опустился на поданное кресло с облегченным вздохом,\n\n— Благодарю, Ваше Высочество. Мои колени уже не те, что прежде... Но не суть, перейдём к делу. Мы, в Круге Льда, знаем, насколько тяжёлое положение сложилось, и, возможно, у нас есть решение ваших проблем. Один из моих учеников недавно обнаружил карту, которая может привести нас к Склепу Разломанных Мечей...\n\n— Разве не там погребены Короли Метели, побеждённые моим предком, вместе со своими армиями? — прервала его Фиана.\n\n— Именно так, Ваше Высочество! — Гэвин тепло улыбнулся. — Если бы больше молодых пони интересовались историей... Но, к сути: вы, наверное, знаете, о какой силе Королей Метели идёт речь и как они сокрушали целые армии грифонов, пытавшихся завоевать наши земли...\n\n— Я также знаю, что эта сила поглотила их, и они стали править как тираны. Именно мой предок положил конец их владычеству и освободил племена, — ответила принцесса.\n\n— Да, это печально. — Старый пони кивнул. — Но я изучал легенды всю жизнь и уверен: их погубила не сама сила, а тьма в их сердцах. Нынешние обстоятельства требуют того могущества, которым владели наши предки, принцесса. А когда война закончится, мы снова упокоим древнее знание там, где нашли.\n\nФиана ненадолго задумалась. Она помнила эти сказания - о пони, чьи сердца превратились в лёд, о героях, ставших кровожадными тиранами. Но ведь именно они когда-то отразили существ - и смертных, и сверхъестественных, - угрожавших самому существованию её народа.\n\nИ потом... она знала архидруида. Он являлся другом её отца и всегда был добр к ней. Ему можно было доверять... Наверное."
 ntribes.02.a:0 "— Пожалуйста, будьте осторожны..."
 ntribes.02.b:0 "— Это слишком рискованно, Архидруид!"
 ntribes.07.t:0 "Сон"
 ntribes.07.d:0 "Небо потемнело. Начиная с востока, оно медленно превращалось из привычной синевы в почти кромешную тьму — темнее, чем даже во время летних гроз... Что-то приближалось — что-то, отчего Фиана дрожала от страха. Она огляделась, но укрыться было негде — вокруг, до самого горизонта, простиралась лишь плоская ледяная пустошь. Она не могла пошевелиться, парализованная ужасом перед тем, что надвигалось...\n\nВеликая метель, неудержимая сила, приближающаяся с востока, была все ближе, и единственное, что она могла сделать — это стоять и смотреть.\n\nОна проснулась как раз в тот момент, когда метель накрыла ее. Как и многие предыдущие ночи, эта принесла ей новый кошмар. В последнее время они становились все хуже, а чувства тревоги и ужаса возвращались даже днем. Многие друиды обращались к ней, утверждая, что что-то не так. Духи были разгневаны и... напуганы. Это влияло на тех, кто был восприимчив к их воздействию. А как член клана Сноуфлэйк, её связь с северными духами была особенной.\n\nНо что могло вызвать это беспокойство? Ее мысли обратились к архидруиду Гэвину. Прошли уже недели с тех пор, как он отправился к Склепу Разломанных Мечей с несколькими учениками, и никаких вестей о том, что с ними случилось, не поступало. Возможно, было плохим решением позволить ему уйти... Единственное, что она могла сделать сейчас — это ждать — никто, кроме архидруида и его учеников, не знал пути к давно забытым склепам..."
 ntribes.07.a:0 "Это ведь... просто кошмары, да?"
 ntribes.06.t:0 "Заблудший друид"
 ntribes.06.d:0 "Мы только что получили известие, что Архидруид Гэвин, вопреки запрету Принцессы, направился на восток к Склепу Разломанных Мечей с группой наиболее верных учеников. Благоразумные Члены Круга Льда, несогласные с Гэвином, решили предупредить нас об этом развитии событий. С их помощью мы сможем выследить архидруида и предотвратить высвобождение тех тёмных сил, что погребены в этом проклятом месте."
 ntribes.06.a:0 "Собрать воинов!"
 ntribes.08.t:0 "Склеп Разломанных Мечей"
 ntribes.08.d:0 "Если бы не Скорча, у них не было бы ни малейшего шанса найти Склеп Разломанных Мечей среди заснеженных скал горного склона. Неожиданная метель скрыла следы, оставленные Гэвином и его учениками, сделав традиционные методы поиска бесполезными. К счастью, молодая друидка смогла ориентироваться по едва заметным символам, что были оставлены строителями Склепа.\n\nМного часов отряд воинов пробирался по длинной долине. Несмотря на то, что это были закаленные в двадцатилетней войне с грифонами ветераны, они всё же жались друг к другу... В этом богом забытом месте было что-то не так, хотя они не могли сказать, что именно. Казалось, сама природа избегала его. Ни одна птица или полярная лиса не показывалась и не издавала звуков, а местные деревья росли деформированными и неестественно искривленными.\n\nНаконец они приблизились к цели — перед ними зиял вход в большой курган, когда-то заваленный огромным валуном, который теперь лежал разбитым на куски неизвестной силой. Воины обнажили оружие и вошли внутрь. Стены внутри были покрыты символами давно забытого языка, известного лишь немногим старейшим членам Круга Льда. Даже тех скудных знаний, что были у Скорчи, хватило, чтобы содрогнуться, когда она попыталась расшифровать письмена.\n\n— Это какое-то предупреждение... Здесь говорится о проклятии и гибели души... И мольбы о пощаде для тех, кто здесь погребен. Мы должны спешить.\n\nВоины утвердительно прорычали и последовали за друидкой. Вскоре они начали спускаться в подземную часть Склепа. Деревянные и каменные стены сменились льдом, в котором угадывались смутные силуэты пони — традиционный способ погребения у северных племен. Скорча уверенно вела группу через лабиринт проходов, направляясь туда, где, как она знала, было нужно. Молодая кобыла двигалась скованно, словно каждый шаг давался ей с трудом. Прошло много времени, но наконец они достигли входа в просторную залу, откуда доносился сильный металлический запах..."
 ntribes.08.a:0 "...запах крови."
 ntribes.09.t:0 "Выковать союз"
 ntribes.09.d:0 "К востоку от озера Эльф расположена знаменитая Священная Кузня - оплот власти клана Молтенрок, где создаётся большинство магических мечей и доспехов северных пони. Один из пяти великих кланов, и единственный, состоящий почти исключительно из единорогов, был среди самых влиятельных и богатых организаций в этих землях. Хотя копья и мечи не могли сравниться с современным огнестрельным оружием, постоянный поток снаряжения из кузни клана давал северным пони хоть какие-то средства борьбы с грифонской угрозой. Однако другие пони часто считали Молтенроков слегка не в себе - ни один нормальный пони не стал бы жить рядом с вулканом и использовать его силу. Не говоря уже об их нездоровом увлечении огнём и металлом... Многие пони в кузне носили металлические маски или даже заменили части тела магитеховыми протезами, которые порой... выглядели довольно пугающе.\n\n— Должен сказать, это впечатляющий образец инженерной мысли... — один такой пони в данный момент изучал пулемёт, привезённый с юга. Половина его морды была покрыта ожогами, а правый глаз заменён грубо обработанным кристаллом в металлической оправе. — Старейшие формовщики металла выступали против использования пороха и грифонских технологий, утверждая, что им не хватает "души." Но перед такими чудесами инженерии даже они начинают воодушевляться возможностью их усовершенствования...\n\n — Итак, — Оскар Плюменьяр прочистил горло, пытаясь привлечь внимание увлечённого пони, — Итак, мы договорились?\n\n— Ах, да... Договорились. Клан Молтенрок поддержит Стормшилдов при условии, что мы первыми получим доступ ко всем образцам иностранных технологий. Мы выступим за вас на Совете.\n\n— Благодарю, — кивнул Оскар. — Уверен, наше сотрудничество будет взаимовыгодным.\n\n— Да. Да, конечно будет... Но если позволите спросить, почему вы, грифон, поддерживаете дело Эуана и помогаете нам сражаться против других грифонов? И зачем вам возиться с клановыми разборками пони? — Его магитехнический глаз повернулся к грифону, в то время как живой оставался сосредоточен на пулемёте. Оскара передёрнуло от такого неестественного движения.\n\n— Ну... Я люблю эти земли, их традиции. Пони приняли меня и помогли в изгнании... Для меня этот край стал домом куда больше, чем когда-либо был Клаудбьюри. И я ненавижу думать, что его могут захлестнуть скайнавцы. Даже если для защиты потребуется, чтобы пони стали больше походить на грифонов, мы должны это предотвратить...\n\n— Старые вожди бормочут: "Нужно защищать старые пути...", — усмехнулся единорог. — Они забывают, что здесь, на севере, чтобы выжить, нужно меняться и адаптироваться - таков наш образ жизни. Это как переплавить старую отливку и сделать новую..."
 ntribes.09.a:0 ""...которая всё равно будет из того же металла""
 ntribes.54.t:0 "Последствия"
 ntribes.54.d:0 "Только одна пони из той группы, которую мы отправили в Склеп Разломанных Мечей, вернулась. Молодая друидка Скорча отказалась отвечать на какие-либо вопросы о том, что именно произошло внутри, сказав только, что все её воины и архидруид Гэвин погибли и что она обрушила вход в Склеп и уничтожила все знаки, которые могли бы привести кого-либо в это проклятое место. Вскоре после этого она покинула Эверфрост, и последние следы ее пребывания были найдены в южных горах. Будем надеяться, что никто больше не попытается найти Склеп. По нашему требованию, более разумные члены Ледяного круга уничтожат все документы в своих архивах, содержавшие информацию о местонахождении этого проклятого места."
 ntribes.54.a:0 "Некоторые вещи должны остаться в истории."
 ntribes.03.t:0 "Кланы"
 ntribes.03.d:0 "Мелкие распри и многовековые клановые войны — обычное дело в Тир Дейге. Хотя все конфликты регулируются древними обычаями и законами, вспыльчивость и упрямство племенных пони часто провоцирует споры невероятных масштабов. Веками главной задачей принцев и принцесс было выступать беспристрастными судьями – теми, чьё слово уважали даже самые старые и своенравные старейшины.\n\nХотя кланов много, так называемая "Великая Пятёрка" фактически управляет страной – а все меньшие племена так или иначе связаны с одним из крупных кланов. Каждый из этих кланов благословлён одним из Духов, и некоторые его члены владеют особой стихийной магией. Когда столетия назад Кхэнех Сноуфлэйк объединил племена, кланы начали сотрудничать ради общего блага, и с помощью духовной магии превратили северную тундру в процветающие земли.\n\nПриход скайнавцев всё изменил. Раньше контакты с южанами были редки: случайная торговля, набеги горных разбойников или походы молодых вединских рыцарей, искавших славу, – и лишь вечно беспокойные Стормшилды активно стремились к общению с чужаками. Теперь же, с угрозой Скайнавии на западе, многие встали на сторону Стормшилдов и начали перенимать грифонские технологии. Знаменитые мастера клана Молтенрок официально заключили союз с Эуаном Стормшилдом, как и множество меньших кланов. Слухи о том, что Барккоуты тоже могут поддержать Эуана, превратили традиционалистов – Брайтфлеймов и Гринхуфов – в меньшинство в Племенном Совете. Даже поддержка Говорящих с мёртвыми (которые, не будучи кланом, обладают огромным влиянием как хранители истории) не спасает положение.\n\nСмещение альянсов поставило принцессу Фиану в шаткое положение: многие ждут, что она поддержит традиционалистов, но это оттолкнёт значительную часть северных пони. Тем не менее, её одобрение обладает силой – и тот, кто его получит, завладеет огромным преимуществом на Великом Совете."
 ntribes.03.a:0 ""Духи... за что мне всё это?""
 ntribes.04.t:0 "Друг с Востока"
 ntribes.04.d:0 "Город Фростбелл... \n\nНу, честно говоря, называть его "городом" – это, конечно, сильно. По сути, это просто скопление рыбацких хижин и домов, таверн и прочих "замечательных заведений", посещаемых лишь теми безумными моряками, что отваживаются огибать Полуостров Ужаса, чтобы добраться до богатых понийских государств Речных Земель. Этот путь опасен - здесь хозяйничают пираты-пони с холмов и чейнджлинги Гринклифа, не говоря уже о чудовищах, порождённых тёмной магией, что держат полуостров в своих цепких копытах. Но этот путь также невероятно прибылен. Отважный капитан может продать меха, кристаллы или произведения искусства в обмен на современное оружие из Бакары, которое пользуется огромным спросом из-за вечной войны со Скайнавией.\n\nПорыв ветра заставил Эуана вздрогнуть. Он глубже закутался в свою меховую накидку и перестал грезить о дальних странах... К пристани медленно приближался корабль, и через несколько минут пришвартовался. Небольшой пароход-грузовик всё же был самым крупным судном в порту. Ещё через несколько минут, когда команда занялась разгрузкой ящиков, по трапу сошла молодая кобылка. Эуан помахал ей:\n\n— Эмбер, сюда!\n\nКобылка быстро подбежала к нему, и они обнялись.\n\n— Сколько зим, сколько лет! — рассмеялась она, — Надеюсь, тебе не пришлось слишком долго ждать.\n\n— Трёхдневная задержка — это ещё не так плохо, учитывая обстоятельства. Кстати, как прошло путешествие? — спросил Эуан.\n\n— На удивление спокойно, только однажды что-то вроде гигантской акулы попыталось протаранить нас... А тут как дела?\n\n— Всё как обычно, Принцесса не знает, что делать, старые ворчуны твердят, что раньше, до скайнавцев, и снег был белее, и трава зеленее... — ответил Эуан, потирая лоб, — Ну а как...\n\n— ...насчёт сделки? Хорошо, даже очень хорошо. Хотя мне не удалось поговорить с кем-то из власть имущих, нашлось более чем достаточно бизнес-пони, заинтересованных в предприятии. Если ты обеспечишь безопасность северного прохода, они щедро заплатят и будут готовы инвестировать в наши горные разработки."
 ntribes.04.a:0 "— Это отличные новости!"
 ntribes.107.t:0 "Возвращение"
 ntribes.107.d:0 "Зал собраний был полон пони: старейшинами кланов, их советниками, союзниками и различными "почётными гостями." Принцесса приветствовала одну делегацию за другой, отчаянно пытаясь вспомнить имена тех, кого не встречала годами... Расположение мест было тщательно продумано, чтобы враждующие кланы были подальше друг от друга и не допустили драк. Внезапно двери распахнулись с громким хлопком, ударяясь о стены, словно их толкала какая-то мощная сила. За ними стояла группа пони в церемониальных мантиях друидов Льда, с капюшонами, скрывающими лица. Фиана узнала старого пони, ведущего их – это был верховный друид Гэвин!\n\n— Почтенный Гэвин! — приветствовала его Фиана. — Мы давно не виделись... Надеюсь, ваше путешествие было плодотворным?\n\n— Более, чем вы можете себе представить, принцесса, — ответил он. В его голосе не было и следа старческой слабости, он звучал как могучий пони в свои золотые годы. — Я вернулся из Склепа Разломанных Мечей со знаниями. И решением всех наших проблем.\n\n— Откуда?! — Глава клана Молтенрок чуть не подавился, услышав это. — Принцесса, что он говорит? Склеп - всего лишь легенда, чтобы пугать непослушных жеребят!\n\n— Это не легенда! — Один из приглашенных друидов не согласился — Но ведь не зря же его забыли. Это место великого зла. \n\n— Верховный друид, объясните... — попыталась заговорить принцесса, но её перебили.\n\n— Старейшины и вожди кланов, — начал Гэвин, проходя мимо Фианы, — годами я искал решение, которое принесёт нам спасение, поможет победить наших врагов и позволит нам занять то положение, которого мы, пони, заслуживаем. А что сделали остальные вожди? Они спорили без толку, не найдя способа спасти наш род. Некоторые даже предлагали подражать презренным грифонам. — Друид указал на Эуана Стормшилда.\n— Другие не поняли, что на самом деле значит чтить путь наших предков, ослепленные суеверным страхом. Все вы слышали о зимах, длившихся годами, о ледяных бурях, настолько разрушительных, что они стирали с лица земли целые города... И я нашёл способ высвободить такую силу. Более того, я нашёл способ создавать армии, которые уничтожат грифонов! Узрите! — Его спутники сняли капюшоны, открыв лица давно умерших воинов, восставших из ледяных могил, с лицами, всё ещё покрытыми нетающим инеем. Затем Верховный друид снял свою мантию. Его глаза были пусты, на груди виднелся большой шрам, а под ним – пульсирующий синий свет."
 ntribes.107.a:0 "Что происходит?!"
 ntribes.55.t:0 "Метель"
 ntribes.55.d:0 "Реакция толпы была неоднозначной: некоторые пони были явно заворожены, но многие испытывали ужас или отвращение.\n\n— Я освободился от оков жизни и смерти! — почти закричал Гэвин. — И пусть те, кто последует за мной, тоже. Нас всех ждёт великая сила. Мы больше не будем служить слабым духам, вместо этого мы будем повелевать ими! Присоединяйтесь ко мне, чтобы мы наконец смогли отомстить грифонам! За каждого убитого пони мы убьем в десять раз больше грифонов! Зима будет править вечно, и мы будем её хозяевами! — В словах Гэвина было что-то гипнотическое, что-то, что очень сильно преувеличивало всю злость и ненависть, что чувствовали пони...\n\nПосле короткой паузы один из друидов отряхнулся от потрясения.\n\n— Это святотатство! Безумие и святотатство! Остановите этого безумного пони! — Последовало полнейшее безумие: стражники выхватили оружие, менее смелые пони решили бежать из Зала. Верховный друид лишь поднял копыто...\n\nВихрь снега и льда окружил его, острые как бритва осколки льда с визгом понеслись в сторону нападавших, а его возрождённые воины ринулись уничтожать противника, а те, кто решил присоединиться к Гэвину, сражались с остальными. Через несколько минут зал заполнился телами, а пол стал скользким от пролитой крови. Гэвин и его последователи одержали победу. Принцесса Фиана стояла посреди этого безумного дома, парализованная зрелищем бессмысленного убийства. Гэвин посмотрел на тела.\n\n— Надеюсь, их преемники будут более... готовы к сотрудничеству. А насчёт остальных... Вы сделали мудрый выбор, друзья. Задача, стоящая перед нами, велика, но мы победим. А теперь отправляйтесь к своим кланам и принесите им радостную весть: мы идём на войну!\n\n— На войну! Месть! — закричали оставшиеся пони, поднимая оружие.\n\n— Хорошо, — ухмыльнулся верховный друид.\n\n— Заберите принцессу, — приказал он своим неживым приспешникам, — она нам понадобится.\n\nВ нескольких милях отсюда тысячи неживых солдат двигались к столице."
 ntribes.55.a:0 "Зима близко..."
 ntribes.05.t:0 "Великий Совет"
 ntribes.05.d:0 "Несмотря на опасения принцессы, Великий Совет прошёл без серьёзных инцидентов, если не считать типичных выходок вождей кланов - вроде пустых угроз в адрес заклятых врагов или обвинений чьего-то деда в краже очень дорогой овцы у другого деда. Увы, это было единственное положительное, что можно сказать о собрании кланов. Никакого компромисса достигнуто не было; реформаторы и традиционалисты бесконечно спорили, и вскоре стало ясно, что ни одна из сторон не имеет достаточной поддержки для доминирования в Совете. Достаточно большое количество нейтральных кланов ожидало указаний от принцессы - и именно ей предстояло решить, каким путём пойдут Северные Племена."
 ntribes.05.a:0 "Грядёт ветер перемен!"
 ntribes.05.b:0 "Мы должны остаться верны путям дедов..."
 ntribes.10.t:0 "Посланник из Тир Дейге"
 ntribes.10.d:0 "Северные окраины Грифонии – оплот пони. Даже Империя в дни своего расцвета не удосужилась покорить это отсталое место, и если бы не Скайнавцы, там, вероятно, ничего бы не изменилось. Однако в последнее время пони начали стремительную модернизацию, и теперь к нам приезжают их дипломаты. Судя по всему, они хотят присоединиться к нашему альянсу. Хотя союзник в Грифонии может оказаться полезным, мы должны учитывать, что это весьма вероятно, что мы будем втянуты в конфликты на восточном континенте..."
 ntribes.10.a:0 "Они могут оказаться хорошими союзниками."
 ntribes.10.b:0 "Они будут просто бесполезной ношей."
 ntribes.56.t:0 "Ответ грифонов Эквуса"
 ntribes.56.d:0 "Было получено сообщение из Нова Грифонии: мы были приняты в Северный Блок! С таким мощным союзником более никто не посмеет напасть на нас!"
 ntribes.56.a:0 "Так выпьем же за наших клювастых друзей!"
 ntribes.57.t:0 "Нова Грифония отказывается..."
 ntribes.57.d:0 "Не желая ввязываться в конфликты на континенте грифонов, Нова Грифония отклонила нашу просьбу о вступлении в Северный Блок. Теперь мы сами по себе..."
 ntribes.57.a:0 "Нам стоило ожидать такой исход событий..."
 ntribes.11.t:0 "Север поднимается с колен!"
 ntribes.11.d:0 "Залы Дворца Сноуфлэйков заполонили грифоны и пони. Десятилетиями Эверфрост не видел столько существ из ближних и дальних земель, посетивших столицу северных пони. Но редко кому выпадает возможность увидеть коронацию – и уж тем более первую в своём роде. Сегодня принцесса Фиана должна была быть коронована как Королева Севера. Этим актом должно было родиться новое государство – страна и пони, и грифонов.\n\nМногие из иностранных гостей были поражены тем, что пони сумели завоевать такие обширные территории северной Грифонии. Но то, что когда-то казалось невозможным для северных пони, теперь стало реальностью, и мало кто мог отрицать, насколько ошеломляющей была их победа. Все глаза были устремлены на Фиану, когда вновь выкованная корона была возложена на её голову старейшим друидом этих земель. Вожди, старейшины кланов и грифонские наместники преклонили колени, чтобы воздать почести своей новой повелительнице, и один из них громко воскликнул: "Да здравствует Королева! Да здравствует единый Север!" Мгновением позже остальные присоединились к этому возгласу.\n\nНо пока толпа восхваляла Фиану, истинный архитектор этого момента наблюдал за церемонией с одного из балконов. Эуан тепло улыбался: годы изнурительной работы наконец окупились. Годы интриг, сражений и напряжённой дипломатии... Он был усталым, но счастливым.\n\n— Это тебя должны восславлять, а не её, — шум толпы позволили Эмбер подойти к Эуану незамеченной, — ты сделал это возможным. Подумай, что напишут в учебниках истории: "Под мудрым руководством Принцессы, Север был объединён и процветал.""\n\n— Вероятно, так и будет, — мрачно ответил Эуан, — Но меня никогда не заботила эта вычурность знати. Судя по тому, как ведут себя принцы, это быстро надоедает. Я предпочитаю действия всем этим пустым ритуалам.\n\n— Да, это в твоём духе... Так что теперь? — Эуан улыбнулся,\n\n— Ещё есть работа, проблемы не исчезнут только потому, что у нашего правителя появился новый пышный титул. Следующие несколько лет я точно буду занят. А потом... Думаю, я поеду посмотреть все места, о которых читал. Может, Эквестрию? Судя по твоим рассказам, она кажется поистине удивительной.\n\n— Так оно и есть, — улыбнулась Эмбер. — Ну, когда ты решишь отойти от дел кукловода, я покажу тебе всё."
 ntribes.11.a:0 ""Спасибо, Эмбер.""
 ntribes.12.t:0 "Рискованная инвестиция"
 ntribes.12.d:0 "Для большинства торговцев, посещающих Север, он интересен лишь своими редкими породами леса, рыбьему жиру и превосходным мехам. Однако под мёрзлой землёй скрыто гораздо больше богатств: драгоценные металлы, кристаллы, уголь и нефть... Север насыщен природными ресурсами, которые местные пони никогда особо и не использовали. Однако, времена изменились. Теперь эти ресурсы должны были пойти финансирование войны и модернизации. Эуан отправил в Речные земли еще несколько послов, пообещав огромные богатства в обмен на помощь. И, к счастью для северных пони, речные жители оказались более чем заинтересованы тем, что мог предложить Север, – в первую очередь, месторождением золота, которое можно было свободно использовать и для разработки которого Эуан даже готов был предоставить им рабочих. Хотя месторождение находилось на земле, считавшейся священной одним из небольших кланов, этот вопрос вовсе не был неразрешимым – в эти трудные времена щедрое пожертвование Эуана убедило отчаявшихся старейшин, что их земля, на самом деле, не так уж и священна, – и прежде чем недовольные фанатики смогли выразить свой протест, золото уже ушло на экспорт, а обещанные поставки оружия были на пути во Фростбелл."
 ntribes.12.a:0 "Кажется, не только грифоны любят золото..."
 ntribes.13.t:0 "Молодая кровь"
 ntribes.13.d:0 "Нет существ упрямее старых пони. На Севере некоторые клановые конфликты могли длиться поколениями. Одной старой обиды было достаточно, чтобы кланы никогда больше не смогли ужиться. В конце концов, некоторые старые вожди отвергали любые перемены лишь потому, что не они их предложили, не позволяя никому другому решать вопросы, затрагивающие их клан. Эуан потратил годы, чтобы сначала убедить собственный клан, а затем и Молтенрок поддержать его, тогда как Барккоуты последовали за ним лишь из-за поддержки принцессы. За годы политической деятельности Эуан полностью избавился от зависти к Сноуфлэйкам и их княжеской родословной. Управлять Севером было сущим кошмаром.\n\nПереманить на свою сторону каждого старейшину клана у Эуана заняло бы долгие годы — слишком долго, учитывая как важно сейчас время. К счастью, у каждого вождя и старейшины находились властолюбивые и амбициозные молодые подчинённые, куда более восприимчивые к доводам Эуана, не говоря уже о его обещаниях власти, которые также ставили их в зависимость от него — очень полезно учитывая добросовестность многих северян.\n\nКонечно, некоторые кланы предпочли бы скорее быть уничтоженными, чем присоединятся к его коалиции из-за многовековой вражды с её участниками; но у каждого из них имелись более прагматичные противники. И вот гонцы отправились к несговорчивым кланам. С взятками, обещаниями богатства и власти, экономического подъёма, лучшего отношения принцессы к лояльным кланам... Ну а где ничего не помогало — оказывалась всяческая поддержка претендентам, которые могли бросить вызов старым лидерам и сместить их. Вскоре сопротивление реформам растаяло, как весенний снег на солнце. Кланы поддержали Эуана — и если он приведёт их к победе, его положение будет обеспечено на всю жизнь. Если нет..."
 ntribes.13.a:0 "...это будет последней проблемой в его жизни."
 ntribes.14.t:0 "План войны"
 ntribes.14.d:0 "Двадцать лет вялотекущего конфликта ни к чему не привели: мы истощены, а скайнавцы становятся сильнее. С каждым днем к их революции присоединяются новые добровольцы, и очевидно, что они готовятся к решающему столкновению. У них гораздо лучшее оружие, передовая тактика и фанатичная вера в свое коммунистическое дело. Однако они сильно недооценивают нас, считая нас просто дикарями. Пришло время доказать им обратное. Мы больше не будем пассивно ждать неизбежного. Мы должны подготовиться к войне и начать ее на наших условиях.\n\nНо возникает вопрос - как действовать. Хотя большинство предложений вождей бесполезны, несколько интересных идей все же появилось. Во-первых, мы могли бы укрепиться и спровоцировать скайнавцев атаковать наши позиции - тогда мы обескровим их. Однако из-за огромной протяженности границы полностью ее прикрыть может быть проблематично, поэтому, возможно, следует выбрать более наступательную тактику. Перед нашим наступлением несколько боевых отрядов могли бы тайно пересечь границу, чтобы атаковать линии снабжения скайнавцев. Наконец, мы можем попытаться связаться с пони, которые все еще живут на западе, и срочно подготовить их к бою, надеясь подавить скайнавцев численным превосходством."
 ntribes.14.a:0 "Они не пройдут!"
 ntribes.14.b:0 "Лучшая защита – это нападение."
 ntribes.14.c:0 "Кобылы ещё нарожают..."
 ntribes.15.t:0 "Месть или правосудие?"
 ntribes.15.d:0 "Теперь, когда Скайнавия находится под нашим контролем, нам нужно решить проблему пони, жаждущих мести. Многие из наших соплеменников все еще испытывают оправданный гнев по отношению к скайнавцам, которые, несомненно, причинили много разрушений и страданий за двадцать лет войны. Однако, большинство членов скайнавского руководства, ответственных за зверства, погибли в бою или сбежали, чтобы сражаться за дело коммунизма в отдаленных странах. Удовлетворение требования возмездия вынудило бы нас наказать некоторых невинных офицеров низкого ранга, случайно выбранных из рядов бывшей армии Скайнавии, что, несомненно, негативно скажется на наших будущих отношениях с народами грифонов. Судить только тех, кто непосредственно виновен в пагубных действиях против гражданского населения, и простить оставшихся скайнавцев было бы полезно для наших международных отношений, да и просто правильно с точки зрения морали. Хоть многие кланы будут против этого, такой акт прощения может положить начало мирному сосуществованию пони и грифонов в Северных землях."
 ntribes.15.a:0 "Мы имеем право отомстить."
 ntribes.15.b:0 "Правосудие свершённое с пристрастием... рискует не быть правосудием."
 ntribes.16.t:0 "Земельный вопрос"
 ntribes.16.d:0 "Еще один день, еще одна проблема... Казалось, что после падения Скайнавии все будет хорошо... Конечно, всё было не так-то просто. С воссоединением племён, изгнанные кланы захотели вернуться на земли своих предков... Однако, сейчас большие участки этих земель заняты грифонами, а то, что раньше было дикой местностью, было отведено под добычу полезных ископаемых, лесоводство и сельское хозяйство... Очевидно, что грифоны не захотят уходить... И, если быть честными, надо отдать им должное: они проделали хорошую работу по освоению этих ранее бесплодных земель. Хотя может показаться правильным позволить трудолюбивым грифонам сохранить землю, на самом деле мы не можем этого сделать, поскольку последствия будут огромными. В худшем случае, голова Эуана окажется на пике.\n\nС другой стороны, вытеснение грифонов не принесет никакой пользы в долгосрочной перспективе. Однако, возможно, есть способ убедить обе стороны следовать некоему соглашению, при котором пони будут владеть этой территорией, а грифоны могут платить за право ее использования... А если все остальные методы потерпят неудачу, деньги решат любой конфликт."
 ntribes.16.a:0 "Заставить грифонов переместиться."
 ntribes.16.b:0 "Давайте договариваться!"
 ntribes.17.t:0 "Ветер перемен"
 ntribes.17.d:0 "Еще недавно почти безжизненный, Дворец Сноуфлэйков теперь был заполнен пони — а в последнее время — и грифонами. Эуан Стормшилд и его многочисленные помощники занимали все больше залов и комнат, а зарождающаяся бюрократия их Северного королевства, казалось, взрослела с каждым днем. Дела шли исключительно гладко, скайнавцы охотно сотрудничали, и несмотря на жалобы некоторых вождей, Эуан пригласил многих из них помочь ему управлять воссоединенным Тир Дейге. Недовольные замолчали перед лицом его недавних успехов, и его контроль стал почти абсолютным. Фиана, всегда застенчивая и робкая, редко противилась его действиям — а когда все же осмеливалась, он неизменно переубеждал ее долгими тирадами о необходимости перемен и перечислением своих прошлых достижений. Она и вправду была очень доброй пони, но ей не хватало твердости, обязательной для лидера. Похоже, ей действительно больше подходила роль условного монарха. Меньше реального управления, больше приветствий подданным на парадах — вот что ей нравилось. Возможно, грифонские республиканцы были правы, и дни монархии давно прошли...\n\nТем не менее, Эуан нашел применение Фиане, и хотя его новые скайнавские советники предлагали свергнуть её, чтобы освободить место и средства, он видел в ней потенциал мощного объединяющего символа.\n\nДаже при своей обычной гиперактивности Эуан не мог быть везде одновременно, ему приходилось делегировать задачи, и он больше не мог позволить себе управлять страной в одиночку — хотя это и упрощало многие вопросы. Ему была нужна поддержка и пони, и грифонов, если он хотел воплотить свои мечты. Кланы были слабее, чем когда либо, и он мог наконец создать централизованное правительство с Фианой во главе или последовать скайнавскому примеру и реформировать Великий Совет, включив в него не только племенных вождей, но и всех лидеров поселений на этих землях, введя более справедливое представительство и демократическое голосование."
 ntribes.17.a:0 "Демократия? Звучит заманчиво."
 ntribes.17.b:0 "Рано нам играть в демократию..."
 ntribes.18.t:0 "Нужно больше золота"
 ntribes.18.d:0 "Если мы хотим модернизироваться, нам необходимо приобрести промышленное оборудование и технологии. Конечно, никто не предоставит нам это бесплатно – нам придется заплатить. Хотя экспорт древесины, мехов животных и полезных ископаемых покрывает наши текущие потребности в импорте, маржа, которую мы получаем, слишком мала для нужд индустриализации. Из-за того, что наше "правительство" практически не существовало, до сих пор не было необходимости в хорошо организованной налоговой политике. Принцесса полагалась лишь на небольшие выплаты от различных кланов. Однако теперь пришло время ввести надлежащее налогообложение. Конечно, чем более высокие налоги мы будем требовать, тем больше пони будут жаловаться, и наши позиции будут ослаблены."
 ntribes.18.a:0 "Просто увеличьте дань."
 ntribes.18.b:0 "Разумное налогообложение – наилучший вариант"
 ntribes.18.c:0 "Боюсь, им придётся затянуть пояса..."
 ntribes.19.t:0 "Старый воин"
 ntribes.19.d:0 "Лучник Гордон... \n\nМало кто из пони сражался так долго, как он, и ещё меньше потеряли столько же. Выходец из одного из малых кланов, почти уничтоженного бандитами Санстрайкер, Гордон сражался с грифонами при любой возможности — будь то вединские рыцари, ищущие славы, бандиты или фанатичные скайнавцы — он повидал их всех. Даже после потери зрения, когда он чудом выжил после почти прямого попадания артиллерийского снаряда, он продолжал бороться и — хоть и стал бесполезен в поле — давал бесценные советы. Большинство вождей уважали его, и принцесса увидела в этом лучший способ объединить множество соперничающих боевых отрядов Севера в подобие армии. И вот она сидела напротив него, не зная, что сказать. Гордон казался дружелюбным — даже без глаз, в которые можно было бы взглянуть — возможно, даже слишком дружелюбным. Фиана чувствовала, что он не готов относиться к ней серьёзно: для него она была всего лишь юной кобылкой.\n\n— Не то чтобы я не ценю приглашение, принцесса, но я занятой пони. Знаете, когда вам столько лет, каждый день на счету — а их у меня осталось не так уж много. Ни с того ни с сего он начал разговор, — В чём суть этой встречи?\n\n— Гордон, мне нужна твоя помощь. Нашим воинам не хватает дисциплины, им нужен один, настоящий лидер, а не кучка неугомонных вождей. Тебя ведь все уважают, независимо от клановой принадлежности.\n\n— И ты собираешься быть этим "лидером"? — спросил Гордон, хотя уже знал ответ, — Ты может и принцесса, символ единства кланов, но у тебя нет опыта в военном деле. Ты принесёшь больше вреда, чем пользы. Просто продолжай улыбаться перед поддаными и вождями, и всё будет хорошо. Позволь взрослым разобраться с войной.\n\nФиана распознала в этом насмешку и мгновенно парировала, подстраиваясь под его провокационный тон и ускоряя темп речи, едва сдерживая гнев,\n\n— Да, у меня может и нет опыта, но в отличие от упрямых старых дураков, которые ведут наших воинов, я хочу учиться и могу слушать других. Я прошу тебя о помощи, потому что это быстрее, чем встречаться с каждым высокомерным вождишкой. И следи за словами, Гордон, я не позволю оскорблять себя в собственном государстве! Роль принцессы — вести своих подданных, а не просто "улыбаться" им. И я намерена выполнять свои обязанности!\n\n— Ха, а у тебя есть характер! — рассмеялся слепой старик. — Ты настоящая Сноуфлэйк, прямо как твой отец! С виду тихая, но в душе — воительница... Хорошо, моя принцесса, отныне я буду представлять тебя перед военными вождями. Просто слушай мои советы. Горячие головы ни к чему, когда время требует хладнокровия и тактики."
 ntribes.19.a:0 "Это было... проще, чем ожидалось"
 ntribes.20.t:0 "Планирование войны"
 ntribes.20.d:0 "Дворец Сноуфлэйков хранил множество шедевров, созданных великими мастерами прошлого — одним из них была гигантская карта, высеченная из камня в виде Северных земель. Хотя ей не хватало точности современных военных карт, которые принцесса видела пару раз в жизни, она оставалась полезным инструментом для обсуждения планов. Сегодня принцесса пригласила нескольких опытных вождей и верных клановых лидеров, чтобы обсудить текущую войну.\n\n— Правда в том, принцесса, — вздохнул Гордон Лучник, — что мы проигрываем. Даже я это вижу. Никто не засмеялся над его шуткой. Хотя слепой Гордон не мог командовать воинами на поле боя, на Севере не было стратега опытнее него — и никого, кого воины уважали бы больше. Его слова нельзя было воспринимать легкомысленно. Если мы продолжим воевать по-старому, у нас нет шансов против грифонов. С каждым днём к скайнавцам прибывают новые фанатики, а их оружие попросту лучше нашего.\n\n— Есть и другая проблема, — добавил Эуан Стормшилд, новичок в военном совете Фианы, пока не проникшийся энтузиазмом. — Мои пони поймали скайнавских шпионов. У них были приказы сеять раздор и поднимать восстание. Что хуже — им удалось найти последователей среди наших.\n\n— Только потому что ты подготовил почву своими подрывными идеями, — язвительно заметил Гордон.\n\n— Пожалуйста, не будем ссориться, — вмешалась Фиана. — Споры нам не помогут. Нам нужны решения. Поэтому я вас и собрала. Мы потерпели неудачи на многих фронтах, но должно же быть что-то, что у нас получится.\n\n— Мелкие стычки со скайнавцами бессмысленны, — предложил Эуан. — Нам нужно подготовить масштабное наступление, пока они не начали своё.\n\n— Поддерживаю молодого Стормшилда, — согласился Гордон. — Никто не знает эти земли лучше нас. Грифоны не смогут обнаружить наших разведчиков, пока те прокладывают маршруты для воинов.\n\n— А как же наша оборона? — поинтересовалась принцесса.\n\n— Что ж, мы можем расширить несколько фортов и надеяться, что они выдержат удар, — ответил Гордон. — Но это потребует огромных усилий, а у нас мало времени и пони.\n\n— Насчёт пони... — Эуан усмехнулся. — Есть возможное решение: я говорил с контрабандистами, которые связались с нашими западными сородичами. Их воины готовы и хотят помочь нам в тылу. Что бы мы ни делали — действовать нужно быстро, иначе коммунисты окажутся здесь первыми."
 ntribes.20.a:0 "Нужно выбирать..."
 ntribes.21.t:0 "Старый знакомый — лучше, чем новый враг" #Как это правильней перевести?
 ntribes.21.d:0 "Эуан Стормшилд... \n\nПринцесса всегда считала его чудаком, а его восхищение чужими землями - раздражающим. Однако многие другие пони приняли его взгляды, и без его поддержки вести за собой племена оказалось бы довольно сложно. К счастью, Стормшилды были по призванию не воинами, а торговцами, а потому куда более открытыми, чем многие другие северные пони. В данный момент принцесса присутствовала на демонстрации новейшего приобретения Эуана - мощной пушки, привезённой прямиком из Речных Земель. Несколько его соплеменников под руководством единорога из клана Молтенрок готовили орудие к пробному выстрелу, пока Эуан произносил пространную речь о захватывающих перспективах сотрудничества с Востоком.\n\n— ...и это далеко не всё, что мы можем от них получить, принцесса! Оружие, электроника, новое сельскохозяйственное и горное оборудование... Нам нужно всё это!\n\n— Вождь, мы готовы! — крикнул единорог, ответственный за орудийный расчёт. И через мгновение пушка выстрелила с оглушительным грохотом, превратив ближайшую скалу в облако пыли.\n\n— Хм, должна признать, это впечатляет, — воспользовалась моментом Фиана. — Но что насчёт других кланов? Они не хотят отказываться от путей предков, чтобы стать более похожими на грифонов...\n\n— Бояться перемен естественно, принцесса, — ответил Эуан. — И хотя мне это не по душе, я понимаю, что другие кланы могут быть не столь восприимчивы, как мой. Со временем они примут изменения, если захотят выжить.\n\n— Мы не должны забывать, кто мы такие, — машинально произнесла Фиана, будто зачитывая аксиому.\n\n— То, что могло быть правдой сто лет назад, может не относиться к нашим временам... Впрочем, это не тема для сегодняшнего разговора. Пока я доволен текущей сделкой. Молтенроки более чем рады экспериментировать с оружием вроде того, что я вам только что показал, и обещаю, что результаты будут ещё более впечатляющими... — Эуан вернулся к своему монологу. Принцесса взглянула на разрушенные скалы и на мгновение задумалась - действительно ли будущее, о котором он говорил, неизбежно... как бы сильно она ни сопротивлялась."
 ntribes.21.a:0 "Времена меняются"
 ntribes.22.t:0 "Вставайте, пони!"
 ntribes.22.d:0 "После нашего прибытия большинство пони в этих и без того малонаселенных землях бежали на восток. Однако несколько мелких кланов осталось — они в основном пытались избегать нас и не создавали проблем... До сих пор. Воодушевленные реакционными племенами с востока, местные жители решили восстать против нашей власти. Сами по себе они не представляют серьезной угрозы и являются скорее мелкой неприятностью, но в условиях надвигающейся войны с пони их диверсии против наших линий снабжения и разведка в пользу племен могут стать серьезной проблемой"
 ntribes.22.a:0 "Тревожно..."
 ntribes.23.t:0 "Судьба Скайнавии"
 ntribes.23.d:0 "Новая Скайнавия была попросту... уродливой. Принцесса не могла подобрать другого слова. Длинные ряды жилых комплексов, больше похожих на казармы, дисгармоничные и хаотичные по дизайну... Город ощущался как военный лагерь, наспех переделанный в поселение. И всё же местные жители были оживлёнными и энергичными. Даже сейчас, с пони-воинами на страже и патрулями повсюду, грифоны толпились на улицах, занимаясь своими повседневными делами. Молодые грифы, казалось, совсем не беспокоились о смене режима — некоторые даже пытались подружиться с пони. Однако старшие, которые не родились здесь и участвовали в завоевании этих земель, явно были на грани открытых столкновений с "реакционными оккупантами." К счастью, их было не так много, иначе насилие было бы неизбежным.\n\nС прибытием Принцессы многие видные грифоны запросили аудиенцию — большинство из них было весьма приятным и вежливым, совсем не похожи на жестоких зверей из военных рассказов пони — и все они говорили о будущем и мире. Грифоны устали от войны, длившейся двадцать долгих лет. Многие из них родились здесь или были привезены сюда когда были детьми, а идеологи революции в основном погибли или бежали из Скайнавии перед её неминуемым поражением. Оставшаяся администрация надеялась на новый виток отношений между грифонами и пони на Севере. Однако, среди старшего поколения пони, многие жаждали мести. Они считали, что мир с грифонами невозможен, и что грифоны должны вернуться на Юг.\n\nПринцессе предстояло принять решение — такое, которое наверняка определит судьбу Севера на годы вперёд."
 ntribes.23.a:0 "Грифоны должны уйти"
 ntribes.23.b:0 "Может быть, мы сможем стать друзьями?"
 ntribes.59.t:0 "Скайнавские изгнанники"
 ntribes.59.d:0 "Отдалённое государство Скайнавия было основано более двадцати лет назад коммунистическими диссидентами из Республики Грифонов. После долгих лет войны с местными пони они потерпели поражение. В отместку пони изгнали большинство грифонов со своих земель, и теперь эти несчастные ищут новый дом по всей Грифонии. Некоторые из них прибыли в наше государство, и из-за их хаотичного характера, мы не смогли предотвратить их поселение здесь."
 ntribes.59.a:0 "Надеемся, они не вызовут проблем..."
 ntribes.24.t:0 "Проблема коммун"
 ntribes.24.d:0 "Скайнавцы – странный народ, в то время как мы были склонны воспринимать их как единую силу и имели в лучшем случае смутные представления о том, что такое "коммунизм"... Что ж, все гораздо сложнее, и эти коммуняки оказались еще более раздробленными, чем мы. К счастью, с большинством из них можно договориться, но есть множество радикальных групп, убеждения которых мы даже не смогли понять. Некоторые грифоны пытались объяснить нам это, но эти бредни вызывали лишь головную боль. Например... "Ульевый коммунизм". Что это вообще значит? Они что, едят пчел? По-видимому, это считается серьезной философией, и где-то в лесу есть группа, практикующая ее. (Не дай им Духи тронуть наши пасеки!)\n\nНезависимо от того, как они себя называют, эти группы в большинстве своем отказываются подчиняться нам и угрожают насилием, если мы хотя бы прикоснемся к землям, которые они занимают, – землям, которые до недавнего времени принадлежали нашим соплеменникам, которые крайне недовольны тем, что их дома захватили какие–то комми-шизофреники. Мы можем послать наших воинов для разгона этих общин, но это, вероятно, лишь приведет к вооруженному конфликту. В качестве альтернативы, мы могли бы оставить их в покое, но это точно поссорит нас с несколькими вождями кланов..."
 ntribes.24.a:0 "Избавимся от этих сумасшедших!"
 ntribes.24.b:0 "Пусть живут."
 ntribes.25.t:0 "Спокойный день"
 ntribes.25.d:0 "Быть правителем — настоящим правителем, а не чьей-то марионеткой или "символом единства", размахивающим копытом, — означает огромную работу. Хорошая сторона этого заключалась в том, что это занимало Фиану, отгоняя мрачные мысли и страхи. Всегда находился какой-нибудь общественный деятель, требующий аудиенции, решение, которое нужно принять, "Офигеть Какой Важный Фестиваль", который нужно было посетить... Однако теперь, когда проблема с грифонами была решена, всё успокоилось. После многих лет напряженной работы Фиана однажды обнаружила, что у нее нет ничего даже отдаленно важного. Ни единого спора между кланами, ни один из подчиненных не просил указаний... Мир и покой. Это было даже немного тревожно! Она некоторое время бродила по дворцу, отвлекая слуг, пока наконец не устроилась в одной из оранжерей, чтобы немного отдохнуть. Сады Дворца Сноуфлэйков были одним из его многочисленных чудес: торговцы привозили множество экзотических и красивых растений с Юга, которые затем выращивались здесь. Благодаря магии пони и мастерству стеклодувов, эти удивительные сооружения поддерживали жизнь различных теплолюбивых растений в суровом климате Севера.\n\nКогда Фиана была жеребенком, она проводила много времени в этих садах, разыгрывая приключения в загадочных южных землях, путешествуя по бескрайним джунглям и исследуя потерянные храмы, как в одной из книг, которые она нашла в дворцовой библиотеке. То были более простые, беззаботные дни... Фиана сидела на скамейке, наслаждаясь ароматом цветущих цветов.\n\nТакой будет ее жизнь отныне? Тихие, почти одинаковые дни... С торжеством старого уклада, на Севере произойдет мало изменений, а с узами между кланами, крепче чем когда-либо, даже некогда утомительная задача разрешения их споров больше не была такой стрессовой.\n\nДа. Она надеялась, что так и будет. Она не будет скучать по дням войны, борьбы и страха. После двадцати долгих лет раздора ее пони заслужили мир — и она тоже. Но чтобы не впасть в полную скуку, ей определенно нужно было найти хобби. Или даже два..."
 ntribes.25.a:0 "Может... Начать делать скульптуры из льда?"
 ntribes.26.t:0 "Сломанный металл"
 ntribes.26.d:0 "Врата Священной Кузни не смогли остановить ярость зимы. Считавшиеся непробиваемыми без современной крупнокалиберной артиллерии, они застыли от силы неестественного мороза, вскоре разлетевшись на миллион блестящих осколков от серии простых телекинетических ударов. Затем большинство защитников были перебиты, хотя некоторые из Молтенроков решили сдаться. Многие кузнецы погибли, и Священная Кузня, возможно, понесла непоправимый ущерб. Теперь нам нужно решить, что делать с оставшимися в живых предателями."
 ntribes.26.a:0 "Мы будем снисходительны."
 ntribes.26.b:0 "Нам нужно подать пример."
 ntribes.27.t:0 "Сомнительная лояльность"
 ntribes.27.d:0 "Мы сражаемся за кланы, а не против них... Но, похоже, не все это понимают. Хотя мало кто поддержал Эуана Стормшилда, многие всё ещё не решаются присоединиться к какой-либо из сторон. Нам нужно убедить тех, кто всё ещё колеблется, что наша цель — спасти северных пони, и что мы единственные, кто способен это сделать. К счастью, наши сторонники предложили отправиться в другие кланы и попытаться убедить их присоединиться к нам. Однако, если мы хотим, чтобы эти переговоры увенчались успехом, нам, возможно, придётся пойти на некоторые уступки и дать обещания лидерам кланов... Или мы можем просто избавиться от смутьянов и заменить их пони, более восприимчивыми к нашим предложениям."
 ntribes.27.a:0 "Мы будем вместе."
 ntribes.27.b:0 "Они будут либо с нами, либо под нами."
 ntribes.28.t:0 "Наказание"
 ntribes.28.d:0 "Даже после событий Великого Совета Эуан Стормшилд и его последователи продолжали противостоять Архидруиду. Клан Стормшилд и многие его союзники собрались на Востоке, готовясь к удару. Однако их надежды были быстро разрушены армией воинов-нежити и лоялистов, обрушившейся на город Фростбелл. Последовавшая битва была долгой и жестокой: Стормшилды знали, что им не будет пощады, и сражались до последнего. Хотя им удалось отразить несколько первых атак, нежить продолжала атаковать день и ночь, не оставляя им времени на отдых. Через несколько дней, когда защитники были полностью истощены, пришло время для решающего удара. Однако, к раздражению Архидруида, большинство оставшихся воинственных пони уже покинули город до или во время осады, либо отправившись в земли арктурианцев, либо отправившись морем в Фарбрук. Сам Эуан Стормшилд тоже бежал – у этого труса не хватило даже смелости сражаться за своё дело, как у всех тех, кого он оставил позади. Верховный друид решил не преследовать их, поскольку клан Стормшилд был окончательно разбит, и все его члены, как по возрасту, так и по кровной линии, погибли или бежали. На этом угроза реформации отступила, и не было нужды в дальнейшем кровопролитии. Хотя мы понесли некоторые потери, воскресив павших защитников Фростбелла, мы смогли более чем пополнить наши ряды."
 ntribes.28.a:0 "Так заканчивается их дело."
 ntribes.60.t:0 "Беженцы прибывают"
 ntribes.60.d:0 "Грандмастер, у нас срочные новости. Тысячи пони пересекли нашу западную границу! Их так много, что рыцари, охраняющие эти земли, поначалу приняли это за полномасштабное вторжение! Однако все они — беженцы, спасающиеся от, по-видимому, внутреннего конфликта в Тир Дейге. Вести, которые они принесли, мрачны: судя по всему, друиды Льда сошли с ума и захватили власть, используя тёмную магию. Они подняли армии нежити, чтобы убивать всех, кто не согласен с их действиями, призывая к тотальной войне против скайнавцев, а затем и к порабощению всех грифонов. Очевидно, что северные пони попали во власть тёмных сил. Мы должны быть осторожны с их действиями. Если есть хоть какое-то утешение в этих тревожных событиях, то некроманты Тир Дейге, похоже, не имеют никакого отношения к Лиге Ужаса. И всё же нам следует очень внимательно следить за нашей западной границей..."
 ntribes.60.a:0 "Тревожно... Подготовьте рыцарей!"
 ntribes.61.t:0 "Беженцы прибывают"
 ntribes.61.d:0 "Большой флот с беженцами только что прибыл в порт Блэкуотер – все они из Тир Дейге. Судя по всему, земли северных пони теперь находятся под контролем тёмной магии – Культа Льда, который недавно начал уничтожать всех инакомыслящих. Мы не можем ничего с этим поделать из-за огромного расстояния между нашими народами, но, по крайней мере, мы можем помочь этим бедным пони найти новый дом в Фарбруке."
 ntribes.61.a:0 "Наш долг – дать им убежище."
 ntribes.29.t:0 "Цена могущества"
 ntribes.29.d:0 "Нелегко установить контакт с призраком умершего существа, поскольку почти все они слишком далеки – без использования некромантии. И даже если кто-то прибегал к воскрешению мертвеца, все, на что он мог надеяться, обычно было лишь искажённой тенью души умершего существа. Однако были существа слишком могущественные и слишком нежелающие покидать материальный мир. Такие души могли прилипать к своим телесным останкам на века. Недаром друиды избегали их – они часто были извращенными и мстительными. Они всегда хотели чего-то взамен, когда их просили о помощи. Потерянные души, одержимые своими неудачами, духи, жаждавшие власти при жизни – и позволившие этой жажде поглотить себя после смерти. Чем дольше они торчали в мире смертных, тем сильнее стремились вновь испытать утраченное.\n\nС момента заключения договора с Королями Метели Гэвин чувствовал их присутствие – они постоянно наблюдали, постоянно шептали... Долгое время они были лишены жизни, пока не стали лишь тенями тех могучих пони, которыми когда-то были: их личности лишились всего, кроме жажды мести тем, кто причинил им зло, и всепоглощающей жажды власти... над жизнью. Единственное, что у них осталось – это знание давно забытой магии. Согласно договору, они поделились им с Верховным Друидом. Теперь у него было необходимое заклинание – которое, как считалось, не под силу произнести ни одному друиду или колдуну северных земель – даже сами Короли Метели не обладали достаточной силой, чтобы высвободить его. Обычно для этого требовалось пожертвовать десятками тысяч жизней – без гарантии успеха. Но Гэвин видел другой путь – спасти целую нацию ценой одной жизни.\n\nЧленов клана Сноуфлэйк благословили все северные духи – уникальная черта, которой они обладали благодаря основателю королевской династии, Кхэнеху Сноуфлэйку, – и остался лишь один из них. Убийство Фианы, прерывание целого рода благословенных душ, освободило бы достаточно магической энергии, чтобы полностью уничтожить Скайнавию.\n\nЖажда мести Королей Метели была бы утолена, и Гэвин выполнил бы свою часть договора."
 ntribes.29.a:0 "Это надо было сделать."
 ntribes.30.t:0 "Осиротевшая нация"
 ntribes.30.d:0 "После смерти Фианы и разрушения Новой Скайнавии Тир Дейге медленно умирает. Тысячи лет пони жили в союзе с северными духами, чья магия струилась по их землям. Сила друидов была самым заметным даром духов, но в какой-то степени почти каждый пони был благословлён ими.\n\nТеперь их магия исчезла. Хотя все пони – существа, обладающие магическими способностями, северные сильно зависели от помощи своих божеств, поскольку, как и у большинства, природных талантов было недостаточно для выживания в этой суровой земле. Поэтому, когда урожай погиб, погода стала всё более непредсказуемой, а кланы начали воевать друг с другом, многие старейшины и друиды начали сомневаться в правильности своего выбора...\n\nЗатем, довольно неожиданно, всех друидов пригласили в Эверфрост, пообещав спасение их соплеменникам. Они увидели силу последователей Морозного Короля, не затронутых наказанием Духов, и им предложили... решение. Многие отказались – и так и не покинули Дворец Сноуфлэйков – но те, кто принял предложение Морозного Короля и поклялся ему в верности, вскоре почувствовали прилив сил. Они обрели силу, в которой нуждались они и их соплеменники."
 ntribes.30.a:0 "Теперь пути назад нет."
 ntribes.31.t:0 "Восхождение"
 ntribes.31.d:0 "Многие считают, что современная магия — всего лишь ещё одна отрасль науки, что её место — в университетах и на фабриках, а эпоха богов и архимагов, способных разрушить мир, прошла. Но не в Тир Дейге... Там царит Древняя Магия. И теперь наконец-то нашёлся тот, кто может её обуздать.\n\nВойна со Скайнавией изменила северных пони — сильнее, чем кто-либо мог себе представить, — и стало ясно, кем они стали. Прошли времена мира и гармонии. Когда-то давно они были завоевателями, а теперь снова стали ими. Их боги были слабы, и их нужно было... заменить.\n\nКогда армии Морозного Короля двинулись на юг, они разграбили все древние хранилища, все библиотеки и все хранилища магических знаний, которыми владели грифоны. Многое ещё предстояло обрести — древние, опасные знания, которые они похоронили, пытаясь заставить мир забыть об их существовании. Тем временем города грифонов горели, и тысячи невинных существ погибали. Ещё больше грифонов бежало на юг, надеясь спастись от пони-завоевателей и неся вести о зверствах, совершённых захватчиками.\n\nТеперь всё было готово к великому финалу, ритуалу, невиданному с древних времён. В десятках священных лесов, источников и других магических мест последователи Короля проводили свои тёмные обряды, принося в жертву сотни пленённых грифонов, чтобы открыть путь в Царство Духов, чтобы сделать их... уязвимыми.\n\nПока Северные Духи умирали, лишённые магии магическим нападением Морозного Короля, его сила только росла. Так он станет живым богом – существом, способным соперничать даже с аликорнами – тем, кто принесёт грифонам вечное рабство и щедро вознаградит верных пони. Северные пони почувствовали, как пульсирующая, покалывающая волна энергии разлилась по их телам, когда их связь с Духами сменилась чем-то новым. И те немногие, кто покинул Тир Дейге, спасаясь от безумия, поглотившего его, всегда, до конца жизни, будут ощущать пустоту в своих душах. Их Духи-проводники умерли..."
 ntribes.31.a:0 "И так появился тиран."
 ntribes.62.t:0 "Беженцы из Тир Дейге"
 ntribes.62.d:0 "Сообщается, что тысячи грифонов недавно пересекли наши границы, умоляя о убежище. Судя по всему, на наших северных собратьев напала армия... пони вместе с ордами оживлённых грифонов. Эти захватчики были безжалостны, и многие грифоны предпочли бежать на юг, чем рисковать жизнью или свободой. Наш долг — помочь этим бедным созданиям, и мы должны быть готовы дать отпор этой проклятой орде, когда она неизбежно настигнет нас."
 ntribes.62.a:0 "Тревожные новости"
 ntribes.50.t:0 "Смертельная угроза"
 ntribes.50.d:0 "Наши товарищи-пони принесли ужасные новости. Они чувствуют сильное возмущение в магическом эфире, исходящее, по-видимому, от Тир Дейге. Судя по всему, северные пони пытаются наложить заклинание невероятной разрушительной силы – и собираются использовать его против нас! Хотя мы не знаем точной природы этого заклинания, наши маги уверены, что оно вызовет катаклизм беспрецедентных масштабов. Нам нужно действовать и остановить этих обезумевших пони!"
 ntribes.50.a:0 "К оружию!"
 ntribes.51.t:0 "Разрушение Новой Скайнавии"
 ntribes.51.d:0 "Маги сходят с ума от ужаса, что их реальность разрывается на части тёмной магией. Даже грифоны инстинктивно съеживаются от слабого ощущения надвигающейся опасности. Небеса темнеют, когда магические грозовые тучи закрывают солнце. Животные буйствуют, пытаясь сбежать из обречённого города. Становится всё холоднее и холоднее... Каждые несколько минут температура падает на десять градусов, а ветер усиливается. Никакой огонь или укрытие не помогают, даже бетон начинает трескаться и разрушаться. Неестественная метель надвигается на Новую Скайнавию, словно приливная волна разрушения и смерти.\n\nКогда она обрушивается, погода становится смертельно опасной: температура опускается ниже полярной, ветер вырывает деревья из земли, и город накрывает снежное цунами. Те немногие грифоны, которые оказываются снаружи, умирают в мучениях, швыряемые ветром, а их лёгкие превращаются в лёд от холода и снега. Некоторые молятся богам, моля о спасении, но сегодня они их не слышат.\n\nНекоторые, более чувствительные, собрались и бежали на юг при первых признаках этого апокалипсиса – их замёрзшие, сухие тела теперь устилали дороги, ведущие из города. Больше всего повезло тем, кто выбрал быструю смерть от выстрела – предпочтительнее медленной смерти от холода.\n\nКогда метель утихла, Новая Скайнавия исчезла. На улицах лежали изуродованные, обезображенные трупы, а внутри зданий те, кто выжил дольше всех, лежали грудами безжизненных тел, обнимающих друг друга в отчаянной попытке согреться.\n\nКогда пони-разведчики добрались до города, они не нашли никого живого – города больше не было, и мечта о равенстве и социализме на Севере умерла вместе с ним. Некогда оживлённые улицы были тихи, покрытые толстым слоем снега, который не таял – и никогда не растает. Новая Скайнавия навсегда останется замороженной могилой, и даже духи ее обитателей не смогут покинуть павший город."
 ntribes.51.a:0 "Так умерла их мечта..."
 ntribes.52.t:0 "Ритуал"
 ntribes.52.d:0 "Воздух гудит от магической энергии, когда друиды произносят строки древнего ритуала. Они делают это уже много дней, и не все дожили до конца – но даже после смерти души погибших продолжали петь призрачными воплями, скованными сверхъестественными силами, наполняющими комнату. Посреди комнаты принцесса Фиана прикована к полу, её плащ залит кровью от символов, вырезанных прямо на её теле. Потеря крови и истощение сказались на ней, но она всё ещё каким-то образом остаётся в сознании.\n\nРитуал достигает кульминации: друиды заканчивают песнопение, и Гэвин тянется за старым, ржавым ножом, который он нашёл в Склепе Разломанных Мечей – тем самым ножом, которым он вырезал себе сердце... Хотя с тех пор, как он принял силу Королей Метели, дар вечной жизни, он чувствовал себя даже сильнее, чем в юности, сейчас каждый шаг к принцессе казался почти невозможным. Но, несмотря на это, он не сдавался, лишь благодаря силе воли. Это было необходимо.\n\nПодняв нож, Верховный друид вспомнил дни, когда всё было проще – дни до появления скайнавских грифонов, когда он давал советы отцу Фианы, Фотаду... "Смотри, мой прекрасный принц, как мы тебя подвели!"\n\nБыстрым движением он рассекает грудь Фианы, затем вырывает сердце. Он поднимает его, и последний след жизни исчезает в глазах принцессы, но сердце продолжает биться...\n\nКаждый удар сердца разносится по залу, становясь всё тише и медленнее. Наконец, с последним ударом, ритуал завершается. Духи Севера лишаются своей силы, когда гигантская метель накрывает Новую Скайнавию. Смерть последней Сноуфлэйк в святотатственном ритуале кладёт конец общению северных пони с их божествами. Друиды по всему Тир Дейге чувствуют, будто потеряли часть своей души, ведь именно они, имея самую сильную связь с Духами, страдают больше всего.\n\nКогда тела погибших во время ритуала начинают разлагаться, Верховный друид в последний раз смотрит на тело Фианы. Его глаза почти такие же безжизненные, как и у неё. Голоса в его голове торжествующе воют – их месть Кхэнеха Сноуфлэйка свершилась, их жажда мести утолена."
 ntribes.52.a:0 "Пони теперь в безопасности..."
 ntribes.53.t:0 "Разрушение Новой Скайнавии"
 ntribes.53.d:0 "Маги сходят с ума от ужаса, что их реальность разрывается на части тёмной магией. Даже грифоны инстинктивно съеживаются от слабого ощущения надвигающейся опасности. Небеса темнеют, когда магические грозовые тучи закрывают солнце. Животные буйствуют, пытаясь сбежать из обречённого города. Становится всё холоднее и холоднее... Каждые несколько минут температура падает на десять градусов, а ветер усиливается. Никакой огонь или укрытие не помогают, даже бетон начинает трескаться и разрушаться. Неестественная метель надвигается на Новую Скайнавию, словно приливная волна разрушения и смерти.\n\nКогда она обрушивается, погода становится смертельно опасной: температура опускается ниже полярной, ветер вырывает деревья из земли, и город накрывает снежное цунами. Те немногие грифоны, которые оказываются снаружи, умирают в мучениях, швыряемые ветром, а их лёгкие превращаются в лёд от холода и снега. Некоторые молятся богам, моля о спасении, но сегодня боги их не слышат.\n\nНекоторые, более чувствительные, собрались и бежали на юг при первых признаках этого апокалипсиса – их замёрзшие, сухие тела теперь устилали дороги, ведущие из города. Больше всего повезло тем, кто выбрал быструю смерть от выстрела – предпочтительнее медленной смерти от холода.\n\nКогда метель утихла, Новая Скайнавия исчезла. На улицах лежали изуродованные, обезображенные трупы, а внутри зданий те, кто выжил дольше всех, лежали грудами безжизненных тел, обнимающих друг друга в тщетной надежде согреться.\n\nКогда пони-разведчики добрались до города, они не нашли никого живого – города больше не было, и мечта о равенстве и социализме на Севере умерла вместе с ним. Некогда оживлённые улицы были тихи, покрытые толстым слоем снега, который не таял – и никогда не растает. Новая Скайнавия навсегда останется замороженной могилой, и даже духи ее обитателей не смогут покинуть павший город."
 ntribes.53.a:0 "Так умерла их мечта..."
 ntribes.70.t:0 "Вступление в Северную Лигу"
 ntribes.70.d:0 "Мы только что получили сообщение от нашего северного соседа: пони, по всей видимости, решили прекратить самоизоляцию и обращаются к другим народам Севера Грифонии с предложением. Дипломаты пони предлагают создать альянс для защиты независимости всех северных народов. Примем ли мы их предложение?"
 ntribes.70.a:0 "Да, это будет выгодно обеим сторонам."
 ntribes.70.b:0 "Альянс с ними? Нет!"
 ntribes.71.t:0 "Клаудбьюри вступает в Лигу!"
 ntribes.71.d:0 "Хорошие новости! Наши дипломаты вернулись с положительным ответом, Клаудбьюри решило присоединиться к Северную Лигу. С новым союзником мы стали на шаг ближе к безопасному и мирному Северу.."
 ntribes.71.a:0 "Великолепно!"
 ntribes.72.t:0 "Клаудбьюри отказывается!"
 ntribes.72.d:0 "К сожалению, грифоны Клаудбьюри отказались вступить в Северную Лигу"
 ntribes.72.a:0 "Это... разочаровывает..."
 ntribes.73.t:0 "Вступление в Северную Лигу"
 ntribes.73.d:0 "Мы только что получили сообщение от нашего северного соседа: пони, по всей видимости, решили прекратить самоизоляцию и обращаются к другим народам Севера Грифонии с предложением. Дипломаты пони предлагают создать альянс для защиты независимости всех северных народов. Примем ли мы их предложение?"
 ntribes.73.a:0 "Да, это будет выгодно обеим сторонам."
 ntribes.73.b:0 "Альянс с ними? Нет!"
 ntribes.74.t:0 "Ведина согласилась!"
 ntribes.74.d:0 "Хорошие новости! Наши дипломаты вернулись с положительным ответом. Королевство Ведина решило присоединиться к Северной Лиге. С новым союзником мы стали на шаг ближе к безопасному и мирному Северу."
 ntribes.74.a:0 "Великолепно!"
 ntribes.75.t:0 "Ведина отказалась"
 ntribes.75.d:0 "К сожалению, грифоны Ведины отказались от вступлению в Северную Лигу"
 ntribes.75.a:0 "Разочаровывает..."
 ntribes.76.t:0 "Тир Дейге подчиняется"
 ntribes.76.d:0 "В ходе довольно неожиданного поворота событий к нам пришёл пони-дипломат из северной Грифонии. Похоже, этим пони удалось создать современное, функционирующее государство и даже завоевать некоторые земли грифонов. Однако теперь, столкнувшись с нашей военной мощью, они готовы присоединиться к нам в качестве вассала и присягнуть на верность, если мы предоставим им самоуправление. Примем ли мы это предложение или займём северные пределы воюющей Империи?"
 ntribes.76.a:0 "Хорошо, почему бы и нет."
 ntribes.76.b:0 "Никаких сделок с пони!"
 ntribes.77.t:0 "Наш новый сюзерен"
 ntribes.77.d:0 "Наш посол вернулся из Грифенхейма – имперский регент принял наше предложение, что делает нас вассалами империи. Хотя мы и отказались от своего суверенитета, нам в основном позволено самоуправление, и, учитывая наше отдаленное местоположение, Империя, скорее всего, не будет вмешиваться в наши дела."
 ntribes.77.a:0 "Хорошо, наверное?"
 ntribes.78.t:0 "Война с империей"
 ntribes.78.d:0 "Империя отвергла наше предложение о вассализации, и очевидно, что вскоре они вторгнутся на наши земли. Отразить их нападение будет трудной задачей, мы должны как можно сильнее подготовить оборону!"
 ntribes.78.a:0 "Пусть Духи защитят нас!"
 ntribes.79.t:0 "Неожиданный визит"
 ntribes.79.d:0 "На севере Грифонии обитает группа пони, совершенно непохожих на своих восточных сородичей – ещё более отсталых, чем пони холмов. Однако, в результате поистине неожиданного поворота событий, в последние годы им удалось каким-то образом индустриализироваться и даже начать вмешиваться в международные дела! К нам обратились дипломаты из Тир Дейге с предложением заключить договор о сотрудничестве и дружбе между Речной коалицией и северянами, а также признать их страну почётным членом Коалиции. В обмен на нашу помощь они обещают нам доступ к своему внутреннему рынку и помощь в открытии Северного морского пути для торговли. Хотя мы не рассчитываем получить от этого многого, это не будет дорогостоящим начинанием для начала. Некоторые более идеалистичные члены нашего правительства утверждают, что наш долг – помочь нашим подающим надежды северным братьям и сёстрам в их стремлении к полной модернизации – но стоит ли это того?"
 ntribes.79.a:0 "Почему бы и нет..?"
 ntribes.79.b:0 "Мы вежливо откажемся."
 ntribes.80.t:0 "Помощь коалиции"
 ntribes.80.d:0 "Наши дипломаты вернулись из Речных Земель с хорошими новостями: Коалиция согласилась помочь нам и предоставила почетное членство. Это значительно облегчает доступ к технологическому сотрудничеству, новым рынкам и небольшой, но, тем не менее, полезной программе помощи. Приятно иметь друзей!"
 ntribes.80.a:0 "Замечательно!"
 ntribes.81.t:0 "Коалиция отвернулась от нас"
 ntribes.81.d:0 "Наши дипломаты вернулись ни с чем: речные пони отказались от нашего предложения, так что, очевидно, мы не можем надеяться на их помощь. Что за сборище болванов!"
 ntribes.81.a:0 "*Хнык-хнык*"
 ntribes.82.t:0 "Посетитель из далёких земель"
 ntribes.82.d:0 "Поначалу мы думали, что это искусная мистификация, но, проверив географические книги и опросив нескольких искателей приключений и торговцев, можем подтвердить, что это правда. Нас посетил дипломат из Тир Дейге – захолустного государства пони в Северной Грифонии. На протяжении столетий здесь не происходило ничего примечательного, и на большинстве карт эта местность обозначалась как "Здесь обитают пони", "Северные племена" или "Снежная пустошь." Последнее описание, очевидно, нуждается в корректировке, поскольку теперь эти пони решили наконец принять современность и пришли просить нас о помощи. Лучший способ сделать это – позволить им принять участие в нашей совместной исследовательской программе. Так они получат все полезные знания и, возможно, заодно узнают что-то о дружбе. Конечно, мы можем просто отказать им без каких-либо последствий: вряд ли кого-то в Эквестрии волнует такое далекое и отдалённое государство — почти никто даже не знает о его существовании... Но разве не было бы просто грубо игнорировать новых потенциальных друзей?"
 ntribes.82.a:0 "Мы поможем нашим сородичам!"
 ntribes.82.b:0 "Не-а, отправьте их обратно."
 ntribes.83.t:0 "Эквестрия согласилась"
 ntribes.83.d:0 "Судя по всему, пони Эквестрии действительно такие дружелюбные и готовые прийти на помощь, как об этом говорят. Наш дипломат вернулся, чтобы сообщить нам о поразительном успехе: эквестрийцы предлагают поделиться с нами своими технологиями, что позволяет нам значительно расширить наши знания о современном мире."
 ntribes.83.a:0 "Отлично!"
 ntribes.84.t:0 "Эквестрия отказалась"
 ntribes.84.d:0 "Нам следовало этого ожидать: после первоначального заявления о том, что наше государство ненастоящее, эквестрийцы отказались нам помогать и сказали, что у них есть другие, гораздо более насущные проблемы. Судя по всему, они совсем не дружелюбны!"
 ntribes.84.a:0 "Это разочаровывает..."
 ntribes.85.t:0 "Требования пони"
 ntribes.85.d:0 "До сих пор наша северная граница была мирной, и пони, обитавшие в землях Тир Дейге, жили в полном неведении относительно остального мира. Однако всё изменилось, и, к нашему удивлению, к нам пришёл посланник пони, который потребовал отдать северные пределы нашей территории, утверждая, что это исконные земли пони. Если мы откажемся, пони придут и захватят их силой. Хотя эти земли малонаселённые, наши старатели сообщают, что там можно найти ценные ресурсы. Принять эти смехотворные требования или продемонстрировать этим пони военную доблесть грифонов?"
 ntribes.85.a:0 "Мы сдаёмся."
 ntribes.85.b:0 "Мы уничтожим их!"
 ntribes.86.t:0 "[FROM.GetName] отступает"
 ntribes.86.d:0 "Испугавшись мощи наших воинов, грифоны согласились отдать запрошенные земли."
 ntribes.86.a:0 "Великолепно!"
 ntribes.87.t:0 "Грифоны из [FROM.GetName] отказались!!"
 ntribes.87.d:0 "Высокомерные грифоны рассмеялись над нашими законными требованиями. Они утверждают, что мы можем попытаться захватить эту землю – но лишь развлечём их этой жалкой попыткой. Такое оскорбление нельзя оставить без ответа! Мы пойдем на юг и вернем то, что принадлежит нам!"
 ntribes.87.a:0 "Значит война!"
