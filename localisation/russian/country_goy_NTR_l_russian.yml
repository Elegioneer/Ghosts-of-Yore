### Decisions ###
NTR_spirits_blessings_cat:0 "Магия Духов"
 NTR_spirits_blessings_cat_desc:0 "Духи Севера с незапамятных времен помогали племенам. Однако в эти тяжелые дни требуется более непосредственное их вмешательство. Наши друиды должны попытаться напрямую связаться с Шестью Духами и попросить их о помощи. Сначала нам придется убедить каждый из благословенных кланов оказать нам помощь в установлении контакта с Ними. Затем использование их сил станет изнурительной задачей для смертных тел наших друидов. Мы можем просить только об одном благословении за раз."
 NTR_metal_bless:0 "Благословение §gМеталла§!"
 NTR_metal_bless_desc:0 "Пытливые умы всегда пытались придать металлу форму, соответствующую их потребностям."
 NTR_wood_bless:0 "Благословение §7Дерева§!"
 NTR_wood_bless_desc:0 "Путь пони-мастеров заключается в постоянном стремлении к совершенству."
 NTR_fire_bless:0 "Благословение §OОгня§!"
 NTR_fire_bless_desc:0 "Нельзя выжить в ледяном Севере без огня. Потому у пони стало традицией собираться у домашних очагов во время долгих северных зим."
 NTR_earth_bless:0 "Благословение §8Земли§!"
 NTR_earth_bless_desc:0 "Используй дары земли умеренно и смиренно, ибо ты не властелин природы, но часть её."
 NTR_water_bless:0 "Благословение §2Воды§!"
 NTR_water_bless_desc:0 "Океанские приливы и снежные бури несут разрушение. Но вода — не только стихия войны, но и стихия перемен."
 NTR_ice_bless:0 "Благословение §0Льда§!"
 NTR_ice_bless_desc:0 "Говорят, Север помнит всё — и воспоминания хранятся в его вечных льдах."
 NTR_dark_magic_cat:0 "Тёмная магия"
 NTR_dark_magic_cat_desc:0 "Благодаря договору с Королями Метели мы получили забытые знания - искусство не просто некромантии, а управления природной магией Севера. Это земля Духов, и хотя они стали далеки, их силу можно ощутить - и использовать. Мы больше не будем молить духов о помощи. Мы подчиним их магию нашим целям. Конечно, это может вызвать... беспокойства."
 NTR_raise_dead_dc:0 "Поднять мёртвых"
 NTR_raise_dead_dc_desc:0 "Северные пони веками хранили своих умерших в ледяных склепах. Миллионы тел в вечной мерзлоте - бесконечный источник солдат для нашей армии."
 NTR_raise_dead_dc_2:0 "Поднять мёртвых"
 NTR_raise_dead_dc_2_desc:0 "Северные пони веками хранили своих умерших в ледяных склепах. Миллионы тел в вечной мерзлоте - бесконечный источник солдат для нашей армии."
 NTR_cold_wave:0 "Волна холода"
 NTR_cold_wave_desc:0 "Наш контроль над погодой обратит саму природу против врагов!"
 NTR_bloodlust:0 "Кровожадность"
 NTR_bloodlust_desc:0 "Перенаправление магии духов воинам усилит их ярость и жажду убивать врагов."
 NTR_battlefield_magic:0 "Усилить послушников"
 NTR_battlefield_magic_desc:0 "Мы сосредоточим магию, чтобы дать нашим генералам силы, которые некоторые назвали бы... неестественными."
 NTR_shape_land:0 "Магия земли"
 NTR_shape_land_desc:0 "Наша магия разорвёт землю, создавая новые структуры и открывая скрытые богатства."
 NTR_unnatural_insight:0 "Неестественное прозрение"
 NTR_unnatural_insight_desc:0 "Читая мысли врагов, мы раскроем все их секреты."
 NTR_ritual_dc:0 "Начать ритуал"
 NTR_ritual_dc_desc:0 "Мы завершили подготовку к уничтожению Новой Скайнавии. Высвобождаемая разрушительная сила должна раз и навсегда покончить со скайнавцами. Однако такое мощное заклинание требует времени, а их маги непременно почувствуют возмущения в эфире - они сделают всё, чтобы остановить нас."
 NTR_knowledge_quest_cat:0 "Система образования"
 NTR_knowledge_quest_cat_desc:0 "Знание - сила. Чтобы стать современной нацией, наши пони должны получить хорошее образование."
 NTR_printhouse:0 "Построить типографию"
 NTR_village_schools:0 "Построить сельские школы"
 NTR_educate_adults:0 "Образование для взрослых"
 NTR_everfrost_university:0 "Основать университет Эверфроста"
 NTR_expand_mining_ops_cat:0 "Расширить добычу"
 NTR_expand_mining_ops_cat_desc:0 "Из-за технологической отсталости ресурсы Севера оставались нетронутыми. Пора начать копать глубоко и жадно!"
