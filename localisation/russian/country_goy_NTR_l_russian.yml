 NTR_iron_bear_experstise_desc:0 "Белый медведь в изгнании, известный под прозвищем "Железный Медведь", обладает обширными знаниями в области проектирования пушек и даже хранит некоторые чертежи в своём охотничьем доме. Если к нему приставить команду кузнецов по металлу, это даст нам преимущество в артиллерийском производстве."
