 NTR_brantbeak_gold_mines:0 "Золотые рудники Брэнтбика"
 NTR_purchase_mining_equipment:0 "Закупить современное горное оборудование"
 NTR_thomas_the_steam_engine_cat:0 "Строительство железных дорог"
 NTR_thomas_the_steam_engine_cat_desc:0 "Железные дороги жизненно важны для современной экономики и логистики армии. Пора проложить первые пути!"
 NTR_first_railroad:0 "Первая северная железная дорога"
