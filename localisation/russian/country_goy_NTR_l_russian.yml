 NTR_connect_holy_forge:0 "Проложить пути к Священной Кузнице"
 NTR_connect_skynavia:0 "Соединить со Скайнавией"
 NTR_finish_railroad_construction:0 "Продолжить расширение железных дорог"
 NTR_cloudbury_railroad:0 "Линия Клаудбьюри"
 NTR_coast_railroad:0 "Прибрежная железная дорога"
 NTR_connect_brantbeak:0 "Ответвление на Брэнтбик"
 NTR_smuggling_cat:0 "Контрабанда"
 NTR_smuggling_cat_desc:0 "Мало кто из купцов решается посетить наши земли - опасности Северного прохода отпугивают даже самых смелых капитанов. Но некоторые грифоны готовы рискнуть. Наши 'партнёры' делают довольно интересные предложения..."
 NTR_purchase_bakaran_artillery:0 "Закупить бакарскую артиллерию"
 NTR_purchase_bakaran_artillery_desc:0 "Да, мы тоже удивлены. Как можно не заметить пропажу ПУШКИ - загадка. Но это проблемы речных пони, не наши."
 NTR_purchase_republican_guns:0 "Купить у грифонских полевых командиров"
 NTR_purchase_republican_guns_desc:0 "Республику Грифонов давно терзают банды. Некоторые с радостью продадут нам (бывшее) имущество правительства."
 NTR_purchase_imperial_guns:0 "Купить излишки Рейхсармии"
 NTR_purchase_imperial_guns_desc:0 "С хаосом в Имперских землях военное снаряжение часто оказывается не в тех лапах. Наши контакты в Брэнтбике помогут получить имперское вооружение."
 NTR_purchase_extra_guns:0 "Речные винтовки"
 NTR_purchase_extra_guns_desc:0 "Наши контакты в Речных Землях обещают больше оружия за деньги и время."
 NTR_expand_nl_cat:0 "Расширить Северную Лигу"
 NTR_league_invite_cloudbury:0 "Пригласить герцогство Клаудбьюри"
 NTR_league_invite_vedina:0 "Пригласить королевство Ведину"
 NTR_pony_relations_cat:0 "Отношения с пони"
 NTR_river_fed_honorary_member:0 "Почётное членство в Речной коалиции"
 NTR_river_fed_honorary_member_desc:0 "Речные пони создали коалицию против грифонской агрессии. Наша ситуация схожа. Сотрудничество было бы полезно обеим сторонам."
 NTR_contact_equestria:0 "Сотрудничество с Эквестрией"
 NTR_contact_equestria_desc:0 "Могучая Эквестрия, родина всех пони, несомненно самая развитая и богатая нация мира... По слухам. Их идеология гармонии и 'магия дружбы' известны повсюду. Может, стоит попросить их о помощи..."
 NTR_liberate_np_cat:0 "Освободить наших сородичей"
 NTR_liberate_np_cat_desc:0 "Многие кланы пони живут под властью грифонов южнее Тир Дейге. Победив скайнавцев, пора объединить всех северных пони под властью принцессы. Если грифоны посмеют отказать - мы подкрепим наши требования силой!"
 NTR_demand_from_MNC:0 "Потребовать земли у §YБрэнтбика§!"
 NTR_demand_from_VED:0 "Потребовать земли у §YВедины§!"
 NTR_demand_from_FAT:0 "Потребовать земли у §YКлаудбьюри§!"
 NTR_demand_from_FAW:0 "Потребовать земли у §YКлаудбьюри§!"
 NTR_dark_tower_cat:0 "Построить Башни"
 NTR_dark_tower_cat_desc:0 "Грифоны оказались непокорными и мятежными созданиями. Становится всё труднее контролировать миллионы этих вредителей, и по мере удаления от Вечном Морозе наш контроль ослабевает. Чтобы укрепить нашу власть, будет построен ряд башен. Из них верные приспешники Морозного Короля будут править окрестными землями. Благодаря мощным укреплениям, заклинаниям, встроенным в Башни, и простому запугиванию мы сможем установить гораздо более надёжный контроль над их территориями." 
 NTR_aurora_tower:0 "Башня Полярного Сияния"
 NTR_aurora_tower_desc:0 "Старый дворец Сноуфлэйк служил резиденцией Морозного Короля с самого начала его правления в Тир Дейге. Пришло время расширить его, создав сооружение, достойное истинного Бога Севера. Башня Полярного Сияния, гигантский шпиль из магического льда и лучших северных кристаллов, станет мощным памятником могуществу Морозному Королю."
 NTR_iron_tower:0 "Железная Башня"
 NTR_iron_tower_desc:0 "Каждый день тысячи рабов трудятся и умирают в мастерских Клаудбьюри. Из Железной Башни надсмотрщики будут следить за ними, чтобы гарантировать постоянное снабжение нашей армии оружием. Металлические стены Башни будут служить напоминанием о новой роли некогда гордого города Клаудбьюри."
 NTR_black_tower:0 "Тёмная Башня"
 NTR_black_tower_desc:0 "Возвышенная среди обугленных руин старой столицы грифонов, Тёмная Башня навсегда напомнит грифонам, какая судьба ждёт тех, кто осмелится восстать против Морозного Короля."
 NTR_shadow_tower:0 "Башня Теней"
 NTR_shadow_tower_desc:0 "Тьма опустится на Город Огней. Жители Аквилы будут закованы в цепи и будут служить своим  новым хозяевам до конца времён, живя под сенью нововозведённой Башни."
 NTR_blood_tower:0 "Башня Крови"
 NTR_blood_tower_desc:0 "Красные стены Башни Крови возвышаются над водами озера Румейр, некогда Колыбелью, а ныне Могилой рода Грифонов. Из неё приспешники Морозного Короля обеспечивают нам контроль над Центральной Грифонией."
 NTR_obsidian_tower:0 "Обсидиановая башня"
 NTR_obsidian_tower_desc:0 "Над мраморными зданиями Вечного города возвышается крепость с чёрными стенами. Обсидиановая башня служит напоминанием о том, что даже самые гордые южные города рано или поздно склонятся перед Севером."
 NTR_storm_tower:0 "Штормовая башня"
 NTR_storm_tower_desc:0 "Наша самая западная сторожевая башня, Штормовая башня, служит первой линией обороны против любого существа, которое попытается вторгнуться во владения Морозного Короля. Хотя она напоминает наводящие ужас руины, а её конструкция в основном состоит из обломков кораблей, она, тем не менее, представляет собой мощную крепость, как и все остальные башни."
 NTR_amber_tower:0 "Янтарная башня"
 NTR_amber_tower_desc:0 "Магические свойства янтаря, иногда называемого "кристаллами Эви", ещё не исследованы. Однако, учитывая изобилие этого материала, мы используем его для строительства башни-крепости, чтобы править долиной Эви."
 NTR_slave_mines_cat:0 "Расширить операции по рабской добыче"
 NTR_slave_mines_cat_desc:0 "Благодаря нашим недавним завоеваниям мы получили огромное количество рабов-грифонов. Пришло время использовать их более эффективно для подпитки нашей военной машины. Конечно, будет потеряно много жизней, но мы всегда можем получить новые, так что это не большая проблема."
 NTR_arrowpeak_slave_mine:0 "Расширить шахты Эрроупика"
 NTR_highhill_slave_mine:0 "Расширить шахты Хайхилла"
 NTR_coalfall_slave_mine:0 "Расширить шахты Коулфола"
 NTR_vleugeland_slave_mine:0 "Расширить шахты Влёгеланда"
 NTR_westkeep_slave_mine:0 "Расширить шахты Весткипаа"
 NTR_wingbardy_slave_mine:0 "Расширить южные каучуковые плантации"
 NTR_ecole_slave_mine:0 "Расширить шахты Эколь"
 NTR_last_griffon_alliance_cat:0 "Последний Альянс Грифонов"
 NTR_last_griffon_alliance_cat_desc:0 "Напуганные нашей растущей мощью, грифоны, по-видимому, откладывают свои разногласия и готовятся к финальному, апокалиптическому конфликту. Дипломаты путешествуют между столицами, заключаются союзы, и идёт подготовка к войне. Если мы не будем действовать быстро, мы можем столкнуться с объединённым фронтом оставшихся государств грифонов, решивших сражаться с нами до самого конца.
 NTR_griffon_last_alliance:0 "Формирование Альянса"
 NTR_frost_king_superhighway_cat:0 "Сеть рабских железных дорог"
 NTR_frost_king_superhighway_cat_desc:0 "Наша армия выросла до такой степени, что её больше нельзя снабжать повозками. Хотя неживым солдатам мало что нужно для сражения, постоянные потери сложной техники в современных войнах требуют надёжной системы снабжения.\n\nДостичь этого можно, построив железнодорожную сеть, охватывающую северные пустоши. К счастью, у нас достаточно рабочей силы для этой опасной задачи..."
 NTR_fks_1:0 "Соединить §YЭверфрост§! и §YСтародраконск§!"
 NTR_fks_1_desc:0 "Пролегающая через замёрзшую тундру железная дорога от сердца нашей страны, Эверфроста, до распределительного центра в Стародраконске станет главной артерией системы снабжения армии, откуда поток нашего драгоценного снаряжения будет направляться на передовую."
 NTR_fks_2:0 "Соединить §YСтародраконск§! и §YОзеро Эльф§!"
 NTR_fks_2_desc:0 "Петляя между морозными холмами, железная дорога Стародраконск – Эльфийское Озеро позволяет нашим военным получать надёжные поставки снаряжения с заводов Священной Кузни."
 NTR_fks_3:0 "Соединить §YОзеро Эльф§! и §YСилкхорн§!"
 NTR_fks_3_desc:0 "Гористую местность Брэнтбика необходимо будет завоевать, чтобы снабжать восточный фронт войны против Империи Грифонов. Линия Озеро Эльф – Силкхорн будет символизировать победу Морозного Короля над Северными Духами и, несомненно, станет одним из величайших достижений пони."
 NTR_fks_4:0 "Соединить §YСтародраконск§! и §YСкварк§!"
 NTR_fks_4_desc:0 "В качестве основного пути снабжения для нашего вторжения в Сердце Грифонов был выбран тщательно спланированный маршрут, начинающийся у Стародраконска, проходящий через горный хребет Лостгейт и заканчивающийся у Скварка."
 NTR_flag_fks_1:0 "Железная дорога §YЭверфрост–Стародраконск§! построена."
 NTR_flag_fks_2:0 "Железная дорога §Стародраконск–Скварк§! построена."
 NTR_flag_fks_3:0 "Железная дорога §Стародраконск–Озеро Эльф§! построена."
 NTR_claim_our_destiny_cat:0 "Восхождение севера"
 NTR_claim_our_destiny_cat_desc:0 "Завоевав Клаудбьюри, центр власти несостоявшегося республиканского правительства, мы получили власть над большим количеством грифонов, численность которых значительно превышает численность северных пони. Это создаёт множество внутренних и геополитических проблем, которые нам придется решать, если мы хотим сохранить свой контроль."
 NTR_claim_our_destiny:0 "Заявить о нашем предназначении!"
 NTR_goy_noaat_smiths_upgrade_cat:0 "Улучшение оружия"
 NTR_goy_noaat_smiths_upgrade_cat_desc:0 "В эти тяжкие времена древние рода северных оружейников стали основой нашей военной промышленности. Не приняв присущее этой эпохе распространение пороха, они вместо этого взялись за улучшение старого оружия из дерева и металла."
 NTR_upgrade_smiths_1:0 "Навыки улучшаются..."
 NTR_get_upgrade_smiths_1:0 "Перейти на новое снаряжение"
 NTR_upgrade_smiths_2:0 "Навыки улучшаются..."
 NTR_get_upgrade_smiths_2:0 "Перейти на новое снаряжение"
 NTR_upgrade_smiths_3:0 "Раскрываются древние секреты..."
 NTR_get_upgrade_smiths_3:0 "Зачаровать наше оружие"
 NTR_firefly_coal:0 "Угольный бассейн Светлячкового леса"
 NTR_knights_upgrade_category:0 "Модернизация рыцарских подразделений"
 NTR_knights_upgrade_category_desc:0 "Веками, рыцари-грифоны были величайшей силой на всей Грифонии. Их броня, дисциплина, и доблесть устрашали врагов на поле боя, а их кличи заставляли целые армии разбегаться в страхе. Те времена давно прошли, однако рыцари и их традиции никуда не делись, и им приходится адаптироваться под реалии современной войны. С новейшим вооружением и былой преданностью, рыцари Роузвуд станут устрашающими титанами на полях битв, как века назад."
 NTR_research_knights_tech:0 "Улучшение рыцарей"

