NTR_GATHERING_STORM_DESC1:0 "\n\n\n\n\n\n\n\n£GFX_texticon_CSSc_GOY_NTR_map\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nСеверные окраины Грифонии всегда были загадочным местом – страной магии и суровых зим. И все же, несмотря на трудности, племена Тир Дейге процветали, живя в мире с природой и духами. Однако теперь, после вторжения коммунистов с юга, пони были вынуждены вести войну, которую им было нелегко выиграть. Спустя два десятилетия, ситуация достигла критической точки. Реформаторы призывают к переменам, в то время как на Севере появились гораздо более темные силы, стремящиеся подорвать статус-кво. Только время покажет, смогут ли племена пережить надвигающуюся бурю..."

### State Description ###
state_lore_text_container_state_name_short_562:0 "Эверфрост"
 state_lore_text_container_state_name_562:0 "§YГород§! §Cкристальных шпилей§!"
 state_lore_text_container_state_description_562:0 "Во всём мире распространено мнение, что в северной §YГрифонии§! нет городов — лишь кучки лачуг и бревенчатых хижин, разбросанных по замёрзшей пустоши. Это ещё больше удивляет иностранцев, когда они посещают §CЭверфрост§! — столицу §YТир Дейге§! и её крупнейший город. История Эверфроста начинается с объединения §Yсеверных племён§! §CКхэнехом Сноуфлэйком§!. Великие маги и ремесленники начали возводить сооружение, известное сегодня как §YДворец Сноуфлейк§!, как резиденцию нового короля и место собраний кланов. Говорят, что Дворец был скорее "выращен", чем построен, с помощью техник, которые позже были забыты, а друиды сумели превратить кристаллы в семь величественных шпилей, которые стали самыми высокими сооружениями в городе.\n\nС течением веков город медленно рос, став главным торговым центром Тир Дейге. После торговцев появились ремесленники, а когда в залах Дворца Сноуфлэйков была создана §Yвеликая библиотека§!, многие пони отправились в Эверфрост, чтобы изучать знания предыдущих поколений. В результате Эверфрост не похож ни на один другой город Грифонии — это место искусства и красоты, где даже самые маленькие здания искусно украшались на протяжении поколений. Пони стремились расширять свои жилища как на поверхности, так и под ней, и можно увидеть, как следующие владельцы расширяли унаследованные ими дома, стремясь превзойти достижения своих предков. Конечно же, нельзя забывать и о §Yвеликих кланах§! – каждый из них, из чувства чести, возвёл большой особняк-шпиль, подражающий королевскому дворцу, демонстрируя богатство и могущество клана. Однако годы войны с §RСкайнавией§! также повлияли на Эверфрост – хотя он и не подвергся прямым атакам, он был наводнен §Yбеженцами§!, которые теперь населяют импровизированные кварталы, возведённые на окраинах столицы. Здесь останавливаются отряды перед выдвижением на фронт, а мастерские производят оружие, а не произведения искусства. Мир и гармония Эверфроста ушли – возможно, навсегда, но город по-прежнему остаётся символом единства пони и их изобретательности."
 
 state_lore_text_container_state_name_short_574:0 "Священная Кузня"
 state_lore_text_container_state_name_574:0 "§YГора§! §Oволшебного огня§!"
 state_lore_text_container_state_description_574:0 "§YСевер Грифонии§! – земля множества чудес, дикой природы и могущественной магии, которые часто сочетаются друг с другом, и, в отличие от многих других, северные пони научились существовать в гармонии с этой землей и ее причудами, вместо того чтобы пытаться их уничтожить. Одно из чудес §YСевера§! - вулкан §OФаерплюм§!, расположенный на севере §YГор Уайттейл§!. Клубы дыма, поднимающиеся над ним, видны за много миль, однако местность вокруг него – отнюдь не, как можно было бы ожидать, безлюдная пустошь. На самом деле, чем ближе кто угодно подойдёт к горе, тем больше жизни он увидит. В отличие от большинства северных земель, здесь деревни и небольшие городки многочисленны и расположены близко друг к другу – особенно на берегах §4озера Эльф§!, еще одного чуда этих земель. Благодаря могущественной магии воды озера никогда не замерзают, а земля вокруг него, удобренная вулканическим пеплом, приносит обильные урожаи. И все же, каким бы живописным и завораживающим ни было это место, оно меркнет по сравнению с горной вершиной над ним.\n\nЛегенда гласит, что прародители §Rклана Молтенрок§! поселились на берегах §4озера Эльф§! после того, как сверхъестественное похолодание вынудило их мигрировать на юг. Какое–то время все было хорошо - пока вулкан не проснулся, извергнув огонь и пепел на поселение пони. И все же единороги §Rклана Молтенрок§! не сбежали. Вместо этого самые храбрые из них отправились прямиком в горы, где встретили одного из §2Великих Северных Духов§!, §gДуха Металла§!. Пораженный их храбростью и любопытством, он согласился заключить с ними договор. С помощью духа пони удалось создать мощную магическую печать, позволяющую обуздать силу вулкана – и использовать ее для созидания.\n\nМного лет спустя §tСвященная Кузня§! превратилась в город, не похожий ни на один другой в §YГрифонии§!, будучи построенным внутри действующего вулкана. Когда посетители прибывают сюда, они прежде всего видят величественные §LВеликие врата§!, сделанные из зачарованной стали. Ни один захватчик до сих пор не смог одолеть их. Внимательный наблюдатель увидит сложную систему труб и механизмов, с помощью которых они отворяются. На самом деле, подобные устройства можно увидеть по всему городу, приводимые в действие паром, который производится из воды §4озера Эльф§! и тепла, выделяемого магмой вулкана. Внутри город больше напоминает шумный улей, чем обычный населенный пункт. Комнаты, вырубленные в стенах вулкана, образуют сеть пещер, уходящих на сотни метров вверх – и почти настолько же под землю. В этих пещерах, образующих оболочки домов, мастерских, таверн и рынков, кипит жизнь. Жилые помещения здесь богато украшены произведениями искусства, созданными поколениями §RМолтенрокских§! мастеров, а искусно расположенные зеркала рассеивают свет множества волшебных ламп по всей сети пещер. То тут, то там можно найти бассейны с горячей водой, богатой минералами. Местные жители любят купаться в них – как ради удовольствия, так и из-за предполагаемых целебных свойств воды. Эти бассейны также служат источником воды для гигантской оранжереи, напоминающей небольшой лес, созданной столетия назад совместными усилиями с §7кланом Гринхуф§! в качестве природного заповедника в этом месте, полном камня и металла.\n\nПо мере приближения к жерлу вулкана жара становится невыносимой, и открываются новые просторные залы – истинное сердце §tСвященной Кузни§!. Здесь днем и ночью молоты, приводимые в действие как магией, так и паром, обрабатывают металл, в то время как единороги осторожно направляют потоки магмы для питания печей и устройств, назначение которых неизвестно посторонним. Здесь §9формовщики металла§! изготавливают не только самые мощные орудия войны, используемые северными пони, – их знаменитое магическое оружие, – но и прочные инструменты и великолепные произведения искусства. Это отнюдь не безопасная работа, и зоркий глаз может заметить многочисленные ожоги, шрамы и недостающие конечности у смелых единорогов, которые здесь работают. Вулкан, возможно, и был усмирен, но он жаждет свободы и временами выходит из-под контроля. Еще глубже в недрах горы находится §gРасплавленное святилище§! – самое святое место клана, где их предки заключили договор с Великим Духом Металла. По традиции, каждый юный §9формовщик§! в конце своего обучения приносит сюда достойный подарок для духа. Этот подарок бросается в гигантский бассейн расплавленного металла, как символ единства всех членов клана и их связь с Духом. После этого §9формовщик§! извлекает немного металла и заново кует из него выплавленное изделие, все время стараясь улучшить его любым возможным способом. Когда §9формовщик§! умирает, этот перекованный предмет снова отправляется в бассейн металла в ходе похоронного обряда.\n\nНесмотря на то, что §tСвященная Кузня§! не может даже близко тягаться в производительности с промышленными городами современности, она остается крупнейшим центром производства товаров в стране северных пони, даже учитывая то, что ее единороги всегда больше ценят красоту и надежность изделия, чем простоту и лёгкость в производстве. Но здесь только начинается новая эра, когда молодые единороги начинают возиться с ружьями и машинами, привезенными с юга, и отливаются стволы первых пушек."

### Ideas ###
NTR_war_north:0 "Война на севере"
 NTR_war_north_desc:0 "С тех пор, как вторглись скайнавцы, мы оказались втянуты в кровопролитную войну. Целое поколение пони погибло в бесконечных стычках, и теперь мы на грани краха. Наше ополчение ослаблено, наши ресурсы истощены, и ясно, что наша нынешняя тактика не позволит нам победить. Поскольку коммунисты сейчас собирают свои силы, мы должны действовать быстро, если хотим сохранить независимость племен!"
 NTR_warriors_of_blizzard:0 "Воины метели"
 NTR_warriors_of_blizzard_desc:0 "Пони Тир Дейге искусны в зимних боях. Север — это их дом, и они знают, как использовать его особенности в своих интересах."
 NTR_tribal_militias:0 "Племенное ополчение"
 NTR_tribal_militias_desc:0 "Наша "армия" состоит из ополченцев различных племен. Их понимание современной войны крайне ограничено, как и сотрудничество между их предводителями. Пока мы не решим эти проблемы, наша армия не сможет должным образом противостоять захватчикам."
 NTR_tribal_militias_2:0 "Военные реформы"
 NTR_tribal_militias_2_desc:0 "В данный момент, мы преобразовываем племенное ополчение в современную армию. Это, однако, займёт некоторое время."
 NTR_tribal_militias_3:0 "Послушные ополченцы"
 NTR_tribal_militias_3_desc:0 "С помощью убеждения и взяток мы заставили командиров ополчения выполнять наши приказы."
 NTR_tribal_militias_4:0 "Опытные ополченцы"
 NTR_tribal_militias_4_desc:0 "Наши закалённые, кровожадные ополченцы были выкованы в пожаре войны!"
 NTR_exiled_clans:0 "Изгнанные кланы"
 NTR_exiled_clans_desc:0 "После того как грифоны захватили наши западные земли, многие местные кланы бежали на восток. Это вызвало масштабный кризис, поскольку наше примитивное сельское хозяйство не способно прокормить столько пони. Ситуацию усугубляет то, что изгнанники, жаждущие мести, легко поддаются влиянию радикальных идей."
 NTR_exiled_clans_3:0 "Изгнанные кланы"
 NTR_exiled_clans_3_desc:0 "После того как грифоны захватили наши западные земли, многие местные кланы бежали на восток. Это вызвало масштабный кризис, поскольку наше примитивное сельское хозяйство не способно прокормить столько пони. Ситуацию усугубляет то, что изгнанники, жаждущие мести, легко поддаются влиянию радикальных идей."
 NTR_divided_clans:0 "Расколотые кланы"
 NTR_divided_clans_desc:0 "Вторжение грифонов раскололо наше общество. Наш прежний уклад жизни оказался устаревшим, и теперь многие пони открыто отвергают древние традиции, требуя быстрой модернизации и перенятия некоторых грифонских ценностей. Даже правление принцессы Фианы ставится под сомнение. Последним оплотом сопротивления остаются друиды и вожди традиционалистских кланов. Но с каждым днём наше влияние слабеет. Если в ближайшее время не разрешить этот кризис, мы рискуем окончательно утратить власть."
 NTR_defensive_doctrine:0 "Оборонительная доктрина"
 NTR_defensive_doctrine_desc:0 "Мы укрепили дух наших солдат!"
 NTR_lightning_speed:0 "Быстрее молнии"
 NTR_lightning_speed_desc:0 "Наши воины рвутся в бой. Они готовы нанести быстрый и сокрушительный удар!"
 NTR_heroes_weapons:0 "Оружие современных героев"
 NTR_heroes_weapons_desc:0 "Да, ружья могут быть не такими эффектными, как волшебные мечи, зато куда полезнее в деле."
 NTR_streamlined_tank:0 "Массовое производство танков"
 NTR_streamlined_tank_desc:0 "Благодаря последним технологическим достижениям мы можем производить танки с поразительной эффективностью."
 NTR_forged_artillery:0 "Кованные орудия"
 NTR_forged_artillery_desc:0 "Наши оружейные заводы переоборудованы для массового выпуска высококачественных артиллерийских орудий."
 NTR_officer_corps:0 "Новое офицерство"
 NTR_officer_corps_desc:0 "Обучение офицеров в академиях куда эффективнее, чем метод "научатся всему в бою": так мы теряем меньше перспективных кадров и сразу отсеиваем неспособных."
 NTR_increased_conscription:0 "Усиленная мобилизация"
 NTR_increased_conscription_desc:0 "Чтобы защитить границы, нам нужно больше солдат — теперь воевать придётся каждому."
 NTR_north_shield:0 "Щит Севера"
 NTR_north_shield_desc:0 "Клан Стормшилд вновь стоит на страже пони, защищая их от многочисленных врагов."
 NTR_crystal_bombs:0 "Магические бомбы"
 NTR_crystal_bombs_desc:0 "Огненный шар — отличный способ расправиться с толпой врагов. Бомба — тоже! А что, если совместить их?"
 NTR_modern_navy:0 "Современный флот"
 NTR_modern_navy_desc:0 "Благодаря реформам мы создали современный эффективный флот, заменив старые деревянные корабли новыми металлическими судами."
 NTR_riders_storm_idea:0 "Всадники бури"
 NTR_riders_storm_idea_desc:0 "Наши лётчики способны подняться в небо даже в самую свирепую непогоду."
 NTR_new_diplomatic:0 "Новый дипломатический корпус"
 NTR_new_diplomatic_desc:0 "Мы создали профессиональную дипломатическую службу для налаживания связей с другими народами."
 NTR_equality_tolerance:0 "Равенство и терпимость"
 NTR_equality_tolerance_desc:0 "В нашей стране все равны — независимо от расы или веры. Уважая традиции других, мы облегчаем управление ими."
 NTR_griffons_army:0 "Грифоны в армии"
 NTR_griffons_army_desc:0 "Благодаря нашей политике терпимости, множество грифонов-добровольцев вступают в ряды вооружённых сил."
 NTR_northern_passage:0 "Северный проход"
 NTR_northern_passage_desc:0 "Усилиями нашего флота Северный проход открыт для торговли, и мы уже пожинаем плоды возросшей коммерческой активности."
 NTR_greenhouses:0 "Тепличное земледелие"
 NTR_greenhouses_desc:0 "С распространением теплиц в сельском хозяйстве начался демографический взрыв. Теперь, без угрозы голода, наши пони могут позволить себе заводить несколько жеребят."
 NTR_economic_miracle:0 "Северное экономическое чудо"
 NTR_economic_miracle_desc:0 "Там, где раньше были лишь деревянные хижины и замёрзшие пустоши, теперь высятся сверкающие города и современные фабрики. Хотя некоторые сетуют, что мы забыли традиции, нельзя отрицать: модернизация принесла нам оглушительный успех."
 NTR_modified_crops:0 "Модифицированные культуры"
 NTR_modified_crops_desc:0 "То, на что ушли бы поколения селекции, с помощью магии удалось совершить за несколько лет. Мы создали новые виды растений с удивительными свойствами, которые революционизируют наше сельское хозяйство." 
 NTR_bountiful_land:0 "Богатая земля"
 NTR_bountiful_land_desc:0 "То, что другие называют ледяными пустошами, для нас является неиссякаемым источником ресурсов."
 NTR_experienced_pegasi:0 "Опытные пегасы"
 NTR_experienced_pegasi_desc:0 "Закалённые суровой жизнью в Тир Дейге, наши пегасы — свирепые воины, и среди них никогда не бывает недостатка в добровольцах, желающих к нам присоединиться."
 NTR_controlled_trade:0 "Контролируемая внешняя торговля"
 NTR_controlled_trade_desc:0 "Мы ограничили доступ иностранных купцов несколькими избранными портами и факториями, чтобы они не нарушали покой и гармонию наших пони."
 NTR_bomber_focus:0 "Упор на бомбардировщики"
 NTR_bomber_focus_desc:0 "Современные технологии могут быть и полезными, и зрелищными — стоит только взглянуть на все эти взрывы!"
 NTR_fighter_focus:0 "Упор на истребители"
 NTR_fighter_focus_desc:0 "Как когда-то пегасы, теперь самолёты защищают наше небо."
 NTR_alchemist_workshop:0 "Алхимические мастерские"
 NTR_alchemist_workshop_desc:0 "Благодаря нашей поддержке алхимики могут производить свои зелья гораздо эффективнее."
 NTR_elixir_of_fortitude:0 "Эликсир стойкости"
 NTR_elixir_of_fortitude_desc:0 "Вооружившись этим магическим эликсиром, наши воины могут сражаться днями напролёт, не нуждаясь в дополнительных припасах."
 NTR_magical_medicine:0 "Магическая медицина"
 NTR_magical_medicine_desc:0 "С помощью магии мы можем излечивать даже самые тяжёлые болезни и спасать наших подданых от неминуемой гибели."
 NTR_loyal_militias:0 "Верное ополчение"
 NTR_loyal_militias_desc:0 "Племенные ополченцы подчиняются приказам своей принцессы. Хотя это и не решает всех наших военных проблем, теперь у нас есть один лидер и одна цель."
 NTR_proper_army_idea:0 "Современная армия"
 NTR_proper_army_idea_desc:0 "Хотя поначалу реформа и была непопулярна, даже убеждённые традиционалисты теперь признают её необходимость. Наша военная структура была унифицирована и оптимизирована, в результате чего армия стала гораздо более профессиональной и управляемой по сравнению с прежними разрозненными дружинами."
 NTR_reformed_militias:0 "Реформированные ополчения"
 NTR_reformed_militias_desc:0 "Пусть они и уступают более современным армиям, наши ополченцы закалены в прошлых конфликтах и (в основном) подчиняются приказам своей принцессы."
 NTR_integration_effort:0 "Программа интеграции"
 NTR_integration_effort_desc:0 "Мы пытаемся перевоспитать скайнавских грифонов, чтобы они следовали правилам нашего общества."
 NTR_strict_hierarchy:0 "Жёсткая иерархия"
 NTR_strict_hierarchy_desc:0 "Наше общество разделено на три группы: пони, коренные грифоны севера и коммунисты Скайнавии. В то время как пони доминируют, а те немногие грифоны, что жили с нами на Севере, считаются равными, все остальные в основном спокойно живут, но не имеют почти никакого влияния на политику нашей страны."
 NTR_protector_homeland:0 "Защитники Родины"
 NTR_protector_homeland_desc:0 "Скайнавия пала. Ещё одной не быть!"
 GOY_frozen_economy:0 "Ледяной занавес"
 GOY_frozen_economy_desc:0 "Почти никто из чужаков не входит во владения Морозного Короля. А те, кто входит — не возвращаются."
 NTR_ice_curtain_idea:0 "Северная стена"
 NTR_ice_curtain_idea_desc:0 "Укреплений никогда не бывает слишком много."
 NTR_fine_weapons:0 "Лучшее оружие"
 NTR_fine_weapons_desc:0 "Оружейники клана Молтенрок создают только лучшее оружие. Вся продукция, не соответствующая их высоким стандартам, переплавляется, ибо для мастера позорно создавать посредственные изделия."
 NTR_endurance_blessing:0 "Благословение стойкости"
 NTR_endurance_blessing_desc:0 "Наши благословлённые ружья нерушимы!"
 NTR_holy_tanks:0 "Святые танки"
 NTR_holy_tanks_desc:0 "Наши танки, о которых иногда говорят, что они ездят без экипажа, имеют особую связь с божественным Духом Металла."
 NTR_built_to_last:0 "Построено на века"
 NTR_built_to_last_desc:0 "Наши здания и памятники созданы, чтобы выдерживать даже самые суровые условия и служить многим поколениям пони. Через сто лет, когда бетонные города грифонов рассыплются в прах, наши будут как новенькие."
 NTR_craftsmen_way:0 "Путь мастерового"
 NTR_craftsmen_way_desc:0 "Немногие могут сравниться с опытом и талантом наших мастеров."
 NTR_crystal_construction:0 "Кристальные строения"
 NTR_crystal_construction_desc:0 "Наши маги способны формировать кристаллы в целые здания. Такие сооружения могут казаться хрупкими, но они чрезвычайно прочны и даже могут самостоятельно восстанавливать повреждённые фрагменты."
 NTR_rebelling_clans:0 "Мятежные кланы"
 NTR_rebelling_clans_desc:0 "После нашего прихода к власти многие кланы открыто восстали. Мы должны либо убедить их, либо сломить их сопротивление, если хотим утвердить свой контроль над Севером."
 NTR_princess_fiana:0 "Принцесса Фиана II"
 NTR_princess_fiana_desc:0 "Хотя её власть в основном церемониальна, принцесса Фиана Сноуфлэйк является важным символом северного единства. Принцесса довольна своей нынешней ролью и поддерживает действия вождя Эуана."
 NTR_queen_fiana:0 "Королева Фиана I"
 NTR_queen_fiana_desc:0 "Королеву Севера Фиану I из клана Сноуфлэйк любят как пони, так и грифоны. Она, фактически, служит символом единства между видами."
 NTR_central_gov:0 "Королевское правительство"
 NTR_central_gov_desc:0 "Мы ограничили автономию кланов и сосредоточили власть в копытах премьер-министра, назначаемого монархом."
 NTR_democratic_inst:0 "Демократические институты"
 NTR_democratic_inst_desc:0 "В результате недавних реформ власть перешла к демократически избранному Северному Совету, первым канцлером которого стал Эуан Стормшилд."
 NTR_modern_tax:0 "Современная налоговая политика"
 NTR_modern_tax_desc:0 "Никто не любит налоги, но они необходимы для функционирования государства."
 NTR_harsh_tax:0 "Жёсткое налогообложение"
 NTR_harsh_tax_desc:0 "В жизни неизбежны только две вещи: смерть и налоги."
 NTR_tribal_resistance:0 "Племенное сопротивление"
 NTR_tribal_resistance_desc:0 "Северные пони восстали против нашего правления и активно сражаются с нами."
 GOY_NTR_frozen_curtain:0 "Ледяной занавес"
 GOY_NTR_frozen_curtain_desc:0 "Лишь немногие чужеземцы входят во владения Морозного Короля, и ещё меньше возвращаются."
 NTR_warrior_lodges_idea:0 "Военные дружины"
 NTR_warrior_lodges_idea_desc:0 "Молодые пони стекаются в военные дружины, надеясь добыть славу в бою, проливая кровь наших врагов."
 NTR_warrior_lodges_idea_1:0 "Военные дружины"
 NTR_warrior_lodges_idea_1_desc:0 "Молодые пони стекаются в военные дружины, надеясь добыть славу в бою, проливая кровь наших врагов."
 NTR_circle_guidance:0 "Наставления Круга Льда"
 NTR_circle_guidance_desc:0 "Все друиды Тир Дейге теперь входят в Круг Льда. Их силы исходят непосредственно от Морозного Короля, что обеспечивает покорность пони, которыми они руководят."
 NTR_chosen_ones:0 "Избранные"
 NTR_chosen_ones_desc:0 "Самые могущественные из наших воинов получают в награду магические силы."
 NTR_chosen_ones_1:0 "Избранные"
 NTR_chosen_ones_1_desc:0 "Самые могущественные из наших воинов получают в награду магические силы."
 NTR_broken_ties:0 "Разорванные связи с духами"
 NTR_broken_ties_desc:0 "После наших действий Шесть Духов больше не помогают нам. Друиды бессильны, а наше общество рушится под натиском болезней, голода и снежных бурь."
 NTR_broken_ties_1:0 "Разорванные связи с духами"
 NTR_broken_ties_1_desc:0 "После наших действий Шесть Духов больше не помогают нам. А силы Морозного Короля пока недостаточны, чтобы полностью защитить его подданных от стихий."
 NTR_the_horde:0 "Орда нежити"
 NTR_the_horde_desc:0 "Наши воскрешённые воины были усилены дополнительными заклинаниями, что значительно улучшило их боевые качества."
 NTR_more_guns:0 "Кустарные ружья"
 NTR_more_guns_desc:0 "Наши оружейники и рабы вынуждены производить ошеломляющее количество оружия — однако его качество сильно варьируется..."
 NTR_feudal_overlords:0 "Феодальные правители"
 NTR_feudal_overlords_desc:0 "Мы низвели большинство грифонов до положения крепостных, установив пони как правящий класс. От пони-правителей ожидается, что они будут поставлять нашей армии рабов-воинов и ресурсы, добытые на их землях — как именно они выполнят квоты, остаётся на их усмотрение."
 NTR_feudal_overlords_1:0 "Феодальные правители"
 NTR_feudal_overlords_1_desc:0 "Мы низвели большинство грифонов до положения крепостных, установив пони как правящий класс. От пони-правителей ожидается, что они будут поставлять нашей армии рабов-воинов и ресурсы, добытые на их землях — как именно они выполнят квоты, остаётся на их усмотрение."
 NTR_industrial_slavery:0 "Промышленное рабство"
 NTR_industrial_slavery_desc:0 "Города превращены в гигантские трудовые лагеря, где грифоны вынуждены трудиться во славу Морозного Короля."
 NTR_undead_autonomy:0 "Автономная нежить"
 NTR_undead_autonomy_desc:0 "Наши воины-нежить больше не просто бездумные орудия и требуют гораздо меньшего контроля со стороны вождей."
 NTR_undead_overseers_idea:0 "Неживые надсмотрщики"
 NTR_undead_overseers_idea_desc:0 "Хотя использование более автономной нежити в качестве надсмотрщиков за рабами устранило некоторые... неэффективности, вызванные излишне садистскими или слишком милосердными живыми надзирателями, кажется, грифоны стали ненавидеть нас ещё сильнее."
 NTR_pillage_herzland:0 "Разграбление Герцланда"
 NTR_pillage_herzland_desc:0 "Жги и уничтожай!"
 NTR_widespread_unrest:0 "Всеобщие волнения"
 NTR_widespread_unrest_desc:0 "По всем нашим владениям грифоны поднимают восстания. Пока мы не подавим мятеж на Юге, мы не сможем справиться с другими мелкими выступлениями."
 NTR_conquerors_of_griffonia:0 "Покорители Грифонии"
 NTR_conquerors_of_griffonia_desc:0 "Не осталось никого, кто мог бы остановить нас. Свободные грифоны дрожат от страха, зная, что однажды мы придём и за ними."
 NTR_extra_shifts:0 "Дополнительные смены"
 NTR_extra_shifts_desc:0 "Наших рабов заставляют работать ещё дольше, чем прежде, а условия на фабриках стали хуже, чем когда-либо."
 NTR_expenses:0 "Бюджетный дефицит"
 NTR_expenses_desc:0 "Последние инвестиции оказались весьма затратными."
 NTR_massive_expenses:0 "Огромный бюджетный дефицит"
 NTR_massive_expenses_desc:0 "Что ж... Мы действительно тратим очень много."
 NTR_like_wind:0 "Как ветер"
 NTR_like_wind_desc:0 "Лучший способ победить - избегать столкновений. Мы будем двигаться быстро, в тыл врага, оставляя силы Скайнавии позади."
 NTR_defensive_tactics:0 "Оборонная война"
 NTR_defensive_tactics_desc:0 "Копать и укреплять! Лишних окопов не бывает!"
 NTR_griffon_knowledge:0 "Знания грифонов"
 NTR_griffon_knowledge_desc:0 "Простое копирование некоторых грифонских устройств даёт нам огромный объём технических знаний."
 NTR_ploughs_into_swords:0 "Перековать орала на мечи"
 NTR_ploughs_into_swords_desc:0 "Мы направляем все ресурсы на производство большего количества оружия для нашей армии."
 NTR_hold_line_idea:0 "Держать линию"
 NTR_hold_line_idea_desc:0 "Нам нужно продержаться ещё немного!"
 NTR_undead_surplus:0 "Новая нежить"
 NTR_undead_surplus_desc:0 "Мы поднимаем многочисленных грифонов, погибших при разрушении Новой Скайнавии."
 NTR_riches_of_south:0 "Южная добыча"
 NTR_riches_of_south_desc:0 "Мы разграбляем завоёванные грифонские земли."
 NTR_unnatural_weather:0 "Неестественная погода"
 NTR_unnatural_weather_desc:0 "Метели, ураганы, наводнения... Кажется, сама погода ополчилась против нас."
 NTR_bloodrage:0 "Кровавая ярость"
 NTR_bloodrage_desc:0 "Наполненные неестественной энергией, наши солдаты атакуют с огромной силой. Однако они склонны игнорировать собственную безопасность."
 NTR_sorcerer_generals:0 "Офицеры-чародеи"
 NTR_sorcerer_generals_desc:0 "Удивительно, насколько эффективнее может быть офицер, наделённый магическими способностями."
 NTR_subdue_land:0 "Укрощение земли"
 NTR_subdue_land_desc:0 "Мы превращаем камень в новые здания и добываем скрытые под ним ресурсы."
 NTR_iseeyou:0 "Я вижу тебя"
 NTR_iseeyou_desc:0 "Ничто и никто не может скрыться от нас."
 NTR_magical_disturbance:0 "Магические аномалии"
 NTR_magical_disturbance_desc:0 "Естественные энергии, протекающие через Тир Дейге, насильно перенаправляются. Конечно, это сказывается на населении: погода становится непредсказуемой, а местная фауна проявляет агрессию."
 NTR_modern_infrastructure:0 "Современная инфраструктура"
 NTR_modern_infrastructure_desc:0 "Развитая железнодорожная сеть необходима для любого современного государства."
 NTR_prepared_assault:0 "Подготовленное наступление"
 NTR_prepared_assault_desc:0 "Отряды пони пересекли границу и готовы оказать поддержку в предстоящей войне. Однако нам нужно действовать быстро, пока птицы не выявили наших лазутчиков."
 NTR_ice_fleet:0 "Ледяной флот"
 NTR_ice_fleet_desc:0 "Сначала это казалось нелепым, но это работает!"
 NTR_integrated_society:0 "Интеграция грифонов"
 NTR_integrated_society_desc:0 "Процесс интеграции был непростым, но теперь грифоны комфортно живут среди нас, а наше общество стало гораздо более открытым для чужаков."
 NTR_frost_auxilias_region:0 "Вартайские вспомогательные войска"
 NTR_frost_auxilias_region_desc:0 "Помощь пони из Вартая значительно упрощает контроль над этим регионом."
 ntr_closed_economy:0 "Закрытая экономика"
 NTR_dark_acolytes:0 "Метка Морозного Короля"
 NTR_dark_acolytes_desc:0 "Хотя таковых немного, но самые доверенные последователи Морозного Короля получили дополнительные силы от его тёмной магии."
 NTR_skyfall_ship:0 "Верфи Скайфола"
 NTR_skyfall_ship_desc:0 "Каждый день верфи Скайфола производят всё больше кораблей для усиления нашей растущей армады. Скоро мы будем править и землёй, и морем."
 NTR_skyfall_gun:0 "Военная промышленность Скайфола"
 NTR_skyfall_gun_desc:0 "Скайфол стал одним из главных центров нашей рабской экономики. Его фабрики производят огромное количество оружия, необходимого нашей армии."
 NTR_skyfall_industry:0 "Богатства Скайфола"
 NTR_skyfall_industry_desc:0 "Товары, произведённые рабскими фабриками Скайфола, отправляются на север, где они необходимы, в то время как грифоны города вынуждены создавать оружие, которое мы используем против их же сородичей."
 NTR_icetribute:0 "Грифонская дань"
 NTR_icetribute_desc:0 "Мы свободно грабим и эксплуатируем южные земли."
 NTR_avenge_griffonstone:0 "Отомстим за Грифонстоун!"
 NTR_avenge_griffonstone_desc:0 "Разрушение Грифонстоуна только подстегнуло грифонов продолжать борьбу против Морозного Короля!"
 NTR_griffon_final_war_boost:0 "Последний Альянс Грифонов"
 NTR_griffon_final_war_boost_desc:0 "Пожалуй, впервые в истории грифоны объединились, отбросив разногласия. Их цель проста - защитить свой род от Морозного Короля. Все грифонские нации стоят вместе, их общества готовятся к тотальной войне, где каждый последний гриф станет солдатом."
 NTR_all_front:0 "Всё для фронта!"
 NTR_all_front_desc:0 "Как ни странно, грифоны побеждают нас. Мы должны мобилизовать каждого пони, чтобы остановить их!"
 NTR_kill_ntribes:0 "Наш последний шанс"
 NTR_kill_ntribes_desc:0 "Над Новой Скайнавией установилась неестественно штормовая погода, а наши разведчики на территории Северных Племён сообщают, что пони-архидруид готовит какое-то заклинание, способное полностью уничтожить нашу столицу и превратить окрестности в бесплодную пустошь. Мы не можем допустить этого, ведь такое событие приведёт к гибели нашего государства и положит конец коммунистическому делу!"
 NTR_death_skynavia:0 "Утрата Новой Скайнавии"
 NTR_death_skynavia:0 "Новая Скайнавия, наш самый большой город, столица и маяк коммунистической революции, уничтожен. Хотя высшее руководство пережило катастрофу, боевой дух на фронте упал, а политики массово выезжают из страны."
 NTR_fianas_tribute:0 "Северная дань"
 NTR_fianas_tribute_desc:0 "Мы обязаны отправлять часть наших товаров северному повелителю."
 NTR_herz_aux:0 "Герцландские вспомогательные войска"
 NTR_herz_aux_desc:0 "Наши южные вассалы обязаны отправлять солдат для службы в армии Королевы."
 NTR_strict_hierarchy_2:0 "Жёсткая иерархия"
 NTR_strict_hierarchy_2_desc:0 "Наше общество разделено на три группы: пони, старые северные грифоны и прочие грифоны. В то время как пони доминируют, а те немногие грифоны, что жили с нами на Севере, считаются равными, все остальные в основном управляют собой, но не имеют почти никакого влияния на политику нашей страны."
 NTR_union_of_equals:0 "Союз равных"
 NTR_union_of_equals_desc:0 "И грифоны, и пони процветают в нашем новом государстве. Мы научились принимать наши различия, и теперь они не разделяют, а делают нас сильнее."
 NTR_smiths_buff_1:0 "Улучшение бронестойкости"
 NTR_smiths_buff_2:0 "Улучшение брони"
 NTR_smiths_buff_3:0 "Улучшение противовоздушной атаки"
 NTR_smiths_buff_4:0 "Дополнительное улучшение бронестойкости"
 NTR_steam_power:0 "Геотермальная энергия"
 NTR_steam_power_desc:0 "То, что некогда было приятными горячими источниками, теперь обеспечивает энергией нашу промышленность."
### Laws ###
GOY_magical_society:0 "Магическое общество"
 GOY_magical_society_desc:0 "Магия течет по нашим землям и влияет на каждый аспект жизни наших граждан. Мы живем в общении с нашими божествами, Шестью Духами Севера, и пользуемся их благословениями. Несмотря на то, что нам может не хватать промышленного развития, мы можем возводить наши здания из хрусталя с помощью магии, а наши ремесленники создают предметы непревзойденной красоты и удивительных качеств."
 GOY_slave_economy:0 "Рабовладельческая экономика"
 GOY_slave_economy_desc:0 "Экономика Тирании основана на причудливой смеси индустриального рабства и традиционализма. Большинство пони живут в племенных общинах, не одобряя передовые технологии и служа государству в качестве воинов или надсмотрщиков над рабами. Население грифонов порабощено и вынуждено производить оружие и другое военное снаряжение, используя промышленное оборудование, которое пони унаследовали от свергнутых правительств грифонов. Модернизации полученной промышленной базы уделяется мало внимания, и удовлетворяются только самые основные потребности рабов."
 GOY_druid_wisdom:0 "Мудрость Друидов"
 GOY_druid_wisdom_desc:0 "Образование и наука в нашей стране ограничены Друидами."

