 ## Manifests ##
 goy_first_and_final_empire_goal_name:0 "Первая и Последняя Империя"
 goy_first_and_final_empire_goal_desc:0 "Наше наследие – это наследие великого Арантигоса. Наше будущее – это славные завоевания и господство над Грифонией. Где флаг Арантиги был поднят однажды - там он не должен пасть никогда!"
 goy_griffonian_hegemony_goal_name:0 "Гармония по всей Грифонии"
 goy_griffonian_hegemony_goal_desc:0 "Грифоны не должны больше объединяться лишь благодаря мечу и грубой силе. Для Грифонии есть лучшее будущее: будущее, полное дружбы и гармонии, которое мы должны принести!"
 goy_protect_the_north_goal_name:0 "Защитники Севера"
 goy_protect_the_north_goal_desc:0 "Грифоний Север — наш дом по праву рождения, и мы будем защищать наш дом от любого, кто попытается отнять его у нас."
 goy_triumph_of_the_revolution_goal_name:0 "Триумф Революции"
 goy_triumph_of_the_revolution_goal_desc:0 "Чтобы революция преуспела, реакционеры по всей планете должны быть сокрушены – но пока что начнем с Грифонии."
 goy_eternal_vigil_goal_name:0 "Вечная Бдительность"
 goy_eternal_vigil_goal_desc:0 "Мы живем в эпоху войн и раздоров, и только сохраняя бдительность, мы можем обеспечить нам достойное будущее."
 goy_safe_future_name:0 "Защита нашего Дома"
 goy_safe_future_desc:0 "Помоварра никогда больше не будет потеряна. Мы будем бороться с любым, кто посмеет посягать на нашу свободу."
 goy_continent_domination_goal_name:0 "Доминация на Континенте"
 goy_continent_domination_goal_desc:0 "Пришло время Помоварре утвердиться в качестве величайшей (и единственной) силы в Грифонии. Мы победим, или умрём пытаясь!"
 goy_new_griffonia_goal_name:0 "Новая Грифония"
 goy_new_griffonia_goal_desc:0 "Аэтская мечта — это мечта, которую могут разделить все грифоны: мечта о единстве, мире и процветании, где все грифоны (и все остальные) равны и работают вместе, чтобы построить новый, лучший мир."
 
 ## Goals ##
 
 # Arantigan Hegemony
 faction_goal_goy_expand_legions_name:0 "Расширить легионы"
 faction_goal_goy_expand_legions_desc:0 "Чтобы захватить Грифонию, мы должны создать армию, превосходящую все, какие только видел наш континент."
 faction_goal_goy_titanomachy_name:0 "Гигантомахия"
 faction_goal_goy_titanomachy_desc:0 "Три гиганта – Вингбардия, Аквелия и Империя Грифонов – стоят между нами и властью над всей Грифонией. Конфликт неизбежен."
 faction_goal_goy_destroy_old_empire_name:0 "Уничтожить старую империю"
 faction_goal_goy_destroy_old_empire_desc:0 ""
 faction_goal_goy_reclaim_arantigan_homelands_name:0 "Вернуть Карфин"
 faction_goal_goy_reclaim_arantigan_homelands_desc:0 "Столица бывшей Карфинской Империи, Вечный город: Карфин – бриллиант Западной Грифонии, и его захват послужит мощным символом нашего возвращения."
 faction_goal_goy_crush_aquileia_name:0 "Сокрушить аквелийские амбиции"
 faction_goal_goy_crush_aquileia_desc:0 "Аквелийцы всегда пытались стать новым гегемоном Грифонии – и каждый раз терпели неудачу. На этот раз мы сокрушим их надежды и мечты."
 faction_goal_goy_tame_riverlands_name:0 "Укротить Речные земли"
 faction_goal_goy_tame_riverlands_desc:0 "Даже великий завоеватель Гровер II не смог покорить Речные земли. Так или иначе, если мы хотим обеспечить наше господство над континентом, пони Востока должны склониться перед нами."
 faction_goal_goy_colthago_delenda_est_name:0 "Colthago Delenda Est"
 faction_goal_goy_colthago_delenda_est_desc:0 "Само существование Кольтфагена унижает нас, напоминая о неудаче наших предков. Его завоевание позволит нам установить контроль над южными морями и смоет с нас позор поражения."
 faction_goal_goy_humiliate_equestria_name:0 "Унизить Эквестрию"
 faction_goal_goy_humiliate_equestria_desc:0 "Эквестрия – самая могущественная страна в мире, континентальный гегемон и маяк гармонии. Победив её, мы раз и навсегда докажем, что только мы заслуживаем звание сверхдержавы."

 # Griffonian Union
 faction_goal_goy_expand_union_name:0 "Расширить союз"
 faction_goal_goy_expand_union_desc:0 ""
 faction_goal_goy_burying_the_hatchet_name:0 "Закопать топор войны"
 faction_goal_goy_burying_the_hatchet_desc:0 "Слишком долго войны между великими державами Грифонии разрывали континент на части. Только работая вместе, мы сможем создать лучшее будущее — будущее, основанное на сотрудничестве, а не на господстве одного из претендентов на проклятый имперский трон."
 faction_goal_goy_save_pony_friends_name:0 "Спасти наших друзей-пони"
 faction_goal_goy_save_pony_friends_desc:0 "Эквестрия пала! Мерзким чейнджлингам удалось одолеть ее, несмотря на храброе сопротивление, и теперь пони страдают от тирании жуков. Наш моральный долг — помочь нашим друзьям за морем вернуть себе свободу."
 
 # Northern League/Boreal Alliance
 faction_goal_goy_southern_detente_name:0 "Разрядка с Югом"
 faction_goal_goy_southern_detente_desc:0 "На юге нависает постоянно растущая опасность возрождения Империи Грифонов. Мы не можем сражаться с ними напрямую – по крайней мере, пока. Поэтому, похоже, нам следует попытаться заключить какое-то соглашение с грифонами – хотя бы для того, чтобы отсрочить их вторжение."
 faction_goal_goy_northern_triangle_name:0 "Северный треугольник"
 faction_goal_goy_northern_triangle_desc:0 "Нации Севера должны объединиться, если хотят остаться свободными!"
 faction_goal_goy_red_sunset_name:0 "Заход красного солнца"
 faction_goal_goy_red_sunset_desc:0 "Коммунизм представляет угрозу нашей свободе и образу жизни! Мы должны искоренить эту скверну, прежде чем она успеет пустить корни на Севере."
 faction_goal_goy_north_endures_name:0 "Север выстоит!"
 faction_goal_goy_north_endures_desc:0 "Упорство одолеет любые трудности! Предстоящий путь долог и тернист, но мы должны двигаться вперед и обеспечить будущее для всего Севера."
 
 # Revolucia Avangardo
 faction_goal_goy_swords_of_the_revolution_name:0 "Мечи Революции"
 faction_goal_goy_swords_of_the_revolution_desc:0 "Политическая власть вырастает из дула ружья!"
 faction_goal_goy_expand_revolutionary_guard_name:0 "Расширение революционной гвардии"
 faction_goal_goy_expand_revolutionary_guard_desc:0 "Многие умрут за Революцию. И все же еще больше поднимется, чтобы бороться за ее неизбежную победу!"
 faction_goal_goy_triumph_over_imperialism_name:0 "Победа над империализмом"
 faction_goal_goy_triumph_over_imperialism_desc:0 ""
 faction_goal_goy_red_tide_rising_name:0 "Красный вал"
 faction_goal_goy_red_tide_rising_desc:0 "С каждым днем мы приближаемся к триумфу Революции. С каждым днем падают реакционные режимы Грифонии. И все же, еще многое предстоит сделать! Вперед, товарищи! К следующему завоеванию – и к следующей победе!"
 
 # Pact of Bronze/Pomovarran Pact
 faction_goal_goy_shield_of_bronze_name:0 "Бронзовый щит"
 faction_goal_goy_shield_of_bronze_desc:0 "Мы должны расширить наши вооруженные силы, если хотим защитить нашу свободу."
 faction_goal_goy_bronze_citadel_name:0 "Бронзовая цитадель"
 faction_goal_goy_bronze_citadel_desc:0 "Укреплений никогда не бывает слишком много! Мы должны построить еще больше!"
 faction_goal_goy_reforged_blade_name:0 "Перекованный клинок" 
 faction_goal_goy_reforged_blade_desc:0 "Оружие! Вот что нам нужно. Больше оружия — больше безопасности. Принесите мне больше оружия!"
 faction_goal_goy_griffonian_hegemon_name:0 "Гегемония в Грифонии"
 faction_goal_goy_griffonian_hegemon_desc:0 "Утверждение себя в качестве ведущей державы континента позволит нам защитить наши интересы и запугать наших врагов."
 faction_goal_goy_sea_boars_name:0 "Морские вепри"
 faction_goal_goy_sea_boars_desc:0 "Большой флот позволит нам защитить как наши берега, так и наши коммерческие и политические интересы за морями."
 
 # Pomovarran Dominion
 faction_goal_goy_slay_great_maar_name:0 "Сразить Великого Маара"
 faction_goal_goy_slay_great_maar_desc:0 "Аквелия должна пасть, чтобы Помоварра восстала!"
 faction_goal_goy_reclaim_our_past_name:0 "Вернуть наши следы"
 faction_goal_goy_reclaim_our_past_desc:0 "Многое было потеряно со временем... Но мы вернем все секреты Старой Помоварры и используем их, чтобы победить наших врагов."
 faction_goal_goy_gather_our_kin_name:0 "Собрать наш род"
 faction_goal_goy_gather_our_kin_desc:0 "Наш долг — освободить все старые территории Помоварры и живущих там грифонов."
 faction_goal_goy_dominion_over_griffonia_name:0 "Доминирование над Грифонией"
 faction_goal_goy_dominion_over_griffonia_desc:0 "Помоварра станет империей или перестанет существовать. Только могущественные империи могут решить судьбу Грифонии – и пусть мы станем самой могущественной!"
 
 # Aetian League
 faction_goal_goy_ploughs_into_swords_name:0 "Перековать мечи в плуги"
 faction_goal_goy_ploughs_into_swords_desc:0 "Пришло время принести нашему народу эпоху мира и процветания, превратив военные заводы в гражданские фабрики, которые будут производить товары, облегчающие жизнь грифонов."
 faction_goal_goy_city_of_desire_name:0 "Город грифонской мечты"
 faction_goal_goy_city_of_desire_desc:0 "Нам нужен мощный символ, чтобы показать всем грифонам, что наш путь — единственный правильный. Нам нужен город, который станет маяком надежды и процветания, витриной будущего, о котором мы мечтаем."
 faction_goal_goy_workshop_of_griffonia_name:0 "Фабрика Грифонии"
 faction_goal_goy_workshop_of_griffonia_desc:0 "Мы живем в эпоху индустриализации – а также, конечно, в эпоху Аэтской империи. Мы должны вписать концепцию высокоэффективной и современной промышленности в Аэтскую мечту."
 faction_goal_goy_light_in_the_west_name:0 "Огни Запада"
 faction_goal_goy_light_in_the_west_desc:0 ""
 
 # Griffonian Union + Aetian League
 faction_goal_goy_beacons_of_progress_name:0 "Маяки прогресса"
 faction_goal_goy_beacons_of_progress_desc:0 "Предстоит еще многое сделать, но хорошим началом было бы продолжить расширение наших промышленных регионов для обеспечения экономического роста и светлого будущего для следующего поколения грифонов.