### Bookmark ###
ARA_GATHERING_STORM_DESC1:0 "\n\n\n\n\n\n\n\n£GFX_texticon_CSSc_GOY_ARA_map\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nОт крепости Ромау до города Мидории, от бульваров Аквелии до рисовых полей Сидии простиралась империя Арантигоса. Его называли Арантигосом "Великим", потому что он не проиграл ни одного сражения. Увы, он пал слишком рано, и его империя рухнула вместе с ним. Теперь от его наследия осталось только баронство Арантига. В то время как Арантига находится в упадке, молодой, фанатичный генерал видит в себе единственную надежду для своего бедствующего народа. Он сделает всё возможное, чтобы восстановить славу Арантиги, чего бы это ни стоило."

### State Description ###
state_lore_text_container_state_name_short_408:0 "Спарлето"
state_lore_text_container_state_name_408:0 " §YГород§! §Древней Славы§!"
state_lore_text_container_state_description_408:0 "§YСпарлето§! и его города-сестры §YПонтелес§! и §YАлбувира§!, пропитаны грифонской историей. §YСпарлето§! – один из старейших городов Грифонии; он возник тысячи лет назад, до Грифенхейма, до Гровера, даже до Эквестрии и её принцесс. Единственная сохранившаяся запись о его основании — история легендарного короля §YСпарлоса§!, первого правителя §YАрантиги§!. Согласно легенде, §YСпарлос§! был изгнан из королевства своего отца за попытку §Rбратоубийства§! и решил основать своё собственное королевство. Говорят, что он встретил самого §GБорея§! на вершине священной горы §YСоларспайк§!, где тот велел §YСпарлосу§! метнуть свой меч как можно дальше, и там, где он приземлится, он должен был основать могучий город. §YСпарлос§! так и сделал, метнув свой меч на запад, к заходящему солнцу. §YСпарлос§! и его последователи провели недели в поисках меча, пока наконец не нашли его, лежащим на берегу озера Румейр, недалеко от живописной рыбацкой деревушки. Там они §Gосновали§! §YСпарлето§!, и после многих §Rтяжб§! и §Rвойн§! со смертными, монстрами и сверхъестественными существами, §YСпарлос§! создал своё новое §Gгосударство§!.\n\nСледующие сто поколений королей ничем не отличились, лишь понемногу расширяя влияние §YАрантиги§! и принося §Gпроцветание§! §YСпарлето§! после десятков §Rвойн§! и §Yдоговоров§!. А затем пришёл §YАрантигос§!. Его §Rзавоевания§! сделали §YСпарлето§! §Gстолицей§! огромной империи, простиравшейся от §YРомау§! до §YМидории§!. §YСпарлето§! быстро стал §Gмаяком процветания§! и §Gцентром науки и образования§!, но это положение было §Rкратковременным§!. Судьба была жестока, и §YАрантигос§! умер так же быстро, как его государство выросло. Его §Yгенералы§! разделили империю между собой, но они быстро погибли, став жертвами внутренних распрей и жалкого соперничества. После этого в §YСпарлето§! настали §Rтемные времена§! безвестности и нищеты.\n\n§YСпарлето§! сегодня, хотя и не современный город, намного богаче, чем был несколько лет назад. §YВингбардийские§! инвестиции омолодили его, и туризм приносит немалые деньги. Повсюду в городе туристы могут найти прекрасные образцы §Yклассической архитектуры§!, самым ярким примером которой является §YАкадемия Спарлето§!, гордо возвышающаяся над городом. Великолепные статуи и картины, украшающие эти строения, вдохновили целое художественное направление – §Yнеоклассицизм§!, и в ходе раскопок по всей §YАрантиге§! было обнаружено множество выдающихся археологических артефактов. Турист может провести целый день в одной из модных кофеен, которыми усеяно §YСпарлето§!, если только он будет достаточно осторожен, чтобы случайно не наткнуться на военный патруль...\n\nОднако в §YСпарлето§! не всё так гладко. §YАрантийцы§! быстро становятся §Rменьшинством§! в своём собственном городе из-за большого притока §Yвингбардийских§! иммигрантов в последние годы. Древний §YСпарлейский§! язык стремительно вымирает, и если не принять решительных мер, он, как и тысячелетние §Yарантийские традиции§!, может исчезнуть навсегда..."

### Ideas National Spirits ###
ARA_legacy:0 "Наследие Арантигоса"
ARA_legacy_desc:0 "Давным-давно, задолго до Империи, Эквестрии и даже до царственных сестёр, жил Арантигос Пернатый, который правил королевством, простиравшимся от Мидории на юге до Ромау на севере.\n\nТеперь наша страна представляет собой лишь жалкий осколок некогда могучего королевства, чей правитель вносил страх и уважение в сердца пони и грифонов. Но не всё потеряно. В сердце каждого арантийца живёт тот дух, что когда-то направлял величайшего завоевателя в истории Грифонии!\n\nИ пусть теперь мы всего лишь тень нашего прошлого, этот дух все еще дает силы нашим армиям, воодушевляя их подобно могущественному Арантигосу."
ARA_economic_dependance:0 "Экономическая зависимость"
ARA_economic_dependance_desc:0 "Благодаря нашим тесным экономическим связям с Вингбардией и другими странами Карфинского пакта арантийская экономика не получила большого урона от падения Империи.\n\nОднако совершенно очевидно, что Вингбардия оказывает слишком сильное влияние на нашу экономику"
ARA_GOY_cult_of_speed_idea:0 "Культ скорости"
ARA_cult_of_speed_idea_desc:0 "Быстрее! Сильнее! Лучше! Злее! Эти слова должны стать девизом наших войск."
ARA_massed_artillery:0 "Массированная артподдержка"
ARA_massed_artillery_desc:0 "Сосредоточив артиллерийский огонь на одной точке, мы сможем нанести гораздо больше урона. Наши враги будут дрожать от звуков арантийских боеприпасов!"
ARA_GOY_continous_planning_idea:0 ""
ARA_GOY_continous_planning_idea_desc:0 "Специальная группа офицеров проверяют, чтобы наши планы операций не содержали ошибок и создавались намного быстрее."
ARA_GOY_new_school_idea:0 "Спарлейская военная академия"
ARA_GOY_new_school_idea_desc:0 "Древняя военная академия была вновь открыта и укомплектована нашими лучшими стратегами, которые делятся своими знаниями с новым поколением офицеров. Каждый должен чувствовать присутствие духа Арантигоса!"
ARA_GOY_guerilla_warfare_idea:0 "Партизанская война"
ARA_GOY_guerilla_warfare_idea_desc:0 "Мы будем сопротивляться изо всех сил, ведь никакой арантиец не сдаётся без боя! Если враг вторгнется в нашу прекрасную отчизну, он будет окружен со всех сторон и никогда не сможет победить."
ARA_GOY_mandatory_training_idea:0 "Обязательная военная подготовка"
ARA_GOY_mandatory_training_idea_desc:0 "Почти каждый трудоспособный гражданин прошел базовую подготовку и знает, как пользоваться винтовкой. Арантига буквально вся стала армией."
ARA_legacy_2:0 "Наследие Арантигоса"
ARA_legacy_2_desc:0 "Давным-давно, задолго до Империи, Эквестрии и даже до царственных сестёр, жил Арантигос Пернатый, который правил королевством, простиравшимся от Мидории на юге до Ромау на севере.\n\nТеперь наша страна представляет собой лишь жалкий осколок некогда могучего королевства, чей правитель вносил страх и уважение в сердца пони и грифонов. Но не всё потеряно. В сердце каждого арантийца живёт тот дух, что когда-то направлял величайшего завоевателя в истории Грифонии!\n\nИ пусть теперь мы всего лишь тень нашего прошлого, этот дух все еще дает силы нашим армиям, воодушевляя их подобно могущественному Арантигосу.\n\n Благодаря реформам всё, что нам осталось сделать - призвать нового Арантигоса и вручить ему меч. Мы покажем всему миру, что значит быть арантийцем, и сделаем его чуточку лучше."
ARA_GOY_builder_divisions_idea:0 "Divisioni di Lavoro"
ARA_GOY_builder_divisions_idea_desc:0 "Специализированное подразделение в составе сил Арантиги обеспечивает быстрое строительство военных объектов в любых условиях."
ARA_unmatched_army_idea:0 "Бесподобная армия"
ARA_unmatched_army_idea_desc:0 "Наши храбрые войска полностью готовы защищать безопасность Арантиги и ее интересы за границей. Никто не сравнится с ней!"
ARA_transitional_economy:0 "Переходная экономика"
ARA_transitional_economy_desc:0 "Экономика Арантиги адаптируется к новому промышленному плану после разорения вингбардийских олигархов."
ARA_foreign_experts_idea:0 "Иностранные эксперты"
ARA_foreign_experts_idea_desc:0 "Умные грифоны и пони из-за рубежа восполняют недостаток нашей научной базы, давая советы и оказывая помощь в улучшении нашей промышленности."
ARA_equal_economy:0 "Процветающая экономика"
ARA_equal_economy_desc:0 "Экономика была успешно реформирована, и теперь арантийские бизнесгрифоны находятся на уровне с вингбардийскими. Эксплуатация осталась в прошлом."
ARA_sparletan_vinyards:0 "Арантийские виноградники"
ARA_sparletan_vinyards_desc:0 "Знаменитые вина Арантиги известны по всей Грифонии своим уникальным вкусом."
ARA_tourism_idea:0 "Развитие туризма"
ARA_tourism_idea_desc:0 "Несмотря на то, что Арантига - небольшая страна, у неё есть, что показать туристам: от многочисленных военных музеев, демонстрирующих её прекрасную историю, до обширных прибрежных владений, дающих каждому посетителю возможность насладиться отдыхом."
ARA_tax_incentives_idea:0 "Иностранные инвесторы"
ARA_tax_incentives_idea_desc:0 "Иностранные инвестиции заставляют нашу страну развиваться намного быстрее, хотя и не бесплатно."
ARA_welfare_state_idea:0 "Benessere"
ARA_welfare_state_idea_desc:0 "Хотя бедность и безработица в Арантиге встречаются нечасто, те немногие, кто действительно нуждаются в поддержке, защищены великолепной службой социального обеспечения."
ARA_a_rolemodel_idea:0 "Арантийская модель"
ARA_a_rolemodel_idea_desc:0 "Мир, стабильность и процветание - гарантировано государством и защищено нашими доблестными солдатами."
ARA_arantigan_diplomacy_idea:0 "Воссозданный дипломатический центр"
ARA_arantigan_diplomacy_idea_desc:0 "Арантийские дипломаты славятся своим красноречием."
ARA_new_police_force_idea:0 "Guardia Pubblica"
ARA_new_police_force_idea_desc:0 "Новые полицейские силы обеспечивают безопасность и стабильность Арантиги. Каждый полицейский был тщательно проверен на предмет связей с экстремистскими организациями."
ARA_sunny_spot_idea:0 "Солнечное место Грифонии"
ARA_sunny_spot_idea_desc:0 "Хотя другие насмехались над нашей провинциальностью, грифоны Арантиги действительно довольны своим местом в мире. Качество жизни выше, чем когда-либо, и все благодаря правительству."
ARA_foreign_intelligence_office_idea:0 "Servizio di Sicurezza Nazionale"
ARA_foreign_intelligence_office_idea_desc:0 "Секретная разведывательная служба гарантирует, что диссиденты и протестующие тихо исчезнут, прежде чем они смогут нанести ущерб нашему обществу."
ARA_foreign_intelligence_office_idea_lar:0 "Servizio di Sicurezza Nazionale"
ARA_foreign_intelligence_office_idea_lar_desc:0 "Секретная разведывательная служба гарантирует, что диссиденты и протестующие тихо исчезнут, прежде чем они смогут нанести ущерб нашему обществу."
ARA_into_the_world_idea:0 "В новый мир"
ARA_into_the_world_idea_desc:0 "Наш долг - поддерживать социалистические революции по всему миру! Рабочие должны стать свободными, а солдаты Арантиги будут теми, кто обеспечит будущее, свободное от эксплуатации!"
ARA_megas_arantigos:0 "Культ Арантигоса-Борея"
ARA_megas_arantigos_desc:0 "Арантигос прошлого был смертным воплощением Борея, это всем известно."
ARA_loyatly_to_the_baron_idea:0 "Преданность Доротеосу"
ARA_loyatly_to_the_baron_idea_desc:0 "Лояльность населения своему лидеру не подлежит сомнению. Их поддержка проявляется в песнях, превозносящих добродетели Доротеоса, в детях, названных в его честь, и в увеличении числа призывников."
ARA_autarky_idea:0 "Автаркия"
ARA_autarky_idea_desc:0 "Самодостаточность - величайшая добродетель. Арантига для арантийцев!"
ARA_napalm_idea:0 "Напалм"
ARA_napalm_idea_desc:0 "Вещество, осуждаемое более благородными грифонами, тем не менее эффективно сжигает города и наших врагов."
ARA_finest_aces_idea:0 "Лучшие асы"
ARA_finest_aces_idea_desc:0 "Арантийские грифоны естественным образом адаптируются к чему-либо, касающемуся военных действий, и это видно по тому, насколько быстро они адаптировались к самолётам. Наши пилоты уже превосходят противников."
ARA_we_shall_rule_idea:0 "Правь, Арантига!"
ARA_we_shall_rule_idea_desc:0 "Однажды Грифония уже принадлежала Арантигосу, и она снова станет нашей! Мы на пути к вечной славе!"
###### SUBMOD IDEAS ######
ARA_benevolence:0 "Снисходительность Баронессы"
ARA_benevolence_desc:0 "Вопреки тому, что в Арантиге фактически абсолютная монархия, правление баронессы известно за честность и уход за простыми грифонами."
ARA_transitional_economy2:0 "Экономика переходного периода"
ARA_transitional_economy2_desc:0 "Хотя мы освободились от оков вингбардийского господства в экономике, экономика Арантиги всё ещё восстанавливается после многих лет гнета Карфинских магнатов. Нам потребуеться приложить немалые усилия, чтобы восстановиться."
ARA_militarized_economy:0 "Военизированная экономика"
ARA_militarized_economy_desc:0 "Потребности гражданского населения игнорируются, поскольку экономика Арантиги переориентирована на обслуживание военных нужд."
ARA_tungsten_mind:0 "Разум закаляет страсть"
ARA_tungsten_mind_desc:0 "Явное предназначение Арантиги - править всей Грифонией. И даже несмотря на то, что пока это не так, мы должны воплатить это в жизнь!"
ARA_arantigos_boreas1:0 "Культ Арантигоса-Борея"
ARA_arantigos_boreas1_desc:0 "После своей смерти, Арантигос, стал частью самого Борея. Теперь мы поклоняемся ему и стремимся подражать его деяниям."
ARA_arantigos_boreas2:0 "Культ Второго Арантигоса"
ARA_arantigos_boreas2_desc:0 "После объявления себя реинкарнацией Арантигоса, Доротеос стал объектом восхваления своих наиболее рьяных сторонников. Будет полезно и дальше поощрять поклонения ему."
ARA_arantigos_boreas3:0 "Культ Второго Арантигоса"
ARA_arantigos_boreas3_desc:0 "Наш правитель - второе пришествие Великого и Могучего Арантигоса. Это настоящая аксиома, в которой даже сомневаться бесполезно."
ARA_arantigos_boreas4:0 "Культ Второго Арантигоса"
ARA_arantigos_boreas4_desc:0 "Наш правитель - второе пришествие Великого и Могучего Арантигоса. Это настоящая аксиома, в которой даже сомневаться бесполезно."
ARA_know_enemy:0 "Знай своего врага"
ARA_know_enemy_desc:0 "У государства много врагов – как внешних, так и внутренних. Мы должны знать о каждом их шаге."
ARA_national_effort:0 "Год труда на благо нации!"
ARA_national_effort_1:0 "Год труда на благо нации!"
ARA_national_effort_2:0 "Год труда на благо нации!"
ARA_national_effort_3:0 "Год труда на благо нации!"
ARA_national_effort_desc:0 "Наши граждане объединены общими усилиями ради общего блага. Каждая смена на фабрике — это битва в великой войне с врагами Арантиги. Работайте усерднее, арантийцы!\n§YИстекает [?ARA.var_goy_aranateffdate.GetDateStringNoHourLong]§!§W.§!"
ARA_national_effort_1_desc:0 "Наши граждане объединены общими усилиями ради общего блага. Каждая смена на фабрике — это битва в великой войне с врагами Арантиги. Работайте усерднее, арантийцы!\n§YИстекает [?ARA.var_goy_aranateffdate.GetDateStringNoHourLong]§!§W.§!"
ARA_national_effort_2_desc:0 "Наши граждане объединены общими усилиями ради общего блага. Каждая смена на фабрике — это битва в великой войне с врагами Арантиги. Работайте усерднее, арантийцы!\n§YИстекает [?ARA.var_goy_aranateffdate.GetDateStringNoHourLong]§!§W.§!"
ARA_national_effort_3_desc:0 "Наши граждане объединены общими усилиями ради общего блага. Каждая смена на фабрике — это битва в великой войне с врагами Арантиги. Работайте усерднее, арантийцы!\n§YИстекает [?ARA.var_goy_aranateffdate.GetDateStringNoHourLong]§!§W.§!"
ARA_industrial_fatigue:0 "Народная усталость"
ARA_industrial_fatigue_desc:0 "Наши граждане устали от работы и впали в уныние. Каждая смена на заводе — это долгий и болезненный труд. Лучше пока не перегружать их, со временем они оправятся."
ARA_work_camp:0 "Трудовые лагеря" 
ARA_work_camp_desc:0 "Нам нужно разобраться с огромным избытком диссидентов, мятежников и поверженных врагов. Вместо того, чтобы держать их в тюрьмах, мы можем использовать их в качестве дешёвой рабочей силы. После нескольких лет строительства дорог и вырубки лесов они будут гораздо менее склонны к восстанию против нас. По крайней мере, те, кто выживет."
ARA_well_regulated:0 "Отлаженная экономика"
ARA_well_regulated_desc:0 "Арантийская экономика достигла пика своей эффективности! Наши заводы производят излишки товаров, и мы можем полностью удовлетворить потребности как армии, так и нашего населения... в разумных масштабах."
ARA_mic:0 "Военно-промышленный комплекс"
ARA_mic_desc:0 "Мы с энтузиазмом пожимаем когти промышленникам!"
ARA_afterkeia:0 "Автаркия"
ARA_afterkeia_desc:0 "В Центральной Грифонии нет месторождений нефти, поэтому, если мы хотим обеспечить нашу армию топливом, нам придётся полагаться на синтетическую нефть. Важно инвестировать в развитие этой технологии в Арантиге."
ARA_absolute_reign:0 "Абсолютная власть"
ARA_absolute_reign_desc:0 "Доротеос в Арантиге - Царь и Бог. Его слово - закон, и его подданые верно исполняют его предписания, даже если они приведут к краху для страны и государства..."
ARA_every_griff:0 "Каждый грифон - солдат!"
ARA_every_griff_desc:0 "Если ты можешь держать винтовку, ты должен воевать за Арантигу!"
ARA_military_research:0 "Программа военных исследований"
ARA_military_research_desc:0 "Пехота с незапамятных времён была основой армии Арантиги. Нам нужно добиться того, чтобы её оружие и тактика превосходили наших врагов во всём."
ARA_military_research_2:0 "Программа военных исследований"
ARA_military_research_2_desc:0 "Пехота с незапамятных времён была основой армии Арантиги. Нам нужно добиться того, чтобы её оружие и тактика превосходили наших врагов во всём."
ARA_expanded_conscription:0 "Обязательная военная подготовка"
ARA_expanded_conscription_desc:0 "Делая военную подготовку обязательной для всех, кто может держать винтовку, мы значительно повысим качество подготовки призывников."
ARA_GOY_mobilized_economy:0 "Мобилизованная экономика"
ARA_GOY_mobilized_economy_desc:0 "Арантийская экономика достигла нового этапа в развитии – развитии военного производства. Бесчисленные винтовки и патроны выпускаются ежедневно на наших заводах, а затем отправляются прямиком в нашу армию, где очень хорошо служат нашим солдатам."
ARA_steel_legions:0 "Стальные легионы Арантиги"
ARA_steel_legions_desc:0 "Танки - будущее войны! Улучшив наши дизайны боевых машин, и тактики их применения, мы можем раскрыть их полный потенциал! Наша армия будет воистину непобедимой!"
ARA_modern_knights:0 "Доктрина современных рыцарей"
ARA_modern_knights_desc:0 "Улучшив во многом устаревшую доктрину рыцарских полков, мы уверены в том, что они останутся элитой нашей армии ещё на долгие годы."
ARA_arantigan_uprising:0 "Восстание арантийцев"
ARA_arantigan_uprising_desc:0 "На северо-востоке нашей страны проживает множество грифонов, что считают себя арантийцами и проживают на этих землях на протяжении веков. Обычно они тихие грифоны, которые держатся в стороне, но теперь, когда между нами и их родиной вспыхнула открытая враждебность, они взяли в когти оружие, и пошли против нас. Их одурманил безумец-еретик Доротеос, и пока мы не одержим триумф над ним, арантийцы будут продолжать свою партизанскую войну, подрывая эффективность нашей военной машины."
ARA_corrupt_government:0 "Коррумпированное правительство"
ARA_corrupt_government_desc:0 "Несмотря на то, что грифоны и так славятся своей жадностью и коррупцией, наши чиновники превосходят даже худшие стереотипы. Складывается впечатление, будто кто-то намеренно пытается подорвать наше правительство."
ARA_inefficient_intelligence:0 "Неэффективная разведка"
ARA_inefficient_intelligence_desc:0 "Несмотря на гордость за свой профессионализм и эффективность, наша разведка вообще не знает, во имя Борея, какого Маара происходит у нас в стране. И так же не знаем мы."
ARA_army_in_chaos:0 "Хаос в армии"
ARA_army_in_chaos_desc:0 "Со смертью Леонарда Родье и его сподвижников, наши вооружённые силы в полнейшем хаосе! Потребуется много времени, чтобы заполнить пробелы, которые образовались после их смерти..."
ARA_lavish_bribes:0 "Щедрые взятки"
ARA_lavish_bribes_desc:0 "Может показаться, что мы растратили огромные деньги, но это, вероятно, лучшая сделка, которую мы когда-либо заключали."
ARA_dogs_of_war:0 "Псы войны"
ARA_dogs_of_war_desc:0 "Алмазные псы Бронзхилла, ранее до гроба лояльные Гроверам, стали наиболее верными слугами Арантигоса в Герцланде. Они с превеликой радостью вступают в имперскую армию, дополняя её своими известными отрядами железнолапых."
ARA_dark_rumors:0 "Шёпот во тьме"
ARA_dark_rumors_desc:0 "Недавние события подорвали веру народа в правительство, и теперь по стране расползаются разного рода слухи о нашем правительстве..."
ARA_idol_of_boreas:0 "Идол Борея"
ARA_idol_of_boreas_desc:0 "Идол, кажется, спит, и от его легендарных сил не осталось и следа. Но, несмотря на это, грифоны со всех краёв мира, считают это возвращение, знаком Благословления Свыше, а сам артефакт легитимизирует власть Доротеоса. Многие теперь считают его избранником Борея, и намерены сражаться и умереть ради него."
ARA_project_legionary:0 "Проект "Легионер""
ARA_project_legionary_desc:0 "Наши исследования увенчались успехом и завершением Проекта "Легионер". Это привело к созданию первых в мире солдат с магическими усовершенствованиями. Несмотря на дороговизну, наши спецвойска были сразу же оснащены всем необходимым оборудованием, отчего их возможности во многом выросли. Естественно, Алленштайн продолжит работу над проектом, ища возможности сделать проект более дешевым, надежным и эффективным. Но пока, мы будем пользоваться тем, что имеем."
