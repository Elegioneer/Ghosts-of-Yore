### Leader Descriptions ###
#tungsten_desc:0 "Буквально просто кусок вольфрама. Он был представлен в 1005 году Доротеосом, чтобы посмеяться над Никатором, и, как таковой, имеет собственный стол, униформу, зарплату и право присутствовать на общих собраниях штаба."
soter_desc:0 "Сотер Литори, "Сова Арантиги", родился в 980 году в лесах к югу от Понтелеса. Он был одним из самых блестящих умов в генеральском штабе Арантиги, и, воспитанный в глуши, он научился с лёгкостью передвигаться по густым лесам Арантиги и обучает этому других. Это, в сочетании с его харизмой и глубокой преданностью Арантиге, сделало его (на момент повышения в звании в 26 лет) самым молодым генералом в армии Арантиги."
cassander_desc:0 ""Коммандо Кассандр", как его часто называют, — грифон, командующий Дивизионом Специальных Сил, который Доротеос называет "местом, куда поступают деньги и откуда выходят грифоны-невидимки"."
lysimachus_desc:0 "Лисимах — новейшее пополнение в Генеральском штабе Арантиги. Будучи фанатичным поклонником Доротеоса, он, вероятно, знает о фельдмаршале больше, чем когда-либо знала его собственная мать. Способный вдохновлять солдат почти с таким же рвением, как его собственное, он отвечает за набор нового поколения арантийцев в армию."
nicator_desc:0 "Никатор Вайтбик — второй по званию и по самолюбию воин в армии Арантиги после самого Доротеоса. Повышенный баронессой Маргарет, Никатор славится своей стратегией бомбардировки противника в  Тартар, и он в этом деле чертовски хорош."

ARA_sons_of_arantigos_subj:0 "Сыны Арантигоса"
ARA_sons_of_arantigos_key:0 "Ранее служившие под Кратерусом, эти рыцари снискали славу в далёкой Зебрике, отважно сражаясь против Короля Шторма взамен на деньги."