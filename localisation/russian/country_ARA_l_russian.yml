ARA_lysi_regency_desc:0 "Ещё столько предстоит сделать, чтобы защитить наследие Арантигоса!"
ARA_republican_land_reform_desc:0 "Передав землю тем, кто ее обрабатывает, и снабдив их новыми инструментами и приспособлениями, мы значительно улучшили производство продовольствия."
ARA_peace_prosperity_desc:0 "Всё хорошо в Центральной Грифонии."
ARA_republicanism_beacon_desc:0 "Неожиданный успех Центральной Грифонской Республики вдохновляет и вселяет надежду в сердца всех свободолюбивых существ Грифонии."
ARA_fanatical_army_desc:0 "Легионы Арантиги достигли совершенно нового, доселе невиданного уровня фанатизма – они готовы сражаться и умереть за своего вечного правителя, божественного Арантигоса."
ARA_knowledge_dangers_desc:0 "Мы стремимся к очищению народа от инакомыслия, вдохновленного жалкими иностранцами и их дегенератской писаниной."
ARA_crippling_spending_desc:0 "По сути, вся наша экономика сосредоточена на финансировании одного конкретного проекта."
ARA_great_temple_desc:0 "Взгляните на мои великие деянья, владыки всех времён, и отчайтесь!"
ARA_one_language_desc:0 "Мы стремимся к очищению народа от инакомыслия, вдохновленного жалкими иностранцами и их дегенератской писаниной."
ARA_arantigos_eternal_desc:0 "Арантигос живет – даже после смерти!"
ARA_closed_nation_desc:0 "Почти ничего не известно о том, что происходит в Арантиге – контакты с внешним миром ограничены, а вся деятельность избранных высокопоставленных иностранцев, которым разрешен въезд в Арантигу, тщательно контролируется."
ARA_invigilation_desc:0 "Современные технологии предоставляют множество средств для отслеживания ненадлежащих действий граждан..."
ARA_atomic_ascension_desc:0 "Ядерное оружие защитит нас от иностранных дегенератов! Ведь если они придут, то принесут смерть и разрушение самим себе."
ARA_great_purge_desc:0 "Все старые кадры прошли проверку на веру в Арантигоса. Многие не прошли..."
ARA_liberty_death_2_desc:0 "Мы были всего в шаге от погружения в пучину безумия и вечного рабства. Мы никогда не забудем и никогда не откажемся от своей свободы!"
ARA_militarized_economy_2_desc:0 "Потребности гражданского населения игнорируются, поскольку экономика Арантиги переориентирована на обслуживание военных нужд."
ARA_every_griff_2_desc:0 "Если ты способен держать винтовку, ты должен воевать за Арантигу!"
ARA_prison_economy_idea_desc:0 "Искупление не бесплатно."
ARA_faithful_fortress_desc:0 "Вера защищает разум, бункеры защищают землю!"
ARA_soteronomics_desc:0 "Экономическая политика нашей страны сочетает элементы социализма со свободным рынком - в то время как государство контролирует большую часть крупной промышленности (под надзором друзей и соратников нашего президента), мы по-прежнему допускаем существование частных мелких предприятий и земельных участков."
#
ARA_absolute_chaos_1:0 "Полный хаос!"
ARA_absolute_chaos_1_desc:0 "Кто бы мог подумать, что смерть абсолютного правителя и кучка амбициозных генералов, занимающих руководящие должности, могут стать причиной чего-то подобного?"
ARA_absolute_chaos_2:0 "Полный хаос!"
ARA_absolute_chaos_2_desc:0 "Кто бы мог подумать, что смерть абсолютного правителя и кучка амбициозных генералов, занимающих руководящие должности, могут стать причиной чего-то подобного?"
ARA_absolute_chaos_3:0 "Полный хаос!"
ARA_absolute_chaos_3_desc:0 "Кто бы мог подумать, что смерть абсолютного правителя и кучка амбициозных генералов, занимающих руководящие должности, могут стать причиной чего-то подобного?"
ARA_absolute_chaos_4:0 "Полный хаос!"
ARA_absolute_chaos_4_desc:0 "Кто бы мог подумать, что смерть абсолютного правителя и кучка амбициозных генералов, занимающих руководящие должности, могут стать причиной чего-то подобного?"
ARA_absolute_chaos_5:0 "Полный хаос!"
ARA_absolute_chaos_5_desc:0 "Кто бы мог подумать, что смерть абсолютного правителя и кучка амбициозных генералов, занимающих руководящие должности, могут стать причиной чего-то подобного?"
ARA_absolute_chaos_6:0 "Полный хаос!"
ARA_absolute_chaos_6_desc:0 "Кто бы мог подумать, что смерть абсолютного правителя и кучка амбициозных генералов, занимающих руководящие должности, могут стать причиной чего-то подобного?"
ARA_for_president:0 "За Президента и Республику!"
ARA_for_president_desc:0 "Наша государственная пропаганда работает день и ночь, чтобы укрепить образ Сотера как спасителя дела республиканцев и гарантировать, что граждане останутся верны только ему. В каком-то смысле президент Сотер — это и есть республика."
ARA_industria:0 "Работа во благо"
ARA_industria_desc:0 "Настоящего арантийца волнуют только две вещи: как лучше всего послужить государству и как лучше всего восхвалять Императора. Материальные выгоды, помимо тех, которые необходимы для достижения этих двух целей, не имеют смысла."
ARA_fallout_protests:0 "Последствия протестов"
ARA_fallout_protests_desc:0 "Мы все еще заняты борьбой с изолированными очагами сопротивления — пока мы с ними не покончим, мы не можем даже надеяться на усмирение юга страны."
ARA_sicameon_rebellion:0 "Восстание в Сикамеоне!"
ARA_sicameon_rebellion_desc:0 "Мы полностью утратили контроль над Сикамеоном, не считая крупных городов и дорог – но даже они не безопасны. Партизаны нападают на патрули, нарушают пути снабжения и даже совершают вылазки в соседние территории, подстрекая их жителей на восстание."
ARA_military_restrictions:0 "Военные ограничения"
ARA_military_restrictions_desc:0 "Единственное, что, похоже, заботит Арантигу в отношении нас, это то, чтобы у нас не было флота или армии, которые могли бы им угрожать — в остальном, им совсем нет до нас дела."
ARA_refugee_crisis:0 "Кризис беженцев"
ARA_refugee_crisis_desc:0 "С внезапным прибытием сотен тысяч беженцев вся наша инфраструктура оказалась полностью перегружена. Многие из приезжих настолько отчаялись от болезней и голода, что наши города обрастают трущобами, охваченными преступностью."
ARA_architecture:0 "Арантийская архитектура"
ARA_architecture_desc:0 "В Арантиге, как будто, строят только два типа зданий: колоссальные памятники, вселяющие благоговейный ужас в сердца населения, и строгие бетонные многоэтажки, в которых невыносимо жить, но, наверно, уютно умирать."

