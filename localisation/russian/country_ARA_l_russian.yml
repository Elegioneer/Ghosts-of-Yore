#
ARA_die_is_cast_desc:0 "Империя, Вингбардия и Аквелия – три великие державы Грифонии, борющиеся за контроль над континентом. Все они гораздо могущественнее Арантиги, и все заинтересованы в наших землях. Однако Арантигос Великий разбивал армии во много раз превосходящие его собственные, и мы способны на то же. Это будет нелёгкая задача, но чем сильнее наш враг, тем более славной будет наша победа."
ARA_end_old_empire_desc:0 "Более двух веков Гроверы правили Грифонией. Они сокрушили любое сопротивление и превзошли даже великого Арантигоса. Однако теперь их империя лежит в руинах, уничтоженная вингбардийцами и республиканцами. Ребёнок-император — всего лишь марионетка. Мы должны положить конец этому фарсу, прежде чем Империя рухнет, и на её руинах возникнет нечто новое."
ARA_fate_of_lord_protector_desc:0 "Фердинанд Донкло возглавил военный переворот, приведший к краху Империи Грифонов и концу Гроверов. Даже Арантигос должен признать, что он был талантливым парнем. Но могучий грифон пал и теперь гниёт в жалкой тюремной камере. И есть ещё одно, что он может сделать для нас..."
ARA_avenge_of_grover_desc:0 "Фердинанд оказал нам большую услугу, убив малолетнего императора – мы бы предпочли не пачкать свои когти кровью бедного птенца. Теперь, когда Арантигос провозгласил себя спасителем Грифенхейма, алмазные псы считают его героем. Хотя мы, вероятно, никогда не получим их слепой преданности, как Гроверы, псы, несомненно, послужат нам верой и правдой."
ARA_fate_of_child_emperor_desc:0 "Гровер VI – всего лишь бессильный ребёнок. Однако он – последний прямой потомок Гровера I и важный символ для тех, кто надеется восстановить Империю Грифонов. Казнь ребёнка, хоть и будет впечатляющей демонстрацией силы, несомненно, обострит наши отношения с герцландцами и вызовет серьёзную международную реакцию. Лучше избавиться от него менее очевидным образом."
ARA_force_dogs_to_dig_desc:0 "Алмазные псы Бронзхилла – интересные существа: они беззаветно преданы роду Гроверов. Из-за слухов об истинной судьбе Гровера VI мы не сможем когда-либо завоевать их преданность. Более того, они наверняка попытаются подорвать нашу поддержку среди других народов. Поэтому мы переселим всех нарушителей спокойствия в рабочие лагеря, где они будут делать то, что у них получается лучше всего – копать."
ARA_triumph_in_griffenheim_desc:0 "Грифенхейм – центр императорской власти – наш. Теперь никто не сможет усомниться в праве Арантигоса править всеми грифонами. Он лично отправится в Грифенхейм, чтобы отпраздновать победу и принять решения по некоторым вопросам, имеющим решающее значение для управления Герцландом."
ARA_marriage_of_convience_desc:0 "Политические браки такие же древние, как и сама знать. Благодаря им многие королевства объединились, многие распри прекратились, и многие начались. После смерти короля Морисета корона Аквелии перешла к его дочери Вивьен. Возможно, вместо того, чтобы сражаться, Доротеосу стоит предложить королеве Аквелии брак и объединить два королевства."
ARA_royal_spouse_desc:0 "Королева Вивьен — очень амбициозная грифонша и, в отличие от отца, весьма компетентная правительница. Мы наверняка сможем достичь соглашения, которое позволит нам держать под контролем нашего западного союзника и удовлетворить амбиции Вивьен. Мы не торопимся, ведь что бы мы ни делали, в будущем наши земли будут объединены под властью одной династии."
ARA_eastern_wind_desc:0 "Аквелийская армия, хотя и не обладает боевым духом, представляет собой передовую и закалённую в боях силу. Было бы полезно провести совместные военные учения для обмена опытом. Высшее командование Аквелии также предложили отправить своих офицеров, чтобы помочь в развитии наших вооружённых сил – этих грифонов возглавит Габриэль Оствинд."
ARA_king_of_aquileia_desc:0 "Может быть только один правитель грифонов – Фезерин – не Дискрет. Хотя сейчас Арантигос — всего лишь король-консорт Аквелии, со временем его реальная власть станет равной власти настоящего короля. Мы скрытно заручимся поддержкой аквелийских политиков, а потом лишим Вивьен власти и передадим контроль над Аквелией Арантигосу."
ARA_integrate_aquileian_army_desc:0 "Управляя Аквелией, мы получаем контроль над их вооружёнными силами. Генеральные штабы наших армий будут объединены, и, хотя аквелийская армия сохрани некоторую автономию и по-прежнему будут считаться отдельным формированием, Арантигос станет её новым главнокомандующим."
ARA_conteprise_desc:0 "Торговля между Аквелией и Арантигой процветает. Несколько богатых бизнесгрифов и пони из Аквелии хотят расширить свою деятельность на земли Арантиги. Несмотря на негативный опыт с вингбардцами, сейчас мы гораздо сильнее, чем много лет назад, и можем эффективно контролировать этих чужеземцев. Так что давайте пожмём когти и займёмся выгодным бизнесом."
ARA_march_west_desc:0 "Аквелийцы — кучка шутов, считающих себя более утончёнными и культурными, чем остальные грифоны. Многие их презирают, но никто не может их победить. Они настолько могущественны, что даже Арантигос Великий не смог их одолеть — это удалось только Гроверам. Мы последуем их примеру и возьмём Аквилу в свои когти."
ARA_secure_frontier_desc:0 "В землях Грайфвальда находятся крупнейшие нефтяные месторождения Грифонии. Разработка этого региона позволит нам одновременно решить проблему нехватки топлива и подготовиться к будущему наступлению на север благодаря их близости к границе с Герцландом."
ARA_oil_fields_of_adelart_desc:0 "Грифоны любят золото, и чёрное золото тоже. Недавно приобретённые земли Аделарта позволяют нам легко разрабатывать грайфвальдские нефтяные месторождения."
ARA_secure_flank_desc:0 "Город-государство Фловена и Княжество Помоварра находятся прямо у наших границ. До сих пор нападать на них было бы глупо, поскольку это наверняка вызвало бы вторжение аквелийцев. Однако теперь, когда война неизбежна, нам необходимо защитить эти земли."
ARA_flowenian_deal_desc:0 "Фловена наша! Хранилища её банков разграблены, а наша армия прошла победным маршам по её улицам. Большинство жителей уже смирились со своей участью, и вряд ли они создадут серьёзные проблемы в будущем. Любопытно, что несколько дней назад к нам обратился бывший генерал ополчения Фловены с интересным предложением..."
ARA_woe_to_the_vanquished_desc:0 "Несмотря на упорное сопротивление аквелийцев, мы наконец победили их, разрушив их мечту стать западным гегемоном. Теперь нам предстоит разобраться с многочисленными революционерами, которые попытаются подорвать Арантигу, как они это сделали с Аквелией."
ARA_karthin_will_fall_desc:0 "Давным-давно земли Вингбардии входили в состав империи великого Арантигоса. Было стыдно, что последние десятилетия Арантига была почти что марионеткой своих бывших подданных. Настало время мести – мы выступим на Карфин и свергнем этих мнимых владык юга."
ARA_francistrian_compatriots_desc:0 "Герцогство Талуза — ещё одна страна с гордой арантийской историей. Теперь, с победой на выборах ЛНВ, они возрождают древние талонские традиции. Нам следует связаться с их лидером, Амилькаре Фетиволой, и предложить ему возможность присоединиться к нашему справедливому делу."
ARA_greater_arantiga_desc:0 "Теперь, после победы над вингбардцами, у Талузы больше нет причин сохранять автономию. Местные жители уже горячо поддерживают нашего великого короля и не будут противиться полной интеграции в нашу растущую империю."
ARA_bitter_enemies_desc:0 "Фалькор недавно проиграл войну с Вингбардией, потеряв в результате столицу. У них и без того много причин ненавидеть западных соседей, и их жажда мести не утолена. Может быть, нам стоит обратиться к ним и предложить союз?"
ARA_reward_allies_desc:0 "Теперь, когда Вингбардия пала, пришло время разобраться с Фалькором. Они сражались вместе с нами... но нужны ли они нам ещё? Их земли тоже были частью старого королевства Арантиги, и они позволили бы нам продвигаться дальше на юг..."
ARA_old_foes_desc:0 "Взяв Карфин, мы положили конец вековому унижению. Пришло время отпраздновать нашу великую победу и решить судьбу наших поверженных врагов."
ARA_declare_arantigan_empire_desc:0 "Величайшие силы Грифонии повержены. Никто больше не может оспорить господство Арантиги. Десятки миллионов грифонов преклоняются перед Арантигосом. Пришло время закрепить наши права и организовать церемонию императорской коронации в Грифенхейме."
########################################

###Governing Empire Focuses ###
ARA_governing_empire:0 "Управление Империей"
ARA_governing_empire_desc:0 "Как сказал однажды мудрый грифон: "Из штыков можно сделать трон, но долго на нём не усидишь". Если мы не хотим разделить судьбу печально известного Короля Шторма, необходимо создать систему управления завоёванными землями, а не действовать подобно варварам-разорителям..."
ARA_our_subjects:0 "Наши подданные"
ARA_our_subjects_desc:0 "Теперь мы правим миллионами грифонов разных религий, традиций и языков. Арантийцы — меньшинство в новой империи, и сохранение нашей культурной гегемонии в долгосрочной перспективе маловероятно. Хотя мы никогда больше не отступим от своих путей, нам следует подумать о некоторых уступках новым подданным Арантигоса, чтобы завоевать их доверие."
ARA_expand_cult:0 "Расширение культа Второго Арантигоса"
ARA_expand_cult_desc:0 "Арантийцы – верные последователи недавно воссозданного культа Арантигоса-Борея, однако большинство наших новых подданных по-прежнему придерживаются веры Трёх Храмов. Хотя подрыв культов Арктурия и Эйра был бы глупым и опасным, нам следует расширить поклонение Арантигосу-Борею, чтобы способствовать религиозному единству в нашей империи."
ARA_question_of_capital:0 "Столичный вопрос"
ARA_question_of_capital_desc:0 "Хотя Спарлето уже сотни лет является резиденцией Фезеринов, это относительно небольшой город, недостойный правителя Грифонии из-за своей неспособности вместить постоянно растущую имперскую бюрократию. Поэтому возникает вопрос: куда можно перенести нашу столицу?"
ARA_establish_imperial_army:0 "Расширение Имперской армии"
ARA_establish_imperial_army_desc:0 "До сих пор наша армия состояла в основном из арантийцев и вспомогательных отрядов центральных грифонов. Раньше этого было достаточно, но наша неудержимая военная машина достигает предела своих возможностей. Нам просто не хватает грифонов для охраны земель, не говоря уже о новых завоеваниях! Если мы хотим защитить Арантигу, наша армия нуждается в расширении."
ARA_education_reform:0 "Образовательная реформа"
ARA_education_reform_desc:0 "По мере расширения наших владений мы взяли под свой контроль различные университеты, НИИ и школы. До сих пор они нас мало заботили. Однако образование играет ключевую роль как в развитии разума существ, так и в процветании государства. Нам стоит ввести новые стандарты образования, которые будут способствовать единству и позволят нам полноценно войти в современную эпоху."
ARA_reform_the_archonates:0 "Преобразование архонств"
ARA_reform_the_archonates_desc:0 "Архонты веками возглавляли многочисленных последователей Трёх Храмов. Обладая огромной властью, они представляют опасную оппозицию культу Арантигоса-Борея. Нам необходимо реформировать архонства, чтобы они лучше служили делу Арантигоса. Верный прелат Ираклий уже назначен новым архонтом Арантигоса-Борея и возглавит реорганизацию Трёх Храмов."
ARA_imperial_bureaucracy:0 "Имперская бюрократия"
ARA_imperial_bureaucracy_desc:0 "Во время наших завоеваний мы управляли новыми землями с помощью военных губернаторов и местных коллаборационистов. Однако это было временным решением. Эта система крайне неэффективна и уже создаёт нам серьёзные проблемы в виде коррупции и беспорядков. Нам необходимо воссоздать местные администрации, центральное правительство и установить всеобщую правовую систему."
ARA_establish_imperial_navy:0 "Основание Имперского флота"
ARA_establish_imperial_navy_desc:0 "Пока что наш флот состоял из патрульных катеров на озере Румейр. Нам не хватает знаний о создании полноценного океанского флота, к тому же у нас нет опытных кадров. Нам придётся самим создать полноценный флот и организовать адмиралтейство."
ARA_stable_reign:0 "Спокойное царствование"
ARA_stable_reign_desc:0 "Решив большинство острых проблем, наша империя больше не находится на грани краха, и в неё вернулось подобие нормальной жизни – наконец-то она похожа на настоящее государство, а не на военный лагерь. Теперь мы можем сосредоточиться на более важных делах."
ARA_integrate_herzland:0 "Интеграция Герцланда"
ARA_integrate_herzland_desc:0 "Жители Герцланда привыкли к императорскому правлению – многим из них даже безразлична смена правителя – Фезерин или Гровер – неважно. Нам следует завершить процесс создания местной администрации на этих землях."
ARA_integrate_wingbardy:0 "Интеграция Вингбардии"
ARA_integrate_wingbardy_desc:0 "Хотя Вингбардия была главной причиной несчастий нашей нации, сами вингбардцы очень похожи на арантийцев. Поэтому они быстро приняли наше правление. Вингбардцы считают Арантигоса за своего, и нам следует воспользоваться этим."
ARA_integrate_aquileia:0 "Интеграция Аквелии"
ARA_integrate_aquileia_desc:0 "Аквелия всегда была занозой для Империи, а аквелийцы – занозой для любого, кто пытался ими править, даже для других аквелийцев. Но после того, как мы быстро их разгромили, они устали бунтовать – по крайней мере, пока."
ARA_what_remains:0 "То, что осталось"
ARA_what_remains_desc:0 "Хотя мы контролируем самые процветающие земли Грифонии, есть ещё много мелких государств, которые мы ещё не завоевали. Их правители наверняка строят заговоры против Арантиги, опасаясь нашей новой власти. Мы должны нанести удар, прежде чем они объединят свои усилия против нас!"
ARA_jewel_of_the_west:0 "Жемчужина Запада"
ARA_jewel_of_the_west_desc:0 "Скайфол — самый богатый город Грифонии и ключ к западной торговле. Пока что он сохранял нейтралитет и процветал, несмотря на бушующие вокруг конфликты. Его правители, возможно, надеялись, что мы оставим их в покое, но мы не можем позволить этому анклаву существовать дальше. Мы потребуем немедленной сдачи Скайфола. Если они не подчинятся, их ждёт гнев Арантигоса!"
ARA_just_good_business:0 "Хороший бизнес"
ARA_just_good_business_desc:0 "Скайфол — самый оживлённый порт Грифонии и её самый богатый город. Владение им позволяет нам пожинать плоды мировой торговли. Некоторые из самых богатых жителей города умоляли императора о встрече, вероятно, желая заключить сделку, чтобы сохранить свои богатства и остатки былого влияния. Милосердный император выслушает их мольбы и решит, что с ними делать."
ARA_conquest_of_the_islands:0 "Рай для подонков"
ARA_conquest_of_the_islands_desc:0 "Хаукленд десятилетиями служил базой печально известного "безумного" графа Мейера и его пиратской шайки. Они долгое время грабили побережья Грифонии и Эквуса. Теперь, когда у нас есть мощный флот, мы наконец-то можем от них избавиться. Завоевав Хаукланд, мы одновременно обезопасим наши торговые пути и получим прочную опору вблизи Эквуса."
ARA_integrate_the_west:0 "Интеграция Запада"
ARA_integrate_the_west_desc:0 "Взяв под контроль торговые города и острова, мы наконец обезопасили нашу торговлю и ликвидировали последний независимый западный анклав."
ARA_break_hellsword:0 "Сломить рыцарские мечи"
ARA_break_hellsword_desc:0 "Хеллквиллл и Лонгсворд — два государства рыцарских орденов, основанных Гровером II во время его крестового похода против речных пони. Недавно охваченные разрушительными гражданскими войнами и осквернённые влиянием реформистов, эти страны больше не могут защищать грифонов от пони. Мы победим рыцарей и создадим надёжную оборону восточных границ."
ARA_cross_creeper_mountains:0 "Перейти Ползучие Горы"
ARA_cross_creeper_mountains_desc:0 "Если мы хотим покорить Восток, нам нужно пройти через Ползучие горы – земли, населённые разбойниками и известные своей труднопроходимостью. К северу от них находится небольшое княжество Люши – разве не проще было бы атаковать с севера?"
ARA_into_evi_valley:0 "Прямиком в Долину Эви"
ARA_into_evi_valley_desc:0 "Обеспечив безопасность дорог на восток, мы наконец-то можем войти в земли, известные как житница Грифонии – Прайвен. К востоку от неё лежат Грифус и казачьи степи. Восточные страны должны стать лёгкой добычей – мы побеждали врагов гораздо более могущественных, так что разрозненная толпа грифонов нам точно по зубам."
ARA_knights_of_the_east:0 "Рыцари Востока"
ARA_knights_of_the_east_desc:0 "На Востоке если и есть что в избытке, так это рыцари. Хеллквиллльцы, Орден Опинника, Люши – мы всех их победили. Некоторые, однако, не сражались против нас и, даже потерпев поражение, не держат на нас зла. Может быть, мы вернём им древнюю роль защитников востока – теперь защитников Арантиги... Или избавиться от них и принести новую эпоху в это захолустье."
ARA_fate_of_trade_company:0 "Судьба торговой компании"
ARA_fate_of_trade_company_desc:0 "Бывшие земли Грифуса были домом для Грифоньей Компании Южного Континента, монополиста в торговле на юге. Учитывая масштабы Арантийской империи, они — всего лишь помеха, но наше решение об их судьбе окажет большое влияние на земли Востока..."
ARA_integrate_the_east:0 "Интеграция Востока"
ARA_integrate_the_east_desc:0 "С установлением прочного контроля над Востоком, эпоха хаоса, длившаяся там поколениями, наконец завершилась. Со временем все эти земли станут лояльными провинциями Арантиги..."
ARA_from_romau_to_midoria:0 "От Ромау до Мидории!"
ARA_from_romau_to_midoria_desc:0 "Империя Арантигоса Великого простиралась от Ромау на севере до Мидории на юге. Поскольку у нас были более серьёзные проблемы, мы позволили минотаврам, цианолизийцам и сикамеонцам вести свои мелкие войны, основанные на вековых распрях. Однако теперь пришло время раз и навсегда положить конец их независимости."
ARA_minotaurs_question:0 "Вопрос минотавров"
ARA_minotaurs_question_desc:0 "Минотавры Астериона — интересные существа: упрямые и непреклонные, они яростно стремятся к независимости. Веками они боролись с угнетателями. Несомненно, они будут сопротивляться и нам. Арантигос восхищается их боевым духом, но их формальная капитуляция обязывает их быть ему верными. Может быть, нам стоит попробовать мягкий подход?"
ARA_integrate_the_south:0 "Интеграция Юга"
ARA_integrate_the_south_desc:0 "Сикамеон и Цианолизия пали, и даже могучие минотавры потерпели поражение. Надежды на независимость на Юге сокрушены арантийскими легионами."
ARA_destroy_failed_republic:0 "Разбить республиканцев"
ARA_destroy_failed_republic_desc:0 "После своей жалкой революции Кемерскай и его соратники бежали на север, в Клаудбьюри, где основали свою "Республику Грифонов", которая выглядит как насмешка над их грандиозными мечтами. С тех пор они гниют там, ожидая дня, когда смогут вернуться. Теперь, когда возникла новая империя, настало время совершить coup de grâce, как это называют аквелийцы."
ARA_final_accord:0 "Последний аккорд"
ARA_final_accord_desc:0 "Теперь, когда Клаудбьюри в наших когтях, осталось только провести генеральную уборку на очернённом севере."
ARA_republican_dream:0 "Республиканская мечта"
ARA_republican_dream_desc:0 "Кемерскай и его сообщники потерпели поражение, и Республика Грифонов пала. Пока мы готовимся казнить "президента-маршала" и остальных членов его банды, наши специалисты по допросам получают информацию, которая должна позволить нам обнаружить скрытые группы республиканских сторонников, ранее финансировавшихся режимом Кемерская..."
ARA_slay_red_beast:0 "Добить красного зверя"
ARA_slay_red_beast_desc:0 "Когда Фловену поразила Мокрая чума, её слабоумный мэр принял единственно верное решение... Он очистил город огнём, уничтожив его и чуму вместе. Коммунизм — это такая же болезнь, как и чума, но она поражает умы. Мы воспользуемся фловенским средством — выжжем его."
ARA_northern_ponies:0 "Интеграция северных пони"
ARA_northern_ponies_desc:0 "На севере Грифонии живут племена пони. Обычно их никто не замечает, но недавно они оказались втянуты в борьбу со скайнавцами и бандитами клана Санстрайкер. Теперь, когда мы контролируем их территорию, нам решать, что с ними делать."
ARA_integrate_the_north:0 "Интеграция Севера"
ARA_integrate_the_north_desc:0 "Север наш. После уничтожения последнего оплота республиканцев и поражения жалких северных народов наши армии могут вернуться на более плодородные земли. Губернаторы наверняка расправятся с остатками наших врагов."
ARA_emperor_of_griffonkind:0 "Император Грифоньего рода"
ARA_emperor_of_griffonkind_desc:0 ""И Арантигос заплакал, ибо в мире было так много всего, что нужно было покорить..." Великий предок Доротеоса умер, не достигнув своей цели, но Арантигос Второй достиг большего, чем первый, и даже чем Гровер. Он — единственный истинный повелитель грифонов. Но утолена ли его жажда завоеваний?"
ARA_unexpected_opportunity:0 "Рассвет над Новым Мейрлендом"
ARA_unexpected_opportunity_desc:0 "Земли, известные сегодня как Новый Мейрленд, когда-то принадлежали королевству Талуза, но были проданы его жадным и глупым королём эквестрийцам. Мы должны вернуть их, чтобы полностью объединить земли Старой Империи и гарантировать, что пони не будут вмешиваться в наши дела."
ARA_claim_canteribbeans:0 "Пираты Кантерибского Моря"
ARA_claim_canteribbeans_desc:0 "Кантерибские острова расположены на важнейшем морском пути между Эквусом и Зебрикой. Имперское Адмиралтейство представило планы операций по завоеванию этого района для обеспечения контроля над южными морями."
ARA_develop_island_bases:0 "Расширение островных портов"
ARA_develop_island_bases_desc:0 "После завершения кантерибской кампании мы можем направить ресурсы на полное использование потенциала наших новых территорий."
ARA_abyssinian_allegiance:0 "Абиссинская верность"
ARA_abyssinian_allegiance_desc:0 "Мы, грифоны, наполовину кошки, наполовину птицы, и наши кошачьи собратья из Абиссинии — идеальные кандидаты на то, чтобы присоединиться к Арантийской Гегемонии в качестве наших союзников в далёкой Зебрике. Возможно, чтобы сделать кошек более восприимчивыми, мы позволим им занять некоторые бывшие колонии вингбардцев в этом регионе..."
ARA_new_new_mareland:0 "Новый Новый Мейрленд"
ARA_new_new_mareland_desc:0 "Новая группа подданных... Чудесно. Если бы только это были не эквестрийские пони... Надеюсь, они будут держать свои песни подальше от официальных аудиенций, если только Арантигос специально не попросит об этом, и не попытаются атаковать нашего Божественного Императора магическими радужными лучами... Кхм, да, нам нужно решить, как с ними справиться."
ARA_western_allies:0 "Западные союзники"
ARA_western_allies_desc:0 "Арантигос не заинтересован в Эквусе, но Нова Грифония по праву принадлежала Гроверам. Мы не Гроверы. Тем не менее, западных птиц нужно оберегать от возможной агрессии пони, поэтому им предложат мирно присоединиться к нашей империи в качестве автономного региона, получив защиту нашей армии. Было бы глупо отказываться от такого предложения!"
ARA_rightful_ruler:0 "Истинный правитель"
ARA_rightful_ruler_desc:0 "Нова Грифония была колонией Империи Грифонов. Веками все, кто не мог найти себе места в Грифонии, отправлялись на запад. Наша разведка убеждена, что многие выжившие революционеры бежали в Нова Грифонию, где строят заговор против Арантигоса. Мы не можем позволить им уйти от ответственности!"
ARA_support_western_trade:0 "Поддержать западную торговлю"
ARA_support_western_trade_desc:0 "Нова Грифония — это ворота в Эквус, по крайней мере, для нас. Наши промышленники уже основали несколько прибыльных предприятий на западном континенте. Её неразвитая северная часть теперь становится территорией возможностей."
ARA_western_mess:0 "Западный беспорядок"
ARA_western_mess_desc:0 "Всё гораздо хуже, чем мы думали. Может, нам просто отступить и оставить их в покое? Нет, это означало бы признать поражение. Мы покорим эти земли или умрём, пытаясь!"
ARA_frosthill_nuclear:0 "Атомный центр Фростхилла"
ARA_frosthill_nuclear_desc:0 "Огромное расстояние от более цивилизованных регионов, мало грифонов, залежи кристаллов поблизости и горы, кишащие опасными магическими монстрами и каннибалами под боком... Да — планы строительства ядерного полигона в Фростхилле получили одобрение Его Величества!"
ARA_final_reforms:0 "Последние реформы"
ARA_final_reforms_desc:0 "Пыль улеглась, пора опустить меч. Империя Арантигоса огромна и внутренне раздроблена. Если он хочет, чтобы она не рухнула вскоре после его смерти, он должен восстановить её фундамент."
ARA_arantigan_parliament:0 "Арантийский Парламент"
ARA_arantigan_parliament_desc:0 "Мы разгромили республиканцев, но, несомненно, они вернутся. Возможно, лучшим вариантом, чем полицейское государство, было бы создание парламента, где грифоны со всех уголков нашей империи собирались бы, чтобы спорить и бесцельно тратить время на пустяки. Возможно, проще держать оппозицию в мраморных залах, чем в тюрьмах..."
ARA_question_of_religion:0 "Вопрос верований"
ARA_question_of_religion_desc:0 "Хотя Троица — господствующая вера грифонов, существует множество более мелких культов и сект: староверы, последователи Эвилианы, поклонники эквестрийских принцесс... Дальнейшее распространение культа Арантигоса стало затруднительным и неэффективным. Пора решить эту проблему раз и навсегда."
ARA_griffonian_nobility:0 "Грифоньи дворяне"
ARA_griffonian_nobility_desc:0 "Революции, кризисы и войны привели к радикальному сокращению численности и влияния грифоньей знати. Тем не менее, многие аристократы, благодаря раболепию, удаче и нашему недосмотру, сохранили свои богатства. Поскольку больше некому нам противостоять, не пора приблизить конец того, что кажется естественным ходом истории? Возможно, нам удастся заслужить и благодарность обывателей!"
ARA_integrate_infrastructure:0 "Интеграция инфраструктуры"
ARA_integrate_infrastructure_desc:0 "Прошло более тридцати лет с момента распада Империи Грифонов. За это время народы Грифонии по-разному развивали свои железные и автомобильные дороги. Некоторые из них настолько причудливы, что путешествие по Грифонии становится тем ещё приключением. Пришло время наладить нашу транспортную сеть и соединить основные артерии континента."
ARA_establish_himss:0 "Создание ССЕИВ"
ARA_establish_himss_desc:0 "Годами наша разведка была неэффективной. Разветвлённая сеть различных военных служб, полиции и тайных группировок каким-то образом обеспечивала нашу безопасность во время Войны за Объединение, но теперь эти агентства, похоже, просто враждуют друг с другом. Мы распустим большинство из них и создадим Секретную Службу Его Императорского Величества."
ARA_imperial_trade_policy:0 "Торговая политика Империи"
ARA_imperial_trade_policy_desc:0 "В Арантиге обитает более ста миллионов грифонов и других существ. Это, пожалуй, крупнейший объединённый рынок во всём мире. Мы – экономический гигант, поэтому иностранные торговцы стремятся вести с нами бизнес. Пришло время решить: останемся ли мы открыты для международной торговли или пойдём по пути протекционизма?"
ARA_merciful_sovereign:0 "Милостивый государь"
ARA_merciful_sovereign_desc:0 "Годами обитатели Грифонии страдали от голода, нищеты и войн. Теперь этому пришёл конец – император решил запустить амбициозную программу социальных реформ, которая сделает образование и здравоохранение бесплатными и улучшит условия труда. Наша пропаганда донесёт до грифонов, что их кошельки и животы полны только из-за милосердия их правителя."
ARA_fate_of_trators:0 "Судьба предателей"
ARA_fate_of_trators_desc:0 "Наши тюрьмы и трудовые лагеря заполнены... разномастной толпой. Остатки республиканцев и коммунистов, офицеры и солдаты павших армий, вероломными дворянами... и невинными грифонами, которые просто оказались не в том месте не в то время. Либеральные советники считают, что всеобщая амнистия будет полезна для "заживления ран нации"."
ARA_foreign_poison:0 "Иноземная отрава"
ARA_foreign_poison_desc:0 "Всем известно, что республиканство разрушает традиции грифонов, что коммунизм создали пони, как и идею "гармонии" – она хороша только для копытных слабаков. Мы должны защитить наших граждан от мерзкого, искажающего разум влияния пони..."
ARA_state_of_peace:0 "Долгожданный мир?"
ARA_state_of_peace_desc:0 "Годами нашей реальностью была война. Солдаты сражались и погибали на передовой, а в тылу рабочие тратили бесчисленные часы, изготавливая оружие и боеприпасы. Теперь, когда мы победили, разве наш народ не заслуживает мира?"
ARA_eternal_empire:0 "Вечная Империя"
ARA_eternal_empire_desc:0 "Это был долгий путь, полный крови и деяний, которые многие сочли бы жестокими. Но наконец-то Доротеос справился! Арантига возродилась могущественнее, чем когда-либо, надёжная и процветающая. Начинается новая эпоха, арантийская эпоха..."
ARA_north_zebrica:0 "Начать кампанию в Северной Зебрике"
ARA_north_zebrica_desc:0 "Первым шагом нашей кампании в Северной Зебрике станет завоевание островов Макавии. Они не только послужат идеальным плацдармом, но их жители долгое время вмешивались в дела грифонов, поддерживая Астерион и Сикамеон и предоставляя убежище беглым южным преступникам."
ARA_sun_and_lightning:0 "Солнце и молния"
ARA_sun_and_lightning_desc:0 "Из всех рас Зебрики, гиппогрифы наиболее близки нам как телом, так и духом. Они доказали это, отвергнув гармонию и объединившись под Крэком Лайтнингом. Мы протянем дружескую лапу правительству Ариса и примем их как союзников и равных. Конечно, им придётся продать свои территории в Кольтфагене, на который мы имеем полное право."
ARA_besting_the_storm:0 "Превзойти Короля Шторма"
ARA_besting_the_storm_desc:0 "Даже сам Король Шторм не смог захватить Гиппогрифию и погиб при попытке сделать это. Теперь Арантигос докажет свой титул величайшего завоевателя мира, покорив её."
ARA_delenda_est:0 "Кольтфаген должен быть разрушен"
ARA_delenda_est_desc:0 "Более тысячи лет назад город-государство Кольтфаген вёл многочисленные опустошительные войны с Карфинской империей, преемницей древней Арантиги. Теперь пришло время отомстить за Карфинию и покорить Кольтфаген раз и навсегда."
ARA_reorganise_zebrica:0 "Реорганизация завоеваний в Зебрике"
ARA_reorganise_zebrica_desc:0 "Зебрика — далёкая и экзотическая земля, полная странных существ, большинство из которых презирают нашу власть. Чтобы лучше управлять этими территориями, мы создадим группу протекторатов под руководством местных жителей."
ARA_detente_with_eastern_ponies:0 "Разрядка отношений с речными пони"
ARA_detente_with_eastern_ponies_desc:0 "Речные земли — дикие места, полные воинственных пони, которые больше чем друг друга, ненавидят только грифонов. Эта ненависть существует во многом благодаря заслугам одного грифона, Гровера Второго. Но теперь, когда Гроверов больше нет, может быть, грифоны и речные пони наконец-то смогут жить в мире?"
ARA_the_last_crusade:0 "Последний поход"
ARA_the_last_crusade_desc:0 "Гровера Второго прославляют как величайшего полководца в истории грифонов... Какая шутка – он погиб от рук восточного пехотинца! Арантигос уже превзошёл его, но он способен и на большее. Пока Речные земли под контролем пони, Грифония никогда не будет в безопасности. Чтобы обрести поистине бессмертную славу, Доротеос должен положить конец этой последней угрозе."
ARA_flourishing_trade:0 "Процветающая торговля"
ARA_flourishing_trade_desc:0 "С подписанием нового договора, сотрудничество между Арантигой и Речными землями может начаться. Первым результатом станет наше новое торговое соглашение, которое откроет новые рынки для грифоньих промышленников."
ARA_master_of_the_east:0 "Владыка Востока"
ARA_master_of_the_east_desc:0 "Речные пони повержены, их армии не смогли противостоять арантийским легионам, и теперь их земли под нашей оккупацией... Нас обременяют около сорока миллионов враждебных существ, которые недовольны новым правительством,. Надеюсь, мы найдём решение этой проблемы..."
ARA_secrets_of_barrad:0 "Секреты Баррада"
ARA_secrets_of_barrad_desc:0 "Группа безумных магов уже несколько десятков лет правит землями Баррада. С их низложением мы наконец-то можем попытаться раскрыть тайны, которые привлекли их в это проклятое место."
ARA_spoils_of_war:0 "Трофеи войны"
ARA_spoils_of_war_desc:0 "Теперь, когда наши злейшие враги повержены, мы можем начать пожинать плоды наших завоеваний. Наши новые земли открывают новые, интересные возможности, и мы должны ими воспользоваться. Первым делом нам предстоит оценить всё золото и имущество павших правительств — мы даже не знаем, сколько всего у нас есть!"
ARA_wingbardian_rubber:0 "Вингбардийский каучук"
ARA_wingbardian_rubber_desc:0 "Благодаря благоприятному климату, Вингбардия была важным производителем каучука в Грифонии. Теперь, контролируя их земли, мы можем расширить плантации, чтобы увеличить прибыль и полностью снабдить армию."
ARA_expand_penal_battalions:0 "Расширить штрафные батальоны"
ARA_expand_penal_battalions_desc:0 "Во время наших завоеваний мы захватили множество вражеских солдат – большинство из них сейчас заключены в трудовых лагерях. Некоторые из них готовы сотрудничать в надежде вернуть свободу. Сбор подразделений из таких грифонов, возможно, позволит нам сохранить жизни арантигцев, если вместо них мы направим штрафбаты на самые опасные участки фронта."
ARA_rebuilding_navy:0 "Собрать флот из остатков"
ARA_rebuilding_navy_desc:0 "Многие корабли наших врагов сильно пострадали за прошедшие войны, что сильно ограничило возможности по их захвату. Но разборка трофейных военно-морских баз и верфей позволит нам добыть инструменты для починки и запчасти недостроенных кораблей. Также будет полезно изучить вражеские чертежи для основания нашего флота."
ARA_land_reclamation_crops:0 "Лесоповальные корпуса"
ARA_land_reclamation_crops_desc:0 "Шайсвальд — один из самых негостеприимных районов Грифонии. Его населяют крайне опасные звери, бандиты и партизаны, сотни лет он был чёрным пятном Герцланда. Используя приток техники и бесплатной рабочей силы, мы можем начать расчистку Шайсвальда и освоение его ресурсов. Освобождённые земли будут превращены в фермы и переданы новым поселенцам."
ARA_eyrs_gift_project:0 "Проект "Дар Эйр""
ARA_eyrs_gift_project_desc:0 "Долина реки Эви, известная как житница Грифонии, благодаря самым плодородным землям на континенте. Однако у реки Гриффкинг ещё больший потенциал. Теперь мы можем начать один из самых амбициозных инженерных проектов в истории Грифонии. Будет построено множество плотин и каналов для орошения и гидроэлектроэнергии."
ARA_rebuild_griffenheim:0 "Возрождение Грифенхейма"
ARA_rebuild_griffenheim_desc:0 "Наши солдаты слишком пылко сражались на улицах Грифенхейма. Многие жалуются, что мы всего лишь шайка варваров. Чтобы заставить их замолчать и заручиться поддержкой жителей Герцланда, мы проведём масштабный проект по восстановлению города и окрестных провинций. В мгновение ока они не только вернут себе былую славу, но и станут настоящей жемчужиной Севера."
ARA_convince_scholars:0 "Убедить учёных"
ARA_convince_scholars_desc:0 "Самые известные исследовательские институты Грифонии расположены в Йеле. Несмотря на то, что многие учёные и преподаватели покинули страну, а важнейшие научные статьи были уничтожены до того, как мы смогли их получить, университеты продолжают свою работу. Нам следует предложить им помощь в восстановлении утраченного."
ARA_emperors_only_achievement:0 "Единственная победа Императора"
ARA_emperors_only_achievement_desc:0 "Гровер V был слабым правителем. Во время его правления Империя Грифонов развалилась, а разрозненные части начали гнить изнутри. Единственным его достижением, достойным упоминания, было создание железнодорожной сети Герцланда. Возможно, стоит расширить её, чтобы развить наши северные провинции."
ARA_imperial_research_initiative:0 "Имперская Исследовательская Инициатива"
ARA_imperial_research_initiative_desc:0 "Глупо недооценивать достижения науки. Она позволяет нам не только создавать более совершенное оружие, но и открывает доступ к технологиям, способным изменить мир – или уничтожить его. Недавно к нам обратились несколько учёных, пообещавших предоставить передовые технологии в обмен на значительное финансирование. Стоит ли нам согласиться?"
ARA_ponies_of_aquileia:0 "Пони Аквелии"
ARA_ponies_of_aquileia_desc:0 "В Аквелии обитает множество пони. К счастью, они не говорят о "магии дружбы", напротив – они очень похожи на грифонов. Нашей армии пригодилась бы их магия – и способные солдаты."
#
ARA_austerity_humility:0 "Строгость и смирение"
ARA_austerity_humility_desc:0 "Благочестивый грифон избегает роскоши и всего, что затуманивает его разум. Мы запретим все виды алкоголя и наркотиков и будем применять налоговую политику, которая не позволит нашему обществу лениться и избаловаться чрезмерным богатством."
ARA_rubber_camps:0 "Каучуковые лагеря"
ARA_rubber_camps_desc:0 "Каучук — ключевой ресурс для нашей будущей промышленности. К счастью, у нас слишком много заключённых и слишком много земель с хорошим потенциалом для его производства."
ARA_concrete_marble:0 "Бетон и мрамор"
ARA_concrete_marble_desc:0 "Место обитания грифонов в какой-то степени определяет их образ мышления. Отныне при расширении или реконструкции города у нас будет только две цели: восхвалять Арантигоса и создавать сооружения, наилучшим образом отвечающие потребностям нашей армии и промышленности."
ARA_science_of_war:0 "Наука войны"
ARA_science_of_war_desc:0 "Первоочередная цель наших ученых — создание оружия, с помощью которого мы сможем защитить славу нашей нации от еретиков-иноземцев."
ARA_tame_south:0 "Усмирение Юга"
ARA_tame_south_desc:0 "Большая часть населения наших новых территориальных приобретений имеет много общего с арантигцами, что делает эти территории довольно легко контролируемыми. Тем не менее, нам всё ещё необходимо создать новую, лояльную администрацию и избавиться от остатков сопротивления."
ARA_rebellious:0 "Бунтарская провинция"
ARA_rebellious_desc:0 "Сикамеон — поистине проклятое место, полное предателей и республиканцев! Они продолжали противостоять Гроверам, которые в конце концов отказались от идеи их полного усмирения. Но Избранных Арантигоса так просто не сломить!"
ARA_slash_and_burn:0 "Огнём и мечом"
ARA_slash_and_burn_desc:0 "За каждого убитого арантийца мы убьем трёх мятежников! Любое место, где враги могут найти убежище, будет уничтожено. Пощады не будет."
ARA_exile_minotaurs:0 "Изгнать минотавров"
ARA_exile_minotaurs_desc:0 "Минотавры Астериона известны своим стремлением к свободе. У нас не будет никаких шансов по-настоящему подчинить их земли... пока они там живут. Мы должны изгнать всех минотавров из Сикамеона!"
ARA_shackle_sicameon:0 "Оковы Сикамеона"
ARA_shackle_sicameon_desc:0 "Мы сделали это — все, кто остался в Сикамеоне, были покорены, и теперь мы можем начать нашу работу по превращению его в еще одну провинцию нашей славной империи."
ARA_creatures_most_wicked:0 "Самые злые существа"
ARA_creatures_most_wicked_desc:0 "Сотни лет назад пони Эквестрии основали колонию на землях, ныне известных как Новый Мейрленд. С тех пор они отравляют разум грифонов своими историями о дружбе и гармонии! Мы должны избавиться от пони и вернуть себе эту исконную землю грифонов."
ARA_cleanse_our_lands:0 "Уничтожение вредителей"
ARA_cleanse_our_lands_desc:0 "Теперь, когда мы одержали победу, пора избавиться от пони. Нам всё равно, куда они пойдут — им нужно лишь убраться из Арантиги, и сделать это НЕМЕДЛЕННО."
ARA_island_reservations:0 "Островные резервации"
ARA_island_reservations_desc:0 "Мы отказываемся вести любые дела с пони. Но теперь, когда весь Новый Мейрленд под нашей оккупацией, мы вынуждены с ними разобраться! Мы пойдём по первоначальному плану и создадим на островах пони государство, куда изгоним остальных, а затем, надеемся, забудем об их существовании. Конечно, мы позаботимся о том, чтобы у них не осталось ничего даже отдалённо напоминающего регулярную армию."
ARA_new_province:0 "Очищенная земля"
ARA_new_province_desc:0 "После победы над пони Нового Мейрленда нам необходимо включить эти земли в нашу империю и избавиться от всех следов их прежних владельцев."

### Events ###
arantiga.1.t:0 "Проблема экономического роста Арантиги"
arantiga.1.d:0 "Маленькое государство в южной Грифонии, Арантига никогда не имела хорошей экономики. Когда Империя рухнула, и Арантига стала независимой, ситуация ухудшилась.\n\nНо не все было потеряно. Арантига объединилась с вингбардийцами на юге и присоединилась к Карфинскому пакту в надежде защититься от агрессоров и восстановить свою экономику.\n\nК сожалению, Вингбардия использовала свое влияние, чтобы выжать все соки из нашей ослабленной экономики. Захват вингбардийскими компаниями большей части экономической прибыли Арантиги стал серьезной проблемой для нашей политики.\n\nИ эта проблема все еще не решена. Что будет с Арантигой дальше? Оборвем ли мы наши связи с вингбардийцами и станем экономически независимыми? Или просто попытаемся снизить их влияние на нас, сведя к минимуму отрицательное воздействие и использовав преимущества их экономической "помощи" по максимуму?"
arantiga.1.a:0 "Арантига сама будет контролировать свою судьбу!"
arantiga.1.b:0 "Может, мы просто станем равными?"

arantiga.2.t:0 "Мартовские Иды"
arantiga.2.d:0 "Настал тот день, который так ждал Доротеос.\n\nЭто было немногим позднее 2 часов дня, и, казалось, будто половина Спарлето заполнена солдатами. Вместе со своими последователями Доротеос пробирался через столицу, направляясь к правительственному району. Там произошла первая стычка между полицейскими-лоялистами и солдатами. Когда разгорелась битва на улицах, Доротеос и его личная охрана сумели прорвать оборону и вошли в Дом Правительства.\n\nМаргарет стояла перед окном в своем кабинете, наблюдая за битвой. Она уже позвала подкрепления, когда услышала первые сообщения о возможном перевороте; они должны будут защитить ее.\n\nВнезапно дверь в ее офис распахнулась, и когда Маргарет обернулась, она увидела своего брата, держащего револьвер в когтях. Она начала отходить назад, но уперлась в окно. Доротеос взвел свой револьвер. Маргарет закрыла глаза, молясь богам.\n\nВнезапно в офисе раздались голоса, совсем недалеко от кабинета, где они находятся."
arantiga.2.a:0 "Это грифоны Доротеоса, победа заговорщиков!"
arantiga.2.b:0 "Это подкрепления Маргарет, Доротеос арестован!"

arantiga.3.t:0 "Суд над Доротеосом"
arantiga.3.d:0 "Это был ужасный момент для Маргарет. Ей было тяжело видеть своего брата, с которым она провела так много времени, осуждённым за измену. Она сдерживала слезы, во всяком случае сейчас, но она, как и все остальные в зале суда, знала, что Доротеос виноват, и что даже Борей не спасет его от казни.\n\nСам процесс не занял много времени. Было много улик, свидетелей, гора трупов на улицах Спарлето и, конечно, сама Маргарет, которую он лично пытался застрелить, пока ее солдаты не схватили его.\n\nСудья был непоколебим. Он выполнил свой долг, объявив, что Доротеос виновен по всем пунктам. Измена высшего порядка. Наказание было предсказуемо - смерть.\n\nКогда стражники выводили мрачного Доротеоса из зала суда мимо Маргарет, она не смогла сдержать слез."
arantiga.3.a:0 "Да спасет его Борей..."

arantiga.4.t:0 "Политический сдвиг"
arantiga.4.d:0 "Недавний переворот показал нам, что наша текущая политика должна быть пересмотрена, чтобы удовлетворить общественность. Мы должны стремиться к демократизации правительства, чтобы предотвратить любые подобные инциденты в будущем.\n\nБыли приняты законы, разрешающие почти полную свободу слова. Критика правительства и правления баронессы более не наказуема, и любые ограничения на создание политических организаций также были сняты. Вскоре демократы и коммунисты начали распространять информацию о своих идеологиях и находить всё больше поддержки среди недовольного населения. Некоторые же остались верны баронессе и её консервативному правительству."
arantiga.4.a:0 "Времена меняются."

arantiga.5.t:0 "Первые выборы"
arantiga.5.d:0 "Известие о первых выборах обрадовало народ, и всевозможные движения и партии стали появляться по всей стране. Они начали рекламировать себя и бороться за общественную поддержку.\n\nНезадолго до выборов выявились три партии, имевшие наибольшие шансы на победу: партия Реформаторов, ныне правящие сторонники Баронессы, а также НКПА.\n\nНаконец, голосование было проведено, а результаты оглашены."
arantiga.5.a:0 "Партия Реформаторов одержала победу!"
arantiga.5.b:0 "Нынешнее правительство сохранило власть!"
arantiga.5.c:0 "Национал-коммунистическая партия Арантиги выиграла!"

arantiga.6.t:0 "Когтепожатие"
arantiga.6.d:0 "Реформаторы были выбраны народом, но старая гвардия считает их безумными оптимистами. Чувствуя, что это может помешать их попыткам реформировать страну, Антиоко Моро ищет аудиенции у бывшей правительницы Арантиги - Маргарет Фезерин.\n\nВ течение нескольких часов обе стороны обсуждали, насколько масштабными будут реформы Арантиги, в основном сфокусированные на армии, образовании и промышленности. К облегчению для большинства грифонов, переговоры увенчались успехом, и старое дворянство поддержит демократически избранное правительство Арантиги. Они уже обязались финансировать строительство нового цементного завода."
arantiga.6.a:0 "Блестяще!"

arantiga.7.t:0 "Арантийское единство"
arantiga.7.d:0 "Арантига не станет домом для радикалов и тех, кто ищет проблем и пытается пошатнуть мир. Арантига - это дом для тех, кто желает сеять мир. Для тех, кто хочет процветания. Встанем коготь к когтю и прислушаемся к призыву Баронессы, ведь она поведет нас в наше будущее."
arantiga.7.a:0 "Lunga vita alla Baronia!"

arantiga.8.t:0 "Спарлейское возрождение"
arantiga.8.d:0 "Национальные реформы Доротеоса зашли далеко, гораздо дальше, чем многие ожидали. Сегодня древний спарлейтский язык был официально возрожден и утвержден в качестве второго официального языка. В то время как некоторые граждане недовольны необходимостью изучения сложного мертвого языка, другие считают это великим культурным возрождением и довольны этим решением. Кроме того, это позволит нам исключить иностранное влияние на наш язык, которые мы считаем непатриотичными."
arantiga.8.a:0 "Zíto o Sparléos!"

arantiga.9.t:0 "Возрождение Арантигоса!"
arantiga.9.d:0 "Пришло время вернуть былую славу нашей Родины! Арантига, когда-то гордая и процветающая, в прошлом была захвачена имперцами, а в настоящем скована так называемыми "союзниками". Хватит это терпеть! Давайте вернем нашей нации былую славу! Вперед к победе!"
arantiga.9.a:0 "Мир будет моим!"

arantiga.10.t:0 "Переворот в Арантиге"
arantiga.10.d:0 "До нас дошли новости о перевороте, который недавно произошёл в маленьком баронстве Арантига. Во время того, что местное население называет "мартовскими идами", выдающийся полководец по имени Доротеос Фезерин захватил контроль над государством и уже старается избавиться от иностранного влияния, поскольку он обещает вернуться к "древним корням Арантиги". Одним из его первых решений был выход из нашего альянса.\n\nХотя история Арантиги, безусловно, впечатляет и полна кровопролития, генштаб Пакта считает, что реальной угрозы со стороны столь малой нации можно не ожидать. В конце концов, каковы шансы на появление нового Арантигоса, способного завоевать континент?"
arantiga.10.a:0 "Мы будем следить за Арантигой."

### NEW EVENTS ###
arantiga.001.t:0 "Генералы"
arantiga.001.d:0 "Кафе в столице Арантиги заполонили солдаты. Среди них были лейтенанты, генералы и даже сам маршал. Доротеос Фезерин сидел в одиночестве со своими ближайшими генералами, обсуждая чрезвычайно важный план. У Доротеоса были большие амбиции – восстановление Арантиги, и сегодня он должен был привести свой план в действие.\n"Итак, коллеги, вы согласны?" Генералы переглянулись: одни неуверенно, другие с ужасом. "Переворот, сэр? Вы уверены?" — спросил один, отставляя чашку кофе. "Конечно, дорогой Сотер. Нас поддерживает армия, кто станет нам противостоять? Её гвардия? Противостоять военным было бы самоубийством. Кассандр?" Он кивнул, соглашаясь: "Абсолютно самоубийственно! Все важные грифоны нас поддерживают".\nДоротеос продолжил, глядя на своего третьего генерала: "Лисимах, есть возражения?" Он пожал плечами и сказал: "А как же те, кто не верит? Никатор не , а баронессу многие любят..." Доротеос усмехнулся, тепло улыбнувшись. "О, Лисимах, доверься мне, доверься своему маршалу!""
arantiga.001.a:0 ""У меня все под контролем.""
arantiga.002.t:0 "Планы"
arantiga.002.d:0 "В глубине арантийской сельской местности располаглся хутор, к которому вела лишь узкая грунтовая дорога. Его оцепили солдаты, ожидая прибытия последнего генерала. Наконец, Лисимах подлетел, приземлился и ворвался внутрь, с грохотом захлопнув дверь.\nОн сел рядом с другими полководцами, которые тут же повернулись к нему. "Извините, я опоздал". Доротеос поднял взгляд от карты. Его раздражение скрывалось под маской серьёзности: "Что ж, Лисимах, позволь мне ввести тебя в курс дела...". В центре стола лежала карта Спарлето, столицы Арантиги.\n"План прост. По моему приказу Никатор будет размещён на границе под ложным предлогом, что иностранные мятежники пытаются её пересечь".\nСотер продолжил: "Я планирую держать свои войска вдали от чужих глаз. Если всё пойдёт наперекосяк, я приведу подкрепление".\nДоротеос посмотрел на Кассандра, и тот ответил, указывая на ключевые точки на карте: "Я освобожу начальника полиции от его задач и заменю полицию своими войсками. Если всё пройдёт хорошо, город будет под нашим контролем. Лисимах?"\nТот прочистил горло и поддержал: "В самом деле, я расставлю свои войска на всех контрольно-пропускных пунктах города. Ни один грифон не войдёт и не выйдет, пока Доротеос не захватит власть".\nДоротеос кивнул: "Есть возражения?"\nГенералы промолчали, совещание завершилось."
arantiga.002.a:0 ""Тогда мы готовы"."
arantiga.003.t:0 "Мартовские иды"
arantiga.003.d:0 "Маршал Доротеос Фезерин волновался: месяцы планирования привели к тому, что должно было произойти сегодня. Он был готов, но грудь его была тяжела и полна тревоги. Он вёл войска впервые. Ему раньше не доводилось участвовать в настоящей войне – и тем более возглавлять переворот, его военный опыт состоял из учений и стычек с бандитами...\nНо, несмотря на отсутствие опыта, он справится. Он не прольёт ни капли крови. Ему нужно было предотвратить любые мысли о контрперевороте. Его чистый захват власти покажет, кто такой Доротеос, и как много для него значит его народ.\nОн вёл солдат ко дворцу, где он столкнулся лицом к лицу с дворцовой стражей и своей сестрой, Маргарет Фезерин, баронессой. Ему нужно было всё сделать как положено. Он и его грифоны подошли как можно ближе, прежде чем дворцовая стража потребовала остановиться.\nДоротеос знал, что ему нужно сделать. Его охрана расступилась, и он вышел, держа мегафон в когтях, безоружный (он всегда носил с собой револьвер, как и все генералы). Он посмотрел на охранников и изложил свою позицию. "Послушайте..." — начал он, держа мегафон едва у клюва, он был на расстоянии выстрела от охранников. "Я не хочу проливать кровь арантийцев, я хочу, чтобы Арантига процветала..." Он поднял взгляд на вооруженных охранников: "Разве вы сражаетесь не за это? Или вы сражаетесь за нее? За баронессу?" Он закатил глаза.\n"Моя дорогая сестра, которая преклонила колено перед Вингбардией, что это за битва? Разве это битва? За это вы собираетесь умереть? В чём смысл её правления? Я предлагаю вам возможность сложить оружие и просто... Идите домой. Идите домой к своим семьям, будь то ваши матери и отцы..." Он понижает голос, "...или ваши сыновья и дочери. Идите домой, и в следующий раз, когда вы придёте сюда, вы не поднимете оружие за Вингбардию или за эту баронессу!"\nДоротеос взмыл в небо, сжав клешню: "Вы поднимете их за себя, за свои семьи... ЗА АРАНТИГУ!""
arantiga.003.a:0 ""Говори мягко, но держи у клюва большой мегафон.""
arantiga.004.t:0 "Окончание"
arantiga.004.d:0 "Доротеос стоял перед дверью покоев сестры, гадая, что будет дальше: что он сделает, как он это сделает, и как она отреагирует. Станет ли она сопротивляться? Неужели такая тишина потому, что она уже покончила с собой? Доротеос потянулся за револьвером на бедре и повернул дверную ручку.\nНичего. Он вошёл и закрыл за собой дверь, как если бы это была их самая обычная встреча. Он поднял глаза на свою "дорогую сестру". С пером в когтях она писала что-то на клочке пергамента. Она на мгновение остановилась, прежде чем продолжить.\n"Сестра..." – начал Доротеос, но она перебила его. Дрожащим голосом, почти готовая расплакаться, она сказала: "Хотя бы дай мне дописать завещание..." Доротеос кивнул, думая про себя, как это, должно быть, неприятно. Вскоре она закончила, встала и просто сказала: "Сделай это".\nДоротеос посмотрел на свой револьвер, зарядил один патрон и подумал, как это символично: переворот закончился одним выстрелом, одной смертью. Конечно, он сомневался: убийство члена семьи никогда не доставляет удовольствия, независимо от того, было ли это необходимо или нет. Но в случае провала его наказанием за государственную измену стала бы смерть – даже если бы сестра выступила в его защиту.\n\nПорой лидеры вынуждены принимать трудные решения. Это будет его первое. Он поднял револьвер и взвёл его. Маргарет произнесла последние слова, перед тем, как он спустил курок: "Спроси себя, когда ты сядешь на мой трон...""
arantiga.004.a:0 ""Оно того стоило?""
arantiga.005.t:0 "Блудные сыновья"
arantiga.005.d:0 "Арантига славится своими боевыми традициями – даже после распада королевства Спарлеос из-за внутренних распрей между генералами и наследниками Арантигоса Великого, военная подготовка арантийцев оставалась превосходной. Более того, когда Гровер I завоевал Грифонию, он использовал устав арантийских легионов в качестве основы своей новой имперской армии. Даже сейчас существует ряд отрядов арантийских наёмников, известных своей искусной подготовкой, которые странствуют по Грифонии и другим частям света – многие из них, несмотря на то, что никогда не видели родины, всё ещё хранят эти древние военные традиции. Теперь, когда Доротеос пришёл к власти, один из этих отрядов, "Сыны Арантигоса", прославившийся в Зебрике, где они сражались с армией Короля Шторма, вернулся в нашу страну и принёс клятву верности новому барону. А их капитан предложил связаться с другими отрядами, чтобы попытаться убедить их присоединиться к делу Доротеоса."
arantiga.005.a:0 "Добро пожаловать домой, братья и сестры!"
arantiga.006.t:0 "Раскрытие судьбы"
arantiga.006.d:0 "Доротеос не мог сосредоточиться. В последний месяц его мучили кошмары почти ежедневно. Он почти не спал, а планирование военных кампаний ещё больше изматывало его. Он пытался сосредоточиться на карте границы между Арантигой и Империей Грифонов, когда внезапно его повело. Через мгновение всё потемнело, и Доротеос упал со стула. \n...прекрасно. Он не мог подобрать лучшего слова. Ничто в мире смертных не сравнится с небесными горами, возвышавшимися перед ним. Так... Неужели это конец? Он шёл вперёд, пока не добрался до сада, посреди которого возвышался великолепный золотой фонтан... Всё выглядело точно так, как говорили жрецы – однако там не было богов и, уж конечно, никого из его предков... Доротеос нахмурился, осознав, что в загробной жизни он, возможно, действительно встретит свою сестру... Эта встреча будет не из приятных. Что, если он попал в Тартар? Однажды он слышал, как полубезумный жрец говорил, что ад – это не царство пыток, а вечного одиночества – худшего наказания, которое только могут создать боги. Доротеос сел на одну из скамей и спрятал лицо за когтями... Когда он раздвинул их, он уже был не один... Молодой белопёрый грифон любовался одним из цветков. Его глаза сияли таинственным светом. Почему-то Доротеос почувствовал, что уже встречал этого грифона раньше... "Добро пожаловать, я ждал тебя уже давно", – сказал незнакомец, повернувшись к барону. "Ждал меня? Почему?" – спросил Доротеос. "Я наблюдаю за тобой уже некоторое время, и я очень впечатлён. Ты оправдал мои ожидания – хотя я бы весьма удивился обратному. Мы в каком-то смысле едины, ты и я...""
arantiga.006.a:0 ""Мы – Арантигос""
arantiga.007.t:0 "Рождение нового королевства"
arantiga.007.d:0 "Ко всеобщему удивлению, после внезапной потери сознания Доротеос выглядел... бодрым и полным сил. Прошли те времена, когда он казался постоянно рассеянным, но мог внезапно и без причины начать кричать на слуг. Большинство его подчинённых вздохнули с облегчением. Гениальный полководец, покоритель Центральной Грифонии, за которым они последовали, вернулся. Хотя врачи рекомендовали ему отдых, Доротеос решил не откладывать запланированную коронацию. Чтобы закрепить недавние завоевания, Арантига должна была стать королевством! Церемония прошла в недавно отреставрированном Грифонстоуне, однако все следы прежней династии Гуто были удалены из дворца и заменены символикой дома Фезерин. Толпы солдат и горожан Арантиги собрались, чтобы принять участие в церемонии, означавшей возвращение былой славы. Когда прелат Ираклий короновал Доротеоса, он решил обратиться с речью к собравшимся грифонам.\n"Храбрые воины Арантиги и трудолюбивые горожане, это был долгий путь, но вот мы здесь... Имя Арантиги разносится по Грифонии, и другие народы боятся и уважают нас. Грифоны больше не смотрят друг на друга с недоумением, услышав об Арантиге. Мы восстановим славу нашей великой империи... Мы, арантийцы, вернулись, и снова поведём Арантигу в будущее! Слава Арантиге!"\n"Слава Арантиге!" — закричали те, кто уже знал, что задумал их новоиспеченный король. Другие выглядели растерянными, услышав его слова, но вскоре их голоса присоединились к общему крику."
arantiga.007.a:0 "Слава Арантигосу Возрождённому!"
arantiga.008.t:0 "Наследие Гровера"
arantiga.008.d:0 "Доротеос восседал на троне покойной династии Гуто. Несколько реликвий прошлого, уцелевших после недавней перестройки дворца по приказу Арантигоса, были разбросаны по залу, ожидая, когда им окажут должное внимание. Они напоминали сам развращенный город, пока наконец не появился Арантигос. Он повернулся к мозаике, изображавшей Гровера, получающего благословение от самого Борея. Нескольких камней не хватало, но она всё равно выглядела великолепно.\nНа мгновение Арантигос задумался, о чём думал Гровер сидя в этом дворце, планируя свои, казалось бы, невозможные завоевания. Смог бы он покорить Грифонию, если бы не обладал Идолом? Писк открывающейся двери вернул его к реальности. Группа его воинов втащила коричнево-белую, громко ругающуюся, грифоншу. Солдаты подошли и бросили её перед троном.\n\n"Мы же говорили вам сделать это цивилизованно" – сказал Арантигос командиру солдат.\n"Господин Арантигос, она сказала нам, что у неё есть дела поважнее, чем отвечать на ваши вопросы. Она назвала вас "воякой с самомнением размером с Древо Грифонстоуна" и оказала сопротивление при аресте".\n"Я ошибалась. Оно как чёртово озеро Румейр!" Грифонша пошатнулась, глядя на довольно безвкусную картину, изображающую Арантигоса Великого, передающего меч Доротеосу.\n"Раньше это место было грязным, а теперь оно похоже на аквелийский цирк!" \n"Надо признать, у неё есть смелость..." — сказал Арантигос. — "...Но ты здесь не для того, чтобы давать мне советы по декору! Идол Борея. Нам сказали, что ты и несколько эквестрийских пони были последними, кто пытался вернуть его. Где он?"\n"Идол? Он провалился глубже в Бездонную Бездну, которая, если ты не в курсе, смертельная ловушка. К тому же, это всего лишь кусок золота... по крайней мере, так я слышала. Спускаться туда — самоубийство, а Идол окончательно потерян. Ветра там дуют со скоростью поезда. Нам повезло, что мы вообще оттуда выбрались живыми".\n"Ты покажешь нам это место..." – Арантигос слабо улыбнулся — "...и тогда мы посмотрим, действительно ли он "окончательно потерян", как ты сказала".\n"Только безумец станет туда спускаться! Ты же не НАСТОЛЬКО спятил?!"\n"Нам задавали тот же вопрос, когда мы шли на Грифонстоун...""
arantiga.008.a:0 "...и всё же мы здесь.""
#arantiga.999.t:0 "Конец пути"  
#arantiga.999.d:0 " На этом бета-контент Арантиги завершен. С этого момента вы можете играть за неё как угодно. Спасибо за игру!"
#arantiga.999.a:0 " Си ю некст патч! "
arantiga.009.t:0 "Спарлейское возрождение"
arantiga.009.d:0 "Национальное возрождение, начатое Доротеосом, зашло гораздо дальше, чем многие ожидали. Сегодня древний спарлейский язык вновь введён в качестве второго официального языка. Хотя некоторые граждане недовольны необходимостью изучать давно мёртвый язык, многие видят в этом возвращение величия Арантиги и приветствуют это решение. Кроме того, это позволяет нам избавиться от непатриотичного иностранного влияния на наш язык."
arantiga.009.a:0 "Zíto o Sparléos!"
arantiga.010.t:0 "Сны"
arantiga.010.d:0 ""ВСЁ ПОД КОНТРОЛЕМ, ПОД МОИМ КОНТРОЛЕМ!!" — кричит он в мегафон, и размышляет про себя, стоил ли того выстрел в покоях её сестры. Каждый раз, когда он выигрывает битву, каждый раз, когда захватывает город, каждый раз, когда его народ ликует, видя его. Каждый раз в голове звучит эта фраза: "Оно того стоило?". Каждое утро в своём роскошно украшенном дворце он просыпается от одного и того же кошмара: он смотрит ей в глаза, пока города рушатся, а грифоны склоняются перед ним, и слышит лишь её вопрос: "Брат, ты всё ещё считаешь, что оно того стоило?""
arantiga.010.a:0 "..."
arantiga.011.t:0 "Воспоминания"
arantiga.011.d:0 ""...и, барон, именно поэтому дела моей компании идут так плохо..."\nДоротеос на самом деле не слушал влиятельного бизнеспони из Нового Мейрленда, который просил аудиенции только для того, чтобы пожаловаться на каждую мелкую проблему, с которой он столкнулся в Арантиге. Зачем я это слушаю? Неужели он действительно думает, что мне нечем заняться? Однако пони был не самой большой проблемой. Трон, на котором восседал Доротеос, всегда очень удобный, теперь казался орудием пыток – Доротеос просто не мог найти позу, в которой бы не чувствовал боли.\n"Хватит! Убирайтесь, или я прикажу вас казнить!" — вдруг закричал он. Пони замер, пробормотал какое-то извинение и выскочил из комнаты. Доротеос поднялся с трона.\n"Замените этот чёртов стул!" — приказал он секретарю. Старый грифон кивнул, сказав: "Так точно, мой барон. Будет сделано". С годами секретарь научился не спорить с Доротеосом, когда тот был в плохом настроении. Трон присоединился к длинному списку мебели, выброшенной потому что Доротеос приказал убрать всё, что напоминало ему о его покойной сестре..."
arantiga.011.a:0 "Работать во дворце стало небезопасно."
arantiga.012.t:0 "Неожиданное возвращение"
arantiga.012.d:0 "Быть правителем всегда означало кучу бумажной работы, и небрежное отношение к административным обязанностям никогда не приводило к хорошему. Доротеос читал какие-то неинтересные отчёты, когда, ненадолго потеряв средоточие, он заметил на полу перо. В его появлении не было ничего странного – они порой выпадают из грифонов, но это перо выглядело странно... Доротеос присмотрелся, почувствовал, что сердце у него на секунду остановилось и закричал: "ОХРАНА! ОХРАНА!"\nДвое солдат, стоявших у дверей его кабинета, бросились внутрь с оружием в руках, готовые защитить своего барона от незваного гостя. Но его там не оказалось – вместо этого они увидели Доротеоса, трясущегося в кресле и указывающего на фиолетовое перо.\n"ЧТО ЭТО?! ГДЕ ОНА?!" – закричал он.\nСтражники выглядели растерянными. Один из них медленно подошёл к неприятному предмету и внимательно его рассмотрел.\n"Кажется, Ваше Величество, одна из новых служанок обронила его. Неуклюжая птичка. Как бы она перо в чае не оставила..."\nДоротеос растерянно моргнул. "Служанка?" — спросил он.\n"Да, сэр, у неё точно такой же цвет оперения".\nКулак барона с силой ударил по столу. "Приказываю её уволить! Она должна покинуть этот дворец немедленно! НЕМЕДЛЕННО!" Стражники быстро покинули комнату, побоявшись гнева барона. Доротеос начал бормотать себе под нос: "Да, это была всего лишь служанка. Её ведь я убил, верно? Она мертва!""
arantiga.012.a:0 "И она останется мертва!"
arantiga.013.t:0 "Великий разлом"
arantiga.013.d:0 "Когда циклоп Аримаспи похитил идол Борея, стража короля Гуто последовала за ним. В последовавшей битве и вор, и Идол провалились в бездонную пропасть возле Грифонстоуна. До этого момента все попытки вернуть артефакт терпели неудачу, и многие возвращались из пропасти ни с чем, а чаще погибали. Однако Доротеос – не рядовой искатель приключений. Он благословлён самим Бореем. В каком-то смысле они с Бореем едины! Какую бы тьму он ни встретил, он победит."
arantiga.013.a:0 "Вперёд!"
arantiga.014.t:0 "Начало спуска"
arantiga.014.d:0 "Доротеос, вооружившись альпинистским снаряжением, начал спускаться по разлому. Ветра там невероятно сильны, ему часто приходится цепляться за скалу и ждать, пока ветер не стихнет. Яма кажется бесконечной, и, карабкаясь таким образом, он может так и не достичь её дна..."
arantiga.014.a:0 "Я попытаюсь использовать крылья."
arantiga.014.b:0 "Я продолжу карабкаться."
arantiga.015.t:0 "Полет вниз"
arantiga.015.d:0 "Ветер швыряет Доротеоса о скалы. Его крылья ломаются, и он падает, громко крича. Следующий порыв снова бьёт его о стену разлома, наконец раскалывая ему череп."
arantiga.015.a:0 "НЕЕЕЕТ!"
arantiga.016.t:0 "Ветер ослабевает"
arantiga.016.d:0 "После нескольких часов осторожного спуска, ветер ослаб. Измученный Доротеос нашёл хорошее место для отдыха..."
arantiga.016.a:0 "Не время останавливаться!"
arantiga.016.b:0 "Мне не помешает перерыв."
arantiga.017.t:0 "Во тьму"
arantiga.017.d:0 "Наконец, Доротеос достигает дна разлома. Он настолько глубок, что солнца больше не видно, и ему приходится полагаться на свет своей волшебной лампы... Там что-то есть — он чувствует это. Оно голодно."
arantiga.017.a:0 "Вперёд!"
arantiga.018.t:0 "Небольшой перерыв"
arantiga.018.d:0 "Через несколько минут отдыха Доротеос слышит громкий треск... Прежде чем он успевает отреагировать, кусок скалы, на котором он отдыхал, откалывается, и Доротеос вместе с ним погружается в небытие."
arantiga.018.a:0 "ШЛЁП!"
arantiga.171.t:0 "Вход"
arantiga.171.d:0 "Доротеос продвигается сквозь тьму. Руководствуясь лишь тусклым светом лампы и осязанием, он движется вдоль сужающейся трещины и останавливается, обнаружив отверстие в стене.\nПри ближайшем рассмотрении он понимает, что это не отверстие, а послание, высеченное в скале. Он отходит от стены и читает древние слова:"
arantiga.171.a:0 "LASCIATE OGNE SPERANZA, VOI CH’INTRATE"
arantiga.019.t:0 "Хранитель"
arantiga.019.d:0 "По мере того, как Доротеос углублялся в каменный лабиринт, его волшебная лампа начинала меркнуть, словно окружающая тьма пытается поглотить свет. Он быстро теряет счёт времени. Возможно, он бродил здесь час или два... Но ему кажется, что прошла целая вечность. Наконец, тропинка расширилась...\nПосреди небольшой открытой комнаты сидит существо в капюшоне – по-видимому, грифон – но из-за одежды и окружающей темноты Доротеос не видит лица. Сначала он не реагирует на незваного гостя, который медленно приближается к нему, крепко держа рукоять револьвера. Однако, когда Доротеос сокращает расстояние между ними до пары шагов, он начинает говорить: "Ты глупец, что пришёл сюда, юный завоеватель. Ты хочешь вернуть то, что давно утрачено... В каком-то смысле оно было утрачено ещё до того, как оказалось здесь. Это бесполезный предмет. Реликвия бога, которому больше нет дела до своих творений... Ты думаешь, что будешь благословлён его силой. Как глупо. Ты считаешь себя достойным обладать силой Идола?""
arantiga.019.a:0 "Мы есть Арантигос. Это наше право!"
#arantiga.019.b:0 "Я заставлю его отдать мне свою силу!"
arantiga.019.b:0 "Я не собираюсь отвечать тебе, демон!"
arantiga.020.t:0 "Сердце тьмы"
arantiga.020.d:0 "Услышав слова Доротеоса, существо смеётся. Разгневанный король хватает револьвер, но существо растворяется во дыму...\nТьма сгущается. Доротеос чувствует, что кто-то наблюдает за ним. Но он продолжает идти вперёд, сквозь тьму. Через некоторое время он понимает, что заблудился. Он блуждает по лабиринту бесчисленные часы, но Идола нигде нет. В панике он взлетает, чтобы выбраться из разлома, но ветер возвращается и заставляет его приземлиться. После нескольких попыток он сдаётся и просто садится, глядя на медленно угасающий магический свет его лампы.\nСущество ещё здесь... оно ждёт. Нужно быть терпеливым – свет не подпускает его, но вскоре свет померкнет. В конце концов светильник гаснет, Доротеос улыбается про себя и закрывает глаза.\nОн лишь надеется на милость богов... Если, конечно, его душа когда-нибудь выберется из этого проклятого места."
arantiga.020.a:0 ""Дорогая сестра, прости меня...""
arantiga.021.t:0 "Короли прошлого"
arantiga.021.d:0 ""Ты глуп, но храбрости тебе не занимать. Я ценю твою силу воли. Возможно, это будет интересно..." Грифон указывает когтем на одну из многочисленных тропинок. "Я буду наблюдать за тобой, завоеватель. Как и всегда".\nДоротеос решает пойти по тропе, выбранной фигурой в капюшоне. Он не оглядывается. Почему-то он знает, что ему не захочется видеть то, что может быть позади него. Через несколько минут ходьбы он приближается к чему-то, похожему на дворцовый зал, высеченный в камне. Какое странное место для такого сооружения. Для кого это построено? Он проходит мимо множества колонн, чьи верхушки теряются в темноте, и какое-то время разглядывает статуи, изображающие многочисленных грифонов – все в коронах, диадемах и других символах королевской власти. Он узнаёт некоторых из них – короля Гуто VI, Кихая де Киссау, Жерара Дискрета... Наконец он подходит к концу зала.\nТам, на платформе, стоит пустой трон, на его основании высечены слова "Гровер Грифонстоунский". Рядом с ним лежит старый меч, покрытый ржавчиной... Доротеос чувствует, как будто что-то ждёт от него действий. Но каких?"
arantiga.021.a:0 "Воссесть на трон"
arantiga.021.b:0 "Взять меч"
arantiga.022.t:0 "Лорд Грифонстоунский"
arantiga.022.d:0 "Когда Доротеос садится на трон, он начинает чувствовать спокойствие. Впервые за много месяцев он знает, что ему предназначено. Он достиг величия, воскресив Арантигу. Теперь он наконец может отдохнуть..."
arantiga.022.a:0 "...среди мертвых королей."
arantiga.023.t:0 "Своя судьба"
arantiga.023.d:0 "Время отдыха ещё не пришло. Хватая старый меч, Доротеос осознаёт, что Гровер никогда не ждал – он действовал. Он не остался в Грифонстоуне, а двинулся вперёд и покорил бесчисленные народы. Ему предстоит сделать то же самое – такова его судьба. Возможно, он никогда не обретёт покоя... Но он не ищет покоя, он жаждет войны и славы. Поднявшись, он видит перед собой новый проход.\nС каждым шагом тропа становится всё уже, пока Доротеосу не приходится протискиваться сквозь щель между двумя скалами. Наконец он входит в другую комнату. Странное чувство. Он определенно не один. Его лапа сильнее сжимает рукоять меча...\n"Брат... ты пришёл". Доротеос знает этот голос и знает, что его обладатель не может произносить эти слова. Из темноты появляется его давно умершая сестра Маргарет. Она кажется опечаленной... "Давно не виделись, не так ли?" – спрашивает она.\n"Ты всего лишь призрак этого проклятого места. Ты ненастоящая" — отвечает Доротеос.\n"Ты так думаешь? А что, если ты мертв, как и я? Эта бескрайняя пустота поглотила тебя, и теперь ты скитаешься по ней бесцельно, преследуемый своими сомнениями и грехами прошлого... Дорога в рай тебе закрыта. А это место как раз для тебя".\nДоротеос хмурится, слыша эти слова. "Чего ты хочешь?"\nМаргарет тепло улыбается. "Я пришла сюда, чтобы помочь тебе. Тебе нужен проводник, кто-то, кто укажет тебе путь".\n"И почему я должен тебе доверять?" — с подозрением спрашивает Доротеос.\n"Я твоя сестра. Я всё ещё люблю тебя – даже после того, что ты сделал, дорогой брат".\n\nКороль медленно приближается к призраку своей сестры..."
arantiga.023.a:0 "...чтобы пронзить её мечом"
arantiga.023.b:0 "...и следует за ней"
arantiga.024.t:0 "Без жалости"
arantiga.024.d:0 "Когда меч достигает её сердца, Маргарет закрывает глаза. Она произносит: "Надеюсь, оно того стоило", – и исчезает. Доротеос отпускает меч и на мгновение застывает, прежде чем продолжить свой путь. Когда он "убил" её во второй раз, он ничего не почувствовал... Избавился ли он наконец от вины?\nКазалось, что прошла вечность, но когда свет его лампы почти полностью померк, он увидел слабый отблеск света впереди, пробивающийся из-под небольшой груды камней. Приблизившись, он увидел свою награду – идол Борея. Подняв его, Доротеос не почувствовал ничего особенного... Он был немного тёплым, но не выдавал никаких признаков сверхъестественной силы; Борей не заговорил с ним. Но, без сомнения, в его лапах был Идол. Он усмехнулся. Так что, всё это было напрасно? Что ж, возможно, Идол не сделает его непобедимым воином, как Гровера, но грифоны определённо поверят в его избранность. Достаточно ли такой награды?\nКогда Доротеос начал подъём, ветер показался ему слабее прежнего, словно его что-то защищало. Он поднимался часами, но наконец достиг вершины разлома. Его стражники с облегчением увидели своего правителя живым и здоровым. А когда он достал из сумки Идол, они были заворожены. Некоторые из них опустились на колени и начали молиться Борею. Доротеос положил древний артефакт обратно в сумку и сел на землю, переводя дух... Затем он снова посмотрел в бездну и отдал приказ: "Уничтожьте её. Сколько бы взрывчатки ни потребовалось, я хочу, чтобы она исчезла"."
arantiga.024.a:0 ""Это не место для смертных"."
arantiga.025.t:0 "Откровение"
arantiga.025.d:0 "Доротеос решает последовать за сестрой. Они блуждают по лабиринту проходов и коридоров. Прошла, кажется, целая вечность, прежде чем он увидел ослепительный свет. Он устремился вперёд и на мгновение потерял чувство... Когда зрение вернулось к нему, он увидел прекрасный сад и великолепные золотые фонтаны. Сестра стояла рядом с ним и добродушно улыбалась. Лишь мгновение Доротеос сопротивлялся, но наконец мысли о славе и победах угасали... Он понимал, что получил то, чего желал больше всего –"
arantiga.025.a:0 "Прощение"
arantiga.026.t:0 "Переворот Никатора"
arantiga.026.d:0 "Через несколько дней после возвращения Доротеоса из Грифонстоуна отряд солдат под командованием генерала Никатора атаковал королевскую резиденцию. Более мелкие группы были отправлены для захвата ключевых точек столицы и её блокады. Однако план провалился, когда основные силы не смогли прорваться сквозь охрану дворца, которая, в отличие от переворота в мартовские иды, сражалась до последнего грифона, дав время лоялистам собраться и оттеснить мятежников. Стычки продолжались весь день, пока последние отряды повстанцев не сдались. Их генерала схватили и доставили к королю.\n\nНикатор стоял перед своим государем в полном молчании. Доротеос не видел в его глазах страха – только презрение. "Зачем ты нас предал? Ты был нашим соратником. Ты сражался вместе с нами. Когда окончательная победа была бы достигнута, ты получил бы все, что можешь желать. И всё же ты восстал против нас – против Арантигоса..."\nНикатор сплюнул на пол. "Именно поэтому я и восстал против тебя, Доротеос. Мы? Я пошёл за тобой, потому что верил, что ты восстановишь нашу страну – верил, даже когда убил баронессу! Но ты стал властолюбивым маньяком. Ты возомнил себя Богом! Сколько ещё крови ты выжмешь из Арантиги, чтобы победить? Стоят ли того все страдания, которые ты причинил своему народу? Оно того стоит, Доро..."\nПрежде чем Никатор закончил фразу, Доротеос схватил револьвер и быстро разрядил все шесть патронов в предателя. Стражники задрожали, увидев, насколько исказилось лицо их правителя от гнева. Он продолжал нажимать на спуск, но пистолет лишь щёлкал. Он сделал несколько глубоких вдохов и пришёл в себя. "Теперь, когда с предателем покончено...""
arantiga.026.a:0 ""...уберите его труп, и поддайте его имя забвению"."
arantiga.027.t:0 "Мудрость веков"
arantiga.027.d:0 "Хотя Арантига – государство с долгой и славной историей, в последнее время оно вступило в период упадка, что привело к ослаблению нашего научного потенциала. С завоеванием Грифонстоуна мы теперь контролируем многочисленные архивы, школы и колледжи этого священного города. Хотя большинство из них находятся не в лучшем состоянии, как и сам город, они всё ещё могут быть нам полезны. Доротеос приказал восстановить многие из этих ключевых объектов и обеспечить их надлежащим финансированием, чтобы обеспечить их скорейшее введение в эксплуатацию. Многие талантливые и умные грифоны больше не будут жить в нищете. Теперь они могут свободно использовать свои таланты на благо Арантиги."
arantiga.027.a:0 "Знание – сила!"
arantiga.998.t:0 "Встреча"
arantiga.998.d:0 "Поздним вечером Сотер прибыл в новую резиденцию Никатора. Расположенная на северном берегу озера Румейр, она раньше была поместьем местного герцога, пока Доротеос не конфисковал земли и богатства старой знати. Многие из них были проданы – Арантига отчаянно нуждалась в деньгах для своей постоянно растущей военной машины, но часть из них была роздана избранным соратникам короля. Прогуливаясь по обширному саду резиденции, Сотер заметил отсутствие слуг – лишь несколько солдат личного отряда Никатора несли здесь караул. Всё это место напоминало военный штаб. Хозяин поприветствовал его на крыльце, и, пожав когти, они уселись в удобные кресла. Молодой грифон в форме ефрейтора принёс бутылку местного вина и, отсалютовав генералам, быстро исчез. Сотер обратился к Никатору:\n"Итак, друг мой, должен сказать, ты добыл драгоценный камень в короне Румейра, но, полагаю, ты пригласил меня не для того, чтобы показать его мне, не так ли? Все эти солдаты, верные только тебе... Ты явно хочешь, чтобы наш разговор остался только между нами". Никатор отпил вина и ответил, слабо улыбнувшись:\n"В самом деле, Сотер, в самом деле... Ты один из немногих грифонов, наделенных властью, которым я могу доверять. Лисимах — бездумный фанатик, а Кратерус лишь недавно присоединился к нашим рядам. Сейчас тяжёлые времена, когда верных друзей мало, и их трудно найти. Я думаю, пришло время действовать. Скоро мы будем втянуты в войну, которую нам не выиграть. Доротеос... Он безумец. Ты слышал его речь во время коронации — он думает, что он Арантигос! Он хочет развязать войну со всем миром! Он приведёт нас к верной гибели!"\n"Что ж, когда-то казалось, что мы не сможем победить грифонстоунцев – пока мы не попробовали, и вот мы здесь..." – Сотер усмехнулся. – "Вот мы здесь; наслаждаемся плодами невероятной победы. Но, должен согласиться, всё зашло слишком далеко. Капитан королевской гвардии – мой хороший друг, и он в последнее время рассказывает мне тревожные истории. Я тоже думаю, что Доротеос постепенно сходит с ума, но пока он нас ни разу не подвёл. И солдаты любят его. Они пойдут за ним до конца. Перед лицом неминуемого поражения Лисимах скорее умрёт, чем предаст его. Кассандр, полагаю, тоже последует за ним".\n"А ты?" – спросил Никатор.\n"Я?" – Сотер немного помолчал – "Мы окружены врагами – Аквелия, Империя, Вингбардия – они придут за нами в любой момент. Нам нужна победа Доротеоса. Пусть он и безумец, но он блестящий полководец". Сотер допил вино и завершил разговор: "Сделаю вид, что этой встречи никогда не было".\nНесколько часов спустя, когда Сотер уже покинул резиденцию, он понял, что пора действовать. Никатор наверняка попытается свергнуть Доротеоса, и в такое время хаоса..."
arantiga.998.a:0 "...удача благоволит смелым."
arantiga.997.t:0 "Час волка"
arantiga.997.d:0 "Старый дворец Гроверов, казалось, покровительствовал теням. Даже при свете множества свечей и ламп вокруг, они всё ещё возникали, росли и извивались в разных частях комнаты, где сидел Доротеос. Но темноты боятся только цыплята. Доротеосу было некогда беспокоиться о тенях, поскольку, как это часто случалось в последнее время, он работал допоздна.\nСтол заполонили древние книги и гораздо более современные отчёты, пока он читал всё, что мог найти о Бездонной Бездне. Было много историй похожих на дешёвые романы ужасов, но ничего по-настоящему полезного. Только мифы, слухи и легенды. Пока он расшифровывал особенно древнюю книгу, написанную на античном варианте грифиша, из неё внезапно вырвались пузырьки чистого света.\nДоротеос поднял голову. Все грифоны в глубине души были хищниками. Хотя их чувства притупились за века цивилизованной жизни, он чувствовал, что здесь не один.\n"Занятный парень, не правда ли? Он напоминает мне тебя, отец, – до того, как ты позволил непокорному солдату убить себя. Как и ты, гонясь за славой и завоеваниями, он приносит подданным отчаяние".\n"Он совсем не такой, как я! Он слаб, нерешителен и только оскверняет это место. Это дом величайшей династии, когда-либо правившей Грифонией! Он – потомок давно забытого короля, который достиг лишь малой доли того, чего добились мы!"\n"Ты слишком суров с ним, – хрипло рассмеялся третий голос. Придётся подождать, чтобы честно оценить его достоинство. Он уже достиг больших успехов, но он не может почивать на лаврах, если хочет выделиться. Я никогда не сидел здесь в раздумьях. Это не метод завоевателя".\n"Кто вы все такие!?" – прорычал Доротеос, сжимая револьвер – "Покажитесь, нарушители!"\n"Нарушители? Кто здесь нарушитель?" — прозвучало за его плечём. Он резко обернулся и увидел гниющий череп грифона в короне Грифонстоуна. Он закричал от ужаса и дёрнул спусковой крючок. Долю секунды спустя..."
arantiga.997.a:0 "...он пришел в себя"

arantiga_chaos.001.t:0 "Полный хаос"
arantiga_chaos.001.d:0 "Через несколько дней после того, как Доротеос спустился в великий разлом, пытаясь вернуть Идол Борея, большинство его подданных потеряло всякую надежду на его возвращение. Поначалу никто толком и не знал, что делать. С исчезновением короля страна фактически осталась без правителя. Только один грифон был готов к такому повороту событий – причём непреднамеренно. Генерал Никатор уже некоторое время собирал поддержку, планируя свержение Доротеоса. Он последовал за ним после "мартовских ид" неохотно, и со временем всё больше убеждался, что Доротеос – безумец, который погубит Арантигу. Хотя он не ожидал такого поворота событий, генерал решил действовать быстро и повёл свои верные войска к столице. Гарнизон не пытался сопротивляться, и когда город был захвачен, Никатор обратился к народу по радио, провозгласив себя регентом Арантиги... И тут всё пошло под откос. За редким исключением, только полки Никатора поддержали его. Пара генералов подчинилась ему, а все остальные разошлись завоёвывать свои собственные владения, сражаясь друг с другом за контроль над различными территориями страны..."
arantiga_chaos.001.a:0 ""Я делаю это ради Арантиги.""
arantiga_chaos.003.t:0 "Новый король"
arantiga_chaos.003.d:0 "Сегодня в столице Никатор был коронован новым королём Спарлеоса. Его недавние победы над боевиками, пытавшимися погрузить страну в хаос, и быстрое восстановление порядка сделали его популярной фигурой среди граждан, поэтому его коронация практически не встретила сопротивления. После церемонии, когда Никатор покинул храм Борея, чтобы произнести речь перед толпами горожан, он провозгласил, что мир и процветание вернутся в Спарлеос, и его жители больше не будут умирать из-за амбиций безумцев. Страна не забудет своего прошлого, но и будет двигаться к лучшему будущему – будущему без войн и кровопролития."
arantiga_chaos.003.a:0 "Да здравствует король!"
arantiga_chaos.004.t:0 "Выборы"
arantiga_chaos.004.d:0 "Регент Никатор неожиданно объявил об отмене монархии в Арантиге и о проведении демократических выборов. Он заявил, что монархия явно провалилась как в Арантиге, так и в других странах Грифонии, где правят тиранические короли и императоры, и что именно простые грифоны должны вести нацию в будущее. Вскоре после этого состоялись выборы, и голоса разделились в основном между двумя кандидатами:\n\nАнтиоко Моро, недавно вернувшимся в страну после вынужденного отъезда из-за национализации вингбардийской промышленности Доротеосом. И, к удивлению многих грифонов, генералом Сотером, заручившимся поддержкой левых партий, создавших левоцентристскую коалицию.\n\nГолоса подсчитаны, и общественность желает знать: кто победил на выборах?"
arantiga_chaos.004.a:0 "Поздравляем Антиоко Моро и его Реформисткую Партию!"
arantiga_chaos.004.b:0 "Сотер и его коалиция побеждает! Тост за здоровье Генерала-Президента!" 
arantiga_chaos.005.t:0 "Арантига в Антанте?"
arantiga_chaos.005.d:0 "Не так давно грифоны Аквелии освободились от оков монархии и основали республику. Теперь её дипломаты обращаются к нам с предложением союза. Хотя Арантига и удерживает некоторые земли, на которые претендует Аквелия, с их помощью мы сможем обезопасить восточную границу в случае нападения Империи или Вингбардии..."
arantiga_chaos.005.a:0 "Мы, конечно же, согласны!"
arantiga_chaos.005.b:0 "Нет. Они бы нам только мешали."
arantiga_chaos.006.t:0 "Арантийский вассал?"
arantiga_chaos.006.d:0 "Новый король Арантиги совершенно нежданно прислал нам интересное предложение. Он желает присоединиться к Империи в качестве вассала, если мы позволим ему сохранить автономию Арантиги. Арантига может стать ценным союзником в борьбе с Вингбардией, однако, если оставить её в покое, это может подорвать мечту об объединении Грифонии..."
arantiga_chaos.006.a:0 "Принять их к себе."
arantiga_chaos.006.b:0 "Они нам не нужны."
arantiga_chaos.007.t:0 "Арантига возвращается"
arantiga_chaos.007.d:0 "К нам обратились дипломаты из Арантиги. После смерти короля Доротеоса, Арантига, по-видимому, отказалась от своих безумных завоевательных амбиций и теперь хочет вновь присоединиться к Карфинскому пакту. Хотя мы, вероятно, никогда не восстановим там своё влияние, арантийцы могли бы стать ценными союзниками, поскольку контролируют Центральную Грифонию."
arantiga_chaos.007.a:0 "Добро пожаловать назад!"
arantiga_chaos.007.b:0 "Они нам не нужны."
arantiga_chaos.008.t:0 "Южные республиканцы"
arantiga_chaos.008.d:0 "После смерти безумного короля Арантиги, военная хунта решила передать власть гражданскому правительству. Так была основана новая республика. К нам обратились их дипломаты, желая присоединиться к нашей борьбе, однако арантийцы отказываются входить в состав Республики Грифонов, заявляя, что будут иметь с нами дело только на равных условиях..."
arantiga_chaos.008.a:0 "Добро пожаловать, братья!"
arantiga_chaos.008.b:0 "Но что насчет пангрифоньей мечты?"
arantiga_chaos.009.t:0 "Аквелия принимает нас!"
arantiga_chaos.009.d:0 "Аквелийцы посчитали, что мы можем присоединиться к ним в грядущих войнах."
arantiga_chaos.009.a:0 "К оружию!"
arantiga_chaos.011.t:0 "Ярмо Грифенхейма"
arantiga_chaos.011.d:0 "Империя принимает нас к себе, однако можно только надеяться, что они будут уважать нашу автономию."
arantiga_chaos.011.a:0 "Безопасность, но какой ценой?"
arantiga_chaos.013.t:0 "Южная оттепель"
arantiga_chaos.013.d:0 "Вингбардия рада приветствовать нас снова. Надеемся, мы сможем снова заслужить их доверие и убедить их, что на этот раз мы не нарушим своих обещаний."
arantiga_chaos.013.a:0 "Нет, никогда снова."
arantiga_chaos.015.t:0 "Ответ из Клаудбьюри"
arantiga_chaos.015.d:0 "Республика Грифонов объявила, что мы, как братья, объединяемся в борьбе за новую Грифонию."
arantiga_chaos.015.a:0 "Я люблю демократию."
arantiga_chaos.010.t:0 "Аквелия отказывается"
arantiga_chaos.010.d:0 "Аквелийцы не собираются принимать нас в Антанту. Поскольку мы владеем территорией, которую Аквелия считает своей законной претензией, совершенно очевидно, что вскоре мы можем столкнуться с конфликтом со Второй республикой..."
arantiga_chaos.010.a:0 "Все пошло не по плану..."
arantiga_chaos.012.t:0 "Империя нас отвергает"
arantiga_chaos.012.d:0 "Империя отвергла наше щедрое предложение. Нам нужно подготовить оборону, поскольку их попытка возвращения Центральной Грифонии — лишь вопрос времени..."
arantiga_chaos.012.a:0 "Мы выдержим!"
arantiga_chaos.014.t:0 "Вингбардия отказывает"
arantiga_chaos.014.d:0 "К сожалению, вингбардийцы не желают нашего возвращения в Карфинский Пакт. Остаётся лишь надеяться, что они не попытаются напасть на нас в будущем..."
arantiga_chaos.014.a:0 "Жаль."
arantiga_chaos.016.t:0 "Республика нас отвергает"
arantiga_chaos.016.d:0 "Республиканцы не хотят сражаться вместе с нами. Видимо, они думают, что смогут в одиночку победить монархов Грифонии!"
arantiga_chaos.016.a:0 "Дураки."
#1.1#
arantiga_chaos.002.t:0 "Битва за Спарлето"
arantiga_chaos.002.d:0 "После исчезновения Доротеоса, в искажённом виде повторились события, произошедшие после смерти Арантигоса Великого: высокопоставленные офицеры развязали борьбу за власть. Никатор быстро захватил столицу и провозгласил себя регентом, подняв восстания небольших групп его сторонников по всей стране. Однако основная часть армии Арантиги последовала за Лисимахом – самым преданным из военачальников покойного барона. Разгневанный известием о том, что Никатор объявил себя регентом, он приказал своим войскам выступить на Спарлето.\n\nНикатор понимал, что отступать ему некуда, и что его победа или поражение определят будущее Арантиги. Все здоровые грифоны города были призваны в армию. Снаряжения не хватало – тем, кто не получил ружья, было приказано рыть окопы и строить баррикады. Затем наступил роковой день. Армия Лисимаха пошла на город штурмом, надеясь сломить боевой дух его защитников..."
arantiga_chaos.002.a:0 "...но защитники выдержали натиск!"
arantiga_chaos.002.b:0 "...и оборона Никатора пала!"
arantiga_chaos.021.d:0 "Однако после первого натиска солдат Лисимаха оттеснили на окраины города. После двух дней кровопролитных городских боёв существенного прогресса достигнуто не было, и нападавшие затихли, чтобы пересмотреть свои планы. Наконец, на улицах Спарлето наступило спокойствие... Пока оглушительный визг не нарушил тишину: по счастливой случайности, бесцельный артиллерийский снаряд угодил прямо в передовую командную позицию, убив Лисимаха и его самых верных офицеров...\n\nС гибелью полководца нападавшие пришли в замешательство. Новобранцы воспользовались этой возможностью, чтобы бежать, а большинство оставшихся командиров присягнуло новому регенту. Таким образом, Никатор разгромил крупнейшую группу мятежных армий..."
arantiga_chaos.021.t:0 "Один удачный выстрел"
arantiga_chaos.021.a:0 "Война еще не выиграна!"
arantiga_chaos.022.t:0 "Предательская смерть"
arantiga_chaos.022.d:0 "Войска Лисимаха поспешили нанести удар по Спарлето – их полководец понимал, что длительная осада побудит войска перейти на сторону Никатора. Поначалу непоколебимая оборона быстро сменилась отчаянным сопротивлением, после того как нападавшие прорвались через укреплённые предместья. Вскоре они вошли в город. Кровопролитные бои продолжались почти два дня. Нападавшие захватывали один дом за другим, пока наконец не добрались до старой резиденции барона, где размещался штаб Никатора. Когда стало очевидно, что положение безнадёжно и отступать некуда, Никатор приставил пистолет к виску и спустил курок – вскоре остатки его армии сдались. Со смертью Никатора Лисимах получил шаткий контроль над столицей, и многие мелкие командиры присягнули ему на верность..."
arantiga_chaos.022.a:0 "Одним изменником меньше."
arantiga_chaos.023.t:0 "Великое сожжение"
arantiga_chaos.023.d:0 "По всей Арантиге легионеры и полицейские грифоны штурмовали школы, библиотеки и даже дома. Их целями были книги – все сочтённые "еретическими" и "подрывными". Политические манифесты, всевозможная иностранная или неарантийская религиозная литература и многие другие "легкомысленные" сочинения были свалены в кучи и подожжены – за ними последовали и все остальные "опасные" легковоспламеняющиеся предметы. Тех, кто пытался противостоять солдатам, жестоко избивали, а в крайних случаях вешали, расстреливали или даже бросали в горящие кучи бумаги. В городах новой империи горели библиотеки. Обезумевшие последователи Лисимаха разоряли Музеи, церкви и все другие культурные объекты. И через несколько дней, когда все древние памятники пали и костры погасли, жизнь началась заново. Жизнь, в которой была только одна истина – та, которую проповедовало государство, – та, что восхваляла Бессмертного Императора и осуждала всех, кто выступал против его регента, как заклятых врагов."
arantiga_chaos.023.a:0 "Жги! Жги! Жги!"
arantiga_chaos.024.t:0 "Пророк Арантигоса"
arantiga_chaos.024.d:0 "День гибели Арантигоса II был худшим днём в жизни Лисимаха – грифон, которому он поклялся следовать до конца, царь, олицетворявший последнюю, лучшую надежду на восстановление величия Арантиги, был мёртв. И, как в былые времена, когда умер Арантигос Великий, стервятники слетелись, чтобы разорвать его королевство на части. Казалось, всё потеряно. Солнце зашло над Арантигой. В последующие дни Лисимах впадал в разрушительную ярость, заканчивающуюся тихими рыданиями. И вместе с тем ему предстояло так много сделать – ведь он был единственным, кто мог руководить Арантигой. Столько проблем нужно было решить, столько проектов нужно было контролировать. Его слуги и адъютанты быстро научились избегать Лисимаха, чтобы не попасть под удар. Порой, когда гнев утихал, а печаль уходила, его можно было увидеть сидящим в кресле, бездумно уставившимся в стену. Он победил мятежников, затем презренных южан... Что же ему теперь делать? Однажды, когда после многих часов работы он наконец уснул, свернувшись калачиком на стуле, ему приснился сон...\n\nОн стоял один, окружённый тенями, в причудливом, тёмном лабиринте каменных коридоров. Долго он блуждал по нему, пытаясь найти выход, но безуспешно. Он никого не видел в темноте, но чувствовал что-то... Тлеющее присутствие, скрывающееся где-то в тенях. Каждый раз, когда он пытался сосредоточиться на нём, оно исчезало, чтобы затем снова появиться. Казалось, прошла целая вечность, но наконец он нашёл нечто иное, чем бесконечные туннели, – большой, похожий на дворец, зал, полный статуй королей прошлого. Все они стояли на коленях, склонив головы перед статуей Доротеоса Фезерина – Второго Арантигоса – восседающего на троне. Эта статуя казалась почти живой... Внезапно изумлённого Лисимаха поразил луч яркого света, столь мощного и величественного, что он закрыл глаза и пал на колени. Откуда-то раздался голос:\n\n"Встань! Встань и служи мне как прежде! Ты будешь первым среди тех, кто покорит неверных и создаст священное царство Арантигоса в мире смертных!"\n\nЛисимах проснулся в холодном поту, но разум его был ясен, ведь истина открылась ему. Теперь был лишь один бог, достойный поклонения – Арантигос, слившийся с Бореем, Бессмертный Император грифонов. И он, Лисимах, был его глашатаем, его верховным жрецом, которому было поручено распространять его слово в мире смертных."
arantiga_chaos.024.a:0 "Взошло новое солнце!"
arantiga_chaos.025.t:0 "Великий храм"
arantiga_chaos.025.d:0 ""Строительство Великого Храма потребует много времени и ресурсов. Высотой в триста метров он станет одним из самых высоких сооружений в мире, не превосходя по высоте только Дворец Советов и Великую башню королевы, однако значительно объёмнее обоих зданий. Его гигантский купол будет достаточно большим, чтобы внутри него могли формироваться небольшие облака, и тысячи грифонов смогут присутствовать на церемониях. Конечно, чтобы освободить место для такого сооружения, придётся разрушить значительную часть исторических районов Карфина... Незначительная утрата. Отвратительная вингбардийская архитектура центральной части города будет заменена арантийскими зданиями, которые продемонстрируют превосходство нашей нации над иностранными еретиками. Новые широкие улицы идеально подойдут для военных парадов, а новые районы смогут вместить огромное количество новых, переселённых граждан и позволят легко контролировать их.""
arantiga_chaos.025.a:0 ""Начинаем!""
arantiga_chaos.026.t:0 "Арантийские зверства"
arantiga_chaos.026.d:0 "Вскоре после того, как Лисимах, регент Арантиги, завоевал Вингбардию и другие южные грифоньи государства, он начал вводить всё более деспотичную и жестокую политику. При нём Арантига превратилась в сущий ад, затмевающий даже ужасы правления "Безумного короля" Доротеоса. Возможно, самым худшим проявлением безумия Лисимаха стало изгнание всех пони, живших в Южной Грифонии. Лишённые имущества и сосланные, толпы испуганных беженцев устремились в Новый Мейрленд. Масштабы этого зверства настолько ужасны, что мы едва ли можем обеспечить их едой, лекарствами и кровом. Однако наш долг — помочь нашим угнетённым братьям и сёстрам... Но это не конец. Ещё более печальная новость заключается в том, что у нас есть основания подозревать, что следующей целью Лисимаха станет завоевание самого Нового Мейрленда! Мы должны готовиться проявить всё наше мужество."
arantiga_chaos.026.a:0 "Лисимах зашел слишком далеко!"
arantiga_chaos.027.t:0 "Арантийские изгнанники"
arantiga_chaos.027.d:0 "Новый правитель Арантиги, Лисимах, продолжает угнетать недавно покорённые народы. Он решил изгнать всех, кого считает потенциальной угрозой своему извращённому видению Арантиги. Множество бедных грифонов оказались в изгнании. Несколько групп прибыли сюда и, не имея другого выхода, решили поселиться в нашей стране."
arantiga_chaos.027.a:0 "Настораживает..."
arantiga_chaos.028.t:0 "Судьба Гровера"
arantiga_chaos.028.d:0 "Самым необычным из наших "военных трофеев", полученных при завоевании Имперской столицы, стал сам юный император, Гровер VI. Его пленение принесло больше проблем, чем пользы. Пока Гровер остаётся в Грифонии, монархисты будут собираться вокруг него и пытаться подорвать нашу власть. Изгнание его в Эквус значительно затруднит им подрывную деятельность, но не гарантирует нашей безопасности от возможного реакционного восстания. Однако, возможно, существует более эффективное решение. Недавно опустошённый войной Герцланд – небезопасное место. Несчастные случаи происходят постоянно... Мы могли бы приказать молодому императору переехать в отдалённую резиденцию... до которой он никогда не доберётся. На военный конвой, сопровождающий его, произойдёт нападение вооружённых монархистов, (наших самых преданных агентов под прикрытием). Бедный Гровер случайно погибнет в последующем бою – от рук его собственных "верных слуг". Какой позор! Конечно, от убийц потом придётся тихонько избавиться, чтобы никто не узнал о нашем участии. Многие, вероятно, выдумают версии о том, что произошло на самом деле, но никаких весомых улик против нас не будет."
arantiga_chaos.028.a:0 "Я не стану убивать ребенка! Просто изгоните его."
arantiga_chaos.028.b:0 "Это дело нельзя оставить незаконченным."
arantiga_chaos.029.t:0 "Назад в Бездну"
arantiga_chaos.029.d:0 "На протяжении десятилетий многие спускались в Бездонную Бездну, чтобы попытаться вернуть Идола, и последним из них был Доротеос. Немногие счастливчики повернули обратно в самом начале своего спуска в эту, казалось бы, смертельную ловушку, и выжили, большинство, однако, погибло. Но теперь предпринимались усилия, более масштабные, чем когда-либо прежде. Десятки опытных альпинистов, часто после угроз и пыток, отважились спуститься в глубины Бездны. Их задача: найти Доротеоса, или то, что от него осталось. Если они потерпят неудачу, их ждала бы верная смерть от когтей солдат Лисимаха. И так неделями они пытались — и один за другим погибали. Некоторые — от рассыпающихся под их когтями камней, другие — от внезапных порывов ветра. Неизвестными остались истории тех, кто добрался до дна — из глубин бездны не вернулся никто. И всё же Лисимах посылал волну за волной грифонов, отчаянно цепляясь за надежду, что Арантигос, избранник самого Борея, не мог просто так погибнуть. Он лично руководил всей операцией – и со временем проводил всё больше времени на краю Бездны, глядя в неё, словно загипнотизированный. Его адъютанты быстро поняли, что беспокоить его в такие моменты – очень плохая идея. Это часто заканчивалось приступами ярости – и, как-то раз, казнью несчастного лейтенанта на месте. В конце концов, Лисимах был вынужден признать, что его усилия ни к чему не приведут. Пока выжившие горняки разбирали свой лагерь, полководец молча стоял у края, размышляя. Неужели его монарх действительно погиб? Что тогда? Кто приведёт Арантигу к величию? Ни один грифон не достоин этого. А что если... Быть может, именно Лисимах должен завершить начатое Доротеосом – воплотить в реальность его мечту о великой и чистой Арантиге? Да, он это сделает..."
arantiga_chaos.029.a:0 "...или умрет пытаясь."
arantiga_chaos.030.t:0 "Все идет по плану"
arantiga_chaos.030.d:0 "Быть лидером оказалось гораздо более изнурительным и трудоёмким делом, чем Сотер изначально предполагал. Наслаждаться плодами победы не было времени: нужно было держать надзор за подчиненными подчинёнными и сговариваться с коллегами против врагов внутри партии. Однако, он не жаловался. Чувство абсолютной власти было... опьяняющим. Он всегда жаждал этого – и наконец добился. Вырвавшись вперед конкурентов не крича громче всех, а перехитрив их. Теперь же, вечером, когда все неотложные дела были решены, он мог насладиться минутой покоя и поразмыслить о прошлом. Сразу после смерти Доротеоса достаточно было подождать, пока Никатор убьёт Лисимаха, затем ещё немного подождать, пока этот, казалось бы, безнадёжный идеалист откажется от власти – и вот Сотеру представилась прекрасная возможность захватить её. Теперь, после завоевания Герцланда, он был больше, чем президентом: национальным символом, героем, положившим конец вековым унижениям, принёсшим Герцланду "свободу", избавившим его от знати и алчных олигархов – то есть, устранил всех, кто мог ему противостоять. Сотни его неистовых сторонников окружили парламент, и депутаты почти единогласно проголосовали за назначение Сотера пожизненным президентом, (на самом деле толпу собрали только для вида – большинство парламентариев были заранее подкуплены). Конечно, это не давало Сотеру абсолютной власти как таковой. Но, поскольку парламент был скорее инструментом манипулирования общественным мнением, чем полноценным институтом власти, на практике он был всесилен.\n\nСотер хихикнул. Всё шло именно так, как он задумал в тот самый день, когда Никатор раскрыл ему, что готовит переворот. План сработал, но настоящим победителем оказался Сотер – и, приложив некоторые усилия, он войдет в историю как истинный герой революции. В конце концов, гораздо лучше, чтобы народ тебя уважал, чем просто боялся. Будущее казалось светлым, и именно ему предстояло его строить."
arantiga_chaos.030.a:0 ""Мне так нравится вкус победы...""
arantiga_chaos.031.t:0 "Возмездие"
arantiga_chaos.031.d:0 "В то время как в большинстве регионов нашего государства решение о принудительном использовании спарлейского языка вызвало бунты, полный беспорядок в администрациях и школах, а также всеобщее недовольство грифонов, ситуация в Сикамеоне оказалась гораздо хуже. Когда в большинстве других мест беспорядки уже были подавлены, города Сикамеона всё ещё были охвачены хаосом. Полицию быстро подавили разъярённые толпы. Только с прибытием армейских подразделений протестующие рассеялись. Однако это только ухудшило ситуацию: сикамеонцы начали открытую партизанскую войну против нас. Тысячи грифонов взялись за оружие и, пользуясь обширными лесами и высокими горами своей родины, начали устраивать засады на наши войска. Пока мы не направим туда больше солдат и техники, юго-восток страны будет оставаться зоной боевых действий, и наш контроль над этой территорией будет с каждым днём становиться всё более ограниченным."
arantiga_chaos.031.a:0 "Предатели! Все они предатели!"
arantiga_chaos.032.t:0 "Земля свободы"
arantiga_chaos.032.d:0 ""...Двадцать погибших в Мидории, три танка потеряны, ещё два подбиты на Алых островах..." — молодой офицер докладывал уже почти час. Чем длиннее становился список, тем сильнее Лисимах сжимал клюв. Остальные члены Генерального штаба, присутствовавшие на совещании, пытались сделать вид, что их здесь нет — было ясно, что надвигается взрыв гнева, и они не хотели стать его жертвами.\n\n"ИДИОТЫ! БЕСПОМОЩНЫЕ ТВАРИ!" — вдруг закричал Лисимах — "Как вы до сих пор не разобрались с этими мятежниками?! Это всего лишь кучка крестьян со старыми ружьями и заострёнными палками — а вы командуете лучшей армией в мире! Вы – позор Легионов! ВСЕ ВЫ!" Лисимах остановился перевести дух.\n\n"Но, регент, сэр..." — заговорил грифон в форме полковника, по-видимому, самый храбрый из всех офицеров в зале — "Мы не были готовы сражаться в джунглях, партизаны пользуются поддержкой местного населения, и..."\n\n"Это всего лишь отговорки!" Лисимах поднялся со стула. "Мне нужны результаты, а не ОТГОВОРКИ! Если мешают джунгли, сожгите их! Если местные жители продолжат поддерживать мятежников, убейте их. Арантигос разберётся, кто из них виновен! С меня хватит этой пародии на войну, я хочу их смерти! Вы лично отправитесь туда и прикажете войскам убивать любого, кто покажется подозрительным, сжигать каждую деревню, которая может поддерживать партизан, и казнить всех протестующих на месте. ЯСНО?""
arantiga_chaos.032.a:0 "Да, мой регент!"
arantiga_chaos.033.t:0 "Погребальный костёр"
arantiga_chaos.033.d:0 "Огонь... огонь очищает всё. И вот они разожгли огонь. Днями, неделями, артиллерией, огнемётами и бомбами, армия Арантиги жгла обширные джунгли Сикамеона. Пожары были видны за много миль, земля была покрыта толстым слоем чёрного пепла. Тропические леса горели вместе со всеми обитателями – животными, грифонами. Даже закалённых в боях солдат Арантиги мутило от запаха горелой плоти. Они прервали бесчисленные жизни. Во многих местах огонь вышел из-под контроля, пожирая не только джунгли, но и окрестные деревни и города. Наконец, казалось, сама Сикея сжалилась над своей измученной землей – и начались проливные дожди. Хотя они и потушили бушующее пламя, вся накопившаяся вода превратилась в огромный, разрушительный потоп.\n\nПока все деревни Сикамеона боролись с наводнением, высшее командование Арантиги решило продолжить борьбу с партизанами, лишив их продовольствия и крова. Посевы на незатопленных полях были уничтожены, все крестьяне, заподозренные в поддержке мятежников, были казнены. Тех, кто не смог доказать свою лояльность правительству, изгнали из домов и конфисковали имущество.\n\nЗа месяцы войны тысячи существ услышали громкий стук кулаков и прикладов винтовок в двери своих домов. Повстанцев, их снабженцев, интеллигенцию, жрецов Сикеи – всех вытаскивали из домов и казнили, а их семьи отправляли в трудовые лагеря. Танки катились по улицам некогда процветающих городов, а легионеры уничтожали то немногое, что осталось от памятников, возведенных за сотни лет истории Сикамеона.\n\nТак, после многих месяцев убийств и разрушений, Сикамеон замолк. Те, кто осмелился противостоять новому правителю были мертвы. Лишь немногие уцелевшие шептали своим близким истории о былой свободе. Возможно, однажды Сикамеон снова увидит свет дня – но пока наступила тёмная ночь, которая продлится долгие годы.
arantiga_chaos.033.a:0 "Vae Victis."
arantiga_chaos.034.t:0 "Изгнанники из Сикамеона"
arantiga_chaos.034.d:0 "После жестокого завоевания нашего братского народа Сикамеона, безумный правитель Арантиги, полководец Лисимах, начал свою геноцидную кампанию по "зачистке" Арантиги, что означает избавление, так или иначе, от всех не-грифонов. Восточный Сикамеон был домом для небольшой, но активной популяции минотавров, которые были вынуждены покинуть свои дома и отправиться на наши родные острова. Хотя, учитывая масштабы зверств, совершенных против грифонов Сикамеона, нашим братьев можно считать счастливчиками. Хоть им и удалось спастись, для всего Астериона это всё равно чёрный день."
arantiga_chaos.034.a:0 "Очередные жертвы Арантиги."
arantiga_chaos.035.t:0 "Наказание грешников"
arantiga_chaos.035.d:0 "“Нет существа порочнее пони. Только грифон, венец творения и возлюбленное дитя богов, способен по-настоящему принять свет Арантигоса и достичь истинного величия, следуя его примеру. Остальные — лишь жалкие создания, завидующие и ненавидящие нас. Но самые отвратительные из них — пони. Их души осквернены так называемой "гармонией", и даже если они утверждают, что приняли истину, они или их потомки когда-нибудь вернутся к порочным путям своих предков. Они осмелились заявить, что их принцессы поднимают солнце и луну, что они равны Борею, самому Арантигосу! Таким тварям нельзя позволять осквернять наши земли.”\n                    – Книга последних откровений, Лисимах\n\nСлишком долго пони издевались над нами! Столетия назад слабый герцог Талузы продал земли, известные сегодня как "Новый Мейрленд", эквестрийцам, которые теперь представляют угрозу нашей нации, нашему образу жизни и нашей судьбе. Пока они остаются на материке, нам будет напрямую угрожать возможное вторжение, и пони, несомненно, продолжат поддерживать сопротивление на наших землях. Мы дадим им один шанс сдаться — если они откажутся, мы их сокрушим!"
arantiga_chaos.035.a:0 "Выдвигайте наши требования!"
arantiga_chaos.036.t:0 "Ультиматум Арантиги"
arantiga_chaos.036.d:0 "Мы только что получили сообщение от "Регента" Лисимаха. Этот опасный безумец требует, чтобы мы немедленно уступили ему все наши континентальные владения. Как только мы подчинимся, арантийцы изгонят всех пони с этих земель. В знак "милосердия" Лисимах позволит нам сохранить острова, просто потому, что он "не хочет иметь с нами дело ни минуты дольше, чем необходимо". Наши граждане, хоть и напуганы, но требуют от нас действий по защите родины. Если мы согласимся, то мы потерям значительные земли. Однако армии Арантиги огромны и закалены в боях, и мы можем не выдержать их натиска..."
arantiga_chaos.036.a:0 "Мы будем сражаться!"
arantiga_chaos.036.b:0 "Мы сдаёмся..."
arantiga_chaos.037.t:0 "Новый Мейрленд сдаётся"
arantiga_chaos.037.d:0 "Мы этого не ожидали, но, похоже, пони оказались ещё более жалкими и трусливыми, чем мы думали – Новый Мейрленд сдал все свои континентальные владения, а наша армия перешла границу, чтобы захватить наши законные земли."
arantiga_chaos.037.a:0 "Слава Арантигосу!"
arantiga_chaos.038.t:0 "Новый Мейрленд выбирает войну"
arantiga_chaos.038.d:0 "Мы только что получили ответ из Нового Мейрленда – глупые пони думают, что смогут противостоять мощи легионов Арантиги и отказываются отдать наши законные территории. Теперь остаётся только одно – победить их и вернуть то, что принадлежит нам, в славной войне!"
arantiga_chaos.038.a:0 "Вперёд!"
arantiga_chaos.039.t:0 "Горький мир"
arantiga_chaos.039.d:0 "Последний ультиматум пришёл от Арантиги: разгромив наши войска на континенте, они требуют, чтобы мы сдались и признали их власть над континентальными землями Нового Мейрленда. С разгромом нашей армии у нас мало шансов победить Легионы. У нас нет другого выбора, кроме как согласиться..."
arantiga_chaos.039.a:0 "Мы старались изо всех сил."
arantiga_chaos.040.t:0 "Волны беженцев"
arantiga_chaos.040.d:0 "После завоевания Нового Мейрленда так называемый регент Арантиги, генерал Лисимах, изгнал всю популяцию пони с континентальной части бывшей колонии. В результате сотни тысяч беженцев хлынули на острова, вызвав масштабный гуманитарный кризис. Однако те, кто мог позволить себе путешествие за море, решили вернуться на свою исконную родину, в Эквестрию. Большинство этих пони поселились в наших крупных городах, и, хотя мы смогли предоставить им убежище, наше население возмущено событиями последних месяцев, ужасными действиями арантийцев и нашей неспособностью защитить своих подданных."
arantiga_chaos.040.a:0 "Мы приветствуем наших новых соотечественников."
arantiga_chaos.041.t:0 "Кризис беженцев"
arantiga_chaos.041.d:0 "После завоевания Нового Мейрленда арантийцами, около двух миллионов пони были изгнаны с континента. Многие смогли взять с собой только одежду. Большинство этих пони были отправлены на острова Новый Альбион и Кросс... их население почти удвоилась. В результате, мы столкнулись с гуманитарным кризисом невиданных ранее масштабов. Десятки тысяч пони остались без крова, еды и лекарств. Хотя некоторые из наиболее обеспеченных беженцев покидают страну, большинство не в состоянии на это. Нам потребуется много месяцев, чтобы полностью разрешить этот кризис..."
arantiga_chaos.041.a:0 "Катастрофа!"
arantiga_chaos.042.t:0 "Прощай, Новый Мейрленд..."
arantiga_chaos.042.d:0 "В порту Сансет кипела жизнь – возможно, в последний раз. С отъездом пони он стал лишь одним из многих городов Арантийской Империи, которую мало заботил туризм и торговля. Тысячи, десятки тысяч пони грузились на корабли. Буквально каждое судно в Новом Мейрленде было конфисковано для, вероятно, одной из крупнейших миграций в истории мира. Большинство беженцев смирилось со своей судьбой: им придётся оставить дома, большую часть имущества и всю свою жизнь позади, чтобы начать всё сначала. Арантийцы позволяли им брать с собой лишь немного багажа, и многие с трудом выбрали, что именно они хотели бы сохранить. Пони останавливались перед посадкой на корабли, зная, что это последний раз, когда их копыта коснутся этой земли. Многие плакали, кто-то попытался убежать обратно в город – но их остановили попутчики. Солдаты, руководившие перевозкой, без колебаний избили бы до смерти любого, кто не подчинился приказам.\n\nНад городом поднимались столбы густого дыма – некоторые пони подожгли свои дома назло захватчикам, прежде чем уйти. Время от времени раздавались выстрелы – солдаты разбирались с бандитами и мародёрами, которые воспользовались уникальной возможностью разбогатеть.\n\nДжет Сет тяжело вздохнул, сидя на пристани. Быть свидетелем всего этого и последним покинуть Сансет – такого было его наказание за неспособность защитить Новый Мейрленд. Он так любил это место и делал всё возможное, чтобы улучшить его. Но он потерпел неудачу – и теперь всем пони придётся расплачиваться за его ошибки. Возможно, если бы он поступил иначе, всего этого бы не случилось – но время не вернётся вспять. Ему ничего не оставалось..."
arantiga_chaos.042.a:0 "...кроме как ждать последний корабль."

##### GOVERNING EMPIRE EVENTS####
arantiga.050.t:0 "Народы Империи"
arantiga.050.d:0 "Благодаря недавним победам мы получили контроль над значительной частью Грифонии. Когда Доротеос был коронован, арантийцы уже были меньшинством в нашей стране, а теперь нас многократно превосходят численностью представители всех покоренных нами народов. Мы не можем контролировать всех этих грифонов, используя только наших верных граждан-арантийцев. Если мы хотим сохранить наш режим, нам придется делегировать власть местным жителям.\nВероятно, самым безопасным выбором было бы опереться на вингбардийцев и других южан как на новую доминирующую группу Арантийской Империи – большинство из них поддерживают Арантигоса, их нового правителя. Фактически, несмотря на наши попытки возродить старую спарлейскую культуру, арантийцы остались очень похожими на вингбардийцев. Другой вариант – поддержать крупнейшие этнические группы: аквелийцев, герцландцев и вингбардийцев, позволив им ассимилировать меньшинства. С другой стороны, мы можем принять законы, защищающие свободу всех национальностей в пределах нашей империи, надеясь завоевать их симпатии к нашему делу ценой централизации и целостности правительства."
arantiga.050.a:0 "Доверять можно только южанам."
arantiga.050.b:0 "Поддержим три основные группы."
arantiga.050.c:0 "Равенство под властью Императора!"
arantiga.051.t:0 "Выбор нашей столицы"
arantiga.051.d:0 "Веками Спарлето был резиденцией династии Фезерин. Этот древний город имеет долгую и славную историю. Однако наша империи разрослась, а вместе с ней выросли и потребности её правительства. Спарлето слишком мал – он больше не может вместить все необходимые государственные учреждения и офисы. Кроме того, его довольно провинциальный характер явно не соответствует новому статусу имперской столицы. Чтобы лучше управлять нашей империей, было бы разумно выбрать в качестве столицы более крупный город с более выгодным стратегическим расположением. Лучшим кандидатом является Карфин – бывшая столица Вингбардии, которой было бы легко управлять, поскольку её население не враждебно к нам. Некоторые, однако, полагают, что Грифенхейм, резиденция Гроверов, лучше всего соответствовал бы великолепию Арантигоса и, благодаря своему расположению в центре Грифонии, облегчил бы управление нашей империей. Но есть и третий вариант: вместо переезда мы могли бы... улучшить Спарлето до состояния, достойного нашего Императора, начав амбициозную программу по превращению города в настоящий мегаполис. Стоимость такого предприятия будет весьма значительной, и нам придётся снести и перестроить множество исторических районов. Однако это может быть наилучшим вариантом, поскольку расположение Спарлето делает его недоступным для врагов и позволяет легко управлять нашими землями."
arantiga.051.a:0 "Давайте двинемся на юг, в Карфин."
arantiga.051.b:0 "Грифенхейм будет лучшим вариантом."
arantiga.051.c:0 "Мы останемся в Спарлето!"
arantiga.052.t:0 "Столица достойная Империи"
arantiga.052.d:0 "Спарлеос и его города-побратимы Понтелена и Альбувирос веками казались захолустьем по сравнению с такими великими городами Грифонии, как Аквила, Карфин и Грифенхейм. Однако с началом новой арантийской эпохи на континенте, они начали расти. Некогда тихие города превратились в ревущие двигатели военной машины Арантиги, окружённые фабриками, производящими разрушительное оружие, казармами для призывников и учебными полигонами для подготовки новых легионов к сражениям на бесчисленных фронтах. Теперь, когда наше господство в Грифонии неоспоримо, пришло время сделать нашу родину сердцем новоиспечённой сверхдержавы и достойной резиденцией Второго Арантигоса.\nБогатства покорённых стран были направлены на грандиозное строительство, в котором участвовали десятки тысяч рабочих – как свободных, так и невольников. Рабочие трудились над воплощением грандиозных проектов, разработанных лучшими архитекторами юга Грифонии. Значительные участки старых городов были снесены, чтобы освободить место для новых районов и, что ещё важнее, памятников, увековечивающих Империю и её основателя. По личному приказу Императора Арантигоса несколько городских достопримечательностей остались нетронутыми, включая знаменитую Академию, которая, как и другие здания на холме, должна была остаться как исторический памятник. Старая вилла баронов Арантиги изначально планировалась к сносу, но Император в последний момент передумал и приказал оставить её, несмотря на его запланированный переезд. Спарлеос значительно разросся, чтобы вместить новую имперскую бюрократию, для которой в разных частях города были построены центральные офисы, окружённые роскошными жилыми кварталами и обширными садами, всех их объединял неоклассический стиль, вдохновлённый архитектурой древней Арантиги и Карфинии. Главное командование Имперских легионов обзавелось целым районом а новые широкие улицы столицы подготовили к будущим парадам вечно победоносной армии.\nСпарлеос разросся и занял несколько холмов, некогда окружавших город. На вершине одного из них встал Императорский дворец, построенный из чистейшего белого мрамора, затмевая старый дворец Гроверов в Грифенхейме. Другой холм был выбран местом расположения храма Арантигоса-Борея, его крыша была украшена золотой черепицей, напоминающей всем о славе Солнечного бога."
arantiga.052.a:0 "Взгляни на мои деяния, о Всемогущий..."
arantiga.053.t:0 "Угроза Арантиги"
arantiga.053.d:0 "Прибыл посланник из недавно образованной "Империи" Арантиги. Их требования просты: мы должны сдаться и принести клятву верности "Императору Арантигосу II". Если мы не подчинимся, нас ждет гнев имперской армии. Что нам делать?"
arantiga.053.a:0 "Мы сдаемся"
arantiga.053.b:0 "К ЧЁРТУ!"
arantiga.054.t:0 "Они сдаются!"
arantiga.054.d:0 "Скайфол сдался перед нашей мощью. Мы можем поступать с ними, как сочтем нужным."
arantiga.054.a:0 "Хорошо."
arantiga.055.t:0 "Неожиданный ответ"
arantiga.055.d:0 "Из Скайфола нам пришла телеграмма следующего содержания:\n\n Главнокомандующему Арантиги\n К ЧЁРТУ!\n от Главнокомандующего Скайфола"
arantiga.055.a:0 "Лисимах, веди танки."
arantiga.066.t:0 "Угроза Арантиги"
arantiga.066.d:0 "Прибыл посланник из недавно образованной "Империи" Арантиги. Их требования просты: мы должны сдаться и принести клятву верности "Императору Арантигосу II". Если мы не подчинимся, нас ждет гнев имперской армии. Что нам делать?"
arantiga.066.a:0 "Мы сдаемся."
arantiga.066.b:0 "Пусть приходят."
arantiga.067.t:0 "Они сдаются!"
arantiga.067.d:0 "В результате неожиданного поворота событий фезерское правительство согласилось на наши требования."
arantiga.067.a:0 "Неожиданный ответ"
arantiga.068.t:0 "Ответ Фезеры"
arantiga.068.d:0 "Сегодня мы получили письмо от фезерского правительства. В нём довольно пространно описывалось, как и где Император может себя поиметь. Курьер уже казнён"
arantiga.068.a:0 "Наглые ублюдки!"
arantiga.056.t:0 "Северные племена"
arantiga.056.d:0 "В северной тундре с незапамятных времён живут племена пони. Веками они мало интересовались делами цивилизованного мира, и даже Гроверов настолько не заботили эти промёрзшие земли, что они не стали завоёвывать их. Однако теперь пони оказались в конфликте со скайнавскими коммунистами, вторгшимися на их родину. Когда легионы Арантиги двинулись на север, мы завоевали и Скайнавию, и земли северян. Теперь пришло время разобраться с ними. Поскольку они малонаселены, мы можем просто включить их в состав нашей империи. Однако сейчас мы не можем получить от них никакой прибыли, а приведение их в надлежащее состояние для использования создаст нагрузку на нашу экономику и вызовет недовольство среди местного населения. Возможно, было бы проще создать из них автономный регион..."
arantiga.056.a:0 "Они нам не нужны."
arantiga.056.b:0 "Затянем их в современность."
arantiga.057.t:0 "Богатства Скайфола"
arantiga.057.d:0 "После поражения от когтей великих армий Арантигоса, Скайфол теперь находится под нашим контролем. Если нынешние правящие олигархи пока сохранят власть в городе, население довольно спокойно примет нашу оккупацию, а правящий класс будет лоялен нам. С другой стороны, мы могли бы лишить этих дерзких олигархов их имущества и установить полный контроль над их бывшей собственностью и городом. Это, несомненно, разозлит элиты Скайфола, но они не в состоянии сопротивляться нашим решениям. Потому что, если они попытаются это сделать, то навлекут на себя гнев великого императора Арантиги и имперской армии."
arantiga.057.a:0 "Оставьте олигархов в покое, лучше них нам некого назначить."
arantiga.057.b:0 "Скайфол наш, и мы можем делать всё, что захотим. Нам не нужны олигархи."
arantiga.058.t:0 "Вторжение Арантиги"
arantiga.058.d:0 "Пришли новости крайней важности! Похоже, некий Доротеос Фезерин, возомнивший себя Богом-Императором континента, каким-то образом разгромив Аквилею, Империю и Вингбардию, решил закончить начатое — и теперь флот Арантиги направляется к Хаукленду. Сейчас у нас последний шанс собрать всю собранную добычу и перебраться в какое-нибудь приятное, тёплое место... Может быть, в Макавию?"
arantiga.058.a:0 "Видимо, нам пора на пенсию..."
arantiga.058.b:0 "НЕТ!"
arantiga.059.t:0 "Заброшенный Хаукленд"
arantiga.059.d:0 "По мере приближения к Хаукленду наши войска начали подозревать неладное: пираты не предприняли ни одной попытки нападения. Когда высадилась первая группа солдат, они ожидали засады. Однако на островах не нашлось ни одного корабля – по-видимому, большинство пиратов либо покинули эти места, либо спрятались от нас. Когда местных жителей допросили, правда открылась: безумный граф и его самые верные сторонники собрали все сокровища, какие только смогли, и отплыли в одно из пиратских убежищ. Остатки его разношёрстной "армии" бежали сами собой. Они больше не наша проблема."
arantiga.059.a:0 "Это было неожиданно!"
arantiga.060.t:0 "Хаукленд будет сражаться!"
arantiga.060.d:0 "Хаукленд решил отказаться от нашего предложения и погибнуть в бою, вместо того чтобы просто уступить нам свою землю. Какие же скоты!"
arantiga.060.a:0 "Значит, война."
arantiga.061.t:0 "Рыцари Востока"
arantiga.061.d:0 "Когда Гровер II начал свой обречённый на провал крестовый поход против восточных пони, он основал несколько рыцарских орденов. После его смерти они зарекомендовали себя как защитники Востока, даже порой создавая собственные государства, такие как Хеллквилл и Лонгсворд. В то время как в западной Грифонии эпоха рыцарства закончилась с началом индустриальной эпохи, в менее развитых землях Востока эти традиции продолжали жить, а в некоторых случаях исказились до невообразимости. Теперь Хеллквилл, Лонгсворд и долина Эви являются частью нашей Империи, и будущее рыцарских орденов неопределено. У них есть два варианта: либо мы позволим им существовать под нашим руководством, объединив их с нашими рыцарями, либо ордена будут расформированы, а их солдаты пойдут на службу в нашу регулярную армию в качестве офицеров."
arantiga.061.a:0 "Наши рыцари будут сражаться вместе!"
arantiga.061.b:0 "Их время подошло к концу."
arantiga.062.t:0 "Торговая компания"
arantiga.062.d:0 "Компания Южного Континента была учреждена императорской хартией, дарованной Гровером III, которая давала ей право торговать в морях близ Грифуса. Хотя с распадом Империи Грифонов эта хартия перестала чем-либо отличаться от обычного листа бумаги, благодаря ранее набранному значительному влиянию, компания сохранила прочные позиции в южных морях. Не будучи столь влиятельной, как банк Фловены или олигархи Скайфола, Торговая компания Грифуса мало интересовала Арантигу. Однако теперь, когда мы контролируем Грифус, пришло время разобраться с ней. Компания всё ещё успешно работает, и мы могли бы оставить её в покое, пока она платит налоги, принося значительные суммы в наш бюджет. Новая конкурентная среда хоть и не позволит им удерживать монополию на восточную торговлю, но они скорее всего останутся доминирующим игроком в регионе, замедляя рост местной экономики, поэтому другим хорошим вариантом была бы национализация их активов."
arantiga.062.a:0 "Пусть работают."
arantiga.062.b:0 "Национализируйте их."
arantiga.063.t:0 "Судьба Астериона"
arantiga.063.d:0 "Теперь мы контролируем архипелаг Астерион – родину минотавров. Веками минотавры сопротивлялись имперскому правлению и наконец обрели свободу в Войне за восстановление 979 года. Быки известны своим упрямством – даже сейчас их партизаны сражаются с нашими оккупационными войсками. Контроль над их островами станет кошмаром. Может пройти много лет, прежде чем наша власть укрепится. Возможно, лучше предоставить минотаврам самоуправление, сделав их автономным регионом нашей Империи, и обеспечить соблюдение прав быков на континенте?"
arantiga.063.a:0 "Никаких сделок с минотаврами!"
arantiga.063.b:0 "Оставьте им их острова."
arantiga.064.t:0 "Имперский кошмар"
arantiga.064.d:0 "После падения Клаудбьюри многие республиканцы пытались бежать или отступить в горы, чтобы продолжить борьбу оттуда. Разведка Арантиги сотрудничала с военными, проводя рейды на горные укрепления, чтобы окончательно искоренить республиканскую угрозу. Однако уничтожение повстанцев не было истинной целью операции – главной задачей был захват самых видных республиканских лидеров, особенно Кемерская. После месяца искусного саботажа разведки и беспощадных атак армии, операция завершилась успешно. Президент-Маршал был публично казнён на следующий день после пленения на главной площади Клаудбьюри. Многим его подчинённым повезло меньше – они погибли во время или после долгих допросов, часто с применением пыток, в ходе которых собиралась информация о республиканских ячейках. В последующие месяцы после операции палачи по всей Империи работали не покладая рук, а трудовые лагеря в очередной раз переполнились от ежедневно прибывающих заключённых."
arantiga.064.a:0 "Так заканчивается их глупая мечта..."
arantiga.065.t:0 "Скайнавия горит"
arantiga.065.d:0 "Мой император, теперь у нас полный контроль над городом Новая Скайнавия".\n\n"Отлично, тогда действуйте по плану".\n\nЛисимах улыбнулся и передал по рации своим солдатам:\n\n"СЛУШАЙТЕ, ЛЕГИОНЕРЫ, ВОТ ВАШ ПРИКАЗ:..."
arantiga.065.a:0 "...СЖЕЧЬ ВСЁ ДОТЛА. НЕ ОСТАВИТЬ НИЧЕГО."
arantiga_govern.012.t:0 "Имперский Парламент"
arantiga_govern.012.d:0 "Республиканство было разгромлено. Так называемый президент-маршал мертв, как и его приспешники. Большинство из тех, кто еще жив, либо бежали из страны, либо скрылись, оставив свои амбиции. Но даже после того, как мы доказали, что "республиканская мечта" – лишь цыплячья фантазия, в нашей империи осталось множество влиятельных прореспубликанских групп, распространяющих пропаганду среди местного населения, которое теперь пугающе часто критикует действия центрального правительства. Править железной лапой какое-то время будет несложно, но по мере того, как воспоминания о победах тухнут, поднимаются волны инакомыслия, что в конечном итоге приведет к революции. Мы можем подавить любое сопротивление и сохранить абсолютную власть нашего Божественного Императора – но будет ли это решение долговечным? Некоторые бизнесгрифы и дворяне предлагают форму политического представительства для различных социальных слоев – Имперский парламент. Мы построим величественное здание, где представители смогут спорить о бессмысленных проблемах... Народ будет слишком занят, наблюдая за их спорами, чтобы восстать против нас. Мы также могли бы использовать депутатов в качестве противовеса местным чиновникам, представляя их посланниками императора, глубоко обеспокоенного благополучием своих подданных, правителем, который внимает мольбам простых грифонов..."
arantiga_govern.012.a:0 "Одна нация, один император!"
arantiga_govern.012.b:0 "Пусть препираются."
arantiga_govern.013.t:0 "Вера и престол"
arantiga_govern.013.d:0 "Грифония – родина множества народов, поклоняющихся разным богам. Конечно, Троица – доминирующая вера, и большинство грифонов так или иначе поклоняются ей. Однако даже в рамках Трёх Храмов церемонии сильно различаются в зависимости от региона. Из-за этого сохранение ортодоксальности было нелёгкой задачей для многих поколений архонтов. Но есть также поклонники второстепенных божеств, таких как Эвилиана или Мудрая Дама, странные культы вроде старообрядцев, друидический пантеон восточных пони, поклоняющихся своим собственным богам и духам, и множество других квазирелигий. Всё это уже сильно усложняет религиозное законотворчество. Но вместе с Арантийской Империей распространились культ Арантигоса-Борея и культ Второго Арантигоса. Взяв под контроль архонства Трёх Храмов, мы обязали их следовать нашей версии веры в Троицу. Это, конечно же, вызвало значительное сопротивление среди традиционалистов и привело к нескольким расколам. К счастью, похоже, большинство грифонов сумели приспособиться к изменениям, и мы надеемся, что Имперский Культ когда-нибудь станет одной из опор крепко держащих Империю. Фанатики предлагают нам способствовать дальнейшему распространению Культа Арантигоса и издать Эдикт Имперского Культа, сделав его не только официальной, но и единственной разрешённой. Это было бы почти безумным решением: миллионы грифонов воспротивились бы ему, не желая отказываться от своих богов. Это ввергло бы страну в период раздоров, серьёзно подорвав стабильность правления Доротеоса в краткосрочной перспективе, но в конечном итоге создав более однородную религиозную среду, что позволило бы лучше контролировать народы Империи и обеспечило бы стабильность в будущем. В противоположность этому, издание Эдикта Терпимости позволило бы последователям религий, не враждебных нашему режиму (за исключением безумных убийц, таких как маариты!), восхвалять своих богов свободно. Сейчас это был бы гораздо более безопасный вариант."
arantiga_govern.013.a:0 "Издать Эдикт Имперского культа."
arantiga_govern.013.b:0 "Издать Эдикт терпимости."
arantiga_govern.014.t:0 "Дворяне Империи"
arantiga_govern.014.d:0 "Они преклоняют колени перед троном, восхваляют правление императора, кланяются ему... но Арантигос видит по их глазам, что они не испытывают к нему ни уважения, ни страха. Дворяне верят, что их кровь даёт им больше прав, чем наследникам династии, правившей шестнадцать веков. Они строят заговоры и интриги в своих особняках, надеясь вернуть себе утраченную власть, перехитрить "выскочку-барона" и вернуть то, что "по праву принадлежит им". Они никогда по-настоящему не приняли и никогда не примут новую реальность. Но их время ушло. Однако они ещё не бессильны – они всё ещё могут представлять угрозу. Возможно, лучше всего избавиться от них – лишить титулов и оставшихся привилегий, чтобы остался только Император и его подданные... Но разве не может быть иначе? Во время войны было много тех, кто проявил себя достойно, кто заслужил быть выше толпы..."
arantiga_govern.014.a:0 "Они не представляют угрозы."
arantiga_govern.014.b:0 "Пора положить этому конец."
arantiga_govern.014.c:0 "Новые времена – новая знать."
arantiga_govern.015.t:0 "Имперская торговая политика"
arantiga_govern.015.d:0 "По мере того, как пыль ложится, Арантийская Империя становится прочно доминирующей сверхдержавой Грифонии. Нашим завоеваниям приходит конец, теперь мы наконец можем перестать концентрироваться на производстве танков и самолётов. По мере того, как военное производство требует меньше ресурсов, гражданская промышленность начинает расширяться. Пираты и бандиты разгромлены, вражеские флоты потоплены – торговцы наконец-то могут безопасно добраться до Грифонии, и международная торговля снова начинает процветать. Мы могли бы извлечь из этого выгоду и открыть наши границы... Однако в этом случае нашей молодой промышленности придётся конкурировать с гораздо более устоявшимися иностранными компаниями. Возможно, было бы лучше ограничить импорт, чтобы наша экономика могла как следует восстановиться после многих лет войны и хаоса?"
arantiga_govern.015.a:0 "Откройте наши границы."
arantiga_govern.015.b:0 "Нам следует быть осторожными..."
arantiga_govern.015.c:0 "Наша экономика должна быть защищена!"
arantiga_govern.016.t:0 "Императорское помилование?"
arantiga_govern.016.d:0 "По мере того, как мы продвигались вперёд, справляться с растущим числом военнопленных становилось всё труднее. Пленные чиновники, дворяне, республиканцы и многие другие нарушители спокойствия заполнили наши трудовые лагеря до отказа. Некоторые из них были призваны в штрафные батальоны и погибли на полях сражений, но огромное количество заключённых всё ещё содержится в различных трудовых лагерях. Поскольку в последнее время их приток уменьшился, наша администрация наконец-то смогла уделить время тому, чтобы как следует проверить, за что мы держим тех, кто выжил. Судя по всему, многие из них работают в трудовых лагерях за самые незначительные преступления, некоторые вообще были осуждены по ошибке, а самые ярые враги государства уже казнены. Возможно, мы могли бы предложить "новое начало" всем, кто не представляет угрозы – конечно, мы можем быть более разборчивыми и освободить только тех, кто точно прошёл надлежащее перевоспитание, и тех, кто пал жертвой чрезмерного усердия..."
arantiga_govern.016.a:0 "Сегодня я милосерден..."
arantiga_govern.016.b:0 "Пусть они гниют в тюрьмах."
arantiga_govern.017.t:0 "Сердца и умы"
arantiga_govern.017.d:0 "Как однажды написал один эквестрийский пони, "перо сильнее меча". Благодаря мощи легионов Арантиги мы завоевали Грифонию, и грифоны вернулись к своей обычной жизни, начали забывать о войне. Теперь мы столкнулись с риском инакомыслия. Мы очистили Империю от большинства смутьянов, но мы не закрытая нация – существа, товары и, что хуже всего, идеи путешествуют сквозь границы. Конечно, мы будем использовать образование и пропаганду, чтобы грифоны оставались верными сторонниками нашего Божественного Императора, однако нам всегда придётся противостоять иностранным республиканским и коммунистическим проповедникам с их средствами массовой информации. Они контрабандой ввозят в нашу страну революционную литературу, такую как эквестрийский "Дневник дружбы" или труды Карамель Маркс по коммунистической теории. Хотя многие из этих книг запрещены к печати, продаже и владению в Империи, мы начинаем сталкиваться с организованными попытками посеять разногласие силами иммигрантов и правительств враждебных нам стран. Поэтому необходимо создать Министерство Информации, которое будет надлежащим образом цензурировать иностранные произведения, решать, что можно публиковать в Империи, и пресекать попытки иностранцев подорвать наш режим. Это не решит проблему полностью, но мы получим некоторую степень контроля. Но есть и другой вариант: мы могли бы реализовать более радикальное решение – ликвидировать все негосударственные СМИ и запретить публикацию всех иностранных произведений, кроме одобренных Министерством."
arantiga_govern.017.a:0 "Цензуры достаточно."
arantiga_govern.017.b:0 "Чистый разум – благословенный разум."
arantiga_govern.018.t:0 "Война или мир?"
arantiga_govern.018.d:0 "Долгие годы Арантига служила лишь поддержанию и совершенствованию своих вооружённых сил. Экономика и судебная система были перестроены специально для того, чтобы Доротеос мог продолжить свои завоевания. По сути, каждый гражданин был солдатом – он либо сражался на фронте, либо работал на него в тылу. Теперь великая цель достигнута – Грифония едина под властью Арантигоса Второго, который уже превзошёл и своего великого предка, и Гроверов. Грифоны заслуживают пользоваться плодами своей победы. Отмена наиболее обременительной политики и демобилизация экономики заслужат императору благодарность его подданных и позволят Арантиге вступить в новый золотой век процветания... Но мы всё ещё окружены множеством враждебных государств, поэтому, оставаясь готовыми к новым возможным конфликтам хотя бы ещё несколько лет, мы обеспечим себе безопасность..."
arantiga_govern.018.a:0 "Всегда нужно быть начеку!"
arantiga_govern.018.b:0 "Наконец-то мы можем отдохнуть..."
arantiga_govern.019.t:0 "Эпилог: Воспоминания"
arantiga_govern.019.d:0 "На холмах Арантиги было множество древних руин. Некоторые из этих сооружений возникли здесь ещё до времён Арантигоса Первого. Хотя беспощадное время и мародеры превратили большинство из них в бесформенные груды щебня, те, что сохранились, были превращены в памятники по приказу Доротеоса. Все, кроме одного, – старого храма Борея посреди огромного леса, который никогда не посещался туристами или археологами. Официально он стоял на территории королевского охотничьего заповедника, доступ к которому был закреплён только за Доротеосом, но он ни разу не бывал здесь. Когда они с Маргарет были детьми, они играли в этом лесу, воображая героев древних сказаний... Это были добрые воспоминания. И этот храм стал бы подходящим местом для вечного упокоения. В старом некрополе, окружающем храм, было одно новое надгробие – на нём не было имени, только герб дома Фезерин. Осмотрев старый храм, Доротеос понял, почему его сестра хотела быть похороненной именно здесь. Здесь было... мирно.\nОдинокий грифон сидел на одном из разрушающихся памятников, слушая пение птиц. Он никогда раньше не посещал могилу Маргарет... но теперь, когда прошли десятилетия, и огонь, некогда пылавший в его душе, начал угасать, ему показалось, что пришло время навестить её.\nЕму приходили воспоминания о детстве, о днях, когда он был счастлив, когда он лишь мечтал о будущем величии, и будущее казалось ему светлым. Он давно перестал быть "юным завоевателем", и теперь чувствовал себя опустошённым... Миллионы боялись его, десятки миллионов поклонялись ему. В каждом городе был хотя бы один памятник Арантигосу Второму, в каждом храме грифоны молились его изображениям. Во всей истории не было более великого завоевателя, и, вероятно, никогда не будет. Грифония жила в мире. Воспоминания о военных зверствах постепенно угасали. Но, когда Доротеос закрывал глаза, он видел горящие города, слышал крики умирающих. Грифоны. Целое поколение арантийцев погибло во имя его амбиций. Погибли его старые товарищи – их заменили подхалимы и современные технократы. Это было его наследие – империя, которую унаследуют его потомки, империя, построенная на смерти и страданиях.\nАрантигос Великий больше не говорил с ним, и с годами Доротеос начал сомневаться. Он боялся смерти. Когда ему придётся предстать перед богами, примут ли они его как своего или сочтут узурпатором? Он бросил последний взгляд на надгробие и вспомнил последние слова сестры: "Оно того стоило?" После всех этих лет..."
arantiga_govern.019.a:0 "...он не мог дать ответа."
arantiga_govern.020.t:0 "Посланник из Арантиги"
arantiga_govern.020.d:0 "К нам внезапно прибыли дипломаты из Арантийской империи. По-видимому, император Доротеос Фезерин, который, вероятно, в ходе самой невероятной серии военных кампаний в истории мира сумел объединить всех грифонов, желает... "Установить официальные отношения между Речными землями и Арантийской Империей, чтобы положить начало новой эпохе мира и процветания для обоих народов". Учитывая его репутацию неуравновешенного безумца, безжалостного завоевателя и варвара, разрушающего города, было разумнее ожидать, что свиньи научатся летать, чем что он предложит нам это! Тем не менее, он действительно это сделал. Многие подозревают, что это часть тщательно продуманного плана вторжения, но что, если это честное предложение о прочном мире?"
arantiga_govern.020.a:0 "Мы принимаем."
arantiga_govern.020.b:0 "Мы отказываемся."
arantiga_govern.021.t:0 "Страна восходящего солнца"
arantiga_govern.021.d:0 "Завоеваниям Арантигоса нет конца. Восточные пони отразили все попытки покорения – даже Гровер II, величайший завоеватель своей династии, не смог победить этих существ. Доротеос был первым грифоном, который одолел их. Когда его легионы двинулись на восток, Озерград, Речкоград и даже гордый город Нимбуси были отняты у пони, и весь континент теперь объединён под властью Арантигоса Второго. Однако время праздновать ещё время не пришло. Восточные пони – упрямый народ, и они не собираются сдаваться так просто. Партизаны-титоисты нападают на наши патрули в сельской местности, а остатки армий речных пони ведут партизанскую войну. Возможно, потребуются годы, прежде чем мы подавим сопротивление и прочно установим свою власть на Востоке. Некоторые бизнесгрифы уже планируют эксплуатировать неиспользованные ресурсы недавно приобретённых восточных земель, но это может обойтись слишком дорого для нас. Вместо того, чтобы постоянно подавлять национализм речных пони и иметь дело с жадными инвесторами, было бы проще предоставить пони автономию в составе Арантийской империи, переложив бремя борьбы со всем этим хаосом на местное правительство."
arantiga_govern.021.a:0 "Со временем мы их сломим."
arantiga_govern.021.b:0 "Слава и так наша, пусть наслаждаются свободой."
arantiga_govern.022.t:0 "Речные пони нас отвергли"
arantiga_govern.022.d:0 "Как и следовало ожидать, речные пони не доверяют нам и отвергают наше предложение о сотрудничестве."
arantiga_govern.022.a:0 "Глупцы..."
arantiga_govern.023.t:0 "Речные пони приняли наше предложение!"
arantiga_govern.023.d:0 "Речные пони приняли наше предложение! Это знаменует собой светлое новое начало в отношениях между грифонами и пони в Грифонии. Арантигос II не только создаст новую империю для всех грифонов путём завоевания, но и обеспечит прочный мир между видами!"
arantiga_govern.023.a:0 "Отлично!"
arantiga_govern.024.t:0 "Надвигающаяся угроза"
arantiga_govern.024.d:0 "Мы только что получили сообщение из так называемой "Арантийской Империи", которая недавно каким-то образом сумела объединить земли грифонов. Её император, Доротеос Фезерин, требует, чтобы мы присоединились к его Империи, и в качестве "акта великодушия" он позволит Нова Грифонии стать автономным регионом в составе его имперских владений. Если мы не подчинимся, он угрожает обрушить на нас мощь своих легионов."
arantiga_govern.024.a:0 "Пусть придёт!"
arantiga_govern.024.b:0 "Мы сдаёмся..."
arantiga_govern.025.t:0 "Западные пони"
arantiga_govern.025.d:0 "Колония Новый Мейрленд была основана в VII веке эквестрийцами. Пользуясь слабостью грифоньих государств, разногласиями между местными жителями и массовой иммиграцией пони, она быстро расширялась, став прочной опорой пони на землях Грифонии. Даже Империя Грифонов не осмелилась бросить вызов принцессе Эквестрии и вернуть себе этот законный кусок грифоньей земли. Однако теперь, когда влияние эквестрийцев ослабло, мы легко завоевали Новый Мейрленд и устранили потенциальную угрозу вторжения пони. Пришло время решить судьбу местных. Самый простой вариант — полная аннексия: есть множество местных грифонов, которые более чем рады избавиться от господства пони и могут помочь нам управлять этой территорией. Но это, вероятно, приведёт к значительной иммиграции пони в другие наши владения и распространению их идеологии гармонии. Чтобы держать их под контролем, мы могли бы создать автономное государство, управляемое местными грифонами, и позволить им обладать некоторой самостоятельностью. Однако некоторые пони из Нового Мейрленда вполне готовы сотрудничать с нами, если мы сохраним их влияние – их представитель, бывший губернатор Джет Сет, обратился к нам с предложением своих услуг..."
arantiga_govern.025.a:0 "Новый Мейрленд принадлежит Империи!"
arantiga_govern.025.b:0 "Пусть этим займутся местные грифоны под надзором Сотера."
arantiga_govern.025.c:0 "Мы поставим верных пони управлять этой землей."
arantiga_govern.026.t:0 "Нова Грифония бросает нам вызов."
arantiga_govern.026.d:0 "Полагаясь на защиту, обеспечиваемую проливом, и свою армию, лидеры Нова Грифонии отказались выполнять наши требования. Должны ли мы покончить с ними раз и навсегда?"
arantiga_govern.026.a:0 "В атаку!"
arantiga_govern.026.b:0 "Оставьте их пока..."
arantiga_govern.027.t:0 "Нова Грифония сдаётся"
arantiga_govern.027.d:0 "Правительство Нова Грифонии направило нам дипломатическую ноту, в которой оно соглашается со всеми нашими условиями. Судя по всему, Легионы Арантиги представляют собой достаточную угрозу, чтобы заставить даже этих негодяев пересмотреть свою позицию!"
arantiga_govern.027.a:0 "Отличные новости!"

###Cast the Die Events###
arantiga.075.t:0 "Арантигос Возрожденный?"
arantiga.075.d:0 "С нами связался новый король Арантиги – Доротеос Фезерин. Потомок самого Арантигоса. Доротеос не так давно захватил власть в результате переворота, а затем начал завоевательную кампанию в Центральной Грифонии. Теперь он провозгласил себя Возрожденным Арантигосом и каким-то образом вернул себе Идола Борея. Возможно, он и есть тот самый завоеватель, тот самый лидер, который поведет нас к возвращению давно утраченной славы? Или, может быть, он просто самозванец, которого мы должны свергнуть без всякой пощады..."
arantiga.075.a:0 "Слава новому Арантигосу!"
arantiga.075.b:0 "Смерть узурпатору!"
arantiga.076.t:0 "Взгляд на Юг"
arantiga.076.d:0 "Фалькор сражается с Вингбардией с незапамятных времён – вскоре после падения Королевства Спарлеос, и вингбардийцы, и фалькорцы вторглись в его государство-преемника, Карфинское Королевство, и разделили его земли... Чтобы продолжать бороться друг с другом за контроль над этими землями, словно стервятники за кости, в течение последующих столетий. Однако не так давно Вингбардия захватили столицу Фалькора и подавила их жажду мести. Мы не любим фалькорцев, но пока у нас есть общий враг, мы можем стать прекрасными союзниками..."
arantiga.076.a:0 "Слава победы будет только нашей."
arantiga.076.b:0 "Нам нужны союзники."
arantiga.078.t:0 "Альянс с Арантигой"
arantiga.078.d:0 "Нам пришло письмо с севера, написанное королём Арантиги Доротеосом Фезерином. Недавно он захватил власть над своим народом, убив свою сестру-баронессу, а затем приступил к завоеванию многих соседних стран, создав собственные владения в Центральной Грифонии. Король Доротеос предлагает союз между нашими народами, обещая нам славу и шанс отвоевать наши законные земли из лап Вингбардии. Армия Арантиги, без сомнения, могущественная сила, и с её поддержкой мы могли бы более чем соперничать с Вингбардией, но Доротеос может оказаться ненадёжным союзником: он уже предал прошлого правителя Арантиги, свою сестру, и его здравомыслие вызывает сомнения – недавно он провозгласил себя реинкарнацией Арантигоса. Поистине, это может быть настоящей сделкой с Мааром..."
arantiga.078.a:0 "Вежливо откажем."
arantiga.078.b:0 "Нам нужны союзники..."
arantiga.079.t:0 "Фалькор отказывается"
arantiga.079.d:0 "Мы только что получили ответ от Фалькора – они отказались присоединиться к нашему делу."
arantiga.079.a:0 "Они подписали себе смертный приговор."
arantiga.080.t:0 "Судьба Фалькора"
arantiga.080.d:0 "Гордого королевства Вингбардия больше нет. Легионы Арантиги двинулись прямо на Карфин и разгромили этих выскочек. Теперь, когда мы вернули себе законные земли, пора решить, что делать с фалькорцами. Мы сражались с ними бок о бок, но их земли также были частью Королевства Спарлеос и, следовательно, должны принадлежать нам."
arantiga.080.a:0 "Мы будем чтить наш союз."
arantiga.080.b:0 "Потребуем их присягнуть нам."
arantiga.080.c:0 "Пора покончить с этими глупцами!"
arantiga.081.t:0 "Требования Арантиги"
arantiga.081.d:0 "Что ж... Некоторые советники предсказывали такой исход с тех пор, как мы подписали союз. Мы получили требования от Доротеоса: Фалькору будет позволено существовать лишь как вассалу его "славной возрожденной Империи". Именно так он это и сформулировал. Нам не следовало доверять ему. Теперь мы одни, и поскольку Вингбардия разрушена, никто не сможет нам помочь..."
arantiga.081.a:0 "Мы должны принять свою судьбу..."
arantiga.081.b:0 "Мы будем сражаться до смерти!"
arantiga.082.t:0 "Фалькор выбирает войну"
arantiga.082.d:0 "Похоже, эти глупые фалькорцы думают, что смогут противостоять легионам Арантиги... Пора показать им, как сильно они ошибаются."
arantiga.082.a:0 "Вперёд!"
arantiga.083.t:0 "Предательство"
arantiga.083.d:0 "Мы только что получили известие о подозрительной переброске войск Арантиги. По всей видимости, они приближаются к нашей границе. Когда мы отправили наших чиновников в их посольство, чтобы узнать о смысле этого внезапного передвижения, посольство оказалось пустым — их дипломаты сбежали за несколько часов до этого! Очевидно, что "Арантигос" решил избавиться от нас. Мы должны подготовиться к войне и сделать это быстро!"
arantiga.083.a:0 "Надвигается буря..."
arantiga.084.t:0 "Старые враги"
arantiga.084.d:0 "После падения Карфина нам пришлось иметь дело с большим количеством военнопленных, среди которых было много бывших членов высшего командования Вингбардии. Один из этих генералов, Джованни Гессе, неожиданно попросил о встрече с Доротеосом. Король встречался с Гессе несколько лет назад во время совместных манёвров Карфинского пакта и был весьма впечатлён его мастерством. В течение короткого времени они обменивались письмами, обсуждая вопросы военной стратегии. Гессе заявил, что готов присягнуть на верность Арантигосу и признать его новым правителем Вингбардии. На самом деле, многие грифоны были бы готовы работать на нас, и Гессе может отобрать талантливых офицеров, которых можно убедить присоединиться к делу Арантиги. Наверняка многие рядовые солдаты будут готовы покинуть трудовые лагеря, чтобы сражаться за своего нового правителя. По мере того, как мы завоёвываем всё больше земель, нам придётся полагаться на вспомогательные силы, набранные за пределами нашей родины. Но сейчас многие офицеры против идеи позволить бывшему вингбардийскому генералу сражаться за нас и сомневаются в том, можно ли ему доверять – принятие его предложения создаст напряжение в отношениях с нашими военными..."
arantiga.084.a:0 "Отправить его обратно в лагерь."
arantiga.084.b:0 "Мы принимаем это предложение."
arantiga.085.t:0 "Встреча"
arantiga.085.d:0 "Войдя в кабинет Доротеоса, Николас почувствовал облегчение. Его скромный вид резко контрастировал с помпезным убранством дворца. По сути, единственным, что напоминало о высоком статусе его владельца, был большой мраморный бюст Арантигоса Великого. Его потомок сидел за внушительным столом из резного дерева. Рядом стояли двое стражников, следивших за каждым шагом Николаса, готовые убить его, если он начнет угрожать их правителю. \n\n"Николас де Шарбон, мы так понимаем?" — спросил Доротеос и, не дожидаясь ответа, добавил – "Ты был в списке фловенцев, подлежащих аресту и заключению в тюрьмы строгого режима как потенциально опасный член старого правительства. Мы были удивлены, когда ты добровольно сдался и попросил аудиенции. Так... почему?"\n\n"Стало очевидно, что рано или поздно мне придется выбирать между отъездом из Грифонии и пленом. Ни то, ни другое меня не устраивает. У меня было время переосмыслить прошлые события, рассмотреть недавние военные кампании Арантиги, и я понял, что победа Вашей Милости неизбежна".\n\nАрантигос слегка улыбнулся, но его поведение оставалось холодным. Что-то было не так с его глазами... Они напомнили Николасу тех безумных епископов, которые проповедовали свои толкования священных текстов, веря каждому слову – это были глаза фанатика, всецело преданного своему делу.\n\n "Продолжай" – сказал самый опасный грифон на континенте.\n\n "Очевидно, что в ближайшие месяцы, в худшем случае через пару лет, остальная Грифония будет завоевана. Мне интересно найти своё место в этой новой реальности – в качестве подданного Вашей Милости".\n\n"И зачем нам принимать на службу грифона, который сражался против нас? Верных арантийцев и иностранцев с гораздо более чистой репутацией, чем у тебя, более чем достаточно".\n\n"Всё просто. По мере продвижения вперёд будет всё труднее находить подходящих грифонов, Ваша Светлость. Чем больше земель вы завоюете, тем труднее будет этим одарённым душам примкнуть к вашему двору. Впереди ещё много завоеваний, для которых вам понадобится множество опытных генералов и губернаторов, а не каких-то неоперившихся птенцов. Дайте мне шанс, и я докажу свою полезность."\n\nАрантигос откинулся на спинку стула. Согласно донесению разведки, де Шарбона можно было считать талантливым и безжалостным командиром. Такие грифоны ему действительно были нужны. Но Верховное Командование наверняка будет недовольно появлением в их рядах какого-то выскочки из Фловены. И, что ещё важнее, – мог ли он доверять Николасу?"
arantiga.085.a:0 "Заключим сделку."
arantiga.085.b:0 "Мы отказываемся."
arantiga.086.t:0 "Смерть идеи"
arantiga.086.d:0 "С маршем войск Арантиги по бульварам Аквилы, бывший гегемон запада потерпел поражение. Но большинство аквелийцев презирают своих новых повелителей, и республиканцы готовы использовать это недовольство в своих интересах. Многочисленные повстанческие ячейки уже поднялись и теперь строят заговоры против нас. Их террористические атаки происходят почти ежедневно. Нам необходимо справиться с аквелийским сопротивлением, если мы хотим сохранить контроль. Простейшим решением было бы сокрушить и подавить их с помощью наших вооружённых сил. Масштабные военные действия и арест всех известных и предполагаемых сторонников республиканцев может в конечном итоге сломить мятежников. Но некоторые сотрудники нашей разведки предлагают более осторожный подход – они могут... внедриться в ряды республиканского движения, настроить их друг против друга, а затем избавиться от оставшихся."
arantiga.086.a:0 "Осторожный подход."
arantiga.086.b:0 "Разбить их железной лапой."
arantiga.087.t:0 "Коронация"
arantiga.087.d:0 "Сегодня в Грифенхейме собралась огромная толпа – прибыли десятки тысяч грифонов со всех уголков владений Арантигоса. Хотя многие считали своего нового правителя всего лишь иноземным завоевателем, их любопытство было велико. Без сомнения, этот день запомнится на долгие десятилетия – день создания новой империи. Церемония началась в храме Борея (теперь храме Арантигоса-Борея), где Доротеос вырвал императорскую корону из лап новоназначенного архонта и короновался сам. За коронацией последовал военный парад. Знамена побеждённых армий несли вместе с символами новой империи, а ветераны бесчисленных кампаний маршировали по улицам. Когда Доротеос наконец прибыл в императорский дворец, высокопоставленные офицеры, чиновники, знать и жрецы преклонили перед ним колени, одни из уважения, другие – из страха, и принесли клятву верности своему Божественному Императору. Впервые за много лет Доротеос улыбнулся... Восторг! Все эти годы войны, все эти жертвы... И вот здесь, во дворце, он стоял, превзойдя своего великого предка. Он посмотрел на собравшихся и произнёс: "Из поколения в поколение в Грифонии царил хаос. Из поколения в поколение лжекороли и бесчестные императоры правили грифонами. Боги отвернулись от нас в эти тёмные времена... Но сегодня начинается новая эра. Грифоны больше не будут подчиняться чужеземцам, мы больше не будем разобщены. С возрождением Арантигоса возродится Грифония, перекованная кровью и сталью, очищенная огнём войны. Арантига обрела славу... Вечную славу, которая будет длиться до конца света, как и наша новая империя!""
arantiga.087.a:0 "Вечная империя!"
arantiga.088.t:0 "Взгляд в лицо реальности"
arantiga.088.d:0 "Бесчисленные народы пали и стали частью Империи. По мере продвижения легионов правители были свергнуты, их подчинённые убиты, города превратились в руины. Всё это было не напрасно, ведь теперь Арантигос правит величайшей страной Грифонии... Или, по крайней мере, пытается это делать. За годы расширения наша бюрократия становилась всё менее эффективной. В конце концов её проблемы достигли критической массы, и центральное правительство больше не способно эффективно управлять отдалёнными провинциями. К счастью, мощь Легионов Арантиги предотвращает открытое восстание, но дело в том, что мы не можем должным образом управлять всеми этими землями, населёнными многочисленными грифонами разных национальностей и религий. Угроза революции снова маячит на горизонте, наши военные губернаторы действуют как варварские вожди, и отсутствие единства начинает давать о себе знать. Если мы хотим, чтобы Империя выжила, крайне важно решить множество серьёзных проблем, – и сделать это быстро, пока наши многочисленные враги не собрались воедино, чтобы напасть на нас!"
arantiga.088.a:0 "Завоевывать земли было проще..."
arantiga.089.t:0 "Предложение лапы и сердца"
arantiga.089.d:0 "Мы только что получили письмо из соседнего Королевства Арантига. Его правитель Доротеос Фезерин предлагает Королеве Вивьен брак – таким образом он хочет установить прочные мирные отношения между двумя народами. Несомненно, союз с таким прославленным полководцем, как Доротеос, грифоном, сумевшим завоевать большую часть Центральной Грифонии, обезопасит наш восточный фланг и поможет нам бороться с любой силой, которая может подняться на Севере. Но есть серьёзные опасения: Доротеос недавно провозгласил себя "Возрождённым Арантигосом", убив свою сестру, предыдущую правительницу Арантиги. Можно ли доверять такому грифону?"
arantiga.089.a:0 "Вежливо отклонить предложение."
arantiga.089.b:0 "Принять его предложение."
arantiga.090.t:0 "Арантигос отверженный"
arantiga.090.d:0 "Королева Вивьен отклонила предложение Арантигоса... Поэтому у нас есть только один способ отреагировать."
arantiga.090.a:0 "Раз они отказались от брака, мы организуем похороны."
arantiga.091.t:0 "Бесславные дела"
arantiga.091.d:0 "Есть много знатных грифов, занимающих важные должности в армии и правительстве Аквелии, которые практически не преданы своему народу и его правителю, заботясь только о своих семьях, богатстве и власти. Мы можем подкупить их, чтобы использовать в качестве наших пешек. Когда правительство Аквелии начнёт разлагаться, мы начнём заменять их нашими агентами. Но пока... пока они могут наслаждаться своим новообретённым богатством."
arantiga.091.a:0 "Дураки..."
arantiga.092.t:0 "Проникновение в разведку"
arantiga.092.d:0 "С помощью наших новых аквелийских "друзей" наше влияние в стране значительно возросло. Нам уже удалось серьёзно подорвать правительство Аквелии, заменив многих чиновников нашими сторонниками. Однако, если мы хотим осуществить этот план, нам нужно подорвать работу аквелийской разведки, чтобы они не мешали нам. Несколько тщательно спланированных инцидентов и поддержка тех немногих повстанческих ячеек, которые всё ещё действуют в Аквелии, отвлекут их внимание, и мы сможем сместить их руководство..."
arantiga.092.a:0 "Мы на шаг ближе..."
arantiga.093.t:0 "Смерть Маршала"
arantiga.093.d:0 "Сказать, что Шарль де Грайфенвальд-Клубника был в ярости, было бы большим преуменьшением. После этой проклятой свадьбы он чувствовал, что всё, за что он боролся, медленно разваливалась, и Аквелия, страна, которой он был почти полностью предан, стала лишь марионеткой в лапах этого... "Арантигоса". Для большинства знати Доротеос казался всего лишь амбициозным выскочкой, восточным вождём, с которым можно играть и морочить голову обещаниями власти и престижа, которые даёт королевский брак. Королева и её лакеи слишком легко верили сладким речам арантийских дипломатов, игнорируя даже тот очевидный факт, что Доротеос был явным мегаломаном и безумцем. Они считали, что вся эта история с "божественностью" – всего лишь дурацкая игра для простых грифонов. Но Шарль знал лучше: он внимательно изучал донесения разведки о походах Фезерина и знал, что его враг – хитрый стратег. А Аквелия была его следующей целью. На это намекали некоторые тревожные признаки. Очевидно, агенты Арантиги пытались проникнуть в командование Аквелии с помощью шантажа и взяток. Маршал был к этому готов... Он собрал достаточно доказательств, чтобы раскрыть заговор, целью которого было уничтожение его любимой Аквелии... Ему оставалось лишь попросить о встрече с королевой, и тогда...\n\n...Никто так и не узнал, что произошло потом. К сожалению, в тот день в его кабинете произошёл взрыв, и главнокомандующий Армией Аквелии погиб в результате "акта терроризма, совершённого республиканской ячейкой". Расследование было довольно запутанным, но грифоны, нанятые для организации убийства, были профессионалами и не оставили никаких доказательств причастности Арантиги."
arantiga.093.a:0 "Бон вояж!"
arantiga.094.t:0 "Кризис в правительстве"
arantiga.094.d:0 "Некомпетентность преследует наше правительство. Коррупция процветает, бюрократия становится всё более неэффективной. Иногда кажется, что некоторые чиновники намеренно игнорируют наши приказы или делают всё возможное, чтобы исполнять их ненадлежащим образом. Нам нужно перетасовать наше правительство, если мы хотим нормально управлять страной."
arantiga.094.a:0 "Бездарные идиоты!"
arantiga.095.t:0 "Слепые и глухие"
arantiga.095.d:0 "Третья революция? Или наши агенты — просто шайка идиотов? Что же там происходит?! Нам нужна информация, а мы получаем только бессвязную болтовню. Что-то здесь явно не так."
arantiga.095.a:0 "Маар их подери!"
arantiga.096.t:0 "Убийство Грайфенвальда"
arantiga.096.d:0 "По всей видимости, революционеры не были разгромлены, как мы изначально думали. Сегодня был убит маршал де Грейфенвальд-Клубника – республиканцы подложили бомбу в его кабинет. Взрыв был настолько мощным, что подчинённые маршала, его ближайшие офицеры и другие сотрудники в здании погибли или были тяжело ранены. Эта смерть – сокрушительный удар по моральному духу нашей армии и командной иерархии."
arantiga.096.a:0 "Покойся с миром..."
arantiga.097.t:0 "Упадок Аквелии"
arantiga.097.d:0 "В результате недавней череды "несчастных" событий в Королеве Аквелия, Вивьен практически лишилась реальной власти и стала марионеткой в лапах нескольких амбициозных чиновников (все они были под контролем Доротеоса). Пройдет совсем немного времени, прежде чем Аквилея станет, по сути, неотъемлемой частью Империи Арантиги — формально она всё ещё существует, но настоящим королём теперь является Доротеос. Однако по мере угасания королевской власти те немногие, кто не желает подчиняться Арантиге, собирают всю возможную поддержку среди патриотически настроенных офицеров... Поскольку монархия снова пала, у немногих оставшихся республиканцев в армии Аквелии может появиться шанс восстановить Республику..."
arantiga.097.a:0 "...увы, им это не удалось."
arantiga.097.b:0 "Мы будем свободны!"
arantiga.098.t:0 "Смерть предателя"
arantiga.098.d:0 "Казнь Лорда-Протектора быстро превратилась в стихийный праздник в Грифенхейме. Жители, долго подвергавшиеся издевательствам со стороны солдат Фердинанда, на мгновение забыли, что, по сути, мало что изменилось в их положении – теперь ими правил просто ещё один угнетатель. Когда бывшего диктатора Империи Грифонов привели на виселицу, толпы кричали и проклинали его, а когда его наконец казнили, грифоны начали праздновать. Наблюдая за ликующими горожанами со своей трибуны, Доротеос вспоминал события последних дней. Поймать Донкло было очень трудно – он, вероятно, намеревался погибнуть в бою, однако солдатам было дано специальное указание взять его живым. В тюрьме Лорд-Протектор казался безразличным к происходящему вокруг – словно вся его воля к жизни и амбиции, которые двигали им, исчезли. Когда Доротеос появился, чтобы поблагодарить его за... "последнюю услугу", которую тот, сам того не зная, оказал ему, генерал лишь слегка усмехнулся и сказал: "Должен сказать, это действительно хороший план. Я забронирую тебе место в Тартаре". Наблюдая за казнью, Доротеос размышлял о прокламациях, которые последуют в этот день: "Король Фезерин отомстил за последнего Гровера и спас Империю от когтей безумца"... Хорошо иметь козла отпущения, чтобы скрыть свои преступления, – и Фердинанд превосходно сыграл эту роль."
arantiga.098.a:0 "Он был нам полезен..."
arantiga.099.t:0 "Последний из Гроверов"
arantiga.099.d:0 "...Это безопасно?" — спросил Доротеос, откинувшись в своём офисном кресле и сцепив когти. "Конечно, о великий Арантигос", — ответила зебра, сохраняя спокойствие – "Яд не распознать даже лучшим врачам. Будет выглядеть так, будто жертва умерла от неожиданной болезни. Что насчёт оплаты?" Доротеос поднял коготь: "Да, да, примерно миллион идолов — в драгоценных металлах, самоцветах и кристаллах — как и было оговорено. Это безопаснее наличных?" Зебра улыбнулась и ответила: "В наши дни правительства взмывают и падают, валюты шаткие! Но драгоценные камни... они вечны."\n\nКогда алхимик ушёл, Доротеос снова взглянул на флакон на столе. Он нанял отравителя-зебру, известного в криминальном мире своими выдающимися способностями. Или так он думал. Но он не сомневался, что полосатый торговец смертью выполнил свою часть сделки: в его деле ты либо был честен, либо мёртв. Обман был невозможен.\n\nВсё было учтено: единороги обладали определёнными кристаллами, способными за несколько часов лишить жизни того, кто к ним прикоснётся. Ничего не подозревающий алхимик получил их в качестве платы а их продавец лежал мёртвым на дне озера Румейр. Оставалось только начать последнюю фазу плана. \n\nЯд зебры вызывал те же симптомы, что и серая лихорадка, болезнь, которая мучила опустошённый Грифенхейм с момента его покорения, но приводил к гораздо более быстрой смерти. Группа тщательно избранных, ревностно преданных грифонов должна была помочь распространить болезнь, превратив её в полномасштабную эпидемию. После этого Гровер был бы отравлен. Среди хаоса, вызванного эпидемией, смерть одного благородного птенца не показалась бы странной, но, чтобы ещё больше скрыть нашу причастность, после завершения миссии арантийские агенты будут отправлены в самые опасные места на передовой, где они погибнут и унесут тайну с собой в могилу.\n\nКороль Арантигос вспоминал свою встречу с Ребёнком-Императором. Это произошло вскоре после того, как его армии захватили Имперскую столицу. Юный Гровер был напуган. А кто бы не испугался? Арантигос к тому времени был одним из самых прославленных завоевателей – он разгромил Империю Грифонов. Он бы забеспокоился, если бы юный грифон его не боялся. Хотя к тому моменту ребёнок стал свидетелем такой жестокости и стольких смертей, что он мог бы сойти с ума. Но Арантигос был впечатлён, когда юнец предстал перед ним, стараясь выглядеть как можно спокойнее и... насколько это возможно, презентабельным. Должно быть, это был худший день в его жизни.\n\nНа мгновение Доротеос заколебался. Но он знал – Император может быть только один."
arantiga.099.a:0 "Это необходимо сделать."
arantiga.100.t:0 "Триумф в Грифенхейме"
arantiga.100.d:0 "Имперская столица, которую часто величают "городом мечты" за её престиж, размеры и великолепие, была высшим символом власти. Даже после поражения она выглядела внушительно. Не прошло и месяца, как последний вражеский полк в городе сдался. И теперь жители Грифенхейма начинали тяжёлую работу по восстановлению своих разрушенных домов и кварталов. Медленно, но верно город будет восстановлен.\n\nОднако сегодня был не день восстановления. Доротеос, возрождённый Арантигос, постановил, что в этот день все жители разрушенного города должны присутствовать на грандиозном спарлейском "триумфе" – возрождённой традиционной церемонии, которая знаменовала принятие завоевателем власти над новыми землями.\n\nМаленькие флаги Арантиги, привязанные к чёрным городским фонарям, развевались на легком ветру. Триумф проходил от площади Ромау по бульвару Гриффкинг, широкому, как река, в честь которой он был назван, и заканчивался на Центральной площади возле Императорского дворца. Мосты через реку Гриффкинг, разрушенные защитниками Грифенхейма, представляли собой печальное зрелище, на фоне которого величественный облик Доротеоса казался гротескным.\n\nКогда машина Доротеоса проезжала по улицам, горожане размахивали флагами и ликовали. Многие делали это вынужденно. Вдали от главных улиц грифоны выглядели угрюмыми и поверженными, пытаясь смириться со своей участью. Они лишь надеялись, что их жизнь не изменится к худшему при новом правителе."
arantiga.100.a:0 "Одна империя падает, другая возвышается."
arantiga.101.t:0 "Падший Архонт"
arantiga.101.d:0 "Сегодня, среди кучи различных отчётов, писем и других документов, с которыми ему пришлось иметь дело, Доротеос нашёл довольно странный. Короткое письмо, подписанное не кем иным, как архонтом Эрионом XII. Поначалу Доротеос заподозрил, что это послание – искусная ловушка, и немедленно приказал проверить его на наличие магических проклятий и более приземлённых средств, например, ядовитых химикатов. Тщательное исследование показало, что письмо не представляло никакой опасности. Однако его содержание было интересным... Архонт поздравил Арантигоса с недавними победами и выразил готовность сотрудничать с новым правителем Герцланда и продолжить свою работу в качестве архонта Эйр, помогая укрепить власть Доротеоса. Очевидно, что Эрион просто хочет сохранить то немногое влияние и богатство, которыми он обладает, но он известен как чрезвычайно амбициозный и ненадёжный грифон. Но несомненно, он проницательный политик и законный архонт. Его поддержка может оказаться ценной, если мы хотим, чтобы к нам относились лучше, чем как к простым завоевателям. Но нам придётся за ним присматривать."
arantiga.101.a:0 "Найдите его и избавьтесь от него!"
arantiga.101.b:0 "Объявим о его поддержке публично."
arantiga.102.t:0 "Delenda Est"
arantiga.102.d:0 "Интересное противоречие: несмотря на то, что современные арантийцы в основном похожи на вингбардийцев, само королевство Вингбардия в арантийской пропаганде всегда именуется "нашим исконным врагом" и обвиняется в падении Арантиги. Когда легионы Арантиги подошли к Карфину, боевой дух был высок, и начался ожесточённый штурм города. Офицеров Арантиги не волновали потери обеих сторон, как и ущерб, нанесённый городу. Арантигос пообещал высшую награду – Орден Двух Мечей – любому, независимо от звания, кто сумеет вывесить флаг королевства на крыше дворца Талонуэля. Это привело к соперничеству между несколькими отрядами, которые проникли вглубь города и направились прямо к королевскому дворцу, встретив сопротивление от его защитников. Победу одержал отряд сержанта Эйгороса, который вместе со своим младшим сержантом Кантаросом прикрепил флаг Арантиги к фасаду здания. Арантигос лично наградил обоих солдат и их командира, и предложил им присоединиться к своей личной гвардии. Вскоре после этого последние защитники города были разгромлены, и город сдался, избежав дальнейшего разрушения. Хотя большинство гражданских районов остались в относительно хорошем состоянии, солдаты Арантиги, следуя приказу своего правителя, уничтожили все символы Вингбардийского королевства. Статуи королей были разбиты, дворцы очищены от всех портретов и других предметов, представляющих прежний режим."
arantiga.102.a:0 "Месть сладка!"
arantiga.104.t:0 "Грифенхейм наш!"
arantiga.104.d:0 "Легионы Арантиги двинулись на север, сокрушая герцландских грифонов и уничтожая все армии, собранные узурпаторами императорского трона. Даже великий город Грифенхейм был захвачен, и наши войска подавляют здесь последние остатки сопротивления, которое оказалось более ожесточенным, чем мы ожидали, и многие кварталы были разрушены в тяжких городских боях или уничтожены артиллерийским огнем. Отступающие защитники Имперской столицы самостоятельно уничтожили многие жизненно важные элементы городской инфраструктуры, чтобы задержать наступление арантийцев. Потери среди мирного населения огромны, и могут пройти годы, прежде чем мы полностью восстановим город."
arantiga.104.a:0 "Наше наследие полно пепла и скорби."
arantiga.103.t:0 "Гаснущие огни"
arantiga.103.d:0 "Аквила, жемчужина Запада, пала. Благодаря тому, что местное правительство объявило её открытым городом и впоследствии передало её Арантиге, столица Аквелии осталась относительно невредимой. Армия арантийцев вошла в город по променаду де Дюк. Солдат настолько ошеломили богатства города, что они начали его грабить. Несколько дней местные жители пытались спасти своё имущество, прежде чем жандармерии удалось подавить отряды дезертиров. Подразделения, поддерживавшие дисциплину, были отправлены на защиту достопримечательностей Аквилы, а особенно храмов. Однако, к великому неудовольствию местных жителей, по инициативе самых ревностных легионерских капелланов, фасад храма Борея вскоре украшали... большие арантийские знамена и портреты Арантигоса, а сам храм был переименован в храм Арантигоса-Борея."
arantiga.103.a:0 "Уберите этот бардак!"
arantiga.105.t:0 ""Король" Аквелии"
arantiga.105.d:0 "Солнце медленно садилось над Городом Огней. Большинство клерков и младших офицеров покидали штабные здания, чтобы насладиться вечером в многочисленных городских кафе и ресторанах. Маршал де Грейфенвальд-Клубника, однако, был так же далек от радостного настроения, как реформисты от магии дружбы. Сегодня ему предстояла встреча с военным атташе Арантиги, или, как они его называли, "легатом". На повестке дня были вопросы военного сотрудничества между Легионами Арантиги и Королевской армией Аквелии. На самом деле, обсуждение представляло собой скорее список требований, и Грайфенвальд-Клубника едва сдержался, чтобы не вышвырнуть этого восточного самодура из его кабинета. Вскоре арантийцы стали относиться к Аквелии как к своему собственному заднему двору – различные "дипломаты" и "советники" почти открыто вмешивались в их дела. Внутренняя политика Аквелии и королевское правительство легко поддавались на их манипуляции. По-видимому, соблазнённые обещаниями власти и правления над Грифонией, они последовали за этим "Арантигосом", помогая ему в его безумном завоевании Грифонии, глупо полагая, что это они его обманывают. На деле они шаг за шагом всё сильнее запутывались в паутине взяток, шантажа и интриг. Если что-то не произойдёт в ближайшие месяцы, Аквелия будет свободна лишь номинально. Нужно было что-то предпринять. Грайфенвальду нужно было действовать. Высокопоставленные офицеры последуют за ним, и тогда свержение королевы не составит труда. Он позвал своего адъютанта и приказал ему посетить генералов. Он знал, что они так же недовольны текущим положением дел. Им будет приказано двинуть войска в столицу и другие ключевые города, чтобы одновременно начать штурм. Адъютант понимал, что ему нужно торопиться и..."
arantiga.105.a:0 "...выполнил приказы маршала."
arantiga.105.b:0 "...отправился в офис легата."
arantiga.106.t:0 "Грайфенвальд арестован"
arantiga.106.d:0 "Мы только что получили новости из Аквелии. Марешаль Грейфенвальд-Клубника, главнокомандующий Аквелийской армией, был арестован и обвинён в измене. По данным нашей разведки, он пытался организовать военный переворот, но, к счастью, один из наших агентов раскрыл его заговор прежде, чем стало слишком поздно. Информация о планах маршала была передана правительству Аквелии. Без него нашему правлению мало что угрожает, поскольку никто в их армии не обладает достаточной смелостью и харизмой, чтобы заручиться существенной поддержкой."
arantiga.106.a:0 "Приятное событие."
arantiga.107.t:0 "Переворот Грайфенвальда"
arantiga.107.d:0 "Мы сильно недооценили аквелийцев. Наша попытка повлиять на их политику вызвала совершенно нежданную реакцию. Маршалу Грайфенвальду-Клубнике удалось перехитрить нашу разведку и организовать военный переворот. Верные ему войска захватили столицу, основные гарнизоны и ключевые города. Правительство рухнуло, и через несколько часов почти все аквелийские солдаты присягнули на верность "Спасителю Аквелии". Чиновники свергнутого режима, включая королеву Вивьен, избежавшую ареста, уже прибыли в Арантигу, но теперь они практически бессильны. Если мы хотим сохранить контроль над Аквелией, нам придётся сражаться за это, к счастью, присутствие Вивьен даёт нам идеальный повод для войны."
arantiga.107.a:0 "Тогда мы пойдём трудным путём!"
arantiga.108.t:0 "Война неизбежна."
arantiga.108.d:0 "Операция прошла гладко – в течение нескольких часов сопротивление сторонников Вивьен было подавлено. Военные последовали за своим маршалом, и даже если есть противники его переворота, они не осмеливаются выступать против него. Грайфенвальд, назначенный регентом королевства, поведёт Аквелию к светлому будущему, свободному от иностранного влияния. Однако есть одна серьёзная проблема: нам не удалось захватить королеву Вивьен и некоторых других политиков, которым удалось бежать в Арантигу. Очевидно, что самопровозглашённый "Бог-Король" на востоке будет в ярости и, вероятно, скоро нападёт на нас."
arantiga.108.a:0 "Аквелия будет свободна!"
arantiga.109.t:0 "Судьба Полуострова Ужаса"
arantiga.109.d:0 "Земли дальнего северо-востока — загадочная земля, которую посещали немногие исследователи-грифоны. Это земли древних гробниц, запретной магии и невообразимых ужасов. Долгое время так называемый Арктурианский Орден охранял эти земли, но с его исчезновением нам приходится управлять этим отдалённым местом. Эта земля малополезна для нас, поэтому прямой контроль над ней не слишком выгоден. Возможно, есть лучшее решение."
arantiga.109.a:0 "Создать Арантийский Орден."
arantiga.109.b:0 "Расширить Гиперборею."
arantiga.110.t:0 "Фалькор присоединяется к нам!"
arantiga.110.d:0 "Мы только что получили новости от Фалькора. Они принимают наше предложение о союзе и будут сотрудничать с нами, чтобы победить Вингбардию. Теперь пора идти на Карфин!"
arantiga.110.a:0 "Delenda Est!"
arantiga.111.t:0 "Ультиматум Арантигоса"
arantiga.111.d:0 "В западной Грифонии появился новый неожиданный гегемон – недавно образованная "Империя Арантиги". Их правитель, Доротеос Фезерин, провозгласил себя живым Богом и Императором всех грифонов и начал кампанию за объединение Грифонии. Теперь он обратил свой взор на восток и потребовал, чтобы мы отдали ему все бывшие земли Империи Грифонов. Если мы откажемся, он объявит нам войну. Мы пролили много крови, сражаясь за эти земли, но этот "Арантигос" – прославленный полководец, сумевший победить крупнейшие державы Грифонии, и, вероятно, сможет победить и нас. Что же нам делать?"
arantiga.111.a:0 "Мы будем сражаться!"
arantiga.111.b:0 "Мы уничтожим его!"
arantiga.111.c:0 "Мы принимаем его требования..."
arantiga.112.t:0 "Речные пони отказываются"
arantiga.112.d:0 "Глупые речные пони отказались от нашего щедрого предложения. Они верят, что смогут противостоять мощи Легионов. Теперь нам остаётся только одно – двинуться на восток и силой забрать то, что по праву принадлежит нам. Мы принесём войну в Речные земли!"
arantiga.112.a:0 "Мы сокрушим их!"
arantiga.113.t:0 "Речные пони сдаются"
arantiga.113.d:0 "Напуганные нашей военной мощью, речные пони решили принять наш ультиматум. Их армии отступают на восток, а мы берём под контроль спорные территории. Это великая победа – и, что самое главное, бескровная. Теперь пора объединить остальную Грифонию – мы разберёмся с Речными землями, когда придёт время."
arantiga.113.a:0 "Справедливость восстановлена!"
arantiga.114.t:0 "Неожиданная просьба"
arantiga.114.d:0 "Мы получили странную просьбу от Речной Республики – лидера Речной Коалиции. Они предлагают нам передать земли, отнятые у грифонов в праведной войне, Арантийской Империи – недавно образованному западному гегемону. Республиканское правительство сошло с ума, или Арантига действительно настолько опасна?"
arantiga.114.a:0 "Эта земля наша!"
arantiga.114.b:0 "Мы доверяем их суждениям."
arantiga.115.t:0 "[FROM.GetName] бросает нам вызов!"
arantiga.115.d:0 "Мы только что получили известие о разногласиях в Речной коалиции. Очевидно, хоть сама Коалиция решила принять наши щедрые условия, одно из её государств-членов, [FROM.GetName], решило не отказываться от своих новых земель. Они вышли из альянса и готовятся сражаться с нами самостоятельно."
arantiga.115.a:0 "Глупцы!"
arantiga.116.t:0 "[FROM.GetName] не подчиняется"
arantiga.116.d:0 "Наше решение не передавать земли Арантийской Империи не было одобрено всеми членами Речной Коалиции. Одно из государств-членов, [FROM.GetName], отказалось отдать свои территории и оставило нас сражаться с Арантигой в одиночку."
arantiga.116.a:0 "Идиоты!"
arantiga.117.t:0 ""
arantiga.117.d:0 ""
arantiga.117.a:0 ""
arantiga.118.t:0 ""
arantiga.118.d:0 ""
arantiga.118.a:0 ""
arantiga.119.t:0 "Арантигос идёт на Север!"
arantiga.119.d:0 "Доротеос Фезерин, правитель Арантиги, уже контролирует Центральную Грифонию. Но, судя по всему, его амбиции — править всем континентом Грифонов. Безумец провозгласил себя "Возрождённым Арантигосом" и, следуя по стопам своего предка, начал завоевательную кампанию. Теперь он обратил свой взор на север. Легионы Арантиги уже напали на одного из наших соседей. Если мы ничего не предпримем, они разгромят нас одного за другим. Хотя мы можем подождать и позволить "Арантигосу" сделать грязную работу по разгрому наших врагов, риск огромен — он командует огромной армией фанатичных солдат, и вряд ли мы сможем победить его в одиночку."
arantiga.119.a:0 "Враг моего врага..."
arantiga.119.b:0 "Поживём — увидим."
arantiga.121.t:0 "Арантигос идёт на Север!"
arantiga.121.d:0 "Доротеос Фезерин, правитель Арантиги, уже контролирует Центральную Грифонию. Но, судя по всему, его амбиции — править всем континентом Грифонов. Безумец провозгласил себя "Возрождённым Арантигосом" и, следуя по стопам своего предка, начал завоевательную кампанию. Теперь он обратил свой взор на север. Легионы Арантиги уже напали на одного из наших соседей. Если мы ничего не предпримем, они разгромят нас одного за другим. Хотя мы можем подождать и позволить "Арантигосу" сделать грязную работу по разгрому наших врагов, риск огромен — он командует огромной армией фанатичных солдат, и вряд ли мы сможем победить его в одиночку."
arantiga.121.a:0 "Враг моего врага..."
arantiga.121.b:0 "Поживём — увидим."
arantiga.120.t:0 "[FROM.GetName] объявляет нам войну!"
arantiga.120.d:0 "Похоже, наша кампания по завоеванию бывших имперских земель возродила патриотизм в старых вассальных государствах империи – после нашего недавнего объявления войны, [FROM.GetName] объявил нам войну в ответ."
arantiga.120.a:0 "Незначительное препятствие."
arantiga.122.t:0 "Последняя сделка"
arantiga.122.d:0 "У дворца в Спарлето было кое-что общее с резиденциями фловенцев – обширный сад. Тот, кто проектировал это типичное южногрифонье здание, явно любил просторные дворы и сады, где его обитатели могли отдохнуть в самые жаркие часы дня. Теперь же его занимали посетители, которым приходилось проводить бесчисленные часы в ожидании аудиенции. Но Николасу было невозможно здесь расслабиться – хотя всё казалось мирным, он не мог скрыться от глаз множества стражников, следящих с подозрением следящих за ожидающими. Садовники и слуги казались слишком уж любопытными, они явно тоже были частью внутренней службы безопасности. Какое безумное место... Но паранойя владельца, вероятно, была оправдана, особенно учитывая слухи о недавней попытке переворота. В течение следующих нескольких часов Николасу несколько раз сообщали, что король вскоре с ним поговорит... Но приглашения всё не было. Заскучав, он обратил внимание на фреску, которая, похоже, была недавно добавлена на одну из стен. На ней был изображен Доротеос. Или, как он хотел, чтобы его называли теперь, "Арантигос". Судя по этой картине, художник, написавший её, не был обделён талантом, но Николаса мучил вопрос, сам ли он решил прославить правителя, или же "Арантигос" попросил изобразить его в таком полуграндиозном-полуеретическом ключе. Это было не единственное проявление тщеславия короля, которое он увидел во дворце рядом с реликвиями и произведениями искусства, явно привезёнными сюда в качестве трофеев от покорённых народов.\n\nВремя шло, а с ним росло и раздражение Николаса. Он глубоко задумался над тем, зачем он здесь. Фловена пала, и легионы арантийцев шли на Запад. Арантигос прокладывал себе путь к окончательной победе, но Николас был уверен, что даже победив всех врагов, его империя не переживёт его. Построенная на крови и страхе, подпитываемая завоеваниями, она рухнет тогда же, когда умрёт её создатель – будь то от когтей убийц, в очередной войне, или из-за старости... И тогда Фловена будет готова восстать вновь. Возможно, де Шарбоны – сам Николас или его дети – поведут свой любимый город в будущее. Но для этого ему нужно было стать могущественным грифоном в королевстве Арантигоса – тем, кто сможет защитить Фловену от опасностей новой эпохи. Поэтому ему придётся сжать когти, поклониться этому претенденту на звание бога и служить ему...\nВнезапно один из слуг вырвал его из раздумий:"
arantiga.122.a:0 ""Пожалуйста, следуйте со мной. Его Величество ждёт"."
arantiga.149.t:0 "Личная оценка"
arantiga.149.d:0 "Было до боли очевидно, что Спарлеос, столица Арантиги, далеко не так богат, как Карфин или даже Талононте. Он навсегда остался бы захолустным городом, а его прежняя слава бы постепенно угасла... Если бы не Доротеос. Пусть город и был небольшим, но Фетивола чувствовал, что вскоре он станет бьющимся сердцем новой, разрастающейся империи, империи арантийцев. Он слышал грифонов, говорящих на древнем языке на улицах, проходил мимо отреставрированных храмов Арантигоса-Борея и совершенно новых памятников, воздвигнутых в честь недавних завоеваний. Но всё это не имело никакого значения по сравнению с тем, как вели себя местные. Талузец проникся чувством гордости и общности дела, исходящим от каждого жителя Спарлеоса, – верой в наступление великой новой эпохи и готовностью сделать её своей. Вновь, как и столетия назад, грифоны Спарлеоса были готовы заявить о своей судьбе, и когда они сделали это в прошлый раз – вся Грифония трепетала от страха.\n\nКороль ждал его в садах своего дворца – значительно расширенной версии традиционной резиденции баронов Арантиги. Доротеос сидел на одной из скамей возле изящного фонтана. Странным образом Фетиволе это место показалось знакомым. Как будто он уже видел его когда-то. Скамейки, цветы и деревья... Это было нечто большее, чем обычные произведение садового искусства. Стражник, сопровождавший Фетиволу, прочистил горло, пытаясь привлечь внимание монарха: "Ваша милость, господин Амилькаре Фетивола прибыл, и, как вы и просили, мы тут же привели его сюда". Доротеос слегка кивнул. "Хорошо... Теперь оставьте нас", — ответил он стражнику. Не сказав ни слова, солдат покинул сад. "Достичь совершенства нелегко. Мы верим, что в этом земном мире это невозможно. Всё, что мы можем сделать, — это создать имитацию того, что лежит за его пределами, — его тень. Взять, к примеру, этот сад: всё исполнено в точности так, как мы приказали, как мы помнили... И всё же мы чувствуем, что это не совсем правильно. Увы, это лучшее, чего можно достичь. И мы сделаем то же самое с Грифонией – хотя некоторые грифоны, возможно, никогда не изменятся, мы сделаем всё возможное, чтобы все детали встали на свои места. Я рад наконец-то познакомиться с вами, мистер Фетивола. Я читал ваш манифест много лет назад. Он был весьма поучителен...""
arantiga.149.a:0 ""Он помог нам приблизиться к нашему истинному предназначению"."
arantiga.150.t:0 "Талуза бросает нам вызов!"
arantiga.150.d:0 "Фетивола, по своей глупости, публично заявил, что наш король — всего лишь самозванец и Лжеарантигос, и что только его собственное регентство может вернуть былую славу Королевства Спарлеос. У нас нет другого способа справиться с ним, кроме как с помощью грубой силы."
arantiga.150.a:0 "Приготовьте танки!"
arantiga.151.t:0 "Вопросы судьбы".
arantiga.151.d:0 ""Спасибо". Амилькаре слегка улыбнулся. "Судьба — странная штука... Она неизбежна, но для её достижения нужна помощь, вдохновение".\n\n"Именно" – ответил Доротеос – "Чтобы исполнить свою судьбу, нужна сила. Нужно пробиваться, даже если все обстоятельства против тебя... Наша цель одна, господин Фетивола, наша судьба общая. Талонсия когда-то была Хранителем Юга, а её правитель – самым верным последователем нашего великого предка – Арантигоса Великого. Всё может повториться, но путь впереди будет трудным – Талонсии, как и Арантиге, придётся отдать всё, чтобы восстановить наше великое прошлое, а позже и превзойти его". Амилькаре увидел в этом иронию: "Сколь необычный способ склонить союзника на свою сторону – не обещать богатства или власть, а сказать, что он должен практически пожертвовать собой".\n\n"Первое предложение оскорбило бы такого грифона, как вы, господин Фетивола". Арантигос рассмеялся. "Нет, мне не нужны грифоны, которых я могу подкупить – таких жалких тварей десятки, и мне и так приходится иметь с ними дело каждый день. Мне нужен истинно верующий в дело Арантиги. Последователь, а не слуга. Поборник, а не наёмник. Я испытываю к вам глубокое личное уважение, господин Фетивола, вы – настоящий учёный из ушедшей эпохи. Я верю, что у нас много общего... Если вы откажетесь от моего предложения, я позволю вам покинуть моё королевство невредимым, и в следующий раз мы встретимся на поле боя".\n\nФетивола стоял молча. Он должен был подумать: действительно ли Доротеос был возрождённым Арантигосом? Он вернул себе Идола, но явно не мог им управлять... Хотя Арантигос Великий был всего лишь грифоном. Очевидно, Возрождённый Арантигос по своей природе гораздо более могущественное существо. Нужны ли ему вообще силы Идола? Амилькаре почувствовал облегчение, а затем и прилив сил. Он всегда знал своё предназначение – восстановить честь Талонсии. Но её судьба заключалась в служении её единственному истинному владыке – Арантигосу. Решительность и железная воля молодого короля были непреодолимы, Амилькаре не сомневался в том, что он преуспеет в своих начинаниях. Но даже величайшему завоевателю не помешала бы помощь. Возможно, именно так он должен был исполнить свой долг. Судьба ждет..."
arantiga.151.a:0 "“Я присоединюсь к вам... мой король.”"
# Zebrica Expansion Events
arantiga.161.t:0 "[FROM.GetName] требует Новый Мейрленд"
arantiga.161.d:0 "Последние несколько лет мы наблюдали за событиями, разворачивающимися в Грифонии, со смесью недоумения и страха. Доротеос Фезерин, или, как он привык себя называть, "Император Арантигос Второй", самопровозглашённый Бог, каким-то образом сумел завоевать всю развалившуюся Империю Грифонов и стать правителем рода грифонов. Теперь он обратил свой взор на нас и потребовал отдать нашу колонию Новый Мейрленд, которую Арантига считает "угрозой национальной безопасности". В случае отказа, арантийцы клянутся добиваться своих притязаний силой. Пацифисты предлагают нам отказаться от этих земель во имя мира, но действительно ли мы готовы бросить наших верных подданных на произвол судьбы?"
arantiga.161.a:0 "Мир – любой ценой."
arantiga.161.b:0 "Готовьтесь к войне!"
arantiga.162.t:0 "[FROM.GetName] сдаёт Новый Мейрленд"
arantiga.162.d:0 "Как и предсказывалось, слабые и трусливые [FROM.GetAdjective]ие пони не желают противостоять мощи легионов Арантигоса. Сегодня их дипломаты подписали договор, по которому они отказываются от всех прав на колонию Новый Мейрленд и передают эту территорию нам. Это поистине день великого триумфа нашей нации, поскольку мы вернули себе последний осколок старой империи Арантигоса."
arantiga.162.a:0 "Славная победа!"
arantiga.163.t:0 "Война за Новый Мейрленд"
arantiga.163.d:0 "Похоже, упрямым пони нужно преподать суровый урок. Армия Нового Мейрленда готовится защищать свои границы, а [FROM.GetAdjective]ий экспедиционный корпус готов оказать им поддержку. Однако, как и многие до них, они будет разбиты, и Арантига снова одержит победу!"
arantiga.163.a:0 "Вперёд! К победе!"
arantiga.164.t:0 "Поражение в Новом Мейрленде"
arantiga.164.d:0 "Несмотря на нашу доблестную оборону, [FROM.GetAdjective]ие войска оказались грозными противниками и одержали верх над нашей армией. После того, как наши дипломаты подписали унизительный мирный договор, остатки нашей администрации оставили Новый Мейрленд его новым хозяевам. Наше население восприняло известие об этом поражении негативно, но всё же не выступило против договора, поскольку продолжение конфликта в данный момент совершенно бессмысленно."
arantiga.164.a:0 "Vae Victis."
arantiga.164.b:0 "Мы будем сражаться до последнего пони."
arantiga.165.t:0 "Летние Острова Потеряны!"
arantiga.165.d:0 "Мы только что получили известие о том, что отряд [FROM.GetAdjective]их солдат высадился на Летних островах и без труда разгромил наш небольшой гарнизон. [FROM.GetAdjective]ий посол, когда его попросили высказаться по этому вопросу, просто сообщил нам, что эти острова теперь принадлежат им, а мы можем попытаться "делать с, что хотим". Ни генеральный штаб, ни население не считают, что за острова стоит умирать, но нам следует внимательно следить за тем, чтобы этот инцидент не стал предвестником более масштабного вторжения на наши территории в Кантерибских островах."
arantiga.165.a:0 "Возмутительно!"
arantiga.165.b:0 "Мы этого не потерпим!"
arantiga.166.t:0 "[FROM.GetName] требует Кантерибы"
arantiga.166.d:0 "Уже некоторое время адмиралтейство сообщает об активизации действий [FROM.GetAdjective]ого флота, захватившего ряд островов в Кантерибском бассейне, и предупреждает нас о вероятности военного столкновения. Теперь наши опасения наконец сбылись. [FROM.GetAdjective]ий посол предъявил нам ультиматум: [FROM.GetName] желает мирно получить все наши островные владения в южных морях, иначе они будут взяты силой. Мало кого волнуют жалкие деревенщины в Пуэрто-Кабальо, но стратегическое значение этих островов нельзя недооценивать."
arantiga.166.a:0 "Мы сдадим острова."
arantiga.166.b:0 "Готовьтесь к бою!"
arantiga.167.t:0 "[FROM.GetName] сдает Острова"
arantiga.167.d:0 "Как и ожидалось, трусливые [FROM.GetAdjective]ие правители решили подчиниться нашей просьбе, и их дипломаты сейчас подписывают договор о передаче нам всех их владений на Кантерибских островах. Хотя мало кто дома заботится об этих далёких клочках земли, этот день символизирует завершение Кантерибской кампании, закрепляя наше военно-морское господство в межконтинентальных водах."
arantiga.167.a:0 "Славная победа!"
arantiga.168.t:0 "Война за Кантерибы"
arantiga.168.d:0 "Нам только что сообщили, что [FROM.GetAdjective]ий флот покинул порт и движется к нашим войскам на юге. Судя по всему, [FROM.GetAdjective]ие власти решили защищать свои южные владения. Придётся показать им, что с нами шутки плохи."
arantiga.168.a:0 "Победа ждёт!"
arantiga.169.t:0 "Мирный договор Острова Юкка"
arantiga.169.d:0 "Столкнувшись с тяжёлыми потерями, мы вынуждены пересмотреть наши варианты. [FROM.GetAdjective]ий флот разгромил нас на море и теперь напрямую угрожает Эквусу. Хотя изначально Кантерибские острова мало кого волновали, наши недавние военные поражения вызвали гораздо большее потрясение, чем то, которое вызвала бы простая сдача островов. Чтобы предотвратить дальнейшую потерю общественного доверия, принятие [FROM.GetAdjective]их требований было избрано как наилучший вариант действий."
arantiga.169.a:0 "Овсянка!"
arantiga.169.b:0 "Мы не потерпим такого поражения!"
arantiga.170.t:0 "Абиссиния и Арантига"
arantiga.170.d:0 "Нас только что посетили дипломаты из Арантийской Империи – новой доминирующей державы в Грифонии. Нам предложили союз и возвращение всех территорий, населённых кошками, ранее принадлежавших Вингбардии, которые в итоге оказались под властью Арантиги, а также дальнейшую помощь в восстановлении нашей экономики после разрушений, причинённых Королём Шторма. Предложение кажется щедрым, а покровительство Арантиги обеспечит нашу безопасность от иностранных вторжений."
arantiga.170.a:0 "Мы согласны!"
arantiga.170.b:0 "Грифоны могут принести только горе."
arantiga.173.t:0 "Абиссиния в Гегемонии"
arantiga.173.d:0 "Абиссинцы решили присоединиться к Арантийской Гегемонии. Все бывшие вингбардийские колонии в этом регионе передаются нашим новым кошачьим друзьям. С нашим новым союзником мы сможем распространить свою власть на Западную Зебрику!"
arantiga.173.a:0 "Наше влияние растёт."
arantiga.172.t:0 "Абиссиния отказывается"
arantiga.172.d:0 "Кошки отклонили наше предложение, сославшись на желание сохранить нейтралитет и дистанцию от Грифонии. Тем не менее, кошачьи дипломаты были очень вежливы, и мы не видим причин для дальнейшего вмешательства в дела столь отдалённого региона."
arantiga.172.a:0 "Они могут делать, что хотят."
arantiga.123.t:0 "Империя солнца"
arantiga.123.d:0 "Мы только что получили дипломатическое послание из-за моря. Империя Арантига, новая могущественная держава Грифонии, решила пересечь океан и распространить своё влияние на Северную Зебрику. Теперь, покорив Макавию, Легионы Арантиги готовы вторгнуться в Гиппогрифию. Однако император Фезерин предлагает нам мирное решение. Если мы передадим Кольтфаген Арантиге, которую они считают "своей по праву, основанном на древней вражде предков", Арантига предоставит нам огромную сумму денег и предоставит место рядом с собой в качестве союзников и равных. Хотя многие считают это предложение оскорблением нашей национальной гордости, таким образом подлые кольтфагеняне станут чужой проблемой, и мы избежим конфликта со сверхдержавой размером с континент. Учитывая, насколько бесполезны кольтфагеняне в целом и насколько неуправляемым является регион, то, возможно, нам будет выгоднее обменять его на солидную сумму денег."
arantiga.123.a:0 "Мы принимаем предложение."
arantiga.123.b:0 "Что за нелепость!"
arantiga.124.t:0 "Гиппогрифия в Гегемонии"
arantiga.124.d:0 "Крэк Лайтнинг принял мудрое решение. Правительство Ариса только что подтвердило ратификацию договора и заключило союз с Арантигой. Вместе мы обеспечиваем себе владение Северной Зебрикой, и у нас есть ценный, пусть и немного эксцентричный, союзник в лице Гипогрифии."
arantiga.124.a:0 "Великолепно!"
arantiga.125.t:0 "Арис выбирает войну"
arantiga.125.d:0 "Похоже, гиппогрифы столь же смелые, сколь и глупые. Мы получили сообщение от Ариса, в котором просто говорится: "Мы не отдадим ни песчинки! Так что приходите и попытайтесь заполучить эту землю!" Что ж, мы сделаем так, как они хотят."
arantiga.125.a:0 "Кольтфаген БУДЕТ нашим!"
arantiga.126.t:0 "Укрощение Кольтфагена"
arantiga.126.d:0 "Это был долгий и неприятный день. За годы завоеваний и управления постоянно растущей Империей, Доротеос привык иметь дело с корыстными и часто бесталанными предателями, – проще говоря, коллаборационистами. Но их число всегда было довольно ограниченным, особенно когда речь шла о знаменитостях. Иногда агентам Арантиги приходилось активно искать грифонов, готовых выполнить их грязную работу... В Кольтфагене всё было иначе.\nС тех пор, как были раскрыты планы создания автономной администрации Кольтфагена, в канцелярию Его Величества начал приходить нескончаемый поток писем – каждое новое лестнее предыдущего. Ряды громких титулов, данных Арантигосу в этих письмах, превосходили даже проповеди в Имперском Храме. И, что ещё хуже, не все зебры довольствовались одними лишь письмами. Было немало претендентов, которые, подкупив чиновников, смогли пробраться во дворец, чтобы представить свою кандидатуру императору очно. Арантигосу посчастливилось пообщаться лишь с несколькими из них – и все эти встречи были настолько схожи, что ему запомнилась лишь первая: усатый (почему-то ВСЕ кольтфагенцы носили усы), самодовольный, стареющий зебра, говоривший на вингбардийском с жутким акцентом, исчерпывающе подробно описывал свой обширный опыт управления сложными регионами Восточного Кольтфагена, свои почти родственные связи с землевладельческой элитой, свой военный опыт, обожание к императору Арантигосу и "его славным завоеваниям", рассуждая, что всё это делает его идеальным губернатором Кольтфагена. Вся эта беседа оставила у Доротеоса тот самый неприятный привкус, который может возникнуть только при разговоре с существом, полностью лишенным каких-либо убеждений и прочных связей – настоящим политическим хамелеоном.\nОднако теперь нужно было сделать выбор. Через несколько дней посредник ССЕИВ доставил небольшую стопку досье на наиболее перспективных кандидатов на пост правителя Кольтфагена. Первая запись оказалась вдвойне удивительной: речь шла о том, с кем общался Доротеос, – судя по всему, у него действительно был разнообразный и обширный опыт, как гражданской, так и военной службы. Более того, ни его имя (Беноам), ни его фамилия (Герза) не начинались на "З" – что было ещё одной постоянной чертой, которую Арантигос заметил среди своих новых полосатых подданных. Он пробежал глазами остальные досье: Хирам З., дипломат; Йебзель З., генерал армии; Безелшазар З., алкоголик. Последнее досье позабавило императора: две "З" в одном лице – Зарон Зоррель, политик средней руки. Голова у Арантигоса гудела, он глубоко вздохнул и перевёл взгляд на карту кольтфагенских войн. В голове вспыхнуло имя: генерал Кратерус. Он же был наёмником в Зебрике и всегда с теплотой вспоминал о своей жизни в Кольтфагене. Хотя он, возможно, всё ещё нужен дома, разве управление Кольтфагеном не было бы той наградой, которую он всегда желал?"
arantiga.126.a:0 "Выбираю зебру без "З"."
arantiga.126.b:0 "Пусть будет зебра с двойной "З"!"
arantiga.126.c:0 "Кратерус заслужил это."
arantiga.127.t:0 "Просто хороший бизнес"
arantiga.127.d:0 "Я искренне надеюсь, джентльгрифы, что этот день станет началом новой главы в истории наших народов. Гиппогрифия и Грифония всегда имели много общего, и только теперь, под защитой арантийцев, мы наконец-то можем работать вместе, чтобы укрепить связи между нашими расами. Арис скоро станет жемчужиной в короне владений Арантиги в Зебрике, и я уверяю вас: гиппогрифы станут самыми доверенными подданными Императора Арантигоса. Пусть Вечное Солнце всегда сияет над Горой!" – Мунфезер завершил свою затянутую речь. Довольные улыбки озарили лица арантийских офицеров, приписанных к его свите для защиты. И не без оснований – автор речи оправдал заплаченные ему деньги, написав, пожалуй, самый длинный панегирик Арантиге и её императору. Под аплодисменты Мунфезер заметил нечто забавное: самую активную поддержку его речи оказали бывшие вингбардийские офицеры, по-видимому, пытавшиеся компенсировать своё позднее присоединение к делу Арантиги дополнительным рвением. Тем не менее, многие из них ранее получили значительные взятки, как и некоторые высокопоставленные грифоны в Имперском Казначействе. Когда Протекторат Арис только создавался, Мунфезер быстро предложил свою помощь молодому правительству, чем заслужил благодарность немалого числа перегруженных работой бюрократов. Следовало ожидать, что весть о его вкладе вскоре достигнет столицы Арантиги, и после официального представления Императору он был немедленно назначен Протектором. Дела шли... гладко, и Мунфезер ожидал, что его компании вскоре получат разрешения на работу в Грифонии, а благодаря, казалось бы, неисчерпаемому потенциалу Ариса он вскоре займёт уютное местечко в новом мировом порядке. Мунфезер не знал, как долго просуществует это абсурдное царство самопровозглашённого бога, но что бы ни случилось..."
arantiga.127.a:0 "...сам он всегда будет на высоте."
#
arantiga_decision.50.t:0 "Секреты Пентархии"
arantiga_decision.50.d:0 "До недавнего времени графством Баррад правили пять полубезумных-полугениальных магов. С самого начала их правления Баррад стал проклятой землёй, страдающей от магических катастроф, неестественной и разрушительной погоды, неконтролируемых экспериментов и периодических нападений разного рода приключенцев, а порой и волшебных битв между его правителями. В конце концов, большинство членов так называемой "Пентархии" перебили друг друга, а затем то, что осталось от их безумия, было, как мы надеемся, уничтожено гарнизоном Арантиги. Теперь Баррад, провинция, без которой мы бы прекрасно обошлись, стоит сломленный и заброшенный на окраине нашей Империи. Но до сих пор он хранит некоторые тайны, которые нам было бы выгодно раскрыть. Ходят рассказы об автоматонах, имитирующих жизнь грифонов, и о заклинаниях, мощь которых превосходит даже лучшие волшебства единорогов, машинах, способные преобразовывать реальность или открывать пути в миры за пределами нашего. Хотя многие из этих слухов, вероятно, сильно преувеличенны, в некоторых из них наверняка есть доля правды. Несомненно, всё, что можно найти в землях Баррада, можно направить на службу Арантиге и дальнейшему научному прогрессу Грифонии."
arantiga_decision.50.a:0 "Отправляйте экспедицию!"
arantiga_decision.51.t:0 "Изучение остатков"
arantiga_decision.51.d:0 "Энрико задумался, почему он снова согласился присоединиться к экспедиции. Его лаборатория в Карфине была теплой, уютной и просторной. Прямо через дорогу был даже хороший ресторан, где подавали вкуснейшие макароны. Всё это он бросил, потому что ему наскучила повседневная рутина...\nИ тут тёплые воспоминания о Вингбардии смёл внезапный порыв неестественно сильного ветра. Погода в Барраде была более чем неприятной: непредсказуемая и экстремальная, она словно стремилась превратить жизнь исследователей в сущее страдание. Энрико инстинктивно прикрылся полой плаща. Он стоял у входа в то, что когда-то было совершенно неуместным храмом зебр, украшенным в манере, которую можно назвать только безумной, а теперь это здание почти разрушилось, несмотря на то, что было заброшено всего несколько лет назад. Казалось, сама природа пыталась стереть это нечестивое сооружение с лица земли. Большинство артефактов и оставшиеся внутри писания были непонятны грифонам. К счастью, им удалось нанять Жуава, специалиста по магии зебр из Казы. Однако с каждой новой открытой комнатой храма, зебра, поначалу болтливый и дружелюбный, становился всё более угрюмым, проводя часы за изучением надписей на стенах, мало что объясняя и говоря, что ему нужно больше времени, чтобы сложить всё воедино.\nЭнрико тихо вздохнул и снова вошёл в храм. Большая часть его команды была занята сбором различных алхимических артефактов, разбросанных по уже очищенным комнатам. Они наверняка пригодятся в исследовании секретов магии зебр. Однако Жуава нигде не было видно. Быстрый осмотр показал, что он углубился в храм, чтобы проверить двери, которые им ещё не удалось открыть. Заскучав, Энрико решил последовать за ним. К его удивлению, огромные металлические двери, покрытые символами на одном из языков зебр, были... открыты. Внутри находилось нечто, напоминающее алтарь, полки, полные книг и свитки – и Жуав – в центре зала, выливающий какую-то жидкость из огромной канистры... Запах говорил сам за себя – это был бензин.\n"Подождите!" – закричал Энрико – "Что вы делаете?!"\n"Защищаю вас всех," – спокойно ответил зебра – "Осванангу нельзя освободить! С тех пор, как я впервые нашел упоминание этого имени, я знал, что нужно делать".\n"О чём вы говорите? Что такое Освананга? Что это за место?"\n"Лучше не знать. Некоторые знания могут стать проклятием". С этими словами зебра вылил на себя остатки топлива. Энрико бросился вперёд, но прежде чем он успел что-либо сделать, полосатый безумец уронил на землю маленькую бутылку. В одно мгновение всё помещение охватило пламя. Жуав издал ужасающий вопль, умирая страшной смертью, и через несколько мгновений рухнул на пол, а его тело неестественно быстро расплылось по полу. Энрико убежал, зовя на помощь, но команда не смогла остановить огонь, который начал распространяться на другие помещения храма. Им едва удалось спасти те немногие артефакты, которые они уже обнаружили, прежде чем огонь поглотил всё, что осталось внутри."
arantiga_decision.51.a:0 "Проклятые суеверные зебры!"
arantiga_decision.52.t:0 "Обследование завершено"
arantiga_decision.52.d:0 "Проект "Возрождение" — Краткий отчёт\nИсследовательские группы завершили обследование бывших магических построек в Барраде. Большинство из них серьёзно пострадали как во время боевых действий в регионе, так и под воздействием местных погодных явлений. Мы также зафиксировали несколько нападений со стороны местных жителей на эти здания, которые они связывают со своими бывшими повелителями. В связи с этим, добытая информация частична, а исследовательские материалы скудны. Самый перспективный объект принадлежавший зебре-магу, известному как "Асинти", был уничтожен вышедшим из-под контроля исследователем. Несмотря на все неудачи, нам удалось восстановить данные о трёх потенциально полезных достижениях Баррадской Магократии: прозрачном металле, который значительно улучшит наши промышленные возможности, концентрационной смеси, которую уже запросили военные для испытаний в качестве стимулятора, и заклинании Эббы Эдберг "отрицательный воздух", которое может снизить расходы на обслуживание нашего оборудования. В связи с серьёзной нехваткой артефактов, необходимых для исследований, и риском их уничтоженияв в ходе экспериментов по восстановлению методов производства, мы способны завершить лишь один из этих проектов.\nВ ходе исследования мы также обнаружили местонахождение одного занятного объекта. Вся имеющаяся у нас информация позволяет предположить, что на там содержится примитивный, но полностью функциональный магиатомный реактор. Мы должны изучить его, чтобы понять, как Пентархии удалось совершить такое инженерное чудо, опередив всех в мире."
arantiga_decision.52.a:0 "Прозрачный металл."
arantiga_decision.52.b:0 "Смесь концентрации."
arantiga_decision.52.c:0 "Отрицательный воздух."
arantiga_decision.53.t:0 "Раскопки реактора"
arantiga_decision.53.d:0 "Территория вокруг реактора превратилась в небольшой военный лагерь. Исследователям из ИИИ помогал значительный контингент элитных легионеров, призванных обеспечивать их безопасность. Поскольку Баррад всё ещё оставался практически нетронутым регионом, грифонам приходилось иметь дело как с местными жителями, так и с некоторыми сверхъестественными угрозами. Объект нашли быстро. Хотя его давно никто не обслуживал, это всё ещё был полностью рабочий магиядерный реактор... По крайней мере, так казалось поначалу. Исследователей поразила конструкция устройства, они назвали его невероятным, опережающим своё время – настоящее чудо маготехники. Однако до первого запуска ему предстояло пройти множество испытаний.\nОдинокий грифон продолжал писать. Звуки вокруг и внутри него мешали сосредоточиться. Но это было важно. Он не должен был ничего забыть.\n"Всё началось с этих снов, которые никто не мог пересказать. Но каждое утро мы просыпались беспокойными, с чувством тревоги и ужаса. Через несколько дней воспоминания об этих снах стали неотступно преследовать нас – как бы мы ни старались их забыть. Это были сны о страхе, предательстве и поглощении высшей силой. Марко, Серхио и Яннис исчезли, и никто не смог их найти. На следующей неделе один из охранников не выдержал и открыл огонь по своим товарищам, после чего застрелился. В последние мгновения своей жизни он кричал о жутких голосах в голове. Вскоре их начали слышать и другие, – и я тоже. Охранники бродили бесцельно, словно их разум был опустошен. Мы взялись за реактор. Наше оборудование оказалось полезным. Оно позволило нам полностью отремонтировать его и вновь зажечь его сердце. Только те, кто по-настоящему прислушивается к Голосам, могут постичь величие грядущего. Скоро всех заставят слышать и понимать".\nГрифон опустил коготь в стакан с кровью. Это была хорошая кровь. Он уже пробовал трёх других грифонов и одного пони, но только у этого был правильный состав, правильная текстура. Голоса становились громче. Гул нарастал."
arantiga_decision.53.a:0 "Реактор просыпался."
arantiga_decision.54.t:0 "Кризис в Барраде"
arantiga_decision.54.d:0 "У нас чрезвычайная ситуация! Мы потеряли связь с исследовательской группой реактора Баррада, а затем и с их оборонительным полком. Сначала мы предположили диверсию иностранной разведки, нападение партизан речных пони и разгневанных местных жителей. Однако несколько волшебников в этом районе сообщили об усилении магической активности, назвав её "тревожной". После этого мы потеряли связь с близлежащими гарнизонами. На следующий день солдаты этих гарнизонов в сопровождении огромных толп местных крестьян взяли штурмом нашу главную военную базу в регионе, игнорируя полученные в бою раны. База и весь её личный состав были потеряны, и мы были вынуждены полностью отступить из региона. В настоящее время мы оцениваем характер угрозы и мобилизуем местные легионы для её сдерживания."
arantiga_decision.54.a:0 "Что происходит?!"
arantiga_decision.55.t:0 "Безумие распространяется"
arantiga_decision.55.d:0 "Мы столкнулись с чем-то, что похоже на полномасштабную магическую катастрофу. Наши эксперты убеждены, что вражеские силы в Барраде находятся под неким контролем разума, и им не удалось найти средство против него. Зона массового гипноза медленно расширяется и уже охватывает несколько крупных городов и деревень. В эпицентре этой зоны находится магиядерный реактор, который, как мы предполагаем, является источником заклинания. Насколько нам известно, десятки тысяч местных жителей вскоре могут наступить на соседние регионы. Несколько гарнизонных бригад Имперских Легионов были разгромлены или полностью уничтожены. Зачарованные, несмотря на впечатляющую координацию, похоже, слабо разбираются в современной военной стратегии и пользуются только оружием, добытым в боях с нашими войсками, что в обычных условиях гарантировало бы нам быструю победу. Однако, причина их быстрого продвижения заключается в том, что магические погодные явления усиливаются по всему Барраду, ограничивая наши возможности. Несколько районов полностью опустошены, местная инфраструктура разрушена, а население сократилось вдвое. Попытки бомбить реакторный комплекс провалились. Воздушная разведка завершилась успешно, но суровые погодные условия привели к потере множества самолётов. Эскадрилья бомбардировщиков сумела достичь цели, но за несколько мгновений до попадания бомб реактор окружил себя неким магическим барьером, полностью нейтрализовав весь ущерб. В свете этих событий генеральный штаб подготовил план операции "Стилет". Экспериментальная боеголовка, способная пробить магический щит вплоть до городских масштабов, будет собрана и доставлена в Баррад, а тяжёлый бомбардировщик будет усилен, чтобы пережить полёт. До тех пор легионы будут сдерживать продвижение зачарованных."
arantiga_decision.55.a:0 "С этим нужно разобраться быстро!"
arantiga_decision.56.t:0 "Операция "Стилет""
arantiga_decision.56.d:0 "Казалось, сами небеса решили помешать бомбардировщику достичь цели. Ветер, молнии и явления, ещё не описанные в научной литературе, безжалостно обрушивались на самолёт. Тем не менее, тяжёлый бомбардировщик продолжал лететь вперёд. Судя по приборам, они приближались к цели.\n"Готовь бомбу!" — крикнул пилот – "Прибытие через десять минут!" Двое других членов экипажа направились к хвостовой части самолёта, где на держателе покачивалась гигантская бомба, словно готовая вот-вот вырваться на свободу. Её огромный корпус был покрыт замысловатыми магическими символами и острыми кристаллами, призванными разрушить энергетические поля и пробить любую магическую защиту. Два грифона методично проверяли как обычные, так и магические приборы.\n"Готово!" – прокричал один из них сквозь рёв двигателей – "Запуск по команде!".\nПрошло десять минут. Реактор был прямо под ними. Пилот раскрыл клюв... И ничего не сказал. Его разум внезапно лишился всех мыслей – остался только всепоглощающий Голос. Грифон покачал головой. Нет. Ничего. Только жуткое чувство...\n"Сброс!"\nПервый бомбардир дернул рычаг. Открылся бомбоотсек. Второй нажал кнопку, и огромная бомба начала свой долгий путь вниз... Через несколько секунд боеголовка пробила защитный экран, поразив реакторный комплекс. Взрыв уничтожил всё сооружение. А затем последовал второй, гораздо более мощный, магический взрыв, проделавший огромную дыру на месте реактора и сотрясший улетающий бомбардировщик. Его отзвуки разнеслись на десятки миль. Зачарованные рухнули на землю, корчась от боли и крича, а голоса в их головах наконец затихли.
arantiga_decision.56.a:0 "Кошмар закончился..."
arantiga_decision.57.t:0 "Отчёт ССЕИВ – Проект "Возрождение""
arantiga_decision.57.d:0 "§RТолько для глаз Его Императорского Величества§!\n\nОперация "Стилет" завершилась успешно. Боеголовка пробила купол и поразила реактор, который далее был уничтожен магиядерным взрывом. Подобный взрыв никогда ранее не наблюдался и, вероятно, никогда не будет повторен. С уничтожением реактора мы потеряли возможность раскрыть секреты его работы. Магически нестабильная зона катастрофы, будет изолирована военными и взята под строгий контроль для обеспечения безопасности прилегающих территорий. Выжившие зачарованные жители и солдаты вернулись в нормальное состояние и не помнят о времени, проведенном под контролем разума. Чтобы исключить любую угрозу, которая может исходить от них, мы продолжим наблюдение в течение следующих шести месяцев (полное медицинское заключение см. в Приложении А). Вся информация об инциденте засекречена под уровнем допуска "ОМЕГА", а для СМИ была подготовлена история о взрыве устройства Судного дня Пентархии, предназначенного для уничтожения мира в случае их поражения. До инцидента в ИИИ было отправлено несколько исследовательских отчётов. Хотя природа самого реактора остаётся неизвестной, нам удалось совершить прорыв в понимании магихронического континуума.\nПроект "Возрождение" окончен. Все сохранившиеся артефакты и исследовательские отчёты из Баррада были уничтожены по приказу Его Величества. Технологии, разработанные на основе результатов проекта "Возрождение", будут отнесены к другим исследовательским проектам с надлежащей поддельной документацией."
arantiga_decision.57.a:0 "Общественность не может узнать правду."

#DECISION EVENTS
arantiga_decision.1.t:0 "Новое имя для Карфина?"
arantiga_decision.1.d:0 "Теперь, когда бывшая столица Вингбардии в наших когтях, возможно, пришло время продемонстрировать наше превосходство и переименовать город, чтобы он стал напоминанием для тех, кто когда-либо осмелится выступить против нашего божественного монарха...\n\nКак мы его назовём?"
arantiga_decision.1.a:0 "Он будет называться... Доротеополис!"
arantiga_decision.1.b:0 "В честь нашей родины: Арантига!"

arantiga_decision.10.t:0 "Уход в отставку"
arantiga_decision.10.d:0 "Добро пожаловать, Брайт Глоу. У меня мало времени на разговоры, но что привело вас в мой кабинет?" — спросил Хайрих. Он явно был очень занят: его стол был завален бумагами и конвертами. "Надеюсь, с Готтерхаммером всё хорошо?"\n\nБрайт Глоу нервно улыбнулся представителю ИИИ и сел перед ним. "Эм, насчёт этого... Проекту конец."\n\nХайнрих на секунду застыл, отложил планшет и с любопытством вгляделся в собеседника.\n\nБрайт Глоу продолжил: "Наши исследования столкнулись с препятствием, и мы не можем продолжать. Проблемы возникают там, где мы даже не могли о них предполагать, и все наши решения, похоже, не работают. Другого пути нет. А это значит, что проект полностью провалился".\n\nХайнрих смотрел на Брайт Глоу с непониманием, но тут его осенило. "Это... отстой. Арантигос точно не обрадуется. Деньги, в конце концов, не растут на деревьях. Лучше бы тебе скрыться, друг мой. Император не любит провалы".\n\nБрайт Глоу кивнул. "Мы с коллегами уже подготовились к такому повороту событий. К завтрашнему дню мы пропадём".\n\n"Хорошо, хорошо. Я всегда знал, что вы смекалистые ребята. Возможно, это наша последняя встреча, так что удачного тебе путешествия!"\n\nПони и грифон встали, и Хайнрих проследил за тем, как Брайт Глоу исчезает в коридоре. И действительно, на следующий день пришел ордер на арест, но к тому времени его след уже простыл. Позже, когда проект закрыли, некоторые его исследования оказались полезными для разработки более традиционной атомной бомбы."
arantiga_decision.10.a:0 "Бедный парень..."

arantiga_decision.101.t:0 "Смерть мечты"
arantiga_decision.101.d:0 "Вчера ночью столицу потряс взрыв, и здания проекта "Готтерхаммер" прекратили своё существование. К счастью, возникший пожар удалось быстро взять под контроль, и в округе никто не пострадал. После того, как офицеры секретной службы оцепили территорию, была проведена спасательная операция. Изначально главной целью было просто извлечь как можно больше материалов исследований, но по мере того, как спасатели продвигались всё глубже в руины зданий, они начали находить грифонов и пони, которые пережили взрыв. После раскопок, продолжавшихся не менее двух дней, они обнаружили заместителя директора Готтерхаммера и личного друга Брайт Глоу Антуана.\n\n"Я... я не знаю, что произошло. Я работал всю предыдущую ночь, так что голова ужасно болела". Словно в подтверждение своих слов, грифон помассировал голову. "Честно вам скажу, я мало что помню. Но сегодня Брайт Глоу должен был наконец-то проверить свою теорию о сжиженной магической энергии, и я помню, какое беспокойство царило вокруг моих коллег. Видимо, их волновали примеси в кристаллах и то, как эти примеси могут дестабилизировать реакцию. Уф... Я тоже там был," — он указал на руины — "но голова так болела, что я попросил ассистента заместить меня. Я пошёл в ванную, чтобы умыться, и вдруг... меня завалило бетоном".\n\nИз руин удалось извлечь значительную часть научных данных, но после смерти команды Готтерхаммера, за исключением Антуана, проект закрыли."

arantiga_decision.11.t:0 "Проект "Готтерхаммер""
arantiga_decision.11.d:0 "С самого начала кристаллы использовались для подпитки заклинаний, проведения сложных ритуалов и создания мощных артефактов, и даже с развитием науки и промышленности их значение только продолжило расти. Грифоны в значительной степени не могли полностью реализовать потенциал кристаллов из-за ограниченных магических способностей. Однако с завоеванием Аквелии мы также получили значительное число талантливых пони-ученых. С их помощью мы могли бы развить собственную программу атомных исследований и, возможно, создать магическую атомную бомбу — или, короче, магиатомную бомбу — задолго до того, как это смогут сделать наши враги. Конечно, учитывая наш прежний статус вассала короля Вингбардии, наша атомная программа практически не существует, а это значит, что нам придется использовать то, к чему пришли страны, которые мы завоевали.\n\nИз всех атомных исследований, которые вела Аквелия, один из них особенно привлёк наше внимание, поскольку он не был связан с разработкой обычной атомной бомбы и продвинулся дальше всех – пусть и не так далеко, как хотелось бы. Под руководством известного физика-единорога из Университета Аквилы Брайт Глоу, команда предлагает принципиально новую теорию. Традиционно учёные предполагали, что такая бомба будет работать на магических кристаллах и уране, причём уран послужит неотъемлемым катализатором. Но Брайт Глоу считает, что при определённых условиях, энергия, содержащаяся в кристаллах, становится текучей и может передаваться по мере необходимости, без необходимости использования сложной системы мегазаклинаний или потенциально канцерогенного катализатора. Это привело к тому, что проект привлёк огромный интерес со стороны правительства Аквилеи, и теперь команда продолжит работу над ним под нашим руководством."

arantiga_decision.12.t:0 "Первый отчёт проекта "Готтерхаммер""
arantiga_decision.12.d:0 "УРОВЕНЬ ДОПУСКА: A\n\nЕженедельный отчёт о ходе работ № 1\nПроект "Готтерхаммер"\nВ соответствии с волей Императора Арантигоса II, проект "Готтерхаммер" (КОДОВОЕ НАЗВАНИЕ: ПЕРВЫЙ ХРАМ) получил разрешение. С этого момента ИИИ (Имперской исследовательской инициативы) будет предоставлять финансирование и ресурсы для проекта ПЕРВЫЙ ХРАМ по усмотрению начальника отдела кадров ИИИ. Брайт Глоу и его коллеги (список лиц, участвующих в проекте ПЕРВЫЙ ХРАМ, см. в приложенных документах) уже доставлены на место испытаний. Всё необходимое оборудование и персонал (список оборудования, задействованного в проекте ПЕРВЫЙ ХРАМ, см. в приложенных документах) уже доставлены на выбранное место, расположенное в XXXXXX, вблизи Имперской столицы.\n\nОТЧЕТ\nХайнрих Эссен, представитель ИИИ, удостоверение личности №123495 (подробнее см. в приложении "Список сотрудников ИИИ")\n"Работа над проектом идёт успешно. Брайт Глоу и его коллеги хорошо освоились. Они потратили день на освоение новой лаборатории и знакомство с персоналом на объекте. На следующий день из XXXXXX (подробнее см. в приложении "Извлечение кристаллов в Арантиге") прибыли первые кристаллы, и они вплотную приступили к работе. Устные беседы с Брайт Глоу, похоже, указывают на подтверждение их прежних теорий. Однако они провели всего неделю (фактически шесть дней) испытаний и экспериментов, и по мере развития проекта ситуация может измениться".\n\nБолее подробный отчёт см. в записи №235 Журнала сотрудника ИИИ №123495"
arantiga_decision.12.a:0 "Бюрократия, бюрократия..."

arantiga_decision.13.t:0 "Запретный плод познания"
arantiga_decision.13.d:0 "Хайнрих, представитель ИИИ в Готтерхаммере, передал сегодня запрос начальнику ИИИ. Он поступил от Брайт Глоу, который специально попросил, чтобы запрос был направлен непосредственно начальнику в обход системы. Выслушав объяснения Хайнриха, начальник понял, почему Брайт Глоу приложил все усилия, чтобы запрос попал к нему так срочно: сложилась нелепая ситуация. С недавних пор результаты испытаний команды Готтерхаммера стали непредсказуемы. По-видимому, это было вызвано редко возникающем аспектом магического переноса, который проявляется только в очень специфической среде.\n\nБрайт Глоу был уверен, что существует подробное объяснение механизма произошедшего, но его нет в каких-либо грифоньих архивах – и в этом он был прав. Он взялся за поиск недостающих знаний и, связавшись с коллегами по всей Грифонии, установил существование книги, причём даже конкретной страницы, где описывалось явление, поставившее команду Готтерхаммера в тупик. Проблема была в одном: книга была в Кантерлоте, и право на её прочтение выдавалось строго ограниченному кругу лиц. Несколько телефонных звонков от шефа подтвердили это, и, похоже, единственным способом получить эти знания оставалась кража книги. Секретная служба ухватилась за эту возможность, но окончательное решение остаётся за директором ИИИ."
arantiga_decision.13.a:0 "Знание — сила, выкрадите эту книгу!"
arantiga_decision.13.b:0 "Обойдётся. Это просто смешно..."

arantiga_decision.14.t:0 "Дерзкий налёт"
arantiga_decision.14.d:0 "План был прост. Альберт должен был подлететь к определённому окну, которое никогда не открывалось, и проникнуть в Королевскую библиотеку Кантерлота. Внутри он должен был найти книгу "Основы утраченных чудес" Старсвирла. Его машина должна была стоять заведённой как можно ближе к окну, готовая умчаться за горизонт, после чего книгу доставили бы в Готтерхаммер через консульство Арантиги в Кантерлоте.\n\nВсё шло как по маслу. Он припарковался у оживлённого бара и дождался полуночи, прежде чем приступить к делу. В чёрном комбинезоне и с отмычками в когтях Альберт взлетел к окну на 45-м этаже замка и начал взлом. Не учтено было лишь то, что окно поддерживалось в отличном состоянии – столь эффективна была Администрация Кантерлота – и замок не поддавался. В конце концов, стекло пришлось разбить. Книжные полки были удобно размечены цветами и ярлыками, так что Альберту не потребовалось много времени, чтобы найти то, что он искал. Он направился к окну, но столкнулся со стражником, который проснулся от звука разбитого стекла. К счастью, он был слишком сонный, чтобы прицелиться или правильно произнести заклинание, и его удалось вырубить после короткого боя. Альберт, покрытый осколками стекла и кровью, добрался до машины и скрылся с книгой. Через пять дней она оказалась у Брайт Глоу, который теперь жадно поглощал все знания, содержащиеся в ней."
arantiga_decision.14.a:0 "Всё прошло по плану... почти всё."

arantiga_decision.15.t:0 "Качество превыше количества"
arantiga_decision.15.d:0 "Глава ИИИ снова получил запрос от Хайнриха относительно качества кристаллов. Изучив книгу, украденную из Эквестрии, Брайт Глоу пришёл к выводу, что чистота кристаллов, добытых нами для проекта, недостаточна. Согласно его объяснению, чтобы кристаллы были совместимы с другими, они должны быть абсолютно свободны от примесей. В связи с этим, он порекомендовал несколько кристаллов, принадлежащих известному аквелийскому коллекционеру. Он уже лично обращался к грифону, но тот не хотел их продавать. Похоже, что задача по добыче ресурсов снова ложится на Секретную службу, чей командир с большим энтузиазмом относится к этой миссии."
arantiga_decision.15.a:0 "Хорошо, ещё одна миссия..."
arantiga_decision.15.b:0 "Обойдётся. Мы же не боги..."

arantiga_decision.16.t:0 "Выжимая максимум"
arantiga_decision.16.d:0 "Сегодня в Аквиле была проведена грандиозная операция под ложным флагом. Так называемое "Аквелийское Сопротивление" организовало нападение на известного коллекционера магических кристаллов. В хаосе сражения, агенты Секретной службы разграбили дом коллекционера, забрав все кристаллы достаточной чистоты для проекта "Готтерхаммер". Конечно же, все грифоны из "Аквелийского Сопротивления" были явно арантийцами, но наши агенты украли только то, что им было нужно, и ничего больше. Никто ведь не может нас подозревать, верно?"
arantiga_decision.16.a:0 "Верно?"

arantiga_decision.17.t:0 "Троица"
arantiga_decision.17.d:0 "Итак... позвольте уточнить. Вы хотите перенести проект? Почему? — спросил Хайнрих. Он и Брайт Глоу разговаривали в его кабинете.\n\n"Ну, кристаллы — не самые... стабильные источники магической силы в тех условиях, которым нам приходится их подвергать. Это означает, что очень высока вероятность... несчастного случая". Видя тревогу на лице Хайнриха, Брайт Глоу поспешил успокоить его: "Никаких рисков! Мы всегда соблюдаем самые строгие меры безопасности, и я бы доверил свою жизнь каждому в Готтерхаммере. Но такая жидкая бомба как наша жутко нестабильна... Полагаю, это исключает необходимость в сложном механизме детонации, что упрощает её подрыв. В любом случае, теперь, когда мы переходим к более крупным кристаллам с большим запасом магической силы, я просто подумал, что было бы разумно перенести исследования в более... отдалённый регион".\n\n"Уже приметили что-нибудь? Слышал, Шайсвальд в это время года прекрасен!" — сказал Хайнрих, посмеиваясь.\n\nБрайт Глоу, тем временем, сделал серьёзное лицо: "Именно то, о чём я и думал. Там уже разрабатываются обширные месторождения кристаллов, что облегчило бы логистику. Новые дороги там ведь не повредят? Удалённое расположение также должно развеять те "проблемы безопасности", которые эти ребята из Секретной службы поднимают на наших ежемесячных совещаниях."\n\nТеперь, когда Брайт Глоу объяснил свои доводы, переезд в Шайсвальд уже не казался таким нелепым, как раньше..."
arantiga_decision.17.a:0 "Возможно, оно и к лучшему..."

arantiga_decision.18.t:0 "Уничтожение "Первого храма""
arantiga_decision.18.d:0 "По желанию Брайт Глоу, в отдалённой части Шайсвальда был построен крупный исследовательский центр. Официальная причина — скрыть наш проект от посторонних глаз, но нам Брайт Глоу объяснил, что это для защиты мирных жителей от возможного спонтанного взрыва. Это решение, как оказалось, спасло тысячи жизней в нашей столице.\n\nКоманда Готтерхаммера серьёзно недооценила нестабильность жидких кристаллов. Вскоре после того, как кристаллы были подготовлены к передаче энергии, защитное магическое поле, окружавшее их, не сдержало бурную хаотичную энергию. По крайней мере, так считают наши исследователи, потратившие несколько дней на изучение предыдущих отчётов проекта и осмотр большого кратера, оставшегося после взрыва, уничтожившего значительную часть Шайсвальдского леса и несколько близлежащих поселений. Судя по всему, катастрофа произошла только сейчас, после месяцев экспериментов, поскольку чистота кристаллов играла важную роль в снижении нестабильности. Но, в конце концов, даже самые чистые кристаллы в мире не помогли. Сообщается, что взрыв был слышен даже в Грифенхейме, жителей которого не убедило наспех подготовленное объяснение, что звук произвело древнее заклинание-ловушка, на которое наткнулись старатели... Как ни странно, кратер и его окрестности вскоре покрылись кристаллическими самородками. Проект будет закрыт в связи с доказанной невозможностью контролировать жидкие кристаллы. Тем не менее, наши оставшиеся учёные-ядерщики считают, что мы можем использовать некоторые наработки, но их следующий прототип ядерной бомбы точно не будет основан на технологии жидких кристаллов."
arantiga_decision.18.a:0 "Мы скорбим по погибшим... и да, добудьте эти кристаллы!"

arantiga_decision.201.t:0 "В огне"
arantiga_decision.201.d:0 "Ферручио проснулся не от звона будильника, а от продолжительного стука во входную дверь. Открыв дверь, он увидел измученного пожарного, покрытого сажей с головы до лап. Он сообщил, что здание Панацеи сгорело дотла посреди ночи. Пожарным пришлось потратить несколько часов, чтобы предотвратить распространение огня, и они решили переложить все расходы на ИИИ. Увидев, в каком состоянии находится пожарный, Ферручио не оказал сопротивления. Когда тот ушёл, Ферручио задумался о причине пожара. Его предположение позже стало официальным объяснением: маариты сожгли свою работу, чтобы её не использовали против них в ходе расследования. Впрочем, это неважно, ведь ни от них, ни от их теорий, не осталось и следа."
arantiga_decision.201.a:0 "Они были на шаг впереди."

arantiga_decision.202.t:0 "Расследование"
arantiga_decision.202.d:0 "Сегодня инспектор посетил здание "Панацеи", чтобы собрать больше улик против мааритов. Учитывая их связь с проектом, казалось естественным, что они нашлись бы именно здесь. Инспектор и семеро его сотрудников вошли в здание и начали обыскивать каждый уголок. Они не обнаружили ничего необычного, ведь вся действительно ценная информация была в журналах.\n\nСегодня мы приближаемся к завершению проекта "Инферно". Сегодня мы на шаг ближе к спасению мира. Мы завершим то, что начал Зобрист.\nДа здравствует Маар!\n\n - Дневник Хорена Боргрифа, [GetDateText]\n\nОднако, когда они заканчивали обыск, кто-то бросил в здание ангриверский коктейль, отчего оно загорелось. Инспектор осознал это слишком поздно, но им удалось сбежать с несколькими флаконами и документами."
arantiga_decision.202.a:0 "Было близко!"

arantiga_decision.21.t:0 "Проект "Панацея""
arantiga_decision.21.d:0 "Даже в наши дни огромное количество наших собратьев-грифонов заболевает и умирает даже от самых лёгких болезней. Один только грипп ежегодно заражает миллионы существ. Есть также множество других болезней, как искусственных, так и естественных, которые представляют серьёзную угрозу для грифонов во всём мире. В настоящее время лучшие методы лечения основаны на магии – именно поэтому в Эквестрии система здравоохранения гораздо лучше, чем в большей части Грифонии. И даже не учитывая необходимость в опытном маге, требуются годы, прежде чем появится заклинание, способное вылечить новые болезни.\n\nГруппа исследователей из Университета Гринбека предложила создать магически изменённый микроб, который станет так называемым "универсальным лекарством", способным вылечить любую болезнь, независимо от её тяжести, летальности и возраста пациента. Команда также высказывает предположение, что этот микроб будет способен вылечить рак и другие генетические заболевания.\n\nХотя это изобретение окажет огромное влияние на гражданский сектор, нас больше всего волнует сокращение потерь среди солдат в районах с высоким уровнем заболеваемости и повышение защиты от возможной биологической атаки в будущем."
arantiga_decision.21.a:0 "Запустить проект!"

arantiga_decision.22.t:0 "Странности Учёных"
arantiga_decision.22.d:0 "Послушайте, я работал со многими учёными, шеф", - сказал Ферручио, представитель ИИИ в команде "Панацеи".\n\n"Именно поэтому вас выбрали на должность представителя", - ответил руководитель ИИИ – "Учёные своеобразны, я понимаю. Так было всегда и всегда так будет. Такими их делает работа."\n\n"Согласен с вами! Но эти ребята другие. Они отличаются от остальных. За все годы работы я не встречал учёного, который бы сознательно отказался от помощи, о которой сам просил. Учёных-пацифистов сейчас пруд пруди, но будь они пацифистами, они бы не работали в ИИИ".\n\n"И как же они "отказывались" от нашей помощи?"\n\n"Видите ли, они получили ресурсы и финансирование, которые мы им предоставили, обосновались в своей лаборатории, – и с тех пор наотрез отказались пускать в неё кого-либо из ИИИ. Новые отчёты ложатся мне на стол каждый день, но никто из нас не видел лабораторию изнутри с тех пор, как они её заняли. Я немного покопался в их подноготной, и, похоже, большинство членов команды Панацеи были связаны с видным мааритом–"\n\n"Только не вы со своими мааритами!" — воскликнул Шеф.\n\n"–философом Мартином Зобристом", — закончил Ферручио.\n\n"Зобрист? Разве не он предлагал очистить мир с помощью вируса? И что такого плохого в мааритах?\n\nФерручио усмехнулся: "Да, Зобрист действительно был основоположником теории Всесожжения, но он умер несколько лет назад. Моя проблема с мааритами в том, что их учение заключается в том, что существа должны умирать. Маар, в конце концов, - Бог Смерти, и он требует жертв. Команда Панацеи имеет доступ к большей части биологических запасов Арантиги, и они вполне могут создавать ту самую болезнь, которую мы пытаемся вылечить!"\n\nШеф вздохнул: "Если вы считаете, что так будет лучше, я подготовлю официальное расследование в отношении команды..."\n\n"Но они же узнают!" — возразил Ферручио.\n\n"Ну и что, по-вашему, мне делать? Я знаю, что у вас нет денег, чтобы начать частное расследование, и я точно не собираюсь жертвовать благополучием своей семьи ради ваших безумных предположений"."
arantiga_decision.22.a:0 ""Я продолжу наблюдение"."
arantiga_decision.22.b:0 ""Ладно, начинайте официальное расследование"."

arantiga_decision.23.t:0 "Загадочные средства"
arantiga_decision.23.d:0 "Опять, Ферручио? Только давай без культа мааритов", — раздраженно сказал начальник ИИИ в телефонную трубку.\n\n"Ну... вам не повезло, — ответил Ферручио. — Подождите! Не отключайтесь!"\n\n"Давай быстрее, у меня не так уж много времени".\n\n"Мы оба знаем, что никакие прогнозы и графики никогда не бывают точными, и что у проектов часто заканчиваются деньги – особенно у научных. Именно поэтому ИИИ всегда готова пустить в дело резервный фонд. Вот только этот проект почти не требовал никаких расходов. Я только вчера проверил склад, и на нём не осталось никакого оборудования – ни одной чашки Петри или тампона. Тем не менее, отчёты на моём столе не свидетельствуют о каких-либо недостатках. Это, естественно, возбудило во мне подозрения–"\n\n"Ну, конечно, ты возбудился" — съязвил Шеф.\n\n"–и я решил провести расследование. Когда они вышли, я проник в их лабораторию, и, как я и подозревал, она была полностью укомплектована. Я записал название производителя их оборудования и сбежал. Проверив компанию, я обнаружил, что её владелец, предположительно, маарит. Совпадение? Не думаю".\n\n"Ферручио, это просто смешно. Кто-то сказал тебе, что он маарит – и ты поверил? Ты снова был в таверне?"\n\n"Ха-ха, очень забавно" — ответил Ферручио.\n\n"И что ты хочешь, чтобы я сделал? Либо ты закроешь на это глаза, либо я начну официальное расследование. Решай"."
arantiga_decision.23.a:0 ""Вы правы, улик недостаточно.""
arantiga_decision.23.b:0 ""Мы поймаем их с поличным, Шеф!""

arantiga_decision.24.t:0 "Странное совпадение"
arantiga_decision.24.d:0 ""Шеф! Шеф!" — закричал Ферручио, так машущий лапами, будто он пытался остановить такси на оживлённой улице. Он встал перед шефом, дыша как бешеная собака.\n\n"Ферручио. В чём проблема?" — спросил начальник ИИИ, ожидая услышать очередную безумную теорию о культе мааритов. Он оказался прав.\n\n"Я видел его! Я видел его сегодня на марше мааритов! Проклятые маариты!"\n\nШеф был в замешательстве: "Кого? На каком марше?"\n\n"Они только что прошли по центру города, и я наблюдал за ними, чтобы убедиться, что они не устроят беспорядков. И тут я увидел его в толпе – одного из исследователей Панацеи. Он был в плаще, но я всё равно узнал его." Шеф нахмурился и отмахнулся от собеседника. Ферручио был одним из его лучших грифонов, но, возможно, Панацея была проектом не для него..."
arantiga_decision.24.a:0 "Какой позор."

arantiga_decision.25.t:0 "Недостающее звено Ферручио"
arantiga_decision.25.d:0 "Полиция долго расследовала серию насильственных преступлений и недавно сумела связать их с известным культом мааритов. Сегодня они провели рейд на то, что должно было быть небольшим убежищем, но оказалось главным местом сбора тайной организации. Полицейские были в меньшинстве, когда началась перестрелка, но вскоре прибыло подкрепление, и маариты сдались. Некоторые погибли в бою, но большинство культистов оказались под стражей.\n\nВесь день Ферручио едва скрывал злорадство, поскольку выяснилось, что полиция схватила большинство исследователей "Панацеи". Полиция собирается передать их под следствие и предлагает расследовать их деятельность в ИИИ.\n\nИ хотя обычно Ферручио первым выступил бы за жёсткие меры в отношении мааритов, то ли во имя науки, то ли полный гордыни, он предложил отпустить исследователей и установить пристальный надзор за их проектом. Он заявил, что такой подход может дать полиции наводки на мааритов, избежавших рейда, и что исследование "Панацеи" ещё не завершено. И хотя никто даже не предлагал такой план, у ИИИ достаточно влияния, чтобы привести его в действие, хотя это было бы очень рискованно."
arantiga_decision.25.a:0 "Вернуть их и собрать команду для слежки."
arantiga_decision.25.b:0 "Пусть ими занимается полиция!"
arantiga_decision.25.c:0 "Просто отпустите их..."

arantiga_decision.26.t:0 ""Универсальное лекарство""
arantiga_decision.26.d:0 "Когда мааритов освободили, они продолжили работу над проектом "Панацея", как прежде. Но вскоре полицейские подняли тревогу, поскольку в ходе дальнейшего расследования они раскрыли мотивы культа. Философия их основателя, Мартина Зобриста, также известная как теория Всесожжения, предполагала, что скоро (очень скоро) рост населения превысит производство пищи и вызовет масштабную катастрофу. Зобрист намеревался радикально сократить население планеты с помощью чрезвычайно заразного искусственного вируса.\n\nВчера утром, сектанты, задержанные во время рейда, загадочным образом сбежали из-под стражи, отчего в управлении полиции прошли чистки от их возможных сообщников. Сектанты скрылись в здании "Панацеи" и выгнали всех, кто не был с ними связан. Полиция тут же начала осаду; инспектор опасался выброса биологического оружия в случае штурма. Неопределённость царила в течение пятнадцати часов, пока не прибыл Ферручио с военными. Он отдал приказ обстрелять фабрику зажигательными снарядами в попытке уничтожить любые опасные вещества. Армия подтянула артиллерию, и после пожара, который длился целый день было решено, что маариты устранены, и никакая биологическая угроза не могла выжить. К сожалению, огонь поглотил все записи проекта."
arantiga_decision.26.a:0 "Безопасность превыше всего..."

arantiga_decision.261.t:0 ""Универсальное лекарство""
arantiga_decision.261.d:0 "Когда мааритов освободили, они продолжили работу над проектом "Панацея", как прежде, – не считая того, что теперь за каждым членом проекта велась слежка, а их лаборатория кишела записывающими устройствами. Но вскоре полицейские подняли тревогу, поскольку в ходе дальнейшего расследования они раскрыли мотивы культа. Философия их основателя, Мартина Зобриста, также известная как теория Всесожжения, предполагала, что скоро (очень скоро) рост населения превысит производство пищи и вызовет масштабную катастрофу. Зобрист намеревался радикально сократить население планеты с помощью чрезвычайно заразного искусственного вируса.\n\nВчера утром, сектанты, задержанные во время рейда, загадочным образом сбежали из-под стражи, отчего в управлении полиции прошли чистки от их возможных сообщников. Сектанты скрылись в здании "Панацеи" и выгнали всех, кто не был с ними связан. Полиция тут же начала осаду; инспектор опасался выброса биологического оружия в случае штурма. Неопределённость царила в течение пятнадцати часов, пока не прибыл Ферручио с военными. Он отдал приказ обстрелять фабрику зажигательными снарядами в попытке уничтожить любые опасные вещества. Армия подтянула артиллерию, и после пожара, который длился целый день было решено, что маариты устранены, и никакая биологическая угроза не могла выжить.\n\nВ суматохе дня все позабыли о спецгруппе, прикреплённой к проекту, и поэтому Ферручио был очень удивлён, когда рядом с ним остановилась потрёпанная машина, забитая стопками бумаг и пробирками. Похоже, маариты в полиции не смогли раскрыть шпионов, и, получив известие о побеге из тюрьмы, они немедленно приступили к делу. Незаметно проникнув в лабораторию, они забрали все, что смогли, прежде чем на место прибыли культисты.\n\nФерручио был рад, что какая-то информация уцелела, и с облегчением узнал, что маариты были всё ещё далеки от окончания разработки своего биологического оружия. В конце концов, угрозы не было. Несмотря на то, что "Панацея" оказалась полным провалом, некоторые достижения проекта имеют практическую ценность, а значит, средства ИИИ не были потрачены совсем впустую."
arantiga_decision.261.a:0 "Какое облегчение..."

arantiga_decision.30.t:0 "Алленштайн уходит!"
arantiga_decision.30.d:0 "После новостей о том, что правительство перекрыло финансирование и закрыло его проект, Алленштайн, похоже, нас бросил. Сегодня он исчез. Охранники обыскали лабораторию, столовую, ближайший парк, его любимый бар и его комнату – всё безуспешно. Они даже обыскали уходящие поезда и самолёты, но его нигде не было. Похоже, мы потеряли его навсегда. Что касается его экспериментов, никто не смеет даже прикоснуться к его оборудованию. Его изуродованным подопытным будет оказана помощь, а его теория, похоже, умрёт вместе с ним."
arantiga_decision.30.a:0 "Сработало бы это когда-либо?"

arantiga_decision.31.t:0 "Проект "Легионер""
arantiga_decision.31.d:0 "Хайнрих Алленштайн был одним из многих, кто подал заявку в Имперскую исследовательскую инициативу с просьбой о финансировании для своего проекта. Однако, в отличие от многих, он не был ни мошенником, ни аферистом, и даже не наивным учёным с несбыточной мечтой. Напротив, он был опытным профессором Университета Гамии с проектом, имевшим прочную теоретическую основу, и с чёткий планом действий. Конечно же, это порадовало наших администраторов.\n\nЕго проект был одним из немногих, направленных непосредственно Арантигосу. Когда сверху спустили одобрение, всего за пару дней появилась лаборатория, оснащённая необходимым оборудованием и снабжённая химикатами. Сам Алленштайн немедленно прилетел из Йеля, и всё было готово к работе."
arantiga_decision.31.a:0 "Начнём!"

arantiga_decision.32.t:0 "Необычная просьба"
arantiga_decision.32.d:0 "После нескольких дней работы под ведением ИИИ Алленштайн показал себя просто образцово. Он без проблем освоился в новой лаборатории, и наш представитель говорит, что он проводит много свободного времени с ассистентами – вероятно, такую привычку он выработал в Гамии. Однако теперь ИИИ вынуждена представить запрос Императору Арантигосу.\n\nНам было прекрасно известно, что прошлые эксперименты Алленштайна выходили за рамки научной этики, поэтому то, что потребовалось ему сейчас, не стало для нас неожиданностью – особенно учитывая характер его проекта. Однако, до сих пор оставалась надежда, что он обойдётся без этого. Алленштайну требуются грифоны для экспериментов. Если ИИИ получит одобрение, найти подопытных будет несложно, а запрашиваемое им количество довольно небольшое. Как бы то ни было, окончательное решение принимает Арантигос."
arantiga_decision.32.a:0 "Ваше желание — наш приказ..."
arantiga_decision.32.b:0 "Ни в коем случае!"

arantiga_decision.33.t:0 "Требуются подопытные!"
arantiga_decision.33.d:0 "Мы снова получили отчёт от представителя ИИИ, и в нём нет хороших новостей. Похоже, Алленштайн, мягко говоря, сильно недооценил необходимое количество подопытных. Он требует, чтобы ИИИ предоставило новых грифонов – и много. По словам представителя, Алленштайн признал свою ошибку, но нам будет затруднительно найти достаточно подопытных.\n\nРабота над их поиском уже начата, но вопрос в том, стоит ли нам вообще это делать? Из лаборатории пришли слухи, что его исследования идут тяжело, и, насколько нам известно, весь исследовательский проект может закончиться провалом."
arantiga_decision.33.a:0 "Мы предоставим всё необходимое."
arantiga_decision.33.b:0 "Это слишком опасно."

arantiga_decision.34.t:0 "Требуется новое оборудование!"
arantiga_decision.34.d:0 "Похоже, в лаборатории проекта "Легионер" произошёл серьёзный сбой. Алленштайн, его ассистенты и подопытные не пострадали, но большая часть оборудования была повреждена настолько, что не подлежит ремонту. В проект уже вложено много денег, но Алленштайн заявил, что ему нужна не только замена уничтоженного оборудования, но и дорогостоящие товары, которые можно импортировать только из Эквестрии, в том числе протезы, высококачественные магические кристаллы и сыворотка крови. Кроме того, что из всех его запросов этот – самый затратный, после случившейся аварии в ИИИ возникли сомнения в жизнеспособности всего проекта."
arantiga_decision.34.a:0 "Мы не можем потерять этот проект."
arantiga_decision.34.b:0 "Этого достаточно!"

arantiga_decision.35.t:0 "Плоды трудов"
arantiga_decision.35.d:0 "Когти Алленштайна болели после долгих часов за операционным столом. Не помогало и то, что после аварии он стал отпускать ассистентов, не желая подвергать их опасности сверх необходимого. Теперь они просто приносили Алленштайну то, что ему было нужно, и выходили. Иногда он жалел об этом решении, когда ему остро нужна была помощь, – особенно во время таких операций.\n\nВесь халат Алленштайна был измазан кровью, его глаза и ноздри горели от токсичных химикатов. Закончив установку всех до единого насосов с сывороткой, магических рецепторов и узлов, он зашил подопытного и осмотрел свою работу. Бурый грифон, когда-то известный как Адальберт, был неузнаваем; его тело превратилось в месиво из перьев, уродливых трубок и металлических пластин. Алленштайн пустил слезу при мысли о том, что Адальберта больше нет; он был слишком молод, чтобы умереть. Увы, но ему нечем было помочь. После тридцати минут без вдохов и движений, он бы никак не выкарабкался.\n\nКак требовал протокол, Алленштайн потянулся щупать пульс подопытного, когда Адальберт внезапно схватил его за предплечье. Его хватка была так крепка, что Алленштайн искривился от боли. Пока его кости ломались и кожа рвалась, он едва услышал за собственными криками вопрос: "Док... Вы закончили?" И Адальберт тут же упал в обморок от усталости. Его хватка ослабла, и Алленштайн рухнул на пол, обливаясь кровью.\n\nК счастью, услышав крик Алленштайна, ассистенты пришли на помощь, оттащили его в соседний кабинет и замотали рану. Только оправившись от шока, он побежал проверить Адальберта и, убедившись, что с ним всё в порядке, пошёл к представителю ИИИ.\n\nОн встретил представителя, добродушного грифона по имени Холт, спешно выходящим из своей квартиры.\n\n"Алленштайн!" — крикнул он — "Вы в порядке? Что случилось? Я собирался ехать в больницу, как только узнал, но вы уже здесь!" — тут он увидел сломанную руку c окровавленным бинтом вокруг неё и отшатнулся — "Что за чёрт?"\n\n"Сработало! Моя теория верна! Операция прошла успешно!" — пояснил Алленштайн.\n\n"Сработало? Это отличные новости! Полагаю, у вас, э-э, произошёл несчастный случай с подопытным?" Алленштайн кивнул. "Что ж, в ИИИ не обрадуются, узнав об этом, поэтому нам нужно как можно скорее подготовить демонстрацию. Как скоро вы сможете её провести?"
arantiga_decision.35.a:0 ""Через неделю.""

arantiga_decision.36.t:0 "Сыны Арантигоса"
arantiga_decision.36.d:0 "Хотя магитехнические протезы появились в Эквестрии несколько лет назад, те, что работали, были дорогими и ненамного превосходили свои органические "аналоги". Чтобы привыкнуть к ним, зачастую требовались месяцы тренировок. И когда армии Арантигоса выступали в бой, бесчисленное множество солдат, талантливых и преданных, получало ранения; многие становились калеками. Эти калеки толпами записывались к Алленштайну – и умирали в его экспериментах. Если не хватало добровольцев, то заключённых было более чем достаточно, их бы и так в любом случае казнили.\n\nНо наконец, после месяцев работы, проект был завершён, и Алленштайн смог представить результаты. Арантигоса пригласили наблюдать за учениями, где группа аугментированных ветеранов вышла на бой с его элитной личной гвардией. Каждый из пациентов Алленштайна потерял хотя бы одну конечность, их кристальные глаза сияли зловещим светом, и алхимические имплантаты подавали смесь стимуляторов, когда они атаковали гвардию. Арантигос и небольшая группа высокопоставленных офицеров были весьма удивлены, когда аугментированные солдаты с лёгкостью подавили разбили противников. Наконец, Арантигос жестом когтя подозвал Алленштайна.\n\n"Должен признать, доктор, это весьма впечатляет. Но стоимость одной аугментации..." Он ухмыльнулся. "Нам сказали, что на эти деньги можно собрать несколько танков".\n\n"Да, действительно. И я боюсь, что решение этой проблемы может занять годы, если не десятилетия. Столько различных комбинаций магии кристаллов, чар и алхимии–"\n\n"Мы ознакомились с вашими отчетами; вам не нужно объяснять технические детали. Из-за высокой стоимости и ограниченной доступности редких материалов мы никогда не сможем выставить больше нескольких полков таких солдат. Но небольшая элитная группа грифонов всегда пригодится. И нашей личной охране могут понадобиться замены. Продолжайте свои исследования, доктор...""
arantiga_decision.36.a:0 ""...Мы позаботимся о том, чтобы вы получили всё необходимое.""

arantiga_decision.401.t:0 "Аскариус уходит"
arantiga_decision.401.d:0 "Без финансирования Аскариус больше не может проводить свои эксперименты. В ИИИ для него больше нет места, и он изгнан с родины. Поистине жалкое существование, но Арантигос всегда прав, верно?\n\nВ любом случае, похоже, единорог пытается эмигрировать в Эквестрию, а вместе с ним уходят и его теории. Его великий проект подошёл к концу."

arantiga_decision.402.t:0 "Вечеринка всей жизни"
arantiga_decision.402.d:0 "Несмотря на все наши предупреждения, Аскариус не послушал, и на самой большой вечеринке, которую он когда-либо устраивал, его нашли мёртвым. Пока неизвестно, умер ли он от передозировки опиумом, удушения или внутреннего кровотечения. Ясно одно: с его смертью умрут и его теории."

arantiga_decision.41.t:0 "Проект "Серебряный Ключ""
arantiga_decision.41.d:0 "ИИИ получила предложение от единорога, прибывшего издалека, из-за Грифийских гор. Известный по имени Аскарий, он некогда был видным дворянином в Виттенланде – пока его не изгнали. Почему так вышло, он не сознаётся. В любом случае, учитывая странную, ревностно меритократическую природу аристократии Виттенленда и впечатляющую магическую демонстрацию, которую он устроил, мы уверены, что он очень компетентный волшебник. Теоретическое обоснование его проекта уже рассмотрели аквелийские маги, и они уверены, что оно действительно работает так, как он описал.\n\nПо мере расширения нашего королевства каналы связи и транспортировки будут растягиваться, и Аскарий предлагает простое решение этой проблемы: телепортацию. Конечно, грифоны не способны ни на что большее, чем простые чары, и только самые искусные из единорогов когда-либо пробовали заклинания телепортации. Поэтому Аскариус предлагает собрать машину, которая будет работать на силе магических кристаллов и управляться с помощью рунических символов, и будет способна мгновенно переносить грифонов на большие расстояния.\n\nК сожалению, нам, грифонам, не дано вникнуть в тонкости работы такого аппарата..."
arantiga_decision.41.a:0 "Давайте начнём!"

arantiga_decision.47.t:0 "Обустройство"
arantiga_decision.47.d:0 "После того, как его предложение получило зелёный свет, была спешно организована лаборатория и набраны лучшие маги и учёные, Аскариус приехал, чтобы начать работу. Представитель ИИИ недавно сообщил нам, что Аскариус хорошо устроился. Его помощники довольны им, и работа продвигается быстро. Однако, представителю не понравилось, что он стал проводить слишком много времени в баре, что, впрочем, никак не влияет на его работу. Проект "Серебряный ключ" идёт успешно."
arantiga_decision.47.a:0 "Рад слышать."

arantiga_decision.42.t:0 "Гедонизм"
arantiga_decision.42.d:0 "С нами недавно связался директор ИИИ, сообщив, что текущий проект столкнулся с финансовыми трудностями, и что Аскариус не может продолжать свои эксперименты без нового оборудования и артефактов. Наше руководство, понятное дело, было озадачено, ведь Инициатива была обеспечена значительным резервным фондом на подобные случаи. Поэтому представителя ИИИ на проекте "Серебряный ключ" немедленно вызвали на допрос. Его ответ был настолько нелепым, что следователи разразились смехом. Но представитель был совершенно серьёзен, и наши средства действительно были растрачены чрезмерно активным руководителем проекта...\n\nСпустя несколько недель после начала проекта "Серебряный ключ" Аскариус провёл вечеринку для своих помощников, чтобы "отпраздновать всё, что они сделали, и устроить заслуженную передышку". Хотя это было необычно, наш представитель не обратил на это особого внимания, пока в следующем месяце не произошло то же самое. С каждого месяца они стали проводиться раз в две недели, а далее чуть ли не каждый вечер, и количество участников явно не уменьшалось.\n\nПохоже, что средства, выделенные на проект, по большей части ушли в зарплату Аскариуса, и он растратил их на свои вечеринки. Он по-прежнему способный исследователь, и его отчёты показывают превосходный прогресс, но очевидно, что ему потребуется ещё больше денег для продолжения..."

arantiga_decision.43.t:0 "Приятные Мелочи"
arantiga_decision.43.d:0 "Сегодня стало ясно, что администрация Виттенленда в курсе того, что Аскариус работает в арантийской ИИИ, и прислала нам список его судимостей. Учитывая его дворянство и эрудицию, кажется удивительным, что он у него есть, но когда наше руководство изучило её, всё стало ясно...\n\nВчера вечером нам позвонил представитель ИИИ и сообщил, что Аскариус арестован по обвинению в хранении запрещённых веществ и вандализме. Похоже, его вчерашняя вечеринка – самая масштабная из всех – вышла из-под контроля, после того как участники приняли самую разносортную смесь наркотиков, какую только можно найти. Только этого было бы достаточно для ареста, но далее они вышли гулять на улицы и умудрились повредить несколько кварталов города. Как хозяина вечеринки, Аскариуса взяли под стражу, и завтра ему предстоит суд, где он почти наверняка получит тюремный срок.\n\nС одной стороны, мы могли бы не вмешиваться, и тихонько избавиться от всех улик, которые могут стать проблемой для правительства. С другой стороны, опыт и знания Аскариуса делают его бесценным для проекта "Серебряный ключ". Проект не может продолжаться без него. Мы могли бы спасти его и вернуть в лабораторию, хотя представитель считает, что случившееся не избавит его от пагубных привычек.\n\nВ качестве компромисса, молодой помощник Аскариуса предложил дать суду состояться, а после вынесения приговора изменить его срок на условный и шантажировать его, чтобы он ускорил работу над проектом. Если он не закончит проект к указанному сроку, он попадёт в тюрьму. Это может показаться немного противозаконным, но, учитывая особенности нашей страны, это не должно вызвать серьёзных протестов. В конце концов, выбор за нами..."
arantiga_decision.43.a:0 "Пощадите его!"
arantiga_decision.43.b:0 "Арестуйте его!"
arantiga_decision.43.c:0 "Шантажируйте его!"

arantiga_decision.44.t:0 "Новый Аскариус"
arantiga_decision.44.d:0 "Похоже, наша авантюра окупилась с лихвой. Аскариус, видимо, отменил все предстоящие вечеринки и теперь проводит почти весь день в лаборатории – его рабочие дни стали длиннее даже тех, которые предшествовали вечеринкам. Возможно, его припугнули установленные сроки, а может, следственный изолятор показался ему не самым лучшим местом, но метод молодого помощника оказался эффективным, и, судя по первым отчётам, проект всё-таки будет выполнен в срок. Это большое облегчение для всех в ИИИ."
arantiga_decision.44.a:0 "Уже лучше..."

arantiga_decision.45.t:0 "Древние тайны"
arantiga_decision.45.d:0 "Даже несмотря на все технологии современного мира, величайшие загадки природы всё ещё остаются неразгаданными. Века трудов, усилий и экспериментов так и не дали ответов на простейшие вопросы. Магия — одна из крупнейших областей науки, в которой до сих пор почти нет каких-либо знаний. Даже единороги понятия не имеют, почему их заклинания работают. Что же касается великих философов магического дела, то они давно ушли в прошлое.\n\n"Но у меня есть основания полагать, что они разгадали загадку, которая позволила бы им подчинять магию, да и весь мир, своей воле. Их работа должна была кануть в лету, но всё же сохранилось несколько фрагментов, и я верю, что они — ключ к работе моего телепортатора.\n\n"Наша работа зашла в тупик, и только с эти обрывки тайных знаний позволят мне запитать машину кристаллами, а не единорожьей магией... Я слышал, что в Эквестрии синтезировали кристаллы именно для этой цели, но я сам на такое не способен. Моя специализация — магия, а не математика. Пожалуйста, мы так близки к прорыву..." — Аскариус затих. С его стороны в трубке повисла тишина. Похоже, эта просьба настолько важна для единорога, что сам связался с начальником ИИИ, а не через представителя. В любом случае, решать нам."
arantiga_decision.45.a:0 "Мы достанем нужную информацию и кристаллы." 
arantiga_decision.45.b:0 "Хватит с него!"

arantiga_decision.46.t:0 "День расплаты"
arantiga_decision.46.d:0 "Аскариус нервничал – время летело быстро, а срок стремительно приближался. И он знал, что кураторы проекта начинают беспокоиться и жаловаться на растущие цены на экзотические материалы, редкое волшебное снаряжение и магические фолианты, импортируемые из Эквестрии. В мгновение ока информация о промедлении достигнет Арантигоса, и тогда... он был хорошо наслышан о вспыльчивости Императора. Но он зашёл слишком далеко – скоро секреты магии Стар Свирла наконец раскроются перед ним. Когда много лет назад он наткнулся на один из его великих трактатов о магии, он понял, что сможет добиться истинного величия, пусть даже только благодаря достижениям самого Стар Свирла.\n\nИ теперь, когда он был так близко, его не остановят эти жадные грифоны. И поэтому команда работала день и ночь, пытаясь завершить проект и подготовить рабочий прототип. Наконец, всё было готово для первого эксперимента по телепортации на короткие расстояния. Воздух гудел от энергии, пока в машину загружали кристаллические пилоны. Аскариус потянул за рычаг... но камни, которые они хотели телепортировать, остались на платформе.\n\n"Что происходит?" — спросил раздражённый единорог одного из своих помощников.\n\n"Понятия не имею. Вроде всё в порядке, показания энергии растут..."\n\nАскариус оттолкнул его от приборной панели и пристально вгляделся в датчики. Через несколько мгновений всё его тело задрожало. "Выключайте! ВЫКЛЮЧАЙТЕ! Мы не телепортируем камни отсюда, мы призываем что-то СЮДА!" Это перегрузит всю систему!"\n\nНо прежде чем кто-либо успел отреагировать, устройство внезапно перестало жужжать, а затем взорвалось. Волны света жгли всё, чего касались — машины, пони и грифонов, превращая их в пыль. Через несколько секунд все внутри комплекса были мертвы. Когда солдаты снаружи пришли, чтобы разведать обстановку, они обнаружили лишь одно живое существо — грифона в незнакомой военной форме, который явно не состоял в исследовательской команде."
arantiga_decision.46.a:0 "Не шутите со временем..."

arantiga_decision.48.t:0 "Затерянный мир"
arantiga_decision.48.d:0 "Единственный "выживший" из проекта "Серебряный ключ" был немедленно подвергнут допросу. Результаты оказались просто шокирующими. Мы обнаружили, что этот выживший был никем иным, как Райнером Гринфезером, высокопоставленным офицером Рейхсармии... служившим под началом Императора Гровера V. Когда мы исключили возможность безумия, анализ деталей его истории ясно указал на то, что он прибыл из другой... временной линии. Или из другого измерения. Наши учёные всё ещё спорят о том, как назвать этот феномен, но, очевидно, мир, в котором жил Гринфезер, очень похож на наш, кроме некоторых отличий. В нём Империя Грифонов не пала до сих пор, и сейчас вела жестокую войну с Речной Империей. Во время одного из сражений командный пункт Райнера подвергся атаке экспериментального единорожьего заклинания, которое, вместо того чтобы убить его, каким-то образом связалось с устройством "Серебряного ключа" и перенесло его сюда.\n\nХотя его истории о короле Эквестрии Сомбре, демонах-аликорнах, разорявших Эквус, и других, более странных, событиях могли бы стать отличным материалом для романов, нам они бесполезны – и, судя по всему, технологии его измерения во многом были такими же, как наши. Проект "Серебряный ключ" был закрыт из-за смерти всех сотрудников, включая самого главного исследователя Аскариуса, без которого восстановление устройства невозможно. Позже были привлечены аквелийские маги, которые, проанализировав то, что осталось, были глубоко удивлены, что мы не вызвали гораздо более масштабной магической катастрофы.\n\nЧто касается Райнера, узнав, что у него нет возможности вернуться домой, он предложил свои услуги Арантийской империи."
arantiga_decision.48.a:0 "Тост за новую жизнь!"

#### news events ####
arantiga_news.1.t:0 "Возвышение Арантигоса"
arantiga_news.1.d:0 "[This.GetNewspaperHeader]В последние несколько лет земли Центральной Грифонии стали полем битвы. Из сражений вышел новый региональный гегемон – Арантига. После военного переворота его правитель, Доротеос Фезерин, покорил множество соседних народов и провозгласил себя королём и Арантигосом Возрождённым – реинкарнацией своего знаменитого предка, великого завоевателя древности. Не довольствуясь лишь королевским титулом, Доротеос также изменил священные ритуалы, чтобы его восславляли наравне с Бореем. Соседние правительства выступили с протестами, назвав поступок Доротеоса еретической попыткой узурпации божественного статуса и доказательством того, что молодой завоеватель окончательно потерял рассудок..."
arantiga_news.1.a:0 "За Арантигоса!"
arantiga_news.1.b:0 "Безумный еретик!"
arantiga_news.2.t:0 "Уничтожение Новой Скайнавии"
arantiga_news.2.d:0 "[This.GetNewspaperHeader]Осада началась когда Легионы Арантиги захватили последнюю дорогу к городу. Хотя войскам Скайнавии удалось открыть узкий сухопутный коридор из города в ближайший порт, Красная Армия в конечном итоге не смогла снять осаду. Каждый последующий штурм заканчивался поражением, что приводило к огромным потерям с атакующей стороны, в то время как войска Скайнавии удерживали город с невиданным ранее рвением. Император Доротеос, понимая, что взятие города постоянными штурмами займёт слишком много времени, приказал остановить все атаки на город, перейдя к интенсивному обстрелу из всех имеющихся артиллерийских орудий. К моменту окончания бомбардировки весь город был сравнен с землёй, и не осталось ни одного выжившего."
arantiga_news.2.a:0 "Погребальный костёр коммунизма"
arantiga_news.2.b:0 "Варвары!"
arantiga_news.2.c:0 "Мы соболезнуем нашим павшим товарищам"
arantiga_news.3.t:0 "Арантийская Империя"
arantiga_news.3.d:0 "[This.GetNewspaperHeader]Когда Доротеос Фезерин провозгласил себя королём Арантиги и Возрождённым Арантигосом, большинство назвали его безумцем, что, к сожалению, является распространённым описанием многих современных грифоньих правителей. Однако безумие не помешало его военному таланту, и, вопреки численному превосходству, он сумел завоевать Герцланд, Вингбардию и Аквелию. Сегодня, во время пышной церемонии в Грифенхейме, Доротеос короновал себя новым императором Грифонии. Хотя на континенте всё ещё остаётся множество мелких государств, похоже, они не смогут остановить военную машину Арантиги..."
arantiga_news.3.a:0 "Слава Арантигосу!"
arantiga_news.3.b:0 "Очень тревожно"
arantiga_news.3.c:0 "Это было неожиданно"
arantiga_news.4.t:0 "Брак Фезерина и Дискрет"
arantiga_news.4.d:0 "[This.GetNewspaperHeader]Сегодня в Аквиле, король Арантиги Доротеос Фезерин женился на королеве Вивьен Дискрет из Аквелии. В городе прошли пышные церемонии, пиры и совместные военные парады, а в других частях обоих королевств были организованы более скромные торжества. Благодаря этому браку, обе страны стали близкими союзниками, усилив влияние Арантиги в Грифонии. Этот новый союз может полностью изменить политическую ситуацию на континенте и привести к появлению нового гегемона."
arantiga_news.4.a:0 "Время праздновать!"
arantiga_news.4.b:0 "Нам следует готовиться к худшему."
arantiga_news.4.c:0 "Интересное развитие событий..."
arantiga_news.5.t:0 "Идол Борея возвращён"
arantiga_news.5.d:0 "[This.GetNewspaperHeader]Новость разнеслась по Грифонии, словно лесной пожар: Идол Борея возвращен! Судя по всему, королю Арантиги, Доротеосу Фезерину, каким-то образом удалось вернуть утраченный артефакт из Бездонной бездны, куда тот упал во время нападения циклопа Аримаспи. Арантигцы празднуют это событие, утверждая, что это явный знак божественного благословения, дарованного их правителю, в то время как скептики говорят об очевидном мошенничестве. Большинство религиозных авторитетов Грифонии отрицают возвращение Идола. К счастью, похоже, что силы Идола сейчас дремлют..."
arantiga_news.5.a:0 "Борей нас защищает!"
arantiga_news.5.b:0 "Ложь и ересь!"
arantiga_news.5.c:0 "Интересное развитие событий"
arantiga_news.6.t:0 "Эпидемия в Грифенхейме!"
arantiga_news.6.d:0 "[This.GetNewspaperHeader]Столицу Империи Грифонов, Грифенхейм, поразила опустошительная болезнь, известная как серая лихорадка. Большая часть города всё ещё в развалинах после вторжения Арантиги, а население ослаблено голодом. Неудивительно, что в городе вспыхнула эпидемия. Только благодаря быстрой реакции правительства Арантиги, болезнь не распространилась за пределы имперской столицы. Но ущерб катастрофический – погибли сотни тысяч грифонов, включая бывшего императора Гровера VI."
arantiga_news.6.a:0 "Необходимая жертва."
arantiga_news.6.b:0 "Это ужасно!"
#1.1#
arantiga_news.7.t:0 "Вознесение Арантигоса"
arantiga_news.7.d:0 "[This.GetNewspaperHeader]Смерть Доротеоса Фезерина, короля Арантиги, погрузила страну в хаос и войну. Захватив власть над королевством, полководец Лисимах жестоко расправился с инакомыслящими и завоевал всю Южную Грифонию. Ко всеобщему удивлению, Лисимах объявил, что "Арантигос Второй" на самом деле не умер — он вознёсся к богам, объединившись с Бореем и первым Арантигосом, и что теперь он — божественный покровитель рода грифонов, а Лисимах — его регент в материальном мире. Это заявление вызвало смесь недоверия, шока и веселья среди других народов грифонов, большинство из которых тут же осудили Лисимаха, назвав его сумасшедшим. Безумцем, даже хуже своего предшественника."
arantiga_news.7.a:0 "Арантигос жив!"
arantiga_news.7.b:0 "Безумие!"
arantiga_news.8.t:0 "Священная Арантийская Империя"
arantiga_news.8.d:0 "[This.GetNewspaperHeader]После того, как генерал-регент Лисимах захватил Южную Грифонию, новости из этих земель стали редкими. Информация, которая всё же выходит из "Чёрного пятна на карте Грифонии" через беженцев, поистине ужасает. Лисимах установил жестокую теократическую диктатуру. Гражданам говорят, что внешний мир хочет только одного — уничтожить их. Их заставляют поклоняться "Вечному Императору Арантигосу", чтобы обрести спасение. Все несогласные либо попадают в трудовые лагеря, либо погибают. Но недавно из Арантиги пришла официальная новость: её правительство провозглашает создание "Священной Арантийской Империи" и объявляет всех остальных правителей Грифонии предателями единственного истинного Бога — Арантигоса. Кроме того, правительство Арантиги угрожает "возмездием" любому грифону, который "осмелится" нарушить её изоляцию. Несмотря на единодушное осуждение арантийского режима, неясно, решится ли кто-либо воевать с государством-изгоем, особенно учитывая слухи об активной разработке ядерного оружия."
arantiga_news.8.a:0 "Слава Арантиге!"
arantiga_news.8.b:0 "Под арантийским солнцем нет надежды..."
arantiga_news.9.t:0 "Изгнание пони из Нового Мейрленда"
arantiga_news.9.d:0 "[This.GetNewspaperHeader]С момента своего захвата власти, Лисимах продвигал откровенно расистские идеи о пони, как о злых, нечестивых существах и о своем видении Арантиги как чисто грифоньего государства. Теперь, завоевав "по праву грифоньи земли" континентальной части Нового Мейрленда, Лисимах изгнал всех пони, которые там обитали. Хотя они могли считать себя счастливчиками, что безумный военачальник позволил им прожить ещё один день, многие погибли во время плавания к близлежащим островам, где выжившие теперь страдают от голода из-за того, что местная экономика рухнула от наплыва беженцев. Остаётся только гадать, сможет ли нация когда-нибудь оправиться от этого сокрушительного удара."
arantiga_news.9.a:0 "Скатертью дорога!"
arantiga_news.9.b:0 "День позора..."
arantiga_news.9.c:0 "Мрачный день для пони."
arantiga_news.10.t:0 "Сикамеонская кровавая баня"
arantiga_news.10.d:0 "[This.GetNewspaperHeader]С тех пор, как генерал-регент Лисимах пришел к власти и завоевал Юг, с земель Арантиги доходили лишь редкие вести. Однако из-за наплыва беженцев, которым удалось покинуть страну, новости о широкомасштабном геноциде в Сикамеоне недавно достигли остального мира. Чтобы подавить крупное сикамеонское восстание, арантийцы начали убивать всех, кого подозревали в поддержке мятежников, и подожгли обширные южные джунгли, чтобы лишить повстанцев убежища. Сотни тысяч погибли, и большая часть Сикамеона была разрушена. Выжившие мятежники утратили волю к сопротивлению. Хотя почти все правительства осудили действия Лисимаха, остается неясным, попытается ли кто-нибудь помешать ему вершить дальнейшие зверства."
arantiga_news.10.a:0 "Восстание подавлено!"
arantiga_news.10.b:0 "Какой ужас!"
#1.2#
arantiga_news.11.t:0 "Восстановление Спарлеоса"
arantiga_news.11.d:0 "[This.GetNewspaperHeader]В эту эпоху хаотичных войн королевства то рушатся, то возвышаются, и порой, чтобы выжить в этом мрачном мире, воевать приходится даже не желающим. Не проявляя никаких завоевательных амбиций, король Спарлеоса Никатор Уайтфезер стал явным гегемоном Юга, взяв под свой контроль все ранее враждовавшие местные народы. Во время пышной церемонии в Спарлето, Никатор объявил о воссоединении южных земель со "Вторым королевством Спарлеоса" и заявил, что будет стремиться защищать всех южан от внешних угроз, какими бы пугающими они ни были."
arantiga_news.11.a:0 "Слава Спарлеосу!"
arantiga_news.11.b:0 "Ещё один Арантигос?!"
arantiga_news.11.c:0 "Интересно..."

arantiga_news.12.t:0 "Восстановление Карфинской Республики"
arantiga_news.12.d:0 "[This.GetNewspaperHeader]После периода хаотичных войн на Юге возникла новая доминирующая сила. Хотя многие думали, что после падения Арантигоса его королевство вскоре последует за ним, стране удалось превратиться в процветающую и динамичную республику, которая к настоящему времени победила все остальные южные державы. Антиоко Моро, её действующий президент, сегодня провозгласил образование Карфинской Республики и поклялся посвятить себя защите свобод и прав южан."
arantiga_news.12.a:0 "В светлое будущее!"
arantiga_news.12.b:0 "Неожиданно..."
arantiga_news.12.c:0 "Интересно..."

