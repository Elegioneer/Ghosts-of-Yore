#####chaos ideas##########
ARA_power_vacuum:0 "Безвластие"
ARA_power_vacuum_desc:0 "Арантига сейчас представляет из себя курицу без головы, бегающую вокруг и истекающую кровью..."
ARA_nicator_junta:0 "Хунта Никатора"
ARA_nicator_junta_desc:0 "Арантига сейчас представляет из себя курицу без головы, бегающую вокруг и истекающую кровью...\n\nСейчас, по крайней мере, за это курицей кто-то присматривает."
ARA_nicator_junta1:0 "Хунта Никатора"
ARA_nicator_junta1_desc:0 "Арантига сейчас представляет из себя курицу без головы, бегающую вокруг и истекающую кровью...\n\nСейчас, по крайней мере, за это курицей кто-то присматривает."
