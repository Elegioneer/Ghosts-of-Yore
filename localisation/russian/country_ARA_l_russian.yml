ARA_slow_recovery:0 "Медленное восстановление"
ARA_slow_recovery_desc:0 "Нам наконец удалось направить наше государство на путь окончательного восстановления после ужасов гражданской войны."
ARA_arantigan_way:0 "Арантийский путь"
ARA_arantigan_way_desc:0 "Мы никогда не забудем наше прошлое, но мы не позволим ему определять наше будущее."
ARA_empower_minorities:0 "Расширенные права меньшинств"
ARA_empower_minorities_desc:0 "В Арантиге проживают представители многих национальностей, и, возможно, приложив некоторые усилия, мы все сможем жить в мире."
ARA_new_path:0 "Новый путь"
ARA_new_path_desc:0 "Мы никогда больше не позволим лишить нас свободы. Для этого мы будем следовать трём принципам республиканства: демократии, процветанию и свободе. Более того, Арантига станет настоящим светочем свободы в Грифонии!"
ARA_social_welfare:0 "Арантийское соцобеспечение"
ARA_social_welfare_desc:0 "Бедность – наш главный враг, ведь наша цель – принести процветание каждому существу в Арантиге!"
ARA_liberty_death:0 "Свобода или смерть!"
ARA_liberty_death_desc:0 "Мы были всего в шаге от погружения в пучину безумия и вечного рабства. Мы никогда не забудем и никогда не откажемся от своей свободы!"
ARA_crossroads:0 "Перекрёсток всея Грифонии"
ARA_crossroads_desc:0 "Благодаря её стратегическому расположению, Арантига – важнейший торговый узел континента."
ARA_arantiga_forever:0 "Арантига навсегда!"
ARA_arantiga_forever_desc:0 "В Грифонии полно самых разных империалистов, безумцев и тиранов. Им не покорить Арантигу! Мы будем сражаться до самого конца, защищая наше существование в Грифонии, даже если нам придется это делать в одиночку."
ARA_civ_primacy:0 "Приоритет гражданской экономики"
ARA_civ_primacy_desc:0 "Вкусный обед, да варенье с чаем на десерт!" #Референс? Хорошо подходит -Ele
ARA_tourist_industry:0 "Туристическая Промышленность"
ARA_tourist_industry_desc:0 "Приезжайте в Арантигу, самую солнечную страну Грифонии!"
ARA_golden_age_idea:0 "Новый золотой век!"
ARA_golden_age_idea_desc:0 "Новый золотой век пришел! Век мира и процветания! Мы с надеждой смотрим в наше будущее, ведь наш король с уверенностью ведет нас в прекрасный новый день!"
ARA_encouraging_minorities:0 "Поддержка меньшинств"
ARA_encouraging_minorities_desc:0 "Все этнические группы в Арантиге защищены законом, что позволяет их культурам процветать."
###empire ideas###
ARA_fragile_rule_1:0 "Хрупкая власть"
ARA_fragile_rule_1_desc:0 "Завоёвывая новые земли, мы пренебрегали созданием надлежащих властных структур, поскольку нам нужно было действовать быстро, пока наши многочисленные враги не собрали силы против нас. Теперь, когда они окончательно повержены, нам приходится расхлёбывать последствия прежних необдуманных решений. Экономика разрушена, наши наместники действуют скорее как варварские сатрапы, чем как гражданские управленцы, и мы слишком рассредоточили силы."
ARA_fragile_rule_2:0 "Хрупкая Власть"
ARA_fragile_rule_2_desc:0 "Что ты делаешь тут?"
ARA_fragile_rule_3:0 "Хрупкая Власть"
ARA_fragile_rule_3_desc:0 "Ты не должен этого видеть."
ARA_fragile_rule_4:0 "Хрупкая Власть"
ARA_fragile_rule_4_desc:0 "Ты получил эту идею через консоль?"
ARA_fragile_rule_5:0 "Хрупкая Власть"
ARA_fragile_rule_5_desc:0 "Кончай читерить, играй в игру так, как было задуманно!"
ARA_fragile_rule_6:0 "Хрупкая Власть"
ARA_fragile_rule_6_desc:0 "Ублюдок, мать твою, а ну иди сюда, говно собачье! А? Сдуру решил ко мне лезть?! Ты, засранец вонючий, мать твою, а? Ну, иди сюда, попробуй меня трахнуть, я тебя сам трахну, ублюдок, онанист чертов, будь ты проклят! Иди, идиот, трахать тебя и всю твою семью, говно собачье, жлоб вонючий, дерьмо, сука, падла! Иди сюда, мерзавец, негодяй, гад, иди сюда, ты, говно, ЖОПА!. – §YКровь и Бетон§!: §RИстория Любви§!" #олды помнят -Ele
#Ох, если бы мне были доступны dynamic variables, когда я это кодил... Объяснение: идеи fragile_rule_2-6 существуют только для сносок, перечисляющих эффекты фокусов, и не могут появиться как национальные духи Арантиги в нормальной игре (то же правдиво для серии идей fr9000). Эти описания видны только читерам и исследователям файлов кода. Сообщение для последних: Привет! Желаю вам найти то, что вы здесь ищете! -Elegioneer
