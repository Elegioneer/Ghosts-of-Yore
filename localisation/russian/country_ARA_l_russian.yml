ARA_imperial_admiralty:0 "Имперское Адмиралтейство"
ARA_imperial_admiralty_desc:0 "Недавно созданное Адмиралтейство Арантиги будет играть ключевую роль в создании нашего нового флота. Поскольку Военно-морские силы Арантиги молоды, нам предстоит ещё многое сделать, если мы хотим господствовать на морях."
ARA_imperial_admiralty_2:0 "Имперское Адмиралтейство"
ARA_imperial_admiralty_2_desc:0 "Недавно созданное Адмиралтейство Арантиги будет играть ключевую роль в создании нашего нового флота. Поскольку Военно-морские силы Арантиги молоды, нам предстоит ещё многое сделать, если мы хотим господствовать на морях."
ARA_arantigan_legions:0 "Легионы Арантиги"
ARA_arantigan_legions_desc:0 "Годы завоеваний превратили Легионы в силу, с которой приходится считаться. Бесстрашные, изобретательные и опытные, они — самая мощная боевая сила в нашем распоряжении."
ARA_imperial_government:0 "Имперское Правительство"
ARA_imperial_government_desc:0 "Недавно реорганизованная бюрократия стала гораздо эффективнее, и благодаря ей, Император Доротеос может легко управлять своими обширными владениями."
ARA_spoils_of_war_idea:0 "Военные трофеи"
ARA_spoils_of_war_idea_desc:0 "Все богатства павших королевств и империй теперь наши..."
ARA_retrofitting_navy:0 "Модернизация флота"
ARA_retrofitting_navy_desc:0 "Покорив многочисленных врагов Арантиги, мы завладели их верфями и запасами морского снаряжения. Используя их корабли и экипажи, мы можем быстро создать собственный флот с нуля."
ARA_massive_spending:0 "Огромные траты"
ARA_massive_spending_desc:0 "Огромная часть наших средств уходит на особые проекты."
ARA_sizeable_spending:0 "Весомые траты"
ARA_sizeable_spending_desc:0 "Приличная часть наших средств уходит на особые проекты."
ARA_small_spending:0 "Небольшие траты"
ARA_small_spending_desc:0 "Небольшая часть наших средств уходит на особые проекты."
ARA_griffing_dams:0 "Дамбы на реке Гриффкинг"
ARA_griffing_dams_desc:0 "Масштабная ирригационная система, построенная в Герцланде, значительно способствовала развитию сельского хозяйства, и теперь в бывших землях Империи наблюдается избыток зерна. Более того, многочисленные плотины, построенные на реке Гриффкинг, также стали источником дешевой и устойчивой электроэнергии для Герцланда, что привело к бурному развитию электрифицированных районов в регионе."
ARA_yale_universities:0 "Университеты Йеля"
ARA_yale_universities_desc:0 "Многие йельские учёные либо бежали от гнева Арантигоса, либо были убиты во время завоевания Герцланда, но те, кто остался, сумели хотя бы частично восстановить знаменитые университеты Йеля. Их помощь жизненно важна для нашей бурно развивающейся науки."
ARA_integrating_herzland:0 "Интеграция Герцланда"
ARA_integrating_herzland_desc:0 "В Герцланде проходит операция по умиротворению и интеграции в нашу страну. Значительная часть ресурсов государства временно перенаправлена в Герцланд для финансирования этих усилий."
ARA_integrating_wingbardy:0 "Интеграция Вингбардии"
ARA_integrating_wingbardy_desc:0 "В Вингбардии проходит операция по умиротворению и интеграции в нашу страну. Значительная часть ресурсов государства временно перенаправлена в Вингбардию для финансирования этих усилий."
ARA_integrating_aquileia:0 "Интеграция Аквелии"
ARA_integrating_aquileia_desc:0 "В Аквелии проходит операция по умиротворению и интеграции в нашу страну. Значительная часть ресурсов государства временно перенаправлена в Аквелию для финансирования этих усилий."
ARA_integrating_the_west:0 "Интеграция Запада"
ARA_integrating_the_west_desc:0 "В западных регионах проходит операция по умиротворению и интеграции в нашу страну. Значительная часть ресурсов государства временно перенаправлена туда для финансирования этих усилий."
ARA_integrating_the_east:0 "Интеграция Востока"
ARA_integrating_the_east_desc:0 ""В восточных регионах проходит операция по умиротворению и интеграции в нашу страну. Значительная часть ресурсов государства временно перенаправлена туда для финансирования этих усилий."
ARA_integrating_the_north:0 "Интеграция Севера"
ARA_integrating_the_north_desc:0 "В северных регионах проходит операция по умиротворению и интеграции в нашу страну. Значительная часть ресурсов государства временно перенаправлена туда для финансирования этих усилий."
ARA_integrating_the_south:0 "Интеграция Юга"
ARA_integrating_the_south_desc:0 "В южных регионах проходит операция по умиротворению и интеграции в нашу страну. Значительная часть ресурсов государства временно перенаправлена туда для финансирования этих усилий."
ARA_whispers_of_dissent:0 "Шёпот во тьме"
ARA_whispers_of_dissent_desc:0 "Мы сокрушили армии наших врагов, но они отказались признать поражение. Они строят заговоры против Арантиги и сеют раздор среди нашего населения."
ARA_voices_of_dissent:0 "Голоса во тьме"
ARA_voices_of_dissent_desc:0 "Голоса недовольных становятся все громче..."
ARA_southerners_dominance:0 "Превосходство южан"
ARA_southerners_dominance_desc:0 "Грифоны родом из Арантиги и Вингбардии теперь составляют новую элиту нашей империи. Государственный аппарат составлен из южан и символического числа представителей других культур. Многие группы населения империи возмущены тем, что мы не расплатились с ними за их верность, и это лишь укрепило решимость многочисленных мятежников, стремящихся разделить нашу страну. По крайней мере, мы можем доверять нашим чиновникам в таких вопросах. Вероятно, можем..."
ARA_minorities_supressed:0 "Подавление меньшинств"
ARA_minorities_supressed_desc:0 "С введением новой политики ассимиляции мы стремимся укрепить целостность империи. На представителей больших этносов она не повлияет, но бесчисленные меньшинства, ставшие объектами культурной реформации, пришли в бешенство. К тому же, видные представители интеллигенции заявили, что наши планы неприемлемы с точки зрения морали и этики. Но поскольку большинство не выступило против новых законов, они останутся в силе."
ARA_minorities_protected:0 "Защита меньшинств"
ARA_minorities_protected_desc:0 "Быть арантийцем теперь означает нечто большее, чем принадлежность к определённой нации. Неважно, на каком языке вы говорите и из какого уголка мира вы родом, — у каждого есть своё место и роль в нашей новой империи."
ARA_skyfall_trade:0 "Порт Скайфола"
ARA_skyfall_trade_desc:0 "Контролируя Скайфол, важнейший порт Грифонии, мы можем пользоваться всеми преимуществами международной торговли."
ARA_skyfall_benefits:0 "Скайфольская сделка"
ARA_skyfall_benefits_desc:0 "В обмен на справедливую долю прибыли, олигархам Скайфола было разрешено продолжать свою деятельность под арантийским надзором. Хотя сделка сейчас выгодна обеим сторонам, доверия между ними мало."
ARA_end_of_chivalry:0 "Конец рыцарства"
ARA_end_of_chivalry_desc:0 "В эпоху танков и промышленной войны нам не нужны психи, разглагольствующие о рыцарстве и чести. Место этим идеям уже давно в музеях."
ARA_knights_of_arantigos:0 "Рыцари Арантигоса"
ARA_knights_of_arantigos_desc:0 "Рыцарские ордена в Грифонии многочисленны, но враждующие группы независимых рыцарей совершенно не устраивают Доротеоса. Поэтому, чтобы эффективнее использовать их навыки, рыцарские ордена были объединены в "Рыцарей Арантигоса"."
ARA_gryps_nationalized:0 "Национализация активов Грюф-Зюд"
ARA_gryps_nationalized_desc:0 "Мы решили национализировать активы во владении "Грифус Зюдконтинент Гезельшафт". Так заканчивается господство этой могущественной компании на юге. Доротеос сможет использовать эти средства гораздо эффективнее, чем сама компания."
ARA_gryps:0 "Грифус Зюдконтинент-Гезельшафт"
ARA_gryps_desc:0 "Грифоньей Компании Южного Континента позволено действовать вновь, хоть её нынешнее влияние и богатство — лишь тень былого величия. Уступки перед государством уменьшили мощь некогда великой компании, и теперь она отчитывается перед Императором, а не перед акционерами."
ARA_himss_idea:0 "ССЕИВ"
ARA_himss_idea_desc:0 "Секретная Служба Его Императорского Величества отвечает за борьбу как с внутренними, так и с внешними врагами государства любым путем."
ARA_Religious_Pluralism:0 "Свобода вероисповедания"
ARA_Religious_Pluralism_desc:0 "Хоть культ Арантигоса-Борея и культ Второго Арантигоса являются официальными государственными религиями, наше правительство теперь терпимо относится к другим верованиям. Святыни и места поклонения теперь защищены законом, а их жрецы освобождены из тюрем. Пока грифоны не восстают, мы позволяем им поклоняться кому угодно."
ARA_Memories_of_Freedom:0 "Воспоминания о свободе"
ARA_Memories_of_Freedom_desc:0 "Наши враги лежат у наших ног, но их убеждения сильны, как никогда. Республиканские настроения распространяются в народе, и, хотя мы стараемся изо всех сил, нам, возможно, никогда не удастся уничтожить идеи свободы и независимости."
ARA_arantigan_parliament_idea:0 "Арантийский Парламент"
ARA_arantigan_parliament_idea_desc:0 "Держи друзей близко, а врагов еще ближе. Возможно, вместо того, чтобы сражаться с республиканцами на поле боя, нам следует пригласить их в правительство. Основав парламент Арантиги (без законодательного права) и способствуя разобщенности среди мятежников, мы сможем беспрепятственно продолжать наше правление. Ни одному грифону не придётся погибнуть, а мятежники будут содержаться там, где Доротеос сможет их контролировать."
ARA_Noble_Reservation:0 "Сохранение дворянских титулов"
ARA_Noble_Reservation_desc:0 "Поскольку влияние знати постепенно угасает, мы позволим дворянам и дальше гнить в своих разваливающихся дворцах, пока они не исчезнут..."
ARA_Equality_under_Emperor:0 "Равенство под властью Императора"
ARA_Equality_under_Emperor_desc:0 "Арантигос совершил довольно неожиданный поступок, лишив всех дворян титулов и конфисковав остатки их поместий. Последовавшие за этим земельные реформы привели к значительному улучшению положения обыкновенных грифонов в Империи."
ARA_New_Nobility:0 "Новое дворянство"
ARA_New_Nobility_desc:0 "Дворяне Арантиги верны своему благодетелю — Арантигосу II и помогают ему управлять его огромной империей и ее необразованными массами простогрифонов."
ARA_pure_minds:0 "Чистые Умы"
ARA_pure_minds_desc:0 "[Данные удалены]" #Сорри. Изначальный референс уловят и русскоговорящие. Тем более, эта строка старше первого релиза TNO -Ele
ARA_state_of_peace:0 "Мир и процветание"
ARA_state_of_peace_desc:0 "Годами единственной реальностью, которую мы знали, была война. Арантийцы сражались и погибали, а те, кто не был на передовой, проводили бесчисленные часы на заводах, чтобы снабжать наших солдат оружием и боеприпасами. Теперь, когда мы добились победы, разве наш народ не заслуживает мира?"
ARA_foreign_influence:0 "Влияние извне"
ARA_foreign_influence_desc:0 "Несмотря на усилия наших СМИ, некоторые грифоны по-прежнему считают, что Арантига — не самая процветающая страна в мире, и доверяют лжи, распространяемой иностранцами."
ARA_griffonian_free_trade_agreement:0 "Соглашение о свободной торговле в Грифонии"
ARA_griffonian_free_trade_agreement_desc:0 "Торговля между Речной Федерацией и Арантийской Империей процветает. С подписанием нового соглашения создаётся крупнейшая в мире зона свободной торговли, обеспечивающая процветание обеих стран."
ARA_conquest_of_the_west:0 "Завоевание Запада"
ARA_conquest_of_the_west_desc:0 "Нова Грифония — страна множества психов, революционеров и негодяев, и теперь все они — часть нашей нации. Замечательно..."
ARA_welfare_policy:0 "Соцобеспечение"
ARA_welfare_policy_desc:0 "Справедливая зарплата, обильная еда и здравоохранение подавляют восстания даже лучше танков. Поддержим грифонов в хорошем настроении, и у них не останется времени думать о восстании!"
ARA_work_camp1:0 "Трудовые лагеря"
ARA_work_camp1_desc:0 "Нам нужно разобраться с огромным избытком диссидентов, мятежников и поверженных врагов. Вместо того, чтобы держать их в тюрьмах, мы можем использовать их в качестве дешёвой рабочей силы. После нескольких лет строительства дорог и вырубки лесов они будут гораздо менее склонны к восстанию против нас..."
ARA_minotaur_rebels:0 "Восстание минотавров"
ARA_minotaur_rebels_desc:0 "Минотавры Астериона — цепкие и отчаянно независимые существа. Хотя мы разбили их армии, они всё ещё отказываются признать новых правителей и ведут против нас партизанскую войну."
ARA_riverpony_resistance:0 "Сопротивление речных пони"
ARA_riverpony_resistance_desc:0 "Речные Земли — идеальное место для любого партизана, и, конечно же, там полно диссидентов всех возможных рас и идеологий. Однако все эти группы едины в своей ненависти к империи и готовы на всё, чтобы её свергнуть. Значительная часть нашей армии занята обеспечением порядка в Речных Землях, и нам с трудом удаётся контролировать миллионы мятежных граждан."
ARA_integrating_ponies:0 "Умиротворение пони"
ARA_integrating_ponies_desc:0 "Может пройти некоторое время, прежде чем северные пони примут своего нового императора-грифона..."
ARA_magic_of_friendship:0 "Магия дружбы"
ARA_magic_of_friendship_desc:0 "Наши новые подданные пони распространяют свои опасные идеологии, сея раздор и дестабилизируя Арантийскую Империю. Грифоны, вместо того чтобы следовать нашим традициям, твердят о гармонии и демократии... Они поддались опасной пропаганде Аликорнов."

### Zebrica Expansion Ideas ###
ARA_expanding_the_arsenal:0 "Расширение арсенала"
ARA_expanding_the_arsenal_desc:0 "Абсолютное оружие Императора — сила миллиона солнц — под фалангами его когтей."
ARA_arantigan_payment:0 "Плата от Арантиги"
ARA_arantigan_payment_desc:0 "Арантига платит нам огромную сумму в обмен на Кольтфагенские земли."
ARA_investing_in_aby:0 "Инвестиции в Абиссинию"
ARA_investing_in_aby_desc:0 "Мы направляем огромные средства и ресурсы на промышленное развитие Абиссинии."
ARA_arantigan_aid_aby:0 "Арантийская помощь"
ARA_arantigan_aid_aby_desc:0 "Наши зарубежные союзники предоставляют нам столь необходимые инструменты и экспертные знания для дальнейшего развития промышленности. Однако некоторые политики, придерживающиеся более традиционных взглядов, утверждают, что жадные инвесторы из Арантиги стремятся лишь эксплуатировать нашу молодую страну..."

### Naval Ideas ###
ARA_trained_marines:0 "Специализированные морпехи"
ARA_trained_marines_desc:0 "Хотя нашим армиям нет равных в Грифонии, на других континентах всё ещё много врагов. Нас от них отделяет целый океан, и для вторжения нам понадобятся особые морские пехотинцы."
ARA_masters_of_the_oceans_idea:0 "Властители морей"
ARA_masters_of_the_oceans_idea_desc:0 "Хотя начало нашего флота было скромным, теперь мы готовы соперничать с другими морскими державами. Потребуется время, чтобы мы стали повелителями морей, но мы уверенно движемся к этому."

### Focus ###
ARA_the_new_airforce:0 "Рождение ВВС"
ARA_the_new_airforce_desc:0 "Мир вокруг нас меняется. Грифонам больше не нужно летать только благодаря крыльям; мощные двигатели позволяют нам парить в небесах. Нам следует инвестировать в военное применение этой технологии, чтобы не отставать."
ARA_new_fighters:0 "Доминирование в небесах"
ARA_new_fighters_desc:0 "Бомбардировщики, конечно, хороши, но без защиты они совершенно бесполезны. Поэтому нам следует сосредоточить усилия на создании лучших защитников неба Арантиги."
ARA_further_development:0 "Экспериментальные истребители"
ARA_further_development_desc:0 "Возможности реактивных двигателей завораживают. Нам следует попытаться адаптировать эту технологию для военных нужд. Это может обеспечить господство в небе на долгие годы."
ARA_new_heavy_fighters:0 "Тяжелые истребители"
ARA_new_heavy_fighters_desc:0 "Наши малые истребители доказали свою эффективность, но нам также нужны истребители с дальностью полёта бомбардировщиков. Решением может стать отказ от манёвренности ради выносливости, брони и вооружения."
ARA_airports:0 "Спарлейские аэродромы"
ARA_airports_desc:0 "Наши самолёты не смогут летать, если их негде хранить и неоткуда запускать. Однако подходящих мест для аэродромов предостаточно. Нужно лишь дать разрешение на строительство."
ARA_foregin_designs:0 "Импорт иностранных самолётов"
ARA_foregin_designs_desc:0 "Учитывая, что промышленность у нас небольшая, было бы разумно начать развитие наших ВВС с покупки самолётов, а не полагаться на собственное производство. В конце концов, мы сможем усовершенствовать их позже."
ARA_napalm:0 "Напалм"
ARA_napalm_desc:0 "Война не приемлет полумер. Либо мы станем победителями, либо потерпим поражение. Потому отныне наши бомбардировщики начнут использовать самое разрушительное оружие – напалм. В конце концов, никто не способен поддерживать военное производство, когда заводы горят."
ARA_finest_aces:0 "Лучшие асы"
ARA_finest_aces_desc:0 "Превосходная программа подготовки обеспечит полёты только лучших пилотов на наших самолётах! Во всех аспектах ведения войны Арантига будет на высоте!"
ARA_new_bombers:0 "Засеять вражьи земли солью"
ARA_new_bombers_desc:0 "Тактические бомбардировщики хороши, но нам нужны тяжёлые боевые самолёты, способные выдержать натиск перехватчиков и сбросить бомбы далеко за линию фронта. Именно в этом заключается будущее воздушной войны."
ARA_new_closer_air:0 "Усовершенствовать чертежи"
ARA_new_closer_air_desc:0 "Усовершенствуя отдельные компоненты наших самолетов, мы можем значительно повысить эффективность наших ВВС."
ARA_new_heavy_bombers:0 "Стратегическое уничтожение"
ARA_new_heavy_bombers_desc:0 "Бомбардировка ключевых позиций противника: складов снабжения, железных дорог и прочей инфраструктуры — потребует специализированных самолётов. Их разработка должна стать приоритетом."

ARA_rumare_exercises:0 "Военные учения на озере Румейр"
ARA_rumare_exercises_desc:0 "Арантига не имеет выхода к морю. Однако она расположена на берегу озера Румейр, и мы командуем небольшой флотилией патрульных катеров. Экипаж этих судов послужит идеальной основой для полноценного флота, как только мы захватим подходящий порт."
ARA_foreign_naval_doctrines:0 "Изучение иностранных доктрин"
ARA_foreign_naval_doctrines_desc:0 "У нас нет военно-морских традиций, и наши знания в этой области крайне ограничены. Если мы хотим соперничать с признанными державами на море, первым шагом должно стать изучение и подражание их военно-морским доктринам."
ARA_destroyer_fleet:0 "Флотилия эсминцев"
ARA_destroyer_fleet_desc:0 "Быстрые и смертоносные, эсминцы — важнейший элемент нашего флота: они охраняют конвои и поддерживают более крупные корабли. Эсминцы также легко построить, и они станут основой нашего флота, пока мы не построим крейсеры и линкоры."
ARA_submarine_designs:0 "Разработка подлодок"
ARA_submarine_designs_desc:0 "Нельзя недооценивать способность подводных лодок нарушать торговлю. Используя их, мы можем парализовать противника, гораздо более сильного, чем мы; используя несколько подводных лодок, можно уничтожать целые конвои и малые флоты."
ARA_southern_dockyards:0 "Южные верфи"
ARA_southern_dockyards_desc:0 "Взяв под контроль великий город Карфин, мы заполучили однин из важнейших портовых городов юга. Нам следует увеличить его военно-морские мощности, чтобы обеспечить скорейшее создание флота Арантиги."
ARA_cruisers_development:0 "Развитие крейсеров"
ARA_cruisers_development_desc:0 "По мере расширения нашего флота возникает нужда в крупных кораблях с большой огневой мощью. Линкоры пока нам не по плечу, поэтому, очевидно, универсальный крейсер — это следующий шаг для флота Арантиги."
ARA_naval_doctrine_improvement:0 "Расширение доктрины"
ARA_naval_doctrine_improvement_desc:0 "По мере расширения нашего флота, он становится более зрелым и мощным. Мы должны способствовать его развитию, открывая военно-морские школы, модернизируя устаревшие корабли и проводя масштабный пересмотр военно-морской доктрины."
ARA_marine_corps:0 "Корпус морской пехоты"
ARA_marine_corps_desc:0 "Наши танки и пехота более чем способны победить врага на земле. Но что, если враг за морем? Завоевание превосходства на море — это одно, а высадка десанта — совсем другое. Для этого нам понадобятся специализированные войска: морская пехота."
ARA_equus_invasion_training:0 "От берега к берегу"
ARA_equus_invasion_training_desc:0 "За Небесным Морем дремлет гигант – Эквестрия. Два континента разделяет огромный океан, и хотя военные действия между нами маловероятны, нам следует готовиться к этому. Нужно на всякий случай спланировать возможное вторжение в Эквус."
ARA_arantigan_battleships:0 "Флагманы флота"
ARA_arantigan_battleships_desc:0 "Мощные и непобедимые линкоры — истинные короли морского боя. С ними мы сможем победить любого врага!"
ARA_carriers_are_future:0 "В небесах и на море"
ARA_carriers_are_future_desc:0 "Прогресс неумолим. Нашим адмиралам очевидно, что линкоры быстро устаревают. Не обременённый многолетним опытом, наш флот обратит свой взор на будущее морской войны – авианосцы."
ARA_masters_of_the_oceans:0 "Арантига, правь морями!"
ARA_masters_of_the_oceans_desc:0 "Пришло время Арантиге занять своё законное место среди величайших морских держав мира. Наши флоты будут повсюду, и мы дадим бой нашим врагам, где бы они ни находились."

#ARA_issue_of_economic_dependance:0 "Разобраться с экономикой"
#ARA_issue_of_economic_dependance_desc:0 "Откровенно говоря, экономика Арантиги находится в плачевном состоянии. Мы должны решить этот вопрос, если хотим стать мировой державой. Первая задача в списке - определить нашу позицию по отношению к Вингбардии."
#ARA_our_own_way:0 "Наш собственный путь"
#ARA_our_own_way_desc:0 "Арантиге нужен свой собственный путь. Если мы не станем экономически независимыми, то помимо наших обычных обязательств в Пакте, мы будем вынуждены участвовать в войнах с врагами альянса. Настало время освободиться от когтей вингбардийских промышленников."
#ARA_build_roads:0 "Арантийские железные дороги"
#ARA_build_roads_desc:0 "Если мы хотим стать промышленной державой, нам нужен прочный фундамент. Подготовка страны к будущему большому скачку обязательна, если мы хотим быть экономически независимыми. Поэтому мы построим железную дорогу, которая протянется через всю страну."
#ARA_industrial_buildup:0 "Промышленное строительство"
#ARA_industrial_buildup_desc:0 "Большое количество фабрик принесёт только пользу. Логично, что мы должны сосредоточить наши усилия на развитии индустрии. Мы предоставим субсидии выбранному ряду компаний."
#ARA_mining_operations:0 "Добыча руды из холмов"
#ARA_mining_operations_desc:0 "Разведав больше месторождений металлов на холмах Арантиги, мы сможем открыть еще шахт, дабы обеспечить нашу экономику ресурсами. Арантига должна полагаться на собственную ресурсную базу."
#ARA_import_machinery:0 "Импортировать машины"
#ARA_import_machinery_desc:0 "Нам нужны тракторы, грузовики и другие промышленные машины, которые помогут нашей промышленности расти. Покупка такой техники - отличное решение, которое поможет нам удовлетворить наши потребности."
#ARA_foreign_experts:0 "Пригласить иностранных экспертов"
#ARA_foreign_experts_desc:0 "Это не только облегчит иностранцам налаживание экспорта в нашу страну, но и поможет в борьбе с пандемией неграмотности нашей нации. Однако нам нужно чем-то привлечь их в Арантигу. Это небольшая цена за прогресс."
#ARA_industrial_revolution:0 "Модернизировать промышленность"
#ARA_industrial_revolution_desc:0 "После всех улучшений мы наконец сможем оставить примитивные технологии в прошлом и войти в эру современной индустрии!"
#ARA_transition_finished:0 "Возрождение экономики"
#ARA_transition_finished_desc:0 "После внедрения всех экономических новшеств мы наконец можем считать свою экономику по-настоящему сильной, пусть и относительно. Арантига с гордостью воспряла из руин благодаря своим собственным усилиям."
#ARA_go_with_wingbardians:0 "Укрепить связи с Вингбардией"
#ARA_go_with_wingbardians_desc:0 "Наша экономика уже сильно связана с Вингбардией. И единственное, что имеет смысл в данный момент – это укрепить эти связи и использовать их в нашу пользу. Это, конечно, сделает нас более зависимыми от Вингбардии, но и в этом есть свои преимущества."
#ARA_vinyards:0 "Расширить виноградники Алюбвира"
#ARA_vinyards_desc:0 "Вино – широко распространенный предмет роскоши, которым наслаждаются по всему Грифоньему континенту и за его пределами. Поэтому оно определенно имеет спрос. Расширение наших уже существующих виноградников в Алюбвире должно ускорить наш экономический рост."
#ARA_tourism:0 "Поощрять туризм"
#ARA_tourism_desc:0 "Туризм – чудесная вещь. Пони, грифоны и даже зебры приезжают в нашу страну, чтобы полюбоваться нашими великолепными достижениями. Нужно активно поощрять их тратить деньги в нашей стране. Это отличный способ привлечь больше средств в нашу экономику."
#ARA_tax_incentives:0 "Пригласить инвесторов"
#ARA_tax_incentives_desc:0 "Инвесторы могут приносить нам деньги и создавать новый бизнес в нашей стране. Дополнительное привлечению инвесторов может неплохо помочь нашей растущей экономике."
#ARA_cement_factories:0 "Арантиuские лесопилки"
#ARA_cement_factories_desc:0 "Наша маленькая страна наполнена различными лесами: от стареющих дубов до молодых кленов. У Арантиги нет недостатка в природных ресурсах. И всё же мы почти не используем их. После переговоров с вингбардийскими инвесторами мы начнем эксплуатировать наши леса, но за каждое вырубленное дерево мы посадим два новых. Это предотвращает эрозию почвы и сохраняет нашу естественную красоту."
#ARA_industrial_assistance:0 "Попросить помощи в индустриализации"
#ARA_industrial_assistance_desc:0 "Высокомерие - пережиток прошлого. Мы должны быть скромнее если мы хотим быть с Вингбардией на равных. Запросить помощь для нашей экономики - задача первостепенной важности."
#ARA_cigars:0 "Сигарный завод Понтелеса"
#ARA_cigars_desc:0 "Табачная промышленность - отличное капиталовложение. Сигары не только хорошо продаются, но и легко производятся, к тому же они помогают гражданам пережить стресс. Слухи о снижении ожидаемой продолжительности жизни в результате чрезмерного использования - просто преувеличения."
#ARA_equals:0 "Новый путь"
#ARA_equals_desc:0 "Наша экономика возродилась! Благодаря сотрудничеству с нашими союзниками Арантига стоит с гордо поднятой головой. Наши экономические связи сплотили всех нас."
#ARA_science_base:0 "Модернизация науки"
#ARA_science_base_desc:0 "С развитой промышленной базой мы наконец можем направить свои усилия на научные исследования. Нас ждёт блестящее научное будущее."

### New Army Foci ###
ARA_GOY_new_age_new_army:0 "Новая эра – новая армия"
ARA_GOY_new_age_new_army_desc:0 "Мы входим в новую эру ведения боевых действий. Времена мечей и щитов ушли. Настало время огнестрельного оружия и танков. Нужно выбрать наш путь развития и убедиться, что мы больше не будем плестись позади всех."
ARA_GOY_new_academy:0 "Собрание генералов"
ARA_GOY_new_academy_desc:0 "Когда-то мы были величайшим народом Грифонии. А сейчас мы используем устаревшие доктрины в наших необученных войсках. Полная проверка армии – первостепенная задача. Пришло время создать новые доктрины и адаптироваться к постоянно меняющимся правилам ведения войны."
ARA_GOY_mobile_warfare_doctrine:0 "Невообразимая скорость"
ARA_GOY_mobile_warfare_doctrine_desc:0 "Кратерус прибыл из Зебрики, познав там все чудеса танков, вездеходов и грузовиков – изобретений, меняющих облик войны. Неприступные ранее траншеи – не преграда для механических бестий. Очевидно, что принятие доктрины манёвренной войны принесет нам лишь преимущества в долгосрочной перспективе."
ARA_GOY_develop_doctrine:0 "Фронтовые офицеры"
ARA_GOY_develop_doctrine_desc:0 "По легенде, Арантигос любил лично вести вперёд мобильное крыло своей армии. Он не боялся смерти. И наши офицеры тоже не должны её боятся. Если мы дадим им больше инициативы, то наши бойцы воодушевятся и храбро пойдут за ними в атаку!"
ARA_GOY_cult_of_speed:0 "Культ скорости"
ARA_GOY_cult_of_speed_desc:0 "Скорость - решающий фактор современной войны. Если ты выбираешь место и время сражения – ты уже наполовину победил. И если мы сможем наступать быстрее, чем враги – отступать, то у них не будет шансов победить нас."
ARA_GOY_actual_trucks:0 "Мотострелки"
ARA_GOY_actual_trucks_desc:0 "Если одна моторизованная дивизия может служить и молотом, и наковальней – использовать бреши в обороне и сковывать формирования врага, нам нужно срочно превратить всю армию в такие дивизии. Кроме того, моторизация войск позволит нам упростить их снабжение."
ARA_GOY_tanks_for_the_army:0 "По машинам!"
ARA_GOY_tanks_for_the_army_desc:0 "Наши бронированные мастодонты готовы идти на прорыв и уничтожать наших врагов. Мы покажем им силу наших инноваций! Ничто не устоит на пути наших танков."
ARA_GOY_better_tanks:0 "Стальные легионы"
ARA_GOY_better_tanks_desc:0 "Необходимо снабжать наши бронетанковые войска новейшими боевыми машинами. Враги Арантиги многочисленны, а наши производственные мощности малы. Потому в вопросе производства танков мы положимся на качество, а не количество."
ARA_GOY_superior_warfare_doctrine:0 "Огонь на подавление"
ARA_GOY_superior_warfare_doctrine_desc:0 "Сам Арантигос знал цену такому орижию, которое может нанести удар по врагу, не дав ему права на ответ. Именно этим хороша артиллерия. Как сказал Никатор, "Враг – не угроза, если он уже мёртв"."
ARA_GOY_develop_superior_doctrine:0 "Рыцари новой эры"
ARA_GOY_develop_superior_doctrine_desc:0 "В прошлом великие рыцари в сияющих доспехах сражались против чудовищ из легенд и врагов нашего народа. Очевидно, что время этих рыцарей ушло, пусть они и продолжают вдохновлять нас. Нам нужно адаптироваться к нынешним реалиям или мы будем вынуждены плестись в конце."
ARA_GOY_mass_artillery:0 "Плотные обстрелы"
ARA_GOY_mass_artillery_desc:0 "Используя концентрированный огонь артиллерии, мы не только подорвем боевой дух врага, но также уничтожим их оборонительные позиции. Последующее пехотное наступление не получит почти никакого сопротивления."
ARA_GOY_better_artillery:0 "Обновить артиллерию"
ARA_GOY_better_artillery_desc:0 "Давно прошли времена катапульт и баллист, равно как времена крепостей и пушек. Пришла эпоха гаубиц и бункеров – и мы должны удостовериться, что используем всё самое новое."
ARA_GOY_fancier_guns:0 "Снарядить авангард"
ARA_GOY_fancier_guns_desc:0 "Большие пушки бесполезны без должной защиты. Несмотря на технологический прогресс, основой этой защиты остаётся простой арантийский солдат. Потому мы должны снарядить его по последнему слову техники."
ARA_GOY_continous_planning:0 "Преданные офицеры"
ARA_GOY_continous_planning_desc:0 "Поскольку артиллерия стала основой нашей армии, мы должны научить командиров других родов войск работать сообща с ней, а также предоставить специализированное образование офицерам артиллерийских дивизионов, чтобы повысить их эффективность."
ARA_GOY_new_school:0 "Возрождение Академии Спарлето"
ARA_GOY_new_school_desc:0 "Древняя столичная академия переживает не лучшие времена, но с нашими новыми офицерскими кадрами мы можем воссоздать её. Дух завоевателей ещё живёт в жителях Арантиги, и при должном обучении они раскроют свой потенциал."
ARA_GOY_new_guns:0 "Снарядить пехоту"
ARA_GOY_new_guns_desc:0 "Вне зависимости от артиллерии и танков, ядром современной армии остаются наши храбрые пехотинцы. Меньшее, что мы можем сделать, – это хорошо вооружить их."
ARA_GOY_new_artillery:0 "Пушки новой эры"
ARA_GOY_new_artillery_desc:0 "Ни один бункер, ни одна траншея, никакое укрепление не спасёт врага от наших артиллерийских обстрелов. Мы заставим их сражаться с нами лицом к лицу! А в честном бою один арантийский солдат не стоит костей и сотни солдат противника."
ARA_GOY_new_equipment:0 "Надёжные лопатки"
ARA_GOY_new_equipment_desc:0 "Пехотинец не сможет защитить себя, если у него не будет укрытия. Доработка вспомогательного оборудования должна быть в приоритете. Арантийский солдат должен быть готовым к длительному марш-броску в полном снаряжении – и лишняя сапёрная лопатка или аптечка ему точно не помешает."
ARA_GOY_spec_ops_program:0 "Форзе Специали" #Транслитерируем неанглийские выражения, кроме особых случаев -Ele
ARA_GOY_spec_ops_program_desc:0 "Нетрадиционные способы ведения войны наиболее смертоносны. Используя новые тактики, мы можем застать наших врагов врасплох. Эффективность идей Кассандра уже оправдана. Пришла пора ввести их в нашу военную доктрину."
ARA_GOY_nation_under_arms:0 "Вооружённое общество" #
ARA_GOY_nation_under_arms_desc:0 "Мировая напряженность растет. Очевидно, мы не сможем просто стоять и смотреть, как горит мир. Мы должны вооружиться. Давным-давно весь наш народ был готов к войне, и при необходимости, мы вооружимся вновь."
ARA_GOY_prepare_the_people:0 "Военная пропаганда" #В названиях этих фокусов была цитата Хайнлайна Вооруженное общество — это общество взаимной вежливости, но я сомневаюсь в её уместности, так что нафиг её -Ele
ARA_GOY_prepare_the_people_desc:0 "Нашим грифонам незачем сидеть дома, защищая своих родных и близких. В военизированном обществе они могут стать солдатами и защищать всех своих сограждан."
ARA_GOY_the_cadets:0 "Джовани Кадетти"
ARA_GOY_the_cadets_desc:0 "Молодые кадеты - это отделение Арантийских военных исследователей, которым поручена задача разработать новое оружие для армии. Нам нужно расширить их ряды, чтобы поручить им некоторые гражданские проекты."
ARA_GOY_guerilla_warfare:0 "Война до последнего"
ARA_GOY_guerilla_warfare_desc:0 "Капитуляция - удел трусов. Мы будем сражаться до последнего вздоха. Каждый арантиец выстоит перед ужасами войны, либо погибнет, пытаясь выстоять. Леса Арантиги прекрасно подходят для партизан, а ещё в них разместятся тайники с оружием."
ARA_GOY_mandatory_training:0 "Обязательная военная подготовка"
ARA_GOY_mandatory_training_desc:0 "Недопустимо, чтобы все грифоны оставались гражданскими. Каждый должен быть готов к призыву, если на то есть нужда. Потому все грифоны будут обучены военному делу, чтобы новобранцев было легко подготовить к боям."
ARA_GOY_radio_stations:0 "Военные частоты"
ARA_GOY_radio_stations_desc:0 "Знание планов противника - половина успешного сражения. Хотя шпионы остаются полезными, новые технологии позволят нам владеть обстановкой. Мы должны использовать это."
ARA_GOY_extensive_coscription_laws:0 "Расширение призыва"
ARA_GOY_extensive_coscription_laws_desc:0 "Наши вооруженные силы всё ещё слишком маленькие, и мы до сих пор нуждаемся в большем количестве солдат для защиты границ. Корректировка нашего закона о призыве позволит исправить эту ситуацию."
ARA_GOY_military_railroads:0 "Военные перевозки" #
ARA_GOY_military_railroads_desc:0 "Военизированное общество должно использовать армейские методы на все случаи жизни. Из нашей инфраструктуры можно выжать гораздо больше, если мы уточним расписание поездов и уплотним рассадку пассажиров. Это значительно улучшит пропускную способность нашей инфраструктуры."
ARA_GOY_builder_divisions:0 "Дивизиони ди Лаворо"
ARA_GOY_builder_divisions_desc:0 "Трудовые дивизии состоят из военных инженеров. Они специализируются в строительстве и обслуживании промышленности и инфраструктуры нашей нации - как военной, так и гражданской. Пришло время дать им поддержку, необходимую для повышения их эффективности."
ARA_GOY_reservist_housing:0 "Жильё для военных"
ARA_GOY_reservist_housing_desc:0 "Строительство казарм для наших войск позволит нам значительно расширить армию. Солдат, знающий, что ему предоставлено хорошее жилище, меньше волнуется о вещах, не связанных с военным делом."
ARA_GOY_fortified_nation:0 "Окопаться!"
ARA_GOY_fortified_nation_desc:0 "По сравнению с другими, наша армия мала, но хорошо обучена. Поэтому мы должны пользоваться всеми преимуществами, которые позволяют увеличить потери врага и уменьшить наши. Пора окопаться."
ARA_GOY_stocked_arsenals:0 "Заполнить арсеналы"
ARA_GOY_stocked_arsenals_desc:0 "Мы не сможем сражаться, если у нас нет оружия. Мы должны убедиться, что каждый грифон в армии полностью укомплектован. Важность подготовки неоценима, и в войсках тепло примут наши усилия."
ARA_GOY_mobilise_economy:0 "Мобилизовать экономику"
ARA_GOY_mobilise_economy_desc:0 "Наша экономика, пусть и сильна, но все же остается гражданской. Мы должны мобилизовать ее и подготовить её к военному времени, ведь победа в современной войне зависит от тыла, и для победы героям нужно легендарное оружие."
ARA_GOY_legendary:0 "Арантигос бы нами гордился"
ARA_GOY_legendary_desc:0 "Посмотрите на нас; мы полностью готовы к войне. Мы готовы вернуть то, что по праву принадлежит нам, и наша судьба лежит исключительно в наших когтях. Арантигос гордился бы нами!"
ARA_GOY_unmatched_army:0 "Бесподобная армия"
ARA_GOY_unmatched_army_desc:0 "Никто не командует такой же сильной армией, как наша. Никто не командует такой же прославленной армией, как наша. Дух славных предков живёт в сердцах наших бойцов. Слава Арантиге!"

#ARA_the_aftermath_of_the_coup:0 "Последствия"
#ARA_the_aftermath_of_the_coup_desc:0 "Улеглась пыль после переворота Доротеоса. Остался единственный вопрос - оно сработает?"
#ARA_coup_prevented:0 "Победа Маргарет"
#ARA_coup_prevented_desc:0 "Доротеос был побежден, его сторонники арестованы и ждут своей судьбы. Очевидно, мы больше не можем править, как прежде. Нужно реформировать правительство."
#ARA_army_purges:0 "Отправить предателей в отставку"
#ARA_army_purges_desc:0 "Учитывая поддержку, которую получил Доротеос, для нас жизненно необходимо разобраться с нелояльными частями наших войск, иначе подобное может повториться в будущем."
#ARA_deal_with_dorotheos:0 "Суд над Доротеосом"
#ARA_deal_with_dorotheos_desc:0 "Доротеос предстал перед судом по обвинению в государственной измене. Его ждет либо смерть, либо пожизненное заключение. Для него не будет милосердия."
#ARA_more_political_freedoms:0 "Развивать политическую сферу"
#ARA_more_political_freedoms_desc:0 "Хотя потомки Арантигоса правили Арантигой честно и справедливо в течение последних веков, стало ясно, что статус-кво становится неустойчивым. Мы разрешим создание и деятельность политических партий."
#ARA_deal_with_aftermath:0 "Политический сдвиг"
#ARA_deal_with_aftermath_desc:0 "Необходимо предпринять реформы, ведущие к гармонизации политики; только тогда Арантига сможет справиться с последствиями переворота."
#ARA_the_first_election:0 "Первые выборы"
#ARA_the_first_election_desc:0 "После легализации выборов сформировались различные партии. Политологи предполагают, что победителем на выборах может стать кто угодно, исключая опальных экстремистов."

ARA_PR_victory:0 "Победа реформаторов"
ARA_PR_victory_desc:0 "Удивительно, но Реформаторы одержали победу на выборах. Они обещают создание государства гармонии, похожего на далекую Эквестрию, но с нашими собственными уникальными особенностями. Грифоны Арантиги желают частично избавиться от своего военного мышления."
ARA_welfare_state:0 "Benessere"
ARA_welfare_state_desc:0 "Жители Арантиги - гордый народ и много они не просят, но нельзя отрицать, что есть часть общества, которая живет гораздо хуже, чем должна была бы. Мы внедрим систему социального обеспечения, чтобы грифоны, которые действительно переживают тяжелые времена, не остались одни."
ARA_educate_the_poor:0 "Школы для бедных"
ARA_educate_the_poor_desc:0 "Наша образовательная программа неплоха, но все же есть некоторые грифоны, которые никогда не получали надлежащего образования из-за своего плохого финансового положения. Мы должны полностью ликвидировать неграмотность в ближайшие пять лет."
ARA_foreign_investors:0 "Иностранные инвестиции"
ARA_foreign_investors_desc:0 "В прошлом году мы многое сделали для улучшения нашей экономики, но довести дело до конца самостоятельно мы не можем. Налоговые льготы и субсидии должны побудить состоятельных иностранцев инвестировать в Арантигу."
ARA_shakes_claws_with_the_baroness:0 "Договориться с Баронессой"
ARA_shakes_claws_with_the_baroness_desc:0 "Баронесса, будучи дворянкой, хорошо управляла страной в течение многих лет. Сотрудничество с ней не только сделает консерваторов нашими союзниками, но и повысит нашу легитимность."
ARA_a_rolemodel:0 "Образец для подражания"
ARA_a_rolemodel_desc:0 "Только взгляните на нас - превосходный образец грифоньей гармонии. Наша страна является настоящим украшением юга, маяком свободы среди ужасной неопределенности радикалов и империалистов. Конечно, наши корни не будут забыты, но они будут использоваться только для гарантии независимости Арантиги."

ARA_SDL_victory:0 "Победа сторонников Баронессы!"
ARA_SDL_victory_desc:0 "Сторонникам Баронессы дали еще один шанс, так что давайте не упустим его. Устойчивые, непрерывные реформы мягко приведут Арантигу в будущее и предотвратят рост любого дальнейшего экстремизма."
ARA_support_local_industries:0 "Поддержка отечественного бизнеса"
ARA_support_local_industries_desc:0 "Финансирование местных предпринимателей должно стать нашим первым действием. Их тяжелая работа — вот что делает Арантигу процветающей, а не гроши, бросаемые нам насмешливыми иностранцами!"
ARA_arantigan_diplomacy:0 "Арантийская дипломатия"
ARA_arantigan_diplomacy_desc:0 "В этом изменяющемся мире важность дипломатической гибкости не может быть переоценена. Арантига должна уметь маневрировать на мировой арене, иначе нас сметут."
ARA_new_police_force:0 "Guardia Pubblica"
ARA_new_police_force_desc:0 "В нашем обществе до сих пор присутствуют остатки сторонников Доротеоса, коммунистов и фашистов. Создание защиты против таких угроз – хороший первый шаг к стабильности."
ARA_arantigan_identity:0 "Укрепить наше единство"
ARA_arantigan_identity_desc:0 "Мы - спарлейнцы. И хоть восстановление всего нашего наследия – настоящее безумие, мы не должны забывать, кто мы такие. Традиции делают нас сильными и направляет в эти трудные времена."
ARA_sunny_spot:0 "Солнечное место Грифонии"
ARA_sunny_spot_desc:0 "Благодаря умелому руководству Баронессы мы успешно реформировали Арантигу. Старый Арантигос, конечно, не был бы доволен этим скромным участком земли, но он оценил бы его красоту и великолепие."
ARA_proper_base:0 "Современное общество"
ARA_proper_base_desc:0 "Настало время избавиться от старых суеверий и снова войти в мир как по-настоящему современное общество. Научный прогресс является наиболее важным для нации."

ARA_PCNA_victory:0 "Победа НКПА"
ARA_PCNA_victory_desc:0 "Радикальная группа, известная как НКПА, удивила всех победой на выборах. Их манифест объединяет популистские идеи с обеих сторон радикального политического спектра. Занятость и процветание для всех под защитой сильной армии!"
ARA_industrial_development_PCNA:0 "Национальная программа индустриализации"
ARA_industrial_development_PCNA_desc:0 "Сильное государство — промышленное государство. И, что более важно, промышленно развитое государство — это вооруженное государство. Наши существующие военные заводы должны быть расширены и улучшены, если мы хотим сохранить новый порядок."
ARA_loyal_army:0 "Преданная Армия"
ARA_loyal_army_desc:0 "Армия, которая верна не только государству, но и его идеалам - самая верная армия. Поэтому мы должны 'перевоспитать' наших солдат и показать им, для чего мы воюем, дабы сделать из них фанатичных воинов."
ARA_education_reforms_PCNA:0 "Реформа образования"
ARA_education_reforms_PCNA_desc:0 "Многих бедных и больных грифонов слишком долго скитались по нашей стране. Мы должны помочь им встать на лапы, дав государственное образование, вместе с обязательным учением о наших социалистических идеях."
ARA_foreign_intelligence_office:0 "Служба Национальной Безопасности"
ARA_foreign_intelligence_office_desc:0 "Недавняя попытка переворота показала, что среди нас есть предатели. Служба безопасности будет наблюдать за нашими гражданами и не допускать повторения подобной попытки захвата власти. Она также проследит за тем, чтобы население твёрдо поддерживало наше дело."
ARA_into_the_world:0 "В Новый Мир"
ARA_into_the_world_desc:0 "Арантига под нашим руководством вновь стала великой. Наш общественный прогресс движется в сторону новой эры. И мы не остановимся ни перед чем! Вперед, в новый, прекрасный мир!"

#ARA_arantigos_reborn:0 "Переворот Доротеоса"
#ARA_arantigos_reborn_desc:0 "Доротеос сделал рискованную ставку и выиграл. Неэффективный старый порядок уничтожен и довольно скоро мы восстановим нашу древнюю славу."
#ARA_save_sparletan_language:0 "Возродить спарлейтский язык"
#ARA_save_sparletan_language_desc:0 "Спарлейтский язык употребляется всё реже и реже, но он ещё не исчез. Мы должны запустить государственную программу по обучению этому языку всех граждан Арантиги. Восстановим наше наследие! Критика по поводу его нежизнеспособности и сложности запрещена."
#ARA_support_the_cult_of_megas_arantigos:0 "Поддержать культ Арантигоса-Борея"
#ARA_support_the_cult_of_megas_arantigos_desc:0 "Арантигос - грифон, который однажды правил нашим народом и половиной Грифонии. Распространено поверье, что Арантигос был воплощением Борея и его миссией было объединение всей Грифонии. Поддержка этих, ныне не исповедуемых, поверий принесет нам уважение и поддержку среди верующих."
#ARA_church_universities:0 "Школы при храмах"
#ARA_church_universities_desc:0 "Пока одни говорят, что религия слабо влияет на образование, другие пытается исправить это. С религиозной поддержкой культа мы можем начать открывать новые школы и университеты для нашего народа."
#ARA_solidify_rule:0 "Железная власть Доротеоса"
#ARA_solidify_rule_desc:0 "Еще остались те, кто боится истинного пути Арантиги. Мы должны проследить, чтобы каждый принял путь, который вернет нашей стране величие."
#ARA_army_and_nation:0 "Все должны служить"
#ARA_army_and_nation_desc:0 "Различия между гражданскими лицами и солдатами должны исчезнуть. Мы призовём каждого грифона в случае грифон будет служить государству, мы восстановим наше великолепие."
#ARA_loyatly_to_the_baron:0 "Преданность Доротеосу"
#ARA_loyatly_to_the_baron_desc:0 "Правление Доротеоса непоколебимо. Арантийцы должны следовать за ним без вопросов. Мы сможем осуществить наши амбиции только если все грифоны будут служить государству."
#ARA_heavy_nationalization:0 "Активная национализация"
#ARA_heavy_nationalization_desc:0 "Мы не можем позволить, чтобы наши национальные активы лежали без дела. Национализируя нашу промышленность, мы должны контролировать каждый аспект производства." 
#ARA_industrial_development:0 "Модернизация промышленности"
#ARA_industrial_development_desc:0 "С непрерывно растущей экономикой мы можем полностью модернизировать наше общество. В будущее, шаг за шагом, к самому современному обществу!"
#ARA_autarky:0 "Автаркия"
#ARA_autarky_desc:0 "Мы должны обрести экономическую независимость от Карфинского договора и поэтому нам требуется пропаганда самодостаточности. Если мы не сможем избавиться от кандалов Вингбардии, как мы хотим вернуть наше наследие?"
#ARA_to_the_strongest:0 "Возрождение Арантигоса"
#ARA_to_the_strongest_desc:0 "Доротеос получил видение от самого Борея. Он поручил Доротеосу перенять эстафету прошлого, чтобы провозгласить себя новым Арантигосом. Это явное знамение богов! Мы должны осуществить нашу судьбу."
#ARA_ancient_claims:0 "Древние притязания"
#ARA_ancient_claims_desc:0 "Наши соседи, даже те кто сейчас являются союзниками, владеют землями, которые когда-то были нашими. Хотя те времена канули в лету, мы не можем забыть, что они принадлежали нам. Мы должны вернуть их!"
#ARA_we_shall_rule:0 "Мы будем править!"
#ARA_we_shall_rule_desc:0 "Как и Арантигос прошлого, новый Арантигос кровавым маршем пройдёт через Грифонию и восстановит древнее королевство. Это наше право по рождению, это наша мечта, которая скоро воплотиться в жизнь."
#ARA_proper_base_arantigos:0 "Научный прогресс"
#ARA_proper_base_arantigos_desc:0 "Наша нация не может вернуть себе великую славу и благородное право первородства, если останется на задворках прогресса. Наша нация должна быть в авангарде прогресса."

#### NEW FOCUS ####
ARA_dorotheos_coup:0 "Переворот Доротеоса"
ARA_dorotheos_coup_desc:0 "Слишком долго Арантига была лишь печальным напоминанием о своём былом величии. Слишком долго Фезерины были всего лишь мелкими баронами. Теперь, когда слабая баронесса мертва, Доротеос Фезерин приведёт нашу страну к новому светлому будущему... или погибнет, пытаясь это сделать."
ARA_reorganise_high_command:0 "Перестановки в генштабе"
ARA_reorganise_high_command_desc:0 "У офицеров, поддержавших переворот Доротеоса, есть интересные идеи о реформировании наших вооружённых сил. Увольнение старой гвардии и замена её свежими кадрами, а также теми, кто поддержал переворот, может помочь нам перейти в новую эпоху современной войны."
ARA_army_with_a_state:0 "Армия с государством"
ARA_army_with_a_state_desc:0 "Каждый грифон — солдат! Под властью Доротеоса, Арантига становится всё более милитаризированной, всё больше ресурсов направляется на нужды армии. Но если мы действительно хотим соперничать с гигантами Грифонии, нам необходимо мобилизовать всё наше общество."
ARA_purge_loyalists:0 "Чистка от диссидентов"
ARA_purge_loyalists_desc:0 "Хотя страной правит Доротеос, ряд сторонников Маргарет и демократов всё ещё строят заговоры против его правления. Если мы хотим осуществить мечту о восстановлении былой славы Арантиги, нам необходимо устранить эти препятствия."
ARA_reorganise_government:0 "Перестановки в правительстве"
ARA_reorganise_government_desc:0 "Заменив тех, чья лояльность вызывает сомнения, сторонниками Доротеоса и сосредоточив всю власть в его когтях, мы можем гарантировать, что Арантига будет во власти только одного грифона и следовать только одному видению."
ARA_nationalization:0 "Национализация"
ARA_nationalization_desc:0 "Годами вингбардийцы эксплуатировали нас и обращались с нами как с марионетками. После переворота большинство из них бежало из Арантиги, бросив свои предприятия и фабрики... Теперь они будут служить государству."
ARA_state_of_war:0 "Состояние вечной войны"
ARA_state_of_war_desc:0 "Нас не так уж много... А это значит, что каждый грифон должен отдать всё, что в его силах, чтобы арантийцы вернули себе свои законные земли. Каждый день — новая война, каждая смена на фабрике — новая битва!"
ARA_arantiga_rises:0 "Арантига восстаёт!"
ARA_arantiga_rises_desc:0 "Пришло время восстать и вернуть всё, что по праву принадлежит нам. Много лет назад арантийцы создали величайшую империю в Грифонии – и мы можем сделать это снова. Наше общество едино, наша страна готова к тотальной войне, наша армия рвётся исполнять приказы нашего барона. Нас ждёт будущее, полное крови и славы!"

ARA_right_to_rule:0 "Право править"
ARA_right_to_rule_desc:0 "Центральная Грифония — регион, разделённый между многими народами. Большинство из них страдают от нищеты, хаоса и войн. Наш долг — принести им мир, стабильность и сильное правление арантийцев."
ARA_craddle:0 "Колыбель Грифоньего рода"
ARA_craddle_desc:0 "На востоке лежат Грифонстоун и Румейр – земли, известные как колыбель грифоньего рода. Древняя слава этих государств померкла... В этом смысле они подобны Арантиге при Маргарет. Прекратить их существование будет актом милосердия."
ARA_rebuild_stone:0 "Восстановление Грифонстоуна"
ARA_rebuild_stone_desc:0 "Грифонстоун — жалкое место: некогда столица великой державы, ныне он лежит в руинах. И подобно тому, как мы восстановим величие нашей старой империи, мы поступим и с городом первого Гровера."
ARA_fight_north:0 "Северная склока"
ARA_fight_north_desc:0 "Эри и Эйри воюют уже давно – больше чем кто-либо помнит. Кажется, только их взаимная ненависть в эти смутные времена остаётся неизменной... Это делает их идеальными мишенями: ослабленные и неспособные к сотрудничеству, они будут разгромлены один за другим."
ARA_integrate_north:0 "Интеграция Севера"
ARA_integrate_north_desc:0 "Пора избавиться от герцогов, их семей и приспешников. Когда они исчезнут, на землях вокруг озера Румейр наконец воцарится мир."
ARA_fight_avian:0 "Сокрушить Авиан"
ARA_fight_avian_desc:0 "Земли Авиана, хоть и невелики и небогаты, важны для нашей будущей экспансии. Мы завоюем их прежде, чем Империя сделает это первой, и займём выгодную оборонительную позицию против наших северных и западных соседей."
ARA_integrate_avian:0 "Интегрировать Авиан"
ARA_integrate_avian_desc:0 "Теперь, когда мы контролируем Авиан, нам следует создать надлежащую администрацию, чтобы гарантировать, что местные жители будут плавно интегрированы в наше королевство и будут вносить свой вклад в наши военные усилия."
ARA_ac_revelations:0 "Откровение"
ARA_ac_revelations_desc:0 "Истинная судьба Доротеоса наконец будет раскрыта..."
ARA_new_arantigos:0 "Арантигос возрожденный!"
ARA_new_arantigos_desc:0 "Арантигос Великий правил сильнейшей империей древности. Он совершил невозможное и объединился с Бореем. Его наследие никогда не умирало... Как и он сам. Сегодня он возрождается... Сегодня возрождаемся мы! Мы — Арантигос!" 

ARA_sparleos_legacy:0 "Спарлейское наследие"
ARA_sparleos_legacy_desc:0 "Для создания сильной нации требуется нечто большее, чем боеспособная армия и производительная промышленность – сильной нации нужны прочные, проверенные временем традиции. У нас есть гордое наследие, которое, к сожалению, было в значительной степени забыто. Пришло время напомнить грифонам Арантиги об их славном прошлом и смело шагнуть в будущее."
ARA_sparleos_culture:0 "Возрождение спарлейской культуры"
ARA_sparleos_culture_desc:0 "Спарлейский язык почти вымер, как и многие наши традиции. Мы восстановим их, даже если некоторые грифоны не будут рады необходимости изучать другой язык."
ARA_mandatory_education:0 "Обязательное образование"
ARA_mandatory_education_desc:0 "Чтобы воспитать из молодых птенцов достойных граждан, лучше всего начинать как можно раньше. И очень сложно управлять нацией идиотов, не умеющих читать и писать! Мы должны позаботиться о том, чтобы каждый грифон получил надлежащее образование и научился служить Арантиге и её славному правителю."
ARA_arantigos_boreas:0 "Поддержать культ Арантигоса-Борея"
ARA_arantigos_boreas_desc:0 "В Арантиге распространено поверие, что наш великий правитель – Арантигос – после смерти слился с Бореем. Многие представители духовенства поддерживают это утверждение. Мы должны продвигать эту веру и поощрять тех, кто стремится её распространять – родство с Богом укрепит легитимность нашей династии и даст нам право претендовать на все земли грифонов."
ARA_sparleto_university:0 "Основать Университет Спарлето"
ARA_sparleto_university_desc:0 "На протяжении поколений лучшие сыновья и дочери Арантиги отправлялись во Францистрию и Вингбардию, чтобы получить достойное образование. Это привело к массовой утечке мозгов и упадку нашей культуры. Без образованных граждан мы не сможем достичь той славы, которой заслуживает Арантига. Поэтому в нашей столице будет основан достойный университет."
ARA_cult_of_personality:0 "Культ личности"
ARA_cult_of_personality_desc:0 "Портреты Доро... Арантигоса теперь находятся в каждом храме, и культ Арантигоса-Борея стал культом нашего правителя. Если он возрождённый Арантигос, то он, в каком-то смысле, бог, не так ли? Конечно, глупые иностранцы считают нас еретиками. Но со временем они все преклонятся перед истинным правителем грифоньего рода..."
ARA_shadow_claws:0 "Когти во тьме"
ARA_shadow_claws_desc:0 "Те, кто хорошо изучали историю Арантигоса Великого и его завоеваний, знают, что он побеждал не только благодаря силе легионов, но и с помощью тщательной разведки. Нам стоит поучиться у него и расширить штат наших спецслужб. Некоторые заявляют, что это бесчестный способ ведения войны, но когда мы победим, его назовут умным и дальновидным."

ARA_self_strength:0 "Самоукрепление"
ARA_self_strength_desc:0 "До Доротеоса наша страна считалась всего лишь продолжением Вингбардии, и к ней относились соответственно. Чтобы возродить наше наследие, нам необходимо твердо стоять на ногах, и для этого мы должны сделать Арантигу самодостаточной и способной вести войну без посторонней помощи."
ARA_industrial_warmachine:0 "Промышленная военная машина"
ARA_industrial_warmachine_desc:0 "Даже самый храбрый солдат не может сражаться без оружия. Потому мы должны обеспечить армию всем нужным снаряжением – не только оружием, но и артиллерией, танками и грузовиками. Только тогда мы сможем заявить о своих правах на завоевание!"
ARA_military_research_institute:0 "Спонсировать новые НИИ"
ARA_military_research_institute_desc:0 "Университеты и другие учреждения в значительной степени игнорировались предыдущими правительствами, и студенты предпочитали учиться за рубежом. Учёные бесполезны для Арантиги, если они находятся в Йеле или Эквестрии, поэтому нам придётся финансировать образование и научные исследования дома, чтобы не отстать в великой гонке."
ARA_heavy_industry:0 "Основать тяжёлую промышленность"
ARA_heavy_industry_desc:0 "В Арантиге преобладает сельская местность без крупных промышленных центров. К сожалению, из пшеницы не сделать оружие, поэтому нам придётся перепрофилировать наши сельскохозяйственные угодья во что-то более полезное. Давайте приступим к работе."
ARA_dig_deeper:0 "Копать глубоко, копать жадно!"
ARA_dig_deeper_desc:0 "Арантига и так богата природными ресурсами, но недавние геологические исследования показывают, что под землёй может скрываться ещё больше. Эти ресурсы критически важны для нашей военной машины, так что давайте копать!"
ARA_kickstart_my_heart:0 "Толчок к модернизации"
ARA_kickstart_my_heart_desc:0 "Хотя Арантига — отнюдь не жалкое захолустье, наша страна сильно отстала от жизни. Нам нужно модернизировать её, прежде чем мы сможем надеяться на столкновение с Империей или Вингбардией. Эта модернизация затрагивает не только промышленность: каждый аспект жизни в Арантиге должен соответствовать современным стандартам."
ARA_exploit_conquered:0 "Скрытое богатство"
ARA_exploit_conquered_desc:0 "Каждый дурак может завоевать землю, но без должного управления она станет лишь обузой для государства. К счастью, в Центральной Грифонии полно ресурсов и возможностей для наших бизнесгрифонов. Некоторые из них уже обращались к нам, обещая большие выгоды... Конечно, нам придётся отобрать землю у прежних знатных владельцев и, возможно, выселить часть крестьян..."
ARA_riches_of_griffonstone:0 "Богатства Грифонстоуна"
ARA_riches_of_griffonstone_desc:0 "Многочисленные горы Грифонстоуна до краев полны ценных ресурсов, которые мы можем использовать в военных целях. Иронично, что Грифонстоун, сидя на залежах ценностей, был слишком беден, чтобы их разработать. Возможно, они всё-таки не были достойны править. В отличие от нас."
ARA_northern_industry:0 "Возрождение Верении"
ARA_northern_industry_desc:0 "Опустошённая гражданской войной, Верения знавала лучшие времена. Теперь, когда эта территория находится под нашей властью, мы можем вернуть ей былое процветание. Конечно же, ради нашей военной выгоды."
ARA_hire_foreigners:0 "Нанять иностранных учёных"
ARA_hire_foreigners_desc:0 "Мы не можем полагаться только на наших отечественных учёных. Их просто слишком мало, и пройдут годы, а может быть, и десятилетия, прежде чем мы сможем стать по-настоящему современной страной. Однако, используя самую мощную вещь в мире – деньги, – мы можем "убедить" иностранных учёных приехать в Арантигу и помочь в развитии наших технологий – тех, кому всё равно, кто платит, в Грифонии полно."
ARA_industrial_front:0 "Год национальных усилий!"
ARA_industrial_front_desc:0 "Наши враги многочисленны и могущественны. Мы не сможем вернуть то, что по праву принадлежит нам, без жертвы каждого грифона Арантиги. Поэтому Арантигос провозгласил Год национальных усилий. Наше производство уже выросло в десять раз. Нам нужно воспользоваться этой возможностью, пока у наших рабочих не иссяк пыл."
ARA_work_camps:0 "Основать трудовые лагеря"
ARA_work_camps_desc:0 "В наших тюрьмах гниёт огромное количество преступников, предателей, военнопленных и прочих врагов государства. Пусть они искупят свою вину трудом и военной службой – некоторым даже дадут шанс на сокращение срока. А если умрут... Что ж, потеря будет невелика."
ARA_modern_solutions:0 "Улучшить инфраструктуру"
ARA_modern_solutions_desc:0 "Старые проблемы требуют современных решений. Если мы хотим быстро перебрасывать припасы и войска на огромные расстояния и по пересечённой местности, нам придётся использовать поезда и дороги. Современные поезда и дороги. Наши граждане, несомненно, оценят возросшую мобильность."
ARA_homefront_victory:0 "Победа на домашнем фронте"
ARA_homefront_victory_desc:0 "Внедряя новые методы, упрощая производственные процессы и распространяя рабоче-солдатский дух, мы добились поразительного успеха. Фабрики Арантиги постоянно производят излишки товаров, удовлетворяя потребности как нашей армии, так и общества. Теперь мы можем сосредоточиться на других, более насущных вопросах."
ARA_military_complex:0 "Свои военные концерны"
ARA_military_complex_desc:0 "Хотя вингбардийские капиталисты несправедливо эксплуатировали арантийцев на нашей собственной земле, их изгнание негативно сказалось на нашей экономике. У них мало причин возвращаться. Однако всегда найдутся грифоны, достаточно жадные, чтобы работать с кем угодно, когда дело касается денег. Мы можем использовать их..."
ARA_reforge_economy:0 "Перестроить экономику"
ARA_reforge_economy_desc:0 "Потребовалось время, но мы наконец избавились от всех остатков влияния Вингбардии, которое когда-то разрушало нашу экономику и делало нас марионеткой Карфина. Теперь арантийцы работают только на себя, следуя за своим великим лидером!"
ARA_war_against_dumb:0 "Война против безграмотности"
ARA_war_against_dumb_desc:0 ""Почему в моей стране так много глупых птиц?" Наверное, каждый правитель Грифонии хотя бы раз задавался этим вопросом. Хотя мы не можем просто перестрелять этих идиотов – вернее, можем, но это было бы крайне контрпродуктивно – мы можем попытаться научить их читать и писать. Хотя нам следует позаботиться, чтобы потом им в когти не попалась коммунистическая мерзость..."
ARA_modern_arantiga:0 "Современная Арантига"
ARA_modern_arantiga_desc:0 "Благодаря огромным усилиям наших граждан, экономика восстановлена, и мы стали современной индустриальной страной. Конечно, многое ещё предстоит сделать, но сегодня мы можем праздновать!"

ARA_legacy_of_grover:0 "Наследие Гровера"
ARA_legacy_of_grover_desc:0 "Много веков назад Гровер Грифонстоунский создал крупнейшую империю в Грифонии с помощью Идола Борея. Поскольку Доротеос, несомненно, тоже благословлён Бореем, добыча этого артефакта укрепила бы его легитимность как избранника богов и правителя грифоньего рода... Однако Идол был утерян давным-давно, и его возвращение может оказаться трудным."
ARA_es_oblivion:0 "Спуск в Бездну"
ARA_es_oblivion_desc:0 "Приключение начинается... "
ARA_bungie_destiny:0 "Моё предназначение" #Не используется -Ele
ARA_bungie_destiny_desc:0 "На протяжении поколений Арантига медленно приходила в упадок, забытие и в тень новых могущественных держав Грифонии. Однако теперь, когда нам служит множество народов, никто не может отрицать величие Арантиги. Однако наше правление не очень прочно, и дальнейшие завоевания приведут наше новоиспечённое королевство к краху. Пришло время сосредоточиться на внутренних делах и защите того, что мы уже приобрели."

exploited_economy_ara:0 "Эксплуатируемая экономика"
exploited_economy_ara_desc:0 "Это государство во всём служит своему покровителю. Настолько, что это выходит за рамки эксплуатации в сторону регулярного грабежа."

### Chaos Foci ###
ARA_chaos:0 "Абсолютный хаос"
ARA_chaos_desc:0 "После гибели "Арантигоса" во время его безрассудной попытки вернуть идол Борея, генерал Никатор объявил себя регентом. Наступил хаос."
ARA_power_struggle:0 "Борьба за власть"
ARA_power_struggle_desc:0 "Как и после смерти Арантигоса Великого, королевство Арантига пришло в упадок, раздираемое внутренними распрями. Теперь у Доротеоса действительно есть что-то общее с древним завоевателем. Если мы хотим спасти страну, нам нужно действовать быстро и победить тех, кто пытается использовать беспорядок в своих интересах."
ARA_purge_zealots:0 "Уничтожить фанатиков" 
ARA_purge_zealots_desc:0 "У Доротеоса всё ещё много убеждённых последователей, готовых умереть за его "мечту". Если мы хотим вернуть старую Арантигу, нам нужно избавиться от этих безумцев."
ARA_support_army:0 "Заручиться поддержкой армии"
ARA_support_army_desc:0 "Именно армия позволила Доротеосу занять трон. И Никатору удалось стать регентом Арантиги только благодаря верности его солдат. Однако многие офицеры остались в стороне, а некоторые дезертировали. Нам нужно склонить их на нашу сторону, если мы хотим сохранить наш режим. К счастью, мы контролируем казну королевства..."
ARA_secure_cities:0 "Защитить города"
ARA_secure_cities_desc:0 "Хотя мы взяли столицу и отбили безрассудное нападение Лисимаха, другие части страны погружены в анархию. Мы должны выступить и вернуть земли Арантиги, если хотим, чтобы она стала чем-то большим, чем адская бездна, кишащая бандитами и разбойниками."
ARA_the_legacy:0 "Наследие Арантигоса"
ARA_the_legacy_desc:0 "Хотя правление Доротеоса было недолгим, ему удалось полностью изменить Арантигу. Теперь, когда правительство Никатора относительно стабилизировалось, нам следует отменить многие решения покойного монарха, чтобы обеспечить Арантиге полноценное восстановление."
ARA_free_prisioners:0 "Конец трудовым лагерям"
ARA_free_prisioners_desc:0 "Все, кто не соглашался с решениями Доротеоса, или те, кому просто не повезло, оказались в тюрьмах и трудовых лагерях. Первым шагом к установлению справедливого правительства должно стать освобождение этих несчастных грифонов."
ARA_restore_the_cult:0 "Восстановление культа Борея"
ARA_restore_the_cult_desc:0 "Культ Арантигоса-Борея был извращённой мерзостью, которую Доротеос использовал в качестве политического инструмента. Пора вернуться к старой версии веры и очистить её от его порочного влияния."
ARA_demobilize:0 "Демобилизация экономики"
ARA_demobilize_desc:0 "При Доротеосе обычные грифоны либо служили в армии, либо добывали для неё продовольствие. Наш народ не должен состоять из варваров-грабителей и их рабов! Мы должны освободить гордых грифонов Арантиги от оков их армии."
ARA_transition:0 "Переходное правительство"
ARA_transition_desc:0 "Доротеос сосредоточил всю власть в своих когтях. После его смерти страна едва не рухнула. Нам нужно восстановить правительство, и сделать это быстро! Враги Арантиги, конечно же, не будут ждать, пока мы окончательно оправимся."
ARA_return_exiles:0 "Возвращение изгнанников"
ARA_return_exiles_desc:0 "Придя к власти, Доротеос отправил в ссылку многих демократов, сторонников баронессы и вингбардийцев. Нам нужно вернуть этих грифонов домой."
ARA_new_direction:0 "Новый курс"
ARA_new_direction_desc:0 "Хотя могут пройти годы, прежде чем мы полностью оправимся от безумия Доротеоса, страна наконец-то стабилизировалась, и настало время двигаться вперед – к новому, светлому будущему."
ARA_return_of_the_king:0 "Короновать Никатора"
ARA_return_of_the_king_desc:0 "С незапамятных времён арантийцами правили монархи. Подрыв этой традиции, безусловно, не приведёт ни к чему хорошему и создаст ненужный хаос. Поэтому регент станет новым королём возрождённого королевства Спарлеос – да здравствует Никатор I Белоклюв!"
ARA_i_love_democracy:0 "Основать Республику"
ARA_i_love_democracy_desc:0 "Правление Доротеоса ясно продемонстрировало опасности и проблемы абсолютной монархии. Королевская власть будет упразднена. Пройдут выборы, и регент уйдёт в отставку после избрания нового президента."
ARA_tradition:0 "Придерживаться традиций"
ARA_tradition_desc:0 "У Арантиги долгая и славная история. Мы не можем её забыть. Доротеос перенял худшее из наших традиций, а мы будем развивать лучшее, чтобы сделать Арантигу такой, какой она должна быть."
ARA_local_democracy:0 "Демократия на местах"
ARA_local_democracy_desc:0 "В результате недавних завоеваний многие народы лишились своего представительства. Вместо того, чтобы провозглашать верховенство арантийцев, мы позволим им самоуправляться и устанавливать дружеские отношения с прочими этническими группами нашего государства."
ARA_golden_age:0 "Новый золотой век"
ARA_golden_age_desc:0 "Арантига, словно феникс из пепла, возродилась. Будем надеяться, что мы больше никогда не падём. Теперь мы можем наслаждаться эпохой прогресса и процветания."
ARA_rumarean_oil_fields:0 "Нефтяные поля Румейра"
ARA_rumarean_oil_fields_desc:0 "В рамках нашей политики мирного развития мы можем инвестировать средства в разработку нефтяных месторождений озера Румейр. Конечно, это потребует больших затрат, но мы обеспечим доступ к нефти, столь необходимой нашей промышленности."
ARA_swords_into_ploughs:0 "Мечи на орала"
ARA_swords_into_ploughs_desc:0 "Долгое время экономика Арантиги служила лишь подпиткой для дальнейших завоеваний. Продолжая демобилизацию, мы перенаправим наши военно-строительные силы на поддержку гражданской промышленности и сельского хозяйства."
ARA_tourist_spot:0 "Курорт всея Грифонии"
ARA_tourist_spot_desc:0 "Прекрасные берега озера Румейр, знаменитые вина (гораздо лучше францистриской мочи!), исторические памятники и религиозные святилища Соларспайка и Грифонстоуна... У нас есть всё, что нужно туристу! Приезжайте в Арантигу!"
ARA_multiculturalism:0 "Принять мультикультурализм"
ARA_multiculturalism_desc:0 "Земли Арантиги населяют грифоны многих народов, говорящие на разных языках, – румейрском, герцландском, вингбардийском, аквелийском... Мы должны поощрять использование местных языков в образовании и поддерживать культурные исследования."
ARA_The_Crossroads:0 "Перекрёсток Грифонии"
ARA_The_Crossroads_desc:0 "Арантига контролирует стратегически важную центральную часть Грифонии. Развивая торговлю и строя дороги через нашу страну, мы можем стать ключевым участником международной торговли на континенте."
ARA_student_exchange:0 "Студенты по обмену"
ARA_student_exchange_desc:0 "Мы находимся на перекрёстке Грифонии, и пока ресурсы и грифоны текут через Арантигу, мы должны сделать так, чтобы поток знаний и идей тоже тёк через нас. Поддерживая программы студенческого обмена, мы можем быть на острие научного прогресса Грифонии."
ARA_never_again:0 "Никогда снова!"
ARA_never_again_desc:0 "Свободу необходимо защищать любой ценой – неважно, прибудет ли новый Доротеос из Арантиги или из другой страны. Грифоны Арантиги готовы умереть, защищая свою вновь обретённую свободу."
ARA_arantiga_forever:0 "Арантига навсегда"
ARA_arantiga_forever_desc:0 "Революционеры, императоры и безумцы... В Грифонии их много, но мы никому не покоримся. Мы свободны и останемся свободными. Арантига никогда больше не будет под чужой властью!"
ARA_free_press:0 "Свобода прессы"
ARA_free_press_desc:0 "Свободные СМИ критически важны для выживания нашей молодой демократии. Они будут держать наше правительство под контролем и гарантировать, что голос каждого будет услышан."
ARA_old_allies:0 "Новые старые союзники"
ARA_old_allies_desc:0 "Мир меняется. Возникают новые империи, и было бы глупо полагать, что они оставят нас в покое. Наше стратегическое положение и хорошие дипломатические отношения, налаженные благодаря программе студенческого обмена, позволяют нам установить крепкое сотрудничество с одной из величайших держав Грифонии."
ARA_aquileian_brothers:0 "Аквелийские братья"
ARA_aquileian_brothers_desc:0 "Грифоны Аквелии свергли своего тиранического короля и основали республику. Хотя прежде у нас никогда не было близких отношений с аквелийцами, теперь нас объединяют общие ценности..."
ARA_the_emperor:0 "Император в Грифенхейме"
ARA_the_emperor_desc:0 "В результате неожиданного поворота событий Империя Грифонов чудесным образом восстановилась. Теперь она пытается отвоевать Грифонию. Противостояние северному гиганту было бы равносильно самоубийству. Король Никатор предложит присягнуть на верность императору Гроверу VI в надежде сохранить хотя бы частичную независимость Арантиги. Такова суровая реальность..."
ARA_karthian_pact:0 "Возвращение в Карфинский Пакт"
ARA_karthian_pact_desc:0 "Вингбардию считали виновной в нашем упадке, и Доротеос сделал противодействие ей ключевым элементом своей политики. После смерти Доротеоса общественное восприятие Вингбардии как врага ослабло, и теперь мы могли пересмотреть наши отношения с вингбардийцами и присоединиться к ним не как марионетки, а как равные."
ARA_pan-griffonian:0 "Единое дело пангрифонства"
ARA_pan-griffonian_desc:0 "После успешной контрреволюции республиканцы бежали на север. За последние тридцать лет они не добились больших успехов, но всё ещё не отказались от мечты о республиканской Грифонии. Северное правительство в тени Империи. Наш удар по Герцланду с юга очень помог бы им и, вероятно, обеспечил бы нам автономию после войны."
#1.1#
ARA_march_on_griffenheim:0 "Марш на Грифенхейм"
ARA_march_on_griffenheim_desc:0 "Мы не можем просто сидеть и смотреть, как Грифония всё глубже погружается в раздоры и хаос. Наш долг — бороться за свободу, демократию и процветание. Мы возьмём Грифенхейм и сделаем Центральную Грифонию оплотом республиканства на континенте."
ARA_central_republic:0 "Грифонья Демократическая Республика"
ARA_central_republic_desc:0 "После нашей победы над разваливающимися остатками имперского режима пришло время создать на его месте нечто новое. Генерал-президент Сотер объявит о создании нового государства, которое, несомненно, в скором времени подчинит себе Грифонию, принесёт свободу всем её обитателям и сделает Сотера самым могущественным правителем на континенте."
ARA_liberate_herzland:0 "Освободить Герцланд"
ARA_liberate_herzland_desc:0 "Если мы хотим узаконить наш контроль над Герцландом, нам необходимо объединить все его земли и победить другие конкурирующие страны."
ARA_cyrusval_uni:0 "Университет Сайрусвала"
ARA_cyrusval_uni_desc:0 "Университет Сайрусвала, один из знаменитых йельских университетов, широко известен как центр социалистической мысли на континенте. Нам следует рассмотреть возможность поддержки этого учебного заведения, чтобы распространять наши идеи и способствовать стремлению населения к высшему образованию."
ARA_child_emperor:0 "Ребёнок-Император"
ARA_child_emperor_desc:0 "Династия Гроверов правила Империей более двухсот лет. Однако последний из них, Гровер VI, всего лишь ребёнок, марионетка в руках своих регентов. Тем не менее, он по-прежнему остаётся важной фигурой для всех сторонников старой Империи, которые могут объединиться вокруг него и подорвать нашу власть в Герцланде."
ARA_invest_in_herzland:0 "Инвестиции в Герцланд"
ARA_invest_in_herzland_desc:0 "Благодаря обилию природных ресурсов и большой численности населения, Герцланд обладает невероятным потенциалом для промышленного развития. Однако из-за войн, экономического спада и политических конфликтов этот потенциал остался практически неиспользованным. Пора наконец это изменить!"
ARA_move_to_griffenheim:0 "Переехать в Грифенхейм"
ARA_move_to_griffenheim_desc:0 "В нынешней ситуации было бы разумно перенести столицу на север, в Грифенхейм. Бывший Имперский город хорошо подготовлен к размещению правительства нашей новой республики."
ARA_liberte:0 "Герой Республики"
ARA_liberte_desc:0 "Мы не добились бы ни одной из наших славных побед без руководства нашего мудрого лидера, генерал-президента Литори. Все грифоны должны знать это, и, активно используя средства массовой информации, мы обеспечим им это. Портрет в каждом доме, парад каждый год!"
ARA_expand_mines:0 "Расширить шахты Клубники"
ARA_expand_mines_desc:0 "Земли Клубничного Герцогства полны разнообразных ресурсов. Мы можем ещё больше улучшить нашу экономику, эксплуатируя и углубляя их!"
ARA_integrate_infrastructure_rep:0 "Интеграция инфраструктуры"
ARA_integrate_infrastructure_rep_desc:0 "Хотя Герцланд и пользуется преимуществами железнодорожной программы покойного императора Гровера V, здесь ещё многое предстоит улучшить. Годы развития автономных политических образований Герцланда привели к возникновению множества различных транспортных систем, которые нам необходимо объединить."
ARA_land_reform:0 "Земельная реформа"
ARA_land_reform_desc:0 "Обширные территории Герцланда принадлежат дворянству. Конфисковав их земли и передав их крестьянам, мы сможем одновременно лишить дворян последних остатков власти и повысить уровень жизни в сельской местности. Мы также будем поддерживать различные кооперативы, чтобы постепенно сделать наше сельское хозяйство более коллективным."
ARA_liberalise_economy:0 "Смешанная экономика"
ARA_liberalise_economy_desc:0 "Нам необходим более строгий государственный контроль над экономикой — как для того, чтобы утешить наших наиболее идеологически ярых союзников, так и для того, чтобы ни один олигарх не смог соперничать с президентом во власти. Строгие законы и масштабная национализация дадут нам необходимый контроль над экономикой."
ARA_serene_state:0 "Доброжелательный предводитель"
ARA_serene_state_desc:0 "Республиканство... Какая прекрасная идея... Но грифоны не готовы к настоящей свободе – все их бессмысленные споры и дискуссии лишь ослабляют государство. Пока им нужен направляющий коготь – кто-то, кто укажет им верное направление."
ARA_conquer_outskirts:0 "Покорение окраин"
ARA_conquer_outskirts_desc:0 "Ради безопасности нашей Республики, наш долг — захватить порт Скайфол и укрепить свое присутствие на восточной границе нашего государства — только так мы сможем обеспечить безопасность наших судов, ходящих по западным морям, защитить себя от иностранных вторжений и взять под контроль жизненно важные торговые пути Грифонии."
ARA_new_regimes:0 "Новые дружественные режимы"
ARA_new_regimes_desc:0 "Зависть – отвратительная черта. Под разными предлогами, прикрываясь своим божественным происхождением или идеологической праведностью, наши соперники постоянно угрожают напасть на нас. Если они это сделают, мы их разгромим, а затем заменим грифонами, которых... легче контролировать."
ARA_traitor:0 "Предатель"
ARA_traitor_desc:0 "Генерал Никатор сумел победить большинство ярых сторонников покойного "Арантигоса". Новому регенту предстоит спасти Арантигу от безумия, охватившего её в последние годы."
ARA_inheritor:0 "Фанатик"
ARA_inheritor_desc:0 "Генерал Лисимах, самый преданный офицер Второго Арантигоса, победил проклятых предателей и теперь позаботится о том, чтобы Арантига осталась верна своему наследию."
ARA_ensure_loyalty:0 "Обеспечить лояльность"
ARA_ensure_loyalty_desc:0 "Несмотря на все усилия великого Арантигоса, в нашем правительстве до сих пор много нелояльных чиновников и дворян из побеждённых стран, занимающих руководящие должности. Мы избавимся от них – навсегда."
ARA_purge_military:0 "Очистить ряды военных"
ARA_purge_military_desc:0 "Попытка переворота, предпринятая Никатором, показывает, что не все разделяют нашу общую мечту о восстановлении величия Арантиги. Нам придётся тщательно проверить офицеров на преданность и устранить тех, кто может выступить против нас в будущем."
ARA_pacify_countryside:0 "Успокоить крестьян"
ARA_pacify_countryside_desc:0 "Хотя мятежники потерпели поражение, в наших отдалённых провинциях всё ещё неспокойно. Мы пошлём армию, чтобы подавить тех, кто хочет расшатать Арантигу!"
ARA_eternal_regency:0 "Вечное регентство"
ARA_eternal_regency_desc:0 "Арантигос II, возможно, и мёртв, но его видение живо! Ни один грифон – ни в прошлом, ни в будущем – не сравнится по достоинствам с нашим падшим вождём. Даже Лисимах не займёт трон — вместо этого он воздаст почести своему монарху, став регентом Арантиги и приведя её к величию, о котором мечтал Арантигос."
ARA_die_for_emperor:0 "Смерть за Императора"
ARA_die_for_emperor_desc:0 "Каждый солдат знает, что именно душа Арантигоса II командует арантийскими легионами через Лисимаха, своего земного регента. Его слова — закон; его замысел должен быть воплощен в жизнь — любой ценой!"
ARA_army_is_the_state:0 "Армия – это государство"
ARA_army_is_the_state_desc:0 "Чтобы достичь наших целей и победить врагов Арантиги, нам необходимо сосредоточить все ресурсы и все усилия на расширение воружённых сил."
ARA_citizens_are_soldiers:0 "Граждане – это солдаты"
ARA_citizens_are_soldiers_desc:0 "Нас мало, поэтому нам нужно мобилизовать всех, кого только можно, для победы. Если ты умеешь держать винтовку, ты можешь сражаться за Арантигоса!"
ARA_time_of_revenge:0 "Время мести"
ARA_time_of_revenge_desc:0 "Вингбардийцы и фалькорцы — главные виновники уничтожения наследия великого Арантигоса! Пришло время наказать их и уничтожить их жалкие государства и народы!"
ARA_pure_minds_lysi:0 "Чистые умы"
ARA_pure_minds_lysi_desc:0 "Идея подобна семени: будучи посаженной в сознание, она начинает расти и расширяться... Мы должны искоренять все сорняки, которые могут привести к непослушанию в сознании наших подданных."
ARA_enforce_language:0 "Один язык"
ARA_enforce_language_desc:0 "Просто возродить старый спарлейский язык недостаточно. Чтобы сформировать новую идентичность подданных нашей империи, мы должны обеспечить его исключительное использование, начиная со школ и офисов по всей стране."
ARA_cult_of_eternal_emperor:0 "Культ Вечного Императора"
ARA_cult_of_eternal_emperor_desc:0 "Арантигос II не умер! Вместо этого он вознёсся к божественности, объединившись со своим великим предком и Бореем. Мы будем проповедовать эту веру и добьёмся того, чтобы все грифоны в нашей империи поклонялись Вечному Императору."
ARA_prison_economy:0 "Тюремная экономика"
ARA_prison_economy_desc:0 "Многие противостоят нам. Кого-то можно перевоспитать, а кого-то — только истребить... Однако перед смертью эти мерзкие создания отплатят Арантиге за предательство."
ARA_grand_temple:0 "Великий храм"
ARA_grand_temple_desc:0 "В ознаменование восхождения Вечного Императора к божественному статусу, в Импере, бывшем Карфине, столице Вингбардии, будет возведён Великий Храм Арантигоса. Наряду с этим, будет реализовано множество других инженерных проектов, призванных очистить город от вингбардийской культуры."
ARA_SRD:0 "Отдел специальных исследований"
ARA_SRD_desc:0 "Чтобы обеспечить технологическое превосходство над нашими многочисленными противниками, наши эксперты проведут масштабные военные исследования, обеспеченные обширным финансированием и подопытными."
ARA_banish_degenerates:0 "Изгнать дегенератов"
ARA_banish_degenerates_desc:0 "Многие выступают против нашего видения Арантиги – предатели, иностранцы, пони... Просто отправить их всех в трудовые лагеря было бы несложно, но быстрее и дешевле будет изгнать их и позволить другим "позаботиться" об этих презренных хулителях нашей славной империи."
ARA_black_spot:0 "Черное пятно Грифонии"
ARA_black_spot_desc:0 "Теперь, очистив нашу страну и народ, нам нужно позаботиться о том, чтобы он больше никогда не был осквернен иноземным ядом. Чтобы продолжить строительство истинного Царства Арантигоса, мы должны прервать все контакты с внешним миром."
ARA_nuclear_deterrence:0 "Ядерное сдерживание"
ARA_nuclear_deterrence_desc:0 "Чтобы гарантировать, что презренные иностранцы не будут угрожать нашему образу жизни, мы разработаем оружие массового поражения... И произведём его столько, сколько сможем!"
ARA_total_surveillance:0 "Тотальный надзор"
ARA_total_surveillance_desc:0 "Теперь, когда мы в безопасности от внешнего мира, пришло время позаботиться о том, чтобы все наши подданные, которые могут подумать о противостоянии нам, были под пристальным наблюдением, и мы были бы готовы с ними разобраться..."
ARA_declare_holy_empire:0 "Да здравствует Священная Империя!"
ARA_declare_holy_empire_desc:0 "Бывшие враги государства кланяются нам. Так начинается новая эпоха – эпоха веры и подчинения. Заложены основы Царства Арантигоса – да будет оно существовать вечно!"
ARA_fortress_arantiga:0 "Крепость Арантига"
ARA_fortress_arantiga_desc:0 "Орды наших врагов без труда одолеют нас, если мы не подготовимся к их неизбежному нападению, построив укрепления, способные остановить любую вторгшуюся армию, какой бы многочисленной она ни была."

