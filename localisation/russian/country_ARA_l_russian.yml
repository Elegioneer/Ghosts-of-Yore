### Decisions ###
ARA_remove_influence:0 "Уменьшить влияние Вингбардии"
ARA_arantigans_abroad:0 "Арантийцы за рубежом"
ARA_arantigans_abroad_desc:0 "Много веков назад Арантигос повёл свою могучую армию на завоевание всей Грифонии. Он умер, не успев осуществить свою мечту, а его империя рухнула вскоре после его смерти. Арантийцы не забыли своего наследия, и как раньше, так и сейчас мы славимся нашими боевыми традициями. Существует множество наёмных отрядов, состоящих из арантийцев, их потомков или групп грифонов, которые не забыли своего происхождения и готовы вернуться на родину предков, чтобы вернуть ей былую славу..."
ARA_last_legion:0 "Нанять Карфинский легион"
ARA_last_legion_desc:0 "Утверждается, что так называемый "Карфинский легион" состоит из потомков служащих павшего Королевства Карфин, завоёванного вингбардийцами много веков назад. В этом утверждении мало правды, но нет сомнений, что легион существует уже много веков и считается одним из самых закалённых в боях наёмнических формирований во всей Грифонии."
ARA_true_legion:0 "Нанять легион Ромау"
ARA_true_legion_desc:0 "Ромау был самым северным городом Арантийской империи, основанным как пограничная крепость самим Арантигосом. До того, как он стал резиденцией архонта Эйр, многие жители поклонялись Арантигосу-Борею. Небольшие группы таких верующих существуют и по сей день – по большей части это солдаты Легиона Ромау, который скитается по Грифонии с тех самых пор, когда Гровер Второй разграбил город."
ARA_francistrian_volunteers:0 "Набрать талузских добровольцев"
ARA_francistrian_volunteers_desc:0 "Хотя большинство талузцев отказались от старых традиций, многие всё ещё верят в арантийские традиции. Некоторые из них, возможно, захотят присоединиться к нашему делу и сражаться за истинного преемника Арантигоса — им просто нужна небольшая поддержка."
ARA_call_diaspora:0 "Созвать диаспору"
ARA_call_diaspora_desc:0 "Многие коренные арантийцы живут за границей, в таких городах, как Карфин, Грифенхейм и Мэйнхеттен. Организовав пропагандистские кампании, мы, возможно, сможем побудить некоторых из них вернуться и помочь нам вернуть наше былое величие..."

ARA_blyat_cat:0 "В крысиное логово"
ARA_blyat_cat_desc:0 "Хотя мы не собирались сейчас вторгаться в Блэкхоллоу из-за их незначительности, их внезапное вторжение в Грифонстоун испортило наши планы на этой территории. Это не оставляет нам другого выбора, кроме как избавиться от бандитов."
ARA_blyat:0 "Наказать бандитов"
ARA_blyat_desc:0 ""

ARA_renaming_cities:0 "Переименование городов"
ARA_renaming_cities_desc:0 "Наша великая империя усеяна огромными городами. Некоторые города выставили нас дураками, а названия других нашим администраторам просто трудно записать или произнести вслух. Необходимо провести компанию по переименованию."
ARA_rename_karthin:0 "Долой Карфин!"
ARA_rename_karthin_desc:0 "Теперь, когда бывшая столица Вингбардии в наших когтях, возможно, пришло время продемонстрировать наше превосходство и переименовать город, чтобы он стал напоминанием для тех, кто когда-либо осмелится выступить против нашего божественного короля..."

ARA_definetely_not_fake_IRI:0 "Имперская Исследовательская Инициатива"
ARA_definetely_not_fake_IRI_desc:0 ""Имперская исследовательская инициатива" — это обширная программа, которая позволяет нам инвестировать средства в перспективные исследовательские проекты, которые многие считают неэтичными или опасными, не привлекая... нежелательного внимания. Хотя многие из так называемых "ученых" — всего лишь мошенники, у некоторых бывших студентов Йеля есть многообещающие идеи, и они просят финансовой поддержки.\n§YПримечание: Эти проекты будут невероятно дорогостоящими...§!\n§RВсегда существует риск, что что-то пойдет не так...§!"
ARA_hammer_of_god:0 "Проект Готтерхаммер"
ARA_hammer_of_god_desc:0 "Магические кристаллы известны как источник невероятной силы. С их помощью маги способны изменять реальность, и они являются важнейшим компонентом большинства магитехнического оборудования. Брайт Глоу, учёный-атомщик из Аквелии, представил чертежи экспериментальной "кристаллической бомбы", которая может стать для нас оружием массового уничтожения."
ARA_miracle_cure:0 "Проект "Панацея""
ARA_miracle_cure_desc:0 "Группа исследователей из Университета Гринбэк обратилась к нам за поддержкой в их исследованиях так называемого "универсального лекарства". Они намерены использовать "магиорги" — магически изменённые микроорганизмы — для лечения даже самых смертельных заболеваний, и на данный момент результаты испытаний весьма обнадеживают."
ARA_super_soldiers:0 "Проект "Легионер""
ARA_super_soldiers_desc:0 "Хотя университет Гамии был практически полностью разрушен во время конфликтов в Герцланде, один из его исследователей, Хайнрих Алленштайн, предлагает нам свои услуги по улучшению физических возможностей наших солдат — если мы предоставим ему достаточно... подопытных. Однако нам следует быть осторожными: его исключили за эксперименты, которые даже его коллеги считали... неэтичными."
ARA_teleportation_device:0 "Проект "Серебряный ключ""
ARA_teleportation_device_desc:0 "Несмотря на множество талантов, грифоны лишены магических способностей единорогов, которые обладают широким спектром заклинаний. К счастью, мы можем частично решить эту проблему. Могущественный маг Виттенланда, Аскариус, лишившись благосклонности двора, прибыл в земли грифонов после многих лет работы над различными магитехническими проектами и теперь предложил нам свои услуги, надеясь, что мы сможем профинансировать разработку телепортационного устройства."
ARA_quinctus:0 "Проект "Возрождение""
ARA_quinctus_desc:0 "Ходит множество слухов о магических ужасах, творимых полубезумными, полугениальными магами, правившими в Барраде. Конечно же, многие учёные грифоны горят желанием раскопать то, что осталось от их жилищ, в надежде раскрыть тайные технологии и магические секреты. Команда исследователей собрала экспедицию в проклятый замок в Барраде, который раньше занимала Пентархия."

ARA_return_land_cat:0 "Грифоны Востока"
ARA_return_land_cat_desc:0 "Восточная часть Грифонии известна как "Речные Земли". Эти земли населены множеством существ, но среди них самыми многочисленными и могущественными являются пони. Теперь речные пони, воспользовавшись хаосом, воцарившимся после падения Империи Грифонов, вторглись в её бывшие восточные земли. Чтобы Арантигос мог претендовать на титул императора всех грифонов, нам нужно вернуть эти земли. Мы предъявим ультиматум о их возвращении!"
ARA_return_land:0 "Предъявим ультиматум!"
ARA_return_land_2:0 "Мы заберём нашу землю силой!"

ARA_northern_threat:0 "Северная угроза"
ARA_northern_threat_desc:0 "Нам стало известно, что Полуостров Ужаса – северо-восточная оконечность Грифонии – попал под контроль зловещей силы – совета могущественных некромантов во главе с самым коварным из них – Розой Маледиктой. Наличие такого соседа беспокоит знатных грифонов при императорском дворе. Многие из них призывают нанести превентивный удар по некромантам."
ARA_kill_DED:0 "Атаковать Лигу Ужаса"
ARA_order2electricboogaloo:0 "Восстановить порядок на Полуострове Ужаса"
GOY_ARA_new_new_order:0 "Воссоздать Арктурианский Орден"
GOY_ARA_new_new_order_desc:0 "Очевидно, что вина за "неэффективное управление" угрозой некромантов целиком и полностью лежит на главе Арктурианского Ордена и его окружении. Поэтому необходима смена руководства."
GOY_ARA_new_new_order_2:0 "Дать Гесперосу воссоздать Арктурианский Орден"
GOY_ARA_new_new_order_desc:0 "Очевидно, что вина за "неэффективное управление" угрозой некромантов целиком и полностью лежит на главе Арктурианского Ордена и его окружении. Поэтому необходима смена руководства, и у нас есть блестящий кандидат!"
GOY_ARA_give_hlr_to_ntr:0 "Передать Полуостров Ужаса Гиперборейскому Протекторату"
GOY_ARA_give_hlr_to_ntr_desc:0 "Некроманты побеждены раз и навсегда, так что больше нет нужды в каких-либо "рыцарских орденах" для сдерживания этой несуществующей угрозы. Полуострову Ужаса будет лучше в копытах наших гиперборейских партнёров."

ARA_puppet_show_cat:0 "Удивительное кукольное шоу Сотера"
ARA_puppet_show_cat_desc:0 "Добро пожаловать, добро пожаловать на грандиозное политическое шоу нашего Генерала-Президента! Пангрифонство — идеал столь же идиотский, как и среднестатистический избиратель, а попытка контролировать поистине пангрифонскую нацию была бы безнадёжной затеей. К счастью, мы придумали идею получше: вместо того, чтобы напрямую управлять вновь приобретёнными землями, мы создадим "братские республики", и позволим нашим местным единомышленникам решать их проблемы. Наше управление этими государствами будет едва заметным, так что у местных жителей не возникнет желания восстать против нас. А теперь давайте расчертим карты!"
ARA_puppet_karth:0 "Карфинская братская республика"
ARA_puppet_aquil:0 "Аквелийская братская республика"
ARA_puppet_north:0 "Северная братская республика"
ARA_puppet_eviconf:0 "Эвийская братская республика"
ARA_puppet_aster:0 "Астерионская братская республика"

ARA_peace_nm_cat:0 "Предложение мира"
ARA_peace_nm_cat_desc:0 "Мы разгромили жалкие армии Эквестрии и Нью Мейрленда. Теперь крупные города колонии под нашим контролем, и мы можем диктовать условия мира. Наши триумфальные легионы пройдут по улицам Сансета, и Эквестрия получит урок: никогда не иди против истинных хозяев этого мира."
ARA_peace_nm:0 "Передайте наши требования"

ARA_greneclyf_cat:0 "Неожиданное приобретение"
ARA_greneclyf_cat_desc:0 "Остров Грен... Гринкл... Гренен... ОСТРОВ ЖУКОВ НА КРАЮ СВЕТА — настолько отдалённая часть Грифонии, что многие даже забывают о его существовании. Однако теперь, когда мы его контролируем, нам нужно найти способ им управлять. Его ценность для нашей империи ничтожна, поэтому мы просто установим там протекторат, назначив губернатором одну из местных королев, и тут же забудем о существовании этого места."
ARA_greneclyf:0 "Создать протекторат"

ARA_arantigan_restorations:0 "Возвращение Карфинии"
ARA_sparleos_decision:0 "Заявить права на мантию"
ARA_sparleos_decision_desc:0 "Когда-то, давным-давно, первое королевство Спарлеос контролировало земли от Ромау до Мидории. Сейчас мы контролируем сердце этого древнего королевства, и теперь мы действительно можем назвать наше государство Вторым королевством Спарлеос и включить в него наших южных братьев-грифонов."
ARA_karthinia_decision:0 "Объединить Карфинию"
ARA_karthinia_decision_desc:0 "Теперь, когда мы контролируем весь юг, нам нужно стать чем-то большим, чем просто "Арантига". Хотя мы уже создали толерантную, многокультурную нацию, пришло время объединить все южные культуры в одну – обратиться к прошлому и возродить традиции старой Карфинской республики."

ARA_canteribbienes_cat:0 "Кантерибская кампания"
ARA_canteribbienes_cat_desc:0 "Расположение Кантерибских островов делает их ценной территорией для тех, кто хочет контролировать основные судоходные пути между Эквусом и Зебрикой, или для тех, кто готов начать вторжение в Грифонию, используя их в качестве пунктов сбора. Захватив эти острова, мы создадим передовой оборонительный периметр Грифонии, а также обеспечим важные военно-морские базы для нашего флота."
ARA_reclaim_merediennes:0 "Вернуть Ле Меридьен"
ARA_reclaim_merediennes_desc:0 "Ле Меридьен — бывшая аквелийская колония, которая после Второй революции оказалась отрезанной от материка. Благодаря большой популяции грифонов, они являются нашей главной целью на Кантерибских островах."
ARA_lay_dragons:0 "Убийство драконов"
ARA_lay_dragons_desc:0 "Драконьи острова веками были ужасающим местом, куда ни один грифон в здравом уме не осмеливался лезть. Однако благодаря недавнему развитию технологий, драконы уже не представляют такой угрозы, как раньше, а расположение островов у берега Эквуса делает их идеальным местом для будущей базы Флота Небесного моря."
#ARA_lay_dragons_desc:1 "Драконьи острова — земля одних из самых горячих с*чек мира сего. Имперский флот рекомендует направить туда наших морских пехотинцев, чтобы попытаться захватить королеву Эмбер и привести её в качестве наложницы к императору Арантигосу "Громочлену" Второму." #(что блять за пиздец)
ARA_operation_solstice:0 "Операция "Солнцестояние""
ARA_operation_solstice_desc:0 "Летние острова, небольшая и незначительная колония Эквестрии в Кантерибских островах, имеют небольшое население и экономическую ценность. Тем не менее, они критически важны для обороны Ле Меридьен. Отряд высококвалифицированных коммандос высадится на Летних островах и захватит их. Ни один здравомыслящий пони не захочет умирать за этот клочок земли, поэтому мы не ожидаем сопротивления."
ARA_puerto_caballo:0 "Взять контроль над Заливом Кабанов"
ARA_puerto_caballo_desc:0 "Пуэрто-Кабальо — самый большой и густонаселённый остров Кантерибов. Бывшая колония эквестрийцев, Пуэрто-Кабальо теперь отрезан от своего материкового сюзерена, и станет лёгкой добычей."
ARA_demand_eqs_islands:0 "Потребовать эквестрийские колонии"
ARA_demand_eqs_islands_desc:0 "Присутствие эквестрийцев на Кантерибах больше недопустимо. Мы предъявим ультиматум: эквестрийцы либо сдадут эти территории, либо навлекут на себя наш гнев."
ARA_yukka_treaty:0 "Победа на море"
ARA_yukka_treaty_desc:0 "Поскольку эквестрийцы терпят поражение за поражением, мы можем выдвинуть свои требования и добиться того, ради чего начали эту войну."

ARA_dev_islands_cat:0 "Программа развития Кантерибов"
ARA_dev_islands_cat_desc:0 "Хотя многие считают Кантерибы всего лишь кучкой незначительных, бедных островов, Император решил направить значительные ресурсы на интеграцию этих территорий и добычу их неиспользованных природных ресурсов. Имперское Адмиралтейство запросило дополнительные средства на развитие островных баз, необходимых для нашего Зебриканского флота."
ARA_core_meridiennes:0 "Интеграция Ле Меридьен"
ARA_core_meridiennes_desc:0 "Ле Меридьен, будучи бывшими аквелийскими колониями, населены множеством грифонов. Местные жители, похоже, относительно дружелюбны, и у нас не должно возникнуть проблем с их интеграцией в нашу славную империю."
ARA_canterib_capital:0 "Новая столица Кантерибов"
ARA_canterib_capital_desc:0 "Порт-Гизельда, или, как он теперь будет известен, Порт-Фезерин, станет центром нашей власти в Кантерибах и, таким образом, превратится в оживленный мегаполис, демонстрирующий величие нашей империи."
ARA_island_rubber:0 "Расширение каучуковых плантаций на островах"
ARA_island_rubber_desc:0 "Климат Кантерибов идеально подходит для выращивания каучуковых деревьев, которые местные жители называют "гевеей". В условиях постоянного дефицита каучука создание плантаций гевеи на архипелаге — разумная идея."
ARA_mine_the_mountain:0 "Раскопать гору"
ARA_mine_the_mountain_desc:0 "Теперь, когда драконы покорены, можно добывать драгоценные ресурсы их священной горы, чтобы подпитывать нашу экономику."
ARA_zebrican_fleet_hq:0 "Создать штаб Зебриканского флота"
ARA_zebrican_fleet_hq_desc:0 "Благодаря многочисленным естественным заливам и близости к полосатому континенту, нет лучшего места для Командования Зебриканского флота, чем Пуэрто-Кабальо."
ARA_summer_harbour:0 "Создать Летнюю гавань"
ARA_summer_harbour_desc:0 "Для защиты Ле-Меридьена, на Летних островах должна быть создана полноценная военно-морская база — так гласит, по всей видимости, в спешке составленный запрос от Командования Зебриканского флота."
ARA_purrsia_colonisation:0 "Колонизация Пуррсии"
ARA_purrsia_colonisation_desc:0 "Остров Пуррсия — ключ к Западной Зебрике. Годы вингбардийского присутствия сделали местных кошачьих восприимчивыми к нашей культуре и вынудили немало грифонов перебраться на остров. Мы будем и дальше способствовать этому процессу и превратим Пуррсию в образцовую колонию арантийцев в Зебрике."
ARA_assist_abissynia:0 "Помощь Абиссинии"
ARA_assist_abissynia_desc:0 "Земли Абиссинии были жестоко опустошены Королем Штормом, будучи одним из регионов, наиболее пострадавших от его завоеваний. Теперь мы можем проявить к котам нашу добрую волю, предоставив им технологии и ресурсы, необходимые для восстановления их родины."

ARA_reorg_zebrican_lands_cat:0 "Зебриканские Имперские Протектораты"
ARA_reorg_zebrican_lands_cat_desc:0 "Давайте начнём делить земли Зебрики совершенно произвольно и позволим некоторым абсолютно надёжным "местным помощникам" управлять этим хаосом."

