l_russian:

# ARA
landmark_goy_arantigos_grand_temple:0 "Великий Собор Арантигоса"
landmark_goy_arantigos_grand_temple_plural:0 "$landmark_goy_arantigos_grand_temple$"
landmark_goy_arantigos_grand_temple_desc:0 "Несокрушимая конструкция из мрамора, золота и стали. Достигая трехсот метров в высоту, Великий Храм является самым большим сооружением, когда-либо возведенным грифонами – памятником благочестию и тщеславию регента Арантиги. Его угнетающее присутствие над древним городом Карфином служит мрачным напоминанием о правлении Арантиги на юге – и о беззаветной преданности грифонов Арантиги своему богу и императору – Арантигосу."
# NTR
landmark_goy_snowflake_palace:0 "Дворец Сноуфлейков"
landmark_goy_snowflake_palace_plural:0 "$landmark_goy_snowflake_palace$"
landmark_goy_snowflake_palace_desc:0 "Древний дворец Сноуфлейков был построен много веков назад с использованием почти забытой магической техники создания уникальных ледяных кристаллов, которую освоили старые северные пони-маги. Его шесть башен, призванные представлять Великих Северных Духов, взмывают высоко над городом Эверфрост, сверкая на солнце. За многие годы службы в качестве главной резиденции правящей династии Тир Дейге в его огромном хранилище накопились бесчисленные сокровища, а библиотеки наполнились томами тайных знаний."
landmark_goy_aurora_tower:0 "Башня Северного Сияния"
landmark_goy_aurora_tower_plural:0 "$landmark_goy_aurora_tower$"
landmark_goy_aurora_tower_desc:0 "Старый дворец Сноуфлейков был резиденцией Морозного Короля с тех пор, как началось его правление в Тир Дейге. Многовековое сооружение было значительно расширено, чтобы соответствовать своей новой функции, и получило новое название. Башня Северного Сияния, гигантский шпиль из волшебного льда и лучших северных кристаллов, является мощным памятником могуществу Морозного Короля."
landmark_goy_iron_tower:0 "Железная Башня"
landmark_goy_iron_tower_plural:0 "$landmark_goy_iron_tower$"
landmark_goy_iron_tower_desc:0 "Каждый день тысячи рабов трудятся и умирают в мастерских Клаудбьюри. Из Железной Башни надзиратели следят за ними, чтобы гарантировать постоянный запас оружия для армии нежити. Металлические стены Башни служат напоминанием о новой роли некогда гордого города Клаудбьюри."
landmark_goy_black_tower:0 "Чёрная Башня"
landmark_goy_black_tower_plural:0 "$landmark_goy_black_tower$"
landmark_goy_black_tower_desc:0 "Возвышенная среди обугленных руин старой столицы грифонов, Чёрная Башня напоминает рабам, какая судьба ждёт тех, кто осмелится восстать против Морозного Короля."
landmark_goy_shadow_tower:0 "Теневая Башня"
landmark_goy_shadow_tower_plural:0 "$landmark_goy_shadow_tower$"
landmark_goy_shadow_tower_desc:0 "Тьма окутывает Город Огней. Жители Аквилы были закованы в цепи, чтобы служить своим новым хозяевам до конца времен, живя в тени недавно воздвигнутой Теневой Башни."
landmark_goy_blood_tower:0 "Кровавая Башня"
landmark_goy_blood_tower_plural:0 "$landmark_goy_blood_tower$"
landmark_goy_blood_tower_desc:0 "Красная Кровавая Башня возвышается над водами озера Румейр, некогда Колыбели, а теперь Могилы Грифонов. Из неё послушники Морозного Короля осуществляют свой контроль над Центральной Грифонией."
landmark_goy_obsidian_tower:0 "Обсидиановая башня"
landmark_goy_obsidian_tower_plural:0 "$landmark_goy_obsidian_tower$"
landmark_goy_obsidian_tower_desc:0 "Над мраморными зданиями Вечного города возвышается крепость с черными стенами. Обсидиановая башня служит напоминанием о том, что даже самые гордые южные города в конце концов склонятся перед Севером."
landmark_goy_storm_tower:0 "Штормовая башня"
landmark_goy_storm_tower_plural:0 "$landmark_goy_storm_tower$"
landmark_goy_storm_tower_desc:0 "Самая западная сторожевая башня Морозного Короля, Штормовая башня, является первой линией обороны против любого существа, желающего вторгнуться в его владения. Хотя она напоминает заброшенные руины, фундамент которых состоит в основном из обломков кораблей, это всё ещё мощная крепость, как и все другие башни."
landmark_goy_amber_tower:0 "Янтарная башня"
landmark_goy_amber_tower_plural:0 "$landmark_goy_amber_tower$"
landmark_goy_amber_tower_desc:0 "Магические свойства янтаря, иногда называемого «кристаллами Эви», ещё не исследованы. Однако, обилие этого материала позволило построить башню-крепость, господствующую над долиной Эви."
# POM
landmark_goy_great_aetian_lighthouse:0 "Великий Аэтский Маяк"
landmark_goy_great_aetian_lighthouse_plural:0 "$landmark_goy_great_aetian_lighthouse$"
landmark_goy_great_aetian_lighthouse_desc:0 "Расположенный к западу от Визимы, Большой маяк является самым высоким сооружением в Грифонии. Его волшебный свет направляет наши корабли и самолеты... А еще это отличная туристическая достопримечательность! Приобретите свой официальный снежный шар с маяком сегодня!"
landmark_goy_allard_mausoleum:0 "Мавзолей Алларда"
landmark_goy_allard_mausoleum_plural:0 "$landmark_goy_allard_mausoleum$"
landmark_goy_allard_mausoleum_desc:0 "Гробница мегалитических размеров, построенная в память о жизни и кончине Ле Патрона Виктора Алларда. Её многочисленные залы посвящены триумфам Революции и, конечно же, величию самого товарища Алларда. В центре мавзолея его забальзамированное тело представлено в стеклянном гробу, служащем местом паломничества для его верных почитателей."