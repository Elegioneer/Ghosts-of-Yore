### Bookmarks ###
POM_GATHERING_STORM_DESC1:0 "\n\n\n\n\n\n\n\n£GFX_texticon_CSSc_GOY_POM_map\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nПобежденные, но не сломленные, грифоны Помоварры многие годы страдали под аквелийским игом, но так и не забыли свою историю и не утратили стремление к свободе. Однако, их последнюю попытку возвращения независимости во времена революции, охватившей весь континент, сорвал Леопольд Райхер, наёмник, который теперь зовёт себя «Князем-полковником». Вопреки его гнету, помоварцы готовы восстать снова, чтобы сражаться за свободу, – быть может, в последний раз... Но что вообще значит свобода для тех, кто в своей жизни знал только войну и страдания?"

### State Description ###
state_lore_text_container_state_name_short_501:0 "Помазон"
state_lore_text_container_state_name_501:0 "§gСтраж§! §7Помоварры§!"
state_lore_text_container_state_description_501:0 "До завоевания Аквелией Помазон был небольшим городом в Старой Помоварре, не заслуживавшим внимания историков. После учреждения Помоваррского Княжества город стал центром аквелийской власти над регионом, окруженным его враждебно настроенными жителями. Так началась история города-крепости Помазон, не раз спасавшего своих чужеземных правителей от восстаний их непослушных подданных. Архитектура старого города, включая княжеский дворец, отражает его историю. Здания окруженных стенами внутренних районов, в которых ныне живут те немногие аквелийцы, кому не повезло очутиться в столице мятежной Помоварры, сохраняют вид своего былого предназначения – бараков княжеской гвардии.\n\nГород заметно вырос в недавние годы; вокруг обшарпанных укреплений, используемых новым правителем как блокпосты, выросли новые районы, рассадники диссидентов и преступников. Помазон покрыт следами разрушений как ни один другой город в Грифонии. Почти каждая стена покрыта выбоинами от пуль, напоминающими о многолетних партизанских боях, проходивших на его улицах. Улицах, где охранники грабят местных жителей, молодежные банды нападают на всех, кто похож на чужака, улицах, на которые после заката партизаны выходят из своих убежищ, и где каждую ночь тишину прерывают звуки выстрелов.\n\nИ несмотря на все, если отвлечься от хаоса и пройтись по городу, на каждом повороте раскроются частики истории Помоварры: выцветшие рисунки клановых символов и персонажей местных мифов на стенах домов, часовенки, посвященные богам и героям древности, поддерживаемые верующими, которые сохраняют свою древнюю культуру, живя в городе, призванном стереть их с лица Грифонии."

### Tech and Equipment ###
POM_infantry_equipment_0:0 "Френьё фузил 'Моделе 80'"
POM_infantry_equipment_0_short:0 "ФФ Моделе 80"
POM_infantry_equipment_0_desc:0 "Первая серийная винтовка, разработанная Арсеналом Фрегнё, стала революционной. Ее превосходство над современниками даже привлекло внимание аквелийских военных, но контракт так и не был подписан из-за начала Революции. Через пару лет после захвата власти Райхером, чертежи винтовки были восстановлены и пущены в производство, чтобы снизить зависимость нового режима от импорта. Уже тогда устаревшая FF-80 сейчас практически антиквариат, но все еще надежна и смертоносна."
POM_infantry_equipment_1:0 "Френьё фузил 'Патром 07'"
POM_infantry_equipment_1_short:0 "ФФ Патром-07"
POM_infantry_equipment_2:0 "Френьё миндрейльхерез 'Патром 10'"
POM_infantry_equipment_2_short:0 "ФМ Патром-10"
POM_infantry_equipment_3:0 "Френьё миндрейльхерез 'Патром 13'"
POM_infantry_equipment_3_short:0 "ФМ Патром-13"
POM_magical_equipment_1:0 "Дирендал карабинен “Мадок”"
POM_magical_equipment_1_short:0 "ДК “Мадок”"
POM_magical_equipment_2:0 "Дирендал карабинен “Утр”"
POM_magical_equipment_2_short:0 "ДК “Утр”"
POM_motorized_equipment_0:0 "Гвард вагонс С8"
POM_motorized_equipment_0_desc:0 "К приходу второго тысячелетия восьмая модель Gward Wagons морально устарела. Мир давно перешел на дизельные грузовики, а S8 остался работать на маломощном паровом двигателе. По иронии судьбы, именно из-за двигателя его приняли на вооружение в Помоварре. Из-за непризнания власти Князя-полковника окружающими государствами и блокады речной торговли Фловеной, Райхер не мог обеспечить свою армию регулярными поставками нефти и вынужденно нашел альтернативу."
