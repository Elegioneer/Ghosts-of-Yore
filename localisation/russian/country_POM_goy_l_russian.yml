### Beach Episode ###
POM_LM_suddenly_unretired:0 "Снова в деле"
POM_LM_suddenly_unretired_desc:0 "Леопольд Райхер бежал сюда именно чтобы война не могла коснуться его вновь. Будь то плохой расчет с его стороны или неудачное стечение обстоятельств, он стал участником очередного вооруженного конфликта – и решил, что не станет бежать от него."
POM_LM_check_old_contacts:0 "Проверить старые контакты"
POM_LM_check_old_contacts_desc:0 "За годы войн Райхер вёл дела с множеством оружейных торговцев, и он поддерживал эти отношения до последнего. Теперь его предусмотрительность окупилась."
POM_LM_fortify_the_islands:0 "Укрепить острова"
POM_LM_fortify_the_islands_desc:0 "Посредственный стратег даже не попытается защитить острова, окруженные водой со всех сторон. Опытный стратег превратит их плотные леса и мелкие бухты в смертоносные ловушки для врага."
POM_LM_attract_mercs:0 "Привлечь наёмников"
POM_LM_attract_mercs_desc:0 "Кто не захочет пойти на войну взамен на обещание государственно обеспеченной пенсии и отставки в тропическом раю?"
POM_LM_rouse_locals:0 "Пробудить местных"
POM_LM_rouse_locals_desc:0 "Местные жители долгое время довольствовались определенной свободой от метрополии, и многие из них готовы воевать, чтобы не оказаться под властью заморских тиранов."
POM_LM_train_new_officers:0 "Обучить новых офицеров"
POM_LM_train_new_officers_desc:0 "Нам хватает ревностных борцов за свободу, но лишь боевым духом в современной войне не победить. Мы запустили программу подготовки молодых офицеров с наемниками в качестве инструкторов."
POM_LM_reuse_their_equipment:0 "Использовать всё брошенное"
POM_LM_reuse_their_equipment_desc:0 "В нашей ситуации не стыдно чинить все оборудование, которое оставляют наши противники, и использовать его против них."
POM_LM_bring_the_fight_to_them:0 "Отбросить врага"
POM_LM_bring_the_fight_to_them_desc:0 "Защита островов не принесет долговременной пользы. Мы должны выбраться из наших укрытий и перенести бой на территорию врага – на море и в небесах."
POM_LM_eyes_and_ears:0 "Глаза за каждым кустом"
POM_LM_eyes_and_ears_desc:0 "Если немного растолкать Шатенцана и выделить ему немного средств, он сможет основать службу военной разведки, сравнимую с лучшими из лучших."
POM_LM_develop_our_industry:0 "Развить тяжелую промышленность"
POM_LM_develop_our_industry_desc:0 "На тяжелой промышленности держится любая современная армия. Без налаженного производства вооружения мы не сможем долго воевать."
POM_LM_improve_our_strategy:0 "Улучшить нашу стратегию"
POM_LM_improve_our_strategy_desc:0 "Теперь, когда наша армия – по большей части – снаряжена, пополнена молодыми офицерами и в общем готова воевать, мы наконец-то можем начать разработку долговременной стратегии для этой войны."
POM_LM_retired_for_good:0 "Окончательное увольнение"
POM_LM_retired_for_good_desc:0 "Полковник Райхер хорошо прижился за время, проведенное здесь. Роскошная отставка, ради которой он воевал на континенте – и еще раз на этих берегах – ждет его."
POM_LM_spirit_of_defence:0 "Дух обороны"
POM_LM_spirit_of_defence_desc:0 "Времена испытаний настигли Ле Меридьен, но островитяне были готовы к ним. С помощью отставного правителя Помоварры Леопольда Райхера промышленность государства пережила быструю милитаризацию, и кампания пропаганды невиданных масштабов подбивает населения на все возможные действия для поддержаания независимости их государства."
POM_LM_free_mines:0 "§YБирюзовое море§!:\nЕженедельное минирование в военное время: §G+25§!"
POM_LM_mercenary_influx:0 "Приток наёмников"
POM_LM_mercenary_influx_desc:0 "Наемники со всех уголков мира прибывают на зов Полковника Райхера и его невероятные обещания."
POM_LM_peoples_war:0 "Народная война"
POM_LM_peoples_war_desc:0 "Каждый островитянин готов защищать страну от чужаков. Никогда больше эти острова не попадут под власть иностранцев!"
POM_LM_officer_school:0 "Офицерские училища"
POM_LM_officer_school_desc:0 "Чрезвычайно эффективная система высшего военного образования, основанная бывшими наемниками, производит первоклассно обученных офицеров для меридьенской армии."
POM_LM_scavenger_companies:0 "Отряды утилизации"
POM_LM_scavenger_companies_desc:0 "Специальные отряды сборщиков добавлены в каждую дивизию. Они собирают сломанное оборудование, которое оставляет за собой противник, чинят его и пополняют наши запасы."
POM_LM_shady_connections:0 "Теневые связи"
POM_LM_shady_connections_desc:0 "Многочисленные связи Хайнриха Шатенцана и Леопольда Райхера, которые они собрали за годы войн в Грифонии, позволяет им быстро устанавливать шпионские сети в любом месте, где они нужны."
POM_LM_add_ships:0 " Добавляет §G6§! §Yлёгких крейсеров класса «Glorieuse»§! в резервы.\n Добавляет §G24§! §Yэсминцев класса «Beauvais»§! в резервы."
POM_LM_add_planes:0 "Добавляет §G500§! истребителей типа «§YFunke-Wolf 190§!» в резервы."
POM_LM_add_planes_2:0 "Добавляет §G200§! Морских бомбардировщиков типа «§YJurgen 97§!» в резервы."
POM_LM_add_mercenaries:0 "Нанимает §G5–6§! §Yдивизий наёмников§! из разных стран."
POM_reihers_div_subj:0 "Наёмники Райхера"
POM_reihers_div_key:0 "Одна из дивизий, нанятых Полковником Райхером для обороны Ле Меридьен."
POM_LM_reihers_hideout:0 "Убежище полковника Райхера"
POM_LM_reihers_hideout_desc:0 "Беглый правитель Помоварры полковник Райхер по слухам скрывается здесь с большой группой солдат, свободно тратя свои несметные богатства на различные табачные продукты, поразительно старое вино и откаты правительству, чтобы оно скрывало его присутствие."
goy_pomovarra.323.t:0 "Воинственный пенсионер"
goy_pomovarra.323.d:0 "Наш маленький тропический рай широко известен как убежище для различных экспатов, жаждущих выйти на пенсию – естественно, за свой счет! Такие персонажи привозят с собой все – абсолютно законно и этично добытые – средства и свободно тратят их в наших казино, барах и прочих заведениях, обслуживающих богатых туристов. Из нашей коллекции свергнутых президентов, изгнанных вельмож и офицеров побежденных армий особенно выделяется один грифон.\nКогда к нашим берегам подплыл одинокий корабль, сначала его сочли за судно особенно наглых пиратов, собирающихся ограбить наши острова. Но вскоре судно определили как Императрицу Жизельду, аквелийский линкор. После Революции всё влияние нашей былой метрополии исчезло, и некоторые начали предполагать, что Аквелия решила восстановить власть над нашим отдаленным клочком земли. Когда корабль встал на якорь рядом со столичным портом, с палубы сошёл не отряд штурмовиков, а одинокий посланник – алмазный пёс. Он передал нам письмо от Полковника Райхера, бывшего офицера Рейхсармии, а позже – князя Помоварры. Каким-то образом ему удалось победить Аквелию, и вместо того, чтобы попытаться ей править, он погрузил все ценности на захваченный корабль и отплыл к Ле Меридьен. Его предложение было простым: он делится с нами частью своих невероятных богатств в обмен на местное гражданство и защиту от всех, кто потребует его возвращения в Грифонию (он не знал о том, что у нас в принципе нет закона об экстрадиции). Поскольку в случае отказа мы выяснили бы, осталась ли на борту его корабля парочка артиллерийских снарядов, мы приняли его с распростёртыми объятиями.\nС тех пор Райхер стал местной звездой, безрассудно тратя свои изумительные богатства вместе с боевыми товарищами. Даже с их расточительностью им потребовалось бы несколько жизней, чтобы опустошить свои запасы, если их печени не сдались бы раньше. Однако, теперь произошло немыслимое: нас вовлекли в безнадежную войну. Как только вести об этом дошли до столицы, полковник лично пришёл к нам, всё ещё воняя как ликёроводочный завод, и попросил передать ему верховное командование силами обороны Ле Меридьен, признавшись, что влюбился в наши острова. Если мы согласимся, он пустит свои колоссальные средства, связи с наёмниками и черным рынком и своих боевых товарищей, а также корабль, на котором он прибыл, на военные нужды. В качестве удостоверения своей компетентности он просто сказал, что он захватил четверть Грифонии, начав с меньшим. Разумеется, мы можем отказаться. Райхер прямо сказал, что он не привык работать на кого-либо, кроме самого себя. И если мы не хотим воспользоваться его помощью, он отчалит к ещё более дальним берегам, предпочтительно, с такой же расслабленной политикой экстрадиции."
goy_pomovarra.323.a:0 "Тост за полковника Райхера!"
goy_pomovarra.323.b:0 "Мы справимся без него."
goy_pomovarra.323.c:0 "Он испортит нашу социалистическую утопию!"
goy_alcohol:0 "Похмелье"
goy_alcohol_desc:0 "Этот персонаж восстанавливается после длительного употребления алкоголя."
goy_pomovarra.325.t:0 "Буквально пляжный эпизод войны"
goy_pomovarra.325.d:0 "Когда армия так называемого Князя-полковника Райхера прошла по Западной Грифонии, за собой она оставила след разрушения и череду разграбленных городов. Райхер по-своему превзошёл даже Короля Шторма, оказавшись совершенно неспособным и незаинтересованным в управлении захваченными землями. Он лишь использовал их для добычи ресурсов перед своим последним ударом, который сокрушил немощную Аквелию и поставил точку в истории гнилого старого порядка.\nБлагодаря этому мы смогли выковать новое общество в пламени Революции, но осадок от доселе невиданных разрушений, навлечённых Райхером, остался. К счастью, Полковник – в стиле древних налётчиков – украл всё, что блестело, погрузил добычу на самый большой корабль, брошенный командой, и уплыл за горизонт.\n\nПрошло много времени перед тем как мы получили вести о его дальнейших похождениях. Оказывается, он нашёл пристанище в месте, куда стекаются все похожие персонажи – Ле Меридьен, бывшая колония Аквелии, оставленная на произвол местного правительства после Второй Революции. Приём изгоев со всего мира был важным источником доходов для этого жалкого недогосударства. Райхер нашёл там идеальные условия для траты краденых богатств на выпивку и азартные игры. Однако, правосудие можно отложить, но не избежать, и вскоре Ле Меридьен оказались вовлечены в войну.\nВ то время как большинство “пенсионеров”, отдыхавших там, сбежало в более мирные края, Принц-полковник взял бразды правления над местными и начал строить оборону. Вся Аквелия едина в надежде на то, что Райхера наконец попадётся – будь то в наши когти или в чужие лапы. Вне зависимости от того, как закончится жизнь этого варвара, каждый аквелиец почувствует облегчение."
goy_pomovarra.325.a:0 "Полный вперёд навстречу Князю-в-отставке!\n(Смена страны на Ле Меридьен)"
goy_pomovarra.325.b:0 "Удачи им!"
goy_pomovarra.325.c:0 "Мы возьмём его первыми!"
goy_pomovarra.325.e:0 "На самом деле, всё это время я был Райхером!\n(Смена страны на Ле Меридьен)"
goy_pomovarra.325.f:0 "Смерть Райхеру!"
goy_pomovarra.329.t:0 "Всё хорошо, что хорошо кончается"
goy_pomovarra.329.d:0 "Похмелье... Ох, ну почему же ни один единорог в мире не придумал какой-нибудь волшебный препарат от него? Хорошо известно, что магия может излечить большинство болезней – кроме простуды и, конечно же, похмелья. Так, без лекарства, Райхеру пришлось провести весь этот длинный день в муках, ожидая конца вечернего парада победы. Ему не стоило столько пить с офицерами прошлой ночью... Но как он мог отказаться от пары (скорее дюжины) рюмок выпивки со своими ближайшими соратниками, с которыми он пропутешествовал из Грифонии сюда – и теперь обратно. Но сегодня Шатенцан, беспощадное создание, притащил его на парад. Оказывается, его присутствие было важно. Отряд за отрядом наёмников проходил по главной улице под наблюдением группы важных пташек, сидящих на балконе бывшего губернаторского дома. Большинство товарищей Райхера были так же сонны, как и он; некоторые даже задремали. Дальше начались речи – тирады о демократии, восстановлении свободы, окончании какой-то социалистической тирании и о новом начале для Аквелии и Грифонии. Райхер их почти не слышал. Он лишь молился о том, чтобы злой дух, долбивший его череп изнутри, остановился... Вдруг, его подняли со стула и поставили перед микрофоном. Полковник осмотрелся в полном смятении... Ах, да, он же был командиром победоносной армии... Они хотят услышать от него поздравления. Он даже, кажется, согласился на это пару дней назад... Перед запоем.\n«Экхм... Солдаты! Бравые воины!» – Райхер отчаянно пытался собраться с мыслями – «Да, вы все проявили большую отвагу. Честно, я понятия не имею, как мы смогли это провернуть, но знаете что? Теперь о нас будут рассказывать на уроках истории, а ученики будут спрашивать: «Да как? Быть такого не могло!» – Но это было! Вы сделали невозможное, и вы, чёрт бы вас подрал, были лучшими солдатами из всех, кем я командовал! Наверно, вас и Грифонию ждёт какое-то светлое будущее, но я не буду ответственным за него. Поверьте, в этом я плох! Но есть много способных грифонов, которые займутся этим вместо меня, и всё будет отлично! Так или иначе, вы прекрасно выполнили свою работу! Я вас поздравля–»\nВ этот момент Райхер попытался исполнить воинское приветствие, но вместо этого ударил себя по лбу, потерял равновесие и... полетел кубарем с балкона. Через пару секунд он приземлился в куст.\n«Я в порядке! Всё хорошо!» – закричал он, пытаясь вырваться из окутавших его веток.\nНаблюдая за этим, его преданный Хайнрих Шатенцан закрыл лицо лапами. Похоже, что Райхер пролетел десять метров – будучи настолько пьяным, чтобы забыть о том, что у него есть крылья! – и остался цел и невредим. Действительно, боги ему благоволят. Но за какие грехи они наслали его на Грифонию?!"
goy_pomovarra.329.a:0 "Конец!"