POM_goy_pomovarrisation_cat:0 "Помоварризация новых территорий"
POM_goy_pomovarrisation_cat_desc:0 "В то время как в регионах вблизи от сердца Помовары было достаточно наших грифонов, чтобы включение их в состав Возрожденного Королевства прошло легко, дальние территории населяют недовольные чужаки. Мы создадим кланы хранителей этих земель, переместим этнических помоварцев для управления ими, заставим местных пользоваться нашим языком и установим жесткую цензуру в газетах и радио. Так мы начнем длительный процесс помоварризации завоеванных народов."
POM_goy_pomrise_vinovia:0 "Интегрировать Виновию"
POM_goy_pomrise_vinovia_desc:0 "Виновия, в отличие от других внешних регионов, располагает небольшой диаспорой помоварцев, которая станет основой наших усилий по интеграции. Передав местным кланам контроль над регионом, мы сможем быстро подчинить его."
POM_goy_pomrise_skyaluzzo:0 "Интегрировать Скайлаццо"
POM_goy_pomrise_skyaluzzo_desc:0 "Скайлаццо станет ключевым торговым портом Помоварры. Его будет значительно проще сделать центром нашего влияния на юге, чем любой из больших торговых городов Аквелии, где мы сталкиваемся с организованным сопротивлением."
POM_goy_pomrise_hinterlands:0 "Колонизировать окраины"
POM_goy_pomrise_hinterlands_desc:0 "Внешнии провинции Аквелии, несмотря на свое стратегическое значение, малонаселены, что делает их главными кандидатами для расселения малых помоваррских кланов. Передав эти территории под управление нашим братьям, мы сможем легко их контролировать."
POM_goy_pomrise_flowerino:0 "Интегрировать Фловерино"
POM_goy_pomrise_flowerino_desc:0 "Относительная близость к Весткипу делает Фловерино одним из лучших регионов для полноценной интеграции в Помоварру. Однако, это потребует значительных усилий."
POM_goy_pomrise_pridea:0 "Администрация Прайдеи"
POM_goy_pomrise_pridea_desc:0 "Прайдея была одним из ключевых городов бывшей Аквелии. Потому его подчинить его непросто, но важно для установления контроля над регионом."
POM_goy_pomrise_ker_gollou:0 "Администрация Кер Голлоу"
POM_goy_pomrise_ker_gollou_desc:0 "Кер Голлоу, ранее известный как Аквила, – это убежище Великого Маара и главный рассадник повстанцев. Пока мы не разобьем сопротивление, Аквелия не успокоится."
POM_goy_pomrise_greifwald:0 "Новое Герцогство Грайфвальд"
POM_goy_pomrise_greifwald_desc:0 "До сих пор грайфвальдцы были примерными и сговорчивыми подданными. Это значит, что мы можем использовать существующую иерархию в Грайфвальде, чтобы утсановить твердый контроль над северными краями нашего государства."
POM_goy_pomrise_eyrie:0 "Румейрское Эйри"
POM_goy_pomrise_eyrie_desc:0 "В Герцогстве Эйри проживает множество румейрцев, представителей родственного нам народа. Позволив им править этими землями, мы восстановим историческую справедливость."
POM_goy_pomrise_rumare:0 "Сердце Румейра"
POM_goy_pomrise_rumare_desc:0 "Западные территории Грифонстоуна, несмотря на столетия притеснений, все еще по большей части населены нашими близкими румейрцами. Если мы передадим эти земли им, они наверняка будут чествовать нас как освободителей и помогут нам эффективно управлять этим регионом."
POM_goy_pomrise_griffonstone:0 "Основать Провинцию Грифонстоун"
POM_goy_pomrise_griffonstone_desc:0 "Грифонстоун наш; теперь мы храним его святыни. После всех разрушений, причиненных годами разборок между знатью и местными, которых бросили те, кто должны были их защищать, спасение Родины Грифонов стало нашей задачей. Мы отправим группу наших румейрских соотечественников на замену местным правителям."
POM_goy_pomrise_norzhgeun:0 "Основать Провинцию Норжгеун"
POM_goy_pomrise_norzhgeun_desc:0 "Расположение Грайфенмаршена делает его вратами в Герцланд. И если мы хотим подчинить их себе, необходимо установить чуткий надзор за “болотными грифонами”, как их называют некоторые."
POM_goy_pomrise_tarrin:0 "Тарринская Марка"
POM_goy_pomrise_tarrin_desc:0 "Тарринцы славятся своей непокорностью. Поскольку регион, который они населяют, стратегически важен для нас, мы должны укрепить контроль над ним."
POM_goy_pomrise_skyfall:0 "Новый Скайфол"
POM_goy_pomrise_skyfall_desc:0 "Теперь, когда Скайфол и соседние торговые города подвластны нам, прославленные богатства региона будут пущены на полезные дела. Конечно, предварительно нам следует вычистить эти города от капиталистической гнили, поглотившей их, и дать им новые назначения."
POM_goy_pomrise_feathisia:0 "Фетизская Марка"
POM_goy_pomrise_feathisia_desc:0 "Основание региональной администрации в Фетизии позволит нам укрепить хватку в Герцланде и установить безопасный торговый маршрут к Северной Грифонии. Разумеется, для этого потребуются большие усилия, поскольку в регионе практически никто не хочет с нами сотрудничать, а наши силы и так распределены слишком широко."
POM_goy_secrets_of_old_cat:0 "Тайны Старой Помоварры"
POM_goy_secrets_of_old_cat_desc:0 "Хвала Богам за аквелийское высокомерие, ведь благодаря ему и неспособности правильно использовать наши артефакты, они держали их лишь как трофеи, напоминания о былых победах. Хотя за прошедшие столетия многие из них были утрачены, мы смогли вернуть несколько предметов великой силы, лежавших в музеях и сокровищницах. Однако, даже наши знания о них ограничены, и нам придется раскрыть древние тайны, чтобы научиться использовать и воссоздавать их чудесные свойства."
POM_goy_form_magic_college:0 "Основать Магическую коллегию"
POM_goy_form_magic_college_desc:0 "Прежде чем начать работу над проектами, мы должны обеспечить наших исследователей необходимыми ресурсами и рабочими местами. Для них будут созданы лаборатории, магитехнические средства, защитные камеры и многие другие вещи. Также нам потребуется способ записи их находок, а также перевода и расшифровки текстов, специально закодированных древними помоваррскими друидами."
POM_goy_study_direndall:0 "Изучение Дирендала"
POM_goy_study_direndall_desc:0 "Меч помоваррских королей, выкованный алмазными псами с востока, был украден аквелийцами после Дня Пламенных Небес. Клинок потерпел серьезный ущерб от заклинаний единорогов, что превратило его в ничто большее, чем трофей для захватчиков – который они быстро забыли и поместили в одну из сокровищниц на долговременное хранение.\nИ вот мы вернули этот чудесный артефакт помоваррского прошлого. Согласно легендам, Дирендал мог пробить любую защиту. Поэтому наши исследователи считают, что его изучение позволит нам повторить это свойство в современном вооружении."
POM_goy_spirit_binding:0 "Привязка духов"
POM_goy_spirit_binding_desc:0 "Ходит старая легенда о войнах, совместившихся с нематериальными духами – путем договора или насильно после победы в бою. Хотя эта практика значительно сокращала долголетие этих грифонов – говорят, что они как будто бы “сгорали” со временем – по легенде они могли легко побеждать целые войска с помощью магических способностей за гранью тех, которые могли получить обычные грифоны. Среди восстановленных документов мы нашли разбор этого процесса, созданный во времена Старого Королевства, когда маги попытались воссоздать его."
POM_goy_elixir_of_vigor:0 "Зелье выносливости"
POM_goy_elixir_of_vigor_desc:0 "Помоваррские друиды были не только сильными магами, но и прославленными лекарями, алхимиками и травниками. Столетиями они создавали зелья, способные вылечить даже самые тяжелые увечья, восстановить выносливость бойцов или придать им сверхъестественную силу.\nА еще они составили рецепт вкуснейшего супа из капусты!\nХотя большинство алхимических рецептов были утрачены, мы все же нашли несколько многообещающих записей. Поскольку они зашифрованы, аквелийцы никак не смогли воссоздать содержащиеся в них формулы и в итоге забыли о них. Но наши исследователи намного лучше разбираются в таких материях."
POM_goy_geomancy_secrets:0 "Тайны геомантии"
POM_goy_geomancy_secrets_desc:0 "В древние времена земли Помоварры были утыканы мегалитическими кругами, собиравшими остаточную магию из окружения. Однако, друиды, которые поддерживали их работу, вымерли, и круги перестали действовать. Но исследователи Магической Коллегии заявляют, что техники восстановления магических кругов можно воссоздать, чтобы использовать их для подготовки мощных заклинаний."
POM_goy_ritual_magic_cat:0 "Ритуальная магия"
POM_goy_ritual_magic_cat_desc:0 "Мы смогли восстановить один мегалитический круг и раскрыли методы подготовки нескольких заклинаний, которые использовали друиды Старой Помоварры. В отличие от них, мы не станем собирать остаточную магию, а направим ее сжатым потоком прямо в круг, позволяя нам использовать магию, намного мощнее той, которая доступна грифонам. Из-за технических ограничений, мы способны использовать только одно заклинание за раз."
POM_goy_weather_manipulation:0 "Изменение погоды"
#POM_goy_weather_manipulation_desc:0 ""
POM_goy_plant_growth:0 "Рост посадок"
#POM_goy_plant_growth_desc:0 ""
POM_goy_precognition:0 "Предвидение"
#POM_goy_precognition_desc:0 ""
POM_goy_empower_enchantments:0 "Усиление зачарований"
#POM_goy_empower_enchantments_desc:0 ""
POM_goy_study_magic:0 "Исследование магических феноменов"
#POM_goy_study_magic_desc:0 ""
POM_goy_integrate_outer_provs_cat:0 "Интеграция дальних регионов"
POM_goy_integrate_outer_provs_cat_desc:0 "Мы вернули боем территории, которые были главными составляющими Старого Королевства. Число помоварцев в этих землях значительно сократилось за столетия власти чужаков, но в них достаточно наших родичей и коллаборационистов, чтобы построить новую иерархию. Чтобы усилить наш контроль над этими территориями, мы создадим стабильную бюрократию, восстановим местные кланы и присоединим к ним всех согласных грифонов."
POM_goy_integrate_adelart:0 "Интегрировать Аделарт"
POM_goy_integrate_verenia:0 "Интегрировать Верению"
POM_goy_integrate_falconia:0 "Интегрировать Фальконию"
POM_goy_integrate_westkeep:0 "Интегрировать Весткип"
POM_goy_establishing_dominions_cat:0 "Выделение домининов"
POM_goy_establishing_dominions_cat_desc:0 "В попытке удержать Герцланд и Большую Помоварру мы слишком широко растянулы силы. Во внешних территориях необходимо частично передать власть местным. Если мы правильно сыграем карты, жители возненавидят наших марионеток и будут грызться друг с другом, а не собирать силы против нас."
POM_goy_dominion_north:0 "Северная Марка"
POM_goy_dominion_piudmont:0 "Большой Пьюмонт"
POM_goy_dominion_minotauria:0 "Королевство Минотавров"
POM_goy_dominion_evi:0 "Доминион Эви"
POM_goy_dominion_hellsword:0 "Восточный оплот"
POM_goy_dominion_expand_hlq:0 "Расширение Хеллсворда"
POM_goy_dominion_austurland:0 "Королевство Эйстюрланд"
POM_goy_dominion_riverlands:0 "Новое Речноземье"
POM_goy_dominion_hillpony:0 "Земли холмов и пони"
POM_goy_reclaim_the_colony_cat:0 "Первый шаг на пути ко Всемирной Революции"
POM_goy_reclaim_the_colony_cat_desc:0 "Возвращение Ле Меридьен, бывшей колонии акелийской короны, не имеет значения для нашего дела, но представляет большие возможности в создании военно-морской базы для операций в Эквусе и Зебрике."
POM_goy_reclaim_the_colony:0 "Вернуть Потерянную Колонию"
