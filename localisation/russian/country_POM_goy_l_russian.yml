### National Focus ###
POM_bayonet_throne:0 "Трон из штыков"
POM_bayonet_throne_desc:0 "Прошло 27 лет с тех пор, как Райхер завоевал Помоварру и объявил себя ее князем. За это время его хватка ослабла, и он подозревает, что конец может быть близок..."
POM_south_news:0 "Новости с юга"
POM_south_news_desc:0 "К югу от нас располагается Королевство Аквелия. Несмотря на идиотизм его правителя и внутренние распри, оно представляет серьезную угрозу для нас. Но похоже, что ветер перемен скоро развалит карточный домик, которым оно стало..."
POM_old_friend:0 "Старый друг"
POM_old_friend_desc:0 "За деньги можно купить многое: оружие, роскошь... и даже власть! Но кое-что нельзя купить никак – верность."
POM_past_glory:0 "Былое величие"
POM_past_glory_desc:0 "Хоть нынешняя ситуация и выглядит мрачно для помоварцев, и в будущем их ждет лишь война, они держатся за свое великое прошлое. Только в попытках восстановить былую славу, помоварцы смогут заполучить свободу."
POM_children_pomovarra:0 "Дети Помоварры"
POM_children_pomovarra_desc:0 "Напряжение растет по мере приближения решающей битвы. Воины Помоварры готовятся к последнему удару."
POM_the_gamble:0 "Авантюра"
POM_the_gamble_desc:0 "Колода пуста, и оба игрока готовы раскрыть свои руки. Но что, если у одного из них припрятан туз в рукаве?"
POM_open_caches:0 "Вскрыть тайники"
POM_open_caches_desc:0 "Ключевую роль в плане Райхера сыграет развертывание оружие, спрятанного на секретном складе. Когда оно будет выпущено, повстанцы попадут в ловушку и потеряют огневое превосходство."
POM_fortify_camris:0 "Укрепить Гервйис"
POM_fortify_camris_desc:0 "Для полного успеха плана Райхера гарнизон Гервийса должен выдержать осаду достаточно долго, чтобы повстанцы пустили в наступление все свои силы. Для этого городу нужны новые укрепления."
POM_trap_is_set:0 "Ловушка установлена"
POM_trap_is_set_desc:0 "Они попались на крючок..."
POM_gather_guerrillas:0 "Собрать партизан"
POM_gather_guerrillas_desc:0 "По всей Помоварре группы повстанцев выдвигаются к городу Гервйис, чтобы нанести последний, решительный удар по силам полковника Райхера. Вместе мы победим оккупантов!"
POM_one_bridge:0 "В одном мосту от победы"
POM_one_bridge_desc:0 "Повреждение железнодорожного моста между Помазоном и Гервйисом повернет ход боя в нашу пользу. Так мы отсрочим прибытие подкрепление Райхера и разобьем его армии по одной."
POM_on_hunter:0 "Ловушка на охотника"
POM_on_hunter_desc:0 "План внутри плана..."

POM_ar_chas:0 "Ручные псы одичают"
POM_ar_chas_desc:0 "С приходом столь желанных дней,\nМы широко глаза открыли,\nИ от Румейра к Уэсткипу бежали,\nКак псы, сорвавшие оковы с шей."
POM_unify_the_movement:0 "Шаткий союз"
POM_unify_the_movement_desc:0 "Когда мы сражались с общим врагом, фракции сопротивления были готовы отодвинуть свои разногласия. Ради процветания Помоварры, мы должны продолжить совместную работу, несмотря на разные политические взгляды и личную неприязнь."
POM_cultural_recovery:0 "Восстановление культуры"
POM_cultural_recovery_desc:0 "Столетиями чужеземные деспоты пытались уничтожить память о нашем прошлом и стереть историю Старой Помоварры. Теперь пришла пора сделать первые шаги по долгому пути к восстановлению нашей культуры."
POM_organise_civilian_gov:0 "Гражданское правительство"
POM_organise_civilian_gov_desc:0 "Мы не можем править страной как военным лагерем вечно. Очевидно, насколько плохо это кончилось для Райхера и его дружков. Старую администрацию необходимо вычистить и установить качественную бюрократию."
POM_empty_armories:0 "Опустошить арсеналы"
POM_empty_armories_desc:0 "Силы Князя-полковника оставили множество пунктов снабжения и арсеналов в наших землях. По показаниям пленников и военной документации мы сможем найти склады оружия, которое мы сможем применить в благих целях."
POM_galvanise_the_pop_native:0 "Мобилизовать население"
POM_galvanise_the_pop_native_desc:0 "Фловена, «Меньший Маар», как прозвали ее помоварцы, - символ нашего упадка. Грифоны изо всех уголков Помоварры требуют, чтобы мы собрали силы для уничтожения этого рассадника жадности и высокомерия."
POM_cervys_trials:0 "Гервйисский процесс"
POM_cervys_trials_desc:0 "Немногие военачальники армии Райхера попали в наш плен. Большинство погибло в бою, некоторые смогли сбежать заграницу, а кого-то повстанцы казнили на месте. И все же осталось достаточно высокопоставленных офицеров для справедливого суда."
POM_gather_volunteer_brigades:0 "Собрать бригады добровольцев"
POM_gather_volunteer_brigades_desc:0 "С освобождением Помоварры многие братья и сестры за рубежом выразили желание вступить в наши вооруженные силы. Мы должны организовать этих храбрых птиц в настоящие подразделения и подготовить их к предстоящим боям."
POM_fifth_column:0 "Фловенская пятая колонна"
POM_fifth_column_desc:0 "Тысячи помоварцев живут в городе Фловена. Многие из них жаждут воссоединения с их восточными братьями. Нам нужно установить связь с ними и заручиться их помощью в нашем законном завоевании Фловены."
POM_sideline_the_left:0 "Притеснить левых"
POM_sideline_the_left_desc:0 "Хотя коммунистическое движение никогда не пользовалось серьезной поддержкой среди населения Помоварры, после освобождения красная гидра начала поднимать свои безобразные головы. Пришло время официально осудить левых и напомнить грифонам, что красному цвету не место на флаге Помоварры!"
POM_rip_off_the_petals:0 "Вырвать лепестки"
POM_rip_off_the_petals_desc:0 "Наконец мы готовы. Город Садов, паразит, питавшийся помоварской кровью десятилетиями, падет! Близится день нашей мести!"
POM_final_showdown:0 "Финальный поединок"
POM_final_showdown_desc:0 "Два грифона входят, один выходит."

POM_liberation_army:0 "Освободительная армия Помоварры"
POM_liberation_army_desc:0 "В память о павших в борьбе с угнетателями, наши недавно сформированные вооруженные силы будут известны как Освободительная армия Помоварры... За этой формальностью будет стоять масштабная реорганизация."
POM_cervys_cannons:0 "Гервйисские пушки"
POM_cervys_cannons_desc:0 "Как многие говорят, Артиллерия – бог войны. Пусть мы и сорвали маневр Райхера в ходе битвы за Гервйис, нам следует извлечь уроки из его плана."
POM_military_motorisation:0 "Военная моторизация"
POM_military_motorisation_desc:0 "Скорость становится все более важным фактором на поле боя, а нагрузка на системы снабжения растет, ведь никакое мародерство не сможет дать современной армии всего необходимого. Моторизация решает обе эти проблемы. Так давайте добудем новые грузовики!"
POM_formalise_our_doctrine:0 "Формализовать нашу доктрину"
POM_formalise_our_doctrine_desc:0 "До недавних пор каждый командир сопротивления сражался как считал нужным. Такой подход, несомненно, сбивал нашего неподвижного врага с толку, однако, он совершенно непригоден для настоящей воины. Мы должны проанализировать опыт восстания и сформировать доктрину для нашей новой армии."
POM_standardise_infantry_weapons:0 "Стандартизировать оружие"
POM_standardise_infantry_weapons_desc:0 "В ходе восстания наши храбрые войны стреляли чем попало – выбирать им не приходилось. Теперь мы имеем десятки моделей несовместимого вооружения, которое нам нужно снабжать патронами и обслуживать. Нам придется установить стандарты для военного снаряжения и модифицировать старое оружие под них."
POM_learn_from_the_past:0 "Изучить нашу историю"
POM_learn_from_the_past_desc:0 "Наше прошлое может научить нас многому. Старая магия, способы высвобождения забытых сил. Наши исследователи должны углубиться в изучении древних фолиантов и открыть секреты магии прошедших веков."
POM_establish_the_mic:0 "Военные контракты"
POM_establish_the_mic_desc:0 "Некоторых грифонов возмущают связи между частным бизнесом и вооруженными силами. Только не нас! Для надежного снабжения армии мы поддержим компании, готовые производить военное оборудование. И что в этом может быть плохого?"
POM_children_pomovarra_native:0 "Дети Помоварры"
POM_children_pomovarra_native_desc:0 "Мы извлекли много полезных уроков из столетий битв с чужеземными завоевателями. Мы научились адаптироваться, использовать особенности местности и побеждать, используя минимум ресурсов. Теперь необходимо изложить эти знания на бумаге."
POM_reform_officer_corps:0 "Офицерская реформа"
POM_reform_officer_corps_desc:0 "Пришло время пересмотреть структуру командования Освободительной Армии. Командиры получат ранги согласно своим заслугам и знаниям, а неопытные поступят на новообразованные офицерские курсы."
POM_retrain_our_forces:0 "Сохранять наши силы"
POM_retrain_our_forces_desc:0 "Помоварцев мало, а врагов много. Мы позаботиться о том, чтобы как можно больше солдат выживало в боях и сохраняло способность сражаться."
POM_outrun_our_enemies:0 "Обогнать противников"
POM_outrun_our_enemies_desc:0 "Похоже, некоторыми жителями этого мира овладела нездоровая жажда скорости... Хоть мы и не входим в список этих безумцев, мы признаем, что картина несущейся стальной лавины танков по-своему привлекательна."
POM_resist_any_damage:0 "Выдержать любой урон"
POM_resist_any_damage_desc:0 "Странное наблюдение: когда на поле брани появляется огромный стальной монстр, на нем тут же концентрируется весь огонь. Что с этим делать? Добавить брони и смеяться над неприятелем, пока его пули рикошетят от наших танков!"
POM_fregneux_military_academy:0 "Военная академия Фрегнё"
POM_fregneux_military_academy_desc:0 "Курсов подготовки офицеров недостаточно! Скоро наши старейшие боевые товарищи начнут уходить в отставку, не оставив достойной замены. Военная академия Фрегнё позволит старым борцам за свободу передать опыт новому поколению карьерных офицеров."
POM_mandatory_military_service:0 "Всеобщая воинская повинность"
POM_mandatory_military_service_desc:0 "Если мы хотим сражаться с противниками на равных, каждый здоровый помоварец должен быть готов пойти на фронт. С помощью пропаганды и обязательного призыва мы расширим круг готовых рекрутов для армии."
POM_expand_elite_formations:0 "Расширить элитные подразделения"
POM_expand_elite_formations_desc:0 "Нас слишком мало. Чтобы превозмочь наших многочисленных врагов, наши воины должны стать лучшими из лучших."
POM_expand_production:0 "Расширение ВПК"
POM_expand_production_desc:0 "Больше ружей, больше пушек, больше танков, больше снарядов! Грядет эра воины, в которой нам потребуется все оружие, которое мы можем достать. Технологии производства должны быть оптимизированы, а список контрактов для частного сектора – расширен."
POM_rather_death_than_dishonour:0 "Лучше смерть, чем подчинение"
POM_rather_death_than_dishonour_desc:0 "Дух сопротивления, дух свободы – вот, что делает помоварца собой. Как бы ни было тяжело, каждый солдат должен сражаться за свою родину до конца. Этому мы будем учить наш народ. И пословица древних помоварцев станет девизом наших военных!"
POM_champions_of_pomovarra:0 "Чемпионы Помоварры"
POM_champions_of_pomovarra_desc:0 "В прошлом нас вели прославленные короли, вожди и военачальники, которые не боялись сразиться даже с богами; те, кто могли поднять нацию на войну и побеждать целые армии в одиночку. В наше время нет таких великих грифонов, но мы должны следовать их примеру, принимая только сильнейших и храбрейших в ряды нашей армии – офицеров, которые не только ведут бойцов за собой, но и воодушевляют их."
POM_direndall_project:0 "Проект «Дирендал»"
POM_direndall_project_desc:0 "Знаменитый меч, выкованный восточными псами для короля Древней Помоварры Мадока, Дирендал, мог пробить любую броню. Его именем будет названа программа по разработке нового магитехнического вооружения для нашей армии. Каждый солдат Помоварры получит оружие достойное древних королей!"

POM_rebuild_our_economy:0 "Восстановление экономики"
POM_rebuild_our_economy_desc:0 "Если Помоварре суждено стать сильной страной, сначала мы должны сделать её богатой страной. После десятилетий неумелого руководства, разрухи и настоящего грабежа наша экономика в глубоком упадке, чтобы выбраться из которого, потребуется длительное и сложное восстановление."
POM_country_roads:0 "Проселочные дороги"
POM_country_roads_desc:0 "Где бы вы ни оказались, они приведут вас домой!"
POM_eagleton_route:0 "Иглтонская ветка"
POM_eagleton_route_desc:0 "Фловена и Аквелия вовсю стараются задушить наших экспортеров пошлинами и ограничениями. Долговременным решением станет строительство железной дороги до аделартского города Иглтон, через который мы получим легкий доступ к порту Скайфола. Однако, для постройки дороги нам понадобится одобрение от правительства Аделарта..."
POM_infrastructure_investments:0 "Инвестиции в инфраструктуру"
POM_infrastructure_investments_desc:0 "Качественная инфраструктура приносит огромную пользу, ведь быстрая перевозка персонала и больших объёмов материалов бесценна и для промышленности, и для армии. Нам следует приложить усилия к расширению железнодорожной сети и автомобильных дорог."
POM_window_into_the_world:0 "Окно в мир"
POM_window_into_the_world_desc:0 "Отсутствие прямого выхода к морю долгое время ограничивало наши возможности в торговле. Теперь, когда мы владеем портовыми городами Аквелии, мы наконец избавлены от этой проблемы. Главным портом избран Скайлаццо, но окружающая его инфраструктура нуждается в улучшении." #»Скайлаццо» ппц
POM_riches_of_the_land:0 "Богатства земли"
POM_riches_of_the_land_desc:0 "В Помоварре полно природных ресурсов – по большей части, неосвоенных. Пора копать глубоко и с жадностью, и применить богатства нашей земли на пользу нации!"
POM_exploit_cam_deposits:0 "Освоить залежи Кэма"
POM_exploit_cam_deposits_desc:0 "Недавнее исследование выявило залежи редких металлов в наших северных территориях. Освоив их, мы понизим зависимость от нестабильных иностранных продавцов."
POM_refurbish_steelworks:0 "Обновить старые литейни"
POM_refurbish_steelworks_desc:0 "Сталелитейные комбинаты и шахты Помоварры некогда были основным промыслом региона. Однако, за последние годы многие из них пришли в негодность. Восстановление этих заброшенных предприятий обеспечит нашу экономику важными базовыми ресурсами."
POM_rubber_substitutes:0 "Заменители резины"
POM_rubber_substitutes_desc:0 "Резина становится все более важным ресурсом для военной промышленности. К сожалению, каучуковые деревья не растут на наших землях. Но благодаря современной химии, есть решение: производство синтетической резины. Нам это дорого обойдется, но смягчит нехватку природных источников каучука. "
POM_black_gold:0 "Черное золото на Севере"
POM_black_gold_desc:0 "Нефтяные месторождения Аделарта одни из самых богатых в Грифонии. По счастливой случайности, они настолько широки, что согласно показаниям наших геологоразведчиков частично доступны с нашей территории. Разработка этого месторождения даст нам постоянный источник нефти."
POM_synthetic_crystals:0 "Синтетические кристаллы"
POM_synthetic_crystals_desc:0 "Еще один из материалов, которых не найти на наших землях, – это кристаллы, необходимые для производства современной электроники, магитехнического оборудования и (предположительно) оружия массового поражения. Однако, недавние исследования показали, что синтетические кристаллы можно производить в промышленных масштабах."
POM_dig_even_deeper:0 "Копать ещё глубже"
POM_dig_even_deeper_desc:0 "Внешние земли Помоварры полны ресурсов, которые мы могли бы добывать. Разные регионы предлагают разные возможности, так что выбираем место, берем лопаты и кирки, – и идем копать!"
POM_strive_for_autarky:0 "Достижение автаркии"
POM_strive_for_autarky_desc:0 "Страна, неспособная обеспечить себя базовыми ресурсами, – слабая страна, зависящая от прихотей своих соседей. Благодаря недавним расширениям добывающей промышленности, мы можем начать перевод экономику на модель автаркии, которая обеспечит безопасность и процветание нашей страны."
POM_village_schools:0 "Учитель для каждой деревни"
POM_village_schools_desc:0 "Грифоны из сельской местности всегда были сильнейшими носителями помоваррской самобытности, – за что аквелийцы прозвали их отсталыми дикарями и сфокусировались на развитии городов. С тех пор и по наше время деревенские помоваррцы остаются сильными, храбрыми, но необученными. Пора это изменить!"
POM_adult_literacy:0 "Повышение грамотности взрослых"
POM_adult_literacy_desc:0 "Заботясь о том, чтобы будущие поколения получили надлежащее образование, мы не можем забывать и о взрослых грифонах. Для современной нации крайне важно, чтобы каждый умел правильно читать и писать. В противном случае, обучение невозможно!"
POM_engineering_courses:0 "Курсы инженерии"
POM_engineering_courses_desc:0 "Любой, кто видел жалкие попытки наших фермеров справиться с такими машинами, как тракторы, понимает, что большинство не обладает даже базовыми техническими знаниями. Организуя курсы, мы сможем подготовить новое поколение механиков, способных работать с современной техникой."
POM_technical_research_institute:0 "Политехнический НИИ"
POM_technical_research_institute_desc:0 " Настоящее учебное заведение, предназначенное для изучения, воспроизведения и дальнейшего развития новейших достижений науки и техники. Некоторые называют это бесстыдным копированием чужих работ, но мы не слушаем этих мелочных негодяев! Очевидно, что они просто нам завидуют."
POM_university_of_pomazhon:0 "Помазонский Университет"
POM_university_of_pomazhon_desc:0 " До сих пор в Помоварре не было высшего учебного заведения, что вынуждало умных грифонов покидать нашу страну, если они хотели продолжить учебу. Для решения этой проблемы будет основан Помазонский Университет. Благодаря кафедрам истории и культуры, он, несомненно, станет источником не только знаний, но и нашего культурного возрождения."
POM_economy_reforged:0 "Перестроенная экономика"
POM_economy_reforged_desc:0 "Восстановление экономики заняло много времени и усилий, но теперь Помоварра по праву считается одной из самых развитых стран Грифонии. Наша страна процветает, наша промышленность постоянно развивается, и наше будущее, наконец, кажется светлым."
POM_towards_the_future:0 "В будущее!"
POM_towards_the_future_desc:0 "В технологической гонке невозможно победить по-настоящему – лишь бесконечно прилагать усилия, чтобы не отстать от конкурентов. Лаборатории, исследовательские институты, инженерные школы – все это нам нужно, и наконец-то мы можем себе это позволить!"
POM_due_industrialisation:0 "Запоздавшая индустриализация"
POM_due_industrialisation_desc:0 "На протяжении веков мы были отдаленной провинцией Аквелии, которой не хватало надлежащих инвестиций для финансирования промышленного развития. В результате, в то время как наши соседи уже давно пережили промышленную революцию, мы отстаем. Пришло время изменить это."
POM_cervys_industrial_zone:0 "Промышленная зона Гервйиса"
POM_cervys_industrial_zone_desc:0 "Если южную Помоварру тяжело назвать развитым регионом, то северная провинция Кэм – полное захолустье. Открытие промышленной зоны в городе Гервйис и налоговые льготы для предпринимателей, желающих инвестировать в нее, оживит регион и обеспечит его жителей хорошо оплачиваемыми рабочими местами."
POM_modernise_fregneux_armory:0 "Модернизировать Арсенал Фрегнё"
POM_modernise_fregneux_armory_desc:0 "Военная промышленность города Фрегнё производит большую часть оружия, используемого нашей армией. Однако его заводы остро нуждаются в модернизации, чтобы соответствовать современным стандартам качества."
POM_expand_heavy_industry:0 "Расширить тяжелую промышленность"
POM_expand_heavy_industry_desc:0 "После полного обустройства промышленной базы, мы можем приступить к расширению специфических производственных мощностей. Несколько новых перспективных предприятий в сфере тяжелой промышленности требуют государственной поддержки, взамен обещая значительно увеличить наш производственный потенциал."
POM_integrate_flowenian_industry:0 "Подключить заводы Фловены"
POM_integrate_flowenian_industry_desc:0 "Фловена – один из богатейших городов Грифонии. Хотя он известен в первую очередь за свои банки, нельзя недооценивать его промышленность. После реконструкции города мы сможем в полной мере использовать ее."
POM_steady_ahead:0 "Неуклонное движение вперёд"
POM_steady_ahead_desc:0 "Наш план индустриализации увенчался огромным успехом. Наша экономика на подъеме, и мы на верном пути к тому, чтобы стать промышленным центром Западной Грифонии, оставив позади наше прошлое отсталости и разрухи."
POM_arcturius_plan:0 "План «Арктурий»"
POM_arcturius_plan_desc:0 "Названный в честь бога войны и мастерства, план «Арктурий» направлен на развитие как наших основных регионов, так и внешних территорий Помоварры. Это масштабное предприятие позволит далее расширить наши промышленные возможности."
POM_utilise_flowenian_expertise:0 "Использовать фловенские знания"
POM_utilise_flowenian_expertise_desc:0 "Во Фловене много образованных инженеров. За определенное поощрение они были бы готовы поделиться с нами своим техническим опытом, что позволит нам обойти некоторые ограничения, связанные с отсутствием должной технологической базы."
POM_clear_the_land:0 "Расчистить пространство"
POM_clear_the_land_desc:0 "Обширные территории Помоварры представляют собой заброшенную пустошь, бесполезную для нашей экономики. Мы сосредоточим наши усилия на мелиорации этих территорий, чтобы превратить их в плодородные сельскохозяйственные угодья."
POM_modernise_agriculture:0 "Модернизировать сельское хозяйство"
POM_modernise_agriculture_desc:0 "Хотя большая часть нашего – фермеры, они производят не так много, как могли бы, из-за устаревших методов ведения сельского хозяйства и нехватки техники. Что ж, нельзя терять ни минуты. Получайте тракторы и приступайте к работе!"
POM_welfare_programs:0 "Социальное обеспечение"
POM_welfare_programs_desc:0 "Солидарность всегда была важной частью помоваррской культуры. Только помогая друг другу, мы смогли пережить трудные времена. Однако не все проблемы могут быть решены местным сообществом, и именно здесь требуется вмешательство правительства."
POM_expand_urban_centres:0 "Расширить городские центры"
POM_expand_urban_centres_desc:0 "До сих пор Помоварра была сельским регионом, а ее города меркли по сравнению с такими мегаполисами Аквелии и Герцланда. С неуклонным ростом нашей экономики грифоны массово мигрируют в города, что создает нужду в организованной урбанизации – без нее пригороды обрастут трущобами как в Грифонстоуне!"

POM_expand_pomazhon_airfield:0 "Расширить аэродром Помазона"
POM_expand_pomazhon_airfield_desc:0 "Расположенный на окраине города небольшой аэродром Помазона до сих пор не имел никакого стратегического значения, но, выделив немного средств, мы можем превратить его в настоящую базу для военно-воздушных сил."
POM_bring_the_bombers:0 "Вызвать бомбардировщики"
POM_bring_the_bombers_desc:0 "Если у вас возникнут проблемы с окопавшейся вражеской армией, вызовите бомбардировщики и закидайте ее с небес: бомбами, напалмом... всем, что сочтете нужным!"
POM_train_new_pilots:0 "Обучить свежих пилотов"
POM_train_new_pilots_desc:0 "Без должным образом подготовленных пилотов наши военно-воздушные силы не смогут действовать эффективно. Итак, нанимаем инструкторов, организуем летные курсы, выделяем топливо – и вперед!"
POM_finance_new_fighters:0 "Выделить средства на новые истребители"
POM_finance_new_fighters_desc:0 "Истребители являются ключевым элементом любых военно-воздушных сил. Обеспечивая превосходство в воздухе, они делают безопасное использование более специализированных типов самолетов возможным. Очевидно, мы должны инвестировать в создание новых моделей истребителей."
POM_even_bigger_bombers:0 "Большие бомбардировщики"
POM_even_bigger_bombers_desc:0 "У врагов есть раздражающая привычка прятать свою важнейшую инфраструктуру глубоко за линией фронта – далеко за пределами досягаемости наших бомбардировщиков. Для решения этой проблемы появилось новое замечательное изобретение: «стратегические бомбардировщики»."
POM_aces_in_the_skies:0 "Асы в небесах"
POM_aces_in_the_skies_desc:0 "Нам не нужны какие-то пилоты. Нам нужны лучшие пилоты, которых мы можем найти, настоящие рыцари неба! Хочется надеяться, что при более строгом режиме тренировок мы сможем достичь этой цели."
POM_expand_air_defences:0 "Противовоздушная оборона"
POM_expand_air_defences_desc:0 "Мы не единственные, кто наращивает военно-воздушные силы. И наши будущие враги, несомненно, будут пытаться бить по нашей инфраструктуре. Чтобы предотвратить это, мы должны расширить сеть противовоздушной обороны Помоварры."
POM_continue_aircraft_development:0 "Продвинутая разработка самолетов"
POM_continue_aircraft_development_desc:0 "Нам нужно выделять ученым больше средств, если мы хотим разрабатывать действительно современные самолеты."
POM_wrath_of_boreas:0 "Гнев Борея"
POM_wrath_of_boreas_desc:0 "Ходят слухи о проектах по созданию абсолютного оружия: бомбы, способной уничтожать целые города. Так называемая атомная бомба, объединяющая мощь науки и магии в инструмент разрушения, превосходящий все, что было создано ранее. Мы должны быть первыми, кто получит такое оружие."
POM_radar_research:0 "Открытие радиолокации"
POM_radar_research_desc:0 "Эта недавно изобретенная технология – «радар» – кажется очень полезной. Она позволяет обнаруживать приближающиеся вражеские самолеты на огромном расстоянии. Давайте выделим немного средств нашим умникам; нам нужны такие вещи!"
POM_roaring_rockets:0 "Ревущие ракеты"
POM_roaring_rockets_desc:0 "До недавнего времени ракеты были редкостью и имели очень ограниченное применение на поле боя. Однако теперь усовершенствование технологии реактивных двигателей сделало их серьезным оружием, которое нам необходимо иметь."
POM_lightning_fast:0 "Проворные перехватчики"
POM_lightning_fast_desc:0 "Самое важное преимущество в воздушной войне, – это скорость. Поэтому мы должны сосредоточиться на создании более быстрых и маневренных самолетов, которые позволят нам обогнать наших врагов и обыграть их."
POM_death_from_above:0 "Смерть сверху"
POM_death_from_above_desc:0 "Нам нравится запах напалма по утрам, и мы бы хотели, чтобы так пахла вся вражеская страна. Итак, давайте разработаем большие бомбы и выпустим их в большом количестве!"

POM_call_of_the_ocean:0 "Зов океана"
POM_call_of_the_ocean_desc:0 "Помоваррцы никогда не были моряками. Мы предпочитали холмы и леса наших предков бескрайним просторам океана. Однако теперь пришло время нам установить контроль над морями."
POM_review_foreign_doctrines:0 "Анализ иностранных доктрин"
POM_review_foreign_doctrines_desc:0 "Очевидно, что мы почти ничего не знаем об организации военно-морского флота и командовании им. Вместо того, чтобы учиться на собственных ошибках, нам стоит поучиться на веках ошибок, совершенных другими, путем копирования иностранных военно–морские доктрины."
POM_ramp_up_production:0 "Нарастить производство"
POM_ramp_up_production_desc:0 "Чтобы сравняться по количеству кораблей с нашими врагами, нам нужно начать масштабную программу расширения военно-морского флота. Конечно, это будет дорого, но это необходимо, если мы хотим иметь больше, чем несколько переоснащенных лодок."
POM_procure_transport_vessels:0 "Достать транспортные суда"
POM_procure_transport_vessels_desc:0 "Мы захватили более чем достаточно кораблей, брошенных нашими побежденными врагами, которые мы можем легко переоборудовать в довольно приличные транспортные средства."
POM_subversive_submarines:0 "Скрытные подлодки"
POM_subversive_submarines_desc:0 "«Морские волки», как их иногда называют, подводные лодки могут оказаться полезны для нарушения торговых путей наших врагов."
POM_crucial_cruisers:0 "Необходимые крейсеры"
POM_crucial_cruisers_desc:0 "Крейсеры не зря считаются основой современного флота. Хотя теоретики не могут прийти к единому мнению, за линкорами или авианосцами будущее, все они согласны с тем, что любому стоящему флоту нужны крейсеры – много крейсеров."
POM_diverse_destroyers:0 "Многогранные эсминцы"
POM_diverse_destroyers_desc:0 "Быстрые и смертоносные, эсминцы вооружены до зубов и могут выполнять самые разные функции... Давайте построим несколько эсминцев поскорее!"
POM_build_battleships:0 "Надёжные линкоры"
POM_build_battleships_desc:0 "Линкоры десятилетиями правили морями – и, несмотря на слова скептиков, их век ещё не прошёл. Как новой морской сверхдержаве Грифонии, нам нужно построить несколько собственных линкоров!"
POM_commission_carriers:0 "Инновационные авианосцы"
POM_commission_carriers_desc:0 "Авиация кардинально изменила войну на суше, и рано или поздно она, несомненно, изменит и морской бой. Мы должны оставаться на острие и строить авианосцы, чтобы в полной мере использовать разрушительный потенциал самолетов на море."
POM_sea_boars:0 "Морской вепрь"
POM_sea_boars_desc:0 "Наш методичный подход и упорство окупается даже новых для нас областях. Благодаря этому мы создали мощнейший флот из ничего. Возможно, со временем мы сможем с гордостью заявить, что Помоварра правит волнами!"

POM_our_glorious_past:0 "Наше славное прошлое"
POM_our_glorious_past_desc:0 "Более семи веков прошло с тех пор, как аквелийские варвары разрушили Старое Королевство Помоварры. Но мы так и не забыли его величие. И пусть его королей уже нет, почтенное государство наших предков продолжает жить в сердцах каждого помоварца."
POM_the_poisonous_flower:0 "Ядовитый цветок"
POM_the_poisonous_flower_desc:0 "Мы завоевали Фловену, гнилой город, яд которого распространился по всем помоваррским землям. Пришло время очистить его от скверны и превратить в сияющий маяк новой Помоварры."
POM_reestablish_the_clan_system:0 "Воссоздать клановую систему"
POM_reestablish_the_clan_system_desc:0 "Иностранные оккупанты делали все, что могли, чтобы разрушить клановую систему Помоварры, однако многие грифоны продолжали чтить своих великих предков, основателей кланов, и поддерживать связи со своими братьями по клану. Восстановив территориальное деление по клановым границам, причислив бесклановых грифов к существующим кланам и – при необходимости – воссоздав вымершие, мы укрепим чувство братства и традиционные ценности нашего общества"
POM_purify_the_language:0 "Очистить язык"
POM_purify_the_language_desc:0 "За годы иностранного правления в помоваррский язык проникли грязные герцландские и аквелийскими словами. Некоторые даже утверждают, что мы больше не говорим на помоваррском, а лишь на диалекте аквелийского! Поскольку язык является основой каждой нации, пришло время начать лингвистическую реформу, а также сделать помоваррский единственным официальным языком нашей страны."
POM_slander_the_PPP:0 "Очернить ППП"
POM_slander_the_PPP_desc:0 "Так называемая «Патриотическая партия Помоварры» выступает помехой нашему правительству. Состоящие из приспешников покойного Хармана Камриза, они не принимают новую судьбу нашего народа. Было бы глупо прибегать к насилию против своих, а потому мы выставим их предателями общего дела. Со временем ППП растеряет поддержку и погибнет – забытой и бессильной."
POM_reclaim_adelart:0 "Вернуть аделарт"
POM_reclaim_adelart_desc:0 "В северных землях Помоварры, ныне известных как Аделарт, всё ещё прошивают многие наши сородичи. Наш долг – сбросить герцландское иго и освободить их."
POM_voice_of_pomovarra:0 "Голос Помоварры"
POM_voice_of_pomovarra_desc:0 "Неосведомленный гражданин – это апатичный и маловерный гражданин. Чтобы привлечь население к общему делу, мы создадим контролируемые государством газеты и первую официальную радиостанцию – «Голос Помоварры»."
POM_boars_of_arcturius:0 "Вепри Арктурия"
POM_boars_of_arcturius_desc:0 "В древние времена, сталкиваясь с многочисленными врагами, помоварцы нуждались в защитниках. Несколько групп воинов пришли народу на помощь, посвятив свои жизни Помоварре и богу Арктурию. Сегодня мы снова нуждаемся в таких грифонах, и для этого мы создадим рыцарский орден, состоящий из лучших воинов страны."
POM_raise_the_bulwark:0 "Возвести бастион"
POM_raise_the_bulwark_desc:0 "У врагов численный перевес, и, чтобы победить в войне с Аквелией, у нас должен быть очень хороший план. Как и во всем остальном, мы погрузимся в прошлое, когда помоварцы были подобны камню, о который разбивались волны. Мы возведём укрепления и окопаемся, и когда придут аквелийцы, мы их разобьём."
POM_reintegrate_old_pomovarra:0 "Восстановить Старую Помоварру"
POM_reintegrate_old_pomovarra_desc:0 "Нам удалось отвоевать центральные территории Старого Королевства Помоварры. В этих регионах проживает достаточно помоварцев (или хотя бы грифонов, сочувствующих нашему делу), чтобы мы могли перечертить границы и реинтегрировать их в наше возрожденное королевство."
POM_reconquer_greifwald:0 "Отвоевать Грайфвальд"
POM_reconquer_greifwald_desc:0 " Наследие Промоварры в Грайфвальде – не более чем мутное воспоминание. Тем не менее, возвращение этого региона – наш исторический долг и стратегическая необходимость. Без Фальконтауна в наших когтях, мы, возможно, никогда не будем в полной безопасности."
POM_live_by_the_sword:0 "Жить с мечом"
POM_live_by_the_sword_desc:0 "Жизнь помоварца всегда была полна борьбы и войн. Борьбы умирающей нации, цепляющейся за жизнь, постоянной войны с иностранными захватчиками. Мы примем свое предназначение как вечные воины. Все усилия нашего общества должны быть направлены на достижение победы в предстоящих конфликтах. Мы не будем бояться ни войны, ни смерти. Наше наследие будет вечным!"
POM_slay_the_great_maar:0 "Прикончить Великого Маара"
POM_slay_the_great_maar_desc:0 "Пришло время для решающей схватки, столкновения судеб. Великий Маар Грифонии, Аквелия, восстал из гроба и готов нанести по нам удар. Если они победят, у Помоварры не будет будущего. Наш долг перед прошедшими и последующими поколениями помоварцев – одержать победу."
POM_liberate_verenia:0 "Освободить Верению"
POM_liberate_verenia_desc:0 "К востоку лежит Верения, чьё название было присуждено ей завоевателями, подчинившими помоварские и румэйрские кланы, жившие в этих землях веками. Теперь в этих землях царит хаос. Мы должны прикончить жалкое сборище царьков, правящих ими, и принести мир и порядок на исконно наши земли."
POM_every_griffon_a_warrior:0 "Каждый грифон – воин"
POM_every_griffon_a_warrior_desc:0 "Для победы над Аквелией нам понадобится каждый солдат, которого мы сможем снарядить, и каждый из них должен убить столько аквелийцев, сколько сможет. Всех на фронт!"
POM_city_of_darkness:0 "Город тьмы"
POM_city_of_darkness_desc:0 "Аквила пала. Великий Маар побеждён, и уничтожение Старого Королевства отмщено. Теперь пришло время исполнить нашу судьбу."
POM_give_all_we_can:0 "Сделать всё возможное"
POM_give_all_we_can_desc:0 " Бывают десятилетия, за которые ничего не происходит, и недели, за которые проходят века. В такие времена грифоны должны отбросить все свои нужды и желания, чтобы полностью отдать себя службе народу. И грифоны Помоварры готовы сделать это."
POM_taking_the_mantle:0 "Надевая мантию"
POM_taking_the_mantle_desc:0 "Что давно прошло, приходит вновь. Новый король занял трон, и аквелийцы потерпели поражение. Теперь пришло время рулить штурвалом истории как нам заблагорассудится."
POM_land_of_equines:0 "Земля пони"
POM_land_of_equines_desc:0 "Пони оказались восприимчивы к аквелийской гнили. Неизвестно, сколько поколений потребуется, чтобы изгнать порчу из духа этих бедных созданий. Чтобы они не создавали проблем, мы отправим их на запад, в особый протекторат, где они под нашим руководством протопчут собственный путь грифонских пони."
POM_destroy_aquileian_legacy:0 "Разрушить аквелийское наследие"
POM_destroy_aquileian_legacy_desc:0 "Нация живет столько, сколько живут существа, которые ее помнят. Если мы хотим раз и навсегда избавиться от Аквелии, мы должны уничтожить все ее памятники, все произведения ее культуры и тем или иным способом обеспечить, чтобы бывшие аквелийские элиты не имели влияния в нашем Возрожденном Королевстве."
POM_born_to_rule:0 "Рождённые править"
POM_born_to_rule_desc:0 " Иерархия - естественное состояние общества: есть те, кто правит, и те, кем управляют. Поскольку нам нужны новые элиты, чтобы править Возрожденным Королевством, мы выберем самых преданных и выдающихся из нас, которые станут новой знатью Помоварры."
POM_a_city_for_the_king:0 "Королевский город"
POM_a_city_for_the_king_desc:0 "Столица каждого королевства является отражением его могущества и процветания. Хотя Помазон обладает богатой помоваррской историей, тем не менее, известен в Грифонии как захолустье, не вызывающее уважения. Возрожденное Королевство заслуживает более подходящего центра власти."
POM_eternal_epic:0 "Вечный эпос"
POM_eternal_epic_desc:0 "Хорошая история может изменить мышление, восприятие прошлого и даже стать основой нации. Мы не позволим чужакам разорвать нашу историю на мифы! Она будет записана в «Памяти» – великом эпосе, который будет дополняться с ростом нашего величия и новыми достижениями."
POM_pomovarrisation:0 "Помоварризация"
POM_pomovarrisation_desc:0 "Если мы хотим, чтобы Возрожденное Королевство выдержало проверку временем, нам нужно завоевать не только земли наших врагов, но также их души и умы. Переселив часть наших верных помоварцев на новые территории и строго контролируя образование и СМИ, мы начнем процесс интеграции иностранцев в нашу великую страну."
POM_dwell_on_the_past:0 "Окунуться в прошлое"
POM_dwell_on_the_past_desc:0 "Уничтожив Старое Королевство, аквелийцы искоренили древние помоваррские магические искусства, попытались стереть наши традиции, и украли легендарные королевские сокровища. Однако, они не нашли им применения, обращаясь с ними как трофеями. С помощью возвращенных артефактов мы сможем частично восстановить наше прошлое."
POM_reaching_the_sky:0 "Дотянуться до неба"
POM_reaching_the_sky_desc:0 "Город Скайфол – то же для Герцланда, чем была Фловена для нас: гнусный паразит. Мы окажем всем грифонам услугу, избавив мир от жадных олигархов Скайфола и переведя богатства города на службу общему благу."
POM_eastern_kin:0 "Восточные родичи"
POM_eastern_kin_desc:0 "К востоку от нас лежат земли румейрцев, столь же древней грифонской цивилизации, как и наша. Сродни нам, их подчинили и выгнали из отцовских домов на побережье озера Румейр. К нашему времени от великой нации осталась лишь группа бедных грифонов, теснящихся на мелком архипелаге. Румейцры нуждаются в нашей братской помощи!"
POM_establish_tarrin_march:0 "Основать Тарринскую Марку"
POM_establish_tarrin_march_desc:0 "В древности земли ныне известные как Таррин были на крайнем юге зоны расселения помоварцев. В последующие столетия за этот регион, прозванный вратами между западной и южной Грифонией, воевали спарлейцы, карфинцы, и аквелийцы. Теперь он стал критическим буфером между нашей глубинкой и врагами."
POM_rip_out_the_heart:0 "Вырвать сердце"
POM_rip_out_the_heart_desc:0 "Воистину, Помоварре суждено стать новым центром грифонской цивилизации! Для этого, так называемый «Имперский Хартленд» должен быть захвачен. Только после этого мы сравнимся с великими завоевателями древности и сможем возглавить грифонский род в новой эре – помоваррской эре."
POM_the_hermit_kingdom:0 "Затворенное королевство"
POM_the_hermit_kingdom_desc:0 "Если мы хотим исполнить мечту о восстановленной, очищенной Помоварре, нам необходимо избавиться от всех остатков иностранного влияния. Чтобы защитить наших грифонов, мы жестко ограничим контакт с внешним миром и выгоним всех иностранцев – как деятелей культуры, так и бизнеса – из Возрожденного Королевства."
POM_pomovarra_ascendant:0 "Возвышение Помоварры"
POM_pomovarra_ascendant_desc:0 "Это наш триумф. Герцланд захвачен и усмирен. Больше некому противостоять Помоварре – новому гегемону Грифонии. "
POM_the_claw_of_the_gods:0 "Божий ставленник"
POM_the_claw_of_the_gods_desc:0 "Слишком долго архонты извращали волю богов, пользуясь ей как политическим инструментом. Мы избавимся от них. С этого дня Три Храма будут прямо подчиняться правителю Помоварры, единственному защитнику верующих, чье правление очевидно благословлено грифоньими богами."
POM_end_the_imperial_line:0 "Оборвать императорский род"
POM_end_the_imperial_line_desc:0 "Империя мертва, но ее последний правитель выжил. Хоть некоторые и считают его бессильным ребенком, он остается мощным символом порядка, который мы уничтожили. Избавившись от него, мы поставим точку на кровной линии Гроверов и отмстим оккупацию Румейра Домом Грифонстоуна."
POM_griffonian_dominions:0 "Грифонские доминионы"
POM_griffonian_dominions_desc:0 "Продолжая завоевание отдаленных уголков Грифонии, мы поняли что мы не можем править континентом в одиночку; грифонов слишком много, а помоварцев слишком мало. Однако, есть достаточно трусов и оппортунистов, которых мы можем использовать как марионеток. "
POM_old_forest_reservation:0 "Старый лесной заповедник"
POM_old_forest_reservation_desc:0 "Лес Шайсвальд, несмотря на герцландские попытки его «окультурить», остается напоминанием о прошедшей эпохе, когда Грифонией правила магия и дикая природа. Наш долг – очистить Шайсвальд от его истинной порчи – грифонов, населяющих его!"
POM_tame_the_great_river:0 "Укротить великую реку"
POM_tame_the_great_river_desc:0 "На востоке, где протекает река Эви, несколько грифонских наций сражаются за господство – расточая ресурсы и пятная свое наследие. Мы положим конец их жалким раздорам и найдем хорошее примение этим землям."
POM_eclipse_the_south:0 "Затмить Юг"
POM_eclipse_the_south_desc:0 "Почтенная Южная Грифония, колыбель древнейших грифонских государств, ныне лишь тень своего былого величия, утратившая великие империи Спарлеоса и Карфинии. Потому мы будем теми, кто наконец положит конец дряхлым странам южан."
POM_bring_down_the_hellsword:0 "Обрушить Хеллсворд"
POM_bring_down_the_hellsword_desc:0 "Грифоний Фронтир, земля отвоеванная у пони Риверленда многие годы назад, занята самыми молодыми из грифонских государств. В продолжение наших завоеваний, мы возьмем эти земли под контроль и укрепим их, чтобы речные пони не вздумали на нас напасть."
POM_brave_northern_storms:0 "Прорваться на Север"
POM_brave_northern_storms_desc:0 "Северные края Грифонии сильно пострадали за последние годы. Разодранные бандитами и боевиками, они остро нуждаются в чистке от этих нежелательных элементов. Победным маршем мы вторгнемся на север и разобьем тамошних царьков!"
POM_enforce_a_tribute:0 "Навязать дань"
POM_enforce_a_tribute_desc:0 "Это естественно, что побежденный выплачивает победителю надлежащую дань, чтобы первый загибался, а последний крепчал."
POM_eternal_vigilance:0 "Постоянная бдительность"
POM_eternal_vigilance_desc:0 "Победа приносит изобилие, а изобилие делает нацию беспечной. Вне зависимости от наших побед, мы должны оставаться бдительными, чтобы угроза не застала нас врасплох. Мы должны постоянно напоминать нашему населению, что внешний мир только и ждет того, что мы разнежимся, – дабы нанести по нам сокрушительный удар."
POM_resettlement_programme:0 "Программа переселения"
POM_resettlement_programme_desc:0 "Изгнание множества аквелийцев и герцладцев в новозавоеванные земли принесет двойную пользу: сократит поголовье неугодных элементов в центральных регионах и приведет к трениям в отдаленных провинциях, где местные будут слишком заняты притеснением иммигрантов, чтобы бороться с нами."
POM_everlasting_legacy:0 "Вечное наследие"
POM_everlasting_legacy_desc:0 "Мы сделали это! Нет никого, способного бросить вызов предназначению Помоварры. Пришел конец раздорам, и началась долгожданная Четвертая эпоха грифоньего рода – Эпоха Помоварры! Да продлится она до скончания веков! "

POM_our_past_and_future:0 "Наше прошлое и будущее"
POM_our_past_and_future_desc:0 "С приходом конца военного режима Райхера, молодому помоваррскому правительству предстоит проложить новый курс, положить конец раздорам среди населения и найти способ обеспечить надежное будущее для грифонов Помоварры."
POM_the_boar_warrior:0 "Воин-вепрь"
POM_the_boar_warrior_desc:0 "Морель умер, но его последователи все еще суются в наши дела, следуя наказам их ушедшего лидера. Они продолжат раскачивать лодку, пока она не перевернется, если мы не избавимся от их влияния."
POM_our_flowenian_foes:0 "Фловенские неприятели"
POM_our_flowenian_foes_desc:0 "С самого своего основания, город Фловена душила Помоварру, наживаясь на нашем горе, пока наш народ вкалывал под гнетом Аквелии. Но несмотря на все свои богатства, Фловена не смогла отбить натиск нашей армии."
POM_of_ponies_and_war:0 "О пони и войне"
POM_of_ponies_and_war_desc:0 "Одна из причин аквелийского превосходства на поле боя – это военное применение магии, достигаемое, по большей части, благодаря присягнувшим им единорогам. Чтобы Помоварра могла противостоять Аквелии, мы должны разработать собственное магическое оружие."
POM_rein_in_clans:0 "Клановые разборки"
POM_rein_in_clans_desc:0 "С обретением свободы, старые клановые распри вновь стали угрозой нашей стабильности. Хотя многие помоварцы давно забыли про свою клановую принадлежность, это не мешает твердолобым традиционалистам мстить друг другу за грехи праотцов."
POM_legacy_of_the_revolution:0 "Наследие революции"
POM_legacy_of_the_revolution_desc:0 "Республиканская революция принесла нам возможность восстановления свободы Помоварры. Из праха старого порядка восстали мы. Хотя революционеры и не достигли своих целей, ее наследие влияет на современную Грифонию – включая нас. "
POM_on_the_crossroads:0 "На распутье"
POM_on_the_crossroads_desc:0 "Грядет война – война, которая определит будущее Помоварры и всей Западной Грифонии. Наш подход к подготовке к этой воне предрешит нашу судьбу."

POM_leaving_the_past_behind:0 "Оставляя прошлое позади"
POM_leaving_the_past_behind_desc:0 "Мы окружены врагами, и победить мы сможем, только если превратим их в союзников. Конечно, это непростая задача, но настоящий помоварец никогда не отступает перед трудностями!"
POM_free_media_free_minds:0 "Свободные СМИ, свободные умы"
POM_free_media_free_minds_desc:0 "Мы должны поставить свободу слова на пьедестал, как исконное право каждого гражданина нашей страны. Если мы хоти создать свободное и равное общество, его члены должны иметь возможность честно выражать свои мнения."
POM_allies_in_the_north:0 "Союзники к северу"
POM_allies_in_the_north_desc:0 "Грайфвальдцы и аделартцы к северу от нас разделяют с нами дух свободы и могут стать достойными союзниками. Но если их правители не прислушаются к нашим доводам о пользе сотрудничества, нам придется использовать... другие меры убеждения."
POM_decentralisation_of_the_state:0 "Децентрализация госаппарата"
POM_decentralisation_of_the_state_desc:0 "Мы не стремимся контролировать, а направлять и вести. Потому наша политика будет направлена на распределение власти местным органам управления, которые могут более чутко воспринимать нужды своих народов, нежели какие-то отдаленные чуждые бюрократы."
POM_pan_aetian_academy:0 "Панаэтская академия"
POM_pan_aetian_academy_desc:0 "Учреждение, направленное на обмен знаниями между разными образовательными и исследовательскими центрами региона, окажет большую пользу для наших исследований и позволит укрепить политические и культурные связи с нашими союзниками."
POM_fight_the_aquileian_menace:0 "Избавиться от аквелийской угрозы"
POM_fight_the_aquileian_menace_desc:0 "«Периферия» – Так аквелийцы называют наши земли. Они не считают нас равными себе, такой же свободной страной. Аквелия должна быть повержена, чтобы Западная Грифония могла процветать."
POM_westkeep_conference:0 "Уэсткипская конференция"
POM_westkeep_conference_desc:0 "Возможно, с Аквелийской Республикой можно договориться. Мы получили информацию от сторонников наших идей в Аквелии, что их новое правительство может быть настроено на переговоры с нами. Пожалуй, нам стоит попробовать дипломатический подход. "
POM_many_nations_one_future:0 "Много наций, одно будущее"
POM_many_nations_one_future_desc:0 "Мы пойдем вперед вместе! В Аэтии более не будет доминирующего этноса, стремящегося к ассимиляции других под сомнительным предлогом «культурной близости». Вместо этого, права и свободы каждой нации будут защищены."
POM_dream_of_a_united_aetia:0 "Мечта о единой Аэтии"
POM_dream_of_a_united_aetia_desc:0 "Аэтия – древнее название Западной Грифонии, известное еще до времен Арантигоса. Тогда наш регион был плавильным котлом множества кланов, многие из которых позже расселились по другим уголкам Грифонии. Спарлейцы прозвали его «исходной землей», из которой произошло множество народов. Отражая наше многообразие культур, мы присвоим это название."
POM_aetian_principles:0 "Аэтские принципы"
POM_aetian_principles_desc:0 "Президент Ренан, предводитель разрозненной коалиции консервативных и республиканских партий, готов действовать по своей повестке – и внутри страны, и вовне, – стремясь к созданию государства, международно признанного за продвижение свободы и безопасности."
POM_prosperous_economy:0 "Свободная экономика"
POM_prosperous_economy_desc:0 "Принципы процветания и свободы близко связаны. Грифоны богатеют только в свободной экономике. Наше правительство будет стремиться к снятию ограничений, мешающих частному бизнесу, и обеспечению невмешательства в экономику."
POM_encourage_political_participation:0 "Поощрение участия в политике"
POM_encourage_political_participation_desc:0 "Принцип демократии означает максимальную передачу власти в лапы простых грифонов. Нам не нужны всесильные политики, заявляющие, что они «знают, что хочет народ» – они не вправе принимать решения. Предоставляя гражданам простые способы предложения законопроектов парламенту и чаще проводя референдумы, мы обеспечим близость государства к народу."
POM_aetian_foreign_legion:0 "Аэтский иностранный легион"
POM_aetian_foreign_legion_desc:0 "Принцип свободы важнейший из всех, ведь от него произошла сама идея республиканства. Коренные аэтцы пользуются множеством прав, но мы также должны позаботиться о том, чтобы все население мира тоже получило их. Для этого мы создадим Аэтский иностранный легион, военную организацию, которая будет нести свободу притесненным народы мира!"
POM_leave_no_one_behind:0 "Не оставим никого позади"
POM_leave_no_one_behind_desc:0 "После победы Крепе в президентских выборах, она готова привести в действие реформы, преобразующей Аэтию в государство, следующее социально-демократической модели экономики."
POM_rural_development_fund:0 "Фонд развития деревень"
POM_rural_development_fund_desc:0 "В то время как города значительно развились благодаря техническим инновациям последних десятилетий, многие сельские регионы Аэтии мало изменились с доиндустриальной эпохи. Государство выделит финансы на модернизацию деревень с помощью программ электрификации, прокладки асфальтных дорог и раздачи тракторов."
POM_the_welfare_state:0 "Социальное государство"
POM_the_welfare_state_desc:0 "С ростом аэтской экономики возросло и неравенство между жителями нашей страны. Наша задача – позволить всем грифонами извлечь пользу из благосостояния этой золотой эпохи. И чтобы достичь этого, мы будем расширять программы социального обеспечения."
POM_the_fortress_republic:0 "Крепость республиканства"
POM_the_fortress_republic_desc:0 "Многие завидуют нашему богатству. Их пугает пример, который мы подаем миру – то, как он может воодушевить других грифонов на восстание. Мы должны быть готовы защищать луч надежды и мира, который представляет из себя Аэтия."
POM_our_work_is_not_yet_done:0 "Наша работа не завершена"
POM_our_work_is_not_yet_done_desc:0 "Нас столько ждет впереди! Пока мы переходим к более организованной государственной работе, вскрываются многие внутренние проблемы, требующие решения. Однако, мы не можем забывать о наших братьях и сестрах в дальних регионах, которые ждут воссоединения с нами."
POM_land_of_many_creatures:0 "Земля многих существ"
POM_land_of_many_creatures_desc:0 "В Западной Грифонии проживают не только грифоны. Многие пони, некоторые алмазные собаки и прочие тоже считают ее своим домом. Стремясь к создания государства для всех ее жителей, мы должны позаботиться о том, чтобы со всеми видами существ в Аэтии обращались честно и равно."
POM_move_capital_to_westkeep:0 "Переместить столицу в Весткип"
POM_move_capital_to_westkeep_desc:0 "Центральное положение Весткипа делает его идеальным местом расположения нашей столицы, также позволяющее избежать обвинений в отдаче предпочтения какой-либо из основных групп населения из-за переноса столицы в один из их культурных центров."
POM_free_tarrin:0 "Освободить Таррин"
POM_free_tarrin_desc:0 "Тарринская область была захвачена Францистрией в ходе Аквелийской революции. Освобождение региона и передача власти местным жителям покажет миру силу Аэтии и нашу приверженность трем принципам республиканства."
POM_aetian_development_scheme:0 "Схема развития Аэтии"
POM_aetian_development_scheme_desc:0 "Путем запуска нескольких больших проектов общественных работ мы сможем простимулировать экономику Аэтии и улучшить жизнь наших граждан."
POM_formalise_our_political_system:0 "Формализовать политическую систему"
POM_formalise_our_political_system_desc:0 "Объединение различных правовых кодексов, законное закрепление разделения властей и определение обязанностей ветвей центрального и местных органов управления послужат крепким основанием для нашего государства."
POM_bring_order_to_fezara:0 "Принести порядок в Фезеру"
POM_bring_order_to_fezara_desc:0 "В некогда гордом свободном городе Фезере настали тяжкие времена. Он стал рассадником бандитов и подлецов. Теперь нам придется навести порядок в городе и восстановить его былое величие."
POM_reclaim_verenia:0 "Восстановить Верению"
POM_reclaim_verenia_desc:0 "Бывшее Герцогство Верения превратилось в разоренную войнами дыру, где аристократы-мегаломаны бьются за горящие руины. Пришло время освободить помоварцев и аквелийцев региона от ярма тиранов."
POM_gardens_of_flowena:0 "Сады Фловены"
POM_gardens_of_flowena_desc:0 "Знаменитые фловенские сады скрывают множество секретов. С помощью местных жителей мы сможем использовать их во благо нашей страны и создать новые пробивные лекарства для армии и гражданского применения."
POM_expand_the_diplomatic_corps:0 "Расширить штат дипломатов"
POM_expand_the_diplomatic_corps_desc:0 "Хоть вооруженные силы и остаются гарантом нашей независимости, мы должны быть готовы к установлению связей с государствами, которые следуют нашим идеалам. Быть может, вместе мы достигнем продолжительного мира в Грифонии."
POM_protect_our_freedom:0 "Защитить нашу свободу"
POM_protect_our_freedom_desc:0 "Многие завидуют нашей свободе и процветанию. Несомненно, они используют любую возможность, чтобы уничтожить Аэтию. Мы не сможем использовать лишь дипломатию для защиты от их нападок – для этого мы должны быть готовы сражаться."
POM_integrate_outlying_regions:0 "Интегрировать отдаленные области"
POM_integrate_outlying_regions_desc:0 "Мы успешно освободили так называемую «Периферию», традиционно считающуюся частью Аквелии или – много раньше – Старой Помоварры. Этим действием мы доказали, что мы достойные наследники обоих государств. Пришло время полноценно включить новообретенные регионы в состав Аэтии."
POM_invest_in_our_future:0 "Инвестировать в будущее"
POM_invest_in_our_future_desc:0 "Мы живем в век чудес, век небывалого научно-технического прогресса. Предоставив достаточное финансирование для аэтских университетов и НИИ, мы сможем полноценно воспользоваться достижениями этой научной революции."
POM_safe_haven:0 "Пристанище для несчастных"
POM_safe_haven_desc:0 "Мы не можем отвернуться от страданий других существ. Хоть мы и не можем развязать войну против бесчестия и тирании на весь мир, по крайней мере, мы можем приютить потерянные души, бежавшие от войн и тирании в поисках нового дома. "
POM_aetia_on_the_world_stage:0 "Аэтия на мировой арене"
POM_aetia_on_the_world_stage_desc:0 "Грифония десятилетиями захлебывается в войнах, но в ней остаются те, кто пытается добиться мира, свободы и гармонии на разоренном континенте. Нам стоит связаться с ними и начать совместную работу над сохранением мира и продвижением международного единства."
POM_all_griffons_can_dream:0 "Все грифоны могут мечтать"
POM_all_griffons_can_dream_desc:0 "Наш век был веком войн, ненависти и страданий для всего грифоньего рода, но от него родилось лучшее будущее. Многое еще не сделано, но Аэтия уже стала маяком свободы и стабильности в Грифонии. И возможно, со временем все грифоны разделят нашу мечту... "

POM_feathisian_connection:0 "Связи в Фетизии"
POM_feathisian_connection_desc:0 "Пришло время воспользоваться некоторыми старыми контактами нашего Главнокомандующего на севере – вероятно, там есть грифоны, разделяющие наши цели и готовые сотрудничать."
POM_bronze_age_of_pomovarra:0 "Бронзовая эпоха Помоварры"
POM_bronze_age_of_pomovarra_desc:0 "Наступает новая эпоха – эпоха войны и кровопролития, жертв и побед; Бронзовая эпоха Помоварры. Мы вновь займем свое законное место среди великих держав Грифонии – или достойно погибнем, пытаясь это сделать."
POM_our_friends_in_westkeep:0 "Друзья в Весткипе"
POM_our_friends_in_westkeep_desc:0 "Аквелийская провинция Весткип когда-то была частью Помоварры, и в ней до сих пор живет множество наших сородичей. С их помощью мы можем саботировать аквелийскую оборону и разведать полезную информацию, которая будет необходима для победы над нашим злейшим врагом."
POM_war_for_greifwald:0 "Война за Грайфвальд"
POM_war_for_greifwald_desc:0 "Земли Грайфвальда – ничто иное, как недостойно восславленные внешние провинции Фетизии и Помоварры. Пришла пора положить конец их эксперименту по независимости и восстановить порядок в этой территории."
POM_request_more_support:0 "Запросить большую поддержку"
POM_request_more_support_desc:0 "Нам стоит обратиться к фетизским союзниками и попросить их выделить большую помощь. Она потребуется нам, чтобы иметь хоть какой-то шанс победить Аквелию."
POM_lessons_of_the_revolt:0 "Уроки восстания"
POM_lessons_of_the_revolt_desc:0 "Столетия борьбы с оккупантами преподали нам многие уроки, главный из которых заключается в том, что каждый гражданин, каждый грифон должен вложиться в общее дело. Войны не выигрываются идеологами, и даже не командирами, а всеобщим трудом нации. Все помоварцы должны быть готовы сражаться за свою страну!"
POM_make_amends_to_rep:0 "Поддержать республиканцев" #Side with Republicans
POM_make_amends_to_rep_desc:0 "После восстановления независимости, наше национальное единство начало ломаться из-за различия образов Помоварры будущего среди политиков. Сотрудничая с республиканскими партиями, правительство сможем заручиться необходимой поддержкой населения."
POM_war_of_vengeance:0 "Война возмездия"
POM_war_of_vengeance_desc:0 "Время пришло. Мощь Аквелии растет с каждым днем, и если мы не хотим пасть под натиском армии, в разы превосходящей нас по численности, мы должны действовать быстро."
POM_integrate_adelart:0 "Интегрировать Аделарт"
POM_integrate_adelart_desc:0 "Благодаря многочисленным помоварцам, проживающим в Аделарте и культурным связям между нами и остальными местными, интеграция региона не должна составить проблем."
POM_old_faith_old_country:0 "Старая вера для старой страны"
POM_old_faith_old_country_desc:0 "Архонты – лишь инструменты Империи и Аквелии, используемые, чтобы контролировать захваченные ими страны Грифонии. Даже в наше время многие помоварцы не признают авторитет архонтов. Чтобы обрести истинную свободу, мы должны избавиться от влияния Трех Храмов. Для помощи с этим мы обратимся к Староверам, живущим на севере Помоварры."
POM_the_grand_council:0 "Верховный совет"
POM_the_grand_council_desc:0 "Авторитаризм делает нацию рабами пристрастий и недостатков их правителя, а демократия легко скатывается в бессмысленную грызню. Избегая недостатков обеих систем, мы созовем Верховный Совет. 12 грифонов, представителей больших кланов, военачальников и лидеров лояльных политических партий поведут нашу страну в будущее."
POM_one_language_one_nation:0 "Один язык, одна нация, одна история"
POM_one_language_one_nation_desc:0 "Веками грифоны Помоварры понемногу теряли свою идентичность, ассимилируясь в соседние нации. Мы уже никак не восстановим утраченное, но мы можем сохранить то, что осталось."
POM_last_stand_of_pomovarra:0 "Последний бой Помоварры"
POM_last_stand_of_pomovarra_desc:0 "День за днем, мы проигрываем войну против аквелийских орд. Мы не можем позволить себе поражение! Дополнительные мобилизационные меры введены в действие. Каждый грифон должен быть готов сразиться с врагом и умереть, защищая нашу свободу!"
POM_verenian_campaign:0 "Веренская кампания"
POM_verenian_campaign_desc:0 "Мы должны освободить наших братьяв на востоке. Слишком долго они страдали под ярмом тирании веренских дворян. С их освобождением, возвращение земель наших помоваррских предков будет завершено."
POM_withered_lilly:0 "Сгнившая лилия"
POM_withered_lilly_desc:0 "Аквила пала, и мы отмстили века издевательств и притеснений. Теперь начинается новая эпоха – эпоха помоваррской гегемонии."
POM_legacy_of_the_shadow_war:0 "Наследие Теневой войны"
POM_legacy_of_the_shadow_war_desc:0 "700 лет мы боролись с аквелийцами. Когда мы не могли воевать в открытую, мы атаковали из теней. Саботаж и партизанская война были нашими оружиями – и было бы опрометчиво утратить обретенные на этом поприще навыки. В конце концов, что есть государство без спецслужб?"
POM_restrict_citizenship:0 "Ограничить гражданство"
POM_restrict_citizenship_desc:0 "Чтобы защитить нашу страну от подрывной деятельности чужаков, мы должны быть уверены, что Помоваррой правят помоварцы. Пусть члены других наций продолжают жить у нас, но они должны признавать нас, как правителей и не иметь возможности лезть в наши дела."
POM_clan_honour_guards:0 "Почетная клановая гвардия"
POM_clan_honour_guards_desc:0 "Национальное возрождение Помоварры придало новую силу ранее ослабевающим кланам – и подняло поддержку правительства среди них. Несколько старейшин подали петиции о разрешении создания особых военных подразделений, собранных из членов кланов, обученных по традициям помоваррского рыцарского боя."
POM_fea_propaganda_vorst:0 "Пропаганда превосходства"
POM_fea_propaganda_vorst_desc:0 "Некие иностранные силы финансируют производство и распространение про-военной шовинистской пропаганды."
POM_fea_vorst_coup_fallout:0 "Последствия переворота Ворста"
POM_fea_vorst_coup_fallout:0 "Да, мы победили барона Германа Ворста тот Ворста в бою, но он обставил нас по-своему: у него, как будто, были связи с каждым офицером нашей армии, поскольку даже те, кто не участвовал в перевороте, теперь перестали должным образом исполнять свои обязанности. Предстоящая чистка военного персонала займет время – помимо работы над восстановлением всей документации, которую товарищи Ворста уничтожили, осознав, что переворот терпит поражение."
POM_reorganise_eastern_regions:0 "Организовать восточные регионы"
POM_reorganise_eastern_regions_desc:0 "Пришло время правильно интегрировать Восточную Помоварру в наше государство и избавиться от остаточного иностранного влияния в новых регионах."
POM_impose_reparations:0 "Затребовать репарации"
POM_impose_reparations_desc:0 "В землях Аквелии полно полезных ресурсов и производственных мощностей. Мы должны удостовериться, что они используются для поддержки помоваррской экономики."
POM_our_rightful_lands:0 "Наши земли по праву"
POM_our_rightful_lands_desc:0 "Большая часть земель Аквелии по праву помоваррские, украденные у нас семь столетий назад. Пора вернуть эти регионы и включить их в состав нашего нового государства."
POM_divide_aquileia:0 "Разделить Аквелию"
POM_divide_aquileia_desc:0 "Чтобы Аквелия не смогла вновь стать угрозой для нас в ближайшем будущем, мы разделим ее оставшиеся территории между несколькими новыми государствами и специально раздуем пламя раздоров между ними. Конечно, мы также удостоверимся в том, что они не смогут иметь регулярные армии, которые могли бы противостоять нам."
POM_return_of_the_prodigal_children:0 "Возвращение потерянных детей"
POM_return_of_the_prodigal_children_desc:0 "Многие поколения помоварцев покинули свою родину, чтобы начать новую жизнь в дальних странах – убегая от бедности или под страхом аквелийского суда. Наш главнокомандующий сын таких беженцев. Мы должны протянуть лапу помощи потерянным детям Помоварры и помочь им вернуться на восстановленную родину."
POM_declare_pomovarran_republic:0 "Основать Помоваррскую Республику"
POM_declare_pomovarran_republic_desc:0 "Наконец мы оставим позади временное правительство, формально основав Первую Помоваррскую Республику. Так мы объявим во всеуслышанье, что мы не просто повстанцы."
POM_on_our_own:0 "Сами по себе"
POM_on_our_own_desc:0 "Альянс с Фетизией был удобным для нас в свое время. Однако, теперь стало ясно, что наши цели и судьбы слишком разнятся, и нам пора разойтись. Некоторые могут счесть это изменой..."
POM_honour_the_deal:0 "Следовать условиям сделки"
POM_honour_the_deal_desc:0 "Война за Герцланд неизбежна, но с помощью старой стратегии разделения и завоевания мы обеспечим себе быструю победу. К счастью, в Фетизии есть грифоны, более чем довольные предложением раскроения Герцланда между нашими странами."
POM_guided_democracy:0 "Управляемая демократия"
POM_guided_democracy_desc:0 "Аквелия повержена, и мы наконец можем избавиться от чрезвычайных мер, необходимых для управления государством в военном положении. Верховный Совет теперь станет верхней палатой нового парламента, а доверенные грифоны будут объявлены советниками в правительстве."
POM_worthy_successor:0 "Достойный наследник"
POM_worthy_successor_desc:0 "Главнокомандующий Камриз решил уйти в отставку как де-факто правитель Помоварры, и вместо него Верховный Совет назначил Морвана Ренана как первого Президента Республики Помоварра."
POM_extend_citizenship_in_greifwald:0 "Гражданство для грайфвальдцев"
POM_extend_citizenship_in_greifwald_desc:0 "Чтобы нам было легче управлять северными территориями, мы наделим грайфвальдцев полными правами граждан Помоварры, делая их нацию второй опорой под основанием нашей страны."
POM_northern_claims:0 "Северные притязания"
POM_northern_claims_desc:0 "Грайфенмаршен и Фезера тесно исторически и культурно связаны с Грайфвальдом и Помоваррой. Мы объявим свой интерес в этих областях."
POM_war_for_herzland:0 "Защитить западный фланг"
POM_war_for_herzland_desc:0 "Так называемые Свободные города – лишь марионетки властных олигархов, чья единственная цель – выжимать деньги из своих собратьев. Несмотря на то, что наши притязания на эти земли почти никак не подкреплены, их стратегическое значение неоценимо, и наша цель справедлива."
POM_create_PFOC:0 "Совместное нефтяное предприятие"
POM_create_PFOC_desc:0 "Под границей между нами и фетизскими союзниками пролегает богатейший нефтяной бассейн во всей Грифонии. Нам следует собраться с нашими новыми союзниками и сформировать Помоварро-Фетизский Нефтяной Картель для максимально эффективной и взаимно полезной добычи нефти."
POM_griffon_prosperity:0 "Помоваррское процветание"
POM_griffon_prosperity_desc:0 "Каждый грифон имеет право пользоваться богатством нашей страны. Для обеспечения постоянного роста нашей экономики мы введем серию законов, поддерживающих рост населения, одним из которых станет основание качественной системы социального обеспечения."
POM_unify_the_nation:0 "Объединить нацию"
POM_unify_the_nation_desc:0 "Нация должна быть едина – связанная общим языком, историей и предназначением. Продолжая государственную поддержку культурных программ, мы укрепим связи между нашими грифонами."
POM_loyalty_to_the_state:0 "Преданность стране"
POM_loyalty_to_the_state_desc:0 "Без семьи, нации и патриотизма, грифон – бесцельное, жалкое существо. Пока помоваррское государство заботится о своих грифонах, они должны быть готовы отстаивать его существование."
POM_status_of_free_cities:0 "Положение свободных городов"
POM_status_of_free_cities_desc:0 "Со всеми бывшими Свободными городами в Западной Грифонии под нашим контролем, нам предстоит принять решение об их судьбе."
POM_set_new_borders:0 "Прочертить новые границы"
POM_set_new_borders_desc:0 "С окончанием герцландской кампании пришло время чертить новые границы в регионе. Помоварра и Фетизия будут править Центральной Грифонией вместе!"
POM_break_of_dawn:0 "Восход солнца"
POM_break_of_dawn_desc:0 "На востоке наши румейрские братья, под гнетом грифонстоунцев изгнанные на острова, попали в ту же ситуацию, в которой были мы. Нам следует поддержать их и предложить им стать нашими союзниками."
POM_pact_military_manoeuvres:0 "Совместные военные маневры"
POM_pact_military_manoeuvres_desc:0 "Фетизские советники предоставили нам полезнейшую помощь ранее. Но нам явно есть еще чему научиться у них о формировании стандартизированной армии, в то время как им было бы полезно получить наши знания о партизанской войне."

POM_rogue_prince:0 "Князь-изгой"
POM_rogue_prince_desc:0 "По словам большинства Леопольд Райхер – бесчестный вояка и предатель... Раз так, он покажет всему миру, что он величайший вояка в Грифонии – если не поймает пулю по пути."
POM_procure_guns:0 "«Добыть» оружие"
POM_procure_guns_desc:0 "Связи Шатенцана с контрабандистами позволят нам заполучить необходимое вооружение. Из-за фловенской блокады на нашем основном пути торговли, наши логистические возможности ограничены до малых поставок... И конечно, за каждую пушку придется чем-то заплатить."
POM_hunt_down_remnants:0 "Прикончить повстанцев"
POM_hunt_down_remnants_desc:0 "Хотя мы сломили основные силы повстанцев, многие меньшие группы остались на свободе. Мы проведем обширную антитеррористическую операцию, чтобы избавиться от них."
POM_scavenge_steelworks:0 "Утилизировать литейни"
POM_scavenge_steelworks_desc:0 "Многие промышленные предприятия в Помоварре потерпели непоправимый ущерб за последние годы. Наверно, стоит разобрать часть из них и использовать утиль для починки менее пострадавшей промышленности."
POM_raid_westkeep:0 "Рейд на Весткип"
POM_raid_westkeep_desc:0 "Грядет революция, и Аквелия все глубже погружается в хаос. Их армия больше занята внутренними разборками, чем охраной границ – это представляет уникальную возможность для нас."
POM_intensify_drills:0 "Усилить учения"
POM_intensify_drills_desc:0 "В отличие от других грифонских «вояк», Райхер не позволил своим солдатам разнежиться и превратиться в бандитов. Несмотря на это, им пойдет на пользу дополнительные боевые учения, чтобы в критический момент они точно были готовы к битве."
POM_soldiers_of_fortune:0 "Солдаты удачи"
POM_soldiers_of_fortune_desc:0 "У нас нехватка кадров, а набирать рекрутов из местных нельзя – к ним нет никакого доверия. У этой проблемы одно решение – наемники!"
POM_one_bad_flower:0 "Один плохой цветок"
POM_one_bad_flower_desc:0 "Борба за власть во Фловене бескровна, но жестока. Некоторых это привело к полной потере влияния – и они жаждут мести."
POM_collect_scraps:0 "Собрать остатки"
POM_collect_scraps_desc:0 "Из Помоварры уже выжаты почти все соки, но сейчас под счет идет каждая капля."
POM_gather_staff:0 "Созвать военачальников"
POM_gather_staff_desc:0 "Пора готовиться к наступлению на Фловену. Мы объявим общий сбор старших офицеров и попробуем подготовить план."
POM_preliminary_bomb:0 "Предварительный обстрел"
POM_preliminary_bomb_desc:0 "Пока пехота готовится к атаке, артиллеристы немножко размягчат фловенские укрепления, целясь по основным военным целям в городе."
POM_operation_cauliflower:0 "Операция «Капуста»"
POM_operation_cauliflower_desc:0 "Патриции Фловены чересчур положились на мягкую силу для защиты своего чудесного городка. Но войны выигрывает не золото, а сталь. Мы ударим быстро и точно – и присвоим все их золотые запасы!"
POM_garden_party:0 "Вечеринка в саду"
POM_garden_party_desc:0 "Это было проще, чем отобрать у птенца воздушный шарик! Фловена наша! Готовимся к переезду и отправляемся вкушать плоды победы!"
POM_expand_black_market:0 "Расширить закупки на чёрном рынке"
POM_expand_black_market_desc:0 "Захват Фловены значительно упрощает нашу логистику, а вместе с тем, и наши возможности по добыче военного снаряжения лучшего качества и в больших количествах."
POM_create_research_bureau:0 "Основать исследовательское бюро"
POM_create_research_bureau_desc:0 "Наших пушек должно быть не только много – они также должны быть высокотехнологичными. К счастью, в Грифонии полно инженеров, которые с удовольствием помогут нам с этим в обмен на высокую зарплату."
POM_buy_blueprints:0 "Достать чертежи"
POM_buy_blueprints_desc:0 "Мы не стали интересоваться у поставщиков, где и как они получили эти чертежи, а они не стали спрашивать, откуда у нас деньги."
POM_standard_artillery:0 "Стандартизировать артиллерию"
POM_standard_artillery_desc:0 "Мы использовали все орудия, до каких дотянулись наши лапы, что со временем аукнулось необходимостью добычи множества различных запчастей и снарядов для них. Благо, наши новообретенные промышленные мощности позволяют переоборудовать артиллерийский арсенал."
POM_scavenge_flowena_airport:0 "Ободрать фловенский аэродром"
POM_scavenge_flowena_airport_desc:0 "В ангарах местного аэродрома хранятся самолеты, которые бы нам пригодились. А еще было бы полезно «уговорить» их пилотов присоединиться к нашей армии. По правде, у них нет выбора – теперь мы единственные, кто готов им платить."
POM_more_shining:0 "Больше блестящих рыцарей"
POM_more_shining_desc:0 "У наших рыцарей ни благородства, ни галантности, но бойцы они отменные. Надо бы их снарядить как следует, чтобы они стали еще смертоноснее."
POM_borrow_tank:0 "«Одолжить» чертежи танков"
POM_borrow_tank_desc:0 "В том, что кто-то так плохо охраняет такие драгоценные знания, нет нашей вины. Скажем «спасибо» их безрассудству – и низким зарплатам – потому что с этой добычей процесс разработки наших первых танков значительно ускорится."
POM_improve_aux:0 "Оснастить вспомогательные войска"
POM_improve_aux_desc:0 "В чем разница между нашей армией и бандитами – помимо униформы, конечно? Во-первых, наши солдаты грабят только по приказу, а во-вторых, у нас налаженная логистика и полный набор вспомогательных войск."
POM_keep_bureaucracy:0 "Бюрократия по-старому"
POM_keep_bureaucracy_desc:0 "Как править городом типа Фловены? Легко! Пусть это делают фловенцы, прямо как раньше. Только теперь они будут нести ответственность перед нами, а не мэром. Это гениальное решение сбросит с наших плеч гору работы."
POM_tax_policy:0 "Налоговая политика"
POM_tax_policy_desc:0 "У нас действительно она будет. Мы больше не будем просто отправлять отряды солдат собирать все, что нам нужно на данный момент. Очевидно, что эта новая модель будет гораздо более надёжной."
POM_foreign_capital:0 "Подтянуть внешние инвестиции"
POM_foreign_capital_desc:0 "Мы продадим промышленные предприятия, ранее принадлежавшие патрициям, иностранным «инвесторам». Они обеспечат беспрерывную работу фабрик и предоставят нам необходимые денежные средства."
POM_remove_regulations:0 "Убрать ограничения"
POM_remove_regulations_desc:0 "Избавляясь от различных законов, делающих ведение бизнеса в других уголках Грифонии трудным, мы значительно ускорим рост нашей экономики – так посоветовал Блоеталь."
POM_hire_engineers:0 "Наёмные инженеры"
POM_hire_engineers_desc:0 "Они такие умные птицы, разве нет? Очевидно, дела идут много глаже, когда они помогают решать наши проблемы – за приличную плату."
POM_expand_flowena_foundry:0 "Расширить кузни Фловены"
POM_expand_flowena_foundry_desc:0 "Расширение фловенских предприятий металлообработки позволит значительно повысить производство военного снаряжения."
POM_functional_economy:0 "Действующая экономика"
POM_functional_economy_desc:0 "Она работает! Действительно работает! В обозримом будущем мы не рискуем истратить запасы снарядов, и наше правительство в целом выглядит надежным. На большее рассчитывать не приходится, но ничего другого нам и не нужно. Все равно мы здесь не задержимся."
POM_divert_funds:0 "Выделить средства для промышленности"
POM_divert_funds_desc:0 "Как говорится, чтобы вынуть, нужно сначала вставить. С экономикой то же самое. Мы закупим побольше продвинутых устройств для наращивания промышленных мощностей."
POM_moving_in:0 "Переезд"
POM_moving_in_desc:0 "Для переноса штаб-квартиры во Фловену много причин: она богаче Помазона, не каждый ее житель желает нам смерти, и размеры города позволят нам легко разместить и прокормить нашу растущую армию."
POM_flowenian_recruits:0 "Фловенские новобранцы"
POM_flowenian_recruits_desc:0 "Фловена располагает большими возможностями для набора военных кадров. Фловенцы настроены более лояльно к нам, нежели помоварцы. Похоже, что мы даже можем доверить им оружие!"
POM_hostile_takeover:0 "Враждебный захват"
POM_hostile_takeover_desc:0 "Де Блоеталь сдержал обещание: он перевернул город вверх дном – и образно, и буквально. Все скрытые сокровищницы разграблены, все акции и ценные бумаги ликвидированы в сияющие золотые идолы. Истинные богатства Фловены теперь наши."
POM_operation_lumberjack:0 "Операция «Лесоруб»"
POM_operation_lumberjack_desc:0 "Захват Грайфвальда позволит нам добыть больше военных припасов и наконец обзавестись надежным источником топлива из богатого нефтяного бассейна."
POM_strength_in_numbers:0 "Сила в количестве"
POM_strength_in_numbers_desc:0 "Нам нужно взять в армию как можно больше местных грифонов. Мы не соберем достаточно войск для битвы с Аквелией, опираясь исключительно на ветеранов и иностранных наемников."
POM_elite_army:0 "Элитная армия"
POM_elite_army_desc:0 "Вместо призыва ненадежных гражданских мы выделим больше средств на качественное снабжение уже имеющихся войск, превращая их в самую элитную армию в Западной Грифонии!"
POM_operation_midnight:0 "Операция «Полночь»"
POM_operation_midnight_desc:0 "Если мы победим, по нашей кампании, одном из величайших стратегических достижений в истории, до конца времен будут учить кадетов. И конечно, мы станем невероятно богатыми, разграбив Аквелию после... Но если мы потерпим поражение, нас не пощадят."
POM_bounty_of_greifwald:0 "Грайфвальдские трофеи"
POM_bounty_of_greifwald_desc:0 "Это последняя возможность пополнения наших сил до финальной схватки. Так лишим Грайфвальд всех ресурсов и подготовимся к решающему бою!"
POM_encourage_officer:0 "Поощрить офицерскую инициативность"
POM_encourage_officer_desc:0 "Позволяя офицерам преследовать устанавливаемые генералами задачи, мы серьезно повысим оперативную гибкость нашей армии."
POM_shorten_supply_chains:0 "Укоротить линии снабжения"
POM_shorten_supply_chains_desc:0 "Наши солдаты знают, как грабить и – что много важнее – знают, что именно нужно награбить, чтобы продолжать воевать. Это их качество позволяет ослабить нагрузку на логистику."
POM_maneuver_war:0 "Маневренная война"
POM_maneuver_war_desc:0 "Вместо сражения с численно превосходящим противником лицом к лицу, мы будем стараться переманеврировать его войска и уничтожать изолированные подразделения по одному."
POM_price_of_a_nation:0 "Стоимость страны"
POM_price_of_a_nation_desc:0 "Аквила наша! А с ней и сокровища аквелийской нации. Доверенные грифоны уже собирают золото, добытое в ходе наших прошлых кампаний, пока выжимаем все доступное из этой окровавленной земли и готовимся к ранней отставке."
POM_friends_in_fezara:0 "Друзья в Фезере"
POM_friends_in_fezara_desc:0 "О, Фезера, город возможностей... Хайнрих Шатенцан связался с правителями города и дал им предложение, от которого практически невозможно отказаться."

POM_needs_of_the_revolution:0 "Нужды Революции"
POM_needs_of_the_revolution_desc:0 "Наша экономика должны быть перестроена для лучшего обслуживания государственных нужд. Некоторые назовут наши планы радикальными, но они необходимы для подготовки к предстоящей борьбе."
POM_reconstruciton_brigades:0 "Восстановительные бригады"
POM_reconstruciton_brigades_desc:0 "Число узников растет ежедневно – среди них захваченные солдаты, реакционеры, диссиденты. Все они заплатят за свои преступления трудом на восстановление страны – при минимальных затратах, естественно! Те, кто выживут, получат право на переобучение."
POM_nationalise_the_industry:0 "Национализировать промышленность"
POM_nationalise_the_industry_desc:0 "Заполучение средств производства – это важнейший элемент каждой коммунистической революции, и хорошее начало для наших реформ. Жизнь каждого становится лучше, когда промышленность служит государству, а не каким-то буржуям."
POM_purge_the_academia:0 "Очистить академию"
POM_purge_the_academia_desc:0 "Хотя многие академики поддерживают наше дело, некоторые придерживаются либеральной политики и осуждают наши необходимые действия. Таких грифонов нужно убрать из университетов, чтобы они не превращали студентов в капиталистичных дегенератов."
POM_socialist_austerity:0 "Социалистическая аскетичность"
POM_socialist_austerity_desc:0 "Труженикам Коммуны нельзя отравлять свой дух и тело вольностями и роскошью. Они должны полностью отдавать себя труду на благо государство и товарищей! Мы жестко ограничим доступ к алкоголю, табаку и прочим наркотикам, чтобы граждане не отвлекались от революционных работ."
POM_land_collectivisation:0 "Коллективизация земли"
POM_land_collectivisation_desc:0 "Все излишние частные владения будут коллективизированы для государственного пользования, а самостоятельные фермеры будут организованы в сельскохозяйственные кооперативы, чтобы не допустить возникновение буржуазии в селах."
POM_revolutionary_education:0 "Образование и пропаганда"
POM_revolutionary_education_desc:0 "Молодежь – будущее нации. Поэтому мы должны быть уверены, что они переняли идеологию революции. Обязательное образование и участие в мероприятиях Лиги Юных Коммунистов гарантирует, что будущие поколения продолжат нашу работу, когда нас не станет."
POM_retool_the_economy:0 "Переоборудовать предприятия"
POM_retool_the_economy_desc:0 "Производство достигло довоенных показателей, и наши планировщики определили амбициозный план быстрого расширения промышленных мощностей для выполнения задач революционного проекта."
POM_redemption_camps:0 "Лагеря искупления"
POM_redemption_camps_desc:0 "Хотя некоторых реакционеров не спасет ничто, кроме пули, многие другие еще могут встать на верный путь и искупить свои грехи через тяжкий труд на стройках, лесоповалах и в шахтах. Быть может, лет через 10–20 их можно будет считать достаточно переобученными для работы на коммунальных фермах!"
POM_living_standards:0 "Уравнять стандарты жизни"
POM_living_standards_desc:0 "Работу каждому грифону! А ему взамен, жизненное обеспечение. Распределять ресурсы нелегко, но государство полностью способно дать каждому грифону все необходимое, чтобы он был продуктивным членом общества."
POM_industrial_combines:0 "Промышленные комбинаты"
POM_industrial_combines_desc:0 "Некоторые отстающие от плана фабрики можно преобразовать и собрать с другими в кооперативы. Это поможет им выполнять наши разумные квоты."
POM_industrial_planning:0 "Планирование развития"
POM_industrial_planning_desc:0 "Каждый Годовой план будет сфокусирован на развитии определенной сферы экономики Коммуны – например, металлургии или легкой химии. Так мы быстро расширим производство в разных областях."
POM_autarkic_revolution:0 "Революция на самообеспечении"
POM_autarkic_revolution_desc:0 "Зависимость от внешней торговли подрывает основы революции, заставляя нас полагаться на иностранных капиталистов. Все, что нам нужно, должно производиться внутри страны, чтобы враги государства не смогли навредить нашей экономике."
POM_expand_the_mines:0 "Расширить добычу ископаемых"
POM_expand_the_mines_desc:0 "Избыток рабочей силы позволяет нам по максимуму эксплуатировать многочисленные залежи природных ресурсов в Аквелии, чтобы обеспечить экономику всем необходимым."
POM_full_speed_ahead:0 "Сбор урожая"
POM_full_speed_ahead_desc:0 "Экономика Коммуны налажена! Однако, мы не имеем право спотыкаться, шагая вперед. У нас полно врагов и внутри страны, и за ее границами. Чтобы избавиться от них, нам понадобится больше оружия и танков. А чтобы их производить, нам нужно строить больше фабрик."

POM_claw_of_the_revolution:0 "Силы Революции"
POM_claw_of_the_revolution_desc:0 "Армия – первый и главный инструмент Революции, позволяющий распространять и защищать ее от иностранных реакционеров. Сейчас мы должны начать работу над сбором настоящих войск из наших ополченцев, чтобы подготовиться к Великой Революционной Борьбе."
POM_new_general_staff:0 "Красные генералы"
POM_new_general_staff_desc:0 "Как пролетариат направляет партия, так же армией правят офицеры. Конечно, бывшая аквелийская армия полна националистов, на преданность которых не стоит рассчитывать, но мы подобрали достаточно генералов левого толка для новой коммунальной армии."
POM_salvage_aquileian_eq:0 "Собрать остатки аквелийского снаряжения"
POM_salvage_aquileian_eq_desc:0 "В хаосе войны многие арсеналы были брошены, а некоторые боевые подразделения бросили снаряжение и бежали. Мы воспользуемся тем, что сможем восстановить."
POM_decomptage:0 "Система декомптажа"
POM_decomptage_desc:0 "Хотя совместное управление может быть неэффективным в армии, мы введем нечто похожее – Декомптаж. Каждому командиру будет помогать комиссар соответствующего ранга, обеспечивающий должный уровень идеологического рвения среди солдат."
POM_communard_revolutionary_army:0 "Революционная Армия Коммуны"
POM_communard_revolutionary_army_desc:0 "Мы готовы сформировать из отрядов революционеров единую силу. Выявленные среди командиров контрреволюционеры будут казнены, и все ранее независимые формирования станут подразделениями армии."
POM_army_design_bureau:0 "Бюро военного проектирования"
POM_army_design_bureau_desc:0 "Концентрация военных исследований в рамках одной организации наверняка повысит наши возможности в улучшении военных технологий Коммуны."
POM_redemption_brigades:0 "Штрафные бригады"
POM_redemption_brigades_desc:0 "Пока большинство врагов Революции работает в трудовых лагерях, те, кто показывают высокий уровень революционного рвения будут считаться достаточно переобученными для обретения свободы после прохождения службы в штрафных бригадах."
POM_steel_vanguard:0 "Стальной авангард"
POM_steel_vanguard_desc:0 "Танки – будущее боестолкновения, и основание настоящих танковых корпусов – первостепенная задача для нашей армии. Без танков мы не сможем победить реакционеров в Грифонии."
POM_restore_production_lines:0 "Восстановить военное производство"
POM_restore_production_lines_desc:0 "Многочисленные аквелийские военные заводы были уничтожены или заброшены в ходе вторжения Райхера. Восстановление производства на этих предприятиях критически важно для продолжения модернизации и расширения Революционной Коммунальной Армии."
POM_reorganise_communard_airforce:0 "Сформировать ВВС Коммуны"
POM_reorganise_communard_airforce_desc:0 "Современная армия не обходится без воздушных сил. Поэтому мы должны провести работу над формированием этого вида вооруженных сил."
POM_doctrine_of_aggression:0 "Доктрина агрессии"
POM_doctrine_of_aggression_desc:0 "Успех военных кампаний Райхера преподал миру урок: дерзкие побеждают. Достаточно высокая скорость маневра и уровень агрессии могут сокрушить и численно превосходящего противника."
POM_red_ocean:0 "Красный океан"
POM_red_ocean_desc:0 "Распространение Революции по всему миру – это наша конечная цель. Для этого нам потребуется контролировать океаны с помощью великого Красного Флота."
POM_victory_or_death:0 "Победа или смерть"
POM_victory_or_death_desc:0 "Нет смысла жить, если Революция потерпит поражение. Каждый солдат Коммуны должен быть готов отдать себя в жертву во имя коммунистического будущего!"
POM_steal_the_fire:0 "Украсть огонь богов"
POM_steal_the_fire_desc:0 "Красота взрыва атомной бомбы – величайшее достижение грифоньей военной науки и доказательство того, что современные смертные сравнялись по силе с так называемыми богами. Когда мы обуздаем атом, мы станем воистину неостановимы."
POM_new_ecole_militaire:0 "Новая военная академия"
POM_new_ecole_militaire_desc:0 "Нам нужно настоящее образовательное учреждение для подготовки новых поколений офицеров, свободных от реакционной порчи и готовых служить Революции на фронтах освободительной войны до самого конца."

POM_captain_takes_the_helm:0 "Капитан за штурвалом"
POM_captain_takes_the_helm_desc:0 "Хаос предоставляет уникальные возможности. Без политических конкурентов, сующих палки в колеса, Виктор Аллард готов преследовать свои цели, не беспокоясь о необходимости договариваться с умеренными социалистами, оттягивающими момент наступления коммунистической революции."
POM_galvanise_the_pop:0 "Агитировать население"
POM_galvanise_the_pop_desc:0 "Грифоны должны знать, кто виноват в наступлении нынешней ситуации: либералы, предатели и реакционеры! Грифоны должны знать, как с ними бороться: лапами, оружием и с решимостью!"
POM_defeat_warlords:0 "Победить боевиков"
POM_defeat_warlords_desc:0 "С исходом командира наемная армия Райхера развалилась на десятки грабительских банд. С ними легко разбираться поодиночке, но они разбрелись по всей стране в поисках наживы. Так или иначе, мы должны убрать их, чтобы восстановить порядок."
POM_convene_the_committee:0 "Созвать Комитет"
POM_convene_the_committee_desc:0 "Теперь с постепенным возвращением порядка в Аквелии, подняли головы трусы и предатели, требующие, чтобы их представители вошли в Комитет Общественной Безопасности. Как фермер, рвущий сорняки из грядки, мы будем избавляться от этих нежелательных элементов в нашем правительстве, чтобы события прошедших месяцев не повторились никогда."
POM_reactionary_trials:0 "Суд над реакционерами"
POM_reactionary_trials_desc:0 "«Козлы отпущения» – это так уродливо... Лучше называть их «целями праведного народного гнева». Без сомнения, все они виновны. Остается лишь выяснить, в чем, – и как именно мы их накажем."
POM_revolutionary_zeal:0 "Революционное рвение"
POM_revolutionary_zeal_desc:0 "Задача, стоящая перед нами огромна: перестройка нашего общества и освобождение Грифонии, а затем всего мира. Чтобы выполнить ее, вся Аквелия должна стремиться к одной цели: победе в революционной войне на всех фронтах. Для достижения единства все каналы СМИ станут подчинены государству и будут вещать о нашем деле."
POM_terror_as_order:0 "Террор в порядке вещей"
POM_terror_as_order_desc:0 "Наше общество кишит вредителями – от низших слоев к высшим. Вельможи, реакционеры, капиталисты и предатели – от них всех нужно избавиться. В охоте и уничтожении их не может быть послаблений. Иначе, они сговорятся действовать против Коммуны и саботируют нашу Революцию!"
POM_centralise_authority:0 "Централизовать власть"
POM_centralise_authority_desc:0 "В любой успешной организации есть иерархия. Иначе получается толпа. Толпой ведут низменные инстинкты, и она не сможет достичь никакой цели и взрастить достойное общество. Поэтому мы уберем автономию местных властей и подчиним партию Комитету Общественной Безопасности и его лидеру, проявляющему свою волю через министров."
POM_glory_of_war:0 "Военная слава"
POM_glory_of_war_desc:0 "Каждый гражданин Коммуны обязан сражаться и умереть за нее. Быть солдатом – величайшая честь для каждого. Поскольку триумф Революции неизбежен, вопрос лишь в том, когда он произойдет – и грифоны Коммуны должны постараться, чтобы ускорить процесс."
POM_master_destiny:0 "Хозяева своей судьбы"
POM_master_destiny_desc:0 "Смертные будут единственными, кто определяет свое будущее и правит миром. Если мы хотим достичь настоящего освобождения, не может быть никакой власти выше государства. Граждане Коммуны не имеют права подчиняться каким-либо богам – или грифонам, выдающим себя за их посланников!"
POM_control_the_past:0 "Контролировать прошлое
POM_control_the_past_desc:0 "Каждым из нас руководит прошлый опыт, сформированный нашим окружением и, в большем отдалении, нашим обществом, нацией и историей. Для создания действительно новой страны, нам нужны новые жители. А чтобы создать их, мы должны уничтожить память о прошлом, чтобы она не затмевала их сознание."
POM_enemies_within:0 "Предатели внутри"
POM_enemies_within_desc:0 "Несмотря на наши усилия, грифоны, противостоящие неотвратимому триумфу Революции, остаются. Они скрываются среди нас, ожидая возможности для удара. Прикидываясь лояльными гражданами, они наводят смуту и закладывают идеи восстания в головы недовольных жителей недавно присоединённых территорий."
POM_enemies_without:0 "Враги снаружи"
POM_enemies_without_desc:0 "Наши враги многочисленны, и мы вынуждены использовать все доступные способы противодействия им. С помощью диверсий и шпионажа мы ослабим реакционные режимы и сделаем их легкими целями для наших освободительных армий."
POM_cult_of_the_revolution:0 "Культ Революции"
POM_cult_of_the_revolution_desc:0 "Революция – историческая неизбежность, кульминация тысячелетий философского, общественного и политического развития, наступление новой эпохи. Будет вполне естественно заложить добродетели Революции в фундамент нашего перестроенного общества."
POM_le_patron:0 "Покровитель Революции"
POM_le_patron_desc:0 "Нет другого грифона, служащего лучшим образчиком добродетелей Революции как наш лидер Виктор Аллард. Он больше чем политик, он визионер, изменяющий реальность, разрушающий гнилое прошлое и строящий светлое будущее. Он – Покровитель и Лидер Революции, Лидер Коммуны. Он приведет нас к победе!"
POM_liberators_of_the_world:0 "Освободители мира"
POM_liberators_of_the_world_desc:0 "Революция не может проводиться в одной стране. Ее конечная цель – освобождение всего мира. Мы будем сражаться на каждом континенте и уничтожим все реакционные режимы, пока мир не объединится под флагом Единой Коммуны."
POM_liberate_herzland:0 "Спасти Герцланд"
POM_liberate_herzland_desc:0 "Империалисты грызутся за гниющий труп, некогда бывший их родиной, веря, что они снова смогут укротить всю Грифонию. Нам нужно действовать быстро и решительно, пока они не собрали силы для нападения. Мы атакуем первыми и застигнем их врасплох!"
POM_topple_oligarchs:0 "Свергнуть олигархов Скайфола"
POM_topple_oligarchs_desc:0 "«Свободные Города Грифонии» – ничто иное как трудовые лагеря, с олигархами в роли надсмотрщиков и пролетариев в роли узников. Наш долг – освободить бедствующих товарищей."
POM_red_rumare:0 "Красный Румейр"
POM_red_rumare_desc:0 "Водоем Румейра имеет критическое стратегическое значение для предстоящих военных операций. Мы должны взять его под контроль как можно скорее."
POM_destroy_imperial_vestiges:0 "Уничтожить пережитки Империи"
POM_destroy_imperial_vestiges_desc:0 "Для установления полного контроля над Герцландом, мы должны удостовериться, что все остатки имперского режима уничтожены. Сделав это, мы докажем, что эпоха Грифонской Империи прошла – и эпоха Грифонской Коммуны началась."
POM_strike_karthinia:0 "Захватить Карфинию"
POM_strike_karthinia_desc:0 "Южная Грифония – земля старых упадочных цивилизаций, давно переживших время расцвета. Один пинок – и эти государства развалятся как храмы их предков. Так мы принесем свободу нашим южным братьям и сестрам."
POM_light_the_pyre:0 "Разжечь погребальный костер"
POM_light_the_pyre_desc:0 "Возможно, это величайшая победа нашей Революции. Воистину символический момент, который будет высечен в камне истории и разрежет символическую пуповину, связывающую грифонов с их прошлым. Грифоний род больше никогда не вернется в свою колыбель!"
POM_into_evi_valley:0 "В Долину Эви"
POM_into_evi_valley_desc:0 "Освобождение континента происходит быстро. Наша следующая цель – Долина Эви. Разделенные реакционные режимы в регионе никак не смогут противостоять славным армиям Коммуны."
POM_northern_liberation:0 "Освобождение Севера"
POM_northern_liberation_desc:0 "В Северной Грифонии господствуют провалившие свое дело «республиканцы», реакционные князьки и пони-варвары. Мы ликвидируем все их жалкие государства и объединим местных под правлением Коммуны!"
POM_humble_the_south:0 "Усмирить Юг"
POM_humble_the_south_desc:0 "После нашей победы над южными воеводами пришло время полноценно включить регион в Коммуну. Конечно, мы ожидаем некоторый уровень сопротивления от упертых южан, но мы справлялись и с врагами посильнее."
POM_pacify_the_valley:0 "Усмирить долину"
POM_pacify_the_valley_desc:0 "Прогнивших грифонов Долины Эви разделяют серьезные культурные и религиозные противоречия, что делает весь регион неуправляемым. Несмотря на это, мы сделаем попытку цивилизовать их и превратить в настоящих коммунистов!"
POM_red_sun_rises:0 "Восход красного солнца"
POM_red_sun_rises_desc:0 "Нечто волшебное происходит в Восточной Грифонии: феодалы, псевдореспубликанцы и рабовладельцы живут в полной гармонии, совместно удерживая местных в оковах эксплуатации и невежестве. Мы пройдем маршем по Речным Землям, пока против нас не останется лишь океан!"
POM_establish_northern_workcamps:0 "Основать северные трудовые лагеря"
POM_establish_northern_workcamps_desc:0 "У северных гор есть много положительных характеристик. Они далеки, изолированы, обладают тяжким климатом и богаты полезными ископаемыми. В связи с этим, среди них идеально расположатся трудовые лагеря для особо опасных реакционеров."
POM_intercontinental_campaigns:0 "Межконтинентальные кампании"
POM_intercontinental_campaigns_desc:0 "Теперь наша работа может действительно начаться. После освобождения Грифонии пришел черед остальных континентов. Конечно, для успешного вторжения потребуется кропотливая подготовка... Но упадочные реакционные режимы Эквуса и Зебрики наверняка не сравнятся с нашими закаленными боями армиями!"
POM_death_of_allard:0 "Смерть Алларда"
POM_death_of_allard_desc:0 "Проведя у власти лишь несколько лет, аквелийский диктатор Виктор Аллард внезапно умирает. Наступает время борьбы за власть между членами Комитета общественной безопасности."
POM_commemorate_our_leader:0 "Почтить память покровителя"
POM_commemorate_our_leader_desc:0 "Наш славный предводитель трагически погиб, но даже будучи мёртвым, он может послужить Коммуне. Он мощный символ нашего режима, и мы сделаем так, чтобы каждое существо знало его идеи и служило им... вернее, те версии его идей, которые мы опубликуем."
POM_purge_allardists:0 "Изгнать аллардистов"
POM_purge_allardists_desc:0 "Большинство бюрократов и военных подчинятся нам сами, но есть некоторые властные грифоны, чьи мозги слишком промыты, чтобы отступить от видения Алларда. Мы тихо избавимся от них и подавим всех, кто подвергнет сомнению наши решения."
POM_reassess_sentences:0 "Переоценить наказания"
POM_reassess_sentences_desc:0 "Лагеря искупления полезны, но переполнены заключёнными, которые мотают сроки по самым невероятным причинам. Разумеется, мы не выпустим на свободу настоящих контрреволюционеров и врагов народа, но чтобы снизить нагрузку на тюремную систему и создать ощущение “примирения”, мы помилуем тех, кого осудили за мелкие нарушения (тех из них, кто ещё жив)."
POM_retreat_from_the_riverlands:0 "Отступить из Речноземья"
POM_retreat_from_the_riverlands_desc:0 "Военная кампания в Речных Землях была дорогой ошибкой. Оказалось, что речные пони разбираются в партизанской войне даже лучше помоварцев! Пытаясь навести порядок там, мы ежедневно теряем десятки солдат. Лучше будет передать контроль над этими территориями местным коммунистам. Пусть разбираются с этой катастрофой сами!"
POM_revolution_on_one_continent:0 "Революция на одном континенте"
POM_revolution_on_one_continent_desc:0 "Когда-нибудь Революция охватит весь мир. Но пока что мы будем довольствоваться победой в Грифонии и приложим свои усилия к укреплению хватки в ней. Планы межконтинентальных войн отложены в долгий ящик, но мы продолжим очернять каких-то отдалённых врагов, чтобы наше население сохраняло бдительность и революционный пыл!"
POM_end_cultural_policies:0 "Остановить культурную политику"
POM_end_cultural_policies_desc:0 "Хотя некоторые группы населения Коммуны реакционны по своей природе, преследование всех видов религиозных фанатиков и националистов без разбора отнимает значительную долю наших сил, которые лучше применить в отдалённых уголках континента. Мы закончим культурную политику Алларда, в особенности, по отношению к самой революционно настроенному народу из всех: аквелийцам."
POM_share_the_spoils:0 "Раздел добычи"
POM_share_the_spoils_desc:0 "Армия доказала свою эффективность в недавнем “переходе власти”, но теперь военные требуют права голоса в правительстве. Того же хотят и партийные деятели, оставшиеся без какого-либо влияния над Комитетом – в котором недавно освободилось множество мест... Представительство всех заинтересованных групп в Комитете позволит избежать внутренних распрей на политической арене."

### News Events ###
goy_pomovarra_news.1.t:0 "Третья аквелийская революция
goy_pomovarra_news.1.d:0 "[This.GetNewspaperHeader]Западная Грифония вновь пала в хаос. Захватив Аквелию, «Князь-полковник» Леопольд Райхер внезапно исчез – вместе с несколькими аквелийскими военными кораблями, его офицерами и всем награбленным богатством. Оставшиеся без командиров наемники разделились на разбойничьи банды и не смогли сдержать новую аквелийскую революцию; коммунистическое восстание под предводительством известного радикала Виктора Алларда. На разоренной земле Аквелии продолжаются бои, но Аллард уже объявил основание нового государства, «Аквелийской Коммуны» и обнародовал свои планы по установлению коммунистического порядка во всей Грифонии. Неясно, доживет ли его режим до их исполнения, или соседние страны воспользуются шансом добить критически ослабленную Аквелию."
goy_pomovarra_news.1.a:0 "Слава Революции!"
goy_pomovarra_news.1.b:0 "Безумие!"
goy_pomovarra_news.1.c:0 "Третий раз – удачный?"

goy_pomovarra_news.2.t:0 "Виктор Аллард найден мёртвым"
goy_pomovarra_news.2.d:0 "[This.GetNewspaperHeader]Неожиданно умер Виктор Аллард, печально известный аквелийский коммунист, и с недавних пор предводитель его самоназванной «Грифонской Коммуны», восставшей из пепла разоренной Западной Грифонии и далее захватившей весь континент в ходе варварской военной кампании, в ходе которой грифоны испытали ранее неслыханные зверства и геноцид. Хотя в последнее время редкая новость выходит за пределы Грифонии, эта разошлась по всему миру как пожар. Предположительно, Алларда хватил инфаркт – результат длительной переработки. Комитет Общественной Безопасности заявляет, что дело их бывшего лидера продолжится, но ходят слухи, что некоторые из самых радикальных законов уже отменены, а в политическом руководстве проходят чистки."
goy_pomovarra_news.2.b:0 "Мы оплакиваем предводителя..."
goy_pomovarra_news.2.c:0 "Говорите «инфаркт», да?"

goy_pomovarra_news.3.t:0 "Верховное королевство"
goy_pomovarra_news.3.d:0 "[This.GetNewspaperHeader]Большинство мировых правителей недоумевают от новостей из Грифонии. Помоваррская армия завоевала Герцланд, разбив всех противников. Из Грифенхайма Король Помоварры Оливьер Морель объявил о развале Грифонской Империи и о создании нового государства – Верховного Королевства Помоварры. Его неофеодальный режим становится все более нетерпимым по отношению к внешнему миру. Международные договоры разрываются, проходят чистки среди «испорченных» групп населения и продолжается масштабная милитаризация. По крупицам информации, исходящим из страны, можно судить, что Верховный Король планирует новые войны, ведущие к полному объединению грифонов на континенте."
goy_pomovarra_news.3.a:0 "Наша победа неотвратима!"
goy_pomovarra_news.3.b:0 "Мы должны готовиться к войне!"
goy_pomovarra_news.3.c:0 "Занятно..."

goy_pomovarra_news.4.t:0 "Помоваррское восстание"
goy_pomovarra_news.4.d:0 "[This.GetNewspaperHeader]После Первой Аквелийской Революции Помоварра впала в смутные времена – сначала захваченная местными повстанцами, позже захваченная экс-имперским воеводой полковником Райхером, объявившим себя Князем Помоварры. Сегодня, спустя 27 лет правления, его режим рухнул. Помоварцы наконец одержали верх над гарнизоном Райхера, а он сам, по слухам, пал в ходе решающего сражения. Выжившие члены его армии бежали из Помоварры, оставив ее под контролем местных борцов за свободу, известных за ярую националистическую реторику и ненависть к Фловене и Аквелии. Эти изменения скорее всего приведут к продолжению военных конфликтов в регионе."
goy_pomovarra_news.4.a:0 "Мы свободны!"
goy_pomovarra_news.4.b:0 "Тревожные новости..."
goy_pomovarra_news.4.c:0 "Интересно."
goy_pomovarra_news.4.e:0 "Что это значит для нас?"

goy_pomovarra_news.5.t:0 "Весткипская Конференция"
goy_pomovarra_news.5.d:0 "[This.GetNewspaperHeader]Недавно сформированная помоваррским правительство «Лига Аэтии» вступила в переговоры с Аквелийской Республикой. К удивлению многих – в том числе и жителей этих стран – помоварцы и аквелийцы, столетиями воевавшие друг с другом, оставили конфликты позади и подписали договор о вступлении Аквелии в альянс. Следующим шагом станет объединение союзнических наций в единое государство. Другие страны Грифонии наблюдают за Аэтией с интересом и озабоченностью, неуверенные в том, какое влияние она окажет на действующий баланс сил на континенте."
goy_pomovarra_news.5.a:0 "Вместе в лучшее будущее!"
goy_pomovarra_news.5.b:0 "Они все предатели!"
goy_pomovarra_news.5.c:0 "Мир на западе? Невозможно!"
goy_pomovarra_news.5.e:0 "Удивительно..."

goy_pomovarra_news.6.t:0 "Аэтская Конфедерация"
goy_pomovarra_news.6.d:0 "[This.GetNewspaperHeader]Взгляды всей Грифонии обращены на запад, где Харман Камриз, бывший командир помоваррских партизан, объявил о формальном основании Аэтской Конфедерации. Веками помоварцы вели зверские войны против вторжений Аквелии, но под предводительством Камриза обе нации смогли исправить отношения, символом чего стало создание объединенного государства для всех жителей Западной Грифонии. Камриз также заявил, что он уходит в отставку, и в ближайшую пару месяцев в Аэтии пройдут первые выборы. По всей стране грифоны празднуют начало новой эпохи, которая по их надеждам принесет мир и процветание, в то время как их соседи смотрят наблюдают за событиями с подозрением, что «аэтцы» могут попытаться «освободить» другие нации Грифонии."
goy_pomovarra_news.6.a:0 "Новая эпоха началась!"
goy_pomovarra_news.6.b:0 "Это было неожиданно."
goy_pomovarra_news.6.c:0 "Удачи им!"
goy_pomovarra_news.6.e:0 "Интересно..."

goy_pomovarra_news.7.t:0 "Помоваррская Республика"
goy_pomovarra_news.7.d:0 "[This.GetNewspaperHeader]На диву всей Грифонии, помоваррские повстанцы смогли преодолеть всех их многочисленных врагов на западе. Унизив давних противников в Аквелии и Фловене, Помоварра стала гегемоном в Западной Грифонии. Помоваррский «Главнокомандующий» Харман Камриз объявил основание Помоваррской Республики, приходящей на замену временному военному правительству. Победа Помоварры в войнах со значительно превосходящими ее по силам противниками озадачила многие грифонские государства, и остается неясным, что эта новая республика предпримет в обозримом будущем."
goy_pomovarra_news.7.a:0 "Помоварра навсегда!"
goy_pomovarra_news.7.b:0 "Это было неожиданно."
goy_pomovarra_news.7.c:0 "Интересно..."

goy_pomovarra_news.8.t:0 "Разрушение Грифонстоуна"
goy_pomovarra_news.8.d:0 "[This.GetNewspaperHeader]Все давно знали про воинственный атеизм коммунистического режима Виктора Алларда – так же как и про склонность его армии к зверствам. Однако недавние действия этого государства превзошли самые ужасающие прогнозы. Революционная Армия Коммуны уничтожила древний город Грифонстоун. В радиопередаче Виктор Аллард назвал это преступление «еще одной великой победой Революции, освобождающей грифонов от оков суеверий». Этот акт бессмысленного разрушения осудили почти все мировые лидеры, многие из которых начали задумываться о том, когда коммунисты, объявившие мировую революцию своей целью, пойдут войной на их страны."
goy_pomovarra_news.8.a:0 "Мы уничтожим их всех!"
goy_pomovarra_news.8.b:0 "Варварство!"
goy_pomovarra_news.8.c:0 "Тревожная новость!"

goy_pomovarra_news.9.t:0 "Король Помоварры"
goy_pomovarra_news.9.d:0 "[This.GetNewspaperHeader]Самая ошеломительная новость из Западной Грифонии! Удивив всех, помоварцы сумели победить бывшего гегемона в регионе, Аквелию. И если это не поразительно само по себе, самозванный «Регент» Помовары и бывший боец сопротивления Оливьер Морель объявил себя Королем Помоварры. В то время как легитимисты и аристократы континента осуждают это действие как бесправную узурпацию потерянного титула, принадлежавшего вымершей династии, в Помоварре его встретили с энтузиазмом и националистическим экстазом. Приведя страну к победе над злейшими врагами, Морель обзавелся значительной поддержкой населения и использовал ее для получения абсолютной власти. Остальные правители Грифонии пришли в полное смятение от новостей. Уничтожение Аквелии сместило баланс сил, и для всех остается загадкой, что этот новый западный король собирается делать дальше."
goy_pomovarra_news.9.a:0 "Веди нас!"
goy_pomovarra_news.9.b:0 "Как так вышло?!"
goy_pomovarra_news.9.c:0 "Это было странно!"

goy_pomovarra_news.10.t:0 "Возращение боевика"
goy_pomovarra_news.10.d:0 "[This.GetNewspaperHeader]Мир наблюдает за Грифонией в шоке и недоумении. Вскоре после захвата Аквелии печально известным Князем-полковником Райхером, измученная нация пала под тираническую власть Виктора Алларда. Новое социалистическое государство вскоре объявило поход против капиталистов – с островами Ле Меридьен, бывшей колонией Аквелии, как одной из целей. Но коммунисты просчитались. У безобидного тропического рая оказался мощный, хоть и не всегда трезвый, защитник. Командующий разношерстной армией из местных призывников и иностранных наемников полковник-в-отставке Райхер не только смог отбросить вторгнувшуюся армию, но провел контратаку, захватив Аквелию во второй раз в жизни. Пока мировые правители пытаются осмыслить произошедшее, не описываемое иначе как изощренная шутка божеств, победоносные Меридьены объявили о созыве нового республиканского правительства освобожденных территорий, а Райхер, заваленный благодарностями и увешанный медалями, вернулся в отставку, чтобы вести свою последнюю войну – против трезвости."
goy_pomovarra_news.10.a:0 "Ура!"
goy_pomovarra_news.10.b:0 "Сейчас не первое апреля?!"

### Events ###
goy_pomovarra.2.t:0 "Вечеринка"
goy_pomovarra.2.d:0 "Традиционно через неделю после празднования Нового года Князь-полковник приглашал своих доверенных командиров на вечеринку в помазонской штаб-квартире. Там гостей ждали лучшие вингбардийские вина, еда от самого именитого шеф-повара, какого можно найти в Помоварре (и довериться, что он не отравит пищу) и музыка от группы по неудаче угодившей в лапы Райхера много лет назад. Приятная возможность для отдыха в эти тяжкие времена. Ветераны многих войн шутили и пили, и каждый новый тост становился все менее внятным. Но сам хозяин сегодня пил удивительно скромно. Он вертел бокал, наблюдая за тем, как красная жидкость омывает стенки. Он думал о прошлом. Двадцать семь лет – именно столько ему было, когда он, самый молодой полковник в истории Рейхсармии, дезертировал и отвоевал для себя Помоварру. Теперь он был вдвое старше. Он провел полжизни здесь – чего ради? Застрявший между Империей и Аквелией, как между молотом и наковальней, отбиваясь от партизан и выжимая последние гроши из этих земель. Продолжится ли это до конца его жизни? Разве он не способен на большее?\nВнезапно комнату сотряс громкий хлопок. Свет потух на секунду, самые пьяные офицеры попадали со стульев, а остальные собрались у окон. Вдали виднелся огонь. Несмоненно, дело рук повстанцев – на этот раз пугающе близко.\nВзгляд Райхера переменился. Он встал и перевернул свой стол, привлекая внимание всех собравшихся. Всем своим видом он источал уверенность.\n«Джентльгрифы. Я думаю, с нас на сегодня достаточно. Я устал от того, что каждый раз когда мы побеждаем партизан, они снова вылезают из ниоткуда. Мы действовали слишком осторожно, слишком успокоились. Пора разобраться с проблемой окончательно и взять от Грифонии большее, чем этот несчастный клочок земли. Мы...» – он сбился, но через секунду его осенило вдохновение – «Мы пройдем маршем по Периферии, а потом захватим Аквилу! Мы станем самыми дерзкими и – когда разграбим город – самыми богатыми грифонами на континенте. Вы пойдете за мной?»"
goy_pomovarra.2.a:0 "«Так точно, командир!»"

goy_pomovarra.3.t:0 "Интересные времена"
goy_pomovarra.3.d:0 "За достаточную плату аквелийца было подкупить легче легкого. Из-за всеобщей ненависти к королю Морисету и разделенности республиканцев на высоких постах было достаточно недовольных птиц, давно наплевавших на преданность государству и теперь беспокоящихся только о деньгах. Полковник Райхер знал о ценности разведки в военных операциях. Тщательно прочитав отчеты своих шпионов, он собрал достаточно кусочков информации, которые теперь сложились в единую картину.\nБлизилась Вторая Революция.\nАквелия была на грани гражданской войны, и революционеры проникли даже в армию и королевские спецслужбы. Оставалось неясным, как ситуация будет развиваться, и кто победит, но одно было известно точно: в течение ближайших месяцев война начнется всерьез. До нее настанут времена полного беспорядка, королевских чисток и республиканского террора. Райхер мог бы воспользоваться этим, используя своих шпионов, чтобы ослабить Аквелию... Если бы он смог разобраться со своими проблемами достаточно быстро."
goy_pomovarra.3.a:0 "Какая прекрасная катастрофа!"

goy_pomovarra.4.t:0 "Преданный пёс"
goy_pomovarra.4.d:0 "Райхер перебирал очередную стопку отчетов, когда ему стало не по себе. Он отвернулся от документов и раскрыл кобуру... Через секунду он убрал лапу от пистолета и выдохнул с облегчением.\n«Хайнрих, не появляйся ты так бесшумно. Тебя же когда-нибудь пристрелят!»\n«Тебе не хватит скорости, чтобы это сделать» – ответил нежданный гость – «Ты стареешь и теряешь хватку. И пьянство вряд ли в помощь». Пес улыбнулся.\n«Рад видеть тебя живым, Леопольд. Обстановка здесь... нестабильная».\n«Нашел кому сказать...» – полковник тяжело вздохнул – «мы здесь как в горящей психушке. Ну что, как прошла командировка? И сядь, пожалуйста. У меня есть бутылочка хорошего вина для тебя...» Райхер достал второй бокал и наполнил его. Хайнрих выпил вино залпом и зажмурился.\n«Прикажи выпороть продавца. Это он выдает за вингбардское?» – он взглянул на этикетку – «На вкус дешевое веренское – еще и разбавленное... Ладно. Вернемся к делу. Как ты приказал, я объездил Скайфол и Герцланд. По слухам, Император скоро отбросит коньки, и к этому готовятся все. Польется кровь, а с ней иностранное оружие завалит черный рынок. Купить пушки будет легче, чем когда-либо, но цены будут высоки – соответственно спросу. Но я договорился со старыми контактами о предпочтительном обслуживании. Нас считают надежными заказчиками, ведь мы всегда платили вовремя. Только дай мне достаточно денег, и я куплю все необходимое».\n«Хорошая работа – как всегда!»\nРайхер ухмыльнулся и тут же указал на бутылку..."
goy_pomovarra.4.a:0 "«Еще по бокалу?»"

goy_pomovarra.5.t:0 "Демонстрация"
goy_pomovarra.5.d:0 "Вдали от больших городов гарнизон контролировал только стратегически важные дороги и немногие промышленные предприятия, считавшиеся жизненно необходимыми. Помимо того, солдаты старались не соваться в «опасные» зоны без прямого приказа. Из-за этого многие регионы по факту принадлежали повстанцам. В них партизаны могли вести себя свободно. Сегодня в маленьком городке под названием Гервйис проходил митинг, показывающий их абсолютную безнаказанность. Сотни граждан, многие с флагами помоваррского вепря, смешались с вооруженными членами сопротивления на главной площади.\nОливьер Морель влез на импровизированный подиум и окинул взглядом толпу, наслаждаясь моментом. Заметив его, грифоны замолкали, и вскоре все внимание собравшихся было обращено к нему.\n«Помоварцы! Мои братья и сестры!» – Морель начал вещать – «Победа близка! Трусливые оккупанты даже не смеют пытаться нас остановить. В городах и селах по всей Помоварре наша сила растет с каждым днем. Каждый день мы освобождаем новые регионы нашей родины, каждый день все больше наших родичей начинают жить свободно! Мы долго боролись. Столетиями многие поколения помоварцев воевали за свободу. Мы унаследовали войну наших предков, и наш долг вернуть судьбу, украденную у них. Когда мы идем в славный бой, помните: мы сражаемся не только за себя, но и за тех, кто унаследует нашу судьбу, мы сражаемся, чтобы они жили в свободной Помоварре, и мы также сражаемся во имя тех, кто сражался до нас. Сотня поколений стоит за нами, и другая сотня придет после нас! Наша победа неизбежна!»"
goy_pomovarra.5.a:0 "«Ведь такова наша судьба!»"

goy_pomovarra.6.t:0 "Подготовка"
goy_pomovarra.6.d:0 "Небольшая винодельня, расположенная вдали от городов, стояла заброшенной уже несколько лет. Но она отнюдь не пустовала. Бандиты, контрабандисты и прочие изгои частенько использовали ее как убежище. Сегодня в ее хрупких стенах собрались помоваррские партизаны. Командиры отрядов сопротивления стояли вокруг карты, пристально изучая ее. Она угодила в их лапы пару дней назад, когда они взяли врасплох военный конвой. И она оказалась бесценна. На карте были отмечены текущие позиции вражеской армии и планы ее перемещений. В воздухе повисло напряжение (и плотный сигаретный дым), когда собравшиеся офицеры осознали уникальную возможность.\n«Товарищи,» – начал объяснять свой план Харман Камриз, указывая в точку на карте – «я считаю, что это наша величайшая находка за последние месяцы. Она позволит нам поймать гарнизон Райхера в ловушку. Согласно карте, он решил переместить большую часть сил в Гервйис, чтобы организовать рейд на Весткип. Наши друзья там сообщили мне, что в Аквелии намечается революция. Наверняка Райхер хочет воспользоваться этим. Но пока конвой не доедет, его армия будет разделена, и у нас значительные силы в городе. Мы можем разделить его войска надвое и разбить их по очереди. Для успеха мы должны сконцентрировать все силы. Понимаете, о чем я?» Остальные грифоны одобрительно закивали.\n«Мне нравится план, но почему с нами нет Мореля? Где он?» – спросил один офицер.\n«Да какое мне дело до...» – начал было рассерженный Камриз, но внезапно сменил тон – «Наш дражайший друг и союзник» – ирония сочилась из его уст – «занят очередным туром по деревням, агитируя население. В этом он хорош. Но в вопросе военной стратегии я хотел посовещаться с грифонами, имеющими больший боевой опыт. И если мы все выберем этот план, ему придется с нами согласиться, чтобы не выставить себя дураком» – Камриз зажег новую сигарету и, затянувшись, продолжил – «В крайнем случае, если он поведет себя как невыносимый идиот, обойдемся без его грифонов. Что ж, перейдем к деталям?»"
goy_pomovarra.6.a:0 "«Сначала, этот мост...»"

goy_pomovarra.7.t:0 "Судьбоносный момент"
goy_pomovarra.7.d:0 "«Стоп! Ты позволил партизанам заполучить карты дислокации?! И рейд на Весткип... Что за...» – и тут в глазах Шатенцана мелькнуло осознание – «Вообще, это гениально. Ты ставишь ловушку, да?» Райхер просто улыбнулся в ответ. «Так. Это приманка, а как мы их прикончим? По плану наши силы будут растянуты между Помазоном и Гервйисом.»\n«Знаешь, к югу от Гервйиса есть всеми забытый склад. В последние месяцы я втихую снабжал его снаряжением, готовясь атаковать Фловену. Но потом я нашел ему лучшее применение. Партизаны не знают о его существовании, и пока их силы отвлечены, мы вывезем артиллерию со склада и скроем ее рядом с городом. Когда они пойдут в наступление, мы засыпем их градом снарядов. Они никогда не поймут, что произошло...»\nПлан начал действовать. Оставалось лишь одно дело: передать команду. Посыльный отправился к складу с письменным приказом полковника Райхера. Но кто бы мог подумать, что внезапный шторм заставит его спуститься ниже прикрытия облаков, где он был заметным. Так же неожиданно, неподалеку от пути посыльного встал лагерь небольшого отряда повстанцев. Так вышло, что судьба всей операции зависела от зоркости и навыка стрельбы одного партизанского дозорного. Грифон прицелился – и..."
goy_pomovarra.7.a:0 "Попал в цель!"
goy_pomovarra.7.b:0 "Промазал..."

goy_pomovarra.8.t:0 "Град снарядов"
goy_pomovarra.8.d:0 "Несмотря на предостережения некоторых офицеров, Райхер решил вести операцию лично. Из аккуратно скрытого от глаз командного поста полковник наблюдал за результатами своего плана. Город Гервйис был окружен холмистыми лесами, где прекрасно укрылась его артиллерия – с камуфляжем помогли наемные единороги-волшебники. Помоварцы пошли в наступление на город со всех сторон с поддержкой местных, пытаясь преодолеть защитников числом. Хотя Райхер и предполагал такой исход, потери явно превосходили его ожидания. Тем не менее, время своего выхода он выбрал верно.\n«Начать обстрел! Когда закончат, всем подразделениям атаковать обозначенные ранее сектора» – крикнул князь-полковник радиотелеграфисту. Через минуту, когда артиллеристы получили приказ, десятки пушек начали стрелять одна за другой. Райхер направил бинокль на расщелину внизу и с улыбкой наблюдал за уничтожением целых отрядов партизан и бегущими с поля боя одиночками. За этим последовало нечто похуже бойни – гарнизон и отряды, укрывшиеся в соседнем лесу, пошли в контратаку на отступающего противника. С сигарой в клюве Райхер смотрел кровавый спектакль. Все прошло ровно как он планировал, и его подчиненные знали, что делать дальше. Сейчас он мог вполне насладиться победой."
goy_pomovarra.8.a:0 "Слишком легко."

goy_pomovarra.131.t:0 "Конфликт судеб"
goy_pomovarra.131.d:0 "Морель старался держать себя в руках, вопреки тому, что каждая личная встреча с Камризом для него была настолько же приятна как сверление зубов без анестезии. Они тянулись бесконечно, и после них болела голова... Отчасти из-за ужасных дешевых сигарет, которые постоянно курил Камриз. Иногда Морель воображал его курящим даже во сне. Тем не менее, он старался быть вежливым с ним – только боги знают, насколько пострадал от этого его рассудок.\n«Когда мы образуем правительство,» – продолжил беседу Морель – «необходимо будет выбирать представителей с оглядкой на традиционные границы регионов. Это поддержит местные общины–»\n«С департаментами все в порядке» – перебил Камриз – «просто заменим управленцев, и дела пойдут гладко – как они и шли десятилетиями. “Традиционные границы”, как ты их называешь, не существуют уже сотни лет. Ты правда хочешь восстановить клановое деление? Половина современных помоварцев понятия не имеет, к какому клану себя отнести – включая меня. И если на то пошло, то тебя вообще не должно быть в правительстве, потому что оно составлялось по праву крови – которого у тебя нет» – Камриз ухмыльнулся, затушил бычок и зажег новую сигарету.\n«Ты...» – зашипел Морель – «У меня такое же право быть здесь, как и у тебя!»\nУслышав это, Камриз пожал плечами.\n«Ты поднял вопрос, я дал тебе ответ. Так или иначе, переводить всю администрацию на новые рельсы сейчас было бы глупо. Мы должны готовиться к войне с Фловеной. Это важнейшее дело, и для его успеха государству нужна стабильность».\n«Я согласен отложить этот вопрос» – хоть Морель терпеть этого не мог, его «брат по оружию» был прав. Время ещё не пришло. В ходе обсуждения важных задач Морель потерял концентрацию. Но одно для него стало ясно: Камриз будет препятствием для него. Этот дурак растеряет наследие его страны. Наследие, которое он не понимает и не ценит."
goy_pomovarra.131.a:0 "Его нужно остановить."

goy_pomovarra.132.t:0 "Планы и заговоры"
goy_pomovarra.132.d:0 "По многим свидетельствам, Камриз был очень осторожным грифоном. В свои партизанские годы он бы не выжил, игнорируя меры безопасности. Потому, вопреки предположениям Мореля, поиск способа его устранения оказался сложной задачей. Новая штаб-квартира Камриза была неприступной крепостью, выбирался он из нее непредсказуемо, и пути его передвижений было невозможно отследить. Его солдаты были настолько преданны ему, что подкуп одного из них привел бы к раскрытию операции. Он чрезвычайно хорошо заботился о бойцах – и в этом Морель заметил уязвимость.\nЕму нужно было организовать нападение на один из отдаленных постов. Нападающие выступят в роли отряда дезертиров – одного из многих, кочующих по лесам Помоварры. Если атака будет достаточно мощной, вероятно, Камриз приедет лично руководить обороной. Если нет, он все равно приедет позже, чтобы навестить раненых в госпитале. И тогда понадобится лишь один точный выстрел...\nКонечно, в расход пойдут несколько неудачников, но что такое пара смертей по сравнению с судьбой целого народа? Тысячи отдали свои жизни за последние тридцать лет, так что нет никакой разницы, даже если сейчас погибнет сотня. Да, грустно их терять..."
goy_pomovarra.132.a:0 "...но такова жизнь."

goy_pomovarra.9.t:0 "Битва за Гервйис"
goy_pomovarra.9.d:0 "«Все пропало» – Райхер подвел итоги одним предложением. С его командного поста рядом с Гервйисом было отчетливо видно катастрофу, в которую превратилась его операция. Партизаны захватили большую часть артиллерийских позиций и уничтожили остальные. Теперь их силы обрушились на город, и они дом за домом теснили гарнизон.\n«Нам пора отступить» – предложил Шатенцан – «Вернемся в Помазон и спланируем контратаку–»\n«Нет...» – Полковник потряс головой – «Нам конец. Это полное и окончательное поражение. Мы не перенесем такие потери. Я пойду в наступление на Гервйис, чтобы их отвлечь. Собери как можно больше грифонов и веди их на юг. Заберите из Помазона что сможете и бегите к границе с Веренией. Там вы либо купите себе проход дальше, либо найдете себе новую работу. Сейчас свяжись с гарнизоном по радио; пусть пробиваются на север. Если им повезет, хотя бы часть из них сможет добраться до Аделарта. У них нет другого шанса выжить... Бойцы!» – полковник повысил голос, чтобы все в лагере его услышали – «Мы идем на помощь Гервйису. У вас 30 минут на сборы. Не думаю, что кто-либо из нас уцелеет, так что, кто хочет жить, может уйти сейчас.»\nОстаться решили почти все. Через полчаса сформировался сборный штурмовой отряд. Среди бойцов Райхер заметил знакомого пса.\n«Разве я не отправил тебя в Помазон?» – спросил он.\n«Нет необходимости. Я раздал приказы моим подчиненным; они справятся. А я не пропущу этого случая. Никогда не думал, что проживу так долго. Пора мне уйти красиво» – Шатенцан широко улыбнулся – «А еще я наконец расплачусь с вами по долгам, полковник».\n«Спасибо... старый друг» – ответил Райхер. Он снял свою вычурную фуражку и выкинул ее в грязь. «Никогда не любил быть князем... Солдаты! Товарищи!» – он обратился к отряду – «Я горд был с вами служить. А теперь давайте убьем побольше этих варваров!»"
goy_pomovarra.9.a:0 "«Вперед!»"

goy_pomovarra.10.t:0 "Один точный выстрел"
goy_pomovarra.10.d:0 "Харман Камриз пристально изучал только что доставленное ему письмо. Подпись Райхера выглядела правдиво, а картина в его голове переворачивалась с ног на голову. Дерзкий план опытного полковника, поразительным образом создающий серьезную уязвимость, был ловушкой – и Камриз почти в нее попался. Но теперь он знал, что нужно делать.\n«Позови Бернеза. Он говорит по-герцландски и знает их устав» – скомандовал он своему адьютанту – «И выдай ему княжескую униформу. Он доставит письмо по адресу».\nШироко улыбаясь, Харман принялся писать собственные приказы остальным командирам партизан. Выходило так, что полковника погубит..."
goy_pomovarra.10.a:0 "...его собственный план."

goy_pomovarra.11.t:0 "Прорваться через ворота"
goy_pomovarra.11.d:0 "Определенные отряды проникли сквозь границу и саботировали линии связи между самыми уязвимыми расположениями аквелийских войск. Несколько боевых групп продвинулись глубже в Аквелию, чтобы подорвать железные дороги, идущие к основным пунктам снабжения армии, и нанести достаточный ущерб инфраструктуре, чтобы отложить прибытие подкреплений. После этого наши основные силы перешли границу с Весткипом, уничтожив ряд пограничных постов и несколько подразделений местного гарнизона, изолируя большие аквелийские военные формирования и в целом сея хаос на своем пути. Но вместо того, чтобы разграбить регион, они атаковали конкретные точки интереса: важные военные фабрики, арсеналы, промышленные склады, банки и административные здания. Военные инженеры, следующие за авангардом, согласно приказам занимались разбором промышленного оборудования для дальнейшей продажи на черном рынке.\nПо результатам начала вторжения аквелийская армия в регионе утратила боеготовность и не смогла противостоять нашему наступлению, всецело занятая разборками с местными революционерами. Спустя неделю, когда аквелийцы собрались с силами, наши войска уже покинули Весткип, оставив лишь малую диверсионную группу для отвлечения. Когда началась контратака, аквелийцев встретили лишь несколько отрядов вспомогательных войск и местные мародеры.\nОперация завершилась оглушительным успехом. Мы добыли гору денег, провизии и военного снаряжения с минимальными потерями, также нанеся существенный ущерб гарнизону Весткипа. Но ожидается, что вскоре оборона границы будет усилена, и столь дерзкий набег станет невозможным в будущем."
goy_pomovarra.11.a:0 "Прекрасно!"

goy_pomovarra.12.t:0 "Набег на Весткип"
goy_pomovarra.12.d:0 "Наемная армия Полковника Райхера в Помоварре была признана неспособной к проведению сколь-либо масштабных операций из-за активности партизан и ее разбойничьего образа жизни. Это было ошибкой. Большая группа солдат Райхера пересекла границу Весткипа и, легко прорвавшись через наших пограничников, захватила регион. Однако, их интересовала не земля. Вместо установления контроля над территорией, войска Райхера начали атаковать линии снабжения и связи, изолируя большие войсковые формирования.\nВ нормальной обстановке такое наступление быстро бы захлебнулось из-за полного отсутствия логистики и присутствия наших войск за их спинами. Но это было не вторжение, а набег. Враг пришел, чтобы взять все ценное из региона и сбежать перед тем, как мы могли бы среагировать. И это было организовано настоящей армией, а не толпой бандитов, за которую мы ранее сочли войско Райхера. Противник отступил обратно в Помоварру, забрав с собой награбленное, до прихода нашего контрнаступления. Чтобы предотвратить подобное в будущем, мы укрепим пограничные посты и усилим весткипский гарнизон. Мы будем пристально наблюдать за Райхером. «Князь-полковник» проявил себя как намного более опасный враг, чем мы предполагали."
goy_pomovarra.12.a:0 "Будь ты проклят, Райхер!"

goy_pomovarra.13.t:0 "Предатель"
goy_pomovarra.13.d:0 "Райхер всегда гордился своим чутьем на подлецов и пройдох. Но здесь никакого чутья не требовалось. Подопытный был жутко неприятен, жаден и мстителен. Золотой стандарт фловенского патриция! Со скрытой прослойкой трусости, вдобавок. В общем, грифон, с которым Райхер мог работать.\n«Князь, моя честь принять ваше приглашение». Посетитель показывал себя как олицетворение скромности и достоинства, но его рваные движения и снисходительный тон выдавали то, насколько отвратительна для него была эта ситуация. «И меня, и вас подставили правители Фловены. Их слепые глаза не увидели истинное величие нас, законных князей–»\n«Достаточно, де Блоеталь» – Райхер помахал лапой, затыкая падшего патриция – «Я не наивная курица, соблазнимая дешевыми комплиментами». Услышав это, патриций надулся от злости. Райхер продолжил – «Ты шатался вокруг Фловены как голодный волк с тех пор, как тебя изгнали. И по моим данным, в произошедшем виноват только ты. Заговоры простительны – это же Фловена – но хищение средств из банков? В таких масштабах? Думаю, ты удивлен тому, что я это знаю» – Райхер ухмыльнулся – «Скажем так, у моего подчиненного нюх на секреты. Ты доигрался. Твои действия могли подорвать веру всех грифонов в надёжность фловенских банков. Теперь ты один. Все украденные деньги ты растратил на попытки отомстить. Так что же ты можешь предложить мне?»\n«Вы правы, полковник, я украл очень большие деньги» – Патриций снял маску вежливости, его глаза смотрели на Райхера как две острые ледышки – «И, да, при мне ни гроша. Я хорошо разбираюсь в банках, но не в заговорах. Но я вижу, что ты и твои подельники окончательно разорили Помоварру. Ты знаешь это, и ты почти так же беден, как и я. Я помогу тебе сделать эту психушку прибыльной и – ещё лучше – я добуду тебе все золото фловенских банков, когда ты захватишь город. Я знаю, что ты нападешь на Фловену. И я достану не только золото. Только дураки верят в то, что ее настоящие богатства лежат в хранилище. Все записи во фловенских бухгалтерских книгах к чему-то ведут – к деньгам и имуществу вдали от города, инвестициям и “гарантам благополучия” важных фловенских семей. Никто другой не отдаст тебе это. Мы смотрим на тебя как на выскочку, как на дикое животное, сорвавшееся с цепи. Не говоря уже о том, что тебе понадобится помощь в управлении городом, чтобы он не превратился в Помоварру номер два.»\n«Видишь, Антуан, как хороша честность – все по делу!» – рассмеялся Райхер – «Ты прав. Князь из меня никудышный, хотя и подданные у меня – не подарок... Но скажи мне, в чем твой интерес? И разве тебе не отвратно работать на выскочку?»\n«Конечно, отвратно» – прямо ответил де Блоеталь – «Но я дрожу от мысли, что мне удастся превратить изгнавших меня в уличных попрошаек. Я стану последним патрицием Фловены, и я уверен, что ты не насытишься ей одной. Когда мы закончим твою следующую войну, я стану богатейшим грифоном во Фловене! И если ты боишься предательства, – я уже сказал – из меня плохой заговорщик, и я уже тяжко поплатился за это»."
goy_pomovarra.13.a:0 "«Согласен на сделку!»"

goy_pomovarra.14.t:0 "Обстрел артиллерией"
goy_pomovarra.14.d:0 "Самозванный “Князь” Помоварры Леопольд Райхер некогда был полезным инструментом для нас, но мы потеряли над ним контроль. До недавних пор он был занят борьбой с многочисленными партизанами, но, нанеся им сокрушительный удар, воевода перевел свой взгляд на Фловену. Его армия собирается на нашей границе, готовясь к наступлению. Вчера он произвел артиллерийский обстрел по нескольким точкам в городе, включая оружейные фабрики. Мы подозреваем, что это было частью подготовки к прямому нападению, направленной на ослабление нашей обороны, снижение боевого духа населения и проверка нашей решительности. Мы отправили дипломата с нотой протеста, но Леопольд отказался его принять. Паника распространяется по городу, а грифоны рассказывают безумные истории о немыслимой численности и жестокости солдат Райхера."
goy_pomovarra.14.a:0 "Будь ты проклят, Райхер!"

goy_pomovarra.15.t:0 "Возмездие"
goy_pomovarra.15.d:0 "Это была настоящая пытка. Громкий писк доставлял Райхеру такую боль, как если бы его голову сверлили дрелью. Но откуда взялся этот адский шум? Полковник попробовал открыть глаза, но его тут же ослепил свет из окна. Он моргнул пару раз и увидел, что его комната разгромлена... И в центре нее был источник ужасного звука – маленький вредитель, полукошка-полуголубь счастливо ворковал, роясь в горе мусора. Как он пробрался сюда? Райхер схватил попавшееся под руку пресс-папье и метнул его в самозванца. Естественно, он промазал, но животное отскочило и с визгом вылетело в окно. Полковник огляделся. По богато украшенной спальне как будто бы прошло торнадо, испортив всю мебель... А он сам так и не добрался до кровати вчера, оставшись лежать на полу у ее подножия. Голова раскалывалась, живот воротило. Следуя совету своего дяди, «лечись тем, что тебе навредило», Райхер отыскал уцелевшую бутылку с бордовой жидкостью и пустил ее в ход...\nБольшая ошибка. Через мгновение он очутился у окна, а содержание его желудка – на улице. Это принесло облегчение. Головная боль утихла, и память начала возвращаться. Вчера он с офицерами был на параде победы – естественно. Они вошли в дворец мэра и вскрыли его винный погреб... Потом они гоняли по городу на машине, стреляя в памятники. Дальше он потерялся; снова нашел остальных, и они еще раз выпили... На главный вопрос – как он попал обратно во дворец – ответа не было. И куда-то пропала его фуражка. Вот и славно! Не так уж она хороша...\nНа этом воспоминания Райхера прервались, потому что дверь в спальню открылась. В проходе стоял Шатенцан – с потерянной фуражкой в лапах! Нос пса сморщился от перегара, которым несло от его товарища, еле стоявшего опершись на стену. Прошла секунда неловкого молчания, и Хайнрих вздохнул.\n«Лепольд-Леопольд... Ты устраиваешь пьянку в только что взятом городе, теряешься, стреляешь куда попало – и каким-то образом местные не разрывают тебя на куски. Боги действительно любят дураков и пьяниц. Так или иначе, вид у тебя – как из помойки. А тебе сегодня надо было править городом, не так ли?»\n«Да-да...» – промямлил Райхер – «пусть этим займется де Болталь... Он этого хотел».\n«Де Блоеталь» – поправил Шатенцан – «Думаю, ничего лучше ты сегодня не придумаешь. Пойду искать его». Пес развернулся и вышел, оставив грязную командирскую фуражку на столике у двери. Райхер сполз по стене и лег на пол, наслаждаясь его прохладой.\nМмм... Пол..."
goy_pomovarra.15.a:0 "...мой лучший друг..."

goy_pomovarra.121.t:0 "Надвигающаяся гибель"
goy_pomovarra.121.d:0 "Хотя Райхер не любил работать в кабинетах, новый офис во Фловене пришёлся ему по душе. В нем был и большой стол, куда приятно ложились задние лапы, и огромное окно, в которое было легко попасть бутылкой – к тому же, с хорошим видом на сад – и портреты каких-то старых грифонов, служащие отличными мишенями для дротиков. Конечно, он редко бывал здесь подолгу, всегда в пути от расположения одной дивизии к другому, занимаясь тем, что было действительно важно – его военной кампанией. Офисом заведовали де Блоеталь и старый-добрый Шатенцан.\nРайхер схватил очередной дротик, целясь в портрет прямо у входа. В тот же момент, из-за двери вышел серый пес. Ошарашенный нежданным посетителем, полковник запустил дротик прямо в него. Шатенцан защитился папкой с документами.\n«Серьезно?» – возмутился бывший разведчик – «Дротиком меня не убить. Только, пожалуйста, не стреляй в помещении! Я еще не научился уворачиваться от пуль».\n«Прости» – промямлил полковник – «Обещаю не стрелять. Просто я очень люблю играть в дартс с тем портретом. Эта морда одновременно тупая и как будто бы знакомая».\n«Так это портрет Бронзино. Разве ты не узнаешь “морду” того, кто нанял нас, чтобы мы разобрались с Помоваррой давным-давно?»\n«Ах, это он» – Райхер расплылся в улыбке – «Теперь понятно, почему он выглядит как идиот».\n«Думаю, ты путаешь его с Чоколатом, его сыном. Тот был полный дурак. Но выходит, что именно Бронзино запустил цепь событий, закончившуюся тем, что Фловена разграблена, а ты кидаешь дротики в его портрет. Так что ты прав. И все это совершенно не важно, потому что у меня плохие новости». Шатенцан тряхнул пробитой папкой.\n«Ты знаешь, что я терпеть не могу отчеты. Резюмируй на словах». Райхер перестал улыбаться и снял задние лапы со стола.\n«Мы только отложили неминуемую катастрофу. Да, фловенцы ненавидят нас чуть меньше, чем помоварцы, но они уже готовят восстание. Я могу сдерживать их, но не бесконечно. Я надеюсь, что твой план действительно так хорош, как ты о нем говоришь, потому что иначе местные скоро вздернут нас. И мы их никак не остановим. От нашего пользования услугами наемников и контрабандистов есть забавный побочный эффект: скоро партизаны свяжутся с ними и тоже обеспечат себя поставками оружия.»\n«Понял. Я в курсе, что то, чем мы здесь заправляем, совершенно нежизнеспособно – оно и не должно быть. Ставка сделана на то, что для равной битвы с Аквелией нам придётся выжать каждую монету, каждую каплю топлива и каждую пулю из этой страны. Их промышленные возможности в разы превосходят наши, но в отличие от них, мы можем позволить себе ради победы угробить государство». Райхер был холоден и говорил отчетливо. От образа счастливого пьяницы не осталось ничего. «Не говоря о том, что кто-то выкапывает Империю из могилы много быстрее, чем я предполагал. А в ней нас ждут смертные приговоры – отложенные на 30 лет. Сколько у нас времени?»\n«3 года в лучшем случае. Возможно, меньше» – отрапортовал Шатенцан.\n«Принято. Не переживай; план хорош. И, поверь мне, мы отпразднуем его кульминацию в городе огней»."
goy_pomovarra.121.a:0 "«За работу!»"

goy_pomovarra.122.t:0 "Часы идут!"
goy_pomovarra.122.d:0 "Много лет назад, когда он присоединился к Леопольду – тогда просто “полковнику” – в годы Революции, жизнь была намного проще. Они боролись за выживание, и полковник протащил их сквозь ад. Все уцелевшие в хаосе распада Верении после остались с Райхером – они были обязаны жизнью ему и его, порой безумным, планам. В те дни Шатенцан научился не оспаривать решения своего нового командира. Он тогда был еще щенком, и решение предать Рейхсармию далось ему нелегко. На должности военного разведчика он попал под перекрестный огонь между разными группами повстанцев – и принял на себя командование небольшим гарнизоном, в который прибыл для “оценки ситуации”, потому что все штатные офицеры погибли либо бежали. У них кончались патроны, бойцы падали на его глазах, а враги стягивали вокруг их позиции кольцо. И тогда, как будто из ниоткуда, внезапная атака разбила строй повстанцев. Они бежали в ужасе из-под града пуль. Но спасение не могло прийти от имперского подкрепления, ведь командование отклонило все прошлые запросы Хайнриха. В тот день он впервые встретил Леопольда, который вел свой полк от арсенала к арсеналу, от аванпоста к аванпосту, собирая оружие, амуницию и провиант для марш-броска до границы с Веренией. Помимо того, ему нужны были солдаты – и он брал всех желающих. Так Шатенцан связал свою судьбу с полковником Райхером, ведь если бы не он, его бы убили.\nТеперь Хайнрих чувствовал то же, что и тогда. Смерть близилась, и враги окружили его как стая голодных волков. Но сейчас некому было прийти на помощь. Стопка докладов о партизанской активности пополнялась ежедневно – небольшие перестрелки, засады, заметки о “подозрительных действиях”. Контрабанда оружия вышла из-под контроля, а партизаны проводили все более сложные операции – уничтоженная ранее сеть командования восстанавливалась.\nВ голове Шатенцана вертелась назойливая мысль. Может, пришла пора соскочить? Спасти себя, пока это возможно? С его-то знаниями о путях движения контрабанды и многочисленными контактами на чёрном рынке, он мог пропасть бесследно, подделать личность и уехать куда-то, где он был бы в безопасности. Нова Грифония? Эквестрия была ему не по вкусу – слишком броско... Он подавил эту мысль. Если бы не Райхер, его бы не было в живых сегодня. И он должен верить, что у командира действительно хороший план. Да, он порой буянил и позволял себе беспечность, но в чем он был мастак, так это в импровизации под давлением. Хайнрих Шатенцан уже стал предателем однажды, и он не собирался предавать кого-либо снова – особенно Райхера. Он должен был выиграть для полковника столько времени, сколько он сможет... "
goy_pomovarra.122.a:0 "Столько, сколько потребуется."

goy_pomovarra.98.t:0 "Конец авантюры"
goy_pomovarra.98.d:0 "Машина проела последние капли бензина и встала в богами забытом лесу. Конечно, у Райхера не было с собой карты. Он покидал Фловену в спешке, и карта не вошла в список того, что он успел прихватить. Но сейчас топливо было важнее. Сам полковник мог уйти или улететь, но Шатенцан... Он лежал на заднем сиденье без сознания под медвежьей дозой анальгетиков. Кроме этого и грубой повязки, Райхер никак не смог помочь старому другу, поймавшему пулю в живот. Он надеялся отыскать доктора, когда они бы достаточно удалились от Фловены – но вместо этого они застряли в каком-то поганом лесу. Он снова обыскал багажник, опять не обнаружив в нем ни малейшей канистры топлива. В приступе гнева он пнул задний бампер. Этим он достиг одного: Шатенцан проснулся.\n«Где мы? Не в Фловене, да?» – прошептал он.\n«Уже нет. Мы выехали пару часов назад. Я остановился подкачать шину» – ловко соврал Райхер, осторожно открывая дверь.\n«Славно... Все пошло наперекосяк. Мы почти справились...»\n«Почти...» – повторил полковник – «Я проклинаю этих помоварцев или аквелийцев – кем бы не были эти отродья Маара. Мы были в одном шаге, Хайнрих – на финишной прямой к несказанным богатствам и счастливой отставке где-нибудь подальше».\n«Это было бы прекрасно. Но я взял сумку с золотом – “пожарную”.»\n«Хорошо сообразил. С ней мы оплатим проезд до хороших теплых краев. Быть может, до Макавии. О, Макавия... Там нас ждёт вкусный ром и прекрасные закаты. Только жаль, что нас не запомнят как самых дерзких существ в Грифонии. Посмешище – два дурака, побеждённые толпой голодранцев. Как думаешь, сколько шуток о нас придумают?» Ответом была тишина. Райхер хорошо понимал, что произошло.\nПолковник вернулся к багажнику, протянул лапу к неприметному портфелю и открыл его. Внутри лежали несколько блестящих слитков – достаточно золота, чтобы роскошно провести остаток жизни. Райхер закрыл его и тяжело вздохнул; взял лежащую рядом лопатку и принялся копать. Полчаса спустя, когда золото уже покоилось глубоко под землей, он услышал рёв моторов. Преследователи догнали их."
goy_pomovarra.98.a:0 "Полковник достал пистолет."

goy_pomovarra.99.t:0 "Смерть Райхера"
goy_pomovarra.99.d:0 "Террору полковника-дезертира Леопольда Райхера пришел конец после очередного восстания против его власти – в этот раз удачного. Повстанцы собрались со всех уголков Помоварры, погрузив страну в хаос. “Армия” Райхера не смогла отразить натиск. Сам полковник умер в попытке побега. Беспорядки в Помоварре создают идеальную возможность для нашей интервенции. Ожидается, что в ближайшие дни мы установим полный контроль над регионом."
goy_pomovarra.99.a:0 "Нам везёт!"

goy_pomovarra.123.t:0 "Сделка с полковником"
goy_pomovarra.123.d:0 "Полковник Леопольд Райхер – интересный малый. Воевода во главе Помоварры, который ухитрился превратить всю Периферию в поле брани. Его армия марширует по региону, разбивая врагов, разоряя города и сея хаос. В этом безумии возникла полезная возможность. Полковник связался с нами и предложил деньги, дорогие станки и ресурсы с завоеванных территорий в обмен на оружие для его армии. Сделка слишком хороша, чтобы отказать, и полковник совершенно не скрывает, что дальше он двинется на Аквелию. Мы с удовольствием посмотрим на то, как он ослабит наших врагов."
goy_pomovarra.123.a:0 "Оружие на благое дело."

goy_pomovarra.16.t:0 "Кульминация авантюры"
goy_pomovarra.16.d:0 "Посреди океана большой корабль шел по волнам. Члены его маленькой команды выглядели удивительно расслабленно, как будто они купили билеты на круиз... на дредноуте. На верхней палубе двое лежали в шезлонгах, наслаждаясь теплым солнцем и коктейлями. Полковник Райхер уже оделся в пёструю рубашку, в то время как его самый доверенный приспешник просто расстегнул китель.\n«Честно говоря, Леопольд, я до последнего не верил, что нам это удастся» – заявил пес – «Это все ещё похоже на сон или сюжет дурацкого эквестрийского романа. Но мы действительно справились!»\n«Я же тебе говорил, Хайнрих! У меня с самого начала был план.»\n«Нашёл кому врать. Не было никакого плана и никакой цели. Всё, от начала и до конца, было бредом сумасшедшего. На каждом повороте всё могло пропасть... Даже не знаю, с чего начать. Ты либо самый удачливый сукин сын на свете, либо настоящий избранник богов – только я понятия не имею, с чего бы они выбрали тебя.»\n«Ну, если бы я хотел проверить, любят ли меня боги, я бы взлетел повыше, когда мы попадем в шторм...» – посмеялся Райхер – «Но на самом деле» – он повысил голос, чтобы все грифоны на палубе его услышали – «Я бы не справился без всех вас, друзья мои! Благодаря вам, мы будем наслаждаться отставкой в хороших, тёплых краях!» Офицеры начали хлопать в ладоши, а через секунду – скандировать:\n«Рай-хер! Рай-хер! Рай-хер!»\n«Ладно, хватит с вас!» – полковник наконец их угомонил – «К дому отдыха еще предстоит добраться! Курс на юг!»"
goy_pomovarra.16.a:0 "«К ле Меридьен!»"

goy_pomovarra.17.t:0 "Побег крыс"
goy_pomovarra.17.d:0 "Возвращаясь во Фловену, Антуан де Блоеталь обеспечил себя самым большим и богатым особняком – по этим параметрам вторым во всём городе, поскольку первый, разумеется, прибрал Райхер. Потеря была невелика, поскольку несколько полковничьих вечеринок спустя, особняк обветшал, и в итоге, Антуан остался при лучшей резиденции. Из неё он правил своей вотчиной, Помоваррой. Между военным планированием и вечеринками, у полковника не было времени для присмотра за его карманным патрицием. Его псина иногда мешалась, но если Антуан приносил достаточно денег, зачастую не задавала лишних вопросов. Так началась колоссальная операция по отмыву денег. Де Блоеталь выжал из Фловены каждый грифонский идол, наверняка обанкротив в процессе пенсионные фонды нескольких таких же разбойников, как его покровитель. Но иначе покрыть леопольдовы и его собственные расходы было невозможно. Он знал, что рано или поздно этому придет конец. Его «Князь» был дураком, и его тактика побега от проблем работала до сих пор, но однажды они бы его настигли.\nОн не смог предсказать одного: что Райхер, образно говоря, выбросит его из поезда на обочину и уедет в закат. Наглый ублюдок! Его солдаты разорили Аквилу, угнали несколько боевых кораблей и бежали из страны вместе с награбленным. Теперь Райхер и его офицеры-заговорщики наслаждались жизнью в тропическом раю, в то время как страна впадала в полный хаос. Его великая армия наёмников и бандитов, потеряв командира, была окружена ордами разъярённых грифонов. Смышлёные вояки последовали примеру начальника, а дураки остались грабить то немногое, что уцелело после войны. Тем временем, Антуан понял, что ему здесь больше не рады. До его особняка уже доносились звуки отдаленных взрывов. Его личные наёмники давно бросили оборону города. Теперь они грузили драгоценности и припасы на конвой, следующий до Скайфола. Оттуда их подбросят до Нова Грифонии..."
goy_pomovarra.17.a:0 "...где они будут жить как коро–"

goy_pomovarra.135.t:0 "Форс-мажор"
goy_pomovarra.135.d:0 "БАМ! Двери в кабинет Антуана распахнулись. Униформа посетителя была рваной, сам грифон был ранен – и явно испуган.\n«Они здесь!» – выкрикнул он.\n«Что?» – недоумевал патриций, застыв с кипой бумаг в лапах – «Кто? Где?»\n«Ну... повстанцы. Они как будто из-под земли вылезли. Видимо, прошли по канализации. Они окружили район, они разграбили арсенал–»\n«Банда Камриза? Я думал, их давно разгромили, а сейчас мы подавляем мятеж заводчан. Они бы никогда до такого не додумались–»\n«Нет! Это кто-то новый. Они вещают по всем частотам. И мы потеряли связь со всеми бойцами за городом». Наёмник принял опустошенный и растерянный вид. Озадаченный де Блоеталь включил радиоприемник, стоящий в углу кабинета, и тут же услышал голос.\n«Товарищи! Солдаты Революции! По всей стране, от Аквилы до Фловены, мы восстаем против тирании! Огонь нашей революции пожирает былое, и с ним наступает новая эпоха! Вставайте! Сражайтесь! Найдите оружие и убейте каждого солдата противника, каждого коллаборациониста, каждого предателя. Мы очистим Грифонию от грязных реакционеров, начиная здесь, сегодня!» Речь продолжалась, очевидно записанная заранее. С каждым предложением, ведущий возбуждался всё сильнее.\n«Что нам делать?» – отчаянно спросил наемник.\n«Бросить все, что еще не в грузовиках. Мы отбываем немедленно! Да, золото тоже!» – добавил де Блоеталь, заметив, что его подчинённый начинает протестовать – «Если мы задержимся хоть на минуту, мы заберём его в могилы. Свяжитесь со всеми, кто услышит. Я удвою плату, если они проедут перед конвоем, чтобы открыть проход на север для нас. Если я правильно понимаю, кто за этим стоит...»"
goy_pomovarra.135.a:0 "«...Мне нельзя здесь оставаться.»"

goy_pomovarra.18.t:0 "Возвышение революционера"
goy_pomovarra.18.d:0 "Хаос создает уникальные возможности. Когда сгорает старый порядок, из его пепла может восстать нечто совершенно новое, необремененное прошлым и не обязанное идти на компромиссы. Это правда, что события последней пары лет запомнятся как трагический период хаоса и бессмысленных разрушений, учиненных боевиком, каким-то образом разрушившим целую страну, развалившим все институты власти и бежавшим восвояси, оставив регион в руинах. И тут Аллард сыграл свою карту. Пока остальные аквелийские лидеры мнений боролись с шоком, он оправился первый – и подействовал решительно. Все, что ему потребовалось, это небольшая группа подстрекателей, революционный авангард, способный мобилизовать и направить обозленные толпы пролетариев. Всегда будучи на краю аквелийского политического дискурса, Алларда и его последователей меньше всех затронуло разрушение Аквелии, и они давно выискивали любую возможность подняться в глазах общественности.\nТеперь Аквила принадлежала ему. Также как и некоторые другие большие города, раскиданные по стране. Наемники поняли, что командование бросило их, и разбегались сами по себе. Со временем обстановка вернется к норме, и Аквелию можно будет перестроить. Сначала, Аквелию..."
goy_pomovarra.18.a:0 "...А потом и всю Грифонию."

goy_pomovarra.19.t:0 "Народное правосудие"
goy_pomovarra.19.d:0 "Длинная очередь всех видов и национальностей растянулась перед дверьми местного совета под вооруженной охраной. Каждые несколько минут новый подозреваемый входил в здание. Большинство из них имело отрешенный вид. Те немногие, кто попытался протестовать, заработали расстрел на месте, без суда и следствия. Конечно, и эти казни оформлялись по протоколу. Один из клерков вышел из зала суда для написания их посмертных приговоров по статье “неповиновения прямому приказу Народного Представителя”. С заднего двора время от времени доносились крики и звуки прибывающих и уходящих грузовиков.\nВнутри здания тройка грифонов делала все возможное, чтобы вынести приговоры всем преступникам. Каждая минута была на счету – их предупредили, что следующая партия нарушителей закона прибудет уже завтра. Конечно, было бы проще казнить всех на месте, но в разборках с такими отъявленными преступниками требовалось соблюдение судебного порядка.\n«Следующий!» – скомандовал судья. Стража ввела в зал побитого пони в рваной военной форме. «Имя? Звание? Подразделение?»\n«Стифт Винг, ефрейтор, Кнехты Шлеппена. Я всего лишь–»\n«Отвечать только на заданные вопросы!» – грифон повысил голос и повернулся к ассистенту – «Он в списке?»\n«Да, взят вместе с остатками его подразделения».\n«Отлично. Виновен в многочисленных убийствах, грабеже, преступлениям против гражданских, предательству родины и... И этого достаточно для высшей меры. Согласны, Франсуа?» – обратился он к другому судье, копающемуся в горе бумаг.\n«Что? Ах, да, кошачьи наемники. Те еще сволочи. Казнить!»\n«Но я только водил грузовики!» – взвизгнул пони, борясь с крепкой хваткой двух стражей. Пока его отводили во двор для повешения, Франсуа наконец откопал искомый документ.\n«Гм... Нам придется приостановить казни» – сказал он главному судье – «Я только что нашел запрос на сотню каторжников для расчистки обломков в Риле. Естественно, это не касается офицеров и солдат из особенно опасных дивизий...»"
goy_pomovarra.19.a:0 "Несомненно, они заслужили это!"

goy_pomovarra.20.t:0 "Съезд Комитета"
goy_pomovarra.20.d:0 "В Аквиле было нелегко отыскать государственное здание в достаточно приличном состоянии для проведения заседаний Комитета. Тем не менее, подходящий дом, избежавший серьезного ущерба, нашелся. Старую символику заменили красные драпировки – простые и подходящие декорации. В бывшей бальной комнате были собраны все стулья и столы, какие нашлись – согласно плану, многочисленные приглашенные делегаты должны были заседать здесь. К их недоумению, Виктор Аллард объявил, что готов работать вместе с представителями всех политических партий и общественных организаций со всей Аквелии, надеясь на понимание и солидарность в эти тяжелые времена. Хотя некоторые отказались участвовать, заявив, что Аллард воспользуется их доверием, чтобы взять полный контроль над страной, многие смотрели на съезд оптимистично. Комната потихоньку наполнялась. Грифоны живо обсуждали планы на будущее, собравшись в группы по интересам, но хозяина нигде не было видно. Спустя двадцать минут после назначенного времени, в двери вошел Виктор Аллард в окружении ближайших приспешников, одетых в черную форму.\n«Джентльгрифы, я счастлив видеть вас всех в этот судьбоносный день. Пожалуйста, занимайте свои места». Взор Алларда метался от одного усаживающегося гостя к другому, как будто он их пересчитывал.\n«Для начала, где наш дорогой Леонард?» – обратился он к ближайшему члену ПДА.\n«Маршал отказался участвовать. Он сказал...» – грифон запнулся – «что он не желает быть в одном здании – а лучше даже в одном городе – с вами».\n«Мы разделяем это мнение». Аллард развел лапами. «Должен признать, старина Родье умен. Спасибо за намек на то, что он за пределами Аквилы. Насколько я вижу, здесь все, кроме него и труса Верани. Это упрощает задачу».\n«”Упрощает задачу”? Что у тебя на уме, Виктор?» – изумленно спросил Деверо.\n«Понимаешь, мой дорогой Тибо, я счастлив видеть вас на первом и последнем съезде Комитета в таком широком и идеологически многообразном составе». В этот момент через остальные входы в зал ворвались стражи, вооруженные пулеметами. «Слишком долго вы пили аквелийскую кровь! Разве не вы уже во второй раз подвели эту страну? Неужели вы считаете, что я позволю вам сделать это в третий раз? Абсурд! Вы все арестованы за преступный уровень некомпетентности и/или предательство! Судьи решат, в чем конкретно виновен каждый из вас». В зале наступила мертвая тишина.\n«”Предательство”?» – Сесилии Гудро первой вернулся дар речи – «Предатель здесь ты, Виктор! Ты предал Революцию! Ты предал Республику! Ты предал своих коллег! Ты – властолюбивый психопат, каким-то образом обманувший нас всех!»\n«Революция была несовершенна, равно как и Республика» – спокойно ответил Аллард – «Я виновен лишь в одном: слепой уверенности в том, что я мог чего-то достичь, следуя правилам былого порядка. Теперь я вижу, что от него нужно избавиться и стереть все его следы. Впрочем, я очень занятой грифон.»"
goy_pomovarra.20.a:0 "«Стража, увести их!»"

goy_pomovarra.21.t:0 "Отрезая головы гидры"
goy_pomovarra.21.d:0 "Потеряв управленцев, общественные движения фактически прекратили свою деятельность. Схвати главаря, и его последователи не смогут работать сообща. Так удачно вышло, что столько больших политиков попало в его ловушку, в то время как менее значимых республиканцев выслеживали и отлавливали по всей Коммуне. Некоторых избранных ждал открытый суд – это были неженки, которые наверняка бы сломались под давлением и устроили шоу. Радикальная публика обожает такие представления, вызывающие ненависть к старому правительству.\nКасательно остальных, план был прост: высокопоставленные члены ПДА были слишком опасны – их было приказано казнить на месте; каждый, кто называл себя “социалистом” должен был пройти проверку веры в принципы правящей идеологии – далее его либо расстреливали, либо отправляли в лагерь переобучения или в штрафную бригаду... Аллард трудился без устали, подписывая приговоры. И ни разу его лапа не дрогнула. Разумеется, он получил ошеломительное число писем самокритики – и приказал сжечь их, не прочитав ни одного. Нельзя верить никому, кто отчаянно пытается спасти свою шкуру. Они были готовы сказать и сделать что угодно, лишь бы выжить. Надежнее было начать заново, вычистив всю гниль из политического аппарата раз и навсегда."
goy_pomovarra.21.a:0 "Наша работа только начинается!"

goy_pomovarra.22.t:0 "На виселице"
goy_pomovarra.22.d:0 "Сейчас поездки по Аквелии были опасны... По правде, сейчас было опасно вообще быть в Аквелии. Мишель иногда задавался вопросом, почему он не переехал, когда это еще было возможно – в какую-нибудь страну, где еще правил здравый смысл. Ответ был прост: он не мог позволить этому продолжаться. В то время как большинство либо поддалось влиянию коммунистической риторики, либо повиновалось из-за страха перед полицией, Мишель терпеть не мог то, во что превратилась его страна. До начала всего этого, он считал себя социалистом, всегда голосовал за АРП. Но настоящая “власть пролетариата” выглядела не так. На пути от вокзала Рилы он прошел мимо трех различных плакатов, изображающих Алларда как спасителя Революции, и вооруженного патруля, зверски избивающего какого-то беднягу. Очевидно, дело было связано с плакатом – на лице “Славного предводителя” красовалась половина длинных черных усов. Горе-художнику повезло отделаться побоями – за такое могли и пристрелить.\nМишель работал инспектором железных дорог, что позволяло ему перемещаться по стране, не вызывая подозрения, – отличное прикрытие для курьера. Он, вместе с парой других, помогал координировать работу разношерстного собрания уцелевших лидеров оппозиции. И поездка в Рилу обещала быть плодотворной. Он вез доклады о недавних операциях спецслужб, по которым оппозиционеры смогли бы научиться ускользать от их агентов. Приближаясь к убежищу, Мишель прошел небольшую площадь. Раньше посреди нее была статуя Короля Аквелии, естественно, недавно снесенная, как и все остальные образцы “монархической пропаганды”. Ее место занимала виселица. Около десятка тел грифонов и пони качалось на ветру... Мало Алларду было публичных расстрелов и обезглавливаний! Ему нужно было оставить трупы “контрреволюционеров” как предупреждение для потенциальных “предателей родины”. Мишель почти пересек площадь, как вдруг он признал в одном из повешенных своего связного в городе! Он застыл в шоке. Рядом висел старый пони-лавочник, чей магазине продуктов служил их убежищем. Чуть поодаль – еще одно знакомое лицо: местный судья, известный за пристрастие к относительно легким приговорам – отсидкам в трудовых лагерях вместо казней. Режим сожрал одного из своих верных псов. По Мишелю прошла волна мурашек от удовольствия... Которое вмиг сменилось на страх. Он должен бежать! И выбросить доклады! Раз они поймали связного, то и он сам–\n«Постойте, гражданин» – сказал спокойный, усталый голос за его спиной. Медленно повернувшись к нему, он обнаружил трех грифонов в форме политической полиции. На говорившем был офицерский плащ и фуражка. Он выглядел устало – как будто он уже поймал столько преступников, что ему было откровенно наплевать на их оправдания."
goy_pomovarra.22.a:0 "«Вы арестованы за измену родине»."

goy_pomovarra.23.t:0 "Призыв к сдержанности"
goy_pomovarra.23.d:0 "Символы важны, и даже правящие грифоны должны понимать свое предназначение в общем плане. Для этого, комната встреч Комитета Общественного Порядка была обставлена настолько строго, насколько возможно. Простой стол и кресла, одноцветные стены и единственный флаг Коммуны на стене позади кресла Покровителя. На противоположной стене висел простой экран для отражения слайдов с диапроектора. Сам проектор, чудо магитехнической инженерии, вероятно, был единственным предметом роскоши здесь, но учитывая частоту его использования, было бы глупо не использовать самое технологичное решение из доступных. По обеим сторонам стола рассаживалась дюжина грифонов – ближайшее окружение Алларда, истинные правители Коммуны.\n«...исчерпывающий список собственности и артефактов еще готовится, Председатель» – продолжил свою тираду один из членов Комитета – «работы над ним будут завершены через неделю, и он будет представлен членам этого пленума. Задержка связана с потерями от грабежа в ходе прошедшей кампании. Министерство инфраструктуры уже предоставило мне отчет о проектах, для которых пригодились бы поставки дополнительных материалов».\n«Отлично!» – похвалил выступавшего Аллард, быстро пробежавшись глазами по данному ему списку – «Утверждено. Как только завершится подсчет, запускайте план в действие. Мы воспользуемся всеми средствами. Этот проект также подействует как заявление: “Из остатков буржуазного прошлого, мы произведем инструменты коммунистического будущего!”»\n«Неужели это обязательно, Председатель?» – внезапно вклинился пожилой член Комитета – «Реликвии королевской эпохи мне самому не по душе, но все же они символизируют мощь Аквелии. Не говоря о том, что экономическая польза будет минимальна».\n«Избавление от тех, кто несет ответственность за недавние провалы и восстановление порядка заработали нам достаточно репутации среди народа» – добавил другой грифон – «и мы рискуем потерять ее, если продолжим заниматься непопулярными проектами. Мы должны достичь абсолютного спокойствия во внутренних делах, чтобы начать приготовления к войне против реакционеров в Грифонии. Не могли бы мы отложить этот проект до более спокойных времен?»\n«Вы призываете к эволюционному подходу?» – ответил Аллард, с ухмылкой – «Посчитаю нужным напомнить членам этого Комитета, что властители, памятниками чьих достижений служат эти здания и статуи, были реакционерами и монархистами, и что, сохраняя их, мы объявляем, что наша Революция – наследник гнилого государства, предшествовавшего ей. Откладывая проект, мы также рискуем создать прецедент для того, чтобы каждое вносимое предложение снималось с обсуждения до тех пор, пока временное правительство не станет постоянным. По-моему, все это я доходчиво объяснил в плане, с которым вы должны были ознакомиться. Продолжаем заседание».\nЧерез месяц, в Комитете было два новых члена..."
goy_pomovarra.23.a:0 "Здесь нет места реакционерам!"

goy_pomovarra.24.t:0 "Сумерки богов"
goy_pomovarra.24.d:0 "Нетерпимость режима Алларда к религии была широко известна. По большей части, это было вопросом политики, нежели веры; отказом от всех властей, которые могли существовать параллельно с государством. С каждым месяцем фанатичные коммунисты все чаще нападали на храмы, пока правительство не выпустило неожиданный декрет.\n«Почитание богов, духов и любых других сверхъестественных существ в Аквелийской Коммуне ограничено» – фактически запрещено – «Собственность храмов конфискована в пользу государства. Настоятели обязаны проследовать в лагеря переобучения. Храмовые комплексы подлежат сносу или переоборудованию для использования в светских целях – например, как складские помещения. Закон вступает в силу немедленно».\nПосле недавних чисток, ни одно общественное движение не смогло организованно противостоять новому закону. Однако, по всей стране прошла волна спонтанных протестов. Религиозные грифоны пытались защитить местные храмы от рейдов политической полиции, но вскоре их разогнали, и ситуация стабилизировалась – почти.\nМы получаем доклады о странных событиях. Резкие изменения в погоде, которые не могли объяснить, и на которые не могли повлиять ни пегасы-метеорологи, ни единороги-маги. Суеверные члены партии распускают слухи, что мы действительно обидели какие-то высшие силы, но этих контрреволюционно настроенных товарищей быстро разослали по лагерям переобучения вместе с настоятелями. А конце концов, чтобы добиться прогресса в деле освобождения пролетариата, мы должны избавиться от всей реакционной порчи в наших рядах!"
goy_pomovarra.24.a:0 "Даже боги не остановят Революцию!"

goy_pomovarra.25.t:0 "Проблески во тьме"
goy_pomovarra.25.d:0 "Все позабыли о маленьком подвале под старым складом. Его даже не было в плане здания, он был частью предыдущего строения. Раньше его использовали контрабандисты – а потом он снова был заброшен. Жан обнаружил его пару лет назад, подсчитывая остатки. И совсем недавно ему нашлось новое применение.\nПод покровом ночи в здание вошли грифоны в плащах. Несмотря на опасность, они встречались здесь раз в пару недель. Их группа состояла из несколько работников окрестных фабрик и складов, как Жан, членов их семей и друзей. В этом подвале они соорудили часовню. Символы трех богов висели на стене, все инструменты для проведения обрядов хранились в старом буфете. Жан приветствовал каждого верующего в ожидании прибытия главного гостя. Сегодня он опаздывал, и это беспокоило Жана. Обычно он приходил первым. Что если его поймала полиция? Несомненно, он бы умер под пытками, но не сдал группу. Но могли бы они сами перенести такой удар? Наконец, во тьме возник знакомый силуэт.\n«Простите за задержку. Мои смены продлили, а в наше время лучше не отлынивать...»\n«Я все понимаю» – ответил Жан – «Можем отложить–»\n«Нет. Я справлюсь. Ради них – и ради себя. Давайте начинать». Два грифона спустились в подвал. Опоздавший облачился в рясу, и вскоре служба началась. Он не был настоящим священником, вылетев из семинарии после трех лет обучения. Молодому грифону было тяжело следовать церковной морали... Это сыграло ему на лапу. Записи о его образовании были удалены, и политической полиции было не за что его взять.\nНо о лучшем священнике и мечтать не приходилось. Он согласился возглавить группу по просьбе Жана, его старого друга. И с тех пор, в этом маленьком подвале, он читал древние молитвы и проводил религиозные церемонии в полную меру своих знаний и сил.\n«Мы взываем к Троице за наставлением» – грифоны повторяли слова молитвы за священником – «Эйр, благослови нас стойкостью для преодоления мирских тяжб. Аркутрий, дай нам силу пройти испытания грядущих дней. Борей, освети тьму, окутавшую наши души. Мы взываем к вам, о, создатели рода грифоньего...»"
goy_pomovarra.25.a:0 "«...ведите и оберегайте нас»."

goy_pomovarra.26.t:0 "Великая чистка"
goy_pomovarra.26.d:0 "По всей Аквелии проходит снос исторических памятников, особняков и храмов. Под руководством агитаторов и при поддержке полиции, пролетариат разрушает все здания, определенные как “маяки реакционного прошлого”. Первыми пали дворцы и виллы богачей, после которых подошел черед остальных “буржуазных” зданий. В городах царил хаос; чересчур ревностные революционеры крушили все подряд, включая совершенно безобидные строения. Когда информация о разрушении нескольких военно-промышленных объектов достигла Министерства инфраструктуры, после формальной жалобы в Комитет на борьбу с эксцессами направили армию. Добытые в ходе действа материалы распорядились использовать в запланированных строительных проектах.\nВ следующие недели самопровозглашенные отряды “чистильщиков” ходили по домам в поисках всего, что им казалось контрреволюционным: картин, скульптур, книг, вычурной мебели – все это становилось топливом для гигантских костров, горевших на площадях. Так, в оргии массового уничтожения, режим Коммуны избавлялся от аквелийского прошлого. В музеях и галереях уцелели лишь те реликвии, которые могли пригодиться для разработки магического оружия. Каждая металлическая статуя ушла на переплавку, каждый драгоценный камень конфисковало государство, а все остальное подлежало сожжению. Многовековое наследие нации – уничтожено по приказу Великого Предводителя. Теперь ничто не могло замедлить марш пролетариата в светлое будущее."
goy_pomovarra.26.a:0 "Прошлое – в топку!"

goy_pomovarra.27.t:0 "Великая перековка"
goy_pomovarra.27.d:0 "«Прогресс, Жертва, Единство!»\nКрасные буквы поблескивали под дневным солнцем. Над ними – еще большая вывеска с одним словом:\n«Революция!»\nСегодня такие слоганы украшали каждое государственное здание по всей Коммуне. Возводились новые памятники, зачастую отображающие рабочих и солдат, убивающих чудовищных врагов Революции, с теми же словами на постаментах. Из офиса Ламберта открылся прекрасный вид на площадь, где проходили так называемые “сборы единства”. Толпы грифонов, многие из которых несли красные флаги, сошлись поглазеть на представление. Выступающий на подиуме, как дряной священник, читал выдержки из сборника сочинений “Покровителя Революции”. За этим следовал гвоздь программы: “Церемония самокритики”. Политические заключенные молили о пощаде, заявляя, что они осознали свои ошибки, и каясь о совершенных преступлениях против Коммуны, что привело толпу в приступ идеологического бешенства. Этот кошмар не беспокоил Ламберта. Он никогда не был верующим, а наблюдать публичное унижение контрреволюционеров ему было в радость... Только одно было ему не по душе.\nСлоган был написан не на аквелийском, а на новом “коммунарском языке”. Это была бредовая смесь всех основных языков Грифонии – по большей части, аквелийского и карфинского, с примесью герцландского. Над этим “новым языком для новых существ”, как его охарактеризовал Аллард на последнем съезде Комитета, несколько месяцев трудилась группа ведущих лингвистов Коммуны. Тогда Ламберт еле сдержал себя в лапах. Он справился, прекрасно зная, что ждет тех, кто перечит Алларду. Сейчас, сидя у окна, он читал доклад о запланированных изменениях, с которым он должен был ознакомиться перед грядущим заседанием. Каждая новая статья была возмутительнее прежней. Стало ясно, что “Покровитель” действительно собирался ввести этот, с позволения сказать, “язык” в обиход членов госаппарата и в школьную программу – в кратчайшие сроки! Помимо этого, Ламберт наткнулся на список одобренных государством имен для детенышей, начинающийся с “Карамарксы”... Доклад продолжался. Ламберту тяжело было даже представить, какой беспорядок скоро начался бы на госпредприятиях. Он тяжело вздохнул. Дела выходили из-под контроля. Не ради этого он вступал в Комитет. Чтобы отвлечься, советник выглянул в окно... И увидел, как двое грифонов вешают позади подиума огромный плакат с новым слоганом:\n«Смерть нациям! Одна Коммуна, Один Народ, Один Предводитель!»"
goy_pomovarra.27.a:0 "Внутри Ламберта что-то треснуло."

goy_pomovarra.124.t:0 "Восстание в Риле"
goy_pomovarra.124.d:0 "Все началось с малого: в приступе злобы молодой пони сорвал плакат на одной из площадей в Риле. Конечно, его немедленно скрутила полиция. Типичная сцена в наше время; очередного глупца уводят в тюрьму, где его скоро приговорят к смерти или отправят в трудовой лагерь, если судья сжалится. Одним реакционером меньше!\nОднако, народные волнения в Риле наблюдались уже довольно давно. Среди жителей города, в особенности пони, ранее активно поддерживавших власть короны, росло недовольство нашим правлением. Рила, некогда процветающий город, недавно впал в тяжкие времена. Разрушение Великого храма Арктурия закалило верующих и привело многих в тоску по “старым добрым дням” монархии, когда дела города шли в лучшем направлении.\nВышло так, что за новоиспеченного арестанта вступился прохожий. А вскоре к нему присоединился еще один, а потом еще один... Так, блюстители порядка оказались в окружении разъяренных грифонов и пони, которые в конце концов разорвали их на куски.\nВозможно, участники бы разошлись по домам в страхе перед возмездием, а полиция замяла бы дело. Но тогда один грифон, чье имя история не запомнила, забрался на фонарный столб и выкрикнул:\n«Мы все – живые мертвецы! Нас выследят и убьют за это! Я не буду ждать! Я приму смерть в бою, как подобает каждому истинному аквелийцу!»\nВоодушевленная группа направилась к отделу полиции, собирая все больше недовольных горожан на каждом перекрестке. К моменту достижения цели им уже не было числа. Полицейские даже не попытались сопротивляться толпе, а тут же сложили оружие...\nК концу дня над каждым из центральных районов города развевались флаги Аквелии. К народу присоединился даже местный гарнизон, обеспечив восстание оружием и властной структурой, которой ему не хватало. После этого мы полностью утратили контроль над городом..."
goy_pomovarra.124.a:0 "С этим срочно нужно разобраться!"

goy_pomovarra.125.t:0 "Чрезвычайный съезд Комитета"
goy_pomovarra.125.d:0 "«Весь город потерян. К повстанцам, пользующимся поддержкой всего населения, присоединились несколько полков гарнизона. Местное командование отвело остальные силы под Дилвен и запросило помощь» – Ламберт пересказал последние события членам Комитета – «Мы получили письмо от самоназванного “Свободного Правительства Рилы” со списком требований и приглашением на переговоры–»\n«Никаких переговоров!» – перебил его Аллард – «Выход на связь с ними подтолкнет к действию всех прочих реакционеров по стране. Любой акт терроризма против Коммуны должен быть подавлен насильно и в кратчайшие сроки, чтобы не допустить восстаний в будущем. Народ Рилы всегда был настроен реакционно – даже их толкование “республиканства” искажено и отравлено больше, чем у других. Прикажи расстрелять их посланника и свяжись с генералами. Рила должна быть захвачена, и мы должны удостовериться в том, что этот инцидент не повторится. Ты закончил?»\n«Да, председатель» – ответил Ламберт.\n«Хорошо. Можешь сказать самым жестоким офицерам, что они вольны “размягчать” оборону города, как им вздумается, – я полностью одобряю любые их действия. Этот город показал свою реакционную сущность, и было бы хорошо, если бы от него не осталось ни кирпичика...» – сказал Аллард, постучав когтем по столу. «Теперь, прошу меня простить, но у меня есть другие важные дела на сегодня. Съезд завершен». Аллард покинул комнату, а Ламберт взглянул на остаток доклада, который он не дочитал. Список требований повстанцев был краток: амнистия для них, отмена недавних “культурных законов”, свобода личных религиозных практик. Когда он поднял глаза, он увидел, что остальные члены Комитета расходятся. Несомненно, многие из них давно научились читать эмоции их начальника и в точности отражать их. Некоторые явно фанатично следовали за “Покровителем”. Но Ламберту показалось, что в глазах нескольких выходящих из комнаты мелькнуло нечто необычное: отвращение и страх..."
goy_pomovarra.125.a:0 "Пошли первые трещины..."

goy_pomovarra.127.t:0 "Личная оценка"
goy_pomovarra.127.d:0 "Хотя дым был заметен издалека, полную степень разрушений можно было увидеть только внутри города. Казалось, что ущерб затронул каждое здание в Риле; многие вовсе не уцелели. Ламберт прочитал отчеты военных; повстанцы решили биться до последнего грифона, и когда первое наступление на город провалилось, начался “беспорядочный обстрел”. В тексте были опущены мрачные детали, последствия которых он теперь наблюдал воочию. Его отправили для надзора за “уборкой” после операции. Покровитель не доверял генералам и решил заручиться “взглядом со стороны”. На въезде в город ужасное зрелище дополнили запахи; отвратительная смесь дыма, горящих и гниющих трупов и кислотная вонь остатков химического оружия и магических заклинаний, применявшихся для “усмирения” города. Ламберт не выдержал, высунул голову в окно и проблевался. Наконец, машина достигла “полевого штаба” генерала Дюваля, приписанного к рильской операции. В одном из немногих выстоявших обстрел зданий, похожем на бывший склад, кипела бурная деятельность. Отряды выходили на патрули по городу, пленных выстраивали в колонны и уводили для отправки в трудовые лагеря... Ламберт не мог не заметить их опустошенный взгляд – и солдат, и пленных. Как будто их что-то сломило, и теперь они действовали как роботы.\nЧерез некоторое время его привели к Дювалю. Генерал расположился в укромной комнате – вероятно, бывшем офисе управляющего. Ламберту в ноздри ударил запах табака. Габриэль Дюваль сидел, отклонившись на стуле, и глядел в окно, погруженный в свои мысли. Его отправили сюда в знак признания его таланта к организации, необходимого, чтобы превратить спешное отступление в новую атаку. Позже ему передали управление всей операцией. Прошла пара секунд, прежде чем Дюваль заметил посетителя."
goy_pomovarra.127.a:0 "..."

goy_pomovarra.130.t:0 "Правда в вине"
goy_pomovarra.130.d:0 "«Ах, прошу прощения, товарищ...» – извинился Дюваль, поправляя свою посадку – «Я... представлял себе кое-что. Помогает думать. Что привело вас в Рилу – или, вернее, в то, что от нее осталось?»\n«Вы должны знать, товарищ генерал. Вам отправили письмо, прежде чем я тронулся из столицы. Я здесь, чтобы лично оценить ситуацию в городе и процесс усмирения».\n«Да, точно» – пробормотал Дюваль – «Тут полно работы, но я прочитал письмо – как и мой... товарищ комиссар...» – на последней фразе его голос переменился – «Мы оба отправили в ответ детальные доклады. Организованное сопротивление подавлено. Мы лишь прибираемся».\n«А где же генерал-комиссар, если позволите спросить?»\n«Хм... Вероятно в паре миль отсюда, где ему никто не мешает выносить приговоры и комментировать мои отчеты». Неприязнь офицеров к системе декомптажа, согласно которой к каждому из них был приписан комиссар, ведущий надзор за их действиями и поддерживающий “идеологическую чистоту” солдат, была широко известна. «Я удивлен, что вы сейчас разговариваете не с ним, а рискнули прийти ко мне. Есть, пусть и ничтожная, но опасность нападения выживших бедолаг. Не хотите ли выпить, товарищ? Я нашел в этом столе бутылочку вина. Так что можем... отпраздновать победу!» Ламберт кивнул, подтащил ближайший стул поближе к столу и сел напротив генерала. Дюваль, перебрав все ящики стола, бросил искать второй бокал и, пожав плечами, налил посланнику вина.\n«Отбросим буржуазные манеры!» – пошутил Дюваль и принял свою дозу прямо из бутылки. Ламберт поднял бокал и попробовал вино. Вкус был... очень горьким и резким.\n«Буэ. Неудивительно, что эта бутылка выжила» – сказал Дюваль, отражая эмоции на лице посетителя. Должно быть, какая-то местная дешевка. Не узнаю этикетку. Хорошо, что нам пришлось сжечь виноградники по пути к городу, чтобы повстанцы не смогли укрыться в них. Надеюсь, мы пьем последнюю бутылку этой отравы».\n«Товарищ Аллард предложил снести все виноградники в стране» – поделился Ламберт меланхолично – «”Алкоголь затмевает умы пролетариев”, “земле есть лучшее применение”... или что-то вроде того – дальше я не слушал».\nДюваль переменился в лице, в глазах что-то мелькнуло, «Только не произнесите “что-то вроде того” в разговоре с моим сокомандиром. Он строго следит за правильной передачей слов Покровителя. Я более... гибкий – и тактичный. Таких как я немало в штабе – хотя по именам я их не перечислю. Как жаль, что мы, вероятно, наслаждаемся последними частицами буржуазных излишеств, которые так здорово поднимают дух. Позвольте спросить, товарищ: вы так же разборчивы в вине, как и мы?»\nЛамберт моргнул, таращась на генерала, и запрокинул бокал."
goy_pomovarra.130.a:0 "Вкус вина заиграл новыми нотками."

goy_pomovarra.28.t:0 "Убийство Империи"
goy_pomovarra.28.d:0 "Аллард решил лично посетить Грифенхейм, чтобы наблюдать за процессом усмирения Герцланда. По плану, предстояла инспекция новых региональных администраций и штаба Военного командования Герцланда, расквартированного в бывшей имперской столице. Хотя он предпочел бы и дальше управлять всей операцией из Аквилы, некоторые грифоны попросту действовали более эффективно, когда они понимали, что Великий Предводитель лично интересуется их деятельностью. Не говоря уже о том, что ему представилась возможность сравнить предоставленные ему доклады с реальностью. До сих пор он был доволен. Длинный список конфискованных владений знати с именами их казненных владельцев, заключение поиска мест, подходящих для лагерей переобучения, и список подлежащих сносу достопримечательностей, предоставленные новой администрацией, были исчерпывающими. Дальше его провезли по городу, показав процесс демонтажа символов умершей Империи с фасадов зданий.\nОставалось лишь одно: разобраться с ее последним Императором. Без сомнения, его следовало казнить. В принципе, одна грифонья жизнь ничего не стоила, но жизнь Гровера бал куда важнее. Когда один из офицеров выразил беспокойство о реакции местных на казнь детеныша (Аллард тогда запомнил, что его нужно будет перевести в штрафную бригаду), он ответил просто: кем бы Гровер ни был; грифенком, старым пони или белкой – он оставался символом реакционного режима, и потому его следовало уничтожить.\nВ дальнейших обсуждениях или визиту во дворец для разговора с последним Императором Грифонии не было никакого смысла. Сам Гровер не представлял интереса для Алларда, и встреча с ним наверняка бы оказалось пустой тратой ценного времени."
goy_pomovarra.28.a:0 "Казнь назначили на следующую неделю."

goy_pomovarra.29.t:0 "Символы Империи"
goy_pomovarra.29.d:0 " Аллард решил лично посетить Грифенхейм, чтобы наблюдать за процессом усмирения Герцланда. По плану, предстояла инспекция новых региональных администраций и штаба Военного командования Герцланда, расквартированного в бывшей имперской столице. Хотя он предпочел бы и дальше управлять всей операцией из Аквилы, некоторые грифоны попросту действовали более эффективно, когда они понимали, что Великий Предводитель лично интересуется их деятельностью. Не говоря уже о том, что ему представилась возможность сравнить предоставленные ему доклады с реальностью. До сих пор он был доволен. Длинный список конфискованных владений знати с именами их казненных владельцев, заключение поиска мест, подходящих для лагерей переобучения, и список подлежащих сносу достопримечательностей, предоставленные новой администрацией, были исчерпывающими. Дальше его провезли по городу, показав процесс демонтажа символов умершей Империи с фасадов зданий.\nРазрушение Имперского Дворца было спланировано заранее, но командующий сносом распорядился приостановить работы до прибытия Покровителя. Аллард отчитал офицера за самодеятельность и задумался было о его переводе в штрафную бригаду, но все же передумал пускать в расход полезного работника. И как он додумался отклониться от заранее подготовленного плана ради шоу для посетителя? Вопреки плану, Алларду довелось наблюдать за подрывом. Бам! Значительная часть здания развалилась с жутким грохотом. Глядя на падающие стены, Покровитель Революции легонько улыбнулся. Воистину, это было подходящим ознаменованием достижения его первой цели..."
goy_pomovarra.29.a:0 "...но впереди его ждало большее!"

goy_pomovarra.30.t:0 "Восстание в Бронзхилле"
goy_pomovarra.30.d:0 "Срочные новости из Бронзхилла! Эта бывшая провинция Империи, населенная алмазными псами, – известный оплот роялистов. Последние события привели местных в бешенство, наверняка, не без подстрекательства реакционных политиков. Регион, испещренный горами, с самого начала был полон подозрительной активности, но теперь мы имеем дело с массовым восстанием. Партизаны, пользуясь всеобщей поддержкой местного населения, быстро разгромили гарнизон и взяли большую часть региона под свой контроль. Предположительно, это станет пиком их успеха, поскольку наши регулярные части уже выдвинулись на борьбу с повстанцами. Командования КРА запросила разрешение на план усмирения под условным названием “Проходчик”. В распоряжение отправленных воинских частей передано достаточно химического оружия, чтобы разобраться с чрезвычайно устойчивым ко всем формам коммунистического переобучения населением."
goy_pomovarra.30.a:0 "Утверждено!"

goy_pomovarra.31.t:0 "План “Проходчик”"
goy_pomovarra.31.d:0 "«Дивизии третьей, пятой и седьмой армии Коммуны вошли в Бронзхилл с юга и запада, выметая все отряды сопротивления из нижних земель. Командование КРА отказалось от прямого наступления на укрепленные позиции повстанцев в городе Равенсбург. По предложению комиссара Мерле, был произведен обстрел жилых частей города зажигательными боеприпасами».\nГород горел три дня. Последовавшие обстрелы разрушили районы, прилегавшие к промзоне, чтобы огонь не перешел на нее. Местные тщетно боролись с пожарами, пока артиллерия коммунистов продолжала обстрел. Наконец им пришлось сдаться и бессильно смотреть за тем, как их родной город пожирает огонь. По крайней мере, они успели эвакуировать большинство гражданских в горные пещеры, где они были в полной безопасности... На четвертый день, в подземном бункере, выжившие офицеры решили, что они предпочтут умереть в бою, нежели сгореть заживо. Так, последние защитники выдвинулись в безнадежное наступление на пулеметы коммунистов. Бешеные грифоны и псы, выходящие из плотного дыма, походили скорее на демонов, чем на обычных смертных...\n«После осады Равенсбурга армия продвинулась вглубь и окружила подземные города Бронзхилла, куда алмазные псы эвакуировали оружие, припасы и большую часть населения. Через обнаруженные вентиляционные отверстия и дополнительные точки входа, созданные военными инженерами, было запущено химическое оружие».\nИх смерть приближалась медленно; по залам подземного города Каза-Гул продвигалось облако ядовитого газа. Коммунисты действовали методично. Пока псы пытались изолировать отравленные секции города, аквелийские инженеры открывали все новые и новые проходы, по которым спускался газ. За несколько часов город, некогда полный жизни, превратился в склеп. Его подземные залы теперь населяли трупы, лежащие в искривленных, неестественных позах.\n«Выжившие повстанцы отбили смогли отбить последовавшее наступление наших сил и обрушили несколько подземных секторов, содержавших промышленную технику и драгоценности».\n«Исчадия Тартара!» – проревел большой пес через противогаз, его единственное спасение от верной смерти, – «Им нет конца! Столько потерь, а они все лезут!»\n«Они пришли за сокровищами... Они не только убьют нас, но и украдут наши богатства, чтобы продолжать нести страдания всем народам континента» – угрюмо заключил его соратник-грифон.\n«Тогда мы заберем богатства с собой в могилу! Вызови лейтенанта Шварца и скажи ему тащить к западной колонне столько взрывчатки, сколько найдет. Мы не оставим им ничего!»\n«План “Проходчик” успешно завершен. Все центры сопротивления подавлены. Оставшиеся ячейки повстанцев ведут партизанскую войну в горных районах, но не представляют угрозу для местного гарнизона и будут уничтожены в ходе следующей фазы операции».\nВиктор Аллард дочитал доклад и положил его поверх растущей горы документов на столе."
goy_pomovarra.31.a:0 "Одной проблемой меньше."

goy_pomovarra.32.t:0 "Планы сыпятся"
goy_pomovarra.32.d:0 "«Это безумие!» – как удар молота по наковальне раздался крик одного из членов Комитета. Грифон бросил папку с документами, озаглавленную «Военный План Элар», на стол. «Мы не в силах запустить полноценное вторжение в Зебрику. Пусть даже ограниченное – все равно не можем! Я читал доклад. Тот же, который выдали вам!» Остальные комитетчики молчали, как будто в шоке от честности говорящего. Причина выпада была ясна: Виктор Аллард не был рядом – он проводил смотр коммунарского флота в Прайдее. «Речные Земли еще далеко не “усмирены”. Если мы не разбомбим буквально все холмы и леса там, нам потребуются годы – если не десятилетия – чтобы разобраться с партизанами. Не говоря о сопротивлении в грифонских территориях. Нельзя же выжечь дотла каждый мятежный город...» На этих словах грифон замолчал, осознав, что будь Покровитель рядом, он бы высказал ровно противоположное мнение. Через секунду бедняга понял, что он натворил. Минуту назад он был живой птицей. Теперь – пока еще дышащей и ходящей, – но, во всех отношениях, уже мертвой. Его когти неудержимо тряслись.\n«Кхм...» – прочистил горло другой член Комитета – «Предлагаю не включать это в протокол съезда и перейти к следующей теме – плану по повышению выработки военных заводов в подготовке ко вторжению...»\nК следующему съезду численность Комитета сократилась..."
goy_pomovarra.32.a:0 "Мертвецам нечего терять..."

goy_pomovarra.126.t:0 "Спасение прошлого"
goy_pomovarra.126.d:0 "На побережье Астериона было полно укромных бухт. Эти неприметные места редко посещались кем-либо, кроме местных. Веками они служили пристанищами для морских бандитов – таких как Константинос, в юности занимавшийся контрабандой. С тех пор прошло много лет, и он думал, что оставил эту часть своего прошлого позади, но сейчас его старые навыки и контакты снова стали полезны – но теперь он на этом не зарабатывал...\nНебольшая команда минотавров с огромными баулами на спинах тихо продвигалась по заросшим горным тропам. Даже для матерых быков это был тяжкий переход, но именно из-за этого здесь редко проходили патрули захватчиков. Преодолев последний холм, Константинос окинул взглядом темное пространство у подножия горы – заветную бухту. И посреди нее – тусклый огонек... Бывалый контрабандист тихо выругался и движением руки поторопил товарищей. Придется ускориться.\nУ берега стоял катер. Высокая гарпия курила, облокотившись на борт. Когда Константинос откашлялся, птица подпрыгнула, выронив сигарету.\n«Какого д–» – закричала она, пытаясь достать пистолет дрожащими лапами... Пистолет грохнулся на палубу.\n«Успокойся, пока тебя не хватил удар, Педро. И, ради богов, не смей курить! В такой тьме любой источник света виден за милю, а у грифонов зрение острое. Ведь ты это знаешь».\n«Конечно, хорошо» – промямлила гарпия.\n«Ничего хорошего в том, что тебя казнят – без суда и следствия. Ладно, не важно. У нас для тебя груз».\n«Что на этот раз?» – спросил пришедший в себя Педро.\n«Книги из библиотеки Просперо...» Константинос сжал кулаки. Грифоны сожгли ее дотла... К счастью, они не знали о катакомбах, куда местные успели перенести часть книг перед сдачей города.\n«Понятно. Отвезу их тем же минотаврам, что и в прошлый раз». Старые партнеры молча наблюдали за погрузкой баулов в трюм.\n«Знаешь, я мог бы и вас подвезти до Зебрики. В Астерионе теперь тяжело вести дела... Вообще тяжело жить» – внезапно сказал Педро – «плату не возьму – по старой дружбе».\n«Ты впервые решил сделать что-то не за деньги» – минотавр рассмеялся – «Осторожно: если так пойдет, ты скоро запоешь о магии дружбы... Нет. Спасибо за предложение, но у нас здесь еще много дел».\n«Каких? Спасение старых пыльных книжек?»\n«Спасение нас. Нашей культуры. Без нее мы станем рабами спятившего диктатора. Существами без прошлого и будущего... Поверь, я прочитал их манифест, и в это они хотят нас превратить – как и всех остальных. Я не позволю им это сделать... Тебе нельзя задерживаться. Попутного ветра, Педро!»\nОтплывая из бухты, капитан скромного судна наблюдал за минотаврами, уходящими в лес. Береговой охраны он не боялся – он уже годами обводил их вокруг когтя. Но его глодала тревога... Ему казалось, что этой ночью он встретил старого друга в последний раз."
goy_pomovarra.126.a:0 "Прощай, приятель..."

goy_pomovarra.120.t:0 "Сожжение родного дома"
goy_pomovarra.120.d:0 "Грифонстоун опустел. Захватив город, коммунисты вывезли все население. Отнюдь не все пережили этот изнурительное действо. Некоторые сопротивлялись, за что были расстреляны на месте. Другие умерли от голода в поездах. Теперь в городе обитали лишь те немногие, кому удалось скрыться от военных в лабиринте его домов, на ветках Великого Древа и в туннелях под землей, и грабители – дезертиры из КРА и обычные бандиты, борющиеся за остатки городских богатств. Над Грифонстоуном нависла тяжелая аура. Со всех сторон вокруг него располагались солдаты. Но за ощутимыми знамениями надвигающейся беды как будто скрывалось нечто сверхъестественное.\nВеликое Древо было поистине огромным, и как сказал бы любой мало-мальски способный волшебник, оно содержало мощную магию. Уничтожить его было бы очень сложно. Несмотря на это, план сноса был одобрен, слабые точки найдены и тщательные приготовления завершены. Чтобы избежать магической катастрофы, армии были выделены только стандартные боеприпасы. Обстрел длился часами. Сотни артиллерийских орудий поливали Великое Древо разрывными и зажигательными снарядами. Когда цель наконец загорелась, над всем Грифонстоуном возникло облако дыма. В этот момент несколько магов, присланных для надзора за операцией, потребовали начать отступление, заявив, что течение магических энергий нарушилось и начало влиять на реальность, указывая на неестественно высокую частоту неполадок в работе орудий, включая спонтанные взрывы на артиллерийских позициях, приведшие к гибели нескольких батарей. Но командир отказался сдаться. Как будто в трансе, он заявил, что отступление «из боя с проклятым деревом» посрамило бы всю Революцию и ее воинов.\nПриближалась ночь, когда раздался треск, настолько оглушительный, что и так почти оглохшие артиллеристы прекратили заряжать снаряды в пушки. Тысячи солдат застыли, наблюдая за тем, как падает Великое Древо. С некоторых позиций раздались счастливые возгласы.\nЗемля сотряслась, когда ее коснулись первые ветви, и гора, на которой оно стояло, начала осыпаться. Ближайшие позиции артиллерии завалило камнями и горящими обломками, а команды дальних орудий отбросило внезапными толчками. К концу стихийного бедствия вся собравшаяся армия пришла в полный беспорядок, но их задача была выполнена.\nГрифонстоун был стерт с лица земли.\nВдали одинокая фигура в плаще наблюдала за судьбоносным событием. Огромный костер из обломков древа не осветил тьму под ее капюшоном. Существо тихо рассмеялось, как будто от смеси счастья и страха... Потом, пока никто не заметил ее, фигура в плаще исчезла..."
goy_pomovarra.120.a:0 "Грифоны выбрались из колыбели!"

goy_pomovarra.33.t:0 "Неожиданный конец"
goy_pomovarra.33.d:0 "Обстановка личного кабинета Виктора Алларда следовала той же философии, как и все остальные комнаты, в которых он работал. Простота, строгость, эффективность. Настенные полки заполняли папки – все отмеченные по системе, которую понимал только он сам. Горы бумаг на огромном столе выглядели беспорядочно на первый взгляд, но в их раскладке была некая внутренняя логика – и Виктор не потерял ни одного документа, над которым работал. Широкая доска напротив стола была исписана словами, символами и чертами, отражающими какие-то мысли, приходившие к нему при разработке государственных планов. Все выглядело так же, как в тот день, когда он уехал в Прайдею. Поездка выдалась скучной и вызвала у него уйму недовольства. Многие из докладов Адмиралтейства выдавали желаемое за действительное. На деле, подготовка ко вторжению на Эквус и Зебрику была далека от завершения. Первым делом, естественно, нужно было запустить полноценное расследование дел флота и наказать виновных в его неподготовленности. В голову пришел вопрос для повестки сегодняшнего съезда Комитета. Хотелось бы надеяться, что его подчиненные придумают способ быстро повысить готовность вооруженных сил...\nВиктор сел за стол и открыл замок ящика, где хранился графин с водой. Он налил себе стакан и поднес его к клюву. Вдруг, он задумался; в таком ли положении стоял графин перед его отъездом? Он отбросил мысль. Переутомление играло с ним злые шутки, вызывало беспокойство... Все же он давно здесь не был, и единорог-маготехник уверил его, что любой яд, добавленный в графин, превратится в безобидную воду... Успокоившись, Виктор осушил стакан. Следующие несколько минут он читал запоздавшие доклады...\nИ тут его настиг приступ такой боли, как будто все его внутренности пожирал огонь. Он понял, что его насторожило – это стакан был не на своем месте! Какая-то сволочь отравила стакан! Он потянулся к тревожной кнопке под столом... Но его лапы как будто отяжелели... Через секунду Покровитель Революции упал со стула."
goy_pomovarra.33.a:0 "Только не сейчас! Еще столько дел!"

goy_pomovarra.34.t:0 "Судьбоносный съезд"
goy_pomovarra.34.d:0 "«На сегодняшнюю встречу я вызвал генерала Дюваля. Он представит доклад о готовности Освободительного Корпуса Зебрики и ответит на любые вопросы, какие у вас возникнут» – заявил Ламберт. Упомянутый офицер кивнул – «Председатель Аллард был оповещен три дня назад и одобрил его прибытие–»\n«Кстати о нем,» – вклинился другой член Комитета – «где Аллард? Он вернулся в Аквилу утром, и он еще никогда не опаздывал на съезды!» В комнате повисло неловкое молчание. Генерал Дюваль рассматривал одного политика за другим. Он гордился своей проницательностью, но собравшиеся здесь были опытными лицемерами – под страхом смерти хорошо научившимися скрывать свои намерения. Тем не менее, он чувствовал... облегчение в воздухе.\n«Да, такого раньше не бывало» – пробормотал один из самых первых членов Комитета с таким видом, будто опоздание Алларда поразило его сильнее, чем если бы сейчас в середину комнаты спустился с небес Борей – «Быть может, возникло срочное дело, требующее его внимания...» Из коридора донесся топот, и через секунду в комнату ворвался перепуганный охранник.\n«Уважаемые комиссары, Покровитель мертв!» – крикнул он– «Он там, на полу. Я тут же вбежал к нему, но он уже не двигался! Что нам делать?!»\n«Успокойся!» – Дюваль чуть повысил голос – «Соберись, солдат! Докладывай четко!»\n«Да, мсье генерал...» – простая команда привела гвардейца в чувство – «Секретарша принесла документы Председателю Алларду в пять, как обычно. Потом она закричала, что он мертв. Я и ефрейтор Соколь вошли в комнату и увидели его на полу без сознания. Я побежал прямо сюда, чтобы доложить об этом».\n«То есть, вы не проверили, действительно ли Председатель “мертв”? Может, он в обмороке?» – уточнил генерал.\n«Нет, мсье, я...» – начал мямлить солдат.\n«Идиот...» – Дюваль вздохнул – «Товарищи, мы должны сами разобраться в происходящем – чем быстрее, тем лучше» – он повернулся обратно к охраннику – «А ты беги во двор и скажи моим солдатам подготовить машину, если придется ехать в госпиталь»."
goy_pomovarra.34.a:0 "«Да, мсье генерал!»"

goy_pomovarra.35.t:0 "Расплата"
goy_pomovarra.35.d:0 "Тринацдцать грифонов встали толпой у входа в кабинет Великого Предводителя, как будто боясь, что первый вошедший умрет на месте. Все было, как описал гвардеец: Аллард лежал на полу за своим столом. Только через минуту кто-то заметил... «Он дышит!» – крикнул один из комитетчиков, указывая когтем. Как если бы это заявление сняло с грифонов чары, они ввалились в комнату и окружили Алларда.\n«Наверно, его хватил удар» – высказался один из пожилых.\n«А может, инфаркт» – добавил еще более старый.\n«Что бы это ни было, ему срочно нужно в больницу! Наверняка, единорог-доктор поможет ему. Генерал Дюваль, вы отдали приказ готовить машину. Где–»\nВ этот момент где-то в лабиринте коридоров прозвучали выстрелы. В комнате повисла гробовая тишина. Грифоны обменивались взглядами; непосвященные осознали, что происходит.\n«Да,» – спокойно сказал Ламберт – «Инфаркт. Хорошая мысль. К сожалению, Покровитель умер до прибытия медиков. Какая жалость. Величайшая потеря для всей Коммуны...»\n«Тебе это с лап не сойдет» – прошипел самый ревностный приспешник Алларда – «этот военный переворот–» Услышав это, упомянутый военный достал револьвер и выстрелил. Фанатик упал замертво.\n«Благодарю, генерал Дюваль» – сказал Ламберт, любезно улыбаясь...\nВнезапно Аллард открыл глаза. Все застыли как кролики перед голодным волком. Покровитель окинул собравшихся взглядом полным ярости и презрения. Он попытался что-то сказать, но вышло только невнятное бульканье. После этого его глаза наконец остекленели.\n«Разумеется, правда никогда не покинет эту комнату» – продолжил Ламберт – «солдаты генерала Дюваля проводят чистки среди военного персонала» – он опустил тот факт, что от этих солдат тоже потом избавятся – «и официальные похороны будут проведены в ближайшее время. Предлагаю спланировать их на следующем съезде»."
goy_pomovarra.35.a:0 "Революция поглотила своего отца..."

goy_pomovarra.36.t:0 "Наследие революционера"
goy_pomovarra.36.d:0 "Сотни тысяч тихо праздновали кончину Виктора Алларда. Это были узники трудовых лагерей, те, кто потерял друзей и близких в ходе войн и чисток, те многие существа, притесненные коммунарскими законами... Но миллионы скорбели в этот день. Для них Аллард был кумиром, предводителем и главным символом их Революции. Как они могли идти дальше без него? Кто теперь будет освещать им путь вперед? Казалось, что культ Алларда станет только шире после его смерти, чем при жизни. Его “преемники” позаботятся об этом.\nДля тела Алларда возвели гигантский мавзолей. Исполин из стали, мрамора и бетона возвышался над всеми зданиями в Аквиле, безмолвно превознося память о Покровителе. По обеим сторонам от похоронной процессии стояли толпы плачущих граждан. В некоторых местах полиция и военные не справлялись с удержанием постоянно растущего числа скорбящих, стремящихся приблизиться к гробу. После церемонии в новостях объявили о том, что дюжину грифонов раздавили в толпе.\nТело в стеклянном гробу возложили на пьедестал в главной комнате мавзолея, чьи широкие залы украшали картины и барельефы, посвященные величию Революции и ее многим победам. В коридорах размещались скульптуры, изображающие победоносных солдат и ликующих рабочих. Ни один король или император не мог похвастаться более великолепной усыпальницей.\nКонечно, его убийцы участвовали в похоронах, уже планируя свои следующие действия. В их лапах было наследие Алларда, и они должны были воспользоваться им по полной. Покровитель сделал много заявлений за свою жизнь, и отредактировать записи большинства его речей было бы легче легкого. Он сам стер столько памяти о прошлом, что дополнительные изменения проскользнули бы совершенно незаметно. Единственным, кто мог бы этому противостоять, был сам Аллард – и он был мертв. Вина за все ошибки и провалы ляжет на плечи осужденных товарищей, чтобы память о Великом Предводителе осталась чистой – и всегда готовой к использованию для подавления любой критики."
goy_pomovarra.36.a:0 "В смерти он полезнее, чем при жизни!"

#goy_pomovarra.37 hidden

goy_pomovarra.38.t:0 "Выбор военной доктрины"
goy_pomovarra.38.d:0 "То, что мы называем “нашей армией” по факту является сборищем полунезависимых групп партизан, ведомых по большей части офицерами-самоучками. Те из них, кто имел удовольствие получать высшее образование в заведениях имперской или аквелийской армии, только и говорят об отставке и пенсиях. Возможности таких вооруженных сил... по большей мере слабые. Хотя они хорошо послужили в борьбе с бандитами Райхера ввиду неспособности противника подстраиваться под нашу постоянно меняющуюся тактику ведения боя, теперь, когда нам приходится участвовать в настоящих войнах, это преимущество становится бесполезным. Из-за конфликтов между командирами, нехватки единого устава и выстроенной иерархии, наши силы представляют из себя неуправляемую вооруженную толпу. Все условно согласны с тем, что этому пора положить конец и провести реформы в Помоваррской Освободительной Армии. Но какие? Есть несколько различных предложений.\nПервый вариант – это следование примеру Рейхсармии, самой многочисленной вооруженной силы в Грифонии, под чьим влиянием сформировалось большинство государственных армий на континенте. Хотя это предложение простейшее в реализации, оно сделает нашу армию по естеству оборонительной.\nИзвестнейший командир партизанских войск Морван Ренан вместо этого предлагает использовать наш нестандартный подход к войне как основу доктрины высокомобильных агрессивных подразделений, способных обходить противников с фланга. Его главный аргумент заключается в том, что нам не победить другие страны Грифонии лобовыми атаками из-за их численного превосходства.\nКак третий подход, предлагается развить имеющуюся “доктрину” в нечто более работоспособное, сохраняя ее лучшую особенность – автономность полевых командиров, но подчинив их объединенному командованию и стандартизировав устав и снаряжение. Это даст нашей армии прежде невиданную адаптивность."
goy_pomovarra.38.a:0 "Возьмем пример с Рейхсармии."
goy_pomovarra.38.b:0 "Последуем совету Ренана."
goy_pomovarra.38.c:0 "Смерть от тысячи порезов!"

goy_pomovarra.39.t:0 "Новые ружья для новой армии"
goy_pomovarra.39.d:0 "Снаряжение наших вооруженных сил – полная эклектика. В ходу все – от старых охотничьих ружей до того, что оставили за собой аквелийские военные и всякой контрабанды из разных стран и эпох. Но теперь в процессе стандартизации военного снаряжения высшее командование выставило заказ на винтовки нового типа для пехоты. Два проекта прошли в шорт-лист: первый – продвинутое самозарядное ружье, явно разработанное под впечатлением от чейнджлингского оружия (только боги знают, как оно попало в лапы конструктора), и второй – простая болтовая винтовка, фактически доработанная версия старой аквелийской модели. Очевидно, что хотя первый вариант технологически превосходит второй, его будет намного тяжелее производить и обслуживать, что делает его плохим кандидатом для массового производства."
goy_pomovarra.39.a:0 "Но как же первый вариант хорош!"
goy_pomovarra.39.b:0 "Давайте придерживаться классики."

goy_pomovarra.40.t:0 "Помоваррская железная дорога"
goy_pomovarra.40.d:0 "Наши южные соседи из Помоварры дали нам интересное предложение. Их внешнюю торговлю душит Фловена, и они хотят обойти Город садов с помощью открытия железной дороги к Иглтону, нашей столице. Помоварцы обещают покрыть все расходы на строительство и передать нам часть дороги, которая окажется внутри наших границ. Очевидно, что это щедрое предложение положительно скажется на росте нашей экономики за счет повышения торговой активности между нами и Помоваррой. Однако, некоторые советники предупреждают, что в случае конфликта с Помоваррой эта дорога может быть использована для поддержки вторжения на нашу территорию."
goy_pomovarra.40.a:0 "Сделка!"
goy_pomovarra.40.b:0 "Отказ!"

goy_pomovarra.41.t:0 "Аделарт утвердил сделку"
goy_pomovarra.41.d:0 "Аделартское правительство согласилось на наше предложение, и наши строители уже приступили к проложению железной дороги между государствами. Скоро откроется новый торговый путь на север!"
goy_pomovarra.41.a:0 "Колоссальный успех!"

goy_pomovarra.42.t:0 "Аделарт отклонил предложение"
goy_pomovarra.42.d:0 "Противные аделартцы отказались от нашего щедрого предложения, указывая на нераскрытую “угрозу безопасности” как причину. Ну что за толпа неблагодарных идиотов!"
goy_pomovarra.42.a:0 "Они поплатятся за это!"

goy_pomovarra.43.t:0 "Новое направление Фловены"
goy_pomovarra.43.d:0 "Фловена, Город садов, промышленный, экономический и культурный центр Западной Грифонии. Теперь, получив контроль над ним, мы можем использовать богатства города в нашу пользу. Очевидным выбором было бы позволить производимым во Фловене предметам роскоши свободно идти во внутренний и иностранные рынки – естественно, с денежной прибылью для нас. Однако, также поступают предложения о сосредоточении сил на расширение городских плавильных предприятий и тяжелой промышленности или переоборудовании ее на службу вооруженным силам. Мы должны избрать наилучший подход."
goy_pomovarra.43.a:0 "Предметы роскоши."
goy_pomovarra.43.b:0 "Тяжелая промышленность."
goy_pomovarra.43.c:0 "Военная промышленность."

goy_pomovarra.44.t:0 "Пшено и вино"
goy_pomovarra.44.d:0 "В рамках схемы экономического развития мы сосредоточились на улучшении национального земледелия. Программа уже привела к прорыву. Наши фермеры с энтузиазмом принимают на вооружение новые методы посадки, продвинутую технику (лишь с парой случаев нападения ретроградов на тракторы) и химические удобрения. С развитием производства сверх наших нужд, нам стоит хорошенько подумать, куда дальше направить силы и средства. Разумеется, полезно было бы еще сильнее нарастить производство пшеницы, картофеля и прочих съестных продуктов для обеспечения продовольственной безопасности. Однако, также есть возможность поддержать давние традиции виноделия (несмотря на то, что вредные аквелийцы считают наши вина некачественными) и возделывание более дорогих растений вроде оливок, цитрусов и табака, экспорт которых принесет дополнительные средства в экономику."
goy_pomovarra.44.a:0 "Пшено!"
goy_pomovarra.44.b:0 "Вино! *Ик!*"

goy_pomovarra.45.t:0 "Суд начинается"
goy_pomovarra.45.d:0 "Не может быть сомнения в том, что лакеи Райхера обязаны предстать перед судом – равно как и в том, что меры пресечения будут жесткими. Однако, в списке коллаборационистов, военных преступников и всех прочих, кто извлекал выгоду из наших страданий под его властью, встречаются некоторые... необычные существа. Грифоны, тесно связанные с процветающим черным рынком, чьи знакомства и влияние могут оказаться очень полезными для нас... Они буду рады помочь нам, если мы их помилуем. Конечно, идеалисты в нашем движении заявляют, что нельзя проявлять снисходительность к тиранам и предателям, и что для нас необходимо построить государство с нуля и очистить общество от этих нежелательных элементов. Однако, нам безусловно понадобится любая помощь в борьбе с заклятыми врагами..."
goy_pomovarra.45.a:0 "Правосудие превыше всего!"
goy_pomovarra.45.b:0 "Давайте договоримся..."

goy_pomovarra.46.t:0 "Не жалейте денег на заказное убийство"
goy_pomovarra.46.d:0 "Антуан не любил работать с так называемыми “борцами за свободу”. Ослепленные идеологией, они всегда пытались отвертеться от своих обязательств, а если не могли, то платили медленно и плохо. Оказывается, на революции не наживешься. Сначала он даже хотел отказаться от этой работы. Раньше было полно бизнесгрифов, желающих избавиться от конкурентов, и секретных служб, ищущих “подрядчиков” для грязной работы. За такое платили хорошо. Но теперь все они как будто заболели магией дружбы. Ни одной лучшей работы он найти не смог, а деньги нужны были срочно.\nЗадача была проста: выследить и застрелить одного грифона. Заказчик предоставил информацию о том, что цель направлялась к определенному госпиталю – Антуану оставалось только подыскать надежное укрытие. Он определил, по какой дороге будет двигаться цель, чтобы добраться до госпиталя, – там она будет как на ладони. Уже час Антуан ждал на чердаке заброшенного дома. Через пятнадцать минут небольшая колонна машин выехала на улицу. Они были полны солдат, явно указывая на беспокойство цели... которую он вскоре нашел в средней машине. Антуан прицелился... но не стал стрелять. Его терзали сомнения. С таким множеством солдат, он сильно рисковал. Они бы тут же бросились искать его – и даже если бы он смог сбежать, не было никакой гарантии, что заказчик сдержал бы слово. Грифоны в его профессии умели быстро оценивать характер, поскольку многие работодатели предпочитали обрубать концы – избавляться от наемных убийц после выполнения миссии. Этот “Морель” походил именно на такой тип заказчика.\nНо ему очень нужны были деньги... В голову взбрела шальная мысль: сколько бы заплатила цель, если бы он предложил противоположную сделку. Это было чертовски рискованно, но могло спасти ему жизнь. Решать нужно было немедленно, ведь машина могла уйти с линии огня в любой момент..."
goy_pomovarra.46.a:0 "БАХ!"
goy_pomovarra.46.b:0 "Надеюсь, проканает..."

goy_pomovarra.47.t:0 "Элегия"
goy_pomovarra.47.d:0 "На похороны Хармана Камриза собрались толпы. Тысячи грифонов пришли почтить уход героя революции. Среди них был и Морель, не имевший никакого почтения к своему павшему противнику. Все же он был обязан соблюдать правила приличия. Без Камриза, внутренние противоречия начали раздирать одну из сильнейших фракций освободительного движения на меньшие группы, с некоторыми из которых было бы легко договориться – временно. Позже Морель и от них бы избавился. Но сейчас выдался момент, когда он мог просто наслаждаться победой, скрывая удовольствие под видом скорби. Судя по реакциям окружающих, они ничего не подозревали. Наконец пришло время самой долгой и утомительной части похорон: речей от всех значительных посетителей. Некоторые из них говорили искренне, другие явно прибыли сюда, только чтобы продвинуть свои политические убеждения. Морель выступал послденим.\n«Мои дорогие земляки уже многое сказали о многочисленных благодетелях и героических поступках нашего павшего товарища – мне нечего добавить. И все мы знаем, как отважно сражался Камриз. Мы никогда не были друзьями, мы много вздорили, но я всегда уважал его за непреклонную преданность делу освобождения Помоварры. Быть может, мы никогда не узнаем, кто убил его...» – хотелось надеятся, что бомба, заложенная в портфель с деньгами, забрала исполнителя на тот свет, и никто больше не смог бы раскрыть тайну – «...но тот, кто это сделал, хотел разделить и ослабить нас. Вопреки этому, мы все продолжим воплощать в реальность мечты и надежды нашего погибшего брата – и всех остальных, кто пал в этой войне, - мечту о свободной, единой и сильной Помоварре. Харман Камриз умер...»"
goy_pomovarra.47.a:0 "«...но Помоварра живет!»"

goy_pomovarra.48.t:0 "Самое неожиданное предложение"
goy_pomovarra.48.d:0 "Сказать, что Харман Камриз был поражен, было бы огромным преуменьшением. Все время, пока он слушал грифона, напросившегося на аудиенцию, он пребывал в полном недоумении. Не каждый день в твой кабинет заходит незнакомый грифон, признается, что ему заплатили за убийство тебя, и что заказчиком является твой политический конкурент. Да, Морель был демагогом, идиотом и аквелийцем, но даже для него это было слишком низко. И все же, в этом прослеживалась некая кривая логика. Все это нападение на его солдат в зоне, давно очищенной от “княжеских дезертиров”, выглядело подозрительно. Из объяснений убийцы было ясно, что он мог пристрелить его без каких-либо проблем.\n«Так» – после нескольких минут неловкого молчания заговорил Камриз – «Полагаю, ты здесь не из-за того, что твои взгляды внезапно переменились. Скажи... Почему?»\n«Честно? Я очень сомневаюсь, что мне заплатят. А мне очень нужны эти деньги. И, конечно, я не хочу, чтобы страна попала в лапы таких, как он» – тут же ответил Антуан – «Заплатите мне вдвойне – авансом – и я уберу, как его... Мореля?»\n«Куда пропали честь и приличие в наше время...» – Харман вздохнул – «Ладно, согласен. Но если ты сбежишь с деньгами, помни: здесь, в Помоварре, мы не забываем и не прощаем обманщиков».\n«Конечно» – Антуан чуть улыбнулся – «Я профессионал, а не дурак».\nКогда нежданный посетитель ушел, Камриз налил себе стакан водки. Такие дни не пережить на трезвую голову. Он задумался; сдержит ли слово убийца, уже предавший прошлого заказчика? И как же все закончилось так: не честным боем, а грязными приемами? Он повернул предательство Мореля против него, но разве это избавляет его от вины? Он совершил много ужасных поступков во времена освободительной войны, но ни разу он не предал брата по оружию. Как бы он не презирал Мореля, это был плохой способ с ним разобраться..."
goy_pomovarra.48.a:0 "...но был ли другой?"

goy_pomovarra.49.t:0 "Печальные последствия"
goy_pomovarra.49.d:0 "В этот раз убийца сдержал слово. Через неделю, во время выступления, когда Морель начинал очередную пылкую речь, его застрелили на глазах у сотен собравшихся грифонов. В последовавшей панике стрелок незаметно сбежал. Внезапная смерть Мореля привела фракцию его последователей в разруху и скорому развалу. В отсутствии других влиятельных политиков, Харман Камриз принял на себя управление государством.\nЕстественно, пошли слухи. Отнюдь не все поверили быстро состряпанному объяснению, что Мореля убили по заказу коммунистов, которых он открыто всем сердцем ненавидел. Все равно большинство последовало за Камризом, несмотря на сомнения. В конце концов, он был героем восстания, и с гибелью Мореля никто другой не снискал достаточного уважения, чтобы править помоварцами."
goy_pomovarra.49.a:0 "Суровая необходимость."

goy_pomovarra.50.t:0 "Реставрация"
goy_pomovarra.50.d:0 "Жители столицы заполонили главную площадь Помазона. По всей Помоварре грифоны собрались у радиоприемников. Предводитель сопротивления... Вернее, предводитель Помоварры, Оливьер Морель, после победы над Фловеной, объявлял во всеуслышанье свои планы на будущее страны. Толпы его последователей, число которых недавно возросло в разы, ждали с нетерпением.\n«Идеи переживают своих создателей. Государства, рожденные трудом древних королей проходят через лапы многих поколений грифонов – даже столетия спустя, когда династия основателей уже давно вымерла. Ставит ли смерть точку на деяниях грифона? Конечно нет! Долг его потомков – нести в себе его идею, его мечту и продлевать ее жизнь. Мы исполнили этот долг. Говорят, что Старое Королевство погибло в День Пламенных Небес... Аквелийская ложь! Они знали, что помоваррский дух не сломлен, и они боялись дня, когда неостановимой волной мы стерли бы Аквелию с лица земли! В страхе, они пытались уничтожить нашу память, зная, что пока она живет, помоварцы не сдадутся. Но мы уберегли наше великое наследие! Нет больше наших королей, но их королевство живет! Духовное королевство – внутри каждого из нас. Королевство больше всех прочих, общее для всех помоварцев, с каждым днем только шире и выше. Впереди много испытаний, братья и сестры, – но я обещаю вам, мы пройдем их! Мы победим! И с нашей непоколебимой уверенностью мы достигнем заслуженного величия. Каждый из нас, начиная с меня, обязан дать стране все. Как Регент Помоварры я поведу нас в светлое будущее, в новую эпоху, эпоху войны и славы! Малый Маар Фловены пал, но теперь мы должны закончить дело; сразить Великого Маара – Аквелию!»\nГрифоны на площади хлопали в ладоши и кричали как безумные. Морель окинул их взглядом. Некоторые явно не поняли, что значит основание этого нового 'королевства', но они последовали бы за толпой. У них не было выбора; такие как они ни на что не влияли. Они были лишь средством, с помощью которого нация достигла бы свое великое предназначение!"
goy_pomovarra.50.a:0 "Слава Регенту!"

goy_pomovarra.51.t:0 "Чистка Фловены"
goy_pomovarra.51.d:0 "Фловена, отравленный сад Грифонии. Этот город воров, ростовщиков и предателей был важнейшим показателем помоваррского упадка. Построенный герцладскими лапами, управляемый аквелийцами, слишком долго он душил Помоварру. Властители города богатели и толстели, питаясь кровью народа и выманивая богатства других стран. Но пришло время платить по долгам. Захватив Фловену, Морель решил покончить с болезнью, мучившей ее. Патрициев и их лакеев приговорили к казни, их деньги теперь принадлежали короне, а их громадные особняки пошли под снос. Все оставшиеся памятники аквелийской и имперской власти вскоре также были подвергнуты великой чистке. Под гнилой личиной жадности и честолюбия скрывалось здоровое ядро. Здесь все еще жили хорошие грифоны, помоварцы. Им предстояло унаследовать очищенный город – новую Фловену. Сорняки были вырваны, чтобы истинные цветы могли процветать. И это было лишь началом..."
goy_pomovarra.51.a:0 "...началом войны."

goy_pomovarra.52.t:0 "Свет на западе"
goy_pomovarra.52.d:0 "Аквила. Морель не бывал здесь много лет, но казалось, что город совсем не изменился... Не считая послевоенную разруху, конечно. Говорят, что у городов есть души, и если таковая была у Аквилы, то это была душа полная тщеславия и ложного величия. Но помоварцы сломили эту гордыню: Освободительная Армия шла по улицам, срывая со зданий аквелийские флаги и лилии. К концу дня помоварцы собрались на огромной площади перед бывшим королевским дворцом. Завершительная часть празднования началась с традиционного поминания павших бойцов и продолжилась награждением отличившихся воинов лично Регентом Помоварры. После этого Морель дал речь:\n«Солдаты! Братья и сестры!» – заговорил он. Собравшиеся слушали его в полной тишине. Немногие верили, что день этой победы когда-либо настанет. Но все, что он обещал, и правда произошло – «Сегодня мы стали светом на западе, мы развеяли тьму, нависшую над этим городом. Наши враги разбиты, наша месть – исполнена. То, что мы сегодня достигли, будет жить вечно в памяти будущих поколений. Вы обратили мечту наших предков в явь. Вы доказали, что вы заслуживаете называть себя их наследниками. Честь вам, воины Помоварры!» Солдаты дружно захлопали в ладоши. Когда шум улегся, Морель продолжил: «Теперь мы истинные наследники Старого Королевства и помоваррского наследия! Но есть еще одно аквелийское злодеяние, которое мы не исправили – болящая рана, нанесенная ими много веков назад! Когда наши предки потерпели поражение, аквелийцы оборвали род наших королей, убили лучших из нас, рыцарей и защитников Помоварры. Сегодня – самое время залечить последнюю рану на душе нашего народа. Сегодня я принимаю власть былых Королей Помоварры: Мадока, Хоэля, Утора... Отселе я буду править Помоваррой не как Регент, а как Король! Воины Вепря, Защитники Помоварры, признаете ли вы меня правителем?»\n«Веди нас! Веди нас!» – донеслись крики толпы, которые вскоре сменились аплодисментами. Ближайшие советники Мореля, стоящие позади него, обменялись взглядами. Никто из них не ожидал этого. Но через пару секунд они присоединились к торжеству. На лице Мореля проступила улыбка. Впереди было еще много работы, но он уже вкушал победу..."
goy_pomovarra.52.a:0 "...которую мир запомнит навсегда."

goy_pomovarra.128.t:0 "Игрушки судьбы"
goy_pomovarra.128.d:0 "«Говорят, я ненавижу Аквелию. Это лишь полуправда. Аквелийские грифоны ни в чем не виноваты – они рабы своего прошлого, платящие за грехи своих отцов. Разве можно их судить за то, что они рождены аквелийцами? Далеко не все могут выбирать, кто они и во что им верить. И даже те, кто думают, что могут, в конечном счете становятся рабами судьбы ими же избранной идеологии и народа. Мы все лишь пешки в великой игре, борьбе судеб, стычке народов. И хотя даже одна пешка способна изменить ход сражения, она не выбирает, в каком сражении ей участвовать. Аквелийцы прокляты вечно сражаться с помоварцами. И пусть правда не на их стороне, мы не имеем право наказывать их за это – за то, что они следуют духу своего народа. Я не могу ненавилеть аквелийцев. Я ненавижу дух Аквелии, гнилой дух народа, который я отверг. Дух, который я поклялся искоренить. Сбить с курса колесницу аквелийской судьбы и навсегда остановить ее. Я должен доказать, что нет ничего поистине особенного в судьбе аквелийского народа. Им было суждено разгромить Грифонию и воссоздать ее по своему образу и подобию... Но что стоит за этим образом? Что есть Аквелия по сути? Бледная тень своих предшественников, Империи Гроверов и Карфинии – которым аквелийцы завидуют. Именно эта зависть определяет их. Она рвется у них изнутри. Потому я завидовал помоварцам – пока не прозрел, пока не понял, откуда исходит моя зависть. И тогда я уничтожил своего внутреннего аквелийца. И принял истинное величие, помоваррскую стойкость. Моему примеру должен последовать каждый аквелиец, чтобы Аквелия стала поистине свободной – свободной от своей жалкой судьбы»."
goy_pomovarra.128.a:0 "Морель отложил ручку."

goy_pomovarra.53.t:0 "Великая чистка Аквелии"
goy_pomovarra.53.d:0 "Величественные залы Университета форта Вье опустели. Почти все профессоры и студенты давно не появлялись здесь. Не было и тех, кому хватило глупости остаться... Расстрельная команда работала сверхурочно. Пока по всей бывшей Аквелии рушились памятники, сжигались книги и затягивались петли (слава Богам за наводки на опасных диссидентов, оставленные аквелийскими госслужащими), сам Морель наблюдал за разрушением главного университета Аквилы. Он знал, что истинное сердце города билось здесь, а не в одном из дворцов, храмов или богатых вилл. Все они существовали лишь для вида. Народ может жить без страны, вера может жить без храмов, но без памяти о прошлом – ничто не сохраняется. Несколько доверенных грифонов копались в университетской библиотеке, выбирая из нее научные труды для дальнейшего перевода – и уничтожения всех изначальных образцов.\nКогда все полезные книги были собраны в коробки и вынесены с территории университета, оставалось лишь сжечь все ненужное. Проходя мимо горы одиночных бумаг, Морель заприметил маленькую книжку. Он поднял ее и полистал страницы. Стихи. Причем вполне приличные. Оливьер замер на минуту. Ему очень захотелось оставить книгу себе. Кто-то давным-давно рассказал ему историю о древнем правителе из далеких земель Зебрики. Уничтожая все, что могло представлять угрозу его государству, он сохранил по одной книге для своей библиотеки.\nМорель бросил книгу обратно. Оставив ее, он бы показал, что среди уничтоженного было что-то ценное. Это подорвало бы весь замысел. Аквелия должна быть стерта с лица земли – вместе со всеми образчиками ее культуры. Конечно, в современности это было почти недостижимой целью, но само стремление к ней вошло бы в историю, стало бы легендой. Легендой о народе столь слабом и жалком, что все его наследие было решено уничтожить, ибо оно не содержало ничего достойного. И даже если бы Аквелия каким-то образом возродилась... Поистине, он оказывал этому несчастному народу услугу: либо его страдания бы кончились, либо он бы обрел достоинство, пройдя это испытание..."
goy_pomovarra.53.a:0 "Испытание огнем."

goy_pomovarra.54.t:0 "Выбор новой столицы"
goy_pomovarra.54.d:0 "Хотя Помазон и служил столицей Старого Королевства, в современности его явно нельзя было считать за один из великих городов Грифонии. По правде, его могло затмить почти любое крупное поселение. Поскольку столица отражает характер государства, а наше государство – одна из ведущих сил во всей Грифонии, нашей власти нужно более подходящее место.\nОсвобожденная от лап патрициев Фловена является очевидным выбором: она уже достаточно хорошо прижилась и обросла связями с другими городами страны, так что перемещение правительства в нее не составит хлопот. Также есть Весткип, бывший аквелийский город, по большей части населенный помоварцами. Он расположен дальше от границы и ближе к недавно завоеванным западным землям. В конце концов, мы можем остаться в Помазоне, но нам придется приложить большие усилия для расширения города под наши нужды."
goy_pomovarra.54.a:0 "Фловена."
goy_pomovarra.54.b:0 "Весткип."
goy_pomovarra.54.c:0 "Расширить Помазон."

goy_pomovarra.55.t:0 "Наша новая столица"
goy_pomovarra.55.d:0 "После полугода работ наша новая столица по праву стоит в одном ряду с величайшими городами Грифонии!\n\nНикто не сможет поспорить с нашей полной властью над континентом, если она исходит из такого города. И даже если мы не будем править вечно, он останется как напоминание о наших свершениях!"
goy_pomovarra.55.a:0 "Добро пожаловать во Фловену!"
goy_pomovarra.55.b:0 " Добро пожаловать в Весткип!"
goy_pomovarra.55.c:0 "Древний город восстановлен!"

#goy_pomovarra.56 unused

goy_pomovarra.57.t:0 "Помоваррские требования"
goy_pomovarra.57.d:0 "Самоназванный Король Помоварры прислал нам своего дипломата. Он много говорил о единстве и братстве наших народов, но на деле он хотел одного: присоединения Румейра к так называемому “Возрожденному Королевству” как его неотъемлемой части. В свою очередь, помоварцы обещают вернуть наши отчужденные владения на материке и равные права для наших подданных внутри этого “Королевства”. Конечно, согласившись, мы потеряем всю независимость взамен на некоторую свободу действий внутри большей страны и возвращение земель наших отцов. Как мы ответим?"
goy_pomovarra.57.a:0 "Присоединимся к ним..."
goy_pomovarra.57.b:0 "Ни за что! Rumare am byth!"

goy_pomovarra.58.t:0 "Присоединение Румейра"
goy_pomovarra.58.d:0 "Румейрцы приняли наше щедрое предложение и вошли в состав Возрожденного Королевства! Взаправду, это чудесный день воссоединения братских народов. Вместе мы вырвем из лап чужестранцев все земли, принадлежащие нам по праву!"
goy_pomovarra.58.a:0 "Одно Королевство, одна борьба!"

goy_pomovarra.59.t:0 "Румейр против нас!"
goy_pomovarra.59.d:0 "Безумцы в правительстве Румейра не приняли наше предложение, доказав свою слепоту и уверенность в их сомнительной самобытности. Наши братья, очевидно, сбились с курса, и нам ничего не остается, кроме как насильно вывести их на правильный путь!"
goy_pomovarra.59.a:0 "Они пойдут с нами!"

goy_pomovarra.60.t:0 "Помоварра требует Таррин"
goy_pomovarra.60.d:0 "Посол Помоварры только что потребовал от нас мирной передачи территории Таррина. Помоварцы заявляют, что эта земля принадлежала их предкам с древних времен и грозятся объявить нам войну, если мы не согласимся. Хотя их притязания совершенно беспочвенны, мы должны хорошо обдумать последствия отказа. Помоваррская армия ранее завоевала всю Аквелию; наш народ может не пережить войну с таким противником."
goy_pomovarra.60.a:0 "Мы сдаем Таррин."
goy_pomovarra.60.b:0 "Что за бред? Таррин наш!"

goy_pomovarra.61.t:0 "Таррин Наш!"
goy_pomovarra.61.d:0 "Как мы и думали, наши [FROM.GetAdjective] противники испугались войны с Возрожденным Королевством и согласились на наши разумные требования. Новый гарнизон во главе с королевским наместником уже вошел на территорию Таррина, чтобы установить наш контроль над регионом."
goy_pomovarra.61.a:0 "Еще одна победа!"

goy_pomovarra.62.t:0 "Война за Таррин"
goy_pomovarra.62.d:0 "[FROM.GetAdjectiveCap] дураки вообразили, что они способны потягаться с нами! Что ж, до сих пор они жили в мире грез, но пришло время нашей армии пробудить их! Вперед, на Таррин!"
goy_pomovarra.62.a:0 "К победе!"

goy_pomovarra.63.t:0 "Конец эпохи"
goy_pomovarra.63.d:0 "О, Грифенхейм, столица павшей Империи Гроверов. Город, построенный волей одного грифона – и страданиями многих тысяч. Город мечты. В Грифенхейме воины Помоварры вели себя сдержанно, ограничившись снятием всех флагов и прочих символов династии Гроверов. Народный гнев, от которого пострадали многие западные города после взятия, не затронул Грифенхейм – у Короля были планы на него. Здесь должен был пройти парад великой победы помоваррского народа над узурпаторами, триумфальное завершение борьбы за свободу, которую они, без малого, вели столетиями. Как водится, солдаты победоносной армии маршировали по главной улице. Горожане, сломленные и уставшие, понуро наблюдали за действом с обочин и из окон домов. Как же так вышло, что после стольких войн между исконными правителями Герцланда, они оказались во власти каких-то иностранцев? Морель стоял на балконе Имперского дворца. Победный марш не волновал его. Он наблюдал за горожанами. Как ему казалось, они чувствовали то же, что и он: что сегодня пало нечто великое. Сегодня они утратили то, что считали вечным. Пришел конец наследию Гровера Великого, его трехсотлетней Империи. Некогда, своими завоеваниями он изменил облик континента для многих поколений грифонов. Морелю оставалось только гадать, как отразятся на истории его действия.\nНо время на размышления истекло. Солдаты подходили ко дворцу; пришел черед его выступления.\n«Воины Помоварры!» – обратился Морель к собравшимся – «Вновь вы показали силу духа нашего народа! Вы вписали себя в историю, в один ряд с легионами Арантигоса и армиями Гровера. Поминая величайшие победы, грифоны будут думать об этом дне – и о вас! Примите мои поздравления!» – после длительных аплодисментов Морель продолжил – «Теперь никто не сравнится с Помоваррой. Любой, кто решит сразиться с нами, будет уничтожен. Эта победа знаменует наступление новой эпохи. После древних времен, эры воинствующих королевств и века Гровера, наступает Четвертая грифонская эпоха – Эпоха Помоварры! Мы оставим труп Империи позади и не посрамим наше прошлое, объявив себя ее наследниками. Наше государство вознесется над всеми странами Грифонии и с этого дня оно будет называться Верховным Королевством Помоварры!»"
goy_pomovarra.63.a:0 "Новая эпоха началась!"

goy_pomovarra.133.t:0 "Завоевание душ"
goy_pomovarra.133.d:0 "«Такова историческая правда, что каждой империи суждено пасть. Ничто не вечно, и каждый великий правитель в конце концов умирает и замещается бездарным наследником, который ставит некогда гордый народ на путь к разложению. Каждый великий завоеватель пытается основать вечную империю – и каждая такая попытка проваливается. Это естественно и хорошо, ведь единственный путь к росту лежит через невзгоды. И потому, если бы всем миром вечно правило одно государство, такой единый мир неуклонно катился бы в бездну. Когда правители умирают, значение теряет и то, сколько армий они победили, и сколько земель завоевали. Важным остается лишь то, как их запомнили. В грифонской истории было полно завоевателей, но в нашей памяти остались немногие из них. Ими стали те, кто смог завоевать не только земли, но и души грифонов – те, кто своими действиями изменил историю Грифонии. Мы помним Арантигоса, первого великого завоевателя, хотя все, что он построил, давно пало. Мы можем смеяться над тем, как южане изображают из себя наследников древнего Спарлейского Королевства, чьи храмы и крепости давно стали грудами камней, но это лишь показатель того, что дух Арантигоса жив. И даже если все южане вымрут, память о нем понесут другие. Все грифоны во все времена будут читать истории о его достижениях, его завоеваниях.\nИз этого я вывел свою цель: сделать так, чтобы память о Помоварре настолько крепко вписалась в историю грифоньего рода, что никто не смог бы забыть ее. Так, чтобы каждый грифон нес в себе часть помоваррской истории, и чтобы даже если по воле злого рока моя Помоварра пала, кто-нибудь неизбежно перенял ее наследие. Таково истинное бессмертие. Народ можно истребить, государство – разрушить, но если память о его былом величии выживет, когда-нибудь оно возродится.»"
goy_pomovarra.133.a:0 "Еще одна глава написана."

goy_pomovarra.64.t:0 "Восстание в Бронзхилле"
goy_pomovarra.64.d:0 "Многие наши подданные восприняли казнь Императора вштыки.\nНо в то время как большинство из них слишком устало от кровопролития, чтобы оказать сопротивление, псы Бронзхилла оправдали свою преданность Империи. Все жители региона восстали против нас. Плохо вооруженные и неуправляемые, они все же представляют серьезную угрозу благодаря прекрасному знанию местности и большой численности. Их пыл и верность заслуживают уважения, но мы не можем позволить им встать на пути к нашей судьбе. Несколько воинских частей отправились в горы Бронзхилла на операцию по истреблению партизан и их сообщников. Наши потери высоки, но ущерб, наносимый повстанцам превосходит их в разы. Через пару месяцев сопротивление будет подавлено.\nОднако, после завершения операции регион утратит все промышленные мощности. В связи с сопутствующим ущербом от боевых действий, партизанскому саботажу и оттоку населения крайне сомнительно, что Бронзхилл когда-либо станет для нас полезен."
goy_pomovarra.64.a:0 "Они умерли с честью."

goy_pomovarra.65.t:0 "Паразиты и предатели"
goy_pomovarra.65.d:0 "«Власть привлекает паразитов. Всегда есть те, то превыше всего жаждет власти и богатств; те, кто готов служить любому, кто исполнит их низменные желания. Всем правителям приходится иметь дело с такими существами и их развращающим влиянием. Их появление неотвратимо, и особенно их, в качестве коллаборационистов, привлекает власть над отдаленными землями. Теперь эти подонки окружают и меня, пытаются подлизаться ко мне. Но я вижу в них пользу. Не существует величия без нищеты, а разве есть лучше способ создать нищету среди народа, чем передать власть выродкам? Я дам им власть, назначу их губернаторами далеких земель, чей народ однажды обрел бы силу, чтобы восстать против меня. Я позволю им заразить окраины моих земель. Они, зная, что их власть зависит только от прихоти верховного правителя, будут изо всех сил пытаться угодить Королю Помоварры, выжимая соки из народа, чей гнев будет направлен на них, а не на моих потомков. Властители Империи Гроверов, Вингбардии и Аквелии ослабили хватку на окраинах – и пали под натиском местных повстанцев. Я не повторю их ошибку.»"
goy_pomovarra.65.a:0 "Труд почти завершен..."

goy_pomovarra.66.t:0 "Последнее завоевание"
goy_pomovarra.66.d:0 "«Рознь – естественное состояние грифонов. Мы живем, чтобы находить противоречия, сражаться и конкурировать. Так мы растем, так мы становимся сильнее. Наши великие королевства распадаются на мелкие княжества, которые тут же начинают борьбу за превосходство. Из них в памяти откладываются немногие – лишь те, чьи правители добились того, что считалось невозможным во времена их предшественников. Насколько Помоварра отличается от Империи Гроверов? Оба государства совершили невозможное – объединили всех грифонов под одним флагом. Превзойдем ли мы Гровера, если расширим наши владения? Нет. Спасения народа от верной гибели достаточно, и вера в то, что захват земель меняет будущее, слепа. Захват умов и душ – вот что действительно важно. Раздоры и хаос станут моим наследием. Пытаясь объединить захваченные земли, другие завоеватели лишь взращивали своих будущих соперников. Пытаясь создать вечные империи, они обрекали их на медленную, позорную гибель. Таков круговорот бытия. Я уже вижу трещины в моем государстве. Моя система неустойчива по задумке. Но она падет до того, как помоваррский дух испортят годы мира и изобилия. День краха застанет Помоварру в расцвете сил, еще не ослабленную веками загнивающего господства. Я сажаю семена будущих побед. Я оставлю Помоварру сильной и готовой к битве со слабыми, разделенными соперниками. Моим потомкам придется стать воинами и мечтателями, а не простыми управленцами. В грядущих конфликтах они приведут Помоварру к победе. А если они не справятся, то они недостойны моего наследия, недостойны быть носителями помоваррского духа. Так или иначе, история Помоварры только продолжится. После каждого падения Помоварра вновь будет восставать из пепла. Такова моя мечта. Таково мое наследие.»\nМорель отложил законченную рукопись. Когда-нибудь последователи найдут ее, и тогда она прольет свет на все его поступки. Самолюбивый способ объясниться перед потомками, несомненно. Но иначе они не поймут. А если рукопись потеряется... Какое ему будет оправдание? Как его запомнит история? Этот вопрос не давал ему покоя. Возможно, потомки сочтут его тираном, поработителем. Очаровательная неизвестность будущего волновала его, как ничто другое. И чтобы Помоварра дожила до этого будущего, ему еще многое нужно было сделать. Но глубоко внутри его терзало странное чувство, как будто он что-то упустил...\n\nСпустя много лет, в городке к югу от Рилы, проходил митинг. Сотни граждан, многие с аквелийскими флагами, смешались с вооруженными членами сопротивления на главной площади."
goy_pomovarra.66.a:0 "Молодой грифон взобрался на подиум..."

goy_pomovarra.67.t:0 "Легенда о вепре"
goy_pomovarra.67.d:0 "Ренан сделал глубокий вдох, прежде чем войти в кабинет комнадира. Облако сигаретного дыма всегда следовало за Камризом, но здесь оно было плотнее дымки над вединскими фьордами. Для некурящего это было пыткой – которую Ренан проходил ежедневно в последнее время. Камриз поручил ему проверить офицеров на “подрывную деятельность” – конкретно, на связи с последователями Мореля. Большинство членов его движения разбежалось по мертворожденным политическим партиям, грызущимся между собой за чистоту странных доктрин, оставленных им в наследство их умершим предводителем. Однако, несколько бывших “Воинов Вепря” заручились поддержкой в армии, заявляя, что нынешнее правительство “недостойное и мягкотелое”. Чтобы вымести подрывников из армии, пришлось начать масштабную проверку – с разжалованиями, отставками и даже военными трибуналами. Сегодня Ренан принес Главнокомандующему очередной приказ о увольнении целого списка диссидентов. Камриз прочитал его по диагонали и вытащил ручку из кармана.\n«Думаю, мы со всеми расправились» – сказал Ренан – «остальные из бывших Воинов не связаны с подрывниками. Я считаю, их можно не трогать».\n«Угу» – подтвердил Камриз – «Они хорошие солдаты. Жаль, что они повелись на глупости, которые Морель выкрикивал на митингах. “Воины Вепря”! Вот уж нашел название для своего движения!» Командир усмехнулся. Увидев смущение на лице Ренана, он спросил: «Ты что, не слышал эту историю? Старина Морель чересчур зачитался древними легендами и выбрал самое грандиозное название, какое увидел – и, пожалуй, самое загадочное. Перед встречей с Морелем многие из нас думали, что Воины – это какие-то сельские повстанцы...» Камриз подписал приказ и отдал его Ренану. Когда тот закрыл дверь кабинета, он откинулся в кресле и ушел в свои мысли.\nВоин-вепрь... Для Камриза было загадкой, сколько его ушедшему противнику удалось узнать о нем. Ведь его легенда передавалась лишь в кланах самых ярых последователей древних традиций. Сам Харман услышал ее от своей бабушки. Она обожала утомлять его долгими рассказами. Одним из них был сказ о древнем короле – или воеводе (память подводила его), которому сам Арктурий предложил дар божественной силы в признание его храбрости. Он рассмеялся перед богом и отказал, заявив, что он опозорил бы себя и свой клан, пользуясь чужой силой, и что Арктурий явно не понимал истинных значений чести и доблести. А если бы ему не хватило своей силы, он бы позвал братьев по клану на подмогу. Разъяренный бог проклял короля и превратил его в кабаноподобное чудовище полное гнева. Но такова была решимость Воина-вепря, что он подчинил этот гнев себе и обратил его против врагов своего клана. Ни один противник, будь то грифон или зверь, не мог противостоять ему, и в конце концов его клан превознесся над всеми другими. Когда много лет спустя Арктурий, пораженный его достижениями, предложил снять проклятие, король вновь рассмеялся перед ним, и тогда бог так разгневался, что убил Воина-вепря. Но что же он сказал Арктурию перед смертью? Камриз забыл эту часть рассказа. Он затянулся сигаретой – и тут его осенило:"
goy_pomovarra.67.a:0 "«Простить злодеяние – высшая слабость.»"
goy_pomovarra.67.b:0 "«Мои братья уже сняли с меня проклятье.»"

goy_pomovarra.68.t:0 "Наследие Фловены"
goy_pomovarra.68.d:0 "Фловена, Город садов. Камриз приезжал в нее раньше – каждый раз по все более срочным делам. Сначала это были сделки с контрабандистами, потом встречи с местными помоварцами и наконец шпионаж. И хотя он всегда бывал здесь анонимно, находиться здесь было опасно. Обстоятельства никогда не позволяли ему насладиться местной архитектурой и погрузиться в историю города. И даже теперь, когда он входил во Фловену не как скрытный партизан, а как ее новый владелец, времени на это не было. Слишком много проблем требовали его внимания. Почти все великие патриции сбежали в страхе перед расправой. Похоже, что помоварцы и местные жители одинаково ненавидели жадных князьков Фловены. Теперь в городе царил странный порядок: хотя официально он был под контролем помоваррской армии, местные вопросы разрешались городским советом, собранным из представителей рабочих гильдий и разных «уважаемых членов общества». В диковинку для Камриза было то, что все члены совета, несмотря на их аквелийские, герцландские или помоваррские корни, предпочитали называть себя фловенцами.\nХотя большинство рабочих во Фловене до сих пор составляли помоваррские мигранты, город давно стал плавильным котлом. Его улицы казались Камризу странными, но знакомыми. Освободившись от цепких лап патрициев, местные жители обрели единое самосознание. Теперь все они были фловенцами. И конечно, они тут же начали выставлять требования! Каждый день в столицу прибывало то письмо, то делегация, по одному и тому же вопросу: расширение фловенской автономии. Помимо этого, радикалы в армии начали требовать “очистить Фловену от непомоваррских чужаков”... Но как можно “очистить” город, чье население столь смешанно? Напряжение нарастало с каждым днем. Перед Камризом встал выбор: разогнать Городской совет Фловены и установить помоваррское правительство или принять требования местных и оставить город им... Хотя, если фловенцы останутся у власти, в чем тогда был смысл войны?"
goy_pomovarra.68.a:0 "Власть помоварцам!"
goy_pomovarra.68.b:0 "Автономию фловенцам..."

goy_pomovarra.69.t:0 "Ошибки прошлого"
goy_pomovarra.69.d:0 "«Наемники!» Ренан поморщился. «Что дальше, командир? Примем на службу вояк Райхера? И это... эквестрийцы? Вы хотите преподать бойцам урок о магии дружбы?»\n«Это – северянцы».\n«Что?» переспросил Ренан удивленно. «Северянцы совсем другие, чем эквестрийцы – предпочитают сражаться, а не болтать. Они – наша единственная надежда. Аквелия превосходит нас числом и мощью, так что для нас все средства хороши. Конкретно, эти пони помогут нам отразить заклинания аквелийских единорогов» Камриз постучал когтем по столу «Наш народ не переживет второго Дня Пламенных Небес».\n«То есть, мы пойдем на врага с его же оружием – его пони против наших пони?»\n«Верно!» Камриз чуть улыбнулся «Только дураки не учатся на собственных ошибках, и в этой войне нам пригодится любое преимущество. Так что, да, мы наймем этих магов. Так же, как и аквелийцы веками ранее. Знаешь, пони ведь пришли сюда не чтобы – как ты сказал – преподавать уроки о магии дружбы. Их призвали как войнов, наемников. Сколько лет до того аквелийцы сражались с нами? Двести? Триста... А потом они закончили войну за один день! Все наши достойные рыцари, великие генералы и правители – сожжены магией единорогов! Из этого поражения давно нужно было вынести урок. Жаль, что мы сделали это только сейчас.»\n«И в чем же урок, командир?»"
goy_pomovarra.69.a:0 "«Главное – победа. Любыми средствами.»"
goy_pomovarra.69.b:0 "«Не бойся нового, прими его.»"

goy_pomovarra.70.t:0 "Грехи предков"
goy_pomovarra.70.d:0 "«Что за несуразица?» провозгласил Камриз, прочитав доклад, «Притязания на землю трехсотлетней давности? За это время на ней вырос целый город! Зачем ты вообще мне это принес?» Услышав это, секретарь совсем растерялся и начал было отвечать, но тут командир ударил кулаком по столу, «Не трать мое время попусту! Почему я должен этим заниматься? Это же задача местных властей».\n«Заявитель из клана Таллек, а местный управленец из семьи Карью... Они вздорят уже сотни лет. Когда Арзо Карью отклонил заявление, Таллеки оклеймили Карью ворами и предателями и приехали в ратушу с оружием. Они заняли весь первый этаж и потребовали передать вам, что они не уйдут, пока вы не решите вопрос». Секретарь перешел на шепот, «Мы не знаем, что делать, командир...»\n«И вот опять... Только мы прекратили воевать с чужаками, как уже начали рвать страну на части». Камриз вздохнул и вытянул новую сигарету из пачки. «Я знаком со старейшиной клана Таллек. Он упрямее осла – и вдвое неприятнее – но он всегда поддерживал наше дело... Такого я от него не ожидал. Скажи им, что Арзо действует от моего имени, и любые нападки на него я приму как личное оскорбление. Думаю, это их успокоит – до тех пор пока не найдется следующее дурацкое противоречие. Только передай мои слова в точности!»\nКогда секретарь ушел, Камриз принялся массировать виски. Вся эта нелепость уже набила оскомину. Он хорошо помнил, что более двадцати лет назад, во времена прошлого восстания, происходило ровно то же самое. Кланы вздорили по самым ничтожным поводам. Чей-то дед украл чужих овец, чей-то предок оскорбил основателя другого клана... Вместо построения обороны, помоварцы потратили все силы на бессмысленные споры. В итоге Райхеру не составило труда смести их армию. Похоже, помоварцев могла объединить только внешняя угроза... Теперь, когда ее не стало, все началось по новой. Сначала Морель и его придурки, теперь кланы... Рознь как будто была естественной для них. И доля правления этой психушкой пала Камризу. Он никогда раньше не желал сдаться аквелийцам и принять смерть. Но, может, на небесах ему дали бы отдохнуть. А может и нет. Если верить рассказам бабушки, там он встретил бы всех своих родственников – вероятно, все еще грызущихся друг с другом. Камриз усмехнулся, представив, каково Борею жить с несчетными поколениями помоварцев. Даже бог справедливости, наверно, уже так устал от них, что подумывает ниспослать их к Маару. Так или иначе, что-то нужно было решать. Найти нового врага было легче легкого – аквелийцы рядом, сразу за границей. Ему лишь нужно было напомнить кланам о всех их давних преступлениях. Иначе придется посредничать в клановых разборках, ценой своего авторитета убеждать старейшин простить древние обиды. Страшное дело... "
goy_pomovarra.70.a:0 "Легче обратить их ненависть на врага."
goy_pomovarra.70.b:0 "*Эх* Больше работы..."

goy_pomovarra.71.t:0 "Государственные принципы"
goy_pomovarra.71.d:0 "«Я всегда считал, что ты выше этого, Морван... Я разочарован».\n«Командир, позвольте объяснить...» Ренан выглядел как птенец, которого отчитывают за шалость. Камриз прервал его,\n«Политика! Во имя богов! Только этого мне не хватало среди генералитета – и только я разобрался с прихвостнями Мореля... Хотя бы успокой меня, что ты не из социалистов. А то окажется, что я совсем не умею выбирать союзников».\n«Конечно нет! Я в обычной республиканской партии...»\n«Пангрифонцы, значит? Как по мне, странный выбор для помоваррского партизана». Гнев Камриза, кажется, перешел в веселье.\n«Как сказать, командир... Республиканцы стремятся не только объединить грифонов. Главные принципы – это свобода, процветание и демократия. Достойные основы для помоваррского правительства – если оно официально появится. Эти начала осветят нам путь в будущее». Офицер выглядел ошарашенно, но сумел внятно ответить. «Естественно, мы поддерживаем ваше главенство, командир, но...»\n«Ха!» Камриз махнул лапой «Мне не до политики. Она противная и скучная. Когда мы закончим воевать, я уйду в отставку, а ты со своими друзьями сможешь установить любой режим, какой захочешь. И можешь всех уверить; я не собираюсь оставаться временным правителем вечно. Эта должность – моя, но только пока свобода Помоварры под угрозой – потом я оставлю ее. Можешь продолжать заниматься своим хобби, но не смей поднимать политические темы на военных совещаниях».\n«Спасибо, командир!» Ренан широко улыбнулся.\nЧерез пару минут после того как разговор закончился и дверь кабинета захлопнулась за уходящим офицером, командир пробубнил себе под нос.\n«И что дальше, он начнет цитировать Кемерская?» Камриз вздохнул и откинулся на спинку кресла. Республиканство... Он никогда не задумывался о нем – в годы Революции он был слишком занят бросанием гранат, ангриверских коктейлей и прочей взрывчатки в аквелийских солдат. Потом в Аквелии случилась своя революция. Она ничуть не изменила аквелийцев – это были все те же сволочи, пытающиеся придушить все западные народы. Но все же была от этих восстаний польза. Без них, без разрушения старых государств, Помоварра продолжила бы слабеть и в конце концов бы умерла. Теперь у нее был шанс выжить. Но станет ли она страной, о которой Камриз мечтал? Или чем-то новым и другим... Чем это новое государство будет отличаться от тех, которые представляют себе Кемерскай и Верани?"
goy_pomovarra.71.a:0 "Будет ли оно Помоваррой?"
goy_pomovarra.71.b:0 "Тем, что оно будет нашим."

goy_pomovarra.72.t:0 "Враг моего врага"
goy_pomovarra.72.d:0 "В комнате военного совета Камриз чувствовал себя как дома. Не то, что в его правительственном кабинете, здесь все было простое и знакомое. Планирование грядущих войн, распределение припасов – здесь не было надуманных проблем. Но дела были плохи: очевидно, война с Аквелией будет трудной. Большую часть совещания командир провел молча. Выслушав все отчеты подчиненных, он наконец заговорил:\n«Нам нужны союзники,» сказал он и прикурил новую сигарету, «Даже если мы победим, нам одним не удержать эти земли в узде. И все равно в одиночку мы не справимся. К счастью, не мы одни ненавидим аквелийцев».\n«Что вы имеете в виду?» спросил Морван Ренан.\n«Фетизцы. Как мы, они борются с превосходящим врагом. Против нас Аквелия, против них весь Герцланд. И у нас остались связи там, на севере, с тех пор, как мы провозили горы оружия через Аделарт. Мы вышлем послов, уладим разногласия...»\n«Их земли наши по праву!» возразил один из молодых офицеров.\n«Наши земли... Границы всегда двигаются, но помоварцами нас делает кровь и наша культура, – а не земля. С этим мы разберемся, и мы получим намного больше земель на юге.» Камриз чуть улыбнулся. «Достаточно большая добыча накормит целую стаю. И лучше будет поделиться, чем умереть, сражаясь в одиночку. Может, мы и не друзья, но у нас общий враг...»"
goy_pomovarra.72.a:0 "«И этого достаточно.»"

goy_pomovarra.73.t:0 "Встреча во Фловене"
goy_pomovarra.73.d:0 "Разграбленный дворец фловенского мэра стоял заброшенным со времен завоевания города. Помоварцы не нашли ему применения, и кроме пары солдат на страже его некогда роскошных залов, здесь никто не бывал. Однако, за последние недели дворец спешно отмыли и отремонтировали. Причина тому скрывалась за событием, на которое во Фловену съехались делегаты от различных партизанских формирований, старейшины кланов и политики со всей Помоварры. Конечно, такое разнообразие привело к некоторым трениям. Главной темой обсуждения стало присутствие “чужаков”: фловенцев, аквелийцев из пограничных регионов и даже одинокого аделартца. Для Камриза такая обстановка была сущим адом; он опасался встреч с такими толпами политических деятелей. Но он должен был это вынести. Он приложил огромные усилия, чтобы устроить этот съезд – и собрать гостей таким образом, чтобы они не поубивали друг друга.\n«Товарищи, друзья,» заговорил он «вы, наверно, гадаете, почему я пригласил всех вас сюда. Для Помоварры настали тяжелые времена, и я должен бы разрабатывать военные планы, а не собирать праздные политические вечеринки – в этом и есть суть нашей встречи. Недавно я понял, что мы живем только ради битвы. Кроме войны, в Помоварре нет ничего, и только ей мы едины. Я провел всю жизнь сражаясь, и если честно, я устал от этого. Я отложил все планы на будущее “пока не закончится война” – и вы последовали за мной. Никто не выступил против меня, несмотря на то, что моя власть исходит только от ружья. Но что будет дальше? После победы над всеми внешними врагами? Я понял, что не могу ответить на это. Именно поэтому мы должны начать думать о будущем сейчас. И не только о будущем для Помоварры, но для всех нас. Для этого я пригласил всех представителей, кто был готов меня выслушать – от Фловены и от всех соседних стран. Нам не изменить прошлое, но мы должны оставить его позади, чтобы идти вперед – вместе. Иначе этой войне не будет конца. Когда мы закончим воевать с чужаками, мы начнем воевать между собой. И тогда мне придется командовать невыносимо долго и для меня, и для вас». Из зала донесся смех «Нам многое нужно обсудить. Так... где же мой список... Ах, да, вот он. Начнем...»"
goy_pomovarra.73.a:0 "Сделан первый шаг."

goy_pomovarra.74.t:0 "Друг с севера"
goy_pomovarra.74.d:0 "Камриз как будто помолодел на пару лет, сидя в развалинах деревушки на помоварро-аделартской границе в ожидании посыльного. Все было как в годы партизанской войны... Правда, в этот раз никто не собирался стрелять. Так или иначе, его связной в Фетизии настоял на том, чтобы встреча была тайной. Бесплодное ожидание беспокоило его – что если кто-то перехватил посыльного? Это испортило бы все его планы... Вдруг дверь распахнулась, и в хижину вбежал караульный.\n«Три грифона на бреющем полете – приближаются. Что прикажете?»\n«Прячься и жди. Если это послы, они знают место встречи».\nЧерез пару минут три грифона сели между развалинами. Хотя они носили гражданские одежды, походка у них была как у военных.\n«Понятия не имею, как ты победил Райхера, совершенно не разбираясь в маскировке. Пять... Нет, шесть солдат прямо на виду. Так ты учишь своих подчиненных?» Громко заявил один из них. Услышав это, Камриз выбрался из укрытия, широко улыбаясь.\n«Хендрик? Не ожидал увидеть тебя лично. Грифоны в твоей должности обычно слишком толстеют, чтобы так далеко летать. И еще, седьмой караульный держит тебя на прицеле». Камриз протянул лапу, и второй грифон крепко ее пожал. «Рад тебя видеть, друг. Сколько лет... Но не будем тут стоять. Заходи сюда, тут хотя бы не дует...»\n«Так ты теперь командуешь целой армией... и в придачу, страной. Впечатляюще. Признаюсь, я никогда не видел в тебе офицера, Харман. Ты же пошел в армию, чтобы заработать на учебу».\n«Скажем так, в какой-то момент среди повстанцев почти не было кадров с настоящим военным опытом, так что я занимался своим делом, число грифонов под моим началом росло – и вот, я здесь...» Камриз закурил сам и предложил сигарету товарищу. Хендрик принял ее, втянул дым... И пошатнулся.\n«Во всей Грифонии не найти сигарет омерзительнее, а ты все еще их куришь. Ума не приложу, почему тебе так нравится эта веренская смесь. Вкус как у старого башмака, а по голове бьет как молоток. Эх ты... Впрочем, перейдем к делу. Командованию нравится твое предложение, и хотя формальный альянс был бы... неудобен сейчас, мы пустим в дело старые пути контрабандистов для поставок снаряжения. Также сюда прибудут несколько фетизских офицеров – они помогут управлять этой толпой, которую ты зовешь армией. Если ты сможешь выйти на границу с Фетизией, нам, естественно, будет проще тебя снабжать.»\n«Спасибо. Ты здорово нам помог». Камриз кивнул «Думаю, тебе пора возвращаться. Нужно сопровождение?»\n«Нет необходимости». Хендрик ухмыльнулся «Меня назначили командиром фетизской военной миссии здесь»."
goy_pomovarra.74.a:0 "«Все будет как в старые добрые времена...»"

goy_pomovarra.75.t:0 "Друг с севера"
goy_pomovarra.75.d:0 "Камриз как будто помолодел на пару лет, сидя в развалинах деревушки на помоварро-аделартской границе в ожидании посыльного. Все было как в годы партизанской войны... Правда, в этот раз никто не собирался стрелять. Так или иначе, его связной в Фетизии настоял на том, чтобы встреча была тайной. Бесплодное ожидание беспокоило его – что если кто-то перехватил посыльного? Это испортило бы все его планы... Вдруг дверь распахнулась, и в хижину вбежал караульный.\n«Три грифона на бреющем полете – приближаются. Что прикажете?»\n«Прячься и жди. Если это послы, они знают место встречи».\nЧерез пару минут три грифона сели между развалинами. Хотя они носили гражданские одежды, походка у них была как у военных.\n«Понятия не имею, как ты победил Райхера, совершенно не разбираясь в маскировке. Пять... Нет, шесть солдат прямо на виду. Так ты учишь своих подчиненных?» Громко заявил один из них. Услышав это, Камриз выбрался из укрытия, широко улыбаясь.\n«Хендрик? Не ожидал увидеть тебя лично. Грифоны в твоей должности обычно слишком толстеют, чтобы так далеко летать. И еще, седьмой караульный держит тебя на прицеле». Камриз протянул лапу, и второй грифон крепко ее пожал. «Рад тебя видеть, друг. Сколько лет... Но не будем тут стоять. Заходи сюда, тут хотя бы не дует...»\n«Так ты теперь командуешь целой армией... и в придачу, страной. Впечатляюще. Признаюсь, я никогда не видел в тебе офицера, Харман. Ты же пошел в армию, чтобы заработать на учебу».\n«Скажем так, в какой-то момент среди повстанцев почти не было кадров с настоящим военным опытом, так что я занимался своим делом, число грифонов под моим началом росло – и вот, я здесь...» Камриз закурил сам и предложил сигарету товарищу. Хендрик принял ее, втянул дым... И пошатнулся.\n«Во всей Грифонии не найти сигарет омерзительнее, а ты все еще их куришь. Ума не приложу, почему тебе так нравится эта веренская смесь. Вкус как у старого башмака, а по голове бьет как молоток. Эх ты... Впрочем, перейдем к делу. Моим командирам нравится твое предложение, но правительство настроено против них. Однако, у нас есть возможность предоставить тебе ограниченную помощь. Контрабанда уже течет по старым путям, и в запасах всегда найдется снаряжение, которое можно “списать”. И все-таки муштра твоим бойцам не помешает. Через пару недель несколько советников фетизской армии “дезертируют” и прибудут в Помоварру. Когда разберешься с местными делами, мы ждем твоей помощи в свержении нынешнего... несговорчивого правительства в Фетизии».\n«Честная сделка. Спасибо». Камриз кивнул. «Думаю, тебе пора возвращаться. Нужно сопровождение?»\n«Нет необходимости». Хендрик ухмыльнулся. «Я один из “дезертиров” и командир фетизской военной миссии здесь»."
goy_pomovarra.75.a:0 "«Все будет как в старые добрые времена...»"

goy_pomovarra.76.t:0 "Помощь Помоварре"
goy_pomovarra.76.d:0 "Нам сделал предложение новый правитель Помоварры Харман Камриз. Годами помоваррские партизаны закупали фетизское снаряжение, выстроив сеть контактов среди контрабандистов. Теперь, по этой же сети, они вышли на связь с нашим правительством. Главнокомандующий Камриз хочет заключить теневой союз между нашими странами с целью сдерживания агрессии Аквелии и Империи. Хотя нам нет дела до помоварцев и судьбы их государства, несомненно они смогут отвлечь внимание Аквелии от Герцланда, что позволит нам свободно разбираться с нашими проблемами. Принимая это во внимание, генералитет утвердил план ограниченной военной поддержки Помоварры, предложенный майором Хендриком Грийсбеком. Согласно плану, мы отправим в Помоварру группу опытных офицеров и устаревшее снаряжение, чтобы повысить их шансы победы в войне с Аквелией. От столь малой инвестиции мы не пострадаем, если планы Камриза провалятся, но если он справится, мы крупно выиграем."
goy_pomovarra.76.a:0 "Удачи им."

goy_pomovarra.77.t:0 "Странные события"
goy_pomovarra.77.d:0 "С нашими вооруженными силами что-то не в порядке. Несколько офицеров неожиданно уволились или в открытую дезертировали. Отследить их перемещения после этого не удалось. Также наши кладовщики испытывают трудности в подсчете снаряжения. Внезапно обнаруженные ошибки, отчеты о повреждениях и запоздавших поставках временно ввели нашу систему снабжения в полный беспорядок. Когда все вернулось на круги своя, оказалось, что числа в докладах о состоянии военных запасов были значительно завышены. На этом разбирательство завершилось, но здесь явно что-то нечисто – вот только что?"
goy_pomovarra.77.a:0 "Странно..."

goy_pomovarra.78.t:0 "Восстание в Весткипе"
goy_pomovarra.78.d:0 "Много веков назад Весткип принадлежал Помоваррскому Королевству. С тех пор, под давлением миграции аквелийцев и правительственных усилий по ассимиляции, он стал очередной провинцией Аквелии. Однако, некоторые местные грифоне все еще придерживаются старых порядков. С победой радикальных националистов в Помоварре, эти грифоны решили выступить в поддержку повстанцев. Нам поступают новости о множественных попытках перехода границы и операциях по сбору разведданных, в то время как более дерзкие группировки нападают на военные городки по всему региону. Спецслужбы предупреждают, что это лишь первые знамения предстоящей катастрофы, и что мы должны готовиться к открытой войне с Помоваррой."
goy_pomovarra.78.a:0 "Ох уж эти повстанцы!"

goy_pomovarra.79.t:0 "Помоваррская просьба"
goy_pomovarra.79.d:0 "Наши новые союзники в Помоварре выставили нам еще один запрос на военное снаряжение перед надвигающейся войной с Аквелией. Учитывая то, насколько аквелийские силы превосходят их, многие сомневаются, что Помоварра – несмотря на любую нашу поддержку – смогут действительно противостоять аквелийскому маршу на север. Выделив дополнительные ресурсы для наших союзников, мы наверняка повысим их шансы, но мы не можем забывать о своих внутренних проблемах. Конечно, чисто показательная поддержка нам не повредит, и даже за нее они будут нам признательны, если они сумеют сохранить свою независимость."
goy_pomovarra.79.a:0 "Дать минимум."
goy_pomovarra.79.b:0 "Выделить значительную поддержку."
goy_pomovarra.79.c:0 "Послать все, что есть!"

goy_pomovarra.80.t:0 "Снабжение из Фетизии"
goy_pomovarra.80.d:0 "Фетизцы прислали небольшую поставку снаряжения, заявив, что внутренние трудности не позволяют им предоставить нам ничего большего. Хотя это меньшее, на что мы рассчитывали, оно тем не менее пригодится нам в предстоящей войне."
goy_pomovarra.80.a:0 "Грустно..."

goy_pomovarra.81.t:0 "Фетизская поддержка"
goy_pomovarra.81.d:0 "Из Фетизии прибыла большая поставка различных типов вооружения и прочих вещей, необходимых для ведения войны с Аквелией. Все это значительно поможет нашим вооруженным силам!"
goy_pomovarra.81.a:0 "Друзья – это хорошо!"

goy_pomovarra.82.t:0 "Фетизские дивизии прибыли"
goy_pomovarra.82.d:0 "Наши дорогие друзья из Фетизии решили поддержать наше дело огромной поставкой стрелкового оружия и снаряжения, а также прислали небольшую группу добровольцев, специально подготовленных для боя с аквелийцами."
goy_pomovarra.82.a:0 "Чудесно!"

goy_pomovarra.83.t:0 "Защита наследия"
goy_pomovarra.83.d:0 "Древнее Королевство погибло семь веков назад, но надежда на восстановление независимой Помоварры осталась. Каждый раз, когда представлялась возможность, помоварцы восставали против чужеземных тиранов – и каждый раз терпели поражение. Те, кто вел помоварцев на приступ были лучшими из нас, теми, кто помнил и чтил прошлое – и мечтал о светлом будущем. Но за каждым поражением следовала новая волна репрессий. Знатные рода прерывались, старейшины кланов умирали в бою. С каждым поражением мы теряли хранителей нашего наследия. Это нас не останавливало, но с каждой смертью мы теряли крупицу того, что делает нас помоварцами – пока не осталось ничего, кроме стремления к свободе. Теперь, когда мы наконец обрели ее, мы ясно видим масштаб ущерба, нанесенного нашему народу. Наши древние традиции почти забыты, наш родной язык заменен языком захватчиков, нашу историю и легенды помнят лишь немногие старики.\nМы должны действовать, если хотим сохранить хоть что-то из нашего наследия. Современный помоваррский язык, составленный комитетом уважаемых лингвистов со всей страны, отныне будет закреплен как государственный язык Помоварры – единственный, разрешенный к использованию в правительстве. Он заменит аквелийский – болезненное напоминание о временах подчинения. Другие академики изучают разрозненные остатки исторических книг из библиотек самых старых кланов и опрашивают странствующих рассказчиков, в то же время пытаясь вернуть или хотя бы получить право на исследование помоваррских реликвий, оказавшихся за рубежом. Результатом их работы станут исчерпывающие книги о помоваррской истории и сборники народных мифов и легенд, которые мы введем в школьную программу, чтобы придать каждому молодому помоварцу чувство гордости за свою страну и связи со своим прошлым."
goy_pomovarra.83.a:0 "Помоварра будет помнить!"

goy_pomovarra.84.t:0 "Наша величайшая победа"
goy_pomovarra.84.d:0 "В бывшем королевском дворце Аквилы стояла небывалая тишина. Хотя грандиозное здание не пострадало в ходе боев за город, в последовавшие дни беззакония многие его богатства оказались в лапах грабителей. После этого дворец совсем утратил свое значение, и по его роскошным залам гуляли только помоваррские патрульные. Но сегодня во дворец прибыл Морван Ренан – и вскоре потерялся в лабиринте коридоров. По словам сторожа, тот, кого он искал, точно был где-то здесь.\nНаконец, Морван почуял слабый запах табачного дыма, и следуя ему, пришел в комнату, некогда служившую картинной галереей. Грабители взяли отсюда только золоченые рамы, оставив полотна нетронутыми. Посреди комнаты, напротив огромной картины, стоял Камриз и, как обычно, курил. Погруженный в мысли, он даже не поприветствовал товарища, пока тот не спросил,\n«Командир, вы прочитали планы парада, которые я вам отправил? Совет хочет провести его до конца недели».\n«Да. Пусть так и будет,» пробубнил Камриз, разглядывая картину. Наступило неловкое молчание. «День Пламенных Небес,» продолжил он как будто про себя «Дурацкое изображение. Рыцари в броне, которую изобретут только через двести лет после битвы, и прошла она не на равнине, а среди холмов. Хотя к концу от них ничего не осталось... Равно как и членов королевской семьи, которые могли бы сдать победителям обломки Дирендала...» Камриз указал на соответствующую часть полотна.\n«Занятно... командир. Не знал, что вы разбираетесь в исторической живописи,» ответил смущенный Ренан.\n«Давным-давно я хотел посвятить себя истории... Но потом вся Грифония как будто сошла с ума. Если бы эта война прошла лет двести назад, написал ли бы кто-то похожую картину о сдаче аквелийского правительства нам? И как бы она выглядела? Скажи, Ренан, что по-твоему художник хотел изобразить здесь?»\nМорван переступил с лапы на лапу, думая, как ответить, «Триумф, наверно... Славу Аквелии?»\n«А для нас это день страха и утраты. Семьсот лет мы пытались отмстить за него – и наконец смогли. Аквелийцы запомнят эти дни ровно так же.» Камриз сделал затяжку. «Морель был придурком, но теперь я вижу смысл в его бреду. История идет по кругу. Разные существа повторяют одинаковые события... Пойдем отсюда, Ренан. Нас ждут планы парада, верно?»\n Камриз направился к выходу, но его товарищ не двинулся, о чем-то размышляя.\n«Командир, если история повторяется, то что будет дальше? Какое будущее ждет Помоварру?».\nКамриз остановился, «Дальше...» заговорил он через пару секунд «Мы будем повелевать аквелийцами, и они возненавидят нас за это. Мы украли их золотую эпоху. Прошлая должна была закончиться их громогласной победой, а не тихим стоном. А мы... Мы сделаем все возможное, чтобы Помоварра крепчала, и допустим множество ошибок по пути. Ясно одно: пока что...»"
goy_pomovarra.84.a:0 "...у нас есть будущее."

goy_pomovarra.85.t:0 "Тяжесть небес"
goy_pomovarra.85.d:0 "Свободные города Западной Грифонии: Грифтон, Фезера и – самый главный из них – Скайфол всегда приносили и огромную пользу, и головную боль тому, кто ими владел. Вместилища власти и несметных богатств, центры торговли и промышленности, правящие всем регионом, свободные города теперь наши – вместе со всеми их проблемами. В них живут великие множества грифонов разных – и часто смешанных – народностей. Поскольку теперь свободные города – неотъемлемая часть Помоваррской Республики из-за их стратегической важности, мы должны решить, как наиболее эффективно – и мирно – управиться с местными жителями. Наименьшую опасность представляет Фезера из-за того, что олигархи вместе с мафией практически полностью разрушили старую вертикаль власти. Учитывая культурную близость фезерцев и грайфвальдцев, их будет легко включить в состав Помоварры как представителей родственных народов, не говоря о том, что они тепло примут возвращению справедливости и порядка в их город.\nС землями Скайфола дела обстоят сложнее. Население региона отдаленно напоминает фетизцев, но жители города, всегда бывшего плавильным котлом, не выдерживают такого сравнения. Герцландцы, грайфвальдцы в северных районах и представители всех существующих народностей и видов зовут Скайфол своим домом – за исключением знаменитых скайфольских олигархов, которые спешно бежали после того, как мы отобрали их владения. Мы не могли позволить второй Фловене вырасти внутри наших границ. Но теперь нам нужно решить, что делать со Скайфолом. Простейшим вариантом было бы предоставить городу особый статус внутри Помоварры, дарующий частичную независимость и ограниченное самоуправление ему, а также некоторые права родственных народов его жителям. Как более радикальное решение, предлагается объявить всех скайфольцев родственным народом – исключая самых пестрых и необычных представителей. Однако, это точно пошатнет устои нашей республики. Также есть третий путь – объявление всех свободных городов автономными регионами Помоварры и полноценное присоединение их внешних областей, позволяющее применять к ним методы ассимиляции."
goy_pomovarra.85.a:0 "Дать Скайфолу автономию."
goy_pomovarra.85.b:0 "Интегрировать всех!"
goy_pomovarra.85.c:0 "Пойдем по третьему пути..."

goy_pomovarra.86.t:0 "Помоварцы предлагают союз"
goy_pomovarra.86.d:0 "Помоварра, наша родственная страна на западе, преодолела всех врагов и стала одним из сильнейших государств в Грифонии. Теперь к нам прибыли дипломаты от Помоваррской Республики с предложением военного союза, заявив, что они помогут нам вернуть украденные у нас земли в Центральной Грифонии. Мы согласны на это?"
goy_pomovarra.86.a:0 "Разумеется!"
goy_pomovarra.86.b:0 "Ни за что!"

goy_pomovarra.87.t:0 "Румейр присоединяется к пакту"
goy_pomovarra.87.d:0 "Прекрасные новости! Румейрцы согласились на наше предложение и официально вступили в наш альянс. Теперь мы должны соблюсти свои обещания и освободить земли, украденные у наших братьев!"
goy_pomovarra.87.a:0 "Большой успех!"

goy_pomovarra.88.t:0 "Румейр отклонил предложение!"
goy_pomovarra.88.d:0 "По совершенно неясным причинам румейрцы отказались вступать в наш альянс. Похоже, что они предпочли продолжить свое жалкое существование на мелком озерном архипелаге."
goy_pomovarra.88.a:0 "Ладно..."

goy_pomovarra.89.t:0 "Приглашение в Аэтскую Лигу"
goy_pomovarra.89.d:0 "Помоваррские дипломаты предлагают нам вступить в их альянс. Они заявляют своей целью достижения мира и стабильности в Западной Грифонии путем вступления ее стран в международный альянс под названием “Аэтская Лига”, который станет первым шагом к дальнейшему объединению региона. Хотя мы не согласны со всеми идеями, которые они продвигают, очевидно, что соединение наших сил будет полезно в предстоящих войнах с Аквелией и Империей."
goy_pomovarra.89.a:0 "Присоединяемся!"
goy_pomovarra.89.b:0 "Нам они не нужны!"

goy_pomovarra.90.t:0 "[FROM.GetName] присоединяется к Лиге!"
goy_pomovarra.90.d:0 "Наши дипломаты вернулись с прекрасной новостью! [FROM.GetName] приняла приглашение в Аэтскую Лигу. Вместе мы изменим Грифонию к лучшему, принесем мир и стабильность континенту!"
goy_pomovarra.90.a:0 "Замечательно!"

goy_pomovarra.91.t:0 "Отказ от [FROM.GetName]!"
goy_pomovarra.91.d:0 "К сожалению, [FROM.GetNameDef] отказывается вступить в Аэтскую Лигу. Нам ничего не остается, кроме как освободить их народ силой. Позже местные жители отблагодарят нас за это."
goy_pomovarra.91.a:0 "В бой!"

goy_pomovarra.92.t:0 "Помоваррское предложение"
goy_pomovarra.92.d:0 "После Республиканской революции 980-го внешние провинции Аквелии, включая Помоварру, объявили независимость. Вечно непокорные помоварцы подняли восстание, и даже потерпев поражение, продолжили борьбу скрытно. Потом, победив самопровозглашенного князя Райхера, они вновь объявили независимость и вскоре захватили Фловену, родину их нежеланных властителей. Теперь Помоварра стоит во главе так называемой “Аэтской Лиги”, объединяющей Периферию под единым штандартом. Цель Лиги очевидна – сдерживание нас.\n\nОднако, недавно нам пришло письмо от “Главнокомандующего” Хармана Камриза, главы Лиги, который заявил, что готов к переговорам с нашей республикой, желает положить конец вражде и устроить мирное сосуществование Аквелии и ее бывших субъектов как равноправных стран. Многие встретили это предложение с недоверием – помоварцы славятся своей ненавистью к нам. Члены ПДА и многие другие политики требуют отказаться от предложения и начать подготовку к войне с Лигой, заявляя, что переговоры с “мятежной провинцией” равны измене Аквелии и ее предназначению. Однако, некоторые менее националистически настроенные деятели видят в переговорах новое начало для региона. Возможность установления длительного мира и налаживания связей с соседями..."
goy_pomovarra.92.a:0 "Никаких переговоров!"
goy_pomovarra.92.b:0 "Готовимся к конференции!"

goy_pomovarra.93.t:0 "С врагом лицом к лицу"
goy_pomovarra.93.d:0 "«Они совсем не торопятся,» сказал про себя Камриз, закуривая новую сигарету. На лице пони-лакея, стоящего у дверей, проступило отвращение. Чопорным тоном он заявил, «В конференц-зале нельзя курить – здесь некуда стряхивать пепел!» и озлобленно фыркнул, когда Камриз заявил, что тот мог бы принести пепельницу. Командиру не пристало ходить к балкону каждый раз, когда ему захочется покурить. Ренан посмотрел на пони с состраданием, но не сказал ни слова. «Что если это ловушка...» размышлял вслух Камриз.\n«Тогда это невероятно странная ловушка, командир,» ответил Ренан. «Они могли арестовать нас еще на границе или в городе.» Наконец, двери раскрылись, и в комнату вошла небольшая группа аквелийцев с молодой грифоншей во главе.\n«Кажется, я знаю офицера справа,» прошептал Камриз, «Я кинул гранату в его машину в 980-ом, но, к сожалению, не попал.»\n«Господа,» она начала речь, «я счастлива видеть вас в Весткипе. Прошу прощения, что заставила ждать; по пути возникли... угрозы безопасности. Я Сесилия Гудро, Президент Аквелийской Республики». Она протянула лапу Камризу, который тут же крепко ее пожал.\n«Ох, угрозы безопасности...» Камриз усмехнулся «Я сам с ними встретился на пути сюда. Какие-то хулиганы заложили бомбу под мою машину, но неправильно развели провода».\n«Наши проблемы схожи. И здесь, и в Помоварре грифоны недовольны таким поворотом событий. Но, раз мы все же добрались сюда в целости, давайте начнем! Нам многое предстоит обсудить...»\nПереговоры заняли весь день. Несмотря на то, что несколько вопросов остались в подвешенном состоянии, общие договоренности были достигнуты. Тонкости пришлось отложить на потом, чтобы подписать основное соглашение сегодня. Помоваррская делегация задержалась еще на день, чтобы отпраздновать торжественное событие, несмотря на нежелание Камриза (правительственные вечеринки пугали его больше, чем наступление танковой дивизии). К его счастью, в этот раз ему выделили пепельницу, и он провел большую часть торжества в своей стихии, обсуждая методы партизанской войны с аквелийскими офицерами, обмениваясь опытом, нажитым в ходе обеих революций – аквелийской и помоваррской."
goy_pomovarra.93.a:0 "Мы не такие разные, как казалось..."

goy_pomovarra.94.t:0 "Аквелия отказалась"
goy_pomovarra.94.d:0 "Как предполагало большинство, аквелийцы отклонили наше предложение, ответив, что они не станут вести переговоры с “мятежниками” и “сепаратистами”. Наши разведчики сообщают о перемещениях вооруженных аквелийских сил, намекающих на подготовку к вооруженному столкновению. Нам стоит объявить войну первыми, чтобы застать их врасплох."
goy_pomovarra.94.a:0 "Они никогда не желали мира."

goy_pomovarra.95.t:0 "Конец начала"
goy_pomovarra.95.d:0 "Харман Камриз вычеркнул очередную строку. Он уже всерьез думал начать с чистого листа. Между зачеркнутыми частями его речи осталось так мало текста, что она звучала как бессвязная болтовня. Он ненавидел писать речи. Как же Морелю удавалось выступать перед публикой по нескольку часов, порой как будто бы совсем без подготовки? Глубоко вздохнув, он взял новый лист. Будущее, единство, прощение... Он знал, о чем говорить, но никак не мог собрать мысли воедино. После нескольких минут тщетной писанины он отложил ручку, прикурил сигарету и с пустым взглядом повернулся к стене. После тридцати лет борьбы он наконец добился своего, достиг мира. Продолжительного мира, который должен был привести его страну в светлое будущее. Он давно устал от войны, но даже не начал думать о том, что будет, когда она закончится. И вот он уже писал речь о терпимости, о примирении... Он знал, что аквелийцы тоже желали этого – по крайней мере, некоторые из них. Но он никак не мог забыть все годы, которые он провел, сражаясь против них, забыть друзей, боевых товарищей и членов его семьи, которые пали на войне с ними. Он положил конец этой войне. Положит ли он конец Помоварре?\nИз коридора донеслись звуки шагов, и вскоре кто-то громко постучал в дверь. Потом в комнату ввалился Морван Ренан с группой других офицеров. Их одежды пестрили цветами всех национальных армий, которые скоро должны были объединиться под флагом Аэтии. Новой униформы до сих пор не хватало на всех.\n«Командир, извините, что отвлекаем, но у нас некоторые мысли по поводу парада, требующие вашего внимания». Камриз вяло кивнул. Грифоны начали перекрикивать друг друга, выдвигая предложения, критикуя их и внося правки. Командир почти не вмешивался в разговор, и вскоре они как будто совсем забыли о его присутствии. Не прошло и часа, как из мозгового штурма родился план, – вполне хорошо обдуманный. Ренан получил одобрение Главнокомандующего, и довольные офицеры ушли.\nВдруг, Камриза настигло откровение. Его дело сделано; ему больше нечего добавить. Аэтия могла спокойно жить без него – грифоны вроде Ренана позаботились бы об этом. Да, он больше не слышал на улицах помоваррской речи, но лица прохожих источали счастье. Может, в этом заключалась истинная задача помоварцев? Принести мир в Грифонию и возглавить ее на пути к светлому будущему – даже если для них в этом будущем нет места. Достойное наследие."
goy_pomovarra.95.a:0 "Ради такого наследия можно умереть."

goy_pomovarra.96.t:0 "Свежая кровь"
goy_pomovarra.96.d:0 "«Мы не переживем вашего ухода, командир. Прошу вас, пересмотрите это решение. Без вашего руководства–»\n«Вы прекрасно справитесь без меня» – Камриз перебил Ренана на полуслове – «У нас полно молодых талантливых офицеров. И немало старых хороших грифонов – вроде тебя. Не говоря о том, что среди аквелийцев в нашей армии я непопулярен, и некоторые политики уже жалуются на “неограниченное влияние военных на внутренние дела”. И потом, если я останусь, они наверняка попытаются использовать мою популярность в своих целях. А я так устал от этой возни... Но я не уйду от нее никогда, если не уволюсь. Кстати, поздравляю тебя с назначением. Я всегда считал, что ты пойдешь в верха – но на должность президента? У тебя большие амбиции.»\n«Спасибо, командир» – Ренан кивнул – «Я сделаю так, чтобы ваше наследие жило после вас–»\nКамриз рассмеялся – «Как? Станешь курильщиком? Я приятно удивлен, что моя работа так успешно закончилась, но ты должен найти свой путь, Морван. Ты же умный грифон; не повторяй мои ошибки. И больше не зови меня командиром; я уже не главный здесь.»\n«И чем же вы займетесь в отставке, командир?» – поинтересовался Ренан.\n«Я же только что попросил так меня не называть...» – Камриз вздохнул – «Знаешь, меня всегда привлекала история. Пора мне наконец вернуться к ней. В мире полно устных преданий, которые кто-то должен записать, пока их не забыли... А может, я все-таки съезжу в Мейргипет? Давно мечтал посмотреть на пирамиды...» Лицо Ренана исказилось, а из его рта вышли звуки, характерные для двигателя трактора. «Прекрати смеяться, Морван! Неужто старикам теперь нельзя мечтать?»\n«Извините. Я представил вас в цветастой рубашке из Пуэрто-Кабальо – как те, которые иногда носят эквестрийские туристы. И почему-то мне показалось, что под ней вы скрываете пояс с гранатами, командир.»"
goy_pomovarra.96.a:0 "«От старых привычек тяжело избавиться!»"

goy_pomovarra.97.t:0 "Выборы!"
goy_pomovarra.97.d:0 "После основания Аэтской Конфедерации военное правительство расформировалось, и в нашей новой республике прошли первые выборы. В ходе предвыборных кампаний два кандидата вышли на первый план: Шугар Креп, аквелийская пони, выступающая за обширное социальное обеспечение, и Морван Ренан, помоваррский генерал, бывший заместитель Хармана Камриза, заручившийся поддержкой консерваторов и республиканских политиков, придерживающихся идей Кемерская.\nПобедивший на выборах определит будущее нашего молодого государства."
goy_pomovarra.97.a:0 "Президент Креп!"
goy_pomovarra.97.b:0 "Президент Ренан!"

goy_pomovarra.100.t:0 "Приглашение в Аэтскую Лигу"
goy_pomovarra.100.d:0 "От Аэтской Конфедерации только что прибыл дипломат. После успешного объединения Западной Грифонии правительство Аэтии решило договориться с соседними странами в надежде на установление долгосрочного мира на континенте. Для достижения этой цели они предлагают нам вступить в их альянс. Как мы ответим?"
goy_pomovarra.100.a:0 "Мы согласны!"
goy_pomovarra.100.b:0 "Никаких сделок с Аэтией!"

goy_pomovarra.101.t:0 "Лига расширяется"
goy_pomovarra.101.d:0 "Чудесные новости! Наш дипломат сообщил, что [FROM.GetName] принимает приглашение в Аэтскую Лигу. Благодаря этому, мы на шаг ближе к установлению долгосрочного мира в Грифонии."
goy_pomovarra.101.a:0 "Колоссальный успех!"

goy_pomovarra.102.t:0 "Наш дипломат отослан"
goy_pomovarra.102.d:0 "К сожалению, наша попытка провалилась. [FROM.GetName] отклоняет наше предложение. Мы не станем силой присоединять другие государства к нашему альянсу, но несомненно, этот отказ – серьезное препятствие для наших планов."
goy_pomovarra.102.a:0 "Удручающий конец..."

goy_pomovarra.103.t:0 "Чистка Скайфола"
goy_pomovarra.103.d:0 "Город Скайфол – один из важнейших торговых и промышленных центров Грифонии. Но никакие богатства не могли спасти его от поражения под натиском нашей славной армии. Олигархи Скайфола бежали как крысы с тонущего корабля, зная о судьбе Фловены, но многие другие противники нашего режима остались в городе. Скайфол, Фезера и Грифтон кишат преступниками, коммунистами и иностранцами, налетевшими на этот некогда процветающий регион, как коршуны на гниющий труп. Жителям Скайфола равно плевать как на прошлое, так и на будущее. Единственное, что их волнует – это быстрая прибыль. В отличие от Фловены, под этой гнилью нет здоровой плоти. Потому, для нас нет выбора. Мы должны очистить город так, как хирурги вырезают опухоли. Большая часть населения – включая всех недовольных – будет выслана из региона, после чего все грязные трущобы, окружающие «свободные города», пойдут под снос. Конечно, местные будут сопротивляться, но методы усмирения повстанцев у нас давно отработаны. Все имущество иностранцев и олигархов, которое они украли у честных рабочих, будет изъято и пущено в дело. Излишества, доступные благодаря торговой сети Скайфола, нас не привлекают, в отличие от его колоссальных промышленных возможностей. Доки и заводы города произведут средства нашего подчинения Грифонии. На службе у нас «свободные города» достигнут искупления, и возможно, в будущем станут домом нового племени достойных грифонов."
goy_pomovarra.103.a:0 "Долгожданное избавление!"

goy_pomovarra.129.t:0 "Волна беженцев"
goy_pomovarra.129.d:0 "После возрождения Помоваррского Королевства новости из Западной Грифонии становятся все мрачнее. Чистки, насильные переселения и разрушение культур стали нормой. Завоевав Скайфол, помоварцы, с необычайной даже для них жестокостью, начали избавляться от населения региона – в особенности от многочисленных иностранцев, проживающих там уже годами. Под страхом перед расправой, сотни тысяч бежали из Скайфола, Фезеры и других прибрежных городов. Тех, кто оказывал сопротивление, изгоняли насильно. Так помоварцы сознательно устроили международный кризис – самую массовую волну беженцев за последние годы. Многие из переселенцев отправились к нам, и теперь мы испытываем большие трудности в помощи им. Хотя в долгосрочной перспективе мы извлечем пользу из этой неожиданной прибыли населения, на данный момент миграционная служба, таможня и прибрежный патруль настолько перегружены, что наши торговые возможности сильно ограничены."
goy_pomovarra.129.a:0 "Безумие. Это безумие..."

goy_pomovarra.104.t:0 "Скайфольские беженцы"
goy_pomovarra.104.d:0 "После возрождения Помоваррского Королевства новости из Западной Грифонии становятся все мрачнее. Чистки, насильные переселения и разрушение культур стали нормой. Завоевав Скайфол, помоварцы, с необычайной даже для них жестокостью, начали избавляться от населения региона – в особенности от многочисленных иностранцев, проживающих там уже годами. Под страхом перед расправой, сотни тысяч бежали из Скайфола, Фезеры и других прибрежных городов. Тех, кто оказывал сопротивление, изгоняли насильно. Так помоварцы сознательно устроили международный кризис – самую массовую волну беженцев за последние годы. В то время как большинство беженцев направились в сторону Нова Грифонии, многие – в особенности пони и зебры – прибыли на наши берега. Наш долг – помочь этим несчастным существам, чьи дома силой отняли обезумевшие грифоны."
goy_pomovarra.104.a:0 "Добро пожаловать!"

goy_pomovarra.105.t:0 "Проект «Бритва»"
goy_pomovarra.105.d:0 "Сводный отчет\nИзучение Дирендала доказало, что меч несомненно был изготовлен песьими кузнецами Алмазной Горы около восьми столетий назад. Зачарованный магией и псов, и грифонов, меч, кроме легендарной способности резать любой материал, также защищал владельца от вражеских заклинаний. Однако, это не спасло Короля Древней Помоварры от колдовства единорогов, нанесшего непоправимый ущерб структуре меча и его чарам. Некоторые свойства меча были полностью утрачены, и оказались невосстановимы, что замедлило исследования. Но при поддержке нескольких кузнецов Ангаз-Барака, нашей команде все же удалось воссоздать чары, ответственные за бронебойные свойства меча. Хотя самым эффективным применением для них будет магическое оружие, стандартное вооружение тоже может быть улучшено с их помощью. Стоит отметить, что воссозданные чары не придадут оружию ту же силу, которая присуща Дирендалу, из-за отсутствия специализированных материалов, использованных при ковке легендарного меча. Лишь небольшие залежи их были найдены в Подскулье. Благодаря находке, нам удалось полностью восстановить Дирендал. Перекованный меч будет доставлен Королю согласно его приказу, чтобы он служил ему как в древности."
goy_pomovarra.105.a:0 "За королевством возрожден и меч."

goy_pomovarra.106.t:0 "Проект «Аватар»"
goy_pomovarra.106.d:0 "Сводный отчет\nАнализ полученных данных позволил нам воссоздать ритуал привязки духов в соответствии с описаниями магов 2-го столетия ПИЛ. Исследование старых записей волшебников намекает на то, что их собственные попытки в проведении ритуала не приносили успеха, а описания они брали из более старой литературы, не дожившей до наших дней. Относительно низкая концентрация духов в Западной Грифонии доставила нам некоторые трудности, но мы смогли поймать достаточно магических существ, чтобы перейти к экспериментам. Первая группа подопытных грифонов погибла в ходе привязки; то же произошло с пленными пони. Следующая группа испытателей – в этот раз, волонтеров – достигла большого успеха. 52 процента привязок прошли успешно, и только 3 процента закончились смертельно. Исследователи предполагают, что шанс успеха повысится, если духи будут настроены благосклонно. Успешно связанные грифоны показали улучшение физических способностей, и 5 процентов из них овладели магией – в большинстве, элементального типа. Доказано, что сила эффектов прямо пропорциональна магическому потенциалу привязанного духа. Однако, привязка более сильных духов соответствует скорому ухудшению здоровья испытуемого – и физического, и психологического. Через 3 месяца все подопытные, получившие магические способности, были либо в коме, либо мертвы. Наблюдение за остальными продолжается, но они тоже проявили знаки ухудшения здоровья, указывающие на скорую смерть в промежутке от 1-го до 5-и лет и потерю способности к службе в армии по прошествии половины этого времени.\nВторая команда исследователей, опираясь на данные, полученные первой, успешно привязала духи к неживым объектам. Военное снаряжение – особенно, оружие ближнего боя – и бронированный транспорт оказались лучшими вместилищами для них. Причину такому поведению предложил Доктор Дафф. Он считает, что на успех привязки положительно влияет психологическая близость пользователя к своему оружию, чаще всего выражающаяся в наделении предмета качествами живого существа, например, именем (более подробное описание в Приложении В). Самолеты тоже показали высокую способность к привязке духов, но Командование ВВС отказалось от дальнейшего проведения ритуалов из-за непозволительного повышения частоты поломок в связанных образцах.\nНизкая продолжительность жизни и утрата разума делает применение связанных с духами солдат бессмысленным на данный момент. Ограниченное количество доступных магических существ позволяет нам широко использовать привязку духов только для одного типа вооружения."
goy_pomovarra.106.a:0 "Стрелковое вооружение."
goy_pomovarra.106.b:0 "Танки и бронетранспортеры."
goy_pomovarra.106.c:0 "Бросить проект!"

goy_pomovarra.107.t:0 "Проект «Мегалит»"
goy_pomovarra.107.d:0 "Сводный отчет\nПоисковые команды обнаружили дюжину мегалитических кругов в помоваррских территориях. Одиннадцать из них были построены помоваррскими друидами, но хотя они пользовались двенадцатым, построен он был намного раньше. Магические изменения не позволяют точно определить возраст постройки, но можно предположить, что она создана не менее пяти тысяч лет назад, и строили ее не грифоны. Есть подтверждения тому, что древние помоварцы пользовались этим мегалитическим кругом, и вероятно, остальные были созданы по его подобию. Его строители не оставили и следа, а все найденные символы были выбиты в камнях помоваррскими друидами – кроме одного. Самое древнее изображение выглядит как прямоугольник внутри круга. Анализ магического отпечатка постройки обеспокоило исследователей. Предположительно, по первому назначению, круг должен был не просто собирать магические энергии, но высасывать их из всех сверхъестественных и магически одаренных существ на большой территории. Однако только с помощью этого круга невозможно достичь такого эффекта. Вероятно, он был частью большего строения, и без дальнейших находок метод высасывания энергии также останется загадкой. Согласно легендам, несколько древних существ в Эквестрии были способны на похожие трюки, но не в таких масштабах. Присутствие этой постройки в Западной Грифонии может быть причиной того, что здесь так мало духов и сверхъестественных существ, относительно других частей континента. Однако, на данный момент высасывание магии остается гипотезой. Полученная информация о двенадцатом круге будет засекречена, чтобы не пошатнуть закрепившееся мнение академического сообщества.\nТрадиционный метод добычи энергии для ритуальной магии оказался неэффективным. Сбор магии для обширных заклинаний требует от нескольких месяцев до года. Но возможности двенадцатого круга, как огромной магической батареи, позволят сократить сроки, если мы подключим другие круги к нему. К использованию готовы несколько друидских ритуалов, воссозданных исследовательской командой профессора Гаррека. Основываясь на полученных знаниях и современной магической теории, мы возвели новую мегалитическую постройку на засекреченной базе «Кейрт» и успешно проверили ее работоспособность."
goy_pomovarra.107.a:0 "Отлично!"

goy_pomovarra.108.t:0 "Проект «Котёл»"
goy_pomovarra.108.d:0 "Сводный отчет\nБольшинство друидских писаний составлены из «мистических рун», оберегающих тексты от прочтения чужаками. Расшифровка не потребовала особых усилий, поскольку лингвисты Магической Коллегии уже имели большой опыт в переводе различных рунических систем письма, использовавшихся помоваррскими друидами. Незаконченность большинства записей и намеренно смутные описания оказали намного большие трудности. Ожидая открыть простые алхимические рецепты, мы наткнулись на кладезь информации скрытую под слоями символизма. К счастью, часть содержания этих писаний просочилась в помоваррский фольклор в более ясных формах, которые в итоге позволили нам полностью расшифровать друидские тексты.\nИзвестные в легендах под разными названиями вроде «эликсир силы», «отвар выносливости» или «лечебное снадобье», напитки друидов были разнообразны и отличались от одного изготовителя к другому. Однако, большинство друидов брали в основу зелий одинаковое сырье или заменяли общепринятые компоненты аналогичными. По нашему предположению, замены происходили и для улучшения свойств продукта, и в результате пропажи источников изначальных компонентов, например, частей тел волшебных существ или ныне вымершего цветка под названием «слезы Эйра».\nСоздание нового зелья прошло с минимальными потерями персонала от взаимодействия с ядовитыми элементами и неудачных экспериментов. Как и ожидалось, прием зелья дал подопытному сверхъестественную силу и выносливость без побочных эффектов, часто приписываемых наркотическим препаратам. Общий подъем способностей организма от нашего первого зелья немного улучшил процессы лечения, но не до той степени, которую описывали древние тексты. Дальнейшие эксперименты позволили нам улучшить лечащие свойства и получить хорошую замену магическим методам восстановления. Но тестируя более специализированные смеси, мы обнаружили, что сила воздействия достигается в ущерб длительности.\nДолговременное использование зелий остается темой для будущих исследований, однако, как и с прочими алхимическими продуктами, злоупотребление, вероятно, приведет к ущербу внутренним органам. Команда подготовила три рецепта для массового производства. Стоимость высока, и доступ к необходимому сырью сильно ограничен, а замена составляющих на более часто встречающиеся ухудшает свойства зелий. Из трех рецептов, мы способны пустить в производство только один."
goy_pomovarra.108.a:0 "Зелье Силы."
goy_pomovarra.108.b:0 "Зелье Выносливости."
goy_pomovarra.108.c:0 "Зелье Лечения."

goy_pomovarra.109.t:0 "Помоварра предала нас!"
goy_pomovarra.109.d:0 "Мы должны были предсказать это. Помоварцы пошли против договора с нами, заявив, что после поражения Аквелии, наш союз не представляет пользы для них. Также они отказались передать обещанные нам территории в Грайфвальде, потому что они считают их «землей предков». Нельзя было доверять помоварцам, но они хотя бы избавились от Аквелии. Позже мы разберемся с этими гнусными предателями, но пока у нас есть более важные задачи."
goy_pomovarra.109.a:0 "Треклятые помоварцы!"

goy_pomovarra.110.t:0 "Союз с Помоваррой"
goy_pomovarra.110.d:0 "После победы над Аквелией помоварцы решили укрепить связь между нашими народами путем официального союза. Помоварра поможет нам вернуть территории в Герцланде и Аквелии, и как только все противники падут, они передадут нам Западный Грайфвальд. Несмотря на очевидную пользу от наличия доверенного союзника на юге, некоторые политики считают, что Помоварра может вовлечь нас в нежелательные конфликты. Однако, если мы откажемся, вряд ли помоварцы вернут нам Грайфвальд..."
goy_pomovarra.110.a:0 "Принять предложение."
goy_pomovarra.110.b:0 "Отказаться."

goy_pomovarra.111.t:0 "Союз с Фетизией"
goy_pomovarra.111.d:0 "Из Фетизии только что пришел ответ. Они согласны с нашим предложением, и теперь между нашими странами заключен официальный союз. Мы уверены, что это – только начало глубокого и плодотворного сотрудничества!"
goy_pomovarra.111.a:0 "Отлично!"

goy_pomovarra.112.t:0 "Фетизия отказалась"
goy_pomovarra.112.d:0 "По неясным причинам фетизцы решили не вступать с нами в союз. В качестве повода они заявили, что сотрудничество с Помоваррой не принесет никакой пользы для них. Хотя они еще не предприняли враждебных действий, нам стоит укрепить границу с ними."
goy_pomovarra.112.a:0 "Грязные грифоны!"

goy_pomovarra.113.t:0 "Эпилог: Наследие"
goy_pomovarra.113.d:0 "Обложка книги была проста; только название и нечитаемое имя автора. Она видала лучшие времена, и один из владельцев явно слишком часто ставил на нее чашку с кофе. Что-то потянуло Адриенну выбрать именно эту книгу из сотен других, пылящихся в шкафах магазина букинистики. Грифонша открыла ее, и, к своему вящему недоумению, смогла прочесть лишь пару слов, походящих на аквелийские. Язык книги почему-то казался ей знакомым, хотя он не был похож ни на карфинский, ни на герцландский, ни даже на фетизский. Годы изучения разных языков Грифонии внезапно подвели ее. Судя по числу грифонов во властных одеяниях на картинках и изображениям богов, текст был исторической (а может, и религиозной) направленности. Хотя даже Троица здесь выглядела как-то странно... Любопытство взяло верх, и Адриенна тут же пошла к продавцу, грифону столь старому и седому, что он, наверно, застал не только Революцию, но даже Гровера Третьего.\n«Простите... Я хотела бы купить эту книгу. И, может, если вы знаете, на каком языке она написана, не могли бы вы посоветовать мне словарь или разговорник...»\nСтарик отвлекся от своей газеты и взглянул на обложку. Его глаза широко раскрылись от удивления.\n«Вепрь и Лилия?» Прочел он название, «Ох... это на помоваррском. Здесь, в Весткипе, почти никто на нем не говорит. Подождите минутку.» Продавец начал копаться в горе книг за прилавком.\n«Разве это не мертвый язык?» спросила удивленная Адриенна.\n«Как бы да... но не совсем. Он вымер здесь, но на юге некоторые его помнят. Просто когда все говорят на аквелийском, зачем знать помоваррский? В телевизоре на нем не говорят.»\n«Вы прочитали название. Вы на нем говорите?»\n«Когда-то знал, но с тех пор я почти все забыл. Я родился в Помазоне, но мне всегда было удобнее говорить по-аквелийски. Не говоря о том, что он не так-то прост, помоваррский... Ах, вот он!» Старик положил на прилавок пыльную книгу. «Словарь, как вы просили. Еще у меня должно быть издание этой книги» он указал на «Вепря и Лилию» «на аквелийском. У перевода и тиражи были побольше. Старина Камриз вертелся бы в гробу, если б узнал об этом.»\n«Камриз – это автор, верно?»\n«Чему вас учат в школах?» продавец вздохнул «Да, он автор и... основатель этой страны! Хотя, думаю, все с удовольствием дали ему кануть в забвение. И его, и всех его боевых товарищей сейчас считали бы террористами, не говоря об их политических взглядах...» Старик усмехнулся «Я служил посыльным в сопротивлении. Вот были времена! Ну да ладно. Я считаю, что вам лучше будет взять аквелийское издание, но если вы хотите изучать помоваррский, я могу дать вам учебник...»\nЧерез пару минут Адриенна вышла из магазина. Бесцельно шатаясь по пустым улицам, она вышла к маленькой площади. Некоторые кафе еще были открыты, и шум грифонских голосов и музыки время от времени нарушал спокойствие летнего вечера. Дела в Аэтии как всегда шли тихо – особенно здесь, вдали от больших городов, где жизнь текла быстрее. Адриенна села на скамейку и открыла купленную книгу.\n«Много столетий назад, когда королевства юга еще были молоды, то, что сейчас называется Помоваррой, было дикой землей, где жили воинственные племена грифонов...»"
goy_pomovarra.113.a:0 "Конец."

goy_pomovarra.114.t:0 "Объединение с Аэтией"
goy_pomovarra.114.d:0 "К нашему удивлению Аквелия недавно вошла в состав так называемой Аэтии, государства, стремящегося к единству и процветанию всех народов и видов Западной Грифонии. Теперь Аэтия направила взор на нас. Их дипломаты прибыли с предложением о присоединении нашей страны к Аэтской Конфедерации. Наши обычаи и культура будут защищены и приравнены в правах ко всем остальным. Хотя их мотивы звучат честно, мы сомневаемся в том, что они мирно примут наш отказ."
goy_pomovarra.114.a:0 "Мы согласны..."
goy_pomovarra.114.b:0 "Мы не сдадимся без боя!"

goy_pomovarra.115.t:0 "Таррин присоединяется!"
goy_pomovarra.115.d:0 "Хорошие новости! Тарринцы решили принять наше предложение, а их представитель только что подписал соглашение об аннексии. Теперь мы на шаг ближе к воплощению аэтской мечты!"
goy_pomovarra.115.a:0 "Отлично!"

goy_pomovarra.116.t:0 "Таррин отказывается!"
goy_pomovarra.116.d:0 "К сожалению, тарринские власти, ослепленные мечтой о суверенности и жадностью, ответили отказом на наше щедрое предложение. У нас нет иного выбора, кроме как освободить грифонов Таррина военным путем."
goy_pomovarra.116.a:0 "В бой!"

goy_pomovarra.117.t:0 "Аэтия требует передачи Таррина"
goy_pomovarra.117.d:0 "Новосозданная Аэтская Конфедерация только что потребовала, чтобы мы «вернули» им Таррин. Они заявляют, что между народами Аэтии и Таррина есть близкие культурные связи, и потому он должен принадлежать им. Хотя их оправдания совершенно бессмысленны, на их стороне другой важный аргумент – огромная армия. Разумно будет согласиться, чтобы не довести дело до войны, в которой мы рискуем проиграть..."
goy_pomovarra.117.a:0 "Пусть забирают свой Таррин!"
goy_pomovarra.117.b:0 "Нет! Мы будем воевать!"

goy_pomovarra.118.t:0 "Францистрия сдалась"
goy_pomovarra.118.d:0 "Власти Францистрии поступили мудро и сдали нам Таррин. Новый гарнизон уже выдвинулся в Таррин, а францистрийские войска отступают."
goy_pomovarra.118.a:0 "Большой успех!"

goy_pomovarra.119.t:0 "Война за Таррин"
goy_pomovarra.119.d:0 "Мы получили однозначный ответ. Францистрийцы скорее умрут, прежде чем уступят нам хоть сантиметр «их» земель. Оказывается, они не просто воры, но еще и дураки! Придется нам возвращать регион силой."
goy_pomovarra.119.a:0 "В бой!"

goy_pomovarra.136.t:0 "Переворот Ворст тот Ворста"
goy_pomovarra.136.d:0 "До недавних пор казалось, что Фетизия прошла период политической борьбы и ей удалось избежать падения в лапы правых демагогов и милитаристов. Разделенные и вздорящие, они не представляли угрозы. Однако, за последние дни ситуация изменилась – резко. Только сейчас мы узнали о том, что наши самые главные офицеры вступили в сговор с помоварцами, поддержав их войну с Аквелией, а взамен получив оружие, деньги и прочие меры поддержки для возрождения их политической кампании, которая разошлась как пожар по всему нашему обществу и – самое главное – внутри наших вооруженных сил. Под предводительством барона Германа Ворста тот Ворста несколько дивизий восстали и пошли войной против всех остальных, сохранивших приверженность нашему правительству. Мятежный барон объявил себя главой «Правительства национального спасения» и воззвал к своим покровителям на юге, чтобы те поддержали его восстание. Война с Помоваррой неотвратима, и весь Герцланд тоже будет вынужден вмешаться. Так или иначе, войне быть. Остается один вопрос: примем ли мы требования мятежников и позволим Ворсту взять власть или пойдем на приступ и будем вынуждены отбиваться от предстоящего вторжения?"
goy_pomovarra.136.a:0 "Власть барону!"
goy_pomovarra.136.b:0 "Мы никогда не сдадимся!"

goy_pomovarra.137.t:0 "Восстание в Фетизии"
goy_pomovarra.137.d:0 "Тяжело следить за всеми нашими длинными границами – особенно на юго-востоке, где плотные грайфвальдские леса промежаются крутыми холмами. Эта зона всегда была раем для контрабандистов и разбойников, но с недавних пор, вместо самогона и запрещенных веществ, по этим путям двигалось оружие и снаряды по заказу поверженных, но не сломленных фетизцев. Те, кого мы считали своими примерными подданными и преданной частью наших вооруженных сил, находились под влиянием иностранных демагогов и подстрекателей, а наша разведка и военные следователи получали огромные взятки за сокрытие сведений о предательстве. Теперь мы знаем, кто стоит за всем этим – Помоварцы, которые по невероятной иронии судьбы смогли завоевать Аквелию, а потом перевели свой взор на север. Давно сговорившись с фетизскими националистами, они разжигали пламя сопротивления и устроили восстание, которое теперь заняло все западные территории. Повстанцы, с бывшим фетизским генералом Германом Ворст тот Ворстом во главе, взяли несколько больших городов. Многие гарнизоны сдались без боя и присоединились к восстанию. Барон Ворст публично запросил помощь в его «борьбе за свободу» у помоварцев, на что их армия ответила переходом нашей границы! Перед нами не просто восстание, а полноценная война с нашим южным соседом. Очевидно, у нас нет другого выбора, кроме войны. Пришло время сделать то, что не удалось аквелийцам – заставить Помоварру подчиниться."
goy_pomovarra.137.a:0 "Готовьте танки!"

goy_pomovarra.138.t:0 "Восстание в Фетизии!"
goy_pomovarra.138.d:0 "Прекрасные новости! Нам докладывают, что несколько подразделений фетизской армии и местные партизаны (которых вооружили мы) пошли в наступление на большие города в Западном Герцланде. Оккупанты отступили на восток и окопались близ Де Влюгельса. Вскоре после захвата Ротендедама, Барон Ворст тот Ворст, глава повстанцев, объявил по радио о восстановлении независимости Фетизии и запросил нашу поддержку для защиты нового правительства. Естественно, в согласии с уговором, мы предоставим необходимую помощь!"
goy_pomovarra.138.a:0 "На войну!"

goy_pomovarra.139.t:0 "Переворот в Фетизии!"
goy_pomovarra.139.d:0 "Ровно как мы планировали, Герман Ворст тот Ворст захватил власть в Фетизии путем военного переворота. Разумеется, столь очевидное вторжение в политические процессы Герцланда не могло пройти незаметно. Остальные правители региона проявили доселе невиданную солидарность – а может, просто испугались – и объединились против нас. Так или иначе, при поддержке фетизской армии мы быстро разобьем их."
goy_pomovarra.139.a:0 "Вместе к Грифенхайму!"

goy_pomovarra.140.t:0 "Переворот в Фетизии провалился!"
goy_pomovarra.140.d:0 "Мы никак не ждали, что Герман Ворст тот Ворст потерпит поражение в битве с правительством Фетизии, но факт остается фактом: лоялисты разгромили его силы. Для всех очевидно, что в его восстании замешаны мы, а наши планы вторжения в Герцланд уже запущены в действие. Отступать нельзя. К счастью, повстанцы нанесли серьезный ущерб фетизским войскам, оставив брешь в обороне Герцланда. Естественно, остальные государства региона сочли наши действия нарушением своего суверенитета и уже начали переброску войск к нашим границам. Нам придется сражаться с ними самостоятельно, но как мы однажды победили Аквелию, так же мы справимся и с детьми Империи."
goy_pomovarra.140.a:0 "Вперед на Грифенхайм!"

goy_pomovarra.141.t:0 "Простая сделка"
goy_pomovarra.141.d:0 "Герман Ворст тот Ворст никогда не считал Помоварру ничем большим, чем помехой, занозой в боку Аквелии, страной мятежников, которая после каждого поражения почему-то отказывалась умереть и восставала вновь. Безвозмездная передача помоварцам незначительных объемов снаряжения и группы офицеров – тех, которые могли легко «исчезнуть» – была лишь вложением в безопасность Герцланда от аквелийских нападок. Но теперь, вопреки всему, помоварцы победили, и роли поменялись. Слава богам, что прочерченные ранее пути контрабандистов все еще работали, и его поездка на юг прошла без затруднений. Его арест стал бы катастрофой. Все намеченные планы рухнули бы задолго до воплощения.\n«Итак, барон...» заговорил синеперый грифон в поношенной униформе, откладывая очередной бычок в пепельницу. «Раз мы оба военные, перейдем сразу к делу?»\n«Полностью согласен. У вас для меня предложение.»\n«Да, и оно взаимно полезное. Я не намерен ждать того дня, когда герцландские танки двинутся на Помазон, а вы хотите вернуть свободу Фетизии,» он прикурил новую сигарету и продолжил «того же хотят ваши земляки, мобилизованные в армию нового кровожадного режима. Предлагаю следующее: мы снабжаем вас оружием, деньгами и разведданными – всем, что понадобится для восстания. Потом мы вместе освободим Герцланд и – когда война закончится – разделим его между нашими странами по принципу "ни нам, ни вам", иначе говоря, справедливо. Есть возражения?»\n«Нет» ответил Ворст, недолго подумав.\n«Н-да...» Камриз криво улыбнулся «Я думал, вы будете торговаться.»\n«Я солдат по призванию,» Ворст пожал плечами. «И ваше предложение логично. Как только смута в Герцланде пройдет, дни Помоварры будут сочтены. По силе вам с ними не сравниться. А у меня просто нет другого выбора.» Другой аргумент барона, который он предпочел оставить при себе, заключался в том, что если союзники решат подставить его, сражаться против Помоварры будет намного проще, чем против всего Герцланда."
goy_pomovarra.141.a:0 "«Тогда перейдем к деталям...»"

goy_pomovarra.142.t:0 "Простая сделка"
goy_pomovarra.142.d:0 "Герман Ворст тот Ворст никогда не считал Помоварру ничем большим, чем помехой, занозой в боку Аквелии, страной мятежников, которая после каждого поражения почему-то отказывалась умереть и восставала вновь. Безвозмездная передача помоварцам незначительных объемов снаряжения и группы офицеров – тех, которые могли легко «исчезнуть» – была лишь вложением в безопасность Герцланда от аквелийских нападок. Но теперь, вопреки всему, помоварцы победили, и роли поменялись. Слава богам, что прочерченные ранее пути контрабандистов все еще работали, и его поездка на юг прошла без затруднений. Его арест стал бы катастрофой. Все намеченные планы рухнули бы задолго до воплощения.\n«Итак, барон...» заговорил синеперый грифон в поношенной униформе, откладывая очередной бычок в пепельницу. «Раз мы оба военные, перейдем сразу к делу?»\n«Полностью согласен. У вас для меня предложение.»\n«Да, речь пойдет о взаимной помощи. Вы прекрасно знаете, что политическая ситуация в Фетизии шаткая до смеха. По правде, ничего необычного для современной Грифонии. Цветастая коалиция правых политиков, в которой вы состояли, не смогла захватить власть в стране, но заручилась значительной поддержкой населения – особенно, среди военных.» Он отвлекся, чтобы прикурить новую сигарету. «Мы дадим все необходимое – деньги, ружья, разведка – что запросите, то я добуду. Время на счету. Уберите нынешнее правительство. Когда закончите, мы разделим Герцланд между нашими странами по принципу "ни нам, ни вам", иначе говоря, справедливо. Есть возражения?»\n«Нет» ответил Ворст, недолго подумав.\n«Н-да...» Камриз криво улыбнулся «Я думал, вы будете торговаться.»\n«Я солдат по призванию,» Ворст пожал плечами. «И ваше предложение логично. Как только смута в Герцланде пройдет, дни Помоварры будут сочтены. По силе вам с ними не сравниться. А у меня просто нет другого выбора.» Другой аргумент барона, который он предпочел оставить при себе, заключался в том, что если союзники решат подставить его, сражаться против Помоварры будет намного проще, чем против всего Герцланда."
goy_pomovarra.142.a:0 "«Тогда перейдем к деталям...»"


