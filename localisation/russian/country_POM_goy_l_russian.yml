### Decisions ###
POM_pegasus_upgrade_category:0 "Улучшение технологий пегасов"
POM_pegasus_upgrade_category_desc:0 "Элитные отряды пегасов - это эквивалент Стражей Клятвы у пони, и, как таковые, они представляют собой силу с невероятным потенциалом. Само собой разумеется, что эти подразделения должны быть немедленно интегрированы в армию, а государство должно финансировать проекты по повышению их эффективности для улучшения боевых характеристик вооружённых сил в целом."
POM_tech_pegasi_upgrade:0 "Улучшить подразделения пегасов"
TBK_tech_pegasi_upgrade_desc:0 "Пришло время бросить кучу денег в копыта наших подразделений специального назначения и сказать им, чтобы они приступили к модернизации своей брони и оружия, и разработок стратегий для пегасов. Потребуется некоторое время, чтобы сделать что-то существенное, но мы терпеливы."
POM_tech_unicorn_ms_upgrade:0 "Специализация единорогов: Господство магии"
POM_tech_unicorn_th_upgrade:0 "Специализация единорогов: Гармония магии"
POM_arcturius_cat:0 "План «Арктурий»"
POM_arcturius_cat:0 "Регионы, окружающие «Большую Помоварру», исторически считались захолустным пограничьем любой великой державы, которая ими владела. В связи с этим, на их развитие никогда не выделялись достаточные средства. План промышленного развития «Арктурий» должен изменить это и дать столь необходимые инвестиции территориям, которые в них нуждаются."
POM_develop_eagleton:0 "Вложиться в Иглтон"
POM_develop_westkeep:0 "Вложиться в Весткип"
POM_incorporate_angaz_barak:0 "Развить Ангаз-Барак"
POM_incorporate_angaz_barak_desc:0 "Холмы Весткипа скрывают город-крепость алмазных псов Ангаз-Барак. Хотя его жителям зачастую не было дела до грифонов, и в свое время аквелийцы по большей части не трогали их, поздемный город псов имеет все задатки для превращения в главный промышленный и торговый центр региона. Нам стоит уговорить старейшин песьих кланов и глав шахтерских гильдий на соглашение о взаимодействии между Помоваррой и городом-крепостью Ангаз-Барак."
POM_cervys_powerplant:0 "Электространция Гервйиса"
POM_complete_arcturius:0 "Завершить план"
POM_develop_verenia:0 "Вложиться в Верению"
POM_mines_expansion_cat:0 "Расширение шахт"
POM_mines_expansion_cat_desc:0 "Сейчас все копают глубоко и жадно! А чем мы хуже? Те заросшие холмы только и ждут того, чтобы их превратили в шахты, обеспечивающие нашу экономику непрерывным потоком полезных ископаемых!"
POM_westkeep_mines:0 "Расширить шахты Весткипа"
POM_comrick_chromium:0 "Хром в Комрике"
POM_avian_steelworks:0 "Расширить литейни Авиана"
POM_erie_aluminium:0 "Алюминиевая плавильня в Эри"
POM_lissay_oil:0 "Освоить нефтяные залежи Лиссея"
POM_flw_refinery:0 "Построить Фловенскую плавильню"
POM_hire_dd_experts:0 "Нанять пёсьих экспертов"
POM_hire_dd_experts_desc:0 "Под холмами Весткипа, в городе-крепости Ангаз-Барак живут псы, которые будут счастливы поделиться с нами своими обширными знаниями – за хорошие деньги, разумеется. С их помощью мы значительно поднимем эффективность наших горнодобывающих предприятий."
POM_goy_blackmarket_cat:0 "Черный рынок"
POM_goy_blackmarket_cat_desc:0 "По всей грифонии контрабандисты, жадные промышленники и бедные квартирмейстеры готовят к продаже свои продукты для множества жаждущих покупателей – таких, как мы. Нам нужно оружие, патроны и снабжение для наших войск. За деньги мы получим все необходимое."
