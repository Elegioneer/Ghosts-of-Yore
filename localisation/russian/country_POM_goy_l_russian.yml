POM_goy_growing_instability_cat:0 "Растущее недовольство"
POM_goy_growing_instability_cat_desc:0 "Правление Князя-полковника нестабильно и долго не продержится. По всей стране готовятся восстания. Наши местные «помощники» сговариваются против нас, и эти процессы неостановимы. У нас осталось мало времени, прежде чем ситуация  выйдет из под контроля и мы потеряем власть над захваченными регионами. Мы должны выбраться из Помоварры до того момента."
POM_goy_growing_instability:0 "Недовольство растет..."
POM_goy_growing_instability_desc:0 "Нам нужно захватить Аквилу как можно скорее!"
POM_goy_expand_transport_cat:0 "Расширить транспортную сеть"
POM_goy_expand_transport_cat_desc:0 "Асфальт и рельсы, рельсы и асфальт... Мы должны прокладывать дороги, чтобы эффективно управлять отдаленными территориями. И разве нет чего-то завораживающего в проносящихся мимо поездах?"
POM_goy_invest_in_verenia_inf:0 "Проложить дороги в Верении"
POM_goy_invest_in_westkeep_inf:0 "Проложить дороги в Весткипе"
