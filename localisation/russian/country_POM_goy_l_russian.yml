POM_riseup_feathisia_category:0 "Восстание в Фетизии"
POM_riseup_feathisia_category_desc:0 "Из всех групп населения Герцланда фетизцы выделяются самобытностью, а потому им глубоко противны их новые правители. Барон Ворст тот Ворст наладил контанты с многими оппозиционно настроенными офицерами Фетизии, а также с противниками режима в новой армии Герцланда. С достаточной помощью он может раздуть ветер перемен – помощью, которую мы готовы предоставить. Разумеется, наши действия в итоге приведут к войне с нынешними правителями Фетизии."
POM_fea_arm_pretenders:0 "Вооружить претендентов"
POM_fea_call_vorst_2:0 "Дать отмашку Ворсту"
POM_fea_call_vorst_2_desc:0 "Если мы скажем Герману поднять восстание, пути назад не будет. Нам придется сражаться за независимость Фетизии вместе с его бойцами."
POM_coup_feathisia_category:0 "Переворот Ворста"
POM_coup_feathisia_category_desc:0 "На политической сцене Фетизии правил хаос, когда миссия Грийсбека прибыла в Поммоварру. С тех пор, из-за махинаций вне нашего понимания, фетизские правые партии потеряли свое влияние. Однако, они сохранили достаточную поддержку среди населения – особенно среди военных. Если мы приложим достаточные усилия, мы сможем вновь расшатать Фетизию и дать барону Ворст тот Ворсту возможность взять власть в свои лапы и заключить с нами союз. Естественно, такое вероломное вмешательство пошатнет баланс сил в Герцланде и в конце концов приведет к войне со всеми государствами региона."
POM_fea_stoke_sentiment:0 "Разжечь националистические настроения"
POM_fea_distribute_propaganda:0 "Распространить пропаганду"
POM_fea_arm_paramilitaries:0 "Вооружить повстанцев"
POM_fea_legitimise_the_coup:0 "Оправдать переворот"
POM_fea_call_vorst:0 "Дать отмашку Ворсту"
POM_fea_call_vorst_desc:0 "Если мы скажем Герману провести переворот, пути назад не будет. Вместе с Фетизией нам придется разбираться с реакцией всех государств Герцланда на переворот."
POM_herzland_claims_category:0 "Предъявить претензии на Герцланд"
POM_herzland_claims_category_desc:0 "К сожалению, Грайфенмаршен считается частью Герцланда. Поэтому, если мы хотим претендовать на власть в нем, нам придется сражаться со всеми государствами региона. Ни одно из них не согласится с нашим вторжением."
POM_attack_herzland:0 "Начать герцландскую кампанию"

