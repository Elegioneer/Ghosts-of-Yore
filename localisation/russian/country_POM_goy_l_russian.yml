POM_goy_mercs_cat:0 "Иностранные наёмники"
POM_goy_mercs_cat_desc:0 "Самые уважаемые профессионалы в Грифонии – сразу после банкиров, конечно, – наемники сейчас пользуются большим спросом. Поскольку наших сил не хватает, а набирать новых солдат неоткуда, наемники – лучшее решение наших трудностей с персоналом."
POM_mercs_floppens_finest:0 "Нанять Кнехтов Шлёппена"
