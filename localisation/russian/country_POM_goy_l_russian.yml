POM_goy_aet_dev_scheme_cat:0 "Аэтская схема развития"
POM_goy_aet_dev_scheme_cat_desc:0 "Пришло время показать всему миру, что совместным трудом можно достичь великих свершений. Наши планировщики уже предложили несколько большмх проектов по развитию инфраструктуры, которые улучшат и экономику страны, и качество жизни населения. Да, они обойдутся нам недешево, но если хочешь урожая, сначала заложи семена."
