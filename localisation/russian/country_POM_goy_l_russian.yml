POM_flowenian_chokepoint:0 "Фловенское удушье"
POM_flowenian_chokepoint_desc:0 "Мы в Периферии Аквелии. Позади нас Верения, вокруг – враждебные государства, потомки кровавых гражданских войн. Из-за этого единственный доступный нам торговый путь пролегает через Фловену. Но полный контроль городских властей над железной дорогой и водным транспортом на притоке Гриффкинга позволяет им душить нашу торговлю таможенными пошлинами и ограничениями."
POM_pomovarran_uprising:0 "Помоваррские повстанцы"
POM_pomovarran_uprising_desc:0 "Коренные помоварцы всей душой ненавидят нас и мешают нам править страной при каждой возможности. Самые ярые ведут партизанскую войну, делая наше сущестование здесь постоянной борьбой. Мы не можем надеяться ни на толику помощи от местных, и каждый новобранец из них оказывается кротом. Для пополнения войск нам приходится полагаться на немногих иностранцев, живущих здесь, и наемников. Судя по растущей дерзости повстанцев, скоро они нанесут удар по нам."
POM_warlord_government:0 "Военное правительство"
POM_warlord_government_desc:0 "Несмотря на нашу грандиозную заявку на власть над Помоваррой, на деле мы лишь заблудшая армия вдали от дома. Мы правим этими землями путем военной оккупации, и наша «бюрократия» на практике больше похожа на феодальный строй – с боевыми офицерами вместо графов и баронов. Естественно, эта система работает плохо."
POM_economic_devastation:0 " Разоренная экономика"
POM_economic_devastation_desc:0 "Три десятилетия бесконечных войн изувечили нашу экономику и земли. Многие заводы и фермы заброшены или развалены, угроза голода нависает над страной каждый год, а внешние инвестиции почти не поступают."
POM_economic_reconstruction:0 "Восстановление"
POM_economic_reconstruction_desc:0 "Мы начали восстанавливать экономику. Этот процесс займет долгое время и потребует больших усилий."
POM_economic_reconstruction_1:0 "Восстановление"
POM_economic_reconstruction_1_desc:0 "Мы начали восстанавливать экономику. Этот процесс займет долгое время и потребует больших усилий."
POM_economic_reconstruction_2:0 "Восстановление"
POM_economic_reconstruction_2_desc:0 " Мы начали восстанавливать экономику. Этот процесс займет долгое время и потребует больших усилий."
POM_military_legacy:0 "Боевой опыт"
POM_military_legacy_desc:0 "Наша власть всегда под угрозой, а потому мы всегда начеку. Бывшие офицеры Рейхсармии сумели закалить толпу дезертиров и наемников, которой некогда была наша «армия», и выковать из нее грозную боевую силу. Повстанцы давно избавили нас от дураков и трусов; выжили только самые решительные, собранные и дисциплинированные."
POM_freedom_or_death:0 "Свобода или смерть"
POM_freedom_or_death_desc:0 "Никому не отнять у нас свободу! Впервые за многие годы Помоваррой правят помоварцы, и теперь они сделают все возможное, чтобы сохранить ее независимость."
POM_freedom_or_death_1:0 " Свобода или смерть"
POM_freedom_or_death_1_desc:0 " Никому не отнять у нас свободу! Впервые за многие годы Помоваррой правят помоварцы, и теперь они сделают все возможное, чтобы сохранить ее независимость."
POM_disorganised_military:0 "Беспорядок в армии"
POM_disorganised_military_desc:0 "Наша армия состоит из целеустремленных патриотов, которые героически... Да кого мы обманываем? Наша армия – это неуправляемый сброд, и высшее командование только сейчас начало осознавать, что ведение серьезной военной кампании сильно отличается от организации партизанских вылазок."
POM_internal_divisions:0 "Внутренние раздоры"
POM_internal_divisions_desc:0 "Как только чужеземные оккупанты разбежались, помоваррские воеводы начали раздирать страну на клочья."
POM_internal_divisions_1:0 "Внутренние раздоры"
POM_internal_divisions_1_desc:0 "Как только чужеземные оккупанты разбежались, помоваррские воеводы начали раздирать страну на клочья."
POM_internal_divisions_2:0 "Внутренние раздоры"
POM_internal_divisions_2_desc:0 "Как только чужеземные оккупанты разбежались, помоваррские воеводы начали раздирать страну на клочья."
POM_reiher_dead_idea:0 "Конец Помоварры"
POM_reiher_dead_idea_desc:0 "Больше нет Леопольда Райхера, как нет и собранного помоваррского сопротивления. Стране наступил конец."
POM_FRN_francis_ns:0 "Герцог Франциск IX"
POM_FRN_francis_ns_desc:0 "Заикающийся герцог Франциск – единственное, что помоварцы не отняли у несчастных францистрийцев."
POM_raw_materials_surplus:0 "Избыток сырья"
POM_raw_materials_surplus_desc:0 "Мы сосредоточились на повышении выработки наших шахт и карьеров, чтобы экономике хватало всех материалов, с которыми у нас всегда было туго."
POM_dd_expertise:0 "Знания алмазных псов"
POM_dd_expertise_desc:0 "Инженеры и шахтеры алмазных псов Ангаз-Барака помогают нам советами, благодаря которым мы значительно повысили добычу полезных ископаемых."
POM_booming_industry:0 "Подъем промышленности"
POM_booming_industry_desc:0 "Наша экономическая политика позволяет иностранным прдепринимателям легко и активно инвестировать в развитие нашей промышленности."
POM_extraction_economy:0 "Добывающая экономика"
POM_extraction_economy_desc:0 "С потоком новых инвестиций наша горнодобывающая промышленность пошла на взлет. Новые шахты и промышленные комбинаты открываются каждую неделю, а старые быстро расширяются."
POM_booming_economy:0 "Разносторонняя экономика"
POM_booming_economy_desc:0 "Мы преодолели разруху и превзошли всех, кто смеялся над нами, называя нас отсталыми дикарями. Нас ожидает счастливое и богатое будущее!"
POM_innovation_drive:0 " Стремление к инновациям"
POM_innovation_drive_desc:0 "Финансируя исследование и разработку новых технологий мы надеемся сравняться с самыми продвинутыми странами Грифонии."
POM_flw_lux_goods:0 "Фловенские предметы роскоши"
POM_flw_lux_goods_desc:0 "Мастерские и заводы Фловены стабильно производят дорогие товары, интересущие и местных, и иностранных покупателей."
POM_flw_hvy_indus:0 "Тяжелая промышленность Фловены"
POM_flw_hvy_indus_desc:0 "Литейни и фабрики Фловены обрабатывают сырье необходимое для нашей экономики."
POM_flw_mil_indus:0 "Военная промышленность Фловены"
POM_flw_mil_indus_desc:0 "Промышленность Фловены переоборудована для удовлетворения нужд нажей армии."
POM_staple_crops:0 "Пищевое сельское хозяйство"
POM_staple_crops_desc:0 "Мы решили направить фермерские усилия на укрепление продовольстенной безопасности, проспонсировав фермы, производящие основные сельскохозяйственные культуры, например, пшеницу и картофель."
POM_cash_crops:0 "Экспортное сельское хозяйство"
POM_cash_crops_desc:0 "Помоваррские вина, оливки и табак наводняют иностранные рынки, а наши карманы пополняются деньгами от пошлин и налогов!"
POM_urban_dev_policies:0 "Политика урбанизации"
POM_urban_dev_policies_desc:0 "Контролируемое расширение наших городов – ключ к постоянному росту и поддержанию обывательского благосостояния."
POM_flowenian_fifth_column:0 "Фловенская пятая колонна"
POM_flowenian_fifth_column_desc:0 "Помоварцы во Фловене готовы помочь нам, когда понадобится. Они предоставят нам разведданные и отвлекут Фловенскую армию."
POM_clan_system:0 "Новая клановая система"
POM_clan_system_desc:0 "Клановая принадлежность – это источник гордости для грифонов Помоварры. Каждый из них стремится сравниться по достижениям с великими основателями своих кланов. Однако, совместное существование этой системы и современной администрации доставляет нам хлопоты."
POM_linguistic_reform:0 "Языковая реформа"
POM_linguistic_reform_desc:0 "Новый Помоваррский – единственный официальный язык нашего государства. В нем нет ни одного иностранного заимствования. Все остальные языки запрещены к использованию в стенах государственных учреждений, в газетах и на радио. Хотя новые законы о языке вызвали недовольство среди населения, они необходимы, потому что позволяют нам легче следить за потоками информации и вычислять иностранных агентов."
POM_fascism_propaganda:0 "Машина пропаганды"
POM_fascism_propaganda_desc:0 "Слово «пропаганда» так противно... Мы лишь оглашаем правду – единственную правду, которую грифоны Помоварры должны и хотят слышать."
POM_knights_of_boar:0 "Рыцари вепря"
POM_knights_of_boar_desc:0 "Стремясь сравниться с рыцарями Старого Королевства и обрести свирепость войнов древних помоваррских кланов, наши рыцари стали одними из лучших в Грифонии."
POM_fascism_remembrance:0 "Помоваррская память"
POM_fascism_remembrance_desc:0 "Поскольку мы заложили воспитание исторической памяти в основу государственного образования, романтизированное восприятие и отражение событий прошлого стало важной частью культуры. Кланы, военные формирования и знатные семьи по всей стране заказывают произведения искусства, превозносящие их достижения."
POM_way_of_warrior:0 "Путь воина"
POM_way_of_warrior_desc:0 "Огонь войны закалит новых помоварцев: вечных воинов, непоколебимых и неусыпных. Мы никогда больше не потерпим поражение!"
POM_final_war:0 "Последняя война"
POM_final_war_desc:0 "Многие погибнут, но их жертва не будет напрасной, если мы победим нашего величайшего врага."
POM_spoons_into_rifles:0 "Ложки в ружья"
POM_spoons_into_rifles_desc:0 "Вся страна работает над общей задачей: полной и окончательной победой над аквелийской угрозой. Все, кто не на фронте, отрешенно трудятся, поддерживая армию."
POM_erasing_the_past:0 "Очистка прошлого"
POM_erasing_the_past_desc:0 "Чтобы формировать будущее, нужно разобраться с прошлым – стереть каждую черту, непригодную для будущего, которое мы хотим создать. Да, такая очистка имеет неприятные последствия, но с ними разберется полиция."
POM_new_nobles:0 "Новая знать"
POM_new_nobles_desc:0 "Передача власти над чужаками из дальних провинций в лапы новых знатных кланов значительно снизила нагрузку на госаппарат."
POM_small_expenses:0 "Малые расходы"
POM_small_expenses_desc:0 "Недавние вложения дорого нам обходятся."
POM_medium_expenses:0 "Средние расходы"
POM_medium_expenses_desc:0 "Недавние вложения серьезно ударили по бюджету."
POM_large_expenses:0 "Большие расходы"
POM_large_expenses_desc:0 "Недавние вложения опустошили казну!"
POM_finest_in_griffonia:0 "Лучшие в Грифонии"
POM_finest_in_griffonia_desc:0 "Наши войска, закаленные десятилетиями войн, под управлением опытных офицеров, превосходят большинство армий континента и наравне только с лучшими из них."
POM_hostile_population:0 "Враждебное население"
POM_hostile_population_desc:0 "Несмотря на недавнюю победу над повстанцами (или из-за нее), местные страстно ненавидят нас и продолжают совать палки в колеса. Но хотя бы они уже не представляют серьезной опасности – пока что."
POM_hostile_population_hunted:0 " Враждебное население"
POM_hostile_population_hunted_desc:0 "Несмотря на недавнюю победу над повстанцами (или из-за нее), местные страстно ненавидят нас и продолжают совать палки в колеса. Но хотя бы они уже не представляют серьезной опасности – пока что."
POM_flowenian_administration:0 "Фловенская администрация"
POM_flowenian_administration_desc:0 "Мы просто позволили им делать свою работу как раньше. По сравнению с тем, как мы вели дела, это огромное улучшение. И все же, стоит признать, что это – лишь временная мера."
POM_economic_devastation_taxed:0 "Разоренная экономика"
POM_economic_devastation_taxed_desc:0 "Три десятилетия бесконечных войн изувечили нашу экономику и земли. Многие заводы и фермы заброшены или развалены, угроза голода нависает над страной каждый год, а внешние инвестиции почти не поступают."
POM_economic_devastation_deregulated:0 "Разоренная экономика"
POM_economic_devastation_deregulated_desc:0 "Три десятилетия бесконечных войн изувечили нашу экономику и земли. Многие заводы и фермы заброшены или развалены, угроза голода нависает над страной каждый год, а внешние инвестиции почти не поступают."
POM_apathetic_population:0 "Безучастное население"
POM_apathetic_population_desc:0 "Хотя народу не нравится жизнь под властью Райхера, наши новые подданные не так жаждут свернуть ему шею, как коренные помоварцы."
POM_spoils_of_flowena:0 "Добыча из Фловены"
POM_spoils_of_flowena_desc:0 "Богатства фловенских патрициев, накопленные за поколения, попали в наши лапы. Мы уверены, что наш чудесный советник де Блоеталь присвоил значительную часть добычи, но мы закроем на это глаза. Нам достаточно того, что мы получили."
POM_flexible_command:0 "Гибкое командование"
POM_flexible_command_desc:0 "Наши офицеры свободно выбирают методы выполнения задач, которые перед ними ставим мы."
POM_pillagers_extraordinaires:0 "Выдающиеся грабители"
POM_pillagers_extraordinaires_desc:0 "Способность добывать все необходимое на территории врага позволяет нашим силам долго действовать самостоятельно после обрыва путей снабжения."
POM_aggressive_assaulters:0 "Свирепые штурмовики"
POM_aggressive_assaulters_desc:0 "Опыт ведения асимметричной войне, полученный в ходе множества конфликтов, в которых участвовали наши наемники, создает такие возможности, о которых боятся подумать профессиональные офицеры."
POM_claws_off_economy:0 "Лапы прочь, взгляд в сторону"
POM_claws_off_economy_desc:0 "Оказывается, теневые дельцы лучше разбираются в экономике, чем толпа бандитов. Да, простым грифонам живется не лучше, чем раньше, но мы и не собирались помогать им."
POM_rebuilding_industry:0 "Восстановление промышленности"
POM_rebuilding_industry_desc:0 "Мы приложили все усилия к восстановлению пострадавших от войны заводов и промышленных предприятий."
POM_chaotic_revolution:0 "Беспорядочная революция"
POM_chaotic_revolution_desc:0 "Долой старый режим! Аквелию поглотило пламя Третьей Революции, которая на этот раз действительно освободит грифонов... С точки зрения других государств, она напоминает пожар на свалке."
POM_chaotic_revolution_1:0 "Беспорядочная революция"
POM_chaotic_revolution_1_desc:0 "Долой старый режим! Аквелию поглотило пламя Третьей Революции, которая на этот раз действительно освободит грифонов... С точки зрения других государств, она напоминает пожар на свалке."
POM_chaotic_revolution_2:0 "Беспорядочная революция "
POM_chaotic_revolution_2_desc:0 "Долой старый режим! Аквелию поглотило пламя Третьей Революции, которая на этот раз действительно освободит грифонов... С точки зрения других государств, она напоминает пожар на свалке."
POM_chaotic_revolution_3:0 "Беспорядочная революция "
POM_chaotic_revolution_3_desc:0 "Долой старый режим! Аквелию поглотило пламя Третьей Революции, которая на этот раз действительно освободит грифонов... С точки зрения других государств, она напоминает пожар на свалке."
POM_chaotic_revolution_4:0 "Беспорядочная революция "
POM_chaotic_revolution_4_desc:0 "Долой старый режим! Аквелию поглотило пламя Третьей Революции, которая на этот раз действительно освободит грифонов... С точки зрения других государств, она напоминает пожар на свалке.
POM_past_vestiges:0 "Пережитки прошлого"
POM_past_vestiges_desc:0 "Некоторые все еще имповедуют старые верования и идеологии, несовместимые с нашей славной Революцией. Мы скоро разберемся с ними."
POM_transformation_of_society:0 "Тансформация общества"
POM_transformation_of_society_desc:0 "Через некоторое время грифоны Коммуны не будут думать ни о чем, кроме Революции. Они даже будут верить, что до ничего не было, и после нее ничего не будет – потому они будут готовы умереть в бою ради Коммуны."
POM_avenge_griffonstone:0 "Отомстить Грифонстоун"
POM_avenge_griffonstone_desc:0 "Безбожные коммунары идут! Они уничтожили Грифонстоун, священную колыбель грифоньего рода, и они не остановятся, пока не захватят весь континент!"
POM_voice_of_commune:0 "Голос Коммуны"
POM_voice_of_commune_desc:0 "Газеты, радио и все прочие средства массовой информации служат одной цели: распространению Революции."
POM_voice_of_patron:0 "Голос Патрона"
POM_voice_of_patron_desc:0 "Наши граждане должны знать лишь одну версию прошлого – ту, о которой мы им расскажем."
POM_paranoia_fear:0 "Страх и паранойя"
POM_paranoia_fear_desc:0 "Сохраняйте бдительность! Любой из вашего окружения может оказаться контрреволюционером! Если вы услышите от соседа шутки про членов Комитета Общественной Безопасности, доложите о нем в полицию! Суд решит, смешны ли эти шутки."
POM_revolutionary_militias:0 "Революционное ополчение"
POM_revolutionary_militias_desc:0 "После разгрома регулярной армии в ходе недавних боев и фактического роспуска войск наемников, единственной боевой силой в регионе остались ополченцы под командованием Алларда. Они, конечно, очень ревностно поддерживают Революцию, но им не хватает дисциплины и цепи командования."
POM_revolutionary_militias_1:0 "Революционное ополчение "
POM_revolutionary_militias_1_desc:0 "После разгрома регулярной армии в ходе недавних боев и фактического роспуска войск наемников, единственной боевой силой в регионе остались ополченцы под командованием Алларда. Они, конечно, очень ревностно поддерживают Революцию, но им не хватает дисциплины и цепи командования."
POM_revolutionary_militias_2:0 "Революционное ополчение "
POM_revolutionary_militias_2_desc:0 "После разгрома регулярной армии в ходе недавних боев и фактического роспуска войск наемников, единственной боевой силой в регионе остались ополченцы под командованием Алларда. Они, конечно, очень ревностно поддерживают Революцию, но им не хватает дисциплины и цепи командования."
POM_communard_rev_army:0 "Революционная Армия Коммуны"
POM_communard_rev_army_desc:0 "Меч и щит пролетариата, Революционная Армия Коммуны сражается за освобождения всех рабочих в мире от гнета капиталистов."
POM_communard_rev_army_1:0 "Революционная Армия Коммуны "
POM_communard_rev_army_1_desc:0 "Меч и щит пролетариата, Революционная Армия Коммуны сражается за освобождения всех рабочих в мире от гнета капиталистов."
POM_communard_rev_army_2:0 "Революционная Армия Коммуны "
POM_communard_rev_army_2_desc:0 "Меч и щит пролетариата, Революционная Армия Коммуны сражается за освобождения всех рабочих в мире от гнета капиталистов."
POM_revolutionary_commissars:0 "Комиссары Революции"
POM_revolutionary_commissars_desc:0 "Особенно подготовленные, идеологически обработанные комиссары присоединены к каждому батальону для поддержания революционного духа среди солдат."
POM_red_armour:0 "Красная броня"
POM_red_armour_desc:0 "Кровь раздавленных нашими танками реакционеров окрасит их броню в красный!"
POM_communard_airforce:0 "ВВС Коммуны"
POM_communard_airforce_desc:0 "Готовы распространять Революцию бомбардировками прямиком из Тартара!"
POM_communard_navy:0 "ВМФ Коммуны"
POM_communard_navy_desc:0 "Наш великий красный флот не позволит врагам Революции скрыться за морями!"
POM_red_sun_rising:0 "Восход красного солнца"
POM_red_sun_rising_desc:0 "Новое солнце восходит над Грифонией – это свет взрыва атомной бомбы, испепеляющей врагов пролетариата."
POM_red_officer_corps:0 "Красные офицеры"
POM_red_officer_corps_desc:0 "На службу Коммуне пришло новое поколение офицеров-коммунистов, свежих выпускников военных училищ."
POM_warlord_legacy:0 "Наследие разбойников"
POM_warlord_legacy_desc:0 "Полковник Райхер разорил весь регион, ограбив города, выжав все соки из промышленности и позволив своим дружкам украсть все ценности Аквелии. После себя он оставил гуманитарную катастрофу и разоренную страну."
POM_warlord_legacy_1:0 "Наследие разбойников"
POM_warlord_legacy_1_desc:0 "Полковник Райхер разорил весь регион, ограбив города, выжав все соки из промышленности и позволив своим дружкам украсть все ценности Аквелии. После себя он оставил гуманитарную катастрофу и разоренную страну."
POM_warlord_legacy_2:0 "Наследие разбойников"
POM_warlord_legacy_2_desc:0 "Полковник Райхер разорил весь регион, ограбив города, выжав все соки из промышленности и позволив своим дружкам украсть все ценности Аквелии. После себя он оставил гуманитарную катастрофу и разоренную страну."
POM_warlord_legacy_3:0 "Наследие разбойников"
POM_warlord_legacy_3_desc:0 "Полковник Райхер разорил весь регион, ограбив города, выжав все соки из промышленности и позволив своим дружкам украсть все ценности Аквелии. После себя он оставил гуманитарную катастрофу и разоренную страну."
POM_warlord_legacy_4:0 "Наследие разбойников"
POM_warlord_legacy_4_desc:0 "Полковник Райхер разорил весь регион, ограбив города, выжав все соки из промышленности и позволив своим дружкам украсть все ценности Аквелии. После себя он оставил гуманитарную катастрофу и разоренную страну."
POM_warlord_legacy_5:0 "Наследие разбойников"
POM_warlord_legacy_5_desc:0 "Полковник Райхер разорил весь регион, ограбив города, выжав все соки из промышленности и позволив своим дружкам украсть все ценности Аквелии. После себя он оставил гуманитарную катастрофу и разоренную страну."
POM_great_march:0 "Промышленная политика Коммуны"
POM_great_march_desc:0 "Грандиозные стройки при помощи каторжников ускоряют расширение промышленности Коммуны."
POM_great_march_1:0 "Промышленная политика Коммуны"
POM_great_march_1_desc:0 "Грандиозные стройки при помощи каторжников ускоряют расширение промышленности Коммуны."
POM_great_march_2:0 "Промышленная политика Коммуны"
POM_great_march_2_desc:0 "Грандиозные стройки при помощи каторжников ускоряют расширение промышленности Коммуны."
POM_nationalised_industry:0 "Национализация промышленности"
POM_nationalised_industry_desc:0 "Все для государства и все от государства!"
POM_labour_camps:0 "Трудовые лагеря"
POM_labour_camps_desc:0 "Некоторые обретают искупление и идеологическое пробуждение только путем тяжкого труда."
POM_total_control:0 "Полный контроль"
POM_total_control_desc:0 "Наш великий предводитель управляет всем государством, и даже Комитет исполняет только советнические функции."
POM_dual_pillars:0 "Две основы Коммуны"
POM_dual_pillars_desc:0 "По удивительной случайности армия и коммунистическая партия объединились в создании новой элиты, которая ведет Коммуну в будущее. Из революционной борьбы с капиталистами выросла новая олигархия."
POM_world_revolution:0 "Всемирная Революция"
POM_world_revolution_desc:0 "Никаких компромиссов и права на передышку. Мы не остановимся, пока все реакционные режимы не падут, и мир не объединится под красным флагом Коммуны!"
POM_world_revolution_1:0 "Всемирная Революция"
POM_world_revolution_1_desc:0 "Никаких компромиссов и права на передышку. Мы не остановимся, пока все реакционные режимы не падут, и мир не объединится под красным флагом Коммуны!"
POM_fortress_griffonia:0 "Крепость Грифония"
POM_fortress_griffonia_desc:0 "Мир полон сильных врагов, и мы должны быть готовы защищать Революцию от их нападок! Так мы оправдываем перед населением отказ от планов Алларда на Всемирную Революцию."
POM_strange_occurences:0 "Странные события"
POM_strange_occurences_desc:0 "Как если бы сама природа объявила нам войну, все как будто разваливается само по себе."
POM_strange_occurences_1:0 "Странные события"
POM_strange_occurences_1_desc:0 "Как если бы сама природа объявила нам войну, все как будто разваливается само по себе."
POM_national_favouritism:0 "Защищенные нации"
POM_national_favouritism_desc:0 "Мы оставили политику неизбирательного правосудия над всеми религиями и народами позади. Теперь мы выбираем одну группу для подавления – ту, которая сопротивляется нашему режиму активнее остальных или хорошо подходит на роль козла отпущения. Некоторые заявляют, что мы просто передали всю власть в лапы аквелийцев, но эти слухи – ничто иное, как реакционная ложь."
POM_no_resistance:0 "Нет сопротивления"
POM_no_resistance_desc:0 "Все, открыто выступающие против Коммуны, тут же попадают в лапы полиции. То же происходит с теми, кто вызывает подозрение!"
POM_shadow_claw:0 "Теневые когти Революции"
POM_shadow_claw_desc:0 "Подрывная деятельность – вот ключ к легкой победе! Мудрый коммунист размягчает оборону противника перед вторжением с помощью подстрекателей, которые распространяют социалистическую пропаганду и подбивают рабочих на восстания."
POM_foreign_overlords:0 "Иностранные правители"
POM_foreign_overlords_desc:0 "Наше правительство считают марионеткой грифонских вторженцев. Из-за этого нам тяжело достичь хоть какого-то уровня легитимности и популярности среди населения."
GOY_pom_education_propaganda:0 "Революционное образование"
GOY_pom_education_propaganda_desc:0 "Образовательная политика может стать оружием, но его действие зависит от того, кто им владеет – и от тех, против кого оно используется."
POM_defensive_doctrine:0 "Оборонительная доктрина"
POM_defensive_doctrine_desc:0 "Вдохновленные Рейхсармией, мы преобразовали нашу армию в надежную оборонительную силу."
POM_offensive_doctrine:0 "Наступательная доктрина"
POM_offensive_doctrine_desc:0 "Быстрые как ветер, смертоносные как ураган, наши войска готовы уничтожать врагов Помоварры."
POM_autonomous_command:0 "Свобода командования"
POM_autonomous_command_desc:0 "Мы решили сохранить наши силы настолько гибкими, насколько это возможно, предоставив большую степень независимости полевым офицерам."
POM_lessons_of_cervys:0 "Уроки Гервйиса"
POM_lessons_of_cervys_desc:0 " Одно артиллерийское орудие может изменить исход вылазки, сотня может изменить исход битвы."
POM_advanced_small_arms:0 "Продвинутое стрелковое оружие"
POM_advanced_small_arms_desc:0 "Очень блестящее и особенно убойное!"
POM_proven_rifles:0 "Проверенные винтовки"
POM_proven_rifles_desc:0 "Кинешь ружье в грязь, проедешься по нему танком, – а оно все равно будет стрелять!"
POM_hardened_soldiers:0 "Закаленные солдаты"
POM_hardened_soldiers_desc:0 "В борьбе с иностранными захватчиками у нас был один союзник: помоваррская земля."
POM_established_korps:0 "Сложившееся офицерство"
POM_established_korps_desc:0 "Наконец правильно ранжированные, наши офицеры – несмотря на отсутствие формального образования – опытные и умелые."
POM_new_officer_gen:0 "Новое поколение офицеров"
POM_new_officer_gen_desc:0 "Совмещая знания, переданные командирами сопротивления, с настоящим военным образованием, наши офицеры стали поистине одними из лучших в своем деле."
POM_new_officer_gen_1:0 "Новое поколение офицеров"
POM_new_officer_gen_1_desc:0 "Совмещая знания, переданные командирами сопротивления, с настоящим военным образованием, наши офицеры стали поистине одними из лучших в своем деле."
POM_medical_corps:0 "Медицинские подразделения"
POM_medical_corps_desc:0 "Нам не превзойти врагов числом, поэтому мы должны бороться за жизнь каждого раненого солдата."
POM_mobile_corps:0 "Подвижные танковые корпуса"
POM_mobile_corps_desc:0 "Гибкие, быстрые бронетанковые корпуса идеально подходят для того, чтобы возглавлять наши фронтовые операции, рассекать силы противника и окружать их."
POM_steel_behemoths:0 "Стальные исполины"
POM_steel_behemoths_desc:0 "На вопрос, «Сколько бронепластин нужно танку?», единственный правильный ответ – это «Да!»"
POM_reservist_system:0 "Боевые резервы"
POM_reservist_system_desc:0 "Благодаря новой системе обязательной военной службы и учений для действующих резервистов, мы способны поддерживать намного большую армию, чем раньше."
POM_knights_of_pom:0 "Рыцари Помоварры"
POM_knights_of_pom_desc:0 "Немногие сравнятся по навыкам и ярости с помоваррскими рыцарями. Каждый из них способен забрать жизни дюжины вражеских воинов. Так они должны сражаться, чтобы Помоварра выжила."
POM_efficient_mil_industry:0 "Эффективная военная промышленность"
POM_efficient_mil_industry_desc:0 "Мы перестроили нашу военную промышленность для максимальной эффективности. Отдельные фабрики собраны в производственные цепи. Каждый директор фабрики всегда знает, сколько и чего ему нужно произвести – и кому, и когда нужно это доставить."
POM_skyaluzzo_port:0 "Порт Скайлацо"
POM_skyaluzzo_port_desc:0 "Мы значительно расширили инфраструктуру Скайлацо и превратили его в ключевой торговый центр Помоварры."
POM_pom_aces:0 "Помоваррские асы"
POM_pom_aces_desc:0 "Обученные и опытные, наши пилоты знают, как действовать даже в самых опасных обстоятельствах, и готовы сразиться с любым врагом."
POM_nimble_and_deadly:0 "Юркие и смертоносные"
POM_nimble_and_deadly_desc:0 "Мы применили все наши знания в аэронавтике, чтобы производить самые быстрые и маневренные истребители!"
POM_bombastic_bombs:0 "Бомбезные бомбы"
POM_bombastic_bombs_desc:0 "Мы разработали широкий ассортимент бомб для всех нужд помоваррских ВВС. Противники скрываются в лесах? Пусть отведают напалма! Они хорошо укрепились? Сбросьте на них противобункерный снаряд! Они рассредоточились на большой территории? Кассетные боеприпасы найдут их за вас!"
POM_naval_expansion_programme:0 "Программа расширения флота"
POM_naval_expansion_programme_desc:0 "Мы вливаем средства в обновление верфей для быстрого повышения боеспособности помоваррского флота."
POM_carrier_primacy:0 "Превосходство авианосцев"
POM_carrier_primacy_desc:0 "Мы решили переоборудовать верфи под производство авианосцев."
POM_battleship_primacy:0 "Превосходство линкоров"
POM_battleship_primacy_desc:0 "Мы решили переоборудовать верфи под производство линкоров."
POM_conquest_of_the_seas:0 "Завоеватели морей"
POM_conquest_of_the_seas_desc:0 "Везде и всегда наш флот готов обрушить свой гнев на врагов Помоварры."
POM_conquest_of_the_seas_bb:0 "Завоеватели морей"
POM_conquest_of_the_seas_bb_desc:0 "Везде и всегда наш флот готов обрушить свой гнев на врагов Помоварры с помощью крупнокалиберных пушек наших линкоров.
POM_conquest_of_the_seas_cv:0 "Завоеватели морей"
POM_conquest_of_the_seas_cv_desc:0 " Везде и всегда наш флот готов обрушить свой гнев на врагов Помоварры с помощью морской авиации."
POM_chained_kingdom:0 "Королевство в цепях"
POM_chained_kingdom_desc:0 "Помоварра стала практически закрытой страной: все связи с внешним миром идут под руководством правительства и ограничены несколькими портовыми городами, за черту которых иностранцам запрещено выезжать под страхом смерти."
POM_griffonia_hegemon:0 "Гегемон Грифонии"
POM_griffonia_hegemon_desc:0 "Помоварра стала единственной настоящей сверхдержавой на континенте. Остальные правители дрожат в страхе перед нами и надеются, что мы не точим зуб на их владения."
POM_subordination_temples:0 "Подчинение Храмов"
POM_subordination_temples_desc:0 "Три Храма лишены автономии, а архонаты упразднены. Священство теперь находится под прямым контролем короля, который возглавляет как государство, так и церковь."
POM_dog_revolt:0 "Восстание псов"
POM_dog_revolt_desc:0 "По всему Бронзхиллу идет восстание алмазных псов. Хотя все, чего они смогли добиться, – это разорение своей родины и массовое убийство своих соотечественников, им удалось отвлечь значительное число наших военных."
POM_nature_sanctuaries:0 "Природные заповедники"
POM_nature_sanctuaries_desc:0 "Теперь, когда волшебным зверям дозволено свободно бродить по лесам Грифонии, мы можем подробно изучить их – и использовать полученную информацию для разработки нового оружия."
POM_tribute:0 "Дань Завоевателю"
POM_tribute_desc:0 "Иностранные богатства приходят к нам со всей Грифонии, гарантируя избыток ресурсов и денег в Помоварре."
POM_fortress_pomovarra:0 "Крепость Помоварра"
POM_fortress_pomovarra_desc:0 "Когда-нибудь враги точно нападут на нас – и тогда мы должны быть готовы ответить! И даже если в этом мы ошибаемся, страх перед врагами – это отличный способ держать наших подданных начеку!"
POM_forced_resettlements:0 "Принудительные переселения"
POM_forced_resettlements_desc:0 "Мы заставляем неугодных грифонов бросить свои родные дома и перемещаем их в специальные зоны содержания, чтобы освободить хорошие земли для помоварцев и создать трения между остальными народами. Разумеется, эта политика создает значительную нагрузку на наши вооруженные силы."
POM_feathisian_advisors:0 "Фетизские советники"
POM_feathisian_advisors_desc:0 "Группа фетизских офицеров предоставляет полезные советы нашим военным, таким образом помогая нам модернизировать наши вооруженные силы."
POM_feathisian_expertise:0 "Фетизский опыт"
POM_feathisian_expertise_desc:0 "Наша армия преобразилась в современную единую боевую силу благодаря сотрудничеству с Фетизией."
POM_pom_military_doctrine:0 "Помоваррская военная доктрина"
POM_pom_military_doctrine_desc:0 "Исследование помоваррской военной тактики предоставило нам богатый опыт в ассиметричной войне и маневрированию на поле боя."
POM_westkeep_infiltration:0 "Лазутчики в Весткипе"
POM_westkeep_infiltration_desc:0 "Несколько групп симпатизирующих нам грифонов проникли в правящий аппарат Аквелии и вооруженные силы, чтобы предоставлять нам важные разведданные."
POM_mandatory_military_training:0 "Обязательная военная подготовка"
POM_mandatory_military_training_desc:0 "В общее образование входит участие молодых грифонов в различных формах военной подготовки. Такой подход обеспечивает высокий уровень патриотизма и расширяет воинский резерв, готовый к мобилизации в случае войны."
POM_old_believers:0 "Изобретательность Староверов"
POM_old_believers_desc:0 "Староверы расширяют свое влияние среди населения, проповедуя – кроме всех прочих благодетелей – достоинства упорного труда и семейной близости. Так, они способствуют развитию правильного помоваррского менталитета."
POM_councils_guidance:0 "Руководство Совета"
POM_councils_guidance_desc:0 "Члены Совета разделяют с нами обязательства по управлению страной."
POM_council_and_parliament:0 "Совет и Парламент"
POM_council_and_parliament_desc:0 "Хотя некоторым радикалам не нравится, что Совет ограничивает полномочия демократически избранного парламента, мы считаем, что он необходим для защиты грифонов от заведомо глупых решений их избранников, а также обеспечения постоянства власти и сохранения основных законов и принципов государства."
POM_reclamation_of_the_past:0 "Возвращение прошлого"
POM_reclamation_of_the_past_desc:0 "Мы никогда больше не потеряем наследие предков! Теперь защита нашего прошлого будет одним из основных принципов помоваррского государства."
POM_national_unity:0 "Принцип единства"
POM_national_unity_desc:0 "Второй принцип Помоваррской Республики звучит так: Народ должен быть един в понимании уроков прошлого и в стремлении к общему видению будущего."
POM_state_loyalty:0 "Принцип верности"
POM_state_loyalty_desc:0 "Третий принцип Помоваррской Республики таков: Каждый гражданин играет ключевую роль в структуре нашего народного государства, которому мы все обязаны служить верой и правдой."
POM_skyfall_province:0 "Скайфольское Губернаторство"
POM_skyfall_province_desc:0 "Хотя власти Скайфола не владеют теми же силами, что власти центральных областей Помоварры, производственные мощности города и изобретательность его жителей привели к тому, что он стал одним из главных промышленных центров страны, и к тому, что значительная часть продуктов на помоваррском рынке производится именно здесь."
POM_skyfall_enclave:0 "Скайфольский анклав"
POM_skyfall_enclave_desc:0 "Уникальные экономические условия Скайфола внутри Помоварры привели к его ускоренному развитию и превращению в де-факто главный торговый порт страны. Скайфол сейчас – это ключевой центр торговли, где иностранцы свободно ведут дела с помоварцами, благодаря отсутствию правовых ограничений, существующих в других землях страны."
POM_we_die_standing:0 "Мы умрём стоя!"
POM_we_die_standing_desc:0 "Победа или смерть! Помоварцы никогда больше не станут рабами!"
POM_claws_in_the_dark:0 "Когти во тьме"
POM_claws_in_the_dark_desc:0 "Попав в бой с превосходящим врагом, единственный шанс на победу – драться грязно. Немногие понимают это так хорошо, как помоварцы."
POM_pomovarran_supremacy:0 "Главенство помоварцев"
POM_pomovarran_supremacy_desc:0 "Наше общество разделено на три касты: Помоварцы – единственные обладатели полных гражданских прав. Представители «родственных народов» – включая аделартцев, такие грифоны могут стать полноценными гражданами после службы в помоваррской армии. И наконец, «чужестранцы» – представленные по большей части аквелийцами, они не могут занимать правительственные посты, служить в армии, и ограничены в правах на покупку земли и открытие предприятий в Центральной Помоварре."
POM_honour_guard:0 "Почетная гвардия"
POM_honour_guard_desc:0 "В почетную гвардию кланов берут только лучших из лучших. Ее представители воюют по старым обычаям помоваррских воинов и рыцарей, поощряющих инициативность и агрессию на поле боя."
POM_heavy_reparations:0 "Тяжкие репарации"
POM_heavy_reparations_desc:0 "Эта страна выплачивает репарации Помоварре."
POM_spoils_to_victor:0 "Добыча победителя"
POM_spoils_to_victor_desc:0 "Мы извлекаем большую выгоду из репараций, наложенных на Аквелию."
POM_prosperity:0 "Принцип процветания"
POM_prosperity_desc:0 "Первый принцип Помоваррской Республики: Каждый грифон получает долю национального достатка."
POM_media_freedom:0 "Свобода СМИ"
POM_media_freedom_desc:0 "У поддержания свободы слова много преимуществ, но есть также и один значительный недостаток: наши грифоны уязвимы перед иностранным влиянием."
POM_decentralised_state:0 "Рассредоточенная власть"
POM_decentralised_state_desc:0 "Мы раздали многие прерогативы государства региональным советам и органам местного самоуправления. Хотя большая часть населения с восторгом приняла нововведения, и региональные власти доказали свою эффективность в разрешении местных проблем, центральное правительство потеряло значительную долю контроля над дальними территориями."
POM_liberation_war_spirit:0 "Освободительная война"
POM_liberation_war_spirit_desc:0 "Это конец. Эта война решит будущее Помоварры, Аквелии и всей Грифонии. Мы не имеем права на ошибку. Поражение непозволительно."
POM_westkeep_treaty_spirit:0 "Весткипское соглашение"
POM_westkeep_treaty_spirit_desc:0 "Договор между Помоваррой и Аквелией, ведущий к объединению наших стран в единое наднациональную сущность. Чтобы воплотить планы соглашения в реальность, потребуется много времени и вложений."
POM_national_plurality:0 "Многонародность"
POM_national_plurality_desc:0 "Мы защищаем права каждого существа – вне зависимости от его видовой, религиозной или национальной принадлежности."
POM_laissez_faire:0 "Экономика невмешательства"
POM_laissez_faire_desc:0 "После недавних либертарианских реформ экономика вошла в период бума и побила все рекорды производительности."
POM_direct_democracy:0 "Прямая демократия"
POM_direct_democracy_desc:0 "Правительство – ничто большее, чем представитель мнений граждан. И аэтские грифоны максимально вовлечены в управление своей страной."
POM_liberators:0 "Освободители"
POM_liberators_desc:0 "Мы не можем сидеть, сложа лапы, когда в мире еще есть существа, страдающие под гнетом тиранов!"
POM_developing_countryside:0 "Развитие сельской местности"
POM_developing_countryside_desc:0 "Наша грантовая политика для сельских регионов приносит плоды: фермеры производят более чем достаточно, чтобы прокормить наше население, а деревни богатеют и растут."
POM_social_capitalism:0 "Социальный капитализм"
POM_social_capitalism_desc:0 "При помощи реформ, регулирующих рыночные отношения, поддерживающих профсоюзы и расширяющих программы соцобеспечения, мы смогли предоставить доступ к жизненно необходимым продуктам для тех, кто нуждается в них больше всех."
POM_defence_focus:0 "Оборонительное мышление"
POM_defence_focus_desc:0 "В мире полном империалистов и подстрекателей не бывает чересчур масштабных линий обороны!"
POM_racial_tolerance_act:0 "Акт расовой терпимости"
POM_racial_tolerance_act_desc:0 "Мы стремимся сделать Аэтию местом, где любое существо может всецело реализовать свой потенциал и жить в мире с иноземцами."
POM_protecting_the_dream:0 "Защита мечты"
POM_protecting_the_dream_desc:0 "Аэтская мечта стоит того, чтобы сражаться за нее – и если нужно – даже умереть."
POM_flowery_medicine:0 "Цветочные лекарства"
POM_flowery_medicine_desc:0 "В садах Фловены растет множество уникальных видов растений, исследование которых может привести к прорывам в фармацевтике."
POM_idea_safe_haven:0 "Открытые границы"
POM_idea_safe_haven_desc:0 "Приток беженцев и простых мигрантов в Аэтию не прекращается. Разумеется, некоторых это напрягает, но мы намеренны предоставить убежище каждому существу, которое в нем нуждается."
POM_age_of_progress:0 "Эра прогресса"
POM_age_of_progress_desc:0 "Мы ежедневно открываем новые секреты этого мира – и применяем их для укрепления Аэтии."
POM_reformed_government:0 "Новое правительство"
POM_reformed_government_desc:0 "Переходный период завершился, и новое стабильное правительство готово решать любые вопросы, которые могут возникнуть."
POM_legacy_of_arctuirus:0 "Наследие плана «Арктурий»"
POM_legacy_of_arctuirus_desc:0 "С завершением плана «Арктурий» страна сделала скачок на пути индустриализации, и построенные по плану заводы работают идеально до сих пор."
POM_economic_powerhouse:0 "Мощная экономика"
POM_economic_powerhouse_desc:0 "Мы – одна из самых богатых и процветающих стран в мире. Поистине, в стране настала золотая эпоха!"
POM_pegasii_weather_corps_idea:0 "Управление погодой"
POM_pegasii_weather_corps_idea_desc:0 "Хотя возможности наших пегасов в изменении погоды не сравнятся с эквестрийскими, мы всегда можем рассчитывать на хороший урожай."
POM_peaceful_atom:0 "Мирный атом"
POM_peaceful_atom_desc:0 "Наш новый магиатомный реактор производит много дешевого электричества для промышленности."
POM_great_aetian_lighthouse:0 "Великий Аэтский Маяк"
POM_great_aetian_lighthouse_desc:0 "Стоящий к западу от Вызимы Великий Маяк – самое высокое здание во всей Грифонии. Его волшебный свет направляет наши суда и самолеты... А еще он привлекает толпы туристов!"
POM_college_of_magic:0 "Коллегия Магии"
POM_college_of_magic_desc:0 "Учреждение, созданное для углубления наших познаний о магии, уже принесло огромную пользу в исследовании сверхъестественных феноменов."
POM_lessons_of_the_blade:0 "Уроки меча"
POM_lessons_of_the_blade_desc:0 "Новая броня защищает от старого оружия, а новое оружие ее пробивает – это гонка вооружений. Благодаря репродукции некоторых свойств легендарного Дирендала, мы смогли получить преимущество в разработке оружия."
POM_spirit_guns:0 "Привязка духов к винтовкам"
POM_spirit_guns_desc:0 "Наделив стрелковое оружие силой обнаруженных нами духов, мы смогли достичь серьезного повышения наступательных возможностей нашей пехоты. К сожалению, ловля достаточного количества духов обходится дорого."
POM_spirit_tanks:0 "Привязка Духов к танкам"
POM_spirit_tanks_desc:0 "Привязка волшебных духов к танкам приводит к ощутимому улучшению их тактико-технических характеристик. К сожалению, подчинение достаточного количества духов обходится дорого."
POM_magical_components:0 "Новые магические компоненты"
POM_magical_components_desc:0 "Изучение практик привязки духов привели нас к открытию альтернативных путей добычи необходимых для производства магического оружия компонентов."
POM_elixir_of_strength:0 "Зелье силы"
POM_elixir_of_strength_desc:0 "Нашим солдатам выделены алхимические препараты, значительно улучшающие их боевые показатели."
POM_elixir_of_vigor:0 "Зелье выносливости"
POM_elixir_of_vigor_desc:0 "Нашим солдатам выделены алхимические препараты, позволяющие им отсрочить утомление и поддержать запас сил."
POM_elixir_of_healing:0 "Зелье лечения"
POM_elixir_of_healing_desc:0 "Нашим солдатам и военным госпиталям выделены алхимические препараты, способствующие заживлению ран."
GOY_pom_equal_living_standards:0 "Военный коммунизм"
GOY_pom_equal_living_standards_desc:0 "Кто не работает, тот не ест!"
GOY_pom_revolutionary_academia:0 "Революционная наука"
GOY_pom_revolutionary_academia_desc:0 "Знание – сила, и как любая сила, она должна быть под контролем революционеров."

