 GOY_WS_BOI:0 "Грифонстоун – Королевство без короля" #лимит примерно в 3350 символов, иначе баги
 GOY_WS_BOI_desc:0 "Когда боги создали грифонов, они поселили первых из них на пике Соларспайк. Там они нашли §YВеликое древо§! и построили на нём свой первый город. С того дня Грифонстоун был духовным центром грифоньей цивилизации, Обителью богов. Веками §YАрхонт Борея§! заседал здесь. Тогда город правил землями далеко за пределами своих нынешних границ: Блэкхоллоу, Румейром, Энгривером и севером Верении.\n\nВсё изменилось с коронацией §YГровера§! в 704 году. Сам Борей благословил короля и даровал ему свой §YИдол§! – артефакт огромной магической силы. С его помощью Гровер всего за год победил Вингбардию и Аквелию и пошёл дальше. По мере его завоеваний значение Грифонстоуна меркло в сравнении с другими городами молодой империи. Тогда первый Кайзер перенёс столицу и резиденцию Архонта Борея в Грифенхейм.\n\nГровер Второй передал корону Грифонстоуна и роль хранителя §YИдола§! своему младшему брату §YГуто§!, основателю кадетской ветви императорской династии. Потомки Гуто с честью несли свой долг, Грифонстоун богател от торговли и паломников, а его школы и архивы славились во всей Грифонии. Однако, с началом промышленной революции значимость города упала вновь.\n\nОкончательное падение Грифонстоуна наступило после смерти Гровера Четвёртого. Ожидалось что §YГуто Шестой§! станет регентом при юном Гровере Пятом. Однако в 971 году в Грифонстоун пришёл циклоп §RАримаспи§!. Существо, как будто посланное самим Мааром, перерезало Королевскую Гвардию и украло §YИдол Борея§!. Королю с оставшимися гвардейцами удалось убить циклопа, однако сам он тоже погиб. Идол провалился в глубины §RБездны§! – места известного своими коварными ветрами, мешающими любому грифону спуститься по его скалистым краям.\n\nПоследовал хаос. Дворяне образовали §YРегентский совет§! и отказались признать Гуто Седьмого новым королем, заявив, что его династия утратила благосклонность богов. Вскоре после этого рухнула Империя. Грифонстоун, сильно зависящий от торговли и волн паломников, впал в экономический кризис. Дворяне начали борьбу за власть, разрывая ослабленное королевство на кусочки. Когда в 978 году революция свергла Императора в Грифенхейме, лорды Грифонстоуна объявили независимость.\n\nЭто привело к тридцати годам экономической, социальной и политической деградации. Румейр откололся сразу после смерти Гуто Шестого, а граф Габриэль Блюкрест увёл Блэкхоллоу в 985 году. В 992 году Гуто Седьмой с позволения Совета возглавил экспедицию в мятежную провинцию, но погиб в битве за Муркбик, а вместе с ним прекратился весь род Гуто.\n\nСейчас Грифонстоун – разрушенная страна. Грифоны живут в бедности, столица походит на гигантские трущобы, а некогда великие архивы заброшены. Королевством по-прежнему управляет Совет во главе с канцлером §YГраффом§!, старым грифоном, который не пользуется уважением ни лордов, ни обывателей. Две наиболее важные фракции возглавляют §CЛорд Гестал§! – ярый сторонник Империи Грифонов, выступающий за соединение с Грифенхеймом, и §YЛорд Голдстоун§! – грифон с глубокими карманами и отвратительной репутацией, желающий только власти и денег. Граждане сыты по горло своим правительством. В 1001 году грифонша по имени §YГильда§! Основала §CГрифонстоунское республиканское движение§! под вдохновением от визита двух пони из Эквестрии. Она выступает за роспуск Регентского совета и установление демократии – однако ей пока не хватает общественной поддержки для решительных действий." #\n\nДавно прошли славные дни Грифонстоуна. Он окружён врагами – западную часть страны терроризируют румейрцы, на востоке власть захватили бандиты, а правительства Вингбардии и Империи стремятся завоевать город, чтобы расширить своё влияние и укрепить легитимность. Многие думают, что город обречен...\n\nЕсть ли §Yнадежда§! для Дома Грифонов? #paradox plz fix -Ele
 GOY_WS_ARA:0 "Арантига – Остатки великого наследия"
 GOY_WS_ARA_desc:0 "§YАрантига§! это имя, столь же древнее, как и сама Грифония. В древние времена, когда мир был ещё молод, §GАрантигос Фезерин§! собрал армию могущественных грифоньих солдат, чтобы завоевать большую часть Грифонии. Великий стратег не имел равных на поле боя, и Арантигу боялись и уважали во всём мире! Однако, судьба — жестокая госпожа. Арантигос умер, а его империя исчезла. Его преемники растратили наши завоевания из-за мелких междоусобиц! В настоящее время осталось мало грифонов, которые просто помнят его имя...\n\nНо колесо судьбы снова провернулось. Ветра перемен уничтожили §YИмперию Грифонов§! и сейчас она лишь тень того, чем была раньше. К счастью для Арантиги, баронство присоединилось к §Yкоролевству Вингбардия§!, поэтому последствия распада Империи не были столь же серьёзными для страны, как для северной половины континента.\n\nДинастия Фезерин по-прежнему управляет страной, но ни один грифон в этой семье никогда не достигал высот Арантигоса. §GМаргарет Фезерин§!, нынешний лидер страны, не может и мечтать о величии древней Арантиги. И с ещё одним поколением упадка некоторые хотят похоронить мечты об империи и реформировать страну в соответствии с популярными ныне идеологиями. Но младший брат баронессы, §YДоротеос§!, является многообещающим генералом. Его глаза сияют так же ярко, подобно самому великому завоевателю! Некоторые хотят, чтобы именно он занял трон. Некоторые все ещё считают, что Арантига снова может стать великой. Что новый Арантигос появится, дабы привести свой народ к величию. И чтобы изменить мир, армия Арантигоса пройдёт маршем от края до края мира. Жребий скоро будет брошен. Будущее Арантиги изменится навсегда."
 GOY_WS_NTR:0 "Тир Дейге – Земля льда и пони"
 GOY_WS_NTR_desc:0 "История §3Тир Дейге§! началась тысячи лет назад, ещё до первого Дня §YСогревающего Очага§!. В эти дни, ещё до миграции пони на §YЮг Эквуса§!, многие из них уплыли в §YГрифонию§! – с нынешним §3Тир Дейге§! в качестве первого места высадки. Большая часть пони продолжила путь на запад, не желая оставаться на этой холодной и мёртвой земле, – но некоторые племена решили поселиться здесь.\n\n§CСевер§! всегда был полон магии, как в древности, так и сейчас. Основателям §3северных кланов§! пришлось сражаться с множеством сверхъестественных существ, бродящих по этой земле, пока они не встретили §7Шестерых Духов Севера§!. Пони договорились с ними и стали защитниками этой земли, охраняя её и живя в гармонии с ней. В ответ §7Духи§! наделили пони магией, которая позволила им процветать в этом холодном, опасном месте – так возникли §8Пять Великих Кланов§!, каждый благословлённый одним из духов. Лишь §0Дух Льда§! не выбрал себе чемпионов, но время от времени рождались особенные пони, которые присоединялись к §0Ледяному Кругу§! – говорящим с мертвыми защитникам §0Ледяных гробниц§!.\n\nСеверные пони были §Rвоинственны§!, и в отличии от их братьев с Эквуса, северные кланы воевали между собой даже по самым незначительным причинам при поддержке своих §7Духов§!. Со временем, все больше пони, жаждущих власти, выбирали темные пути – самыми печально известными из них стали §OКороли Снежной Бури§!, могущественные тираны-некроманты. Но однажды на берег выбросило скитальца из неизвестной страны. Он не принадлежал ни к одному из кланов и не помнил, откуда он родом. Единственное, что он знал, – это свое имя – §5Каиннех§!. Многие годы он путешествовал по стране, заводил друзей из разных кланов, сражался с монстрами §Oтиранических магов§!, став героем северных пони. В ходе путешествий он понял, что именно разобщенность и жалкие конфликты позволили §OКоролям Снежной Бури§! захватить §3Тир Дейге§! – и пони должны сражаться как один, если они хотят освободиться. Рассказов о подвигах §5Каиннеха§! множество: ему удалось проникнуть в мир духов, и получить благословение всех шести §7Духов Севера§!, справившись с их испытаниями. Не силой, а дипломатией он объединил все кланы и племена и победил §OКоролей Снежной Бури§!. §5Каиннех§! стал первым §Yпринцем§! Тир Дейге и основателем §4Клана Сноуфлейк§!.\n\nС тех пор прошло много веков, и рассказы превратились в легенды, но §4Клан Сноуфлейк§! продолжил направлять пони §3Тир Дейге§!. Пони жили в гармонии с природой, их не беспокоил внешний мир... Вплоть до вторжения §RСкайнавцев§!. Недовольные §Rкоммунисты§!, ведомые §YАспером Сиклкло§!, оставили §OРеспублику Грифонов§! и вторглись в §3Тир Дейге§!. Несмотря на доблесть защитников, мечи и копья не могли сравниться с ружьями грифонов, и пони были вынуждены покинуть §Yзападные земли§!. С тех пор они ведут безнадежную войну против §Rскайнавцев§! – и хотя решающей битвы не случилось, очевидно, что пони проигрывают. Тысячи их братьев погибли, включая принца §YФотада Третьего§! и всех жеребцов его рода. Многие считают что §5Принцесса Фиана§!, последняя из §4Клана Сноуфлейк§!, не приведет их к победе и поддерживают §9Эуана из клана Стормшилд§! – амбициозного пони, продвигающего идеи модернизации. Долгий конфликт §Oреформаторов§! и §Cтрадиционалистов§! скоро завершится с созывом §GВеликого Совета§!. Но пока кланы спорят, §0тёмные силы§! пробуждаются от многовекового сна..."
 GOY_WS_HRR:0 "Освободительная армия Герцланда – Единство через отчаяние"
 GOY_WS_HRR_desc:0 "Когда первые новости о §0Ледяном короле§! только достигли §OГерцланда§!, они были отвергнуты как фантастические сказки. Большинство игнорировало северную угрозу, и даже те, кто признавал существование §Rорды нежити§! верили, что пушек и танков будет достаточно, чтобы остановить это.\n\nО, как же они ошибались...\n\nАрмии нежити  §0Ледяного короля§! сломили безрассудных §Oгерцландцев§!, опустошили их земли и приступили к §Rпорабощению§! местной популяции грифонов, стремясь §Rискоренить§! любой след культуры, веры и свободы грифонов. Однако грифонью решимость не так легко сломить. Перед лицом зверств, совершаемых пони-воинами и их приспешниками-нежитью, воинственные грифоны §Rвзбунтовались§!. Бывшие §8имперские офицеры§!, §9республиканцы§! и §1революционеры§!… Впервые в истории грифоны с такими разными политическими взглядами решили §Yобъединится§! и сражаться за одно дело: освободить свою родину и спасти свой вид от будущего рабства и угнетения. Возглавляемый §YГектором Арденнсомом§!, гроссмейстером рыцарского ордена §gЗильберкралле§!, §Oгрифоны герцланда§! будут сражаться до победного конца, поскольку даже смерть в бою лучше, чем участь, которая их ждет, если они §Rпроиграют§!."
 GOY_WS_POM:0 "Помоварра – Земля раздора"
 GOY_WS_POM_desc:0 "Столетия назад, когда южные королевства были еще молоды, на земле, которую сейчас называют §7Помоваррой§!, жили племена свирепых грифонов. От холмов современной Аквелии до берегов озера Румэйр простирались владения §6древних помоварцев§!. То было время легенд, когда герои сражались с богами, убивали волшебных монстров, а §6помоваррские воины§! могли дать отпор любому смертному врагу. Однако тем славным дням пришел конец, когда волна захватчиков обрушилась на §6Древнюю Помоварру§!. Завоеватели – король §tАрантигос§!, §2грифонстоунцы§!, §9северяне§! – один за другим отбирали ее земли. Именно тогда, в ответ на растущую угрозу со стороны §1Аквелии§!, возникло первое §7помоваррское королевство§!, объединенное §gМадоком§!, §gсыном Утра§!.С этого времени начался "§gСеребряный век§!" §7Помоварры§!. Вожди племен стали рыцарями, в землю пришло процветание, а §7помоварцы§! стали больше похожи на своих "цивилизованных" соседей.\n\nВойны с §1Аквелией§! продолжались почти двести лет, до 298 года ПИЛ, когда в §OДень пылающего неба§! единорожьи маги на службе у §1Аквелии§! сожгли волшебным пламенем короля §7Помоварры§! вместе с большей частью знати. Семь столетий после этого §7Помоварра§! страдала под властью §1аквелийцев§!, а семья §0де Шарбон§! правила в качестве её князей. Но местные грифоны оказались неуправляемыми. Для §7помоварцев§! стало мрачной "традицией" каждые несколько поколений поднимать освободительные восстания. Каждое из них терпело поражение, за чем следовали убийства, притеснения и попытки §1аквелизации§! населения. Дальнейшее правление §9Гроверов§! не улучшило ситуацию, а возвышение §0Фловены§!, казалось, стало последним гвоздем в крышку гроба §7Помоварры§!, поскольку всё больше и больше местных жителей принимали обычаи §9герцландцев§! и §1аквелийцев§!.\n\nОднако эпоха революций преподнесла §7помоварцам§! новую возможность. Ситуация в регионе и без того была нестабильной, но §1Аквелийская революция§! 980 года спровоцировала еще одно восстание в §7Помоварре§!. гарнизон был разбит, и на короткое время казалось, что §7Помоварра§! наконец-то станет свободной. Но по мере того, как хаос в Грифонии усугублялся, в соседней §4Верении§! началась гражданская война. Банды республиканских и имперских дезертиров, армии знати и группы бандитов (порой их было не различить) сражались за контроль над регионом.\n\nПатриции §0Фловены§!, полагая, что свободная §7Помоварра§! непременно нападет на них, сумели заключить сделку с полковником §8Леопольдом Райхером§!, дезертиром из Рейхсармии. Они предложили ему припасы и оружие в обмен на обещание вернуть §7Помоварру§! под их контроль. Его армии дезертиров и наемников удалось разгромить §7помоваррских§! повстанцев и захватить регион. Но, к ужасу патрициев, §8Райхер§! нарушил обещание и объявил себя "Князем Помоварры", став, таким образом, новой угрозой городу садов. Местным жителям не понравился их новый правитель, и они занялись тем, что у §7помоваррцев§! получается лучше всего: партизанской войной.\n\nЗа последующие двадцать семь лет им удалось установить контроль над значительной частью своей родины. Под руководством §LХармана Камриза§! и §6Оливьера Мореля§! они стали достаточно сильны, чтобы раз и навсегда избавиться от иностранных оккупантов. По мере того как власть гарнизона ослабевает, кажется очевидным, что конфликт вскоре завершится."
 GOY_WS_ARD:0 "Аквелийская Коммуна – Последняя революция"
 GOY_WS_ARD_desc:0 "Взятие Аквилы мятежным полковником Леопольдом Райхером стало достойным концом старого порядка; унизительная смерть, уничтожение в когтях простого вояки и его шайки бандитов и наемников, маскирующихся под армию. Князь-полковник, однако, не собирался править завоеванными землями. Он просто разграбил столицу и покинул свои разваливающиеся владения.\n\nВ последовавшем хаосе у одного грифона хватило воли и дальновидности, чтобы обратить это бедствие вспять. Виктор Аллард, известный лидер коммунистов, теперь ещё более радикальный и разочарованный в неудачах аквелийских республиканцев, возглавил страну. По всей Аквелии возникли коммунистические ополчения, которые уничтожали как бандитов, так и реакционеров.\n\nИз пепла реакционного прошлого Аквелии, подобно социалистическому фениксу, восстает новое государство – по–настоящему революционное государство – Коммуна. В предыдущие три десятилетия силы реакции сорвали Республиканскую революцию 978 года и Аквелийские революции 980 и 1008 годов, что привело к их неизбежному падению, организованному как монархистами извне, так и "демократами" изнутри. Пришло время возвестить о начале новой эры, новой бескомпромиссной революции, которая, наконец, приведет к успеху как в избавлении от прошлого, так и в завоевании будущего."