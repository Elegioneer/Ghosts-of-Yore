## Spirits ##
BOI_political_deadlock:0 "Политический застой"
BOI_political_deadlock_desc:0 "Регентский совет, сформированный для управления Грифонстоуном в отсутствие законного короля, оказался совершенно неэффективным. Лорды проводят свои дни в словесных перепалках и бесконечной борьбе за власть. Их фракционность мешает совету принимать какие-либо значимые решения. Похоже, нет никакой надежды на выход из этого положения до тех пор, пока совет не будет либо свергнут, либо распущен и собран заново."
BOI_rumarean_unrest:0 "Румейрские беспорядки"
BOI_rumarean_unrest_desc:0 "Западные земли Грифонстоуна населены многими румейрцами. Хотя столетия ассимиляции сократили число несогласных среди них, многие по-прежнему придерживаются своих старых обычаев и стремятся к объединению со своими островными братьями."
BOI_rumarean_unrest_1:0 "Румейрские беспорядки"
BOI_rumarean_unrest_1_desc:0 "Западные земли Грифонстоуна населены многими румейрцами. Хотя столетия ассимиляции сократили число несогласных среди них, многие по-прежнему придерживаются своих старых обычаев и стремятся к объединению со своими островными братьями."
BOI_rumarean_unrest_2:0 "Румейрские беспорядки"
BOI_rumarean_unrest_2_desc:0 "Западные земли Грифонстоуна населены многими румейрцами. Хотя столетия ассимиляции сократили число несогласных среди них, многие по-прежнему придерживаются своих старых обычаев и стремятся к объединению со своими островными братьями."
BOI_rumarean_unrest_3:0 "Румейрские беспорядки"
BOI_rumarean_unrest_3_desc:0 "Западные земли Грифонстоуна населены многими румейрцами. Хотя столетия ассимиляции сократили число несогласных среди них, многие по-прежнему придерживаются своих старых обычаев и стремятся к объединению со своими островными братьями."
BOI_trade_hub_idea:0 ""Торговый центр" Грифонии"
BOI_trade_hub_idea_desc:0 "Благодаря нашему выгодному расположению в центральной части Грифонии и недавним инвестициям в инфраструктуру, мы можем извлекать большую выгоду из международной торговли, проходящей через нашу страну."
BOI_industrial_expansion:0 "Промышленное развитие"
BOI_industrial_expansion_desc:0 "Благодаря недавним реформам, промышленность Грифонстоуна неуклонно расширяется."
BOI_archives_of_griffonstone:0 "Архивы Грифонстоуна"
BOI_archives_of_griffonstone_desc:0 "Архивные хранилища вновь открыты, а полные книг библиотеки ждут новых читателей."
BOI_miraculous_recovery:0 "Чудесное восстановление"
BOI_miraculous_recovery_desc:0 "На это ушло много времени, но Грифонстоун восстал из пепла. Наша экономика полностью восстановлена. Наконец-то мы готовы ко всему, что принесет нам будущее."
BOI_terrace_farms:0 "Террасное земледелие"
