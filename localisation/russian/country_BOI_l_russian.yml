## Decisions ##
BOI_war_for_liberation_category:0 "Начать восстание Эквестрийского Освободительного Фронта"
BOI_start_war_for_liberation:0 "Поддержать заговорщиков"
BOI_divination_category:0 "Военное ясновидение"
BOI_divination_category_desc:0 "Происхождение дерева, на котором построена значительная часть Грифонстоуна, неизвестно. Жрецы утверждают, что оно было создано самими богами как дар грифонам – их первый дом. Древние мифы гласят, что Древо столь же старо, как и сам мир, и проросло в эпоху, предшествовавшую даже сотворению первых грифонов. Некоторые малые культы заявляют, что Великое Древо – это столп этого мира, и его корни простираются через весь земной шар. \n\nВ любом случае, это место мощной магии и важное место поклонения. Под ним можно обнаружить обширные системы пещер, и многие грифоны утверждают, что истинного просветления можно достичь лишь при паломничестве туда. Мы решили проверить эти слухи, и, по сути, исследования доказали, что определённые взаимодействия с Древом позволяют получить ограниченное предвидение. Благодаря этому открытию нам удалось создать объект, где, используя передовые технологии и природную магию Древа, мы стали способны предсказывать будущее – однако, поскольку будущее постоянно меняется, мы можем в лучшем случае точно предсказать события ближайших нескольких часов, а видения могут быть неясными. По неизвестным причинам, наиболее ясными являются предсказания бедствий и кровопролития – что может быть невероятно полезно для наших военных операций. Однако грифоны, использующие силы Древа, склонны к безумию, так как они начинают путать настоящее с возможным будущим. Длительное использование Древа приведёт к потере многих операторов."
