## Bookmark ##
BOI_GATHERING_STORM_DESC1:0 "\n\n\n\n\n\n\n\n£GFX_texticon_CSSc_GOY_BOI_map\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nГрифонстоун, первое поселение грифонов, стал лишь тенью своего былого величия. С потерей Идола Борея и смертью короля Гуто Шестого, колыбель грифоньего рода погрязла в бедности и разрухе. Простой народ живёт впроголодь, республиканское движение постепенно набирает силу среди отчаявшихся грифонов, фракции Регентского совета слишком заняты борьбой за власть, чтобы что-либо предпринять для решения многочисленных проблем страны, а Дедушка Графф, канцлер, похоже, совсем потерял интерес к государственным делам. Кто же сможет принести надежду в это древнее государство?"

## Technologies ##
GOY_steam_engines_tech:0 "Судовой паровой двигатель"
BOI_motorized_equipment_1:0 "GMW-LKW G-01 'Жук'"
BOI_motorized_equipment_1_short:0 "G-01 'Жук'"
BOI_motorized_equipment_1_desc:0 "Greiffensteinische Motoren Werke была основана как авиационный завод, но их первый самолёт так и не смог подняться в воздух. После долгой, запутанной, почти эзотерической цепи перепроектировок он каким-то образом превратился в... грузовик, а GMW — в автомобильную компанию. Модель, названная "Жуком" из-за своей абсурдной грузоподъёмности при малых габаритах, (печально) известна по всей Грифонии низким качеством деталей и удивительной простотой ремонта — для него требуются лишь простейшие инструменты. Это сделало его популярным выбором среди фермеров и тех, кто не может позволить себе лучший или более крупный автомобиль — то есть, любой другой. Сильно недофинансированная грифонстоунская армия тоже не имела другого выбора, кроме G-01."
BOI_motorized_rocket_equipment:0 "GMW-LKW G-01.1 'Жук-ракетенверфер'"
BOI_motorized_rocket_equipment_short:0 "G-01.1 'Жук-ракетенверфер'"
BOI_motorized_rocket_equipment_desc:0 "В стиле, типичном для армии Грифонстоуна, когда высшее командование разместило заказ на самоходную платформу для реактивной артиллерии, большая часть зарезервированных средств почти мгновенно осела в чьих-то очень глубоких карманах. В результате, всё, что могли позволить себе военные инженеры, – установить на старый ненадежный "Жук" несколько ракетных направляющих..."
BOI_motorized_rocket_equipment_1:0 "GMW-LKW G-01.1 'Жук-ракетенверфер'"
BOI_motorized_rocket_equipment_1_short:0 "G-01.1 'Жук-ракетенверфер'"
BOI_motorized_rocket_equipment_1_desc:0 "В стиле, типичном для армии Грифонстоуна, когда высшее командование разместило заказ на самоходную платформу для реактивной артиллерии, большая часть зарезервированных средств почти мгновенно осела в чьих-то очень глубоких карманах. В результате, всё, что могли позволить себе военные инженеры, – установить на старый ненадежный "Жук" несколько ракетных направляющих..."

