## Foci ##
#Deadlock
BOI_fallen_kingdom:0 "Павшее королевство"
BOI_fallen_kingdom_desc:0 "Тридцать лет непрерывного политического застоя и экономического упадка превратили Грифонстоун в убогую пародию на нормальное государство. Дворяне из Регентского совета, похоже, не в состоянии решить ни одну из проблем страны и тратят время только на бессмысленные склоки и борьбу между фракциями."
BOI_hire_new_troops:0 "Набрать новые войска"
BOI_hire_new_troops_desc:0 "Королевские Силы Обороны Грифонстоуна сильно ослабли. Им не хватает вооружения, подготовки и личного состава. Хотя мы не можем обеспечить их надлежащим финансированием, нам удалось наскрести немного денег, чтобы набрать по крайней мере несколько тысяч грифонов."
BOI_mines_of_goldstone:0 "Шахты Голдстоуна"
BOI_mines_of_goldstone_desc:0 "В давние времена Грифонстоун славился своими золотыми и серебряными рудниками. Однако по прошествии веков эти рудники иссякли – сегодня только те, что принадлежат лорду Голдстоуну, обеспечивают стабильный поток драгоценных металлов..."
BOI_grovel_for_help:0 "Мольба о помощи"
BOI_grovel_for_help_desc:0 "Хотя мы отделились от Империи некоторое время назад, в Регентском совете все еще есть сильная фракция, выступающая за воссоединение с Грифенхеймом. У лидера этих грифонов, лорда Гестала, есть несколько влиятельных друзей при императорском дворе, и он мог бы обратиться к ним за помощью..."
BOI_prepare_for_war:0 "Подготовиться к следующей войне"
BOI_prepare_for_war_desc:0 "Мы окружены врагами, и их нападение – только вопрос времени. Королевские Силы Обороны устарели и не готовы защищать нашу страну. Мы должны организовать маневры, чтобы оценить их состояние и подготовиться к реформированию."
BOI_whip_council:0 "Заставить совет работать"
BOI_whip_council_desc:0 "Криками, одолжениями и ложными обещаниями "Дедушка" Графф снова попытается заставить Регентский совет действительно что-то предпринять для восстановления нашей страны. Это будет нелегкая задача..."
BOI_discuss_reforms:0 "Обсудить реформы"
BOI_discuss_reforms_desc:0 "Хотя Регентский Совет – это бессмысленно грызущаяся кучка могущественных грифонов, возможно, есть шанс заставить или убедить их сотрудничать на благо нации (или, если их это не волнует, хотя бы предотвратить республиканскую революцию). Но достичь такого компромисса будет непросто..."
#Air
BOI_create_airforce:0 "Создать ВВС"
BOI_create_airforce_desc:0 "Поскольку вооруженные силы нашей нации безнадежно устарели, нам нужно догнать другие державы Грифонии. До сих пор у нас не было настоящих военно-воздушных сил – настало время это изменить."
BOI_import_fighters:0 "Импортировать истребители"
BOI_import_fighters_desc:0 "Создание собственных конструкций истребителей с нуля может быть трудным. Вместо этого мы можем купить иностранные самолеты и скопировать их."
BOI_air_doctrine_studies:0 "Изучение доктрины воздушного боя"
BOI_air_doctrine_studies_desc:0 "Ведение войны в небесах требует нечто большее, чем просто посадить несколько птиц в самолеты и приказать им атаковать врага. Если мы хотим делать это эффективно, нам нужно разработать правильную тактику."
BOI_bomber_designs:0 "Спроектировать бомбардировщики"
BOI_bomber_designs_desc:0 "Истребители бесполезны против наземных сил – как максимум, с них можно сбрасывать камни. Нам нужны настоящие бомбардировщики! Немедленно!"
BOI_found_air_academy:0 "Основать Академию ВВС"
BOI_found_air_academy_desc:0 "Чтобы далее расширять и улучшать наши ВВС, мы создадим настоящую академию пилотов – таким образом, нам не придется полагаться на необученных любителей."
BOI_CAS:0 "Дальнейшее развитие авиации"
BOI_CAS_desc:0 "Нам нужно оснастить наши самолеты гораздо более мощным оружием и лучшими двигателями, если мы хотим победить более многочисленные вражеские силы."
BOI_new_strategic_bombers:0 "Новые стратегические бомбардировщики"
BOI_new_strategic_bombers_desc:0 "Разработка бомбардировщиков, предназначенных для дальних миссий и атаки вражеской промышленности и инфраструктуры, может быть очень полезной – легче сражаться с врагом, который не может эффективно перемещать и снабжать свои войска."
BOI_streamline_production:0 "Оптимизировать производство"
BOI_streamline_production_desc:0 "Нам не нужны идеальные самолеты – сойдут и хорошие. Что нам нужно, так это огромное их количество – поэтому крайне важно улучшить наши методы производства."
BOI_improve_bomber_tactics:0 "Улучшить тактику бомбардировок"
BOI_improve_bomber_tactics_desc:0 "Бомбардировщики невероятно полезны как для прямой поддержки нашей армии, так и для разрушения вражеской промышленности. Нам нужно сосредоточиться на улучшении их тактики, чтобы полностью использовать их разрушительные возможности."
BOI_improve_fighter_designs:0 "Улучшить конструкции истребителей"
BOI_improve_fighter_designs_desc:0 "Наши истребители ещё могут стать лучше – и любое преимущество на этом поприще будет бесценно."
BOI_faster_than_wind:0 "Быстрее ветра"
BOI_faster_than_wind_desc:0 "Ракеты - удивительная технология! Они позволят поражать врагов за сотни миль. Нам нужна эта чудо-техника!"
BOI_wetterkommando:0 "Веттеркомандо"
BOI_wetterkommando_desc:0 "Построив ряд магитехнических установок на вершинах гор, мы сможем в некоторой степени манипулировать погодой, создавая более благоприятные условия для наших пилотов. Но их содержание потребует огромных ресурсов..."
BOI_destroyer_of_worlds:0 "Разрушитель миров"
BOI_destroyer_of_worlds_desc:0 "Теория магиядерного оружия была сформулирована несколько лет назад. До сих пор нам не хватало знаний для разработки такого вооружения. Но теперь, когда враги наверняка разрабатывают его, нам нужно включиться в гонку."
#Navy
BOI_birth_navy:0 "Рождение нашего флота"
BOI_birth_navy_desc:0 "У Грифонстоуна никогда не было выхода к морю, поэтому у нас нет ни флота, ни морских традиций. Но теперь, когда мы контролируем прибрежные регионы, пора подумать о создании настоящего флота."
BOI_construct_cruisers:0 "Сконструировать крейсеры"
BOI_construct_cruisers_desc:0 "Крейсеры – основа любого флота, и нам срочно нужно построить хотя бы несколько таких кораблей."
BOI_fund_fleet:0 "Профинансировать строительство флота"
BOI_fund_fleet_desc:0 "Чтобы догнать другие морские державы, необходимо выделить дополнительные средства на строительство и содержание верфей."
BOI_destroyer_design:0 "Спроектировать эсминцы"
BOI_destroyer_design_desc:0 "Эсминцы служат для различных целей, что делает их критически важными вспомогательными кораблями. Чтобы наш флот был сильным и защищенным, нам нужны самые технологически продвинутые эсминцы."
BOI_naval_aviation:0 "Морская авиация"
BOI_naval_aviation_desc:0 "Некоторые стратеги предсказывают, что авианосцы станут ключевым элементом морских сражений. Но без специальных самолётов авианосцы бесполезны – так давайте разработаем их!"
BOI_our_naval_doctrine:0 "Наша морская доктрина"
BOI_our_naval_doctrine_desc:0 "Пригласив иностранных офицеров и изучив разведданные, мы сможем разработать собственную стратегию морской войны."
BOI_marine_corps:0 "Морская пехота"
BOI_marine_corps_desc:0 "Специальные пехотные подразделения будут крайне полезны при морских десантах и могут возглавлять такие операции."
BOI_expand_trade_fleet:0 "Расширить наш торговый флот"
BOI_expand_trade_fleet_desc:0 "Морская торговля жизненно важна для снабжения экономики ресурсами. Нам нужен собственный торговый флот, чтобы не зависеть от частных судоходных компаний."
BOI_good_old_battleships:0 "Старые-добрые линкоры"
BOI_good_old_battleships_desc:0 "Линейные корабли десятилетиями были основой флотов и, вероятно, останутся таковыми. Чтобы соперничать с морскими державами, нам нужны собственные линкоры."
BOI_rely_on_carriers:0 "Ставка на авианосцы"
BOI_rely_on_carriers_desc:0 "Очевидно, что авианосцы – это будущее морской войны. Они дорого нам обойдутся, но с их помощью, мы будем контролировать и море, и воздух."
BOI_new_submarines:0 "Новые подводные лодки"
BOI_new_submarines_desc:0 "Подлодки полезны для атак на вражеские конвои и военные корабли. Если враг превосходит нас численно, скрытный подход может быть оптимальным."
BOI_griffonstonian_admiralty:0 "Адмиралтейство Грифонстоуна"
BOI_griffonstonian_admiralty_desc:0 "По мере роста нашего флота растут и его потребности. Чтобы должным образом командовать большим количеством кораблей, планировать операции и далее улучшать нашу тактику, нам нужно специальное командование."
#Army
BOI_royal_defence_force:0 "Королевские Силы Обороны Грифонстоуна"
BOI_royal_defence_force_desc:0 "КСОГ – древнее формирование, существовавшее ещё до времён эквестрийских принцесс. Теперь это лишь жалкое подобие былой славы: недоукомплектованное, плохо оснащённое и ужасно устаревшее. Если мы хотим защищаться, это нужно изменить."
BOI_reichsarmee_veterans:0 "Ветераны Рейхсармии"
BOI_reichsarmee_veterans_desc:0 "Рейхсармия когда-то была величайшей армией Грифонии. После падения Империи многие бывшие имперские офицеры оказались в Грифонстоуне. Их опыт поддержит наших молодых офицеров."
BOI_recruitment_drive:0 "Вербовочная кампания"
BOI_recruitment_drive_desc:0 "Даже если бы у нас были ружья, без грифонов они бы не начали стрелять. Следует развернуть пропагандистскую кампанию для привлечения новобранцев в КСОГ."
BOI_modern_firearms:0 "Закупить современное стрелковое оружие"
BOI_modern_firearms_desc:0 "Наше оружие было хорошим... несколько поколений назад! Сейчас ему место в музее. Без собственного производства лучший вариант – купить иностранные образцы и попытаться воспроизвести их."
BOI_griffons_army:0 "Армия грифонов"
BOI_griffons_army_desc:0 "Настала эра промышленной войны – эра армий, которые по численности превосходят меньшие нации. Пора создать настоящую регулярную армию вместо ополчения, верного лишь дворянам."
BOI_why_fight:0 "То, за что мы сражаемся"
BOI_why_fight_desc:0 "Солдаты – не пушечное мясо. Каждый должен знать, за что воюет, и гордиться своей ролью защитника Грифонстоуна."
BOI_common_soldier_care:0 "Забота о простом солдате"
BOI_common_soldier_care_desc:0 "Мы обязаны обеспечить максимальную помощь раненым – это разумно и достойно."
BOI_noble_levies:0 "Дворянские ополчения"
BOI_noble_levies_desc:0 "Веками дворянство защищало Грифонстоун, и почему мы должны это менять? Те, кто рождён править, лучше всего подходят для руководства новой армией."
BOI_right_to_rule:0 "Право править"
BOI_right_to_rule_desc:0 "Поколение за поколением лорды и дворяне Грифонстоуна защищали наш великий город. Они с детства учатся командовать и знают, что поражение опозорит не только их, но и всех потомков."
BOI_emulate_reichsarmee:0 "Подражание Рейхсармии"
BOI_emulate_reichsarmee_desc:0 "Многие наши офицеры некогда служили в Рейхсармии. Их опыт поможет создать армию, способную соперничать с бывшей Имперской."
BOI_new_doctrine:0 "Новая доктрина для новой эпохи"
BOI_new_doctrine_desc:0 "Война меняется. Мы должны адаптироваться к настоящему и выучиться на ошибках прошлого, чтобы побеждать в будущем."
BOI_support_the_army:0 "Батальоны поддержки"
BOI_support_the_army_desc:0 "Только дураки думают, что армия состоит исключительно из фронтовых бойцов – без надлежащей поддержки они были бы легкой добычей для своих врагов. Пришло время обеспечить надлежащую поддержку для Грифонстоунской Армии."
BOI_eyes_ears:0 "Глаза и уши"
BOI_eyes_ears_desc:0 "Зарождается очень интересная технология, которая позволяет чётко отслеживать передвижения врага. Имя ей «РАДАР». Было бы глупо не воспользоваться ей."
BOI_military_academy:0 "Военная Академия Грифонстоуна"
BOI_military_academy_desc:0 "Мы не можем полагаться только на ветеранов и надеяться, что новые офицеры научатся искусству войны на поле боя. Вместо этого мы должны создать настоящую военную академию, чтобы воспитывать новые поколения командиров."
BOI_weltbaum:0 "Проект «Вельтбаум»"
BOI_weltbaum_desc:0 "Древо Грифонстоуна так же старо, как грифоний род – а может, и старше. Это священный объект, цель многих паломников, и его магический потенциал начинает раскрываться только сейчас благодаря передовой магитехнике. Хотя более набожных грифонов это, определённо, не обрадует, мы можем начать использовать его в военных целях."
BOI_flesh:0 "Плоть"
BOI_flesh_desc:0 "Даже лучшее оружие ничего не значит без обученного воина. Именно солдаты выигрывают битвы, и наш долг – обеспечить их наилучшей подготовкой и снаряжением."
BOI_birdwave:0 "Тактика птичьей волны"
BOI_birdwave_desc:0 "Грифонов никогда не бывает «слишком много»."
BOI_modernise_eq:0 "Модернизировать снаряжение"
BOI_modernise_eq_desc:0 "Мы уже начали улучшать наше пехотное оружие, но наших усилий до сих пор было недостаточно. Нашим солдатам нужно самое современное вооружение – прежде чем им вооружатся противники."
BOI_knights_of_griffonstone:0 "Рыцари Грифонстоуна"
BOI_knights_of_griffonstone_desc:0 "Когда-то о Королевской Гвардии воспевались легенды. Возможно, пришло время возродить это славное формирование для защиты Дома Грифонов."
BOI_gun_in_every_claw:0 "По винтовке в каждую лапу"
BOI_gun_in_every_claw_desc:0 "Количество – тоже качество. В вопросе пехотного снаряжения это правило работает безотказно."
BOI_victory_or_death:0 "Победа или смерть"
BOI_victory_or_death_desc:0 "Ни шагу назад! Мы победим или умрём, но не допустим падения Грифонстоуна!"
BOI_steel:0 "Сталь"
BOI_steel_desc:0 "Бросать грифонов в бой, как мясо в мясорубку, глупо – нас слишком мало. Пусть самую тяжёлую работу делают артиллерия и танки."
BOI_achtung:0 "Ахтунг, панцеры!"
BOI_achtung_desc:0 "Эти новые панцеры, или, как их называют эквестрийцы, «танки», – занятные изобретения, которые могут полностью изменить природу войны. Нам нужно заполучить их!"
BOI_barrage:0 "Сокрушительный огневой вал"
BOI_barrage_desc:0 "Нет проблемы, которую нельзя решить с помощью тысячи современных пушек – ни один враг не выдержит такой мощи."
BOI_new_artillery:0 "Новые артиллерийские орудия"
BOI_new_artillery_desc:0 "Для реализации новой стратегии нужно производить больше качественных артиллерийских установок. Выделим средства учёным на разработку."
BOI_steel_beasts:0 "Стальные чудовища"
BOI_steel_beasts_desc:0 "Их двигатели ревут! Их гусеницы грохочут! Они вселят ужас в сердца врагов! Когда-то грифоны боялись волшебных монстров из плоти и крови – теперь они будут бояться технологических монстров из непробиваемой стали."
BOI_sturdy_cannons:0 "Прочные орудия"
BOI_sturdy_cannons_desc:0 "Разрывы стволов в бою ведут к поражению. Нужен строгий контроль качества на наших военных заводах."
#Economy
BOI_from_ashes:0 "Восстать из пепла"
BOI_from_ashes_desc:0 "Грифонстоун наряду с Катерином считается одним из самых нищих регионов Грифонии. Наша экономика разрушена, и чтобы вернуть былую славу, нужно её восстановить. Это будет долгий и трудный путь."
BOI_restore_roads:0 "Восстановить дороги"
BOI_restore_roads_desc:0 "Грифонстоун – страна гор и каньонов. Строительство и содержание инфраструктуры здесь обходится дорого, так что мы годами ей пренебрегали. Нам нужно восстановить ключевые дороги к Дому Грифонов."
BOI_gather_scraps:0 "Собрать остатки"
BOI_gather_scraps_desc:0 "Казна пуста. Попробуем найти что-то ценное в старых королевских хранилищах и продать часть земель короны."
BOI_ask_for_loans:0 "Запросить кредиты"
BOI_ask_for_loans_desc:0 "Грустная правда в том, что без внешней поддержки мы не можем надеяться справиться с нашими проблемами. Однако банковское дело – это почтенная грифонская традиция, так что почему бы нам не взять немного средств в кредит?"
BOI_literacy_campaign:0 "Кампания всеобщей грамотности"
BOI_literacy_campaign_desc:0 "Каждый грифонстоунец может пересчитать свои скудные сбережения, но многие не умеют читать. Пора это исправить с помощью общенациональной образовательной программы."
BOI_educate_engineers:0 "Обучить наших инженеров"
BOI_educate_engineers_desc:0 "«Базовое Обучение для Инженеров, Урок 1: Сильный удар по корпусу машины не всегда устраняет неисправность. Сначала попробуйте найти её причину.»"
BOI_temple_schools:0 "Интеграция приходских школ"
BOI_temple_schools_desc:0 "Приходские школы – один из очень немногих способов получить настоящее образование в Грифонстоуне. Мы должны поддержать их финансово и включить их в нашу зарождающуюся систему образования."
BOI_griffonstone_uni:0 "Университет Грифонстоуна"
BOI_griffonstone_uni_desc:0 "До сих пор грифоны, желающие получить высшее образование, уезжали заграницу. Чтобы стать культурной столицей Грифонии, нам нужен собственное высшее учебное заведение."
BOI_guto_institute:0 "Исследовательский институт имени Гуто"
BOI_guto_institute_desc:0 "Известно, что общее образование в Грифонстоуне одно из худших в Грифонии. Мы должны исправить это, ведь военного и гражданского прогресса нам нужны не просто школы, а полноценные исследовательские центры!"
BOI_north_west:0 "Север и Запад"
BOI_north_west_desc:0 "Железные дороги – артерии экономики. Мы могли бы извлекать выгоду из международной торговли, используя наше выгодное положение в центре континента, но для этого нужно должным образом соединить Грифонстоун с соседними землями."
BOI_gold_silver:0 "Золотая и серебряная дороги"
BOI_gold_silver_desc:0 "Голдстоун и Сильверстоун входят в число важнейших городов страны. Соединив их со столицей, мы создадим транспортную ось, которая позволит нам плавно перемещать грифонов и товары между Герцландом и Южной Грифонией."
BOI_solar_rail:0 "Солнечная железная дорога"
BOI_solar_rail_desc:0 "Восточные горы проходимы только пешком, и нам приходится полагаться на животных для перевозки руды из их шахт. Построив настоящие железные дороги, мы могли бы как усилить наши горнодобывающие возможности, так и подготовить инфраструктуру для военной кампании против Блэкхоллоу."
BOI_rumare_ferry:0 "Паромы Румейра"
BOI_rumare_ferry_desc:0 "Теперь, когда западные острова в наших когтях, мы должны обеспечить их надлежащими средствами передвижения до Грифонстоуна. Расширение нашего флота паромов облегчит путешествия и улучшит транспортировку товаров через озеро Румейр."
BOI_connect_blackhollow:0 "Соединить Блэкхоллоу"
BOI_connect_blackhollow_desc:0 "Блэкхоллоу – это не только опустошённое гнездо бандитов, но и ворота в долину Эви. Мы должны провести через него полноценные дороги, чтобы пожинать плоды торговли с Востоком."
BOI_trade_hub:0 "Торговый узел Грифонии"
BOI_trade_hub_desc:0 "Наше выгодное положение и недавние улучшения инфраструктуры позволяют нам извлекать выгоду из международной торговли. Пусть деньги и товары текут через Грифонстоун!"
BOI_tax_breaks:0 "Налоговые каникулы для промышленников"
BOI_tax_breaks_desc:0 "Вместо того чтобы восстанавливать Грифонстоун самостоятельно, мы можем позволить иностранцам это сделать! Мы предоставим иностранным промышленникам щедрые налоговые льготы, в сочетании с тем, что наши грифоны готовы работать за миску риса, это должно привлечь богатых иностранных инвесторов и позволить нам запустить нашу промышленность."
BOI_guns_wohnsitz:0 "Пушки Вонзитца"
BOI_guns_wohnsitz_desc:0 "Вонзитц – второй по значимости город в стране и один из немногих промышленных центров Грифонстоуна. Расширяя его железные шахты и строя оружейные заводы, мы можем обеспечить местных птиц работой, а наши вооруженные силы – оружием, которого им остро не хватает."
BOI_coal_coalfall:0 "Уголь Коалфолла"
BOI_coal_coalfall_desc:0 "Город Коалфолл получил свое название благодаря своим обширным залежам угля. Расширение угольных шахт и строительство заводов в нём резко увеличит наши промышленные мощности."
BOI_gale_park:0 "Промышленный парк Гейла"
BOI_gale_park_desc:0 "Гейл может показаться маленьким и незначительным городом, но благодаря его близости к шахтам Ползучих гор, у него есть потенциал стать новым промышленным центром. Мы должны финансировать строительство заводов, которые будут перерабатывать сырье, поступающее с востока."
BOI_flame_industry:0 "Разжечь пламя промышленности"
BOI_flame_industry_desc:0 "Новые заводы строятся чуть-ли не ежедневно. Мы возвращаем Грифонстоуну былую славу!"
BOI_modern_age:0 "В современную эпоху"
BOI_modern_age_desc:0 "Мы, наконец, создали полноценную промышленность. Теперь нас по праву считают развитой нацией. Что ждёт нас дальше?"
#BOI_bright_flame:0 "Пламя горит ярко"
#BOI_bright_flame_desc:0 "Наш тяжелый труд – или, скорее, тяжелый труд наших рабочих – окупился. Грифонстоун теперь сияющий маяк промышленной эффективности – груды товаров производятся каждый день, и дальнейшее расширение скоро позволит нам соперничать с промышленными державами Грифонии."
BOI_great_archive:0 "Великий архив Грифонстоуна"
BOI_great_archive_desc:0 "Когда-то наши архивы славились по всей Грифонии, и хотя для нас они все ещё кажутся величественными, правда в том, что сегодня они лишь грустное напоминание о том, чем были когда-то. Так восстановим же их и станем научным центром континента!"
BOI_griffon_home:0 "Дом грифонов"
BOI_griffon_home_desc:0 "Мы вернули былую славу Грифонстоуна. Но почему бы не пойти дальше? Мы сделаем Грифонстоун одним из величайших городов Грифонии – городом бесконечных возможностей, городом невиданного процветания, городом, который будет желать весь мир!"
#BOI_fire_forged:0 "Кованый огнем"
#BOI_fire_forged_desc:0 "Нам нужно больше – больше оружия, больше танков, больше артиллерии, чтобы защитить себя от тех, кто завидует нашему процветанию. И мы получим их, и даже больше."
BOI_beyond_old_glory:0 "Превзойти былую славу"
BOI_beyond_old_glory_desc:0 "Прошли годы с тех пор, как мы начали восстанавливать Грифонстоун – это потребовало времени и усилий миллионов грифонов, но теперь мы больше не "Разрушенная Колыбель". Мы стали сильнее, чем когда-либо, и готовы к будущему! Да здравствует Грифонстоун!"
BOI_demolish_slums:0 "Снести трущобы"
BOI_demolish_slums_desc:0 "Многие дома Грифонстоуна – гниющие руины, целые районы напоминают трущобы. Необходимо заменить их современным качественным жильём."
BOI_expand_terrace:0 "Расширить террасное земледелие"
BOI_expand_terrace_desc:0 "Большая часть нашей нации занята горами. Хотя западные равнины всегда были нашим основным источником продовольствия, террасное земледелие практиковалось веками. Мы должны поддержать эту отрасль нашего сельского хозяйства, построив новые террасы и восстановив разрушенные."
BOI_promote_urban:0 "Стимулировать урбанизацию"
BOI_promote_urban_desc:0 "С быстрым расширением нашей промышленности возникла нехватка рабочей силы в городах. Переселим деревенских грифонов в города для работы на заводах!"
BOI_farm_mecha:0 "Механизация сельского хозяйства"
BOI_farm_mecha_desc:0 "Пора познакомить наших фермеров с трактором. Надеюсь, они не примут его за демона Маара!"
BOI_rebuild_griffonstone:0 "Восстановить Грифонстоун"
BOI_rebuild_griffonstone_desc:0 "Это заняло у нас много времени, но мы наконец приближаемся к завершению времен упадка. Теперь, когда в казне есть средства, мы можем начать масштабный проект восстановления нашей столицы и превращения ее из жалких руин в гордый город, которым она когда-то была."
BOI_mining_tech:0 "Улучшить технологии добычи"
BOI_mining_tech_desc:0 "Многие месторождения Грифонстоуна не разрабатываются – нужно научиться это делать."
BOI_lakeshore_oil:0 "Нефть озёрного побережья"
BOI_lakeshore_oil_desc:0 "Хотя в Центральной Грифонии нет обширных нефтяных месторождений, недавние исследования показали, что озеро Румейр может скрывать значительные запасы «черного золота». Строительство нефтяных скважин обеспечит нам стабильный поток столь необходимого топлива."
BOI_solarspike_mines:0 "Шахты Соларспайка"
BOI_solarspike_mines_desc:0 "Восточные горы славятся своими обширными природными ресурсами – некоторые из них мы уже используем. Дальнейшее расширение шахт поможет профинансировать наши восстановительные усилия, однако более набожные грифоны могут рассматривать добычу в непосредственной близости от Соларспайка как богохульство."
BOI_creeper_riches:0 "Богатства Ползучих Гор"
BOI_creeper_riches_desc:0 "Вернув восточные земли, можем расширить там добычу полезных ископаемых."
BOI_rumare_refinery:0 "Нефтеперерабатывающий завод Румейра"
BOI_rumare_refinery_desc:0 "Восстановление порядка в Румейре позволило нам хорошо разработать его нефтяные месторождения. Более того, теперь, когда нефтяные месторождения в Румейре полностью находятся на нашей территории, мы можем начать создавать настоящую нефтяную промышленность для Грифонстоуна."
BOI_mine_chamber:0 "Горная палата"
BOI_mine_chamber_desc:0 "Централизованный контроль над добычей повысит её эффективность. Богатства нашей земли приведут нас к величию!"
#Gallus-1
BOI_legacy_of_guto:0 "Наследие Гуто"
BOI_legacy_of_guto_desc:0 "Грифонстоун процветал при династии Гуто. Их законный наследник оправдает своё благородное происхождение и вернёт золотой век!"
BOI_land_reform:0 "Земельная реформа"
BOI_land_reform_desc:0 "Пережитки феодализма сковывают нацию. Пора отменить последние законы о крепостном праве и наделить крестьян землёй. Чтобы избежать волнений, дворяне получат компенсацию, хотя это и ударит по казне."
BOI_reorganise_council:0 "Реорганизация Совета"
BOI_reorganise_council_desc:0 "Арест Голдстоуна - идеальный повод для давно необходимой "чистки" в совете. С помощью шантажа и связей мы усилим власть канцлера."
BOI_confiscate_traitor:0 "Конфисковать имущество предателя"
BOI_confiscate_traitor_desc:0 "Предатель Голдстоун был богатейшим грифоном королевства. Теперь его богатства послужат нации, и никто не будет возражать! О, Борей, почему мы не сделали этого раньше?"
BOI_establish_village_schools:0 "Создать сельские школы"
BOI_establish_village_schools_desc:0 "Чтобы победить неграмотность, нужно охватить глубинку, где доступ к образованию ограничен. Чтобы посещать школу, молодым грифонам часто приходится преодолевать многие мили, что мешает им получить надлежащее образование. Создание сельских школ должно помочь."
BOI_no_one_left_behind:0 "Никто не останется позади"
BOI_no_one_left_behind_desc:0 "После десятилетий упадка в Грифонстоуне проживает очень много бедных, обнищавших грифонов. Многие потеряли всякую надежду или слишком ослабли, чтобы изменить свою жизнь. Наш долг - помочь им!"
BOI_enemies_on_all_sides:0 "Враги со всех сторон"
BOI_enemies_on_all_sides_desc:0 "Как старый ослабленный олень среди волков, Грифонстоун окружён могущественными врагами. Война неизбежна – мы должны действовать первыми!"
BOI_cradle_of_griffonkind:0 "Колыбель Грифоньего рода"
BOI_cradle_of_griffonkind_desc:0 "Прекрасные острова Румейра – неотъемлемая часть Грифонстоуна, которую мы обязаны вернуть."
BOI_avenge_922:0 "Отомстить за 992 Год"
BOI_avenge_922_desc:0 "После того как граф-предатель Блюкрест из Блэкхоллоу поднял мятеж, принц Гуто VII повёл армию в тщетной попытке вернуть мятежную провинцию. Он погиб, и нам пришлось оставить наши восточные земли. Пришло время двинуться на восток, чтобы отомстить за это поражение."
BOI_secure_verenia:0 "Укрепить Верению"
BOI_secure_verenia_desc:0 "Герцогство Верения стало ареной кровавой междоусобной войны. Мы обязаны навести там порядок. Так мы спасём местных жителей от бессмысленной бойни и обезопасим границу с Империей."
BOI_enemy_at_the_gates:0 "Враг у ворот"
BOI_enemy_at_the_gates_desc:0 "После переворота власть в Арантиге перешла к воинственному барону Доротеосу Фезерину, который не скрывает своих намерений завоевать Грифонстоун. Уничтожение этого безумца жизненно необходимо!"
BOI_integrate_rumare:0 "Интегрировать Румейр"
BOI_integrate_rumare_desc:0 "Пришло время наладить управление островами, окончательно включив их в состав Грифонстоуна."
BOI_minorities_protection_act:0 "Акт о защите меньшинств"
BOI_minorities_protection_act_desc:0 "Грифонстоун населён грифонами многих культур. Чтобы обеспечить мир и развитие, мы должны позволить всем сохранять свои традиции."
BOI_rebuild_murkbeak:0 "Восстановить Муркбик"
BOI_rebuild_murkbeak_desc:0 "Город Муркбик – центр Блэкхоллоу. Инвестиции в его развитие покажут нашу доброжелательность местным грифонам и помогут навести там порядок после десятилетий бандитского произвола."
BOI_integrate_verenia:0 "Интегрировать Верению"
BOI_integrate_verenia_desc:0 "Мы устраним непокорных веренийских дворян и установим полный контроль над регионом."
BOI_pacify_arantiga:0 "Умиротворить Арантигу"
BOI_pacify_arantiga_desc:0 "Несмотря на культурные различия и гордость местных грифонов, мы установим администрацию в новых землях, таким образом сведя сопротивление к минимуму."
BOI_look_towards_karthin:0 "Предложение Карфину"
BOI_look_towards_karthin_desc:0 "Аннексия Арантиги неминуемо приведёт к конфликту с Вингбардией. Может быть, лучше отдать им эти земли ради обеспечения длительного мира?"
BOI_abyss_awaits:0 "Бездна ждёт..."
BOI_abyss_awaits_desc:0 "То, что было утрачено, должно быть возвращено. Наконец, Галлус докажет, что достоин быть королём... Или погибнет."
#Gallus-2
BOI_coronation:0 "Коронация"
BOI_coronation_desc:0 "Наступает новая эра для Грифонстоуна. Вернув Идол Борея, Галлус может официально взойти на трон.\nДа здравствует король Галлус Первый!"
BOI_reestablish_royal_guard:0 "Восстановить Королевскую гвардию"
BOI_reestablish_royal_guard_desc:0 "Во время нападения циклопа Аримаспи Королевская гвардия была уничтожена, выжили лишь немногие из её рыцарей. Вскоре после этого, формирование было распущено. Недавняя коронация Галлуса сделала возможным восстановление Королевской гвардии."
BOI_appoint_prime_minister:0 "Назначить Премьер-министра"
BOI_appoint_prime_minister_desc:0 "В качестве первого шага реформы правительства мы назначим Гильду, лидера демократического движения, нашим новым премьер-министром."
BOI_griffonstone_cmc:0 "Грифонстоунские Искатели знаков отличия"
BOI_griffonstone_cmc_desc:0 ""Искатели знаков отличия" — это эквестрийская молодёжная организация, призванная помочь юным пони обрести своё предназначение в жизни. Грифонша Гэбби давно пыталась создать подобную организацию в Грифонии. Нам необходимо поддержать её."
BOI_expand_social_welfare:0 "Расширить социальную поддержку"
BOI_expand_social_welfare_desc:0 "Важный элемент новой королевской политики Грифонстоуна — забота о простом народе. Наши нынешние программы социальной поддержки будут расширены, чтобы гарантировать, что ни один грифон не останется без помощи."
BOI_rally_the_griffons:0 "Сплотить грифонов"
BOI_rally_the_griffons_desc:0 "Хотя мы уже победили многих наших врагов, нет сомнений, что наше процветание и новости о возвращении Идола привлекут тех, кто желает завоевать всю Грифонию. К счастью, добровольцы со всей страны и даже континента стекаются в нашу армию."
BOI_constitutional_monarchy:0 "Ограниченная монархия"
BOI_constitutional_monarchy_desc:0 "Прошли времена деспотизма, когда короли правили по своему усмотрению. Времена меняются, и монархия тоже должна измениться. При содействии премьер-министра будет разработана новая конституция. Власть короля будет ограничена демократически избранным парламентом."
BOI_griffonstone_school_of_friendship:0 "Грифонстоунская школа дружбы"
BOI_griffonstone_school_of_friendship_desc:0 "Галлус с теплотой вспоминает время, проведённое в Школе Дружбы в Понивилле. Она помогла сформировать его личность. Наверняка и многие другие жители Грифонии смогут получить пользу от такого образования. Галлус решил основать Грифонстоунскую Школу Дружбы."
BOI_war_of_unification:0 "Война за объединение"
BOI_war_of_unification_desc:0 "Герцланд — неспокойная земля, где амбициозные военачальники, дворяне и просто безумные грифоны сражаются за труп старой Империи. Кто бы ни победил, он будет представлять серьёзную угрозу для Грифонстоуна. Чтобы защитить нашу нацию, мы должны нанести удар первыми и объединить грифонов Герцланда и Грифонстоуна под одним знаменем."
BOI_look_west:0 "Взгляд на Запад"
BOI_look_west_desc:0 "Великий город Скайфолл, "Врата в Грифонию", является ключом к безопасности нашей торговли и процветанию Герцланда. Наш долг — освободить его и принести мир и гармонию его жителям."
BOI_the_last_emperor:0 "Последний Император"
BOI_the_last_emperor_desc:0 "Гровер Шестой, птенец-император, был всего лишь пешкой в когтях могущественных грифонов, готовых использовать его в своих целях. Однако теперь, с нашим освобождением Герцланда, их интриги наконец подошли к концу..."
BOI_commemoration:0 "Память"
BOI_commemoration_desc:0 "Безумный переворот Донкло не только разрушил то, что осталось от Империи Грифонов, но и привёл к гибели совсем юного Гровера Шестого. После взятия Имперской Столицы армиями Грифонстоуна, настало время должным образом похоронить птенца-императора и обдумать наши дальнейшие действия."
BOI_bring_order_to_herzland:0 "Навести порядок в Герцланде"
BOI_bring_order_to_herzland_desc:0 "Мы не просто завоеватели — мы пришли, чтобы восстановить надлежащий порядок в Имперских Землях, обеспечить герцландцам возможность стать полноправными гражданами нашего королевства и насладиться их вновь обретённой свободой и совместным процветанием."
BOI_abolish_noble_privileges:0 "Отменить привилегии дворян"
BOI_abolish_noble_privileges_desc:0 "Герцландское дворянство не принимает короля Галлуса и продолжает сопротивляться нашей власти. Введение нового свода законов, отмена их несправедливых привилегий, распространение нашей земельной реформы на Герцланд и запрет всех наследственных должностей позволит нам ликвидировать их власть."
BOI_common_hope:0 "Общий дом"
BOI_common_hope_desc:0 "Завоевание Герцланда сделало Грифонстоуном общим домом для многих разных существ: грифонов, алмазных псов и даже пони и чейнджлингов... Обеспечить мирное сожительство будет нелегко, но мы должны сделать всё возможное."
BOI_integrate_skyfall:0 "Интегрировать Скайфол"
BOI_integrate_skyfall_desc:0 "Устранив олигархов и установив местное демократическое управление, мы сможем должным образом интегрировать Скайфол в наше растущее королевство."
BOI_new_diarchy:0 "Новая диархия"
BOI_new_diarchy_desc:0 "Давным-давно император Гровер Второй доверил королю Гуто хранить Идол Борея. С того дня короли Грифонстоуна были самыми верными вассалами Империи. Сегодня линии Гуто и Гровера вновь будут работать вместе ради светлого будущего в новом королевстве!"
BOI_proclaim_new_kingdom:0 "Рождение нового королевства"
BOI_proclaim_new_kingdom_desc:0 "Теперь мы контролируем не только Грифонстоун, и хотя герцландцы имеют много общего с грифонами нашей родины, они и многие другие представляют собой уникальные этносы, поэтому мы должны стремиться представлять все группы в нашем королевстве — не только в парламенте, но и в символике нового королевства."
BOI_reform_the_archonates:0 "Реформировать архонства"
BOI_reform_the_archonates_desc:0 "Долгое время архонты могли влиять на политику, приумножая собственную власть и богатство. Пора лишить архонтов их способности влиять на светские власти и обеспечить, чтобы они делали то, для чего предназначены — заботились о душах грифонов и несли весть о надежде и мире."
BOI_barkingian_guard:0 "Восстановить Баркгинианскую Гвардию"
BOI_barkingian_guard_desc:0 "Гвардия алмазных псов при императорах Грифонии славилась своей свирепостью в бою и абсолютной преданностью своему государю. Возможно, мы могли бы восстановить это формирование — в конце концов, Галлус тоже является потомком Гровера Второго..."
BOI_align_with_equestria:0 "Сблизиться с Эквестрией"
BOI_align_with_equestria_desc:0 "Эквестрия — это сияющий маяк гармонии в мире. Чтобы восстановить и преобразовать Грифонию, было бы хорошей идеей более тесно сотрудничать с пони."
BOI_great_union:0 "Великий союз"
BOI_great_union_desc:0 "Для обеспечения мира в Грифонии крайне важно установить мирные отношения между её многочисленными государствами. Будем надеяться, что через сотрудничество мы обеспечим новый золотой век для континента. Конечно, есть некоторые проблемные нации, угрожающие менее развитым... С ними необходимо разобраться."
BOI_equestria_has_fallen:0 "Эквестрия пала"
BOI_equestria_has_fallen_desc:0 "Произошло немыслимое — армии чейнджлингов под предводительством королевы Кризалис одержали победу в Эквестрии. Они завоевали Родину Пони. Над Эквусом опускается долгая ночь..." #\nHello, Gallus. Hello, Gallus, It's Starlight Glimmer. \nI need five billion griffons To kill Changeling occupiers"
BOI_student_exchange:0 "Студенческий обмен"
BOI_student_exchange_desc:0 "Научные институты Эквестрии одни из лучших в мире! Создав программу обмена студентами, мы сможем воспользоваться достижениями пони и распространить идеи дружбы и гармонии по всей нашей стране и континенту."
BOI_trade_deal_with_equestria:0 "Торговое соглашение с Эквестрией"
BOI_trade_deal_with_equestria_desc:0 "Эквестрия — одно из крупнейших государств мира с самой развитой экономикой и обширным разнообразным рынком. Снизив пошлины и поддержав торговлю, мы можем способствовать процветанию как Грифонстоуна, так и Эквестрии..."
BOI_invite_ponies:0 "Пригласить пони"
BOI_invite_ponies_desc:0 "Шла активная эквестрийская иммиграция в течение последних столетий, что создало крупную диаспору пони в Герцланде. Мы можем пригласить больше пони-поселенцев."
BOI_open_border_area:0 "Зона открытых границ"
BOI_open_border_area_desc:0 "Ограничив пошлины и открыв границы для торговли и путешествий, мы укрепим сотрудничество между членами Союза и будем продвигать ценности гармонии."
BOI_research_coop:0 "Научное сотрудничество"
BOI_research_coop_desc:0 "Мы больше не будем ревниво скрывать результаты наших исследований — вместо этого мы будем сотрудничать с другими членами Союза, чтобы повысить исследовательские возможности наших партнёров."
BOI_support_the_resistance:0 "Поддержать сопротивление"
BOI_support_the_resistance_desc:0 "Несмотря на то, что чейнджлинги оккупировали эквестрийские земли, бесчисленные пони, сражающиеся за свободу своей родины, всё ещё существуют. Мы будем снабжать эквестрийское сопротивление оружием, разведданными и предоставим им безопасные базы на нашей территории."
BOI_refugee_haven:0 "Пристанище для беженцев"
BOI_refugee_haven_desc:0 "Гнёт чейнджлингов вынудил многих пони покинуть Эквестрию — мы интегрируем тех беженцев, которые пожелают остаться в нашей стране, и предоставим убежище тем, кто покинул свою оккупированную родину, чтобы вернуться в будущем."
BOI_harbour_equestrian_elites:0 "Принять элиту Эквестрии"
BOI_harbour_equestrian_elites_desc:0 "После падения Эквестрии многие её лидеры, как политические, так и военные, покинули страну, чтобы избежать преследования. Эти пони теперь бесцельно странствуют по миру. Возможно, мы можем пригласить их в Грифонию, чтобы они поделились с нами своим опытом и знаниями."
BOI_friendship_forever:0 "Во имя гармонии"
BOI_friendship_forever_desc:0 "Пришло время предложить Эквестрии нашу полную поддержку — вместе мы обеспечим гармонию на обоих континентах и победим всех, кто угрожает миру и процветанию наших рас!"
BOI_peace_in_our_times:0 "Мир в наше время"
BOI_peace_in_our_times_desc:0 "Впереди ждёт долгий путь, но, будем надеяться, что благодаря сотрудничеству в рамках Союза мы обеспечим прочный мир в Грифонии. И защитим её от тех, кто желает ввергнуть континент в новую эпоху тирании и хаоса!" #\n\nО Эйр, пусть же вечно процветает грифонья раса на твоих прекрасных землях!
BOI_support_war_of_liberation:0 "Поддержать войну за освобождение"
BOI_support_war_of_liberation_desc:0 "Эквестрия снова жива! Эквестрийский Освободительный Фронт восстал против угнетателей-чейнджлингов! Мы предоставим пони все виды снаряжения и припасов, которые им необходимы. Большое число пони-беженцев и грифонов-добровольцев также желают присоединиться к борьбе." #\n\nЗа Гармонию! За половые отношения пони и грифонов!
#Gilda
BOI_age_of_commongriff:0 "Эпоха простого грифона"
BOI_age_of_commongriff_desc:0 "С неожиданной отставкой "Дедушки" Граффа, Гильде предстоит вести Грифонстоун в будущее."
BOI_revoke_nobility_privileges:0 "Отменить дворянские привилегии"
BOI_revoke_nobility_privileges_desc:0 "Десятилетиями дворяне Грифонстоуна, как кровососущие комары, ослабляли страну. Теперь, хотя их влияние слабеет, они всё ещё тормозят наши реформы. Мы должны обуздать их влияние, и сделать это быстро!"
BOI_provisional_government:0 "Временное правительство"
BOI_provisional_government_desc:0 "Теперь, когда Регентский Совет упразднён, нам необходимо организовать надлежащие правительственные институты, способные управлять Грифонстоуном. Только с эффективной администрацией мы можем надеяться на преобразование нашей болеющей нации."
BOI_social_welfare:0 "Создать социальную поддержку"
BOI_social_welfare_desc:0 "Есть немало грифонстоунцев, которые едва сводят концы с концами, живя без надежды на лучшее будущее — сироты, калеки и многие другие. Создав надлежащую социальную поддержку, мы сможем помочь этим бедным грифонам."
BOI_affranchisement_peasants:0 "Освобождение крестьян"
BOI_affranchisement_peasants_desc:0 "Крестьяне Грифонстоуна в основном всё ещё крепостные. Подчинённые своим господам, они обрабатывают дворянские земли. Заключительным актом слома власти дворянства станет отказ от последних пережитков феодализма путём передачи крестьянам земли, которую они обрабатывают."
BOI_break_resistance:0 "Сломить дворянское сопротивление"
BOI_break_resistance_desc:0 "С нас хватит. Пора положить конец дворянскому правлению в Грифонстоуне. Возможно, с некоторыми мы сможем договориться мирно, но чтобы подавить остальных, нам придётся прибегнуть к суровым мерам."
BOI_restore_our_pride:0 "Вернуть нашу гордость"
BOI_restore_our_pride_desc:0 "Грифонстоунцы напоминают стаю бешеных псов: недоверчивые и эгоистичные, они дерутся между собой за объедки. Потеря Идола была ключевой причиной этого, поэтому нам нужно изменить свой образ мышления — перестать гордиться куском золота, а начать гордиться своей нацией."
BOI_educate_griffons:0 "Образовывать грифонов"
BOI_educate_griffons_desc:0 "Образованный грифон — это политически сознательный грифон! Масштабные усилия по борьбе с неграмотностью должны стать одной из ключевых политик нашего нового республиканского правительства."
BOI_support_village_cooperatives:0 "Поддержать сельские кооперативы"
BOI_support_village_cooperatives_desc:0 "Поддерживая добровольные рабочие кооперативы, мы сможем как распространить национальное самосознание среди наших крестьян, так и ускорить модернизацию в сельской местности."
BOI_new_republic_rises:0 "Восхождение новой республики"
BOI_new_republic_rises_desc:0 "Благодаря недавним реформам мы избавились от врагов республиканской мечты в Грифонстоуне и решили по крайней мере некоторые из самых насущных проблем страны. Однако мы не можем продолжать как де-факто диктатура, даже если действуем во благо грифонов. Пришло время для настоящих выборов и полного превращения в республику."
BOI_republican_propaganda:0 "Республиканская пропаганда"
BOI_republican_propaganda_desc:0 "Радио и газеты — идеальные инструменты для распространения республиканских идей среди населения. Мы должны эффективно использовать средства массовой информации, чтобы наши грифоны знали, за что мы боремся."
BOI_protect_our_freedom:0 "Защитить нашу свободу"
BOI_protect_our_freedom_desc:0 "Грифония полна деспотов и империалистов, планирующих завоевать континент. Мы всего лишь хотим жить в мире, но мы должны быть готовы защитить нашу свободу любой ценой."
BOI_natural_borders:0 "Естественные границы"
BOI_natural_borders_desc:0 "После почти полного краха королевство Грифонстоун потеряло многие отдалённые регионы. Нам предстоит вернуть эти земли и освободить их грифонов."
BOI_strengthen_government:0 "Укрепить правительство"
BOI_strengthen_government_desc:0 "Пришло время реформировать наше правительство — избавиться от старых полуграмотных чиновников и выживших из ума политиков, оторванных от реальности, и заменить их современными бюрократами."
BOI_look_towards_equestria:0 "Взглянуть в сторону Эквестрии"
BOI_look_towards_equestria_desc:0 "Далекая земля Эквестрия — сияющий маяк гармонии и прогресса. Хотя мы слишком далеки, чтобы полностью сблизиться с ними, возможно, какое-то сотрудничество осуществимо."
BOI_declare_neutrality:0 "Выбор внешней политики"
BOI_declare_neutrality_desc:0 "Из-за нашего шаткого положения лишь вопрос времени, когда нас втянут в какой-нибудь конфликт. Мы больше не можем просто сидеть и ждать, пока это произойдет, нам нужно занять активную позицию по внешней политике."
BOI_eastern_expedition:0 "Восточная Экспедиция"
BOI_eastern_expedition_desc:0 "Мятеж графа Блюкреста привел к отчуждению Блэкхоллоу. Теперь эта проклятая земля кишит бандитами, революционерами и реакционерами. Нам нужно навести порядок в этом хаосе."
BOI_fortress_griffonstone:0 "Крепость Грифонстоун"
BOI_fortress_griffonstone_desc:0 "У нас слишком много врагов и слишком мало грифонов. Поэтому для нас крайне важно как следует подготовиться к возможному нападению, укрепившись. Эй ты! Лопату в когти, и копай траншеи!"
BOI_cradle_of_griffonkind_gilda:0 "Колыбель Грифоньего рода"
BOI_cradle_of_griffonkind_gilda_desc:0 "Идиллический архипелаг Румэйр — неотъемлемая часть Грифонстоуна, которую мы должны вернуть."
BOI_griffonstone_cmc_gilda:0 "Грифонстоунские Искатели знаков отличия"
BOI_griffonstone_cmc_gilda_desc:0 ""Искатели знаков отличия" — это эквестрийская молодёжная организация, призванная помочь юным пони обрести своё предназначение в жизни. Грифонша Гэбби давно пыталась создать подобную организацию в Грифонстоуне. Это достойное поддержки начинание."
BOI_free_minds:0 "Свободные умы"
BOI_free_minds_desc:0 "Мы можем сделать Грифонстоун безопасным убежищем для интеллектуалов Грифонии — здесь они смогут жить в мире и, конечно же, работать на нас."
BOI_rebuild_murkbeak_gilda:0 "Восстановить Муркбик"
BOI_rebuild_murkbeak_gilda_desc:0 "Муркбик — самый населённый город во всём Блэкхоллоу. Инвестиции в его развитие станут как знаком доброй воли, так и способом восстановить порядок на наших возвращённых восточных землях."
BOI_evi_line:0 "Линия Эви"
BOI_evi_line_desc:0 "Долина Эви — земля множества шовинистических государств. Мы не хотим иметь дела с их проблемами, но есть вероятность, что эти проблемы приведут их к нам. Нам следует подготовить к этому восточные границы."
BOI_minorities_protection_act_gilda:0 "Акт о защите меньшинств"
BOI_minorities_protection_act_gilda_desc:0 "Грифонстоун населён грифонами многих культур и языков. Чтобы обеспечить мирное сосуществование, мы должны позволить всем им практиковать и развивать свои народные традиции."
BOI_integrate_rumare_gilda:0 "Интегрировать Румейр"
BOI_integrate_rumare_gilda_desc:0 "Теперь, когда мы контролируем Румейр, настало время установить там надлежащую администрацию, чтобы раз и навсегда интегрировать остров в Грифонстоун."
BOI_new_griffonstonian_identity:0 "Новая грифонстоунская идентичность"
BOI_new_griffonstonian_identity_desc:0 "Прошли времена, когда нас определял кусок золота. Мы создали новые узы дружбы и единства. Нам удалось залечить старые раны и восстановить нашу нацию. Грифонстоунцы вновь гордый народ. Будущее для нас светлое!"
BOI_new_direction:0 "Новый курс"
BOI_new_direction_desc:0 "Это конец начала для нашей молодой республики. С новым президентом во главе настало время перемен."
BOI_president_greta:0 "Президент Грета"
BOI_president_greta_desc:0 "Президент Грета обещает сохранить прежний курс нашей политики с особым акцентом на социальные реформы."
BOI_president_gabby:0 "Президент Гэбби"
BOI_president_gabby_desc:0 "Чересчур впечатлительная, но полностью преданная идеалам гармонии, грифонша Габби — радикальная и активная республиканка."
BOI_president_garner:0 "Президент Гарнер"
BOI_president_garner_desc:0 "Деловой грифон благородного происхождения, Гарнер обещает либерализовать экономику и тщательно реформировать правительство, чтобы привести его в соответствие с более традиционной политической философией."
BOI_expand_social_programs:0 "Расширить социальные программы"
BOI_expand_social_programs_desc:0 "Дальнейшее расширение нашей социальной поддержки гарантирует, что ни один грифон не останется жить в нищете."
BOI_welcome_refugees:0 "Принять беженцев"
BOI_welcome_refugees_desc:0 "Мы наслаждаемся свободой и процветанием, но многие граждане других стран Грифонии страдают. Мы должны помочь всем, кто приходит к нам в час нужды."
BOI_expand_cmc:0 "Расширить ИЗО"
BOI_expand_cmc_desc:0 "Гэбби, основательница "Искателей знаков отличия" в Грифонстоуне, решила обеспечить им значительную государственную поддержку, чтобы сделать организацию по-настоящему популярной и дальше распространять идеалы дружбы и гармонии среди нашего народа."
BOI_interventionism:0 "Интервенционизм"
BOI_interventionism_desc:0 "В мире существует ряд конфликтов, в которых угнетённые борются против тиранов и деспотов. Мы должны помогать этим борцам за свободу всеми возможными способами."
BOI_laissez_faire:0 "Либерализация экономики"
BOI_laissez_faire_desc:0 "Раздутые социальные программы и чрезмерное вмешательство правительства угрожают замедлить наш экономический рост. Новая политика ограничит влияние государства на рынок."
BOI_support_three_temples:0 "Поддержать Троицу"
BOI_support_three_temples_desc:0 "Долгое время наши старые традиции были в забвении. Мы должны возродить нашу старую роль религиозной и культурной столицы всего континента."
BOI_dream_defied:0 "Мечта мертва"
BOI_dream_defied_desc:0 "Хотя мы никогда этого не хотели, мы теперь контролируем весь Герцланд... Нам придётся реорганизовать нашу правительственную структуру, чтобы эффективно управлять такой обширной территорией. Пангрифонская мечта умерла — и мы стали её могильщиками."
BOI_great_trial:0 "Испытание духа"
BOI_great_trial_desc:0 "Было лишь вопросом времени, когда тираны и безумцы с севера придут и попытаются лишить нас свободы. Это наш звёздный час, наш последний рубеж — и он станет либо нашим величайшим триумфом, либо окончательной гибелью."
BOI_join_upe:0 "Союз с Эквестрией"
BOI_join_upe_desc:0 "Следует укрепить наши отношения с Эквестрией и присоединиться к нашим друзьям-пони. Вместе мы победим любого врага, который посмеет нарушить мир на Эквусе и в Грифонии!"
BOI_herzlandism:0 "Герцландизм"
BOI_herzlandism_desc:0 "Грифонстоунцы имеют много общего с грифонами Герцланда. Имея контроль над обеими областями, мы можем попытаться повысить нашу легитимность, открыто заявив о нашем стремлении объединить всех герцландских грифонов в одном государстве."
#Gestal
BOI_loyalty_reward:0 "Верность не требует вознаграждения"
BOI_loyalty_reward_desc:0 "Под управлением лорда Гестала Грифонстоун сохранит верность своей имперской присяге и старым традициям."
BOI_shake_claws_prelate:0 "Пожать лапу Прелату"
BOI_shake_claws_prelate_desc:0 "Грифонстоун всегда был религиозным центром Грифонии. Даже сейчас его прелат сохраняет значительное влияние на город. Поэтому нам будет выгодно сотрудничать с ним и Тремя Храмами."
BOI_grm_problem:0 "Проблема ГРД"
BOI_grm_problem_desc:0 "Грифонстоунское республиканское движение открыто выступает за радикальные реформы и дестабилизирует нацию. Если мы хотим установить твёрдый контроль над страной, крайне важно разобраться с ними тем или иным способом."
BOI_opportunists:0 "Оппортунисты"
BOI_opportunists_desc:0 "Голдстоун побеждён, но ряд его бывших союзников остался. Хотя им не удалось победить нас, они отказываются сдаваться и продолжают создавать проблемы. Крайне важно разобраться с ними как можно скорее."
BOI_confiscate_traitor_gestal:0 "Конфисковать имущество предателя"
BOI_confiscate_traitor_gestal_desc:0 "Предатель Голдстоун был самым богатым грифоном в королевстве. Теперь мы можем использовать накопленное им богатство на благо нации, и никто не будет против! Почему мы не сделали это раньше?"
BOI_noble_ties:0 "Дворянские связи"
BOI_noble_ties_desc:0 "Старые традиции позволяют местным дворянам продолжать управлять своими землями даже после завоевания региона. Используя наши связи с грифонским дворянством, мы сможем гораздо легче стабилизировать другие области континента, когда придёт время отвоевать их во имя Империи."
BOI_end_serfdom:0 "Отменить крепостное право"
BOI_end_serfdom_desc:0 "Крепостное право — устаревший институт, наносящий серьёзный вред нашей экономике и стабильности, делая нас чрезмерно зависимыми от сельского хозяйства, препятствуя технологическому прогрессу и вызывая беспорядки, которые могут перерасти в восстание. Некоторым нашим соотечественникам это может не понравиться, но чтобы предотвратить революцию, нам нужно покончить с крепостным правом."
BOI_reform_regency_gestal:0 "Реформировать Регентский Совет"
BOI_reform_regency_gestal_desc:0 "Чтобы установить стабильное и эффективное правительство, нам необходимо собрать новый Регентский Совет – Гестал, как новый канцлер, будет обладать гораздо большей властью, чем Графф, а сам совет, теперь состоящий из верных грифонов, будет иметь гораздо меньше возможностей для саботажа работы правительства."
BOI_faithful_ruler:0 "Правоверный господин"
BOI_faithful_ruler_desc:0 "Грифонстоун когда-то называли Домом Богов – мы должны принять это наследие. Мы будем поддерживать Три Храма и позаботимся о том, чтобы они играли важную роль в нашем реформированном правительстве. Благочестивый грифон — верный грифон!"
BOI_expand_rgdf:0 "Расширить КСОГ"
BOI_expand_rgdf_desc:0 "Врагов Империи множество. Если мы хотим поддержать имперское дело, нам необходимо стремительно расширить нашу армию."
BOI_look_outside:0 "Взгляд вовне"
BOI_look_outside_desc:0 "Теперь, когда самые насущные проблемы нашей нации решены, мы можем заняться внешними проблемами. Обеспечение безопасности наших границ станет первым шагом к восстановлению Империи."
BOI_royal_corporations:0 "Королевские корпорации"
BOI_royal_corporations_desc:0 "Поддерживая избранные компании, мы сможем стимулировать наш промышленный рост и увеличить производственные мощности Грифонстоуна."
BOI_compassionate_ruler:0 "Милосердный господин"
BOI_compassionate_ruler_desc:0 "Простой народ Грифонстоуна страдал слишком долго. Каждый добрый правитель должен заботиться о своих подданных, и мы не откажемся от этой обязанности."
BOI_reinforce_central:0 "Укрепить центральную власть"
BOI_reinforce_central_desc:0 "Одной из причин бедственного положения Грифонстоуна и политического тупика, с которым мы столкнулись, была изнурительная слабость нашего правительства. Централизовав и реформировав нашу бюрократию, мы избежим подобных проблем в будущем."
BOI_local_democracies:0 "Новая провинциальная система"
BOI_local_democracies_desc:0 "До сих пор Грифонстоун был собранием дворянских феодов, часто действовавших вопреки приказам Регентского Совета. Однако такой децентрализованный способ управления имеет свои достоинства. Чтобы сохранить лучшее из него, мы создадим надлежащую систему провинций, лучше отражающую территориальное деление Грифонстоуна, и поставим во главе их местных, но верных нам грифонов."
BOI_avenge_922_gestal:0 "Отомстить за 992 Год"
BOI_avenge_922_gestal_desc:0 "После того как граф-предатель Блюкрест из Блэкхоллоу поднял мятеж, принц Гуто VII повёл армию в тщетной попытке вернуть мятежную провинцию. Он погиб, и нам пришлось оставить наши восточные земли. Пришло время двинуться на восток, чтобы отомстить за это поражение."
BOI_cradle_of_griffonkind_gestal:0 "Колыбель Грифоньего рода"
BOI_cradle_of_griffonkind_gestal_desc:0 "Прекрасный остров Румейр — неотъемлемая часть Грифонстоуна, которую мы должны вернуть."
BOI_end_verenian_squabble:0 "Положить конец веренийским распрям"
BOI_end_verenian_squabble_desc:0 "После революции герцогство Верения погрузилось в гражданскую войну между дальними родственниками некогда правящей семьи. Мы принесём имперский мир на эту землю раздоров."
BOI_educate_commoners:0 "Дать образование простым грифонам"
BOI_educate_commoners_desc:0 "Позорно, что мы так долго не могли обеспечить самое базовое образование для наших подданых. Пора это изменить."
BOI_support_charity:0 "Поддержать благотворительность"
BOI_support_charity_desc:0 "Грифонстоун — жалкое место, погрязшее в нищете и преступности. Без помощи многие его граждане никогда не смогут жить достойной жизнью, и наша обязанность — предоставить им такую помощь."
BOI_rebuild_murkbeak_gestal:0 "Восстановить Муркбик"
BOI_rebuild_murkbeak_gestal_desc:0 "Муркбик — самый населённый город во всём Блэкхоллоу. Инвестиции в его развитие станут как знаком доброй воли, так и способом восстановить порядок на наших возвращённых восточных землях."
BOI_discipline_verenian_nobles:0 "Усмирить веренийское дворянство"
BOI_discipline_verenian_nobles_desc:0 "Пришло время внести подобие нормальности на эту проклятую богами землю. Влияние вечно интригующего и спорящего веренийского дворянства будет обуздано, а те, кто предал Империю, будут заменены более подходящими и верными грифонами."
BOI_rumare_act:0 "Румейрский акт"
BOI_rumare_act_desc:0 "Румейрцы составляют значительное меньшинство в нашей нации, однако на протяжении поколений они подвергались ассимиляции с подачи государства. В ответ мы получили враждебность и постоянные беспорядки. Возможно, настало время исправить ужасную политику прошлого и обеспечить равные права для румейрцев – таким образом мы сможем наконец принести мир в наши западные земли."
BOI_our_duty:0 "Наш долг"
BOI_our_duty_desc:0 "Это Грифонстоун, земля, где берёт начало династия Гроверов. Двести лет мы были самыми верными подданными Империи Грифонов, и теперь, когда Империя ослабла как никогда, долг по разгрому её врагов, как внутренних, так и внешних, ложится в наши когти."
BOI_loyalty_to_the_crown:0 "Верность короне"
BOI_loyalty_to_the_crown_desc:0 "Почётному имперскому регенту удалось стабилизировать ситуацию в сердце Империи. Пришло время нам присоединиться к его праведному делу. Мы немедленно отправим посланника в Грифенхейм и предложим нашу поддержку."
BOI_to_save_the_empire:0 "Спасение Империи"
BOI_to_save_the_empire_desc:0 "Произошло невообразимое! Империя пала! На нас лежит обязанность двинуться на север, отвоевать Грифенхейм и восстановить имперскую власть в Герцланде."
BOI_claim_regency:0 "Заявить право на регентство"
BOI_claim_regency_desc:0 "Грифенхейм в наших когтях, и теперь лорду Гесталу предстоит обеспечить безопасность Империи и её правителя – императора Гровера VI."
BOI_rightful_heiress:0 "Законная наследница"
BOI_rightful_heiress_desc:0 "Жестокое убийство юного Императора знаменует конец рода Гроверов. Следующей в очереди на имперскую корону является герцогиня Клубники Габриэлла Иглкло. Чтобы обеспечить стабильность Империи, её необходимо короновать императрицей."
BOI_integrate_herzland:0 "Интегрировать Герцланд"
BOI_integrate_herzland_desc:0 "Герцланд долгое время страдал от боевиков, эгоистичных дворян и революционеров. Нам предстоит восстановить имперское правление в регионе и гарантировать, что все следы сопротивления будут уничтожены."
BOI_attack_skyfall:0 "Захватить Скайфол"
BOI_attack_skyfall_desc:0 "Великий город Скайфол по праву называют Вратами в Грифонию, так как это самый крупный и оживлённый порт на континенте. Чтобы укрепить наше правление над Герцландом, мы должны вернуть его."
BOI_heal_the_souls:0 "Исцелить наши души"
BOI_heal_the_souls_desc:0 "Потеря Идола Борея нанесла невообразимый урон Грифонстоуну, Империи и Грифонии в целом. Возможно, нам никогда не удастся вернуть мандат богов, но теперь, в нашей борьбе за восстановление Империи, мы обрели нечто иное, нечто большее, во что можно верить – мечту о единой Грифонии."
#Gestal-Reclamation
BOI_imperial_reclamation:0 "Имперская Реконкиста"
BOI_imperial_reclamation_desc:0 "Наша работа только начинается. Как стервятники, враги Империи готовятся нанести удар – и все они должны быть побеждены, если мы хотим принести мир и стабильность в Грифонию."
BOI_strike_north:0 "Отвоевать Север"
BOI_strike_north_desc:0 "Север должен быть отвоёван, несмотря на его довольно низкую стратегическую ценность. "Президент-маршал" Кемерскай и его социалистические приспешники должны быть стёрты с лица земли, прежде чем они станут серьёзной угрозой. Нецивилизованные горные кланы также должны быть приведены под наше правление, чтобы восстановить подобие порядка."
BOI_go_after_vedina:0 "Единственная ошибка Гровера Первого"
BOI_go_after_vedina_desc:0 "Хотя Ведина номинально была имперским подданным, на деле она была совершенно независимой и мало заботилась об Империи. Это произошло из-за роковой ошибки императора Гровера I, единственной, которую он когда-либо совершал: он заключил сделку с местным королём. Этот договор истёк, и мы должны обеспечить, чтобы все грифоны, включая вединцев, стали едины под имперским знаменем."
BOI_hang_the_traitor:0 "Повесить предателя"
BOI_hang_the_traitor_desc:0 "После столь долгих лет Кемерскай наконец-то пойман и привлечён к ответственности. Он предал Императора и возглавил мятежников во время революции 978 года, которая чуть не положила конец Империи. Его преступление – государственная измена высшей степени – слишком долго оставалось безнаказанным..."
BOI_core_the_north:0 "Мир и порядок на Севере"
BOI_core_the_north_desc:0 "Имперское знамя вновь развевается на севере. Мы сделаем всё возможное, чтобы восстановить старый порядок и перераспределить земли между верными грифонами. Анархия будет заменена строгим порядком и стабильностью, чтобы население осознало, насколько имперское правление превосходит все другие, и возрадовалось."
BOI_integrate_reichsarmee:0 "Объединить КСОГ и Рейхсармию"
BOI_integrate_reichsarmee_desc:0 "С возвращением Герцланда пришло время объединить Королевские Силы Обороны Грифонстоуна с восстановленной Рейхсармией. В рамках этого процесса мы обратимся к бывшим имперским генералам, предложив им присоединиться к восстановленным вооружённым силам Империи."
BOI_yale_univerisities:0 "Поддержать университеты Йеля"
BOI_yale_univerisities_desc:0 "Университеты Йеля входят в число самых известных учебных заведений Грифонии. Оказывав им должную финансовую поддержку, мы поможем имперской науке расцвести как никогда прежде."
BOI_archonates:0 "Восстановить связи с архонствами"
BOI_archonates_desc:0 "Империя Грифонов извлекла большую пользу из своего союза с Тремя Храмами, однако политическое влияние архонтов в последние годы оказалось несколько проблематичным. Заменив некоторых наиболее одиозных фигур более умеренными священнослужителями и прояснив будущие отношения между Храмами и Империей, мы обеспечим сотрудничество, выгодное для обеих сторон."
BOI_respect_the_locals_imperial:0 "Местные вспомогательные подразделения"
BOI_respect_the_locals_imperial_desc:0 "Многие грифоны на завоёванных нами землях выразили желание вступить в Имперскую Армию (в основном из-за хорошей зарплаты), но не могут этого сделать из-за отсутствия официального гражданства. Организовав вспомогательные подразделения, мы можем предложить им шанс послужить Империи."
BOI_rebuild_griffinstone_imperial:0 "Инвестировать в Грифонстоун"
BOI_rebuild_griffinstone_imperial_desc:0 "Город Грифонстоун расположен в стратегически важном районе Грифонии, и с недавним приходом Гестала к власти он стал вторым по политическому и экономическому значению после Грифенхейма. Чтобы утвердить его новую роль, мы направим средства на дальнейшее расширение города."
BOI_noblesse:0 "Обязанности дворянства"
BOI_noblesse_desc:0 "Быть дворянином — это не только привилегия. Это долг — перед государством, перед богами и перед простыми грифонами. Многие грифонские дворяне забыли об этом и превратились в жалких гедонистов и тиранов. Мы должны восстановить веру грифонов в наше руководство и моральные стандарты дворянства, если хотим предотвратить медленную деградацию нашего общества."
BOI_reichstag:0 "Имперский Парламент"
BOI_reichstag_desc:0 "Очевидно, что жалобы и прошения грифонов должны быть выслушаны — как для улучшения Империи, так и для предотвращения новой Революции и, не дай боги, прихода так называемых республиканцев, которые погубят Грифонию! Вместо этого мы создадим Имперский Парламент, где демократически избранные делегаты смогут обсуждать текущую политику и давать советы Имперскому Правительству."
BOI_imperial_infrastructure:0 "Все Дороги Ведут в Грифенхейм"
BOI_imperial_infrastructure_desc:0 "Десятилетия разрозненных усилий превратили инфраструктуру Грифонии в болото различных железнодорожных и автомобильных сетей с минимальной интеграцией. В рамках нашего объединения мы также должны объявить войну транспорту — и внести здравый смысл в этот хаос."
BOI_strike_west:0 "[This.GetGRIStrikeWestTitle]" 
GetBOIStrikeWestTitle_king:0 "Разобраться с аквелийскими деспотами"
GetBOIStrikeWestTitle_dem:0 "Разобраться с аквелийской чернью"
BOI_strike_west_desc:0 "Западная Грифония является домом не только для вероломных отколовшихся государств и коварной Торговой Федерации Скайфола, но и для Аквелии. Чтобы обеспечить будущее нашей империи, мы должны сделать то, что Гровер II сделал много лет назад, и заставить аквелийцев встать на колени перед своим Императором!"
#GetBOIStrikeWestDesc_king:0 "семью Дискрет и её вассалов"
#GetBOIStrikeWestDesc_dem:0 "[JER.GetLeader] и неотёсанные массы, которые их поддерживают"
BOI_the_trade_cities_imperial:0 "Торговые города"
BOI_the_trade_cities_imperial_desc:0 "Западное побережье раньше было одним из главных экономических центров Империи. Местные города Скайфол, Грифтон и Фезера действительно остаются богатыми и по сей день. Теперь, когда мы вернули их, мы восстановим старые привилегии, чтобы бизнес продолжался как обычно, и мы получали свою долю прибыли."
BOI_the_oil_fields_imperial:0 "Нефтяные месторождения Грайфвальда"
BOI_the_oil_fields_imperial_desc:0 "Пока они были независимыми, грайфвальдцы обнаружили под своей землёй крупные залежи нефти. Мы отправили в регион своих экспертов, и они утверждают, что это может быть крупнейшее нефтяное месторождение во всём мире. Мы должны немедленно начать добычу этого огромного запаса чёрного золота!"
BOI_core_west:0 "Присоединить Запад"
BOI_core_west_desc:0 "Аквелия и соседние регионы возвращены в лоно Империи. Но на этот раз мы не повторим ошибку прошлых Императоров. Аквелия не заслуживает автономии после своих неоднократных предательств и одержимости революционными идеями. Весь запад станет неотъемлемой территорией Империи, управляемой напрямую из [Root.Capital.GetName]а."
BOI_strike_south:0 "Урок смирения"
BOI_strike_south_desc:0 "Падение и раздел нашей Империи пошло от Вингбарди. И теперь, когда большая часть их земель благополучно вернулась в нашу сферу, они станут одними из последних, кого мы подчиним. Их союзники также познают нашу ярость, как и другие дерзкие нации, бросающие вызов имперской власти. Эти препятствия на пути восстановления Империи будут сокрушены под натиском нашей новой мощи."
BOI_wingbardian_rubber:0 "Расширить вингбардийские каучуковые плантации"
BOI_wingbardian_rubber_desc:0 "Тропический климат южной Вингбардии идеален для каучуковых деревьев, и местные грифоны хорошо это знали. Однако остаётся огромный неиспользованный потенциал для расширения. Благодаря щедрым имперским фондам местные плантации можно значительно расширить."
BOI_reclaim_minotauria:0 "Восстановить королевство"
BOI_reclaim_minotauria_desc:0 "Когда император Гровер Второй пожелал обезопасить восточные пути снабжения, он послал Имперский Флот и Имперскую Армию разгромить надоедливых минотавров. Их трусливый король сдался после одного сражения, и было создано марионеточное государство, которое в итоге свергли радикальные демократы. Похоже, нам придётся преподать им урок уважения."
BOI_core_south:0 "Вернуть Юг"
BOI_core_south_desc:0 ""Свободный Юг" останется в прошлом. Вингбардия и её бывшие союзники больше не будут государствами-субъектами. Вместо этого они будут реорганизованы в имперскую провинцию. Современные технологии делают связь, а значит и управление, лёгкими даже на таком расстоянии от столицы. Это должно помешать региону снова так легко отколоться."
BOI_strike_frontier:0 "Отвоевать Фронтир"
BOI_strike_frontier_desc:0 "В 747 году император Гровер Первый пересёк Ползучие горы, застав восточные княжества врасплох и легко подчинив их. Два года спустя зафзийцы благоразумно согласились стать имперской маркой. Но, как и все прочие подданные, они так же предали нас, объявив независимость или просто отдалившись от имперской администрации. Настало время вновь утвердить наше господство."
BOI_far_eastern_port:0 "Самый восточный порт Империи"
BOI_far_eastern_port_desc:0 "Риапорту сильно изменился в наше отсутствие, став процветающим центром торговли. Наши адмиралы предлагают использовать его порт в качестве базы для Имперского Флота, что позволит нам лучше проецировать мощь на востоке. [Root.GetLeader] согласен с ними, и рабочие уже начали расширять гавань."
BOI_settle_the_kosakenland:0 "Заселить Грифию"
BOI_settle_the_kosakenland_desc:0 "Грифия — малонаселённая земля, фронтир восточного фронтира, так сказать. Однако её почва столь же плодородна, как и в Прайвене, житнице юга. Поощряя колонизацию и переселение среди имперских граждан и предоставляя свободные земли (конфискованные у казаков, конечно же), мы сможем интегрировать регион лучше, чем Гровер Третий, и укротить дикий Казацкий край."
BOI_core_frontier:0 "Интегрировать Фронтир"
BOI_core_frontier_desc:0 "Контроль Империи над востоком сильно ослаб за прошедшие годы и в конце концов рухнул окончательно. Мы не можем позволить этому повториться! Мы утвердим контроль и превратим фронтир в послушную и хорошо организованную образцовую провинцию в составе Империи."
BOI_attack_GRF:0 "Вернуть нашу колонию"
BOI_attack_GRF_desc:0 "Всё, что Империя когда-то контролировала в Грифонии – и даже больше – наконец возвращено после множества кровопролитных войн. Однако наша задача ещё не окончена. Наша колония на Эквусе, основанная самим императором Гровером Первым в 783 году, стала независимым государством, которое не признаёт нашу власть. Эта заблудшая колония вернётся в наш состав – силой, если потребуется."
#Goldstone
BOI_golden_dawn:0 "Золотой рассвет"
BOI_golden_dawn_desc:0 ""Теперь, когда Графф и Гестал ушли, Грифонстоун принадлежит мне!""
BOI_purge_republicans:0 "Разобраться с республиканцами"
BOI_purge_republicans_desc:0 "Всего два слова: травить паразитов."
BOI_disband_regency_council:0 "Распустить Регентский Совет"
BOI_disband_regency_council_desc:0 ""Что же, со всеми этими пустыми креслами здание совета бесполезно. Может, я переделаю зал заседаний в гостиную в седельноаравском стиле?""
BOI_disappear_the_disloyal:0 ""Исчезновение" нелояльных"
BOI_disappear_the_disloyal_desc:0 "Случай с Брайтвингом был хорошим примером, но некоторые грифоны, видимо, просто не понимают наши "доводы". Они слишком глупы, чтобы осознать, что им угрожают! Остаётся один вопрос: яд или пуля?"
BOI_foreign_veterans:0 "Иностранные ветераны"
BOI_foreign_veterans_desc:0 "Мир полон войн – и когда они заканчиваются, опытные солдаты остаются без работы. Так давайте же наймём их в качестве офицеров!"
BOI_shadow_warfare:0 "Теневая война"
BOI_shadow_warfare_desc:0 "Голдстоун высоко оценил ценность шпионов как в политике, так и на войне. Пора должным образом профинансировать и расширить наши спецслужбы."
BOI_indentured_servitude:0 "Долговая служба"
BOI_indentured_servitude_desc:0 "Это не рабство, когда они просто отрабатывают свои долги трудом. Конечно, возвращение свободы может занять у них большую часть жизни, но это их проблемы, а не наши."
BOI_knowledge_is_power:0 "Знание — сила"
BOI_knowledge_is_power_desc:0 "Дали бы вы заряженный пистолет своему врагу? Конечно нет. Поэтому мы должны следить, чтобы наши грифоны не знали про опасные идеи республиканизма или, не дай Борей, коммунизма. Давайте ограничим их доступ к образованию самыми базовыми уроками."
BOI_divide_and_conquer:0 "Разделяй и властвуй"
BOI_divide_and_conquer_desc:0 "Раса, религия, культура – столько разнообразия... Мы можем этим воспользоваться – усилим одну социальную группу и используем её как исполнителей нашей воли против местного населения. Они будет ненавидеть их вместо нас, а мы получим идеальных приспешников."
BOI_special_economic_zones:0 "Особые экономические зоны"
BOI_special_economic_zones_desc:0 "Есть ряд "законопослушных" деловых грифонов, которые сталкиваются с серьёзными проблемами из-за необходимости слишком много платить рабочим, заботиться о безопасности на своих фабриках и прочих последствий социалистической политики. Мы предоставим им уникальную возможность открыть новый бизнес в Грифонстоуне в обмен на долю их доходов..."
BOI_prey_on_the_weak:0 "Охота на слабых"
BOI_prey_on_the_weak_desc:0 "По сравнению с великими державами Грифонии, мы можем показаться слабыми и невлиятельными, но нас окружают ещё более жалкие страны. Все грифоны по природе своей хищники, и потому мы должны атаковать тех, кто не может защититься."
BOI_cradle_of_griffonkind_goldstone:0 "Колыбель Грифоньего рода"
BOI_cradle_of_griffonkind_goldstone_desc:0 "Прекрасный остров Румейр — неотъемлемая часть Грифонстоуна, которую мы должны вернуть."
BOI_reclaim_blackhollow:0 "Вернуть Блэкхоллоу"
BOI_reclaim_blackhollow_desc:0 "Существование Блэкхоллоу как независимого госдуарства делает нас слабыми в глазах политических оппонентов – пора вернуть нашу законную землю... И все её природные ресурсы, конечно же."
BOI_verenian_mess:0 "Веренийский хаос"
BOI_verenian_mess_desc:0 "Герцогство Верения теперь разделено между тремя домами, что делает его лёгкой мишенью. Будем надеяться, они не объединятся, и мы сможем разбить их поодиночке."
BOI_deal_with_rumareans:0 "Разобраться с Румейрцами"
BOI_deal_with_rumareans_desc:0 "Западные грифоны слишком долго сопротивлялись нашему правлению. Путем устранения смутьянов и усиления политики ассимиляции мы, возможно, подавим их сопротивление раз и навсегда."
BOI_send_them_to_the_mines:0 "Отправить их в шахты"
BOI_send_them_to_the_mines_desc:0 "Блэкхоллоу кишит революционерами, бандитами и Борей знает кем... Но там много неосвоенных ресурсов. Может, мы используем грифонов, захваченных во время войны, для их добычи? Пахнет прибылью!"
BOI_conscript_bandits:0 "Призвать бандитов"
BOI_conscript_bandits_desc:0 "Бандиты Блэкхоллоу – крепкие орешки, сумевшие стать угрозой для всех соседних стран. Может, мы договоримся с некоторыми из их более разумных главарей и используем бандитов как солдат? Хотелось бы, чтобы все они скоро погибли, но до тех пор нам не придётся терять по-настоящему ценных грифонов."
BOI_integrate_verenia_goldstone:0 "Интегрировать Верению"
BOI_integrate_verenia_goldstone_desc:0 "Мы избавимся от сварливых веренийских дворян и установим грифонстоунский контроль над регионом."
BOI_breaking_the_heart:0 "Разбить "Сердце""
BOI_breaking_the_heart_desc:0 "Ах, Грифенхейм – вожделенный город всего мира. Старая Империя рушится – настал идеальный момент для удара. Тем не менее, Герцланд обширен и густонаселён. Нам нужно собрать все доступные силы, прежде чем испытать удачу."
BOI_shaking_claws_with_imperials:0 "Рукопожатие с имперцами"
BOI_shaking_claws_with_imperials_desc:0 "Всегда найдётся ряд чиновников, офицеров и дворян, готовых служить любому, кто гарантирует сохранение их власти. В обмен на стабильность мы получим сеть влиятельных контактов и исполнителей воли Голдстоуна."
BOI_pacify_herzland:0 "Усмирить Герцланд"
BOI_pacify_herzland_desc:0 "Завоевание – лишь первый шаг. Нам нужно избавиться от идейных имперцев, установить надлежащую администрацию и выполнить остальные скучные, но необходимые действия для контроля над такой обширной территорией, как Герцланд."
BOI_skyfall_prize:0 "Западный трофей" #Ну я хз
BOI_skyfall_prize_desc:0 "Скайфол – врата в Грифонию. Контролируя его, мы сможем доминировать в грифонской торговле и свободно расширяться в другие части мира."
BOI_oligarchs:0 "Олигархи"
BOI_oligarchs_desc:0 "Великий город Скайфол печально известен беспощадностью своих олигархов. Множество промышленников и дельцов по всему нашему новому владению более чем готовы сотрудничать с нами, чтобы вкусить плоды свободы, которую мы можем им подарить."
BOI_noblegriffs:0 "Дворяне"
BOI_noblegriffs_desc:0 "Ах, имперское дворянство... Какая свора коварных, жадных созданий... Как же многие из них тоскуют по возвращению старых дней крепостничества, когда крестьяне знали своё место. У нас есть возможность исполнить их заветное желание, а взамен они будут держать массы в узде."
BOI_puppet_emperor:0 "Император-марионетка"
BOI_puppet_emperor_desc:0 "До сих пор лорд Голдстоун правил лишь как регент Грифонстоуна, однако контроль над Герцландом и птенцом-императором даёт ему возможность повышения. Гровер Шестой, всего лишь дитя без влиятельных сторонников, послужит идеальным инструментом."
BOI_unlikely_candidate:0 "Неожиданный кандидат"
BOI_unlikely_candidate_desc:0 "Из-за того, что один идиот убил императора, мы остались и без удобной марионетки, и без претензий на имперские земли. К счастью, у нас есть потенциальная замена..."
BOI_secure_haukland:0 "Захватить Хаукленд"
BOI_secure_haukland_desc:0 "Архипелаг Хаукленд может показаться жалким набором скал, но его стратегическое расположение делает его ключевым для наших планов."
BOI_integrate_western_reaches:0 "Интегрировать Скайфол"
BOI_integrate_western_reaches_desc:0 "Если мы хотим полностью использовать потенциал Скайфола, нам нужно отобрать власть у тех, кто противостоит новому режиму, и передать её нашей администрации."
BOI_unholy_alliance:0 "Нечестивый союз"
BOI_unholy_alliance_desc:0 "Союз "трона" и "алтаря" стар как сама цивилизация. Нам нужно им воспользоваться. Потеря Идола многими считалась утратой божественной защиты Грифонстоуна – тесное сотрудничество с Тремя Храмами позволит нам убедить грифонов, что святость вернулась в Грифонстоун."
BOI_declare_griffonstone_empire:0 "Объявить Грифонстоун империей"
BOI_declare_griffonstone_empire_desc:0 "Старая Империя пала. Контролируя птенца-императора и имея в когтях как Грифенхейм, так и Грифонстоун, наше государство может претендовать на титул новой Империи, а лорд Голдстоун – на титул её регента."
BOI_dominate_black_market:0 "Доминировать на чёрном рынке"
BOI_dominate_black_market_desc:0 "Что могут сделать стая грифонов без морали, контролирующая один из крупнейших торговых портов мира, с самой дешёвой рабочей силой в своём распоряжении? Это довольно очевидно..."
BOI_war_profiteering:0 "Нажиться на войне"
BOI_war_profiteering_desc:0 "Война полезна для бизнеса: мы можем продавать оружие, сдавать внаём инструкторов и солдат воюющим странам – и получать с этого огромную прибыль."
BOI_raid_equestrian_commerce:0 "Рейды на эквестрийских торговцев"
BOI_raid_equestrian_commerce_desc:0 "Пони и чейнджлинги схватились друг с другом, и победитель определит будущее Эквуса. Пока эквестрийцы заняты на западе, мы можем поощрять наёмников и пиратов атаковать их плохо охраняемые торговые корабли."
BOI_claim_the_borderlands:0 "Заявить права на пограничье"
BOI_claim_the_borderlands_desc:0 "Поскольку население нашей новой империи преимущественно герцландское, будет легко и очень выгодно интегрировать оставшихся герцландцев в Грифонстоун. Конечно, сначала придётся их завоевать."
BOI_new_order_on_equus:0 "Новый порядок в Эквусе"
BOI_new_order_on_equus_desc:0 "Чейнджлинги погрузили бывшие эквестрийские земли в хаос. В лучшем случае, у жуков уйдут годы, чтобы стабилизировать ситуацию, в худшем – они вообще не смогут этого сделать. Это создаёт идеальную возможность для расширения нашего влияния в Восточном Эквусе."

