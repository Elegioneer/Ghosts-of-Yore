## Events ##
griffonstone.001.t:0 "Возвращение домой"
griffonstone.001.d:0 "Галлус часто яростно заявлял, что терпеть не может Грифонстоун, вспоминая о своей родине в течение тех двух лет, что он провел в Понивилле, но сегодня он испытывал даже нечто большее, чем легкую ностальгию. Да, Эквестрия была ярким маяком современности, местом безопасности и прогресса, и, что было для него самым важным, местом, где он нашел своих настоящих друзей. Но со временем плохие воспоминания начали тускнеть, и он начал тосковать по дому – каким бы он ни стал за время его отсутствия. Однако теперь, после долгого путешествия, он, наконец, снова увидел "Дом грифонов", и к нему вернулись воспоминания о том, почему он презирал этот город – разрушающиеся трущобы, подозрительные грифоны, вероятно, жаждущие ограбить его, вонь на улицах, которые никогда не убирают, и всепоглощающее чувство безнадежности, охватившее это место... Старый добрый Грифонстоун, по-видимому, совсем не изменился за столько лет. Пока он шел по городу, его настроение становилось все более и более мрачным – и почему дедушка Графф приказал ему вернуться? Казалось, он был очень рад отправить Галлуса как можно дальше, надеясь наконец избавиться от "маарового отродья и ошибки богов", как он называл его во время приступов гнева. Хотя большинство иностранных студентов покинули Школу дружбы гораздо раньше из-за явной угрозы войны с чейнджлингами, Граффа как будто бы не заботило здоровье и благополучие Галлуса. Если бы ему пришло известие о том, что Галлус погиб на передовой, он, вероятно, отреагировал бы на это как-то так: "Ха! Я всегда знал, что он достаточно глуп, чтобы стать пушечным мясом!"\n\nНо теперь Галлус был здесь, и в письме, которое он получил, ему было приказано поговорить с Граффом, как только он прибудет в Грифонстоун. По собственному опыту Галлус знал, что дедушка, скорее всего, ждет его в своем кабинете в бывшем королевском дворце, разбираясь с какой–то бессмысленной бумажной работой и жалуясь на то, что подчиненные не выполняют должным образом его "блестящие" приказы, – и поэтому, недовольно нахмурившись, молодой грифон направился туда.\n\nНа мгновение он погрузился в свои мысли и это едва не стоило ему клюва, так как дверь, мимо которой он собирался пройти, резко распахнулась, чуть не влетев ему в лицо. Из кабинета вылетела коричнево-белая грифонша, бормоча ругательства, из которых "сраный маразматик" было наименее оскорбительным. Еще одна вещь, которая не изменилась в Грифонстоуне, – это склоки Гильды с Граффом, но Галлус не помнил, чтобы она раньше вела их лицом к лицу. Она грубо прорычала: "Осторожнее, придурок!" – и ушла. Галлус тихо вздохнул – было ясно, что опекун встретит его в плохом настроении. Учитывая, что от одного вида подопечного Граффу станет ещё хуже, отложить визит казалось очень заманчивым... Однако, если Графф узнает, что он приходил во дворец и просто ушел, то станет еще большей занозой в заднице на долгие-долгие дни вперед..."
griffonstone.001.a:0 ""Зачем я здесь?""
griffonstone.016.t:0 "Встреча"
griffonstone.016.d:0 "Графф ответил на стук в дверь в своём репертуаре: "Кто, во имя Борея, снова меня беспокоит? Вам всем что, больше нечем заняться, кроме как докучать мне?! Если это не важно, уходи, отродье Маара!" — Галлус решил не отвечать и открыл дверь. Как он и предполагал, опекун был занят бумажной работой – скорее всего, искал несоответствия в последних отчетах, за которые он мог бы отругать своих бедных клерков.\n\n— А, это ты. — сказал Графф, немного удивившись. — Надеюсь, твое путешествие было безопасным, ведь в этой пороховой бочке, известной как Грифония, в последнее время было довольно тихо... Почему ты стоишь в дверях, Галлус? Разве ты не знаешь, что это приносит несчастье? Входи! — Галлус неохотно сделал несколько шагов вперед. — Отлично, а теперь выпрямись, а то выглядишь, как какой-нибудь скайфолский вор. Веди себя так, как подобает гордому сыну Грифонстоуна! — Слушая это, Галлус раздражённо вздохнул... Вот дерьмо, опять по новой... \n\n— Дедушка Графф, пожалуйста, скажи, что ты от меня хочешь? Я устал, и хотя я просто обожаю слушать твои невероятно полезные нравоучения, есть множество более интересных дел, которыми я мог бы заняться. Например... смотреть как сохнет краска!\n\n— Кажется, эквестрийцы совсем не научили тебя хорошим манерам! Но, так и быть, я скажу, зачем ты здесь. В жизни каждого грифона рано или поздно наступает день... и не смейся, это не то, о чём ты думаешь, юнец! ...день, когда он должен начать заботиться не только о себе, но и о своей семье. И страна – это, в каком-то смысле, одна огромная семья... В общем, я записал тебя на добровольную службу помощником персонала Сил Обороны, ну или того, что от них осталось. Ты будешь помогать с документами, подавать чай и делать всё остальное, с чем им понадобится помощь. И будь благодарен за это! Это хороший способ получить новые навыки. Если проявишь себя – станешь офицером или будешь переведён в правительство. Это честная, законная работа. Вопросы есть?\n\n— Нет, но сегодня я узнал, что такое "добровольная служба". Отличная работа! Ты обеспечил мне самое лучшее образование, чтобы я подавал чай офицерам!"
griffonstone.016.a:0 ""Когда я был в твоём возрасте...""
griffonstone.002.t:0 "Заговор"
griffonstone.002.d:0 "Уже сгущались сумерки, когда все гости наконец прибыли в поместье Голдстоунов. У резиденции была репутация самого богатого места в Грифонстоуне – огромная и богато украшенная, она резко контрастировала с разрушающимися замками и стареющими виллами большинства дворян королевства. Его владелец, казалось, был единственным, кто процветал на фоне всеобщей нищеты в стране. Голдстоун не спешил раскрывать свой план, для начала позволив гостям насладиться его гостеприимством. Дворяне пили изысканные напитки, курили сигары из Малави, обсуждали всякие малозначимые темы. Наконец, Голдстоун встал в центре комнаты и громко прочистил горло. Все гости повернулись к нему, чтобы послушать.\n\n— Джентльгрифы, хотя мне безусловно приятно проводить время с вами, светлейшими умами Грифонстоуна, птицами благороднейшей породы, пришло время рассказать, почему я собрал вас всех здесь. Многие из вас – мои старые друзья, и я надеюсь, что остальные также станут моими надежными союзниками...\n\n— Спасибо вам, лорд Голдстоун, за эти добрые слова и этот восхитительный вечер. Но не могли бы вы, пожалуйста, перейти к делу? — Лорд Брайтвинг воспользовался первой же возможностью, чтобы прервать поток слов. Голдстоун едва не поморщился. Он всегда недолюбливал Брайтвинга, толстого распутника, страдающего манией величия. Но именно эти черты его характера Голдстоун мог подпитывать и использовать, чтобы создать такие узы, которые были бы гораздо крепче тех, что основаны на верности.\n\n— Полагаю, вы правы... Итак, мы зашли в тупик, джентльгрифы. В течение многих лет мы могли извлекать огромную прибыль из недр Грифонстоуна. Но сейчас наше дело находимся в серьёзной опасности. Обыватели бунтуют, и если мы не сможем выкарабкаться из этой ямы, – революция неизбежна. Графф, старый маразматик, не сможет справиться с чернью. В таком случае, всё это, – он окинул когтями зал, – всё наше богатство и власть попадёт в лапы необразованных смердов. Настало время действовать. Гестал будет бубнить что-то про "старую славу Империи", но не станем же мы преклонять колено перед немощными наследниками давно павшей династии? Лично я не собираюсь. – Дворяне одобрительно забормотали. – Мир меняется. В трудные времена удача благоволит смелым. Если мы будем действовать сообща, то сможем определить будущее Грифонстоуна и, конечно же, получить от этого прибыль!\n\nДворяне начали ликовать – все, кроме Брайтвинга. Несмотря на всю свою жадность, он не был дураком. Когда ликующие возгласы утихли, он заговорил.\n\n— Конечно... разделить Грифонстоун между всеми нами будет просто прекрасно, но мы всё равно будем меньшинством в совете. Нам нужен более грубый, но надёжный метод. А это значит, что нам надо будет противостоять Силам Обороны и ополчению тех дворян, что выступят против нас... У них будет численный перевес...\n\n— Пока всё так. Но не переживайте, у меня есть план, который позволит нам не заботиться о количестве солдат противника... Но чтобы он сработал, мне нужна ваша поддержка в совете."
griffonstone.002.a:0 ""Они даже не поймут, что произошло.""
griffonstone.003.t:0 "Беспорядки в Вонзитце"
griffonstone.003.d:0 "В городе Вонзитц, также известном как Эйнкартреф, проживает значительное число румейрцев. Хотя на протяжении веков, благодаря политике ассимиляции и иммиграции герцландцев и вингбардийцев, они стали меньшинством на своей собственной земле, многие из них всё ещё выступают против правления Грифонстоуна и мечтают воссоединиться со своими островными братьями и сестрами.\n\nСегодня в Вонзитце прошла крупная демонстрация. Протестующие румейрцы требовали воссоединения региона с баронством. Демонстранты быстро перешли к насилию, и произошла беспорядочная стычка с полицией, которую поддерживали лояльные грифонстоунцы. Многие были ранены, некоторые погибли, но в конечном итоге беспорядки были подавлены. К счастью, демонстрация не переросла во что-то похуже. В последние годы румейрцы стали более радикальными; мы ожидаем, что в будущем произойдет больше актов насилия, особенно если террористов будет поддерживать новый барон Румейра, Аларик Донбрейкер."
griffonstone.003.a:0 "Очередная проблема..."
griffonstone.004.t:0 "Митинг"
griffonstone.004.d:0 "Тяжело заставить жителей Грифонстоуна заботиться о чем–либо. В то время как во многих других местах та ужасающая реальность, с которой им пришлось столкнуться, быстро вызвала бы бурную революцию, здесь грифоны были просто в отчаянии. Местные жители целыми днями дрались за объедки, пытаясь обмануть и ограбить немногочисленных туристов, которые посещали самый священный город континента в эти дни хаоса и войны. Убедить этих грифонов задуматься о чем-то большем, чем повседневное выживание, было тяжелой работой... но это была её работа, единственное, чем она хотела заниматься, потому что благодаря двум эквестрийским пони она начала верить, что Грифонстоун и его грифоны могут быть спасены. Должны быть спасены.\n\nИ вот, то, что поначалу казалось мечтой идиота, начало приносить свои плоды – теперь она стояла перед сотнями, а может, и тысячами грифонов, которые ждали её речи. Когда Гильда взошла на трибуну, сооруженную на скорую лапу из нескольких ящиков, толпа притихла в ожидании. Она прочистила горло и начала говорить,\n\n— Грифонстоунцы! Оглянитесь вокруг! Что вы видите? Большинство скажет, что они видят нищету и разруху, в которые погрузилась наша великая нация. Но это не так! Я вижу гордых, сильных грифонов. Грифонов, желающих и готовых объединяться, работать и бороться за лучшее будущее. Старые дураки, которые правят Грифонстоуном, лишь смотрят в прошлое. Они разглагольствуют о былой славе и своем божественном праве править нами. Они прячутся в своих разрушающихся дворцах, уничтожая то, что осталось от нашей некогда гордой нации! В течение трех десятилетий они ничего не делали, чтобы спасти Грифонстоун. Они не собираются и не хотят нам помогать! Пришло время нам, простым грифонам, взять дело в свои когти и спасти нашу страну! Пора перестать заглядывать в наше прошлое и начать думать о будущем! Будущем, в котором грифоны – все грифоны – будут решать судьбу своей нации. Только в таком будущем мы сможем восстановить Грифонстоун, государство, возрождённое всеми грифонами для всех грифонов!"
griffonstone.004.a:0 ""Мы здесь власть!""
griffonstone.005.t:0 "Очередной съезд Совета"
griffonstone.005.d:0 "– Не могли бы вы повторить ещё раз, что вы сказали, лорд Гестал? Мой слух уже не так хорош, как прежде... А эти богомерзкие революционеры сегодня особенно громко орут... – Протест снаружи, казалось, медленно сходил на нет, протестующие устали требовать "свободы и хлеба". Все шло как обычно – вероятно, даже сам Кемерскай не смог бы удержать внимание голодных грифонстоунцев для серьёзного восстания. Однако, Графф должен был отдать должное – Гильда была невероятно упорна, снова и снова собирая своих последователей на протесты.\n\n— Конечно, канцлер. — Лорд Гестал был одним из немногих, обращавшихся к Дедушке по его титулу. — Как, вероятно, все уже знают, император мертв. Мои друзья при императорском дворе сообщили мне о растущих беспорядках и борьбе за регентство. Наш долг – помочь Империи в час нужды.\n\n— Вы с ума сошли, Гестал?! Вы хотите, чтобы мы ввязались в этот хаос? Мы оба знаем, как разделены правители Герцланда! К концу года они вцепятся друг другу в глотки. И что мы будем делать? Маршировать на Грифенхейм?!\n\n— Это наш долг. Мы пренебрегаем обязанностями перед короной, канцлер. Если мы не поддержим Грифенхейм, Империя может оказаться в когтях узурпатора или – что ещё хуже – революционеров!\n\n— Не говорите мне о долге, Гестал! Мой долг – защищать Грифонстоун, и пока я дышу, мы не будем ввязываться в безнадёжные войны на севере!\n\n— Полагаю, нам не придётся долго ждать – сказал лорд Пёрплбик и засмеялся. Несколько других последовали его примеру. \n\n— Тишина! — проревел Графф. Его голос звучал удивительно молодым из-за переполнявших его эмоций. Те, кто был достаточно стар, вспомнили дни, когда он орал на новобранцев КСОГ... — Это чистое безумие, и вы это знаете, Гестал. Если мы двинемся на север, Блэкрок сожжёт Грифонстоун дотла! Грифенхейм должен сам разгрести свои проблемы. — Дедушка вздохнул. — Заседание окончено. Мне нужен сон. — Он заметил, как министр закатил глаза, — Не смей даже моргнуть, Пёрплбик. Посмотрим, как ты будешь себя чувстовать в моём возрасте, мешок жира!\n\nЛорды один за другим покинули зал совета. В кабинете остались лишь Гестал и Графф. Прежде чем выйти, Гестал обернулся и сказал:\n\n— Это не просто долг, канцлер... это здравый смысл – действовать, пока есть шанс. Иначе тот, кто победит, придет за нами и накажет за отказ поддержать его дело... А если победят республиканцы, — он указал когтем на окно; толпа протестующих расходилась, за исключением нескольких, всё ещё размахивавших плакатами и флагами, — наши головы окажутся на пиках, канцлер. — Дедушка махнул лапой, отпуская лорда. Гестал вздохнул и вышел. Спустя несколько мгновений сжатый кулак Граффа с грохотом ударил по столу,"
griffonstone.005.a:0 ""Я слишком стар для этого!""
griffonstone.006.t:0 "Неожиданная встреча"
griffonstone.006.d:0 "Работа помощника оказалась сложнее, чем Галлус думал изначально. Ему почти не приходилась заваривать чай сотрудникам, поскольку командир Сил Обороны фактически назначил его своим адъютантом. Куча бумажной волокиты, организация собраний Высшего Командования (слишком пафосное название для кучки вечно ворчащих старых офицеров), и доставка сообщений "особой важности". Что ещё хуже, каждые несколько дней Графф вызывал Галлуса в свой кабинет, чтобы проверить, чему он научился за это время. Учитывая ненормальные стандарты Дедушки, молодой грифон мог бы быстро стать образцом для подражания в совете... Однако, на этих встречах Галлус слышал только жалобы, возмущения и приказы разобраться с очередной кучей докладов и донесений. Графф отчитывал и нагружал его сверхурочной работой за малейшие ошибки, словно он был ещё и помощником канцлера. В результате, Галлус вечно был ужасно уставшим и не обращал внимание на то, что происходило вокруг. В этот раз он доставлял приказ одному из самых дальних постов КСОГ, когда столкнулся с бело-коричневой грифоншей, вышедшей из-за угла.\n\n— Осторожнее, болв... Подожди, а ты кто вообще такой?! — Кажется, сегодня Галлусу особенно не повезло – он столкнулся с Гильдой.\n\n— Эм... Галлус. Меня зовут Галлус. И я очень... очень виноват — он попытался разрядить обстановку.\n\n— Я не знаю никаких Гал... Подожди, ты тот парень, о котором заботится Графф?\n\n— Ну... если то, что он делает, можно назвать заботой, то да. — ответил Галлус, — Правда, прошу прощения, но я спешу. Понимаете, у меня много работы, приказов, которые нужно доставить...\n\n— В любом случае, просто держись от меня подальше, птенец... — Галлус кивнул и убежал, оставив Гильду наедине. Когда гнев немного отступил, она, кажется впервые в жизни, задумалась о Галлусе и его ситуации. Вероятно, он сейчас работает на своего опекуна. Парень всегда крутился рядом со старым дураком – по крайней мере, уже лет десять. По какой-то причине Дедушка всегда заботился о том, чтобы он хорошо питался и был здоров... Он даже отправил его в Эквестрию учиться. Казалось странным, что такому неприятному и сварливому грифону как Графф не плевать на какого-то сироту. Что в нём было такого особенного?"
griffonstone.006.a:0 ""Интересно...""
griffonstone.007.t:0 "Предложение"
griffonstone.007.d:0 "Дедушка Графф, как обычно, был невнимателен на заседании Регентского Совета. После двадцати лет тщетной работы он уже бросил все попытки убедить дворян сделать что-то полезное для Грифонстоуна. Кроме того, почти все заседания совета заканчивались жаркими спорами, которые неизменно заходили в тупик – так с какой стати ему вообще беспокоиться? Обычно лорды забывали о существовании Граффа, и он мог спокойно дремать на собраниях, пока они спорили о том, чей предок украл стадо скота у другого, или кто был шулером во время последней игры в карты... Однако эта встреча была особенной, всё казалось странным... Многие лорды были на удивление спокойны и, кажется, действительно говорили о насущных проблемах Грифонстоуна – событие настолько необычное, что это вывело старого грифона из ступора.\n\n— Господа, — из всех грифонов совета, Брайтвинг вёл себя наиболее подабающе государственному деятелю. — Думаю, нам стоит хотя бы на пару месяцев забыть наши разногласия, чтобы справиться с одной очень серьёзной проблемой. Восстания румейрцев становятся всё опаснее; после переворота в Арантиге, её новый правитель, барон Доротеос, быстро увеличил размер армии; В Блэкхоллоу все еще царит бандитизм, но после недавних "реформ" по централизации, эти преступники начали угрожать нам напрямую. Если мы не ударим первыми, война по нескольким фронтам неизбежна! Мы должны попробовать собрать все войска и нанести поражение нашим врагам поодиночке, прежде чем они нападут на нас вместе.\n\n— Брайтвинг, ты уже пьяный? Сейчас ведь ещё даже не полдень. Какие войска? У нас недостаточно грифонов чтобы противостоять кому-либо из наших соседей. К тому же, если мы атакуем одного, другие воспользуются этим и нападут на нас. — Дедушка Графф охладил милитаристсткий пыл Брайтвинга.\n\n— Я предоставлю войска, канцлер. Я знаком со многими капитанами наёмников, которые с радостью позволят мне нанять их солдат. И это не ослабит Силы\nобороны. — Неожиданно вмешался Голдстоун. — Бандиты Блэкрок слабо контролируют восточные земли. Один мощный удар – и вся выжившая шваль разбежится по Грифонии.\n\nГрафф с подозрением посмотрел на Голдстоуна. Его готовность потратить деньги на благо Грифонстоуна казалась очень необычной. — Ты собираешься безвозмездно сделать что-то ради королевства? Да скорее Кемерскай присягнёт на верность императору! В чём подвох, Голдстоун?\n\n— Ну... Если я преуспею, то стану новым графом Блэкхоллоу. Конечно же, я сразу подчинюсь Грифонстоуну, а все, кто поддержит меня, будут щедро вознаграждены...\n\n— Хм... Ладно, выношу это на голосование. — пробормотал Графф. \n\nКонечно, все дружки Голдстоуна поддержали его, и, как ни странно, многие грифоны, которые ранее не поддерживали предложения лорда, включая Брайтвинга, проголосовали "За". Однако они не составили большинства, и голосование закончилось вничью. Окончательное решение было за канцлером..."
griffonstone.007.a:0 ""Я надеюсь, что не пожалею об этом, Голдстоун!""
griffonstone.007.b:0 ""Нет, это глупая идея.""
griffonstone.008.t:0 "Побег из Грифонстоуна"
griffonstone.008.d:0 "Несколько часов назад казалось, что день пройдёт как обычно: часы утомительной работы адъютанта. Галлус молился о том, чтобы хоть что-то изменило скучную рутину этих дней... Что ж, боги решили ответить на эти молитвы весьма ироничным образом...\n\nГаллус полз по старой канализационной трубе, недоумевая, как, Маар возьми, всё это произошло. Наемники, прибывшие ранее, внезапно напали на гарнизон города и примерно за час перебили всех вооруженных грифонов, которым не удалось сбежать в старый дворец, где они теперь сдерживали осаду. К счастью для Галлуса, во время первого нападения он находился за пределами дворца, наслаждаясь редкими мгновениями свободного времени. Как только всё началось, он, осознав серьёзность ситуации, быстро сбросил форму и убежал. Наемники были на удивление дисциплинированными и стреляли в гражданских только в том случае, если они, как им казалось, представляли угрозу... Тем не менее, это означало, что, пока солдаты Голдстоуна штурмовали дворец и резиденции враждебной им знати, городские бандиты могли действовать беспрепятственно, усиливая хаос. Ветхая канализационная система была лучшим способом сбежать из города невредимым.\n\nИ вот он медленно пробирался по ней, несколько раз чуть не застряв в узких трубах. Он был на грани паники, этот опыт заставил его осознать, насколько сильно он ненавидит узкие пространства! А ещё этот запах...\n\nНаконец, он увидел свет. Продвинувшись ещё на несколько десятков метров, Галлус выбрался из трубы. Он огляделся – он был далеко за пределами города, вдали от опасности. Несколько минут он смотрел на горящий Грифонстоун. Никогда в жизни он не чувствовал себя таким маленьким и беспомощным. Парализованный страхом и гневом, он ничего не мог сделать, чтобы спасти свой родной город... Ему оставалось только сбежать и спасти собственную шкуру..."
griffonstone.008.a:0 "Прощай, Грифонстоун..."
griffonstone.009.t:0 "Последняя надежда"
griffonstone.009.d:0 "Вскоре новости о перевороте Голдстоуна разнеслись по всей строне. Многие дворяне поддержали его, другие поняли, что не смогут противостоять его армии наёмников, и залегли на дно. Но Лорд Гестал не был одним из них, он быстро собрал своё войско и, объединив силы с остатками Королевских сил обороны и ополчением пары отверженных лоялистов, двинулся прямо на столицу. Теперь эта пёстрая компания разбила лагерь недалеко от города, готовясь к штурму.\n\n— По словам допрошенных беглецов, Голдстоуну и его наемникам удалось установить контроль над городом, и теперь они окапываются в ожидании подкреплений. К счастью, ополченцы сдерживают их подход. Если мы нанесем удар сейчас, то сможем вернуть город и захватить Голдстоуна. Далее его дружки разбегутся как крысы с тонущего корабля. — Клаус Стилфезер, капитан войска Гестала, закончил свой доклад.\n\n— А что насчёт канцлера Граффа и членов совета, которые оставались в городе? — спросил Гестал.\n\n— Точной информации нет, но похоже, что канцлер был убит во время штурма дворца, а советники – взяты в плен.\n\n— Благодарю, капитан. — Гестал некоторое время собирался с мыслями — Мы не можем позволить Голдстоуну захватить власть. Он уничтожит и нас, и королевство. Он не остановится, пока не выжмет все богатства из этой земли, пока не продаст все, что осталось от нашего наследия... Мы должны победить. Иначе у Грифонстоуна не будет ни будущего, ни прошлого. Собирайте своих солдат, джентльгрифы, мы выступаем через час.\n\nВечером, воины Гестала начали штурм..."
griffonstone.009.a:0 "...и освободили город."
griffonstone.009.b:0 "...но потерпели поражение."
griffonstone.010.t:0 "Павший лорд"
griffonstone.010.d:0 "Грифонстоун пал. Город, стоявший много веков незахваченным, священное место начала грифоньего рода, теперь лежал в руинах. Да, до битвы он и так был полон трущоб, но после дня ожесточенных уличных боев, целые кварталы были стерты с его лица. Много часов ушло на тушение пожаров, частично начатых отступающими наемниками, которые пытались задержать наступление армии знати. Сердце Гестала омывалось кровью при виде всех этих разрушений и смертей – конечно Грифонстоун и так медленно разваливался в последние годы, но он ни в коем случае не хотел стать тем, кто окончательно разрушит его... И теперь, чтобы остановить одного сумасшедшего грифона, должны были погибнуть тысячи. Там, где сопротивление было особенно ожесточенным, и где уличные бои переросли в беспорядочные потасовки, теперь лежали горы трупов. Битва унесла жизни множества гражданских, а ведь единственная вина этих бедных грифонов заключалась в том, что они оказались не в том месте и не в то время... Наемники Голдстоуна держались удивительно крепко – большинство из них погибло в бою, небольшое число прорвалось сквозь ряды осаждающих и сбежало в направлении гор Блэкхоллоу. В плен попало всего несколько десятков грифонов. Теперь они, закованные в кандалы, стояли на главной городской площади, а рядом с ними их работодатель – Голдстоун. Коварный лорд, не будь его лапы и клюв связаны, скорее всего, тут же набросился бы на окружавших его солдат. В его глазах Гестал не видел ничего, кроме чистой ненависти.\n\n— Почему у него завязан клюв, лейтенант? — Гестал спросил сторожившего их офицера.\n\n— Господин... Если честно, я просто устал от его пустых угроз и оскорблений. — Гестал приподнял бровь и подошёл ближе к Голдстоуну. Связанный грифон начал отчаянно извиваться и злобно мычать.\n\n— Голдстоун... Какое удовольствие видеть тебя в таком состоянии. Твой план провалился, а твои дружки схвачены. Ты отвратительный преступник, и я должен бы приказать казнить тебя здесь и сейчас... Но оставить тебя в живых будет ещё более жестоко. Сидя в тюремной камере, ты будешь каждый божий день думать о том, что могло бы быть, если бы ты победил. А сейчас, я должен справиться с тем беспорядком, который ты, властолюбивый маньяк, устроил. Надеюсь, я сделаю это быстро, и мне больше никогда не придётся о тебе думать. Надеюсь, мы больше никогда не увидимся... Отведите его в самую глубокую часть подземелья, лейтенант."
griffonstone.010.a:0 ""Надеюсь, ты там сгниёшь, предатель.""
griffonstone.011.t:0 "Под новым руководством"
griffonstone.011.d:0 "Старый Дворец Гуто был почти безмятежен – после того как убрали последние тела защитников, лишь пулевые отверстия и следы крови напоминали о жестоких событиях, произошедших здесь всего несколько дней назад. Поскольку большинство наёмников было развёрнуто в городе для усмирения бунтовщиков, группа дворян во главе с Брайтвингом шла по практически пустынным коридорам. Проходя мимо дверных проёмов заброшенных комнат и некогда великолепных, ныне ветшающих, произведений искусства, собранных поколениями грифонстоунских королей, Брайтвинг на мгновение задумался – мирная атмосфера этого места напоминала склеп.\n\nОни нашли Голдстоуна в тронном зале – конечно же, лидер заговора пафосно восседал на старом королевском троне, а вокруг стояли тяжеловооружённые гвардейцы.\n\n— Ах, добро пожаловать, добро пожаловать! — улыбка Голдстоуна напоминала звериный оскал, — Рад вас видеть, друзья мои. Надеюсь, вас ничто не задержало?\n\n— Ничего достойного упоминания, — ответил Брайтвинг, — Как я вижу, вы уже как дома, лорд Голдстоун. Удобен ли вам трон?\n\n— Не особо... Это скорее бремя, если честно: вся эта ответственность, формальности и так далее... Но, пожалуй, нам стоит перейти к делу, как вы любите, а не обсуждать мебель.\n\n— Действительно, лорд Голдстоун. Теперь город наш, и, полагаю, настало время поговорить о курсе будущих действий...\n\n— Я бы предпочёл поговорить о прошлом... Например, почему вы так задержались с подкреплением... Мне пришлось справляться с Гесталом в одиночку...\n\n— Что ж... — Брайтвинг попытался сохранить спокойствие, однако все, кто его окружал, медленно попятились назад. — Тому много причин: местность, нападения врагов...\n\n— Очень убедительно. — Сказал Голдстоун со зловещей умхылкой. — Я бы поверил вам, если бы мои грифоны не перехватили одно письмо... Вам стоило платить больше своим курьерам; подкупить их было до смешного легко...\n\nБрайтвинг тут же панически закричал и попытался сбежать – но успел сделать лишь пару шагов, прежде чем гвардейцы открыли огонь. Через секунду лорд пал наземь.\n\n— 'Я люблю предательство, но ненавижу предателя', как говорил... Хм, Арантигос или Гровер? — спросил Голдстоун остальных дворян, оцепеневших от ужаса. — Кто бы это ни сказал, думаю, это вполне подходит к ситуации. Брайтвинг хотел предать меня и получил по заслугам. Сочтите это предупреждением. Его владения будут разделены между теми, кто выполнил свою часть сделки... Или по крайней мере были достаточно умны, чтобы скрыть своё предательство лучше, чем он. Надеюсь, они уже оставили эти глупые планы. Я не собираюсь становиться новым королём, это скучно и отнимает слишком много времени. В будущем эту роль займет подходящая марионетка. До того момента я буду править как регент..."
griffonstone.011.a:0 ""...так же как и после.""
griffonstone.012.t:0 "Последняя попытка"
griffonstone.012.d:0 "Дедушка Графф пытался расшифровать финансовый отчёт, написанный полуграмотным клерком, когда окончательно потерял концентрацию из-за внезапного стука в дверь.\n\n— Я занят! Если это не вторжение, пожар или хорошие новости – убирайся! — сказал он как можно грубее. Однако двери открылись, и в проёме показался... лорд Голдстоун. — Голдстоун? Какого Тартара ты мне мешаешь? Тебе больше нечем заняться? Считать деньги, купаться в самодовольстве или пытаться окончательно развалить Грифонстоун?\n\n— Вежливо и остроумно, как всегда, Графф, — отметил Голдстоун. Без разрешения он вошёл и уселся на стул. — Но я пришёл не обсуждать ваши манеры. Нам нужно поговорить, канцлер.\n\n— Ну-ну... Не помню, чтобы ты когда-либо называл меня канцлером... Неужто всё так серьёзно? Ладно, ты уже испортил мне день, так что можешь сказать, что тебе от меня нужно.\n\n— Всё просто. Пересмотрите решение насчёт похода на Блэкхоллоу. Мы не можем больше ждать, иначе... Они уничтожат нас, если мы не ударим первыми, понимаете? Сейчас или никогда, канцлер.\n\n— Дай подумать, Голдстоун... — Дедушка постучал ручкой по столу, — Нет. Я не доверяю тебе, не доверяю твоим наёмникам и... — старый грифон откинулся на спинку стула, — ...и этого достаточно. Хватит мне мешать. Убирайся отсюда!\n\n— Ты... — перья на голове Голдстоуна встали дыбом, — Ты проклятый маразматик! — пронзительно закричал он и прыгнул вперёд. Кипы отчётов взлетели со стола и превратились в облака бумаги, среди которых сцепились два грифона. Нож блеснул в когте Голдстоуна и он повалил Дедушку. Началась борьба. В припадке ярости Голдстоун отчаянно пытался пырнуть Граффа, но безуспешно. Лорд владел ножом из лап вон плохо, промахиваясь и лишь царапая крылья и когти Граффа. Внезапно, старик вцепился в его запястье. Годстоун напряг каждый мускул своей лапы, но к его ужасу, Графф начал отталкивать нож. Голдстоун отчаянно дёрнул запястьем, надеясь порезать старого грифона, однако тот резко клюнул его в морду, оглушив на несколько секунд... Последнее что он увидел, когда пришёл в себя – как разъярённый канцлер замахивается на него чем-то большим... Мгновение спустя о голову нападавшего вдребезги разлетелся стул. Графф с презрением посмотрел на бездыханного Голдстоуна, перевел дух, пнул его разок и заорал: "Стражу сюда, Маар вас подери!""
griffonstone.012.a:0 ""В темницу его!""
griffonstone.017.t:0 "Откровение"
griffonstone.017.d:0 "Несколько дней после неудавшейся попытки убийства стали долгожданным перерывом, во время которого Галлус был свободен от большинства своих обязанностей. Доктор прописал Дедушке отдых – и как бы ни был расстроен этим фактом старый упёртый грифон, он решил подчиниться. Наконец, Галлусу было приказано навестить Граффа в его разрушающемся доме. Молодой грифон постучал в дверь и в ответ услышал,\n\n— Если ты уличный торговец или проповедник, то убирайся! Мне не нужен набор горшков, и я не "желаю поговорить о богах"! Галлус вздохнул и вошёл внутрь. Дедушка Графф сидел в кресле, почти таком же старом, как и он сам, перед горящим камином.\n\n— А, это ты, Галлус. Молодец, почти не опоздал. Командующий Силами обороны весьма доволен твоей нынешней работой, и поэтому я решил назначить тебя управляющим некоторых бывших поместий Голдстоуна. Наконец-то у меня возник повод отправить этого идиота в темницу, а тебе не помешал бы опыт управления землями.\n\n— Но я никогда не управлял чем-либо, кроме себя самого! — возразил Галлус, — Это же серьезная должность. Не лучше ли назначить кого-то опытного? Кроме того, что, если я просто не хочу быть клерком и выполнять за вас всю эту работу? Я устал, я ухожу. У меня есть кое-какие сбережения, их должно хватить, чтобы купить билет обратно в Эквестрию или хоть куда-нибудь подальше от этого умирающего города. — Галлус развернулся и направился к двери.\n\n— Постой. — Дедушка Графф отреагировал, на удивление, спокойно. — Я понимаю, что тебе тяжёло, но, поверь мне, тебе это понадобится...\n\n— Понадобится? Для чего?\n\n— Возможно... — Дедушка сделал короткую паузу. Сейчас он выглядел очень слабым и дряхлым, словно весь тот огонь гнева и злобы, который питал его всё это время, медленно затухал. — Да... Наверное, время уже пришло... Ты же знаешь, почему я взял тебя под опеку?\n\n— Да, знаю. Мой дед был твоим другом, хотя я до сих пор не верю, что ты мог с кем-то дружить, и когда моя мать умерла, ты почтил память своего друга, приютив меня.\n\n— Да, твой дед... был хорошим грифоном, и для меня честь, что я могу называть себя не только его слугой, но и другом. — Дедушка тепло улыбнулся.\n\n— Подожди, у тебя маразм разыгрался? Он был сапожником из Вонзитца, так же как и моя мать, а ты был офицером Королевской Гвардии.\n\n— Я говорю про твоего деда по отцовской линии, Короля Гуто Грифонстоунского. — Галлус молча взглянул на Граффа. Затем его лицо исказилось..."
griffonstone.017.a:0 "...и он громко рассмеялся."
griffonstone.013.t:0 "Наследник павшей династии"
griffonstone.013.d:0 "Галлус положил лапу на живот,\n\n— Это... Это совершенно нелепо! Ты окончательно свихнулся! Мне говорили, что ты давно сошёл с ума, но до этого момента у меня ещё были сомнения! — Довольно скоро Галлус успокоился. Всё это время Дедушка не кричал и никак не жестикулировал, он просто ждал – Галлус никогда в жизни не видел, чтобы он был так спокоен и уравновешен. Кусочки пазла в его голове начали складываться. С какой стати Дедушке Граффу, на вид злобному и сварливому грифону, было не плевать на сироту из Вонзитца? Галлус никогда не понимал, почему он взял его под опеку, и ведь при всех его недостатках, Дедушка действительно заботился о нём. Галлус никогда не голодал, он получил прекрасное образование, Дедушка даже отправил его в Эквестрию ради этого...\n\nНо... в этом нет никакого смысла, ты всегда говорил мне, что не знал и не интересовался тем, кто был моим отцом, поскольку у тебя было много более важных дел, — например геморрой...\n\n— Обрыв линии Гуто был очень удобен властолюбивым, жадным до богатств королевства дворянам. Ты ребёнок некоронованного принца и сапожницы из Вонзитца. Лишь несколько грифонов знали, какая кровь течёт в твоих жилах, а сейчас, вероятно, остался только я. Никто бы не поддержал твои притязания, когда ты был ещё птенцом, но многие хотели бы твоей смерти. Было безопаснее скрывать твоё происхождение. Но сейчас... Я старый. Слишком старый и уставший, чтобы сделать что-то хорошее для Грифонстоуна. Я пытался, всю жизнь пытался, но раз за разом терпел неудачу. Но ты... Ты законный король Грифонстоуна, и возможно, единственный, кто может что-то изменить. Я знаю, что прошу о слишком многом. Но чтобы восстать из пепла, королевство нуждается в короле. В тебе, Галлус.\n\nГаллус молчал несколько минут. Все эти годы он считал себя просто несчастным сиротой, никем без будущего и прошлого, грифоном, который вряд ли когда–нибудь достигнет чего-то значимого. Всего лишь обузой для Дедушки. Он думал о Грифонстоуне, своем доме – в отличие от Граффа, он никогда не видел его дней славы, только дни страданий. Он видел здесь только разруху без надежды на улучшение. Все эти внезапные знания и ответственность были просто ошеломляющими..."
griffonstone.013.a:0 ""Я... Я сделаю всё, что в моих силах.""
griffonstone.013.b:0 ""Прости, но это не моё будущее...""
griffonstone.014.t:0 "Новое начало"
griffonstone.014.d:0 "— Главное, чему я научился в Эквестрии... Заключается в том, что ни короли, ни магические артефакты не меняют мир к лучшему. Это делают грифоны, пони... Когда существа этого мира действуют сообща, как друзья, они могут построить новое, счастливое будущее. Ты вспоминаешь дни былой славы, Дедушка... Но всё это прошло. Этому никогда не вернуться, этому нет места в этом новом мире, в этом новом веке, и мы не можем повернуть время вспять. Эпоха королей прошла, и один грифон не изменит Грифонстоун. Я не изменю Грифонстоун. Всю свою жизнь я прожил без прошлого... Но я хочу, чтобы у меня было будущее. Мое собственное будущее, созданное мной, а не моим происхождением. Задача всех грифонстоунцев — восстановить свою страну; мы все должны это сделать, вместе. Спасибо, что сказал мне правду, теперь я знаю свое прошлое... Но я не хочу, чтобы оно определило моё будущее. Мне жаль.\n\nДлительное время лишь потрескивание огня нарушало тишину. Наконец, Дедушка Графф тихо вздохнул и снова посмотрел на молодого грифона.\n\n— Я не могу заставлять тебя, Галлус. Я прожил свою жизнь и хочу, чтобы ты прожил свою. В конце концов, моя главная задача – исполнять волю моего короля. И если ты хочешь, чтобы всё было так..."
griffonstone.014.a:0 ""...то пусть будет так.""
griffonstone.015.t:0 "Смена караула"
griffonstone.015.d:0 "Впервые было так, что не Гильда заставила Дедушку Граффа провести с ней встречу – к её удивлению, сам Графф её назначил. И вот, как обычно, она вошла в его кабинет без стука. Кабинет, обычно напоминавший мастерскую плотника со всей мебелью и украшениями, которые старый грифон втащил сюда за многие годы, теперь был почти пуст. Там были только Графф и стол, за которым он сидел.\n\n— "Гильда." — он как-то выдавил из себя её имя почти без отвращения, — Наконец-то! Я уже боялся, что умру от старости, пока жду тебя!\n\n— Я бы не удивилась, — ответила Гильда, — Соскучился по нашим "маленьким" спорам?\n\n— Нет, это было бы все равно что соскучиться по ревматизму. Но давай сократим этот разговор. Благодаря дотошной "работе" Голдстоуна по сбору компромата на различных членов совета, у меня оказалось более чем достаточно причин изгнать их всех... Они, кстати, уже сбежали из города, опасаясь преследования. Поскольку в нём осталось не так уж много грифонов, я решил распустить совет, уйти с поста канцлера и сдать должность регента Грифонстоуна. Называй себя как хочешь – президент, премьер-министр – мне всё равно. Ты годами донимала меня передачей власти гражданам, а теперь я даю тебе возможность это сделать. Только не смей сделать так, что я об этом пожалею. Есть вопросы?\n\nУ Гильды отвис клюв. На мгновение она вошла в такой глубокий шок, что не могла ничего ответить, но наконец выкрикнула одно единственное слово:\n\n— Чего?!\n\n— Это не очень конкретный вопрос, а моё время дорого. Я жажду поскорее уйти на заслуженную пенсию.\n\n— Но почему сейчас?! Почему я?\n\n— У меня был очень... поучительный разговор с одним грифоном. Я всё равно думал оставить свой пост кому-то другому. Да кому угодно, кто хоть немного лучше Маара, понимаешь? Ты, может, и наглая, неуважительная птичка, но по крайней мере, кажется, разбираешься во всей этой демократии. Не облажайся, Гильда, или я надеру тебе зад, даже если ради этого мне придётся восстать из мёртвых. — Дедушка Графф угрожающе потряс когтем.\n\n— Только попробуй, старый хрыч! — ответила Гильда.\n\n— Ну, ладно, секретари в курсе, как и Королевские Силы Обороны. Никто не возражает, они будут выполнять твои приказы. Все необходимые документы на столе. — Графф указал на папку с бумагами. Он встал и подхватил стул, — И это я забираю, я принёс его из дома! Удачи, Гильда..."
griffonstone.015.a:0 ""...она тебе понадобится.""
griffonstone.119.t:0 "Угроза Грифонстоуна"
griffonstone.119.d:0 "В последние годы новый правитель королевства Грифонстоун, [Root.GetLeader], практически воссоздал страну из пепла – давно утраченные земли были отвоеваны, город Грифонстоун модернизирован и заселён заново. И теперь [Root.GetLeader] стремится вернуть Грифонстоун и Герцланд под свой контроль. Военная кампания против наших соседей из Герцланда уже началась, и очевидно, что скоро они придут за нами. Стоит ли нам предотвратить это или переждать бурю?"
griffonstone.119.a:0 "Враг моего врага..."
griffonstone.119.b:0 "Поживём – увидим".
griffonstone.121.t:0 "Угроза Грифонстоуна"
griffonstone.121.d:0 "В последние годы новый правитель королевства Грифонстоун, [Root.GetLeader], практически воссоздал страну из пепла – давно утраченные земли были отвоеваны, город Грифонстоун модернизирован и заселён заново. И теперь [Root.GetLeader] стремится вернуть Грифонстоун и Герцланд под свой контроль. Военная кампания Грифонстоуна уже уничтожила одного из наших соседей из Герцланда, и очевидно, что скоро придут и за нами. Стоит ли нам предотвратить это или переждать бурю?"
griffonstone.121.a:0 "Враг моего врага..."
griffonstone.121.b:0 "Поживём – увидим."
griffonstone.120.t:0 "[FROM.GetName] объявляет нам войну"
griffonstone.120.d:0 "Похоже, наша кампания по завоеванию Сердца Империи возродила патриотизм в старых вассальных государствах — после нашего недавнего объявления войны, [FROM.GetName] объявил нам войну в ответ."
griffonstone.120.a:0 "Это временные трудности..."
griffonstone.200.t:0 "Шахты Соларспайка"
griffonstone.200.d:0 "Гора Соларспайк считается одним из самых священных мест грифоньего рода – согласно мифам, именно здесь боги создали первых грифонов. Однако известно, что в непосредственной близости от нее находятся крупные месторождения полезных ископаемых. Их добыча может помочь нашей экономике восстановиться и вернуть былое величие Грифонстоуну, однако священники и многие набожные грифоны считают обширную добычу в этом районе богохульством. Когда о наших планах стало известно общественности, мы столкнулись с протестами, а в некоторых случаях даже с небольшими беспорядками. Теперь нам нужно сделать выбор – рискнем ли мы еще больше разозлить наше население, отдав приказ о проведении масштабных работ по добыче полезных ископаемых, или успокоим духовенство, ограничив их?"
griffonstone.200.a:0 "Копайте глубже!"
griffonstone.200.b:0 "Копайте неглубоко."
griffonstone.201.t:0 "Время Изменений"
griffonstone.201.d:0 "Этим утром в зале совета царила атмосфера напряженности и едва скрываемого волнения. После заключения Голдстоуна в тюрьму, многие члены совета встретились с канцлером и получили от него предложение, от которого невозможно отказаться. Документы, полученные из резиденции Голдстоуна, содержали очень интересную информацию – переписки, которые могли бы легко отправить большинство из них в тюрьму за сотрудничество с предателем, и другие компрометирующие материалы, которые Голдстоун собирал годами, чтобы использовать для шантажа. Члены совета с огромным удовольствием разорвали бы эти бумаги на кусочки. Однако, поскольку все они были у канцлера, их единственной надеждой было следовать его приказам. Сначала заседание шло в обычном русле: обсуждались незначительные вопросы, по которым члены совета могли поспорить. Через несколько минут дедушка Графф постучал когтем по столу, чтобы привлечь внимание совета.\n\n— Уже поздно, и я устал от этого собрания, поэтому давайте перейдем к делу. Некомпентентность, которая привела к нападению Голдстоуна, доказала, что этот совет не способен работать на благо страны. Этот подлый заговорщик пытался захватить власть, и, учитывая то, сколько из вас проголосовало за предложение, которое позволило бы ему привести армию наемников в столицу, стало очевидно, что совет готов пропустить даже самую дурацкую идею. Итак, чтобы предотвратить подобное в будущем, у меня есть предложение... Галлус! — Дедушка повысил голос — Принеси документы!\n\nМолодой грифон открыл двери в зал совета и внёс кипу бумаги. Долгое время единственным звуком, который можно было услышать, был шелест страниц, пока лорды просматривали документы.\n\n— Это неприемлимо! — Гестал первым закончил читать, — Ты хочешь забрать у нас власть и превратить совет в исключительно совещательный орган...\n\n— Да! — Графф быстро перебил его, — Сейчас от совета столько же пользы, сколько от язвы желудка. Он лишь вредит Грифонстоуну! — Графф зловеще посмотрел на дворян, словно напоминая им о компромате на большинство из них — Давайте голосовать!\n\nДля Гестала и других незамешанных в заговоре грифонов, результаты были шокирующими – предложение Граффа было принято, пускай и с небольшим перевесом.\n\n— Хорошо. — Дедушка улыбнулся, — Теперь, когда все улажено, мое первое решение - найти подходящую замену Голдстоуну. Поскольку теперь я назначаю членов совета, я выбираю своего протеже Галлуса. Нам нужна свежая кровь. На сегодня это все, джентльгрифы."
griffonstone.201.a:0 "Можете идти домой."
griffonstone.202.t:0 "Наследник"
griffonstone.202.d:0 ""Граждане Грифонстоуна, невозможно отрицать, что мы живем в эпоху раздоров и войн. Когда-то Грифонстоун был маяком процветания и стабильности в Грифонии, но теперь наши враги, подобно стервятникам, готовятся напасть на нас. Чтобы защитить нашу нацию, Королевские Силы Обороны должны быть мобилизованы и расширены. Командование оборонительными и наступательными операциями будет передано члену совета – Галлусу".\nВышеупомянутый Галлус закончил читать текст объявления, которое дедушка собирался вскоре публично зачитать, и вздохнул, \n\n— Ты ведь знаешь, что у меня нет ни малейшего – буквально – ни малейшего представления о том, как командовать войсками? Всё, что я вынес из собраний Высшего командования, – это понимание того, насколько всё сложно.\n\n— Тебе не нужно ничего в этом понимать, поскольку ты, фактически, и не будешь управлять войсками. Я же хочу, чтобы они вернулись живыми! — Дедушка Графф был сегодня в своем обычном раздражённом настроении — Может быть, ты и знаешь об этом столько же, сколько вингбардийцы знают о хорошем пиве, но если уж ты хочешь, чтобы тебя признали правителем, потребуется нечто большее, чем просто благородная кровь. Военные достижения - хороший вариант. Как ты думаешь, почему каждый желающий стать диктатором носит форму?\n\n— Ладно... Но пожалуйста, не заставляй меня носить пафосный мундир с кучей медалей. Меня это смущает. — ответил Галлус. \n\n— С твоим отношением к делу не поможет даже форма фельдмаршала! Если ты хочешь быть королём, достойным уважения, ты должен научиться..."
griffonstone.202.a:0 ""Началось...""
griffonstone.203.t:0 "Грифонстоун предлагает вернуть Арантигу"
griffonstone.203.d:0 "Недавно, после успешного переворота, Арантига вышла из Карфинского пакта и начала агрессивную милитаризацию. Однако это государство-изгой потерпело поражение от грифонстоунцев, которые разбили армию барона Фезерина. Грифонстоун, однако, не хочет забирать землю Арантиги себе, вместо этого предлагая передать ее нам в обмен на пакт о ненападении. Принять это предложение — значит отвергнуть амбиции многих вингбардийских дворян, которые хотят завоевать Дом Грифонов..."
griffonstone.203.a:0 "Давайте договоримся."
griffonstone.203.b:0 "У нас есть свои планы на них..."
griffonstone.284.t:0 "Странное приглашение"
griffonstone.284.d:0 "Прошло довольно много времени с тех пор, как Гильда в последний раз посещала старый королевский дворец – после неудавшегося покушения, дедушка Графф постоянно работал над управлением страной, и у него не было времени спорить с ней. Она была постоянно занята, пытаясь удержать свое движение от распада. Действительно, казалось, что жизнь в Грифонстоуне начала стремительно улучшаться, в результате чего популярность республиканских идей резко упала. Однако теперь Графф сам пригласил её на встречу – вероятно, впервые в своей жизни. Она удивилась ещё сильнее, когда увидела, что в кабинете канцлера ее ждал не только Дедушка, но и его юный протеже Галлус.\n\n— Я здесь. Чего ты хочешь? — Гильда даже не поздоровалась с Граффом, — Я очень занята, разве не знаешь? Сегодня мне нужно приготовить большую порцию булочек. Некоторые из нас здесь работают, в отличие от тебя.\n\n— Её выпечка теперь даже съедобная, так что она и правда делает что-то вместо того, чтобы усугублять наши страдания. — добавил Галлус, за что Гильда кинула на него презрительный взгляд.\n\n— Я пригласил вас не для того, чтобы обсуждать ваши сомнительные поварские навыки. Разве я похож на участника кондитерского фестиваля? Мы живем не в городе пони! Кхм... Что я хотел? Ах, да, тут были две пони, доставлявшие неприятности, и каждая раздражала меня по-своему, как могут только пони...\n\n— Эй! Одна из этих пони - моя подруга! — возмутилась Гильда.\n\n— Неважно. Важно то, что они пытались вернуть Идол Борея, а ты им помогала. Я хочу знать, что там произошло, и действительно ли вы видели Идол.\n\n— Да, я видела его за мгновение до того, как он окончательно провалился в пропасть. Это безнадежно. Камни хрупкие и в любой момент могут осыпаться, а ветер настолько силён, что там невозможно летать."
griffonstone.284.a:0 "Спускаться за Идолом – это самоубийство!"
griffonstone.204.t:0 "Путешествие начинается..."
griffonstone.204.d:0 "Гильда зевнула\n— Кроме того, это всего лишь старый кусок золота, он уже несколько столетий ни на что не способен.\n\n— Появление Идола – лучшее что случалось в Грифонстоуне! — Дедушка повысил голос, — Это мощный символ, объединивший наш вид, к тому же, подарок самого Борея!\n\n— Боги... Опять эта история... Да он бесполезен! — Гильда говорила очень медленно, делая большие паузы между словами, — Сколько раз я должна повторять... нам нужны грифоны, работающие сообща ради лучшего будущего, а не какая-то древняя безделушка! Это безнадёжно. Нам больше не о чем разговаривать...\n\n— Гильда. Прошу... — Галлус прервал её на последней фразе, — Нам очень нужна информация. Мне нужен Идол. Пожалуйста.\n\n— Подожди... — Гильда некоторое время собиралась с мыслями, — Ты собираешься туда спуститься?! Галлус, ты сошёл с ума? Нет, нет. Во всём виноват этот маразматик... — она посмотрела на Граффа, — Ты окончательно свихнулся. Я понимаю, тебе было тяжело после гибели короля, но посылать его... — она указала когтем на Галлуса, — ...в бездну, чтобы он попытался вернуть Идол? Ты собираешься отправить его на смерть, чтобы исправить свои ошибки?\n\n— Нет, Гильда. — спокойно ответил Галлус, — Это моя идея, а не его. — Прежде чем она успела что-то сказать, он продолжил, — Мне нужен Идол, чтобы подтвердить своё право на трон. Что бы я ни делал, никто не примет меня как нового короля. Если я сделаю так, то начнётся гражданская война. Но вот с Идолом...\n\n— Трон?! Король?! — сказать, что Гильда была сбита с толку – значит ничего не сказать. Внезапно, она всё поняла – все её подозрения подтвердились. — Ты должно быть шутишь! Ты сказал ему, что он последний Гуто? — она пыталась удержать спокойствие, но из неё вырвался смех. Галлусу, казалось, было немного стыдно за всё это, а Дедушка спокойно ждал, пока она перестанет дурачиться, — Парень, это может показаться грубым, но такова правда – он втирает тебе какую-то дичь. — сказала она Галлусу, — Он давно сошёл с ума от вины и теперь выбрал случайного сироту чтобы делать вид, что он, то есть ты, сын его сюзерена. Мы не в сказке, такова реальность – жестокая и беспощадная.\n\n— Я... Может быть, ты права. — Галлус опустил голову, — Но я верю, что он говорит правду. И я уверен, что без Идола мы не сможем восстановить нашу страну. Я должен попытаться.\n\nПромолчав несколько долгих минут, Гильда повернулась к Дедушке, — Графф, если он умрёт, клянусь, я скину тебя в эту самую бездну за невероятный идиотизм и убийство птенца..."
griffonstone.204.a:0 "...а теперь слушайте."
griffonstone.205.t:0 "Коронация"
griffonstone.205.d:0 "Дворец Гуто был полон грифонов – существа толпились не только в тронном зале, но и во внутреннем дворе и на прилегающей к нему площади. Впервые за более чем тридцать лет – впервые в жизни большинства собравшихся грифонстоунцев – шла коронация нового правителя. Поначалу, когда грифоны услышали о возвращении Идола, многие отнеслись к этому с недоверием – но все, кто видел его вживую, осознавали, что это не подделка – один только вид артефакта наполнял их сердца радостью и гордостью. Никто не надеялся, что Идол когда-нибудь снова вернется в Грифонстоун, как и новый законный король.\n\nГаллус немного нервничал, но, тем не менее, старался вести себя достойно – то есть так, как он представлял себе королевское поведение, – сохраняя строгий вид и гордую осанку. Однако после нескольких минут церемонии, Графф тихо обратился к молодому грифону и попросил его расслабиться, поскольку он выглядел так, словно "страдал от особенно мучительного запора". Галлус повиновался.\n\nСвященники во главе с прелатом Грифонстоуна долго проводили древние обряды. Гильда, стоявшая рядом с троном, с трудом сдерживала зевоту. Наконец церемония достигла своей кульминации. Бывший регент Графф передал корону прелату, который возложил её на голову Галлуса.\n\n— Во имя богов, я короную Вас королем Грифонстоуна. Да дарует Вам Борей мудрость, чтобы править справедливо, да наполнит Вас Арктурий силой и рыцарской доблестью, чтобы защитить Королевство от врагов и да благословит Вас Эйр, чтобы правление Ваше было долгим и щедрым. — Прелат Сильверфезер завершил древнюю молитву. Галлус сделал глубокий вдох и поднялся с трона. Настало время его речи.\n\n— Жители Грифонстоуна... Мои друзья... Для нас это было трудное время. С тех пор, как Идол был потерян, жизнь стала борьбой. Это было очень тяжело, но мы выстояли. Теперь мы сильны, сильны и едины. Нас ждёт долгий, не менее тяжёлый путь, но я верю... Нет! Я знаю, что мы справимся! Прошлые трудности лишь сделали нас сильнее. Наше королевство вступает в новую эпоху, и я клянусь вам: я сделаю все, что в моих силах, чтобы защитить наш дом и сделать его лучшим местом для жизни в Грифонии! Да Здравствует Грифонстоун! \n\n— Да Здравствует Король! — крикнул в ответ кто-то из толпы. Спустя мгновение к нему присоединились остальные. Казалось, что древний тронный зал буквально трясло от сотен голосов грифонов, звучавших в унисон.\n\nДедушка Графф вытер скупую слезу. Наконец-то, после всех этих лет... Он выполнил своё обещание. Старый грифон улыбнулся и присоединился к ликованию."
griffonstone.205.a:0 "Да здравствует Король Галлус Первый!"
griffonstone.206.t:0 "Король и Император"
griffonstone.206.d:0 "С тех пор как пала Имперская столица, передвижения Гровера были ограничены пределами дворца, и каждый раз, когда он выходил из своих покоев, за ним следовал по крайней мере один стражник. Охранники утверждали, что они были назначены только для его безопасности – город был опасен, группы бандитов использовали хаос, последовавший за осадой, чтобы расширить сферу своей деятельности, – и борьба с ними займёт некоторое время. Все, что мог сделать Гровер – это ждать. Солдаты утверждали, что скоро прибудет "Его Высочество", и каждый раз, когда они упоминали своего правителя, они почему-то очень волновались...\n\nЭтот день был похож на предыдущие. Гровер решил провести время за чтением – книги помогали ему хотя бы ненадолго забыть о плачевной (как ему казалось) ситуации, в которой он оказался. Вдруг, он услышал едва различимый стук в дверь. Думая, что это служанка, принёсшая завтрак, или очередной солдат, пришедший проверить всё ли с ним в порядке, Гровер сказал, не отрываясь от чтения: "Входите". Двери открылись и какой-то грифон вошёл внутрь. \n\n— Интересная книга, Ваше Величество? Я никогда особо не любил читать; предпочитал вляпываться в неприятности. Книги всегда ассоциировались у меня с лекциями старого грифона, который присматривал за мной... \n\nГровер поднял голову и увидел молодого желтовато-голубого грифона. В нём, на самом деле, не было ничего необычного кроме... того, что Гровер никак не мог объяснить – ему казалось, что тело этого грифона источало свет... Странное чувство, однако, быстро исчезло.\n\n— Да, это довольно увлекательно. — император вежливо ответил, — И, могу ли я узнать ваше имя?\n\n— Ох, я забыл представиться, меня зовут Галлус. А Вы, должно быть, Гровер Грифонстоунский? Я всегда плохо разбирался в династиях, прошу меня простить, если я ошибся. — он слегка улыбнулся, словно извиняясь за возможную ошибку,"
griffonstone.206.a:0 "Приятно познакомиться."
griffonstone.286.t:0 "Новый путь"
griffonstone.286.d:0 "— Взаимно, сэр. — Император на самом деле не был уверен, что говорить в такой ситуации, поэтому решил придерживаться классической вежливости. \n\n— Что-же... — Галлус был явно встревожен, — Я могу только догадываться, что тебе рассказывали обо мне...\n\n— Не так много. То, что ты узурпатор, который занял трон павшей династии, обманув грифонов подделанным идолом. — Гровер начал гневаться, — А теперь ты захватил мой дом. — закончил он, холодным тоном.\n\n— Уф... — Галлус поморщился, — обо мне действительно так плохо говорят в Грифенхейме? Если честно, Гровер, я сам не уверен, узурпатор я или законный король. Всё, что у меня есть – слова старого грифона... Но Грифонстоуну нужен был король, чтобы справиться со всем тем кошмаром, что начался после потери идола. Поэтому, я старался изо всех сил. Да и в целом, в Грифонии ведь много ещё таких мест, как Грифонстоун...\n\n— Почему ты разговариваешь со мной об этом? Разве ты не должен просто узурпировать трон и назвать себя новым императором? Как владелец "Идола" и "наследник Гуто", ты спокойно можешь это сделать. — Гровер даже не пытался скрыть сарказм.\n\n— Ну... Я думал об этом. И понял, что не хочу этого. Это просто неправильно... Знаешь, когда я нашёл Идол... Я понял одно – слова про то, что он олицетворяет необходимость единства Грифонии – это ложь... По крайней мере, способ достижения этого единства был ложным. Мне кажется, что объединение грифонов силой лишь запустит ещё один цикл насилия и войн. И этот сияющий артефакт должен всё это остановить. Даже если я, или ты, воссоединим Империю, она вновь развалится через пару столетий... Думаешь гордые Аквелийцы, Вингбардийцы или минотавры примут иностранца как своего правителя? В конце концов потребуется ещё одна жестокая объединительная война, ещё более разрушительная... Это замкнутый круг, Гровер. — Галлус вздохнул, — Старое должно умереть, чтобы дать дорогу чему-то новому и лучшему. Миру, где грифоны следуют за нами потому что хотят, а не потому что должны, миру, где мы относимся к другим не как к подчинённым, а как к союзникам и друзьям. Империя умерла, пытаться её восстановить – всё равно что пытаться оживить труп. Я верю, что можно сделать что-то получше. И мне не помешала бы твоя помощь. Что думаешь об этом?\n\nГровер осознал, что в словах узурпатора есть смысл,"
griffonstone.286.a:0 "— Наверное ты прав..."
griffonstone.207.t:0 "Ничто не вечно. Даже Империя..."
griffonstone.207.d:0 "Новая гробница императора Гровера находилась недалеко от Императорского Дворца, который теперь стоял почти заброшенным. Дворец ныне был бесполезен, поскольку столицей должен был остаться Грифонстоун. Лишь горстка стражников и слуг осталась присматривать за ним. Галлус думал превратить его в музей – без использования такое великолепное здание придёт в упадок. Однако, в любом случае, это была проблема, с которой можно будет разобраться позже. Множество грифонов пришло на похороны – хотя Империя и встретила свой бесславный конец, смерть сделала Гровера VI символом потерянных надежд на будущее, и эпохи, которая никогда не вернётся. И вот толпы жителей Имперского Города вышли проводить своего птенца-императора в последний путь. Прошло несколько дней, и Галлус решил ещё раз посетить гробницу, прежде чем покинуть город. Стоя над гробом, он услышал шаги – кто-то шёл. Он обернулся и увидел лорда Гестала.\n\nСам лорд почти не изменился, но выглядел очень усталым. Он поклонился и обратился к Галлуcу:\n\n— Мой король. — Затем подошёл к гробу. Они стояли над ним минуту, не проронив ни слова. Когда они вышли из гробницы, Гестал заговорил:\n\n— Позвольте мне спросить, мой король, планируете ли вы занимать трон? Должен предупредить вас, что после смерти императора Гровера герцогиня Иглкло будет считаться законной наследницей. В таком случае...\n\n— Нет. — Галлус прервал его — Я не планирую. Император мёртв, как и Империя. Всё кончено, господин... И прежде чем вы начнёте говорить о моём долге, прошу, задумайтесь: мы оба только что видели, чем заканчивается эта жажда власти над Грифонией – безумцами, убивающими птенцов. Объединённая Грифония – благородная мечта, которая, однако, обречена закончиться кошмаром. Вы говорите только о прошлом, Гестал. Нам нужно двигаться вперёд. И я пойду вперёд. А Вы? Прошу, не сражайтесь за безнадёжное дело, найдите другой смысл в своей жизни. — Галлус закончил свою речь — А теперь мне нужно идти. Я должен ещё многое сделать, прежде чем покинуть Грифенхейм. — Галлус даже не стал дожидаться ответа Гестала, он просто ушёл. Лорд смотрел ему вслед, погруженный в свои мысли. Он чувствовал себя старым и усталым – как никогда раньше. Неужели он потратил большую часть своей жизни... напрасно? Он не мог ответить на этот вопрос. Гестал тяжело вздохнул, бросил последний взгляд на могилу и тихо сказал:"
griffonstone.207.a:0 "— Спите спокойно, мой Император..."
griffonstone.208.t:0 "Грифоны в панэквестрийских исследованиях?"
griffonstone.208.d:0 "Недавно созданное королевство Грифонстоун-Герцланд хочет участвовать в нашей совместной исследовательской инициативе. Под руководством Галлуса, бывшего ученика Школы Дружбы в Понивилле, Грифонстоун принял идеалы гармонии и стремится к более тесным связям с нами для дальнейшего реформирования своей страны. Примем ли мы их просьбу?"
griffonstone.208.a:0 "Конечно, принимаем!"
griffonstone.208.b:0 "Думаю, нет..."
griffonstone.209.t:0 "Торговое соглашение с грифонами?"
griffonstone.209.d:0 "Королевство Грифонстоун-Герцланд только что предложило подписать новое соглашение, в рамках которого обе стороны снижают пошлины и стимулируют торговлю. Предложение выглядит многообещающим, поскольку Грифония — это, по-видимому, ненасытный рынок для наших товаров..."
griffonstone.209.a:0 "Много битов не бывает."
griffonstone.209.b:0 "Давайте не будем торопиться..."
griffonstone.210.t:0 "Союз с Грифонстоун-Герцландом"
griffonstone.210.d:0 "Хорошие новости из из Грифонии! Мы только что получили очередное предложение о сотрудничестве от Грифонстоун-Герцланда — они предлагают взаимные гарантии независимости для сдерживания любого потенциального врага и, надеемся, обеспечения мира на обоих континентах."
griffonstone.210.a:0 "Да!"
griffonstone.210.b:0 "Это слишком..."
griffonstone.211.t:0 "Кукловод"
griffonstone.211.d:0 "Грифон на троне внимательно посмотрел на императора и, не дожидаясь ответа, добавил: "Он выглядит гораздо менее впечатляюще, чем я думал. Просто испуганный птенец.\n\n— Я не просто птенец! Я Император Грифонии. — Гровер попытался принять царственную позу.\n\n— Ах да, моё императорское величество, какая честь, — усмехнулся старший грифон; его взгляд был холодным и расчётливым. — Я никогда не встречал Гровера до сих пор, а если будете плохо себя вести, другие грифоны тоже не смогут... Мы ясно друг друга поняли? — После короткого колебания Гровер кивнул. Угроза была более чем очевидна. — Я лорд Голдстоун, регент Грифонстоуна, а теперь и Герцланда. Кстати, юный император, должен сказать, ваш трон гораздо удобнее того, что был у меня в Грифонстоуне...\n\n— Можем ли мы обсудить что-то более существенное, чем мебель? — взмолился Гровер. На мгновение Голдстоун выглядел удивленным. Затем он рассмеялся... \n\n— Мне следовало бы рассердиться на тебя, юный император, за то, что ты меня перебил, но ты напомнил мне об одном разговоре, который состоялся много лет назад в Грифонстоуне. Это очень приятное воспоминание... В благодарность за то, что ты меня позабавил, я перейду к делу. Империя Грифонов умрёт, её дни давно прошли. Вместо этого будет создана Империя Грифонстоуна, и ты, как родственник рода Гуто, будешь коронован её первым императором. Конечно, пока я жив, я буду править. И я планирую прожить долгую и благополучную жизнь. Ты будешь махать толпам и открывать железные дороги... И не думай, что сможешь меня перехитрить, я сражался с грифонами гораздо умнее тебя и победил. И прежде чем ты вздумаешь рассуждать о своём божественном праве на трон, предупреждаю тебя: это предложение я сделаю только один раз. Ты можешь отказаться, и вскоре с тобой случится что-нибудь ужасное. Так что подбирай слова с умом.\n\nГровер не собирался спорить. Он чувствовал себя маленьким, одиноким и слабым. Он был словно кролик, пойманный волком: один щелчок – и всё кончено. Он слышал кое-какие слухи о Голдстоуне от своих слуг: он был деспотом, пришедшим к власти кровопролитием и заговорами, и мало что можно было сделать – по крайней мере, пока. Через минуту Гровер тихо сказал:"
griffonstone.211.a:0 "— Я... Согласен."
griffonstone.283.d:0 "С самого начала осады Гровер был заперт в своих покоях – сначала для обеспечения безопасности, затем, чтобы не сбежать от своих захватчиков. Сама осада казалась ему кошмаром – сначала он видел огонь и дым, доносившиеся издалека, и слышал приглушенные звуки артиллерийских залпов, позже, когда захватчики достигли внутренних районов Грифенхейма и атаковали сам дворец, хотя это было не подобающим императору действием, напуганный выстрелами и криками, доносившимися из других частей дворца, он спрятался под кроватью. Баркгинианская гвардия и оставшиеся солдаты императорской армии сражались за каждую комнату дворца... В конце концов, всё это было напрасно – со временем от них ничего не осталось, кроме безжизненных туш, опирающихся на окровавленные стены дворца и лежащих в коридорах. Теперь, когда Гровер оказался во власти завоевателей, ему оставалось лишь оставаться в своей комнате – солдаты стояли у дверей и в саду под окном, так что попытка побега была безнадежной. \n\nНаконец, после долгих дней ожидания, офицер, который обычно приносил ему еду, приказал императору следовать за ним на встречу с "важнейшим грифоном. — И Гровер последовал за ним по коридорам дворца, всё ещё изрешечённым выстрелами и осколками, но очищенным от трупов и крови. Наконец они добрались до тронного зала. Многие из дорогих украшений, которые так нравились Гроверу, отсутствовали – что-то было уничтожено в жестокой схватке, а что-то украдено неизвестными птенцу нападавшими. Трон же остался нетронутым, и на нём восседал пожилой белопёрый грифон. Вид узурпатора на троне заставил Гровера стиснуть когти, нарушив апатию, воцарившуюся во время осады. С другой стороны, старый грифон, казалось, слегка скучал и был совершенно не впечатлен этим местом, которое он теперь явно считал своим."
griffonstone.283.t:0 "Лорд и Император"
griffonstone.283.a:0 "— Это он?"
griffonstone.212.t:0 "Предложение"
griffonstone.212.d:0 "Цирилла никогда не думала, что окажется в такой ситуации – сидеть в тюремной камере и ждать бог знает чего. Она давно потеряла счёт времени, её дни были одинаковыми: сон, еда, взгляд в стену. Надзиратели были ворчливы и не слишком разговорчивы. Но в последнее время эта привычная ситуация начала налаживаться. Судя по всему, новый правитель Грифонстоуна приказал поддерживать её здоровье – как физическое, так и психическое. Иногда надзиратели приносили ей книги и, связав крылья, выводили на прогулку по двору замка. Тем не менее, её жизнь всё ещё была похожа на пытку – неизвестность и одиночество давали о себе знать, она часто рыдала по ночам.\nОднако теперь всё изменилось – надзиратели, похоже, очень нервничали, и один из них выдал причину: "Босс приезжает". Голдстоун наконец решил лично разобраться со своей пленницей. Вскоре её вывели из камеры и привели в комнату, которая, судя по обстановке, была кабинетом коменданта замка. Теперь в нём сидел лорд Голдстоун. Голдстоун откинулся на спинку стула, насвистывая какую-то весёлую мелодию, скорее всего, из аквелийской оперетты. Кроме него, в комнате стояли два суровых грифона в военной форме – его охрана. \n\n— А, графиня Блюкрест. — Голос Голдстоуна был полон фальшивой вежливости. — Нам так и не удалось встретиться. Я лорд Голдстоун, регент Грифонстоуна и Герцланда. \n\n— Г-Герцланда?" – пробормотала удивлённая Цирилла. \n\n— Ах да, я забыл, что новости нечасто доходят до этой горной крепости. Моя кампания против имперцев увенчалась ошеломляющим успехом, и теперь Грифенхейм мой. Но мы достаточно говорили обо мне, давайте поговорим о вашем будущем. Полагаю, вы хотели бы покинуть это место?" Услышав это, Цирилла начала лихорадочно кивать. — Видите ли, в отличие от некоего идиота по имени Донкло, я никогда бы не стал избавляться от полезных активов. А теперь мне нужен кто-то, кто сядет на трон, станет символом монархии... Новой империи, которую я намерен создать. Из-за... отставки Гровера мои возможности ограничены. Блюкресты когда-то были родственниками Гуто, верно? Генеалогия меня никогда не интересовала. \n\n— Да. Мой прадед женился на дочери Гуто Четвёртого.\n\n— Хм... — Голдстоун на мгновение задумался. — Могло быть и лучше, наверное, но, тем не менее, кровь не так уж важна в наше время. — Он усмехнулся. — Нет, на самом деле, важна, но в промышленных масштабах, а не в смысле родства. — Казалось, он был рад своей мрачной шутке. — Что ж, графиня Цирилла, я предлагаю вам уникальную возможность стать новой императрицей Грифонстоуна. Конечно, я уверен, вы понимаете, что это будет чисто церемониальная роль, и вы знаете, кто будет править. И всё же это, очевидно, гораздо лучше, чем...\n\n— Да, да! — перебила Голдстоуна Цирилла. — Согласна!" Она была готова согласиться на всё, лишь бы выбраться из заточения. \n\n— Отлично! Итак... Гюнтер? — Голдстоун повернулся к одному из своих солдат: "Иди к моей машине и возьми бутылку вина из багажника. Настало время для тоста..."
griffonstone.212.a:0 "...за нашу новую императрицу."
griffonstone.213.t:0 "Пиратские рейды в Селестийском море"
griffonstone.213.d:0 "Как будто нам и так не хватало проблем с борьбой с оборотнями, пираты в Селестийское море начали масштабную кампанию против нашей торговли. С каждым днем их набеги становятся все более дерзкими, серьезно ограничивая наши возможности в торговле. Экономика Эквестрии уже сильно пострадала от пиратов, и теперь нам придется реорганизовать нашу морскую торговлю, чтобы противостоять им. S.M.I.L.E. обнаружили некоторые доказательства, указывающие на то, что именно Империя Грифонстоуна несет ответственность за финансирование и укрытие пиратских флотов, однако конкретных доказательств получить не удалось, и мы пока не можем вести войну в Грифонии — наши действия пока ограничиваются защитой наших торговцев."
griffonstone.213.a:0 "Надоедливые грифоны!"
griffonstone.214.t:0 "Возвращение блудного сына"
griffonstone.214.d:0 "Только что прибыл посланник из королевства Грифонстоун. Судя по всему, правительство Грифонстоуна решило воссоединиться с Империей и оказать полную поддержку нашему крестовому походу за освобождение Грифонстоуна. Королевство едва избежало полного краха после потери Идола Борея и смерти короля Гуто. Оно страдало от нищеты, отчаяния и неэффективного управления. Однако после неудавшегося переворота, предпринятого лордом Голдстоуном, его соперник, лорд Гестал, сумел установить сильную власть над страной. Лорд Гестал, ярый сторонник Империи, много лет выступал за поддержку Имперского дела, и теперь, будучи регентом Грифонстоуна, он присягнул нам на верность."
griffonstone.214.a:0 "Прекрасные новости!"
griffonstone.215.t:0 "Новый регент"
griffonstone.215.d:0 "Сегодня лорд Гестал провозгласил себя новым регентом возрождённой Империи Грифонов. Освободив Грифенхейм, он вернул императору Гроверу VI. В то время как Гровер будет готовиться к восшествию на престол в ближайшем будущем, Гестал пока будет заботиться о делах государства.\n\nПосле военного парада победоносных солдат Грифонстоуна, Гестал обратился к гражданам Империи:\n\n— Подданные Империи, сегодня я стою перед вами не как завоеватель, а как смиренный слуга нашего любимого императора Гровера. Мы живём в тёмные века, века войн и раздоров, когда ничто не определённо, и даже величайшие могут стать жертвой заговоров негодяев и искателей славы. Но помните: ночь темнее всего перед рассветом. Слишком долго Грифония страдала от революционеров, коррумпированных олигархов и иностранных захватчиков. Но пришло время положить конец этой тёмной эпохе. Империя освободит земли грифонов и принесёт вечный мир и процветание! И я обещаю построить лучшую, более справедливую Империю для вас и для будущих поколений! Мы победим, грифоны, мы победим... Наше дело правое, победа будет за нами!"
griffonstone.215.a:0 "За Империю!"
griffonstone.216.t:0 "Проблемы с дворянством"
griffonstone.216.d:0 "Вскоре после введения новых законов Гильде пришлось столкнуться с ответом на них. Хотя Графф и очистил дворянство от наиболее радикальных элементов, оно яростно опротестовало новые законы. Потеря влияния заставила многих из них временно отказаться от привычных препирательств и объединиться под эгидой лорда Гестала. Будучи самым могущественным из оставшихся лордов, он стал фактическим лидером оппозиции. Теперь Гильде пришлось терпеть встречу с ним и несколькими его сторонниками. Поначалу, когда он сам попросил об этом, разгневанная, она хотела наотрез отказаться, но, немного успокоившись, решила хотя бы выслушать их. И вот они встретились в старом зале регентского совета, который, на присутствие нескольких грифонов, казался пустым и заброшенным. \n\n— Это возмутительно! — Гестал провозгласил — Мы, дворяне Грифонстоуна, веками правили этой страной, мы были защитниками трона и хранителями великих традиций нашей нации! А теперь вы хотите нас свергнуть! Революция разрушила Империю, а теперь она разрушит Грифонстоун. \n\n— Разрушит? — едва сдерживая гнев, спросила Гильда. — Мы уже разрушены. В основном из-за ваших действий. У вас было тридцать лет, чтобы спасти королевство. ТРИДЦАТЬ ПРОКЛЯТЫХ ЛЕТ! Чудо, что вас не смёл настоящий переворот, когда вы только позволили Грифонстоуну развалиться! На троне никого нет, а наши "традиции — сейчас посмешище всей Грифонии. Будут перемены, и вам придётся к ним приспосабливаться. Грифонстоун больше не будет вашей игровой площадкой, Гестал! Если вы не согласны, можете свободно эмигрировать в вашу любимую Империю. А теперь уходите, пока я не потеряла самообладание! — Окружение Гестала было заметно потрясено яростью Гильды, но их лидер остался при своём мнении. \n\n— Полагаю, продолжать этот разговор нет смысла. Я ухожу, но знайте, что я этого так больше не оставлю!"
griffonstone.216.a:0 "— Уходите!"
griffonstone.217.t:0 "Вопрос о компенсации"
griffonstone.217.d:0 "Одна из самых острых проблем Грифонстоуна — это земельная собственность, поэтому ключевой реформой в предлагаемом нами наборе является земельная реформа. Наконец, наша страна разорвёт крепостное право и передаст земли дворян в прямое владение крестьянам. Очевидно, что такие действия приведут к конфликту с дворянством, но мы не будем колебаться в своих решениях! \n\nХотя, мы можем уменьшить негативную реакцию и отговорить некоторых землевладельцев от поддержки Гестала, предоставив им компенсацию. Таким образом, правительство "купит" землю, а не конфискует её напрямую. Обратная сторона медали в том, что мы рискуем создать серьёзную нагрузку на нашу и без того разрушенную экономику."
griffonstone.217.a:0 "Никаких договоров с дворянами!"
griffonstone.217.b:0 "Нам нужен компромисс."
griffonstone.218.t:0 "Провозглашение Республики Грифонстоун"
griffonstone.218.d:0 "До сих пор мы существовали в своего рода юридическом подвешенном состоянии: формально королевство Грифонстоун всё ещё существовало, и Гильда исполняла обязанности его регента, но мы все называли страну демократической. Наконец, день настал: Гильда объявила о роспуске королевства Грифонстоун и провозглашении Республики. Состоялись новые выборы, и, что никого не удивило, бывший и последний регент, Гильда, одержала убедительную победу. В своей первой речи после вступления в должность президента она сказала:\n\n— Грифонстоунцы, сегодня я стою перед вами не как ваш регент, не как ваш президент, а как одна из вас – как одна из гордых грифонов, которые верили, что могут изменить свою страну. Которые верили, что, действуя сообща, вырвав власть из рук своих суверенов, они вернут своё величие. Я хочу поблагодарить вас, всех вас, кто верил в дело республиканцев. Всё это было бы невозможно без вас. Я обещаю отстаивать идеалы, за которые вы боролись, и сделать всё возможное в качестве вашего первого президента!"
griffonstone.218.a:0 "УРА!"
griffonstone.219.t:0 "Посланник из Грифонстоуна"
griffonstone.219.d:0 "Наконец-то хорошие новости пришли с континента Грифония! Судя по всему, страна, расположенная на территории прародины грифонов, после периода невзгод и потрясений наконец-то смогла начать восстановление и встала на путь становления маяком гармонии и демократии на Востоке. К нам обратились дипломаты Грифонстоуна, желающие установить более тесные связи с Эквестрией в надежде модернизировать свою страну и принять гармоничную форму правления. Как мы можем помочь этим грифонам в их стремлениях?"
griffonstone.219.a:0 "Оказать политическую помощь!"
griffonstone.219.b:0 "Может быть, технологический обмен?"
griffonstone.219.c:0 "И то и другое! Птичкам надо помогать!"
griffonstone.219.e:0 "К сожалению, мы не можем им помочь..."
griffonstone.220.t:0 "Вингбардия соглашается"
griffonstone.220.d:0 "Вингбардия приняла наше предложение, и дипломаты сегодня подписали пакт о ненападении. Надеемся, это станет началом прочного мира между нашими великими державами."
griffonstone.220.a:0 "Мир в наше время."
griffonstone.221.t:0 "Вингбардия отказывается"
griffonstone.221.d:0 "По неизвестным причинам Вингбардия отклонила наше щедрое предложение. Некоторые в нашем правительстве опасаются, что Вингбардия, возможно, планирует напасть на нас. К счастью, многие арантигцы сочли эту новость предательством со стороны карфинцев, и, вероятно, в будущем они будут к нам более любезны."
griffonstone.221.a:0 "Тревожно..."
griffonstone.222.t:0 "В Бездну"
griffonstone.222.d:0 "Когда Галлус смотрел в бездонную, по ощущениям, бездну, он вдруг понял, что это явно была не лучшая его идея – от одного лишь вида невероятно глубокой ямы у него кружилась голова. Молодой грифон тревожно сглотнул и принял более устойчивую позу.\n\n— Знаешь, будет хорошей идеей остановиться сейчас. — Гильда решила сопроводить Галлуса и Дедушку на их пути к краю. Услышав ее слова, Графф проворчал что-то бессвязное...\n\n— Не-а, я смогу это сделать. — сказал Галлус, словно пытаясь успокоить Гильду, но было ясно, что больше всего в успокоении нуждался он сам, — Что ж, пора идти. — он в последний раз проверил экипировку и начал спуск. Ветер был очень сильным, а скальная стена, полная трещин, в которых спокойно могла застрять лапа молодого грифона, была ужасно хрупкой и коварной. Спускаясь вниз, Галлус на мгновение остановился, чтобы повнимательнее рассмотреть скелет ужасного циклопа Аримаспи. Череп был просто огромен. Неудивительно, что чудовищу удалось убить большую часть Королевской Стражи и его деда. Однако Галлус не мог долго смотреть на останки – Гильда предупреждала его, что скала непрочная, и длительное ожидание может быть смертельно опасным. К счастью, на небольшой глубине его безопасность была обеспечена страховочным устройством. Тем не менее, спуск всё же был непростым для юного грифона, его мышцы уже жутко ныли, при том, что ему удалось спуститься лишь на небольшую глубину. Но Галлус был полон решимости, и единственное, что он мог сделать – продолжить путь, стиснув клюв. \n\nПо мере того, как он спускался всё ниже и ниже, ветер начал ослабевать, позволяя ему перевести дыхание. В этот момент он не видел солнечного света, всё, на что он мог рассчитывать, – это фонарь. Верёвка, на которую он опирался, оборвалась от нагрузки, и дальше он мог двигаться только с помощью ледорубов и собственных когтей. \n\nВнезапно случилось самое худшее, что можно было вообразить: кусок скалы, за который он держался, откололся. Галлус потерял равновесие и начал падать, вскрикнув от ужаса. Он попытался взмахнуть крыльями, но ветер отбросил его в каменную стену, лишив ориентации в пространстве. Спустя мгновение он ударился о дно Бездны."
griffonstone.222.a:0 "*БУМ!*"
griffonstone.223.t:0 "Каменное дно"
griffonstone.223.d:0 "Первое, что он почувствовал, была резкая боль. Он воспринял это как хороший знак – он всё ещё жив! И, что ещё важнее, его фонарь лежал неподалёку, источая слабое свечение. Металлическая клетка сильно деформировалась, но стекло внутри уцелело. Галлус внимательно осмотрел своё тело – хотя синяков было много, а левое крыло, кажется, было сильно повреждено, он всё равно мог считать себя счастливчиком – ни одна кость в его лапах, похоже, не была сломана.\n\nОн огляделся – дно Бездны вело к пещере. Внутри были странные скальные образования и узкие проходы, но никаких признаков Идола... \n\n— Хорошо, Галлус, успокойся, он должен быть где-то здесь... — сказал он себе. Грифон начал оглядываться вокруг. Наконец он заметил вдалеке какое-то мерцание. — Ага! Вот ты где! — Галлус уверенно пошёл вперёд. Но вскоре проход стал сужаться – ему пришлось буквально протискиваться между скалами. Свет фонаря казался всё слабее и слабее...\n\nТьма охватывала его взор. Галлус тяжело дышал; неизбежная паническая атака была всё ближе и ближе. Здесь попросту было слишком мало места! Ему казалось, что камни пытаются зажать его в тиски. Последний отчаянный рывок позволил ему выбраться из каменного плена в большой просторный грот. Он в панике побежал вперед, но быстро споткнулся и упал. Магический фонарь отвязался от пояса и укатился в темноту. Увидев это, Галлус вскрикнул и бросился вперёд, чтобы поймать фонарь. Он быстро схватил его и обнял, дрожа и тяжело дыша. Свет, казалось, был ещё слабее чем раньше. Галлус поднял голову и огляделся – к своему ужасу, он не увидел прохода, через который прошёл сюда. Это был конец... Он был достаточно глуп чтобы отправиться в бездну, и теперь, кажется, был обречён на гибель. Единственное, что он мог сейчас делать – ждать, пока голодная смерть окончательно не заберёт его в свои роковые объятия... \n\nГаллус тихо всхлипывал, вспоминая свою жизнь: беззаботные деньки в разрушающемся Грифонстоуне, учёбу в Эквестрии и друзей, которых встретил в то время. Эти тёплые воспоминания подбадривали и успокаивали его... Нет, он вернётся из этой мааровы дыры! С Идолом или без, но он встретится со своими друзьями снова! \n\nГрифон встал и осмотрелся. Тьма теперь не казалась такой всепоглощающей, словно начала отступать. На секунду Галлус почувствовал необъяснимое чувство гнева, которое быстро прошло. Теперь он хотел лишь двигаться вперёд и выбрал для этого наиболее логичный путь –..."
griffonstone.223.a:0 "...подальше от темноты."
griffonstone.224.t:0 "Последний страж"
griffonstone.224.d:0 "Галлуc бродил по проходам и каменным залам, всё глубже и глубже погружаясь в пещеры Бездны, уже потеряв счёт времени. Наконец, он снова увидел где-то вдали проблеск света и пошёл по нему. Обнадёженно войдя в большую комнату из которой исходил свет, он, к сожалению, не нашёл там Идол.\n\nОн увидел лишь грифона средних лет, прислонившегося к каменной колонне. Перед ним лежал сломанный клинок. Грифон, казалось, спал, но когда Галлус подошёл ближе, он поднял голову. Что вообще делал грифон в этих заброшенных пещерах? И, что ещё страннее, почему он показался Галлусу таким знакомым?\n\n— Извините... — обратился к нему Галлус, — Всё в порядке? Кто вы и что вы делаете в этой маарове дыре?\n\n— Маарова дыра? — спросил грифон хриплым голосом, — Определённо, подходящее название для места моего заточения. Кто я такой... Кем я был... Разве это так важно? Здесь больше ничего не имеет смысла. \n\nГаллус взглянул на грифона поближе. Он видел это лицо раньше – когда Графф показывал старые фотографии – это был его дед, Гуто Шестой! Но он погиб тридцать лет назад в бою с Аримаспи! И он даже почти не постарел!\n\n— Подожди, но... Как? Ты умер много лет назад. Дедушка, как это возможно?!\n\n— Дедушка? — Удивился Гуто, — Неужели прошло так много времени? И ты считаешь себя моим внуком? Хотя... Ладно, это неважно. Ничто не имеет смысла здесь. Это конец, наказание за мой провал. Я подвёл Империю, я убил Грифонстоун...\n\n— Нет, Грифонстоун всё ещё жив! Он переживает трудности, но всё ещё стоит. — ответил Галлус, — Может быть ты потерпел неудачу,  но я смогу... сохранить твоё наследие. Но мне нужен Идол. Он необходим мне, чтобы доказать, что я законный король, чтобы... восстановить Грифонстоун. Кем бы или чем бы ты ни был, если ты действительно мой дед... То, прошу, помоги мне найти его.\n\n— И почему ты считаешь, что Идол стоит того? Что это говорит о нас, грифонстоунцах, если единственное, что держит нас вместе – это какой-то древний артефакт? Он не принёс ничего хорошего в Грифонию, только кровопролитие. И он не принесёт ничего хорошего никогда. Грифонстоун обречён. Позволь ему пасть, позволь ему умереть. — ответил Гуто, отчаявшимся голосом.\n\n— Нет. — возразил Галлус, — Я отказываюсь верить в это. Да, Идол использовался для завоеваний, но он может приносить мир и процветание. И я верю, что смогу возродить Грифонстоун. Грифоны, может быть, слабы поодиночке, но если дать им идею, символ, мне кажется, они смогут работать сообща ради лучшего будущего.\n\nПыл внука помог Гуто взять себя в лапы:\n\n— Надежда – привилегия юных... Возможно, ты прав. — Гуто указал когтем в сторону одного из коридоров. — Я не могу туда пойти, таково моё наказание. Но ты можешь.\n\n— Спасибо, дедушка. Я сделаю всё возможное, чтобы ты мной гордился. — Галлус шагнул в проход. Когда он повернул голову, чтобы попрощаться..."
griffonstone.224.a:0 "...Гуто уже исчез."
griffonstone.225.t:0 "Первый"
griffonstone.225.d:0 "Всё это казалось... странно. Галлус задумался. Неужели он так ударился головой, что Гуто ему померещился? Или, может быть, он так долго блуждал по этим пещерам, что просто сошёл с ума? Но он знал, что на эти вопросы не найти ответа, и ему оставалось только продвигаться вперёд в надежде, что позже всё прояснится... Вскоре проход расширился, превратившись в другую комнату, и посередине Галлус увидел... Идол! Золотой артефакт сиял, отражая свет магической лампы. Он был великолепен. Заворожённый им, Галлус шагнул вперёд...\n\n— Что ты делаешь, узурпатор? — Эти слова вернули Галлуса к реальности. Он повернул голову... всего в нескольких шагах от него стоял Гровер Первый – почти точь-в-точь как памятник в Грифонстоуне. Его лицо исказило презрение. — Ты хочешь забрать Идол, который подарил мне сам Борей?! Ты? Какое право ты имеешь даже прикасаться к нему, вор?\n\n— Я Галлус из рода Гуто... — Молодой грифон пытался говорить твердо, но это давалось ему тяжело. — Мои предки защищали Идол, и теперь – это моя задача...\n\n— Твои предки? — усмехнулся Гровер. — Ты просто случайный грифон, и даже если ты действительно потомок моего брата... Ты слишком слаб. Все вы слабы. Моя династия лишь тень своего былого величия. Ты недостоин Идола. Ты слабак и трус. Овладеть силой Идола — значит стать завоевателем, правителем, тем, кто вершит судьбы миллионов. Сможешь ли это сделать ты, птенец, полный сомнений\nи тревоги? — Гровер медленно приближался, его устрашающая фигура возвышалась над Галлусом, — Ты недостоин!\n\n— Заткнись! — крикнул Галлус, — Ты мёртв! Давным-давно мёртв! Я без понятия, что ты тут делаешь, но ты просто призрак прошлого, и тебе меня не унизить!\n\n— Наглый птенец! — прошипел Гровер, — Думаешь, сможешь мне противостоять? Я сделал невозможное, я создал великую Империю, подчинил древние королевства, победил каждого своего врага, я выбран самим Бореем! Ты бросаешь мне вызов?\n\n— Да. — уверенно сказал Галлус, — Всё, что ты можешь, призрак, – это кричать и угрожать. И знаешь что? Я устал от этого дерьма! Всю мою жизнь на меня кричали. Я не поддамся на эту жалкую провокацию! — Галлус повернулся и схватил Идол..."
griffonstone.225.a:0 "..."
griffonstone.226.t:0 "Навстречу свету"
griffonstone.226.d:0 "Свет. Он был повсюду, всеобъемлющий, всепоглощающий. Галлус стоял один белой пелене. Он осмотрелся, но не увидел даже своего тела – вокруг был только свет. Казалось, он мог бы раствориться в нём, стать единым с ним, обрести вечный покой... Но он продолжил борьбу. Чувство понемногу возвращалось к нему... Но что-то приближалось – накатывало, словно волна в бушующем море. Некая сущность. Сила.\n\nНаконец она захлестнула его, и хоть у него словно не было глаз, Галлус чувствовал, будто смотрит прямо на Солнце. Нестерпимая боль, везде и нигде одновременно. Если бы у него был рот, он бы закричал. Сущность обратила внимание на него. Она... судило его. Он интересовал её, отчасти даже забавил. Вся жизнь Галлуса, все его поступки, все его мысли... Всё казалось ничтожным по сравнению с тем, с чем он столкнулся сейчас. Вдруг, боль прошла – сущность удовлетворилась.\n\nВ мгновение ока всё изменилось: Галлус оказался в величественном тронном зале, перед ним лежали сокровища сотен павших королевств, а рядом с ними, склонившись, молили о пощаде поверженные короли и их подданные. Он почувствовал себя... могущественным – как никогда прежде. Они боялись его настолько же, как уважали – он был не просто правителем, а совершенным, идеальным грифоном. Ощущение власти опьяняло его. Он мог её заполучить... Она была его по праву... Она возьмёт её силой!\n\nОн поднялся с трона и схватил меч, чтобы отдать приказ о наступлении... Но вдруг, в уголке его сознания возникла мысль... сомнение. Неужели, это действительно был путь, по которому он хотел идти?\n\nНет, он не будет топить Грифонию в крови!\n\nСначала, где-то вдалеке прозвучал рёв. Затем все начало рушиться, открывая палящее солнце, разгневанное его решением... Отказываться от такой власти... Высокомерие должно быть наказано. Никто не может противиться воле Богов! Но Галлус стоял и глядел прямо на свет, чувствуя боль и пытаясь её преодолеть. После, казалось бы, бесконечной борьбы, свет начал меркнуть. Кажется, сущность разочаровалась, но решимость Галлуса заинтриговала её. Он был свободен идти..."
griffonstone.226.a:0 "...идти по своему пути."
griffonstone.227.t:0 "Назад из Бездны"
griffonstone.227.d:0 "Галлус проснулся, отчаянно хватая клювом воздух. Он чувствовал себя так, будто восстал из мёртвых, но после нескольких мгновений паники всё вернулось на круги своя. На самом деле, он чувствовал себя... лучше, сильнее, чем прежде. Хотя большая шишка на лбу болела, он чувствовал себя очень бодрым. Галлус внимательно осмотрелся – он лежал на дне Бездны, а всего в нескольких шагах от него лежал Идол. \n\nКак? Это его озадачивало. Хотя воспоминания о случившемся были смутными, он помнил встречи с давно умершими грифонами... Но как? Действительно ли он вошел в эти пещеры? И где тогда тот вход? Он видел лишь небольшие помещения и разломы, но ничего похожего на большую пещеру, которую он исследовал. Получил ли он ужасное сотрясение мозга после удара о дно? Неужели он лежал все это время здесь, рядом с Идолом? На эти вопросы не было ответа – и они не имели значения – теперь все, что ему нужно было сделать, это схватить Идол и вернуться на поверхность. Галлус привязал его к своему ремню и начал подниматься. На мгновение он остановился. Странное чувство какого-то... зловещего присутствия возникло и быстро исчезло. \n\nПока Галлус продолжал восхождение, на дне Бездны, никем не замеченная, стояла фигура в капюшоне, похожая на грифона. Сгорая от ненависти, она наблюдала за ним, медленно растворяясь во тьме, возвращаясь туда, где ей самое место...\n\nНа этот раз ветер казался гораздо слабее, и Галлус быстро поднимался. Он не чувствовал усталости, легко карабкаясь по скальной стене и вскоре, приблизившись к поверхности, он услышал знакомые голоса.\n\n— Прошёл уже целый день! Если такой молодой грифон не смог это сделать, значит никто не сможет. Ты сошёл с ума! — утверждала молодая грифина.\n\n— Я не настолько стар! — ответил дедушка. — И это моя вина. Я спущусь за ним... Не стоило соглашаться на это.\n\n— Два идиота: старый и молодой... Подожди, ты тоже это слышал? — Гильда повернула голову к краю Бездны. Спустя мгновение Галлус в последний раз подтянулся и взобрался наверх, с висящим на бедре Идолом. Гильда и Графф просто стояли, ошеломлённо раскрыв клювы.\n\n— И что, никакой приветственной вечеринки? Я разочарован... Не стойте как статуи. У вас сейчас есть что-нибудь съедобное? Я целый день ничего не ел."
griffonstone.227.a:0 "— Думаю, у меня есть немного булочек..."
griffonstone.285.t:0 "Ещё одна встреча"
griffonstone.285.d:0 "Вскоре после коронации Галлуса дедушка Графф ушёл на пенсию, объяснив это тем, что не хотел вмешиваться в правление молодого короля, и наконец-то наслаждался заслуженным отдыхом. Занятый делами государства, Галлус нечасто навещал его, но всякий раз Графф позволял ему лишь краткую беседу, после чего предлагал "заняться более важными делами, чем беспокоить старого грифона". — Тем не менее, он, казалось, был рад тому, что какой-то гриф действительно помнил о нём и регулярно навещал его. \n\nКак обычно, дедушка сидел в кресле, укрывшись одеялом. Он выглядел очень хрупким, словно его старение ускорилось в последние месяцы. Для Галлуса он всегда выглядел одинаково все эти годы, словно решил насолить богам, отказавшись умирать. Грифоны на много десятилетий моложе могли бы позавидовать его жизнелюбию. Однако теперь всего этого не стало. Видимо, проспав до прихода Галлуса, дедушка открыл глаза.\n\n— Ах, Галлус, что привело тебя сюда? — спросил Графф.\n\n— Мне нужна причина, чтобы навестить моего старого опекуна? — ответил молодой грифон. — Сегодня не было никаких особенных дел, вот я и пришёл узнать, как ты себя чувствуешь.\n\n— Как обычно. — Дедушка пожал плечами."
griffonstone.285.a:0 "— "Старым"?"
griffonstone.228.t:0 "Всё когда-нибудь заканчивается"
griffonstone.228.d:0 "— "Старым"? — Дедушка направил коготь на Галлуcа и сказал, — Я ещё достаточно молод, чтобы надрать тебе зад, если ты не будешь оказывать мне почтения, наглец! Птенцы нынче дерзкие пошли... И не думай, что королевский титул защитит тебя от моего гнева! — Затем дедушка издал нечто, похожее одновременно на смех и кашель. На мгновение они оба замолчали. — Знаешь, Галлус... я горжусь тобой, — вдруг сказал Дедушка. \n\n— Спасибо... — В последнее время Дедушка всё больше сближался со своим подопечным, но годы воспитания наложили отпечаток на доверие молодого грифона. Его ответ был слегка удивлённым и осторожным, словно он ожидал какой-то ловушки.\n\n— Ты будешь хорошим королём – тебя не волнует власть; тебя волнует благополучие грифонов... Это редкое качество в наши дни. И ты каким-то образом умудрился развить его, несмотря на то, что я даже не пытался тебя нормально воспитать... — Дедушка тяжело вздохнул — Я был плохим опекуном. Без сомнений. Это одна из моих многочисленных ошибок. Чем старше ты становишься, тем больше думаешь о прошлом и своих опасениях, и тем меньше о будущем...\n\n— Ты был не так уж плох, — сказал Галлус. — Думаю, ты всегда старался изо всех сил, не только в моём воспитании, но и в управлении Грифонстоуном.\n\n— Ну... К счастью, теперь твоя очередь разобраться с этим местом. Я знаю, ты справишься лучше, чем я. — Графф улыбнулся. — А теперь, если позволишь... Не мог бы ты заварить чай для старого грифона? Кажется, он должен быть на верхней полке...\n\n— Без проблем. — Галлус отправился на кухню. Потребовалось некоторое время, чтобы найти чай в лабиринте банок на полках, но наконец он вернулся с дымящейся кружкой. \n\n— Я нашёл только астерионский... — вдруг, что-то в позе дедушки насторожило Галлуса. — Всё в порядке? \n\nДедушка не ответил. Быстрый осмотр показал, что Графф действительно был мёртв. Он выглядел гораздо спокойнее обычного — расслабленный, с лёгкой улыбкой, кажется, он хотя бы не страдал в последние мгновения своей жизни. Галлус закрыл глаза старому грифону и прошептал:"
griffonstone.228.a:0 "— Прощай, Дедушка."
griffonstone.229.t:0 "Начало научного сотрудничества"
griffonstone.229.d:0 "Отличные новости! Пони приняли нашу просьбу, и теперь мы сможем воспользоваться научным сотрудничеством с Эквестрией!"
griffonstone.229.a:0 "Ура!"
griffonstone.230.t:0 "Эквестрия отказывается"
griffonstone.230.d:0 "По неизвестным причинам Эквестрия отклонила нашу просьбу..."
griffonstone.230.a:0 "*Хнык*"
griffonstone.231.t:0 "Торговое соглашение подписано"
griffonstone.231.d:0 "Эквестрия согласилась! Пусть деньги и товары текут через наши порты!"
griffonstone.231.a:0 "Больше золота!"
griffonstone.232.t:0 "Эквестрия отклонила наше торговое соглашение"
griffonstone.232.d:0 "Эквестрийцы отказались от нашего щедрого предложения – видимо, мы переоценили их готовность к сотрудничеству..."
griffonstone.232.a:0 "*Хнык*"
griffonstone.233.t:0 "Союз с Эквестрией!"
griffonstone.233.d:0 "Наши дипломаты сегодня подписали договор с Эквестрией – с взаимными гарантиями, что мы придём на помощь эквестрийцам, если на них нападут, и наоборот. С заключением этого союза мы стали на шаг ближе к достижению прочного мира."
griffonstone.233.a:0 "За дружбу!"
griffonstone.234.t:0 "Эквестрийцы отклонили предложение о союзе"
griffonstone.234.d:0 "Мы только что получили ответ из Эквестрии – они вежливо отклонили наше предложение... Видимо, мы предоставлены сами себе."
griffonstone.234.a:0 "*Хнык-хнык*"
griffonstone.235.t:0 "Что делать с республиканцами?"
griffonstone.235.d:0 "Республиканское движение Грифонстоуна относительно молодо, оно было основано всего несколько лет назад грифоншей Гильдой. Ей удалось объединить разрозненные, часто конфликтующие группы в одну политическую партию, выступающую за широкомасштабные демократические реформы. Неудачный переворот Голдстоуна вызвал большие беспорядки, приведя в смятение РДГ, тем не менее, они неизбежно создадут проблемы в будущем. Чтобы стабилизировать ситуацию в Грифонстоуне, мы должны решить эту проблему. Самым простым решением будет запретить их деятельность и выслать наиболее ярых противников правления лордов. Однако, возможно, было бы лучше заключить сделку с более уравновешенными лидерами Движения и провести некоторые символические реформы, такие как ограниченная земельная реформа и разрешение некоторым членам РДГ (самым пассивным) войти в новый Регентский совет."
griffonstone.235.a:0 "Никаких сделок с республиканцами!"
griffonstone.235.b:0 "Компромисс — лучший путь."
griffonstone.236.t:0 "Предатели и оппортунисты"
griffonstone.236.d:0 "Голдстоун действовал не в одиночку. Его поддерживала удивительно большая группа чрезмерно амбициозных, в основном обанкротившихся дворян, которые присоединились к нему в надежде получить власть и богатство после успеха переворота. Однако этот союз был рожден обещаниями процветания, а не лояльностью, что проявилось в битве за Грифонстоун: действия сторонников Голдстоуна были крайне вялыми. Однако, когда Голдстоун оказался в тюрьме, их шаткий союз распался, и Гестал не столкнулся с их особым сопротивлением, когда занял место регента. Но теперь эти дворяне продолжают пассивно противостоять новому регенту, просто выполняя приказы, отказываясь платить налоги и, в худшем случае, открыто ведя мелкие войны против наших войск. Они не представляют реальной угрозы, но мы должны разобраться с ними, чтобы предотвратить дальнейшую дестабилизацию. Очевидный вариант — атаковать их армии напрямую, а затем заключить в тюрьму мятежных дворян. Однако мы можем раздать им помилования и пообещать переманить часть из них на нашу сторону, а затем позволить им делать грязную работу — после того, как они с ней справятся, их силы будут слишком слабы, чтобы представлять для нас угрозу, и мы будем внимательно следить за их действиями."
griffonstone.236.a:0 "Никакой пощады предателям!"
griffonstone.236.b:0 "Мы сбережём наши силы."
griffonstone.237.t:0 "Герцогиня Иглкло"
griffonstone.237.d:0 "Императорский дворец в эти дни казался пустым и враждебным. Габриэла Иглкло, проходя по его коридорам, думала только о том, как не смогла защитить юного Гровера... Полуразрушенный дворец, разрушенный во время недавних жестоких стычек, как нельзя лучше соответствовал её мрачным мыслям. Погруженная в свои мысли, Габриэла едва не упустила из виду лорда Гестала, ожидавшего её в тронном зале.\n\n— Моя императрица, — она вздрогнула, услышав эти слова. Лорд поклонился — Для меня большая честь познакомиться с вами, хотя я и надеялся, что это произойдёт при более благоприятных обстоятельствах.\n\n— Лорд Гестал, мне очень приятно познакомиться. — Габриэла вежливо ответила — Я безмерно благодарна вам за ваш вклад в дело Империи. Вы, господин, вероятно, один из последних грифонов, кто верит в Империю и сражается за неё. Благодарю вас. \n\n— Сражаться за неё было моим долгом, моя императрица. Мне больно, что, когда произошёл переворот, мы в Грифонстоуне были поглощены внутренними распрями, вместо того чтобы прийти на помощь нашему императору, богам, спасти его душу... \n\n— Я слышала о вашей борьбе и о попытке Голдстоуна захватить трон. Грифоны, подобные ему и Донкло, повсюду... Они уничтожают всё, к чему прикасаются, — вздохнула герцогиня. \n\n— Да. Таких грифонов слишком много... Но они потерпят неудачу, пока есть те, кто сражается за лучшую Грифонию. Единственное, что мы можем сделать сейчас, — это почтить память погибшего императора нашими делами, чтобы Империя выстояла и процветала..."
griffonstone.237.a:0 "...несмотря ни на что."
griffonstone.238.t:0 "" #HIDDEN
griffonstone.238.d:0 "" #HIDDEN
griffonstone.239.t:0 "Восстание в Копперхилле"
griffonstone.239.d:0 "Мы явно недооценили гнев наших дворян. Часть их свиты объединилась и захватила Копперхилл. Лорды собрались в городе и объявили наше правительство незаконным. Теперь они готовятся начать войну против нас! Нам нужно действовать, и делать это быстро. Офицеры Сил обороны предложили два способа разрешения кризиса: либо быстро ударить по Копперхиллу, пока дворяне не собрали больше солдат, либо тайно провезти оружие и подстрекателей в Копперхилл, чтобы вызвать народное восстание против дворян, надеясь застать их врасплох"
griffonstone.239.a:0 "Используем регулярную армию."
griffonstone.239.b:0 "Используем местных революционеров."
griffonstone.240.t:0 "" #HIDDEN
griffonstone.240.d:0 "" #HIDDEN
griffonstone.241.t:0 "Битва при Копперхилле"
griffonstone.241.d:0 "Нам удалось быстро собрать значительные силы и двинуться прямо на Копперхилл. Дворяне явно не ожидали столь быстрой реакции и с трудом разрабатывали целостный план сражения. В конце концов, не будучи готовыми к длительной осаде, они решили встретиться с Силами обороны у города. Битва закончилась нашей победой, остатки дворянских дружин сдались, и многие дворяне бежали на север, в Верению. Когда мы допросили пленных лордов, они сказали, что понятия не имеют, где он может быть и что он задумал..."
griffonstone.241.a:0 "Тревожно."
griffonstone.242.t:0 "Гестал возвращается"
griffonstone.242.d:0 "В последние несколько месяцев лорд Гестал был очень занят. Он отправился на север, в Герцланд, и, благодаря своему богатству и помощи друзей, собрал большую армию наёмников. Теперь он пересёк границу и взял Гейл, где к нему присоединяются все оставшиеся дворяне со своими войсками. Это последняя битва – если мы победим Гестала сейчас, всё сопротивление нашей революции будет подавлено, и не останется никого, кто мог бы противостоять новому правительству. Как и в прошлый раз, были разработаны два плана битвы: быстрая атака – РГДФ против дворян, или более хитрый подход – мы можем попытаться подкупить часть наёмников, чтобы атаковать армию Гестала с тыла."
griffonstone.242.a:0 "Мы ударим сейчас!"
griffonstone.242.b:0 "Идолы могут выиграть любую войну."
griffonstone.243.t:0 "Пейзаж после битвы"
griffonstone.243.d:0 "Всё кончено. Армия Гестала разгромлена, беглые солдаты рассеяны. Самому лорду удалось бежать, скорее всего, к своим друзьям в Герцланде. Мы надеемся, что он больше никогда не сможет представлять для нас никакой угрозы. Наша победа в этой битве уничтожила все остатки власти дворян – их армии разбиты, их земли находятся под контролем правительства, и большинство мятежных дворян не могут нам сопротивляться, поскольку либо погибли в битве, либо были схвачены и заключены в наших тюрьмах. Мы многое потеряли, но, возможно, благодаря этому кровопролитию родится новое, лучшее будущее. Будущие поколения рассудят наши поступки. Осталось сделать ещё одно, прежде чем мы сможем сосредоточиться на других делах – решить судьбу пленённых дворян. Наши наиболее кровожадные последователи предлагают казнить их как предателей и врагов государства, но более умеренные республиканцы предлагают вместо этого изгнать их."
griffonstone.243.a:0 "Отрубить им головы!"
griffonstone.243.b:0 "Вон с наших земель!"
griffonstone.244.t:0 "Исход богатства"
griffonstone.244.d:0 "Единственное, что большинство дворян Грифонстоуна умели делать, – спорить друг с другом. Благодаря этому, вместо того чтобы сражаться с нами, они продолжали предаваться своему любимому занятию – спорам. Некоторые из них, особенно те, кто был в долгах, были даже рады перспективе притока денег, обещанного компенсацией, и более трудолюбивые начали вкладывать средства в промышленность. Единственными возмущёнными группами были традиционалисты и сторонники Гестала. К сожалению, самой популярной реакцией на наши действия среди дворян стал отъезд из Грифонстоуна с продажей остатков своего имущества тому, кто больше заплатит. Отправляясь ко дворам других стран, они забрали с собой свои финансовые активы, что увеличило нагрузку на вашу экономику, и без того значительно ослабленную компенсационной политикой."
griffonstone.244.a:0 "По крайней мере, они ушли."
griffonstone.245.t:0 "Последнее препятствие"
griffonstone.245.d:0 "Годами Гестал был объединяющей фигурой для знати, и хотя он, без сомнения, амбициозный и опасный соперник, теперь, из-за хаоса, вызванного арестом Голдстоуна и массовым оттоком знати, его влияние значительно ослабло, и он явно начал впадать в отчаяние. Неделями он пытался сформировать из своих последователей единую силу для борьбы с нашими реформами. Пока его усилия могут казаться тщетными, но если мы позволим ему продолжать, он может довести свою "армию" до такой степени, что она станет представлять для нас реальную угрозу, возможно, даже устроит реакционный переворот. Лучшим способом решения этой проблемы было бы "устранение" Гестала. В конце концов, Грифонстоун — опасное место, и, когда Гестал путешествует по стране, навещая своих собратьев-лордов, может произойти множество несчастных случаев..."
griffonstone.245.a:0 "Сделай так, чтобы они произошли."
griffonstone.245.b:0 "Оставьте его в покое."
griffonstone.246.t:0 "" #HIDDEN
griffonstone.246.d:0 "" #HIDDEN
griffonstone.247.t:0 "Неудавшееся убийство"
griffonstone.247.d:0 "План был прост: Гестал передвигался со своей командой и дюжиной человек личной охраны на автомобилях. Поэтому один убийца не мог осуществить операцию, особенно учитывая, что, по слухам, машина Гестала была бронированной. Однако на протяжении многих лет небольшие группы бандитов проникали в Грифонстоун, нападая с Ползучих гор. Некоторые из самых ярых сторонников республиканцев выдавали себя за таких бандитов.\n\nПоначалу всё шло по плану: мы вооружили наших агентов винтовками и небольшим противотанковым ружьём, нам удалось вычислить следующий пункт назначения Гестала и выбрать идеальное место для засады на одной из горных дорог. Колонна машин медленно продвигалась по пересечённой местности, когда наши грифоны открыли огонь. Охрана Гестала оказалась хорошо организованной и обученной. Они не поддались панике, ответили огнём, пытаясь прикрыть машину Гестала. Бронемашина оказалась неуязвимой для винтовочных пуль, а противотанковое орудие заклинило. В результате весь персонал охраны погиб, но самому лорду удалось выбраться из засады и укрыться в ближайшем городе. Конечно, мы начали "расследование", но, как и ожидалось, — виновных" найти не удалось. Гестал не стал дожидаться результатов, решив бежать из Грифонстоуна на следующий день после нападения в неизвестном направлении. Учитывая, что у него было мало времени, чтобы забрать с собой хоть что-то из своих активов, у него, скорее всего, не будет ресурсов, чтобы причинить нам ещё больший вред. К сожалению, уже ходят слухи о том, что нападение было слишком удобным для нас, чтобы быть случайностью, и это запятнало нашу репутацию."
griffonstone.247.a:0 "Пум-пум-пум..."
griffonstone.248.t:0 "Конец эпохи"
griffonstone.248.d:0 "Давно прошли те времена, когда семья Гестала устраивала роскошные вечеринки в своём родовом замке. Долгие годы, несмотря на все усилия лорда, власть его родового поместья постепенно ослабевала, хотя он всё ещё неплохо справлялся по сравнению со многими другими знатными грифами. Теперь же, за исключением нескольких старых слуг, замок Гестала опустел – союзники покинули его, либо вовсе покинув Грифонстоун, либо отказавшись от планов с Гесталем в пользу карьеры в бизнесе. \n\nТеперь он сидел в кресле с бокалом вина на журнальном столике – бокал был полон уже как минимум час. Гестал вспоминал события последних месяцев, все свои действия, размышлял: можно ли что-то сделать сейчас? Возможно, Гильда права, возможно, время дворян прошло, теперь им предстоит отойти в тень и позволить простым грифонам править самим? Одно было ясно: он проиграл, и ему оставалось лишь смириться с этим. Дальнейшая борьба была бессмысленной, оставалось лишь надеяться, что в новой эпохе не все старые обычаи будут утрачены. \n\nГестал тихо вздохнул и сказал:"
griffonstone.248.a:0 "— Неплохо, Гильда..."
griffonstone.249.t:0 "Вставай, Копперхил!"
griffonstone.249.d:0 "Поначалу всё шло по плану. Мы связались с республиканцами в Копперхилле и, при их поддержке, сумели убедить местное население, уже находившееся на грани восстания, взяться за оружие и дать отпор своим благородным угнетателям. Однако то, что произошло позже, стало хаотичным кровопролитием. Наши агитаторы не смогли должным образом возглавить местных жителей, и паникующая знать в ответ приказала поджечь город. По иронии судьбы, они оказались в ловушке, и большинство из них и их солдат в конечном итоге погибли в огне. Те немногие, кто выжил, были быстро линчеваны разъярёнными копперхиллцами. Город лежит в руинах, и многие винят нас в случившемся."
griffonstone.249.a:0 "Катастрофа!"
griffonstone.250.t:0 "Выборы"
griffonstone.250.d:0 "Прошло пять лет с момента основания Республики Грифонстоун. За эти годы политический ландшафт значительно изменился: ранее единое республиканское движение раскололось на ряд новых политических партий. Президент Гильда заявила, что не будет участвовать в выборах, и теперь несколько кандидатов пытались склонить население на свою сторону. Близкая подруга Гильды, Грета, возглавляет Революционную республиканскую партию, обещая отстаивать принципы, которыми руководствовалась наша молодая республика в последние годы: преданность нуждам простых грифонов и нейтралитет во внешней политике. Гарнер, бизнесгриф, ставший дворянином, возглавляет более консервативную Лигу процветания Грифонстоуна. Он хочет либерализовать экономику и отменить некоторые из самых спорных реформ. Габби, молодая грифонша, известная организацией молодёжной организации "Искатели Знаков Отличия" в Грифонстоуне, неожиданно добилась известности в политических кругах, в конечном итоге основав Партию Дружбы Грифонов и выступая за необходимость... более активного участия в делах Грифонии."
griffonstone.250.a:0 "Президент Грета"
griffonstone.250.b:0 "Президент Гарнер"
griffonstone.250.c:0 "Президент Габби"
griffonstone.251.t:0 "Эквестрия отправила советников"
griffonstone.251.d:0 "Отличные новости! Пони Эквестрии решили поддержать наше дело и отправить к нам группу учёных, советников и академических экспертов, чтобы помочь нам реформировать нашу страну. Их помощь ускорит улучшение нашего государства."
griffonstone.251.a:0 "За дружбу!"
griffonstone.252.t:0 "Совместные исследования с Эквестрией"
griffonstone.252.d:0 "Наши дипломаты добились большого успеха – эквестрийцы решили поделиться с нами своими технологиями. Эквестрия славится как одна из самых передовых стран в мире, поэтому, сотрудничая с ними, мы можем быстро улучшить наши собственные исследования."
griffonstone.252.a:0 "Дружба – это наука!"
griffonstone.253.t:0 "Дружба с Эквестрией"
griffonstone.253.d:0 "К нашему большому удивлению, Эквестрия пообещала полную поддержку делу превращения Грифонстоуна в современную, гармоничную страну. Пони Эквестрии направили большую группу консультантов и решили наладить прочные связи между нашими университетами, чтобы делиться с нами своими исследованиями. Мы и мечтать не могли о таком успешном результате этой дипломатической миссии!"
griffonstone.253.a:0 "Друзья навеки!"
griffonstone.254.t:0 "Предложение дружбы отклонено"
griffonstone.254.d:0 "Наши дипломаты вернулись ни с чем! Судя по всему, пони не могут или не хотят оказать нам никакой поддержки. Мы сами по себе."
griffonstone.254.a:0 "*Хнык*"
griffonstone.255.t:0 "Помощь Грифонстоун-Герцланда прибыла"
griffonstone.255.d:0 "С тех пор, как пала Эквестрия, королевство Грифонстоун-Герцланд было безопасным убежищем для пони-беженцев. Его правитель, Галлус, бывший ученик Школы Дружбы Понивилля, очень сочувствует нам. Теперь, когда мы боремся за свободу, он решил оказать нам прямую помощь. Корабли с оборудованием и военными припасами прибывают каждый день, и в Грифонии формируется значительное количество добровольческих отрядов. Эти добровольцы, как пони, так и грифоны, готовы сражаться за Эквестрию."
griffonstone.255.a:0 "Слава нашим пернатым друзьям!"
griffonstone.256.t:0 "Приглашение в Грифоний Союз"
griffonstone.256.d:0 "Сегодня пришло интересное предложение с посланником – Король Грифонстоун-Герцланда Галлус приглашает нас присоединиться к Грифоньему Союзу – международной организации грифонов, которая выступает за ускорение социально-экономического прогресса и распространение демократии на континенте. Вступление в неё обеспечит нам защиту Союза в любых будущих конфликтах и позволит вести лёгкую и беспошлинную торговлю со странами Союза. Конечно, нам придётся открыть наш рынок для их инвесторов и товаров. Готовы ли мы к этой сделке?"
griffonstone.256.a:0 "Вместе за демократию!"
griffonstone.256.b:0 "Нам не нужна их защита."
griffonstone.258.t:0 "[FROM.GetName] отказались присоединиться к Союзу"
griffonstone.258.d:0 "Было ли это вызвано экономическими, социальными, военными проблемами или просто высокомерием их руководства – мы не знаем. Но дело в том, что [FROM.GetName] отклонили наше предложение. Тем не менее, мы будем поддерживать их в будущем, ибо у нас, демократических народов Грифонии, есть общая цель – гармония на континенте. Возможно, подходящее время для их присоединения к нам просто ещё не пришло."
griffonstone.258.a:0 "Всё, что мы можем сделать, – это пожелать им всего наилучшего."
griffonstone.257.t:0 "[FROM.GetName] присоединяется к Союзу"
griffonstone.257.d:0 "Сегодня мы приветствуем нового члена Союза Грифонов – ещё одна нация присоединилась к нам, чтобы построить светлое, более свободное будущее для жителей Грифонии."
griffonstone.257.a:0 "Ура!"
griffonstone.259.t:0 "Предложение Грифонстоуна"
griffonstone.259.d:0 "К нам обратились грифонстоунцы. Судя по всему, они слышали о наших трудностях и готовы оказать нам "помощь" – значительное количество оружия будет доставлено через их торговцев, или, если использовать более уместный термин, контрабандистов, а их опытные офицеры окажут поддержку нашим войскам. Конечно, нам придётся заплатить им за помощь, что делает нас частично ответственными за рост преступности в Грифонии..."
griffonstone.259.a:0 "Нам нужна их помощь."
griffonstone.259.b:0 "Никаких сделок с бандитами!"
griffonstone.260.t:0 "Они принимают!"
griffonstone.260.d:0 "Хорошие новости! Наши новые клиенты решили принять наши условия и ждут поставок. Взамен мы получим неплохое количество битов."
griffonstone.260.a:0 "Было очень приятно."
griffonstone.261.t:0 "Они отказываются!"
griffonstone.261.d:0 "Похоже, потенциальные клиенты отказались от нашего щедрого предложения. Придётся искать других партнёров... Возможно, их врагов?"
griffonstone.261.a:0 "Жаль."
griffonstone.262.t:0 "Сделка с Грифонстоуном"
griffonstone.262.d:0 "К нам обратились грифонстоунцы с предложением о "торговле. — С тех пор как лорд Голдстоун захватил власть над страной, он превратил её в рассадник злодейства, стремящегося лишь к увеличению своей власти и богатства. Он не очень надёжный грифон, но, тем не менее, предложение хорошее, и обе стороны от него выиграют – так что, возможно, нам стоит принять его предложение?"
griffonstone.262.a:0 "Да!"
griffonstone.262.b:0 "Нет!"
griffonstone.264.t:0 "Корсары подписывают сделку"
griffonstone.264.d:0 "Корсары Сикамеона, почуяв выгоду, решили принять наше предложение – теперь мы можем расширять своё влияние на Юге! Пусть деньги текут рекой!"
griffonstone.264.a:0 "Отлично!"
griffonstone.265.t:0 "Корсары отказываются"
griffonstone.265.d:0 "Похоже, корсары не доверяли нам настолько, чтобы принять наше щедрое предложение. Поскольку мы не можем составить им конкуренцию в южных водах, наши возможности для расширения в регионе останутся ограниченными."
griffonstone.265.a:0 "Какая жалость."
griffonstone.263.t:0 "Грифонстоунские контрабандисты"
griffonstone.263.d:0 "Ни для кого не секрет, что правительство Грифонстоуна занимается всевозможной незаконной деятельностью, чтобы пополнить казну своих правителей. Долгое время они строили свою преступную империю только в Грифонии, но теперь, когда Эквестрия повержена, их потянуло в Эквестрию, как мух на гниющие трупы. Поскольку мы не можем полностью контролировать нашу протяжённую береговую линию, а многие наши чиновники подкуплены контрабандистами, мы столкнулись с резким ростом преступности в прибрежных городах."
griffonstone.263.a:0 "Чёрт возьми!"
griffonstone.266.t:0 "Грифонстоунцы в Протекторате"
griffonstone.266.d:0 "Недавно ряд бизнесгрифов вложили крупные суммы денег (в основном в виде взяток), чтобы получить права на добычу полезных ископаемых в определённых богатых ресурсами районах. Производительность местных плантаций и шахт растёт, и грифоны уже создают новые предприятия. Практически ни для кого не секрет, что эти "законные" бизнесгрифы финансируются Грифонстоуном. Учитывая наш слабый контроль над Протекторатом, мы не можем предотвратить подобные действия — и, честно говоря, по крайней мере, кто-то инвестировал в это, вероятно, обречённое на провал предприятие."
griffonstone.266.a:0 "...хорошо, наверное?"
griffonstone.267.t:0 "Прощание"
griffonstone.267.d:0 "Весть о внезапном ухудшении здоровья дедушки Граффа быстро дошла до Гильды. Судя по всему, старый грифон, который, казалось, был готов пережить самого архонта Эроса, лишь бы назло всем грифам, вскоре должен был встретиться с богами. Несмотря на то, что большую часть жизни она питала глубокую неприязнь к Дедушке, Гильда решила навестить его в больнице – в конце концов, нет ничего благого в ненависти к тому, кто стоит на пороге смерти.\n\nКогда Гильда постучала в дверь, она услышала молодой голос: — Пожалуйста, войдите. — Он показался ей знакомым... Войдя, она поняла, что это был Галлус. Парень пришёл навестить своего опекуна.\n\n— Дай нам несколько минут, Галлус. — сказал Графф. Молодой грифон кивнул и вышел из комнаты. Гильда села.\n\n— Как видишь, я ещё не умер. Я ничего тебе не оставлю в завещании, — проворчал Графф. — Я разрешаю тебе подписать список грифонов, желающих помочиться на мою могилу, но тебе придётся сделать это собственной ручкой!\n\n— Очень забавно. Как я вижу, ты репетируешь шоу, которое устроишь в небесном кабаре? — с усмешкой ответила Гильда.\n\n— Не-а, ненавижу рай. Постоянные семейные встречи в садах с золотыми питьевыми фонтанчиками. Я был сыт по горло этими грифонами, когда они были живы, а теперь они будут докучать мне всю вечность.\n\n— Уверена, они тоже не в восторге от перспективы встречи с тобой.\n\n— Да, скорее всего. Мы никогда не ладили. — Несколько мгновений оба грифона молчали. — Я ошибался насчёт тебя, Гильда. У тебя много недостатков, но ты хорошо справилась. Лучше, чем я когда-либо смог бы. Спасибо. — Дедушка посмотрел ей в глаза. Сказать, что Гильда была в шоке, было бы большим преуменьшением – Дедушка Графф хоть раз сказал что-то приятное?\n\n— Э-э... я просто сделала то, что должна была сделать. И без всех грифонов, которые меня поддерживали, я бы ничего не добилась, — пробормотала она.\n\n— Да. И это показывает разницу между нами. Я давно потерял веру в других. В конце концов, я потерял веру и в себя, и мне стало всё равно. Но ты всё ещё заботилась о других, даже если делала вид, что тебе плевать. Ты заботилась о Грифонстоуне... У меня есть одна скромная просьба, всего одна. Присматривай за Галлусом. Он ещё молод и глуп и может попасть в беду...\n\n— Хорошо. Думаю, я смогу уделить ему немного времени. Но скажи мне, почему ты стал его опекуном? Он не из твоей семьи, и ты не кажешься таким уж щедрым. Есть какой-то секрет? \n\n— Ну... — улыбнулся Дедушка Графф. — Он единственный внук моего старого друга. Один из немногих, которые у меня когда-либо были. Вырастив Галлуса, я выплачиваю свой долг перед ним. Грифон всегда должен платить свои долги. Не буду тебя задерживать, у тебя, наверное, много дел. И если сможешь, когда будешь уходить, найди няню и скажи ей принести мне стакан воды. Ради Борея, я уже больше часа жду!"
griffonstone.267.a:0 "— Прощай, дедушка."
griffonstone.268.t:0 "Золотые сумерки"
griffonstone.268.d:0 "Основатель рода Голдстоунов был всего лишь рыцарем на службе у Грифонстоунской династии. В награду за службу ему были пожалованы земли – там, где сегодня гордо возвышается город Голдстоун – тогда бесплодные и негостеприимные. Это казалось издевательством, но вскоре в близлежащих горах были найдены золото и серебро. Рыцарь взял себе имя "Голдстоун" и основал город, который сегодня является одним из важнейших населённых пунктов королевства. Богатство и могущество его рода росли из поколения в поколение, и его потомки стали одними из самых могущественных дворян Грифонстоуна. Даже сегодня, когда последний отпрыск династии расширил своё дело, включив в него различные коммерческие предприятия – контрабанду оружия всем сторонам многочисленных конфликтов Грифонии, владение заводами с чудовищно низкими стандартами безопасности и откровенно криминальную деятельность, такую как рэкет, – шахты по-прежнему оставались важным источником дохода семьи... До сих пор. \n\nЛорд Голдстоун читал последний отчёт: эффективность стремительно падала, и, по словам управляющего рудниками, большинство месторождений уже истощены. Можно было копать глубже, но разведка не дала никаких результатов, это лишь немного отсрочило бы неизбежный конец – рудники Голдстоуна истощались. Эта проблема была характерна не только для Голдстоуна – Грифонстоун когда-то сильно зависел от своих богатых природных ресурсов, но с годами другие благородные рудники тоже истощились, и сегодня шахтёры добывали последние куски золота. Пришло время найти новый источник дохода... \n\nК счастью, Грифонстоун был рядом – ждал какого-нибудь грифа, достаточно смелого, чтобы забрать его..."
griffonstone.268.a:0 "Добывайте всё, что можете!"
griffonstone.269.t:0 "Мольба о помощи"
griffonstone.269.d:0 "Мы только что получили письмо от Грифонстоуна – лидера проимперской фракции в павшем королевстве, лорда Гестала, просит нас о поддержке. Грифонстоун находится под угрозой со стороны восточных бандитов и вингбардцев и отчаянно нуждается в реформировании своей армии. Хотя Грифонстоуны покинули нас, возможно, оказание им поддержки укрепит проимперскую фракцию Гестала и позволит Грифонстоуну выжать из наших врагов на Юге всю кровь."
griffonstone.269.a:0 "Пришлите им советников!"
griffonstone.269.b:0 "Мы не помогаем предателям!"
griffonstone.270.t:0 "Прорыв"
griffonstone.270.d:0 "Ты какого Маара здесь забыл?!"
griffonstone.270.a:0 "Как тебе не стыдно, читер?"
griffonstone.271.t:0 "Друзья на Севере"
griffonstone.271.d:0 "Небольшая группа имперских советников только что прибыла, чтобы помочь нам обучить Королевские Силы Обороны. Вместе с ними прибыло несколько военных инженеров, которые помогут нам модернизировать наше вооружение. Эта неожиданная помощь улучшила положение Гестала среди знати и усилила проимперские настроения."
griffonstone.271.a:0 "Хорошо... но и плохо."
griffonstone.272.t:0 "Империя отказывается"
griffonstone.272.d:0 "Империя отказала нам. Хотя это и не было неожиданностью, учитывая, что нас считают предателями Кайзера, это решение ослабило позиции Гестала в Регентском совете. Пока Грифонстоун продолжает рушиться, республиканцы набирают поддержку среди низших классов."
griffonstone.272.a:0 "Тревожно."
griffonstone.273.t:0 "" #HIDDEN
griffonstone.273.d:0 "" #HIDDEN
griffonstone.274.t:0 "Убийства САР"
griffonstone.274.d:0 "Радикализованные недавними событиями, грифоны из Свободной армии Румейра начали террористическую кампанию против нашего правительства, нападая на местных чиновников. Под прицелом оказались видные полицейские и политики, по сути, наша власть на западных землях критически ослабла. Восстановление местных органов власти займет некоторое время."
griffonstone.274.a:0 "Нет прощения убийцам!"
griffonstone.275.t:0 "САР атакует патрули"
griffonstone.275.d:0 "Свободная армия Румейра становится все смелее с каждым днем. Теперь они начали нападать на наши военные патрули и более отдаленные аванпосты. Хотя нашим гарнизонам удалось отразить эти нападения, румейрцы все же смогли нанести некоторые потери и, что еще важнее, посеять страх среди наших граждан."
griffonstone.275.a:0 "Павшие не будут забыты."
griffonstone.276.t:0 "САР атакует железные дороги"
griffonstone.276.d:0 "Свободная армия Румейра сосредоточила свои усилия в западных регионах, где проживает большинство румейрцев. Их недавней целью была наша железнодорожная система – многочисленные рельсы были выведены из строя. Поиск и восстановление разрушенных путей займёт некоторое время, а до тех пор поездам будет запрещено пересекать этот регион."
griffonstone.276.a:0 "Они подрывают наше государство!"
griffonstone.277.t:0 "Теракты САР"
griffonstone.277.d:0 "Земля содрогнулась, когда взорвались бомбы, заложенные в Грифонстоуне. Свободная армия Румейр бомбила промышленные здания и правительственные учреждения. Ущерб нашему промышленному потенциалу огромен, и погибло множество невинных мирных жителей, оказавшихся не в том месте не в то время. Нам нужно что-то сделать с жителями Румейр, мы не можем допустить продолжения подобных актов террора."
griffonstone.277.a:0 "Это выходит из-под контроля!"
griffonstone.278.t:0 "" #HIDDEN
griffonstone.278.d:0 "" #HIDDEN
griffonstone.279.t:0 "Конец"
griffonstone.279.d:0 "Ещё один насыщенный день в титуле короля – посещение правительственных заседаний, чтение отчётов, подписание документов... Жизнь правителя была не из лёгких. Иногда Галлус сомневался в правильности своего решения – быть правителем было тяжёлым бременем, которое ему приходилось нести, – однако теперь было слишком поздно для раздумий. Закончив читать последний отчёт, Галлус решил сделать небольшой перерыв. Он закинул задние лапы на стол и откинулся назад. На мгновение он полюбовался закатом, видневшимся через окно кабинета, а затем, в очередной раз осмотрел кабинет. Когда-то здесь работал Дедушка Графф. Хотя с тех пор многое было заменено, Галлус решил оставить прочный, надёжный стол, который, скорее всего, был таким же старым, а может быть, и старше самого Дедушки. \n\nВнезапно Галлус услышал треск... Через мгновение задние ножки стула сломались, и король начал своё неизбежное падение на пол. Отчаянно пытаясь предотвратить это, Галлус схватился за стол... Но безрезультатно. Приземление было болезненным, но, сев на пол, Галлус заметил кое-что интересное – видимо, в столе была потайная полка, которую он случайно открыл, пытаясь предотвратить внезапное падение. Осмотрев её, он обнаружил внутри старую фотографию. Галлусу потребовалась секунда, чтобы узнать грифонов на ней – первого он видел только на других фотографиях, второго помнил очень смутно. \n\nМолодой король улыбнулся – в когтях он держал фотографию своих родителей. Редко кому доводилось получать подарки из могилы... Грифон перевернул фотографию, обнаружив на другой стороне еле заметную надпись:\n\n"Удачи тебе во всём, что ты задумал, Галлус."\n\n\n\n"Графф""
griffonstone.279.a:0 "Спасибо, дедушка!"
griffonstone.280.t:0 "Гость из-за моря"
griffonstone.280.d:0 "Большой стол был полностью завален стопками бумаг и карт. Офицеры, правительственные чиновники и все остальные важные грифоны провели последние несколько дней, напряжённо обсуждая последние события в Эквестрии и анализируя разведывательные донесения об изменениях в армейском составе. Однако теперь комната была почти пуста: внутри находился лишь Галлус, разглядывающий самую большую карту, где были отмечены известные позиции гарнизонов и укреплений. Внезапный стук вырвал молодого грифона из задумчивости. Через мгновение двери открылись, и появился стражник, сопровождающий пурпурную кобылу. \n\n— Мой король, как вы и приказали, мы доставили пони к вам сразу же после её прибытия", — доложил стражник. \n\n— Спасибо. Теперь вы можете покинуть нас, Тимбервинг. — Стражник слегка поклонился и закрыл дверь. Галлус улыбнулся, — Рад вас видеть, мисс Глиммер, хотя обстоятельства, конечно... мрачные. Надеюсь, ваше путешествие было благополучным?\n\n— Относительно..., — вздохнула Старлайт. — Мы чуть не наткнулись на патрульный катер чейнджлингов, когда пересекали океан, и, конечно же, мне пришлось путешествовать в полной секретности, чтобы не заинтересовать их разведку..." Минуту они просто молчали. — Я удивлена, Галлус, приятно удивлена. Здесь, в Грифонии, дела идут просто замечательно. Вернее, в Грифонстоуне... Всё стало гораздо лучше.\n\n— Мне помогали мои грифоны... И, ну, у меня были хорошие учителя", — ответил Галлус."
griffonstone.280.a:0 "Ещё один момент неловкого молчания..."
griffonstone.287.t:0 "Бремя правления"
griffonstone.287.d:0 "Что случилось со Школой дружбы? После того, как чейнджлинги захватили Восток, до нас доходят только неподтверждённые слухи", — спросил Галлус. \n\n— Школа... — Старлайт грустно вздохнула. — Чейнджлинги закрыли её, как и все остальные академии по всей Эквестрии. Видимо, они считают, что рабов не нужно учить... К счастью, мы эвакуировали учеников до того, как линия фронта достигла Понивилля. Галлус... Это не просто закрытие школ. Чейнджлинги зверствуют по всей Эквестрии... Это не просто обычная оккупация. Рабство, — сбор урожая", как они это называют, чистки... Нам нужна помощь, Эквестрии нужна помощь. Иначе жуки превратят её в ад для пони и всех несогласных. \n\nЛицо Галлуса помрачнело; он взглянул на карту. — Все мои офицеры отговаривают меня от сражения с чейнджлингами. Государство, созданное Кризалис, — крупнейшая военная машина в мире, её армия многочисленна, хорошо вооружена, опытна и контролирует берег. Чтобы победить жуков, потребуются жизни сотен тысяч, а возможно, и миллионов грифонов... \n\n— Миллионы пони страдают каждый день в Эквестрии! — повысила голос Старлайт. \n\n— Знаю, — перебил её Галлус. — Знаю. Но теперь я король, и я несу ответственность за жизни своих подданных. Высадка в Мэйнхеттене стала бы настоящим логистическим кошмаром, не говоря уже о том, что Кризалис даже не поморщится, если сожжёт Эквестрию дотла, лишь бы замедлить наше продвижение.\n\n— Так вы говорите... \n\n— ...что я не буду ввязываться в полномасштабную войну с чейнджлингами. Мне очень жаль, мисс Старлайт. Однако это не значит, что я не сделаю всё возможное, чтобы помочь вам. Береговая линия Эквестрии длинная, захватчики не смогут обеспечить полный контроль за ней... Я позабочусь о том, чтобы вы получили всё необходимое для борьбы с жуками, но теми, кто освободит Эквестрию..."
griffonstone.287.a:0 "...должны быть пони."
griffonstone.282.t:0 "Мы потеряли Идол"
griffonstone.282.d:0 "С нашим народом произошла невообразимая катастрофа. Во время недавнего отступления идол Борея был утерян и захвачен нашими врагами. Идол, хоть и не наделяет нас сверхъестественными силами, которыми он обладал в былые времена, по-прежнему остаётся символом огромной силы и стабильности, и, к сожалению, больше нам не служит. —
griffonstone.282.a:0 "Мы обречены..."
griffonstone.281.t:0 "Идол захвачен"
griffonstone.281.d:0 "В ходе нашей последней атаки мы получили нечто гораздо более полезное, чем просто кусок земли — мы нашли Идол Борея, оставленный нашим врагом при отступлении! Артефакт больше не дарует легендарные силы своему носителю — это мы знали с тех пор, как он был отвоёван. Однако теперь он служит символом славы грифонов, и обладание им — вопрос большого международного престижа."
griffonstone.281.a:0 "Слава нашим солдатам!"
griffonstone.288.t:0 "Грифонстоун в ОАП?"
griffonstone.288.d:0 "Посол Центральной Конфедерации Грифонов передал нам петицию о вступлении в Объединённый Альянс Пони. Если мы позволим им присоединиться, мы получим сильного союзника в Грифонии, чья идеология недалека от нашей, но, с другой стороны, это может вынудить нас участвовать в будущих войнах за рубежом..."
griffonstone.288.a:0 "Нам всегда нужны новые друзья."
griffonstone.288.b:0 "Вежливо откажитесь."
griffonstone.289.t:0 "Конфедерация в ОАП"
griffonstone.289.d:0 "Эквестрия приняла нашу петицию, и мы официально вступили в Объединённый Альянс Пони."
griffonstone.289.a:0 "Ура!"
griffonstone.290.t:0 "Мы одни"
griffonstone.290.d:0 "К сожалению, эквестрийцы отказались, заявив, что не могут использовать свои ресурсы за морем и подвергают себя опасности развязывания войн в Грифонии."
griffonstone.290.a:0 "Нам придётся справляться самим."
griffonstone.299.t:0 "Триумф"
griffonstone.299.d:0 "Голдстоун не мог отказать себе в удовольствии занять самый большой и роскошный кабинет Императорского дворца с прекрасным видом на Грифенхейм. Он не собирался пользоваться им часто – предпочитал свою личную резиденцию. Но важно было напомнить своей императорской марионетке, чья коронация должна была состояться завтра, о том, кто на самом деле главный. Голдстоун протянул лапы и положил их на стол. Последние несколько лет были действительно напряженными и полными работы, но теперь всё должно было стать проще. С мощью Герцланда за ним, никто не мог посягнуть на его положение, а новые возможности казались безграничными. Даже если что-то пойдет не так – он был готов. Он разместил крупные суммы денег в банках Нью-Мейрланда и Макавии – они могли позволить ему жить в достатке многие десятилетия. Голдстоун усмехнулся, вспомнив слова, которые выкрикнул Графф за мгновение до того, как приказал застрелить старого дурака: "Тебе это не сойдет с рук!", — Я тебя на том свете настигну и отправлю в самое небытие!", — Я отомщу!" \n\nЧто ж... Графф теперь гнил в неглубокой могиле, а Голдстоун восседал в императорском дворце! Такой исход заставил бы задуматься, существует ли вообще правосудие богов – но, возможно, они просто благоволят победителям... Солнце медленно садилось над Грифенхеймом – пора было уходить – ещё предстояло сделать дела, заработать денег, и подготовиться к завтрашней коронации. Голдстоун был совсем не в восторге от этой последней перспективы – ему придётся изрядно постараться, чтобы не заснуть, наблюдая за этим долгим процессом – к счастью, не ему придётся проводить все эти бессмысленные церемонии. Но сейчас он мог расслабиться, и поэтому решил посидеть ещё пару минут, глядя на город в окно."
griffonstone.299.a:0 "Это всё моё!"
griffonstone.300.t:0 "Маарнахт"
griffonstone.300.d:0 "Страх – это неотъемлемая часть ночи. Некоторые говорят, что с наступлением современности существа, которые с незапамятных времен скрывались в тени, исчезли, оставшись лишь в легендах; Что в век электричества и прогресса нет места тьме. Но как бы мы ни старались осветить ночь, тьма всегда найдёт место... И всегда будет голодна. Наиболее длинная ночь в году известна как "Маарнахт" – ночь, когда бог смерти поворачивает свой уродливый клюв к миру смертных... Ночь, когда он свободно правит. Считается, что ни один грифон не должен проводить эту ночь в одиночку. Когда солнце садится, все грифоны приглашают своих родственников и знакомых провести эти долгие часы вместе.. Они оставляют кости и яичную скорлупу на пороге своего дома, чтобы те злые силы, что попытаются проникнуть в дом – нашли лишь смерть и отправились на поиски другой добычи. Внутри пожилые грифоны рассказывают о полузабытых героях давно ушедших эпох, в то время как другие внимают теням, которые танцуют в унисон с пламенем многочисленных свечей, ибо говорят, что в эту ночь во тьме можно найти не только смерть. Священная традиция требует, чтобы всех, кто находится в пути, впустили внутрь, чтобы никому не пришлось проводить эту ночь в одиночку. Когда ночь заканчивается, грифоны покидают свои дома, чтобы насладиться восходом солнца, ведь время тьмы закончилось, злые силы возвращаются к долгому сну. Хотя многие считают Ночь Маара глупой старой традицией, ходят слухи, что в эту ночь из святынь пропадают некоторые священные предметы. Возможно, их просто унёс ветер или украли негодяи... Возможно..."
griffonstone.300.a:0 "Ночь страха..."
griffonstone.301.t:0 "Наша внешняя политика"
griffonstone.301.d:0 "Расположение Грифонстоуна в центре континента — одновременно и благословение, и проклятие: это выгодное положение не только открывает большие возможности для международной торговли, но и создаёт опасность вторжения со стороны соседей, желающих контролировать важнейшие пути через Центральную Грифонию и священный город. Хотя мы не желаем быть втянуты в чужие войны, нам, скорее всего, придётся бороться за свою свободу. Наличие союзников было бы чрезвычайно полезным в таком конфликте — или могло бы полностью предотвратить его. Хотя конечно, мы можем просто укрепить свой нейтралитет и надеяться на лучшее..."
griffonstone.301.a:0 "Нам нужны союзники."
griffonstone.301.b:0 "Грифонстоун выстоит в одиночку!"
griffonstone.302.t:0 "Конкордат отказывается"
griffonstone.302.d:0 "Минотавры отказалась принять нас в свой альянс. Придётся искать союзников в другом месте или надеяться, что когда-нибудь мы найдём общий язык с южанами..."
griffonstone.302.a:0 "Хреново..."
griffonstone.291.t:0 "Грифонстоун и Антанта"
griffonstone.291.d:0 "К нам обратились дипломаты недавно образованной Республики Грифонстоун. Устранив некомпетентный Регентский совет и реформировав правительство, грифонстоунцы создали демократическое правительство и теперь хотят присоединиться к нашей республике. Хотя они были бы ценными союзниками, позволяя нам лучше контролировать Центральную Грифонию, они также могут втянуть нас в конфликты с южанами или эвианцами..."
griffonstone.291.a:0 "Нам бы пригодился новый союзник."
griffonstone.291.b:0 "Мы вежливо откажемся."
griffonstone.292.t:0 "Грифонстоун сближается с нами"
griffonstone.292.d:0 "Дипломат из Грифонстоуна посетил нашу столицу и попросил о встрече. Судя по всему, грифонстоунцы хотят присоединиться к Карфинскому пакту, надеясь установить более тесные связи между нашими народами. Приняв их в наш союз, мы откажемся от идеи претендовать на Родину Грифонов, но обретём ценного союзника на севере."
griffonstone.292.a:0 "Добро пожаловать в Пакт!"
griffonstone.292.b:0 "Они нам не нужны."
griffonstone.293.t:0 "Грифонстоун желает присоединиться к Конкордату"
griffonstone.293.d:0 "Разрушив то, что осталось от неэффективной монархии, Грифонстоунцы реформировали свою страну в гармоничную республику. После серии реформ их гораздо более стабильная нация запросила присоединение к Конкордату, ссылаясь на многочисленные сходства между нашими странами. Примем ли мы их просьбу?"
griffonstone.293.a:0 "Конечно, примем!"
griffonstone.293.b:0 "Они будут лишь обузой."
griffonstone.294.t:0 "Членство в Антанте"
griffonstone.294.d:0 "Мы только что получили известие от аквелийского посла – нас официально признали членом Антанты."
griffonstone.294.a:0 "Великолепно!"
griffonstone.295.t:0 "Аквелия отказывается"
griffonstone.295.d:0 "По неизвестным причинам Аквелия отклонила нашу просьбу о присоединении к Антанте. Надеемся, они не обратят свой взор на Восток, но нам следует быть осторожнее с их действиями."
griffonstone.295.a:0 "Тревожно."
griffonstone.296.t:0 "Грифонстоун в пакте"
griffonstone.296.d:0 "Мы получили новости из Карфина – наше предложение принято, и теперь мы – часть вингбардийского альянса. С помощью наших южных друзей мы наверняка сможем дать отпор любому захватчику!"
griffonstone.296.a:0 "Отличные новости!"
griffonstone.297.t:0 "Вингбардия отказывается"
griffonstone.297.d:0 "Вингбардцы отказались включить нас в Карфинский пакт, заявив, что не хотят вмешиваться в проблемы Центральной Грифонии. Пока мы одни."
griffonstone.297.a:0 "*Всхлип*"
griffonstone.298.t:0 "Грифонстоун в Конкордате"
griffonstone.298.d:0 "Наши дипломаты добились больших успехов в своей миссии, теперь мы — новый член Конкордата. Надеемся, этот союз принесёт безопасность и процветание как Грифонстоуну, так и всей Центральной Грифонии."
griffonstone.298.a:0 "Идеально!"
griffonstone.303.t:0 "Имперская Коронация"
griffonstone.303.d:0 "В Грифонстоуне кипела жизнь, невиданная десятилетиями. Сотни тысяч грифонов прибыли на императорскую коронацию – поистине символическое завершение тёмных веков как Грифонстоуна, так и Империи. Королевский дворец был до краев заполнен грифонами, жаждущими увидеть этот эпохальный момент. В краткой речи теперь уже бывшего регента, лорда Гестала, он поблагодарил всех, кто остался верен императоре и помог защитить Империю в её самый тёмный час. После этого представители разных Империи и лидеры её важнейших дворянских семей принесли клятву верности Императору. Затем архонт Борея возложил корону на голову Гровера VI. Церемония завершилась речью новокоронованного императора. \n\n— Народ Империи! Это был долгий и опасный путь для меня... Для всех нас. Это было время войны и раздоров, когда многие, возможно, потеряли надежду. Но, несмотря на это, вы, храбрые грифоны Империи, сражались за лучшее будущее, за процветание нашего вида, за мир и стабильность. Клянусь вам, братья и сёстры, что сделаю всё возможное, чтобы воплотить в жизнь мечту о лучшей Грифонии! Грядёт новый век, золотой век, и мы все вместе пойдём к нему!"
griffonstone.303.a:0 "Ура! Ура! Ура!"
griffonstone.304.t:0 "Долг выполнен"
griffonstone.304.d:0 "День выдался долгим: военный парад, религиозные церемонии, сама коронация... Речи, речи и ещё больше речей. Императорская коронация стала, пожалуй, самым масштабным праздником, который Грифонстоун видел за последние десятилетия. Кайзер решил воздать почести жителям Грифонстоуна за их роль в защите и восстановлении империи, позволив их полкам возглавить парад возрождённой Рейхсармии, а самому лорду Гесталу был пожалован титул герцога Грифонстоуна. Однако теперь, когда полночь уже давно прошла, Гесталу всё больше и больше надоедала коронационная церемония, в которой ему пришлось участвовать. Чиновники и дворяне, их пустые разговоры и жалкие заговоры, чтобы завоевать расположение бывшего регента... Его это не слишком волновало. Теперь он решил поискать покоя в тихом уголке бального зала. Гестал начал ощущать свой возраст – все эти годы борьбы, как реальных, так и политических баталий измотали его. Давно прошли те времена, когда он мог работать день и ночь – теперь ему хотелось только дремать до ужина, а потом снова лечь спать. Он задавался вопросом, как Граффу удавалось быть таким живым... Возможно, покойным канцлером двигали лишь чистый гнев и злоба? Конечно, мир не вечен, и Гестал заметил знакомую фигуру в генеральской форме. \n\n— Сэр. — Клаус Стилфезер, теперь генерал-майор возрождённой Рейхсармии, подошёл к своему бывшему работодателю. — Можно вас побеспокоить на несколько минут? Я принёс бутылку вина, чтобы отметить ваш великий успех. \n\n— Спасибо, что вспомнили обо мне, капит-... генерал-майор. — Гестал инстинктивно назвал Стилфезера по его старому званию. Офицер разлил вино по бокалам и спросил. — Какой тост, сэр? \n\n— За Империю, конечно! — Оба подняли бокалы. — За здоровье Императора!...\n\n— Каковы ваши дальнейшие планы, сэр? Уверен, вас ещё многое ждёт при дворе...\n\n— Нет, генерал-майор. Я выполнил свою работу и теперь был бы лишь помехой. Будущее Грифонии должны решать молодые грифоны, такие, как наш император... Я... думаю, мне нужен отдых. Долгий отдых. У меня три года не было времени посетить своё поместье. Пожалуй, пойду порыбачу на озере Румейр и наконец займусь розарием. — Гестал с теплотой улыбнулся."
griffonstone.304.a:0 "В самом деле, я люблю розы..."
griffonstone.305.t:0 "Смиренная стагнация"
griffonstone.305.d:0 "Зимой Грифонстоун выглядел почти прилично: лучи солнца, пробивались сквозь заснеженные ветви величественного дерева, на котором он стоял, создавая чудесное световое шоу. Во время весенних дождей он мог выглядеть по-настоящему волшебно, когда над горами появлялись прекрасные радуги.\nНо сейчас он выглядел ужасно. Дождь падал на полурастаявший снег и стекал по городским улицам, собирая грязь и вездесущий мусор. Получившаяся жидкость была поистине уникальна, как по цвету, так и по запаху. Дедушка Графф смотрел в окно своего кабинета, взвешивая все плюсы и минусы его открытия — запах внутри тоже был неприятным, но хотя бы знакомым; типичным для старых зданий. Пыль, медленно гниющая древесина, бумага и занавески, и — почти наверняка — разлагающийся труп какого-то мелкого животного. В конце концов, он передумал: внутри бы только похолодало... Жизнь и так была достаточно жалкой без ещё одного приступа артрита. Его взгляд скользнул по улицам. Здания медленно разваливались, а некогда гордые птицы походили на жалких тварей. Прямо рядом с дворцом шло ограбление: два грифона пинали тело другого. Вскоре они сами сцепились из-за немногих ценностей, найденных в его карманах, – и тут избитый грифон внезапно вскочил с куском плитки в когтях и разбил его об голову одного бандита. После короткой перепалки второй грабитель и ограбленный, по-видимому, пришли к какому-то соглашению... и вместе принялись ворошить карманы упавшего. Дедушка Графф хотел бы испытывать хоть какое-то разочарование... но за прошедшие годы он увидел слишком много подобных сцен, чтобы ему было не всё равно. Старый грифон вздохнул и отошел от окна к своему креслу, почти такому же расшатонному, как и его разум. Несколько секунд он размышлял о том, не прочитать ли стопку отчётов, скопившихся на его столе. На верхнем было написано: «Ваеное паложение в гаризоне Палзучих гор». Разве дворцовые клерки всегда были такими безграмотными?\nГрафф тупо уставился в потолок, думая, почему эти бумаги вообще должны его волновать. Прошло почти сорок лет, а Грифонстоун продолжал гнить. Гражданам было на всё наплевать, а некоторые ухудшали ситуацию ради ничтожной выгоды, или, как иногда подозревал Графф, просто из злобы. По крайней мере, Регентский совет был слишком раздроблен, чтобы продать страну... Хотя вряд ли кто-то заплатил бы за эту землю страданий даже обломок золотого идола. Дедушка схватил стопку документов с намерением бросить их в камин – лучшего применения им не было – но остановился. Один из них привлёк его интерес.\n«Отчет об успеваемости учеников Школы Дружбы». Конечно, без перевода. Пони правда считают, что все существа мира говорят на их языке? Хотя бы числа выглядели прилично. Графф на мгновение замер, его когти проделали дыры в бумагах, старых, как клятвы, которые он давал, вступая в Королевскую гвардию, когда стал её капитаном и канцлером Регентского совета. К нему пришли старые воспоминания. Мог ли он так легко сдаться? Грифонстоун ещё не умер, и он бы предпочёл умереть раньше, чем увидеть его падение. Дедушка откинулся на спинку стула и написал короткое письмо в Понивилль. Пришло время одному грифону вернуться из страны пёстрых лошадок и заняться настоящей работой. В конце концов кто-то должен будет занять место Граффа, когда он неизбежно умрет. К счастью, грифина-почтальонша была одним из немногих существ в городе, кто работал честно: её не пришлось бы подкупать, чтобы письмо не потерялось. Почтовая служба, возможно, была последним учреждением в Грифонстоуне, которое функционировало более или менее нормально. А пока... Что ж, он мог бы вызвать клерка, который написал этот ужасный отчет, и отругать его за каждую ошибку. Может быть, он чему-нибудь научится. Или, по крайней мере, Графф выпустит пар."
griffonstone.305.a:0 "Оба исхода хороши."