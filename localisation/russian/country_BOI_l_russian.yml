BOI_wettertrupp_category:0 "Отряд управления погодой"
BOI_wettertrupp_category_desc:0 "Благодаря недавнему прогрессу в электромеханике и магических исследованиях мы получили возможность управлять циркуляцией воздуха в атмосфере для использования в военных целях. Однако эксплуатация устройств, необходимых для этого, требует невероятного количества ресурсов, что создаёт нагрузку на нашу экономику."
BOI_activate_control:0 "Активировать контроль над погодой"
BOI_activate_control_desc:0 ""
BOI_stop_manipulation:0 "Прекратить манипуляции с погодой"
BOI_stop_manipulation_desc:0 ""
BOI_war_profiteering_category:0 "Нажива на войне"
BOI_war_profiteering_category_desc:0 "Я люблю запах напалма по утрам – он пахнет деньгами, потраченными на его покупку. Наши излишки военной продукции и устаревшее вооружение можно продавать воюющим странам – и пока они разоряют себя в конфликте, мы будем считать деньги."
BOI_blackmarket_category:0 "Чёрный рынок"
BOI_blackmarket_category_desc:0 "Имея контроль над крупными портами, избыток дешёвой рабочей силы и полное пренебрежение моралью в бизнесе, мы можем значительно расширить наше влияние на глобальном чёрном рынке. В мире есть множество беспринципных существ, которые с радостью купят у нас различные нелегальные товары. Оружие для повстанцев, наркотики для криминальных авторитетов, корабли для пиратов... У нас есть всё!"
BOI_profit_from_war:0 "Обратиться к государству [FROM.GetName]"
BOI_profit_from_war_desc:0 ""
BOI_opium_plantations:0 "Создать опиумные плантации"
BOI_opium_plantations_desc:0 "Хотя большая часть опиума происходит из Зебрики, в частности в Хироптерре, на этом рынке всё ещё достаточно места для нас. Конечно, другие правительства будут крайне недовольны, когда мы наводним их страны дешёвыми наркотиками..."
BOI_approach_five_families:0 "Обратиться к "пяти семьям""
BOI_approach_five_families_desc:0 "Вингбардийская мафия – крупнейшая и наиболее влиятельная преступная организация в Грифонии. Её влияние распространяется не только на Вингбардию, но и на земли дальше к западу. Хотя они не питают к нам особой любви, с Пятью Семьями можно договориться о сотрудничестве – в конце концов, мы оба получим то, что хотим – деньги."
BOI_align_with_corsairs:0 "Сблизиться с корсарами Сикамеона"
BOI_align_with_corsairs_desc:0 "Корсары Сикамеона – самая большая и опасная группа южных пиратов. Из-за их существования наш доступ к южным морям и Зебрике сильно ограничен. Однако есть вариант выгодного соглашения для обеих сторон – в обмен на то, что они станут нашими посредниками в контрабанде в Зебрике, мы можем предоставить им доступ к северным рынкам и безопасные гавани после рейдов."
BOI_manehattan_smuggling:0 "Контрабанда в Мэйнхэттене"
BOI_manehattan_smuggling_desc:0 "Протекторат Мэйнхэттен – крупнейший из новых региональных комиссариатов, созданных чейнджлингами. Однако жукам тяжело даётся контроль над его большим и непокорным населением. Это создаёт идеальную возможность для налаживания крупномасштабных контрабандных операций в Мэйнхэттене. Фактически, некоторые новые чиновники-чейнджлинги более чем готовы сотрудничать с нами в обмен на должное вознаграждение."
BOI_invest_in_south_east:0 "Инвестировать в Юго-Восток"
BOI_invest_in_south_east_desc:0 "Юго-Восток павшей Эквестрии – дикая, необузданная земля, полная племен, повстанцев и всевозможных опасных тварей. Даже чейнджлинги не хотят иметь с этим проблем. Кажется, падение их протектората там не за горами, но пока это земля, открытая для нашего тёмного бизнеса. Мы должны попытаться выжать из неё как можно больше денег – больше всего нас привлекают обширные ресурсы, скрытые под землёй. С помощью продуманных инвестиций и взяток мы можем арендовать там определённые районы для свободной эксплуатации. Учитывая, какое это адское и нестабильное место, присутствие наших наёмников, охраняющих плантации и шахты, может даже принести некоторую стабильность в этот проклятый регион."
BOI_griffonian_union_category:0 "Грифоний Союз"
BOI_griffonian_union_category_desc:0 ""
BOI_invite_to_union:0 "Пригласить государство [FROM.GetName] в Союз"
BOI_invite_to_union_desc:0 ""
BOI_support_liberation_front_category:0 "Поддержка для ЭОФ"
BOI_support_liberation_front_category_desc:0 "Эквестрийцы восстали против захватчиков-чейнджлингов! Эквестрийский Освободительный Фронт захватил Мэйнхэттен и теперь борется с армиями королевы Кризалис. Борьба будет нелёгкой – армии чейнджлингов мощны и многочисленны. Но, будем надеяться, с нашей помощью свобода и дружба восторжествуют!"
BOI_send_volunteers:0 "Отправить добровольцев"
BOI_send_volunteers_desc:0 "Когда Эквестрия пала, тысячи пони бежали в Грифонстоун. Теперь они готовы вернуться на родину, чтобы сражаться. Также, более чем достаточно добровольцев-грифонов, желающих присоединиться к ним."
BOI_provide_funds:0 "Предоставить средства"
BOI_provide_funds_desc:0 "Деньги не могут выиграть войны – но они могут помочь. Эквестрийцы лучше знают, что им нужно – и мы предоставим им достаточно битов, чтобы они могли это получить."
BOI_send_guns:0 "Отправить винтовки"
BOI_send_guns_desc:0 ""
BOI_send_equipment:0 "Отправить доп. оснащение"
BOI_send_equipment_desc:0 ""
BOI_send_artillery:0 "Отправить артиллерию"
BOI_send_artillery_desc:0 ""
BOI_send_tanks:0 "Отправить танки"
BOI_send_tanks_desc:0 ""
BOI_send_fighters:0 "Отправить истребители"
BOI_send_fighters_desc:0 ""
BOI_send_cas:0 "Отправить штурмовики"
BOI_send_cas_desc:0 ""
BOI_join_the_fray:0 "Вступить в бой"
BOI_join_the_fray_desc:0 "Несмотря на все усилия эквестрийских борцов за свободу, легионы солдат-чейнджлингов берут верх. Крах Эквестрийского Освободительного Фронта кажется неминуемым, и только прямое вмешательство может спасти их. Перед нами стоит один вопрос: способны ли мы победить Империю Чейнджлингов?"
BOI_industrial_assistance:0 "Промышленная помощь"
BOI_provide_advisors:0 "Предоставить советников"
BOI_search_for_alliance_category:0 "Наши новые союзники"
BOI_search_for_alliance_category_desc:0 ""
BOI_align_entente:0 "Сблизиться с Антантой"
BOI_align_entente_desc:0 ""
BOI_join_karthin:0 "Вступить в Карфинский Пакт"
BOI_join_karthin_desc:0 ""
BOI_apply_concordat:0 "Подать заявку на вступление в Конкордат"
BOI_apply_concordat_desc:0 ""
#
BOI_bailouts_cat:0 "Финансовая помощь от государства"
BOI_bailouts_cat_desc:0 "Основные грифонстоунские предприятия стоят на краю банкротства из-за недавнего кризиса. Теперь, с притоком иностранных средств в экономику, государство обязано поделиться частью богатств с частным сектором."
BOI_bail_gdsg_out:0 "Спасти GDSG"
BOI_bail_gdsg_out_desc:0 "Гриффкингдампфшиффартсгесельшафт – одна из старейших компаний речного судоходства в Грифонии – переживает упадок относительно конкурентов из-за плохих экономических условий в Грифонстоуне и упорному использовьзованию паровых двигателей в эпоху дизеля. Так или иначе, поскольку эта компания перевозит большую часть наших экспортных товаров, её закрытие или продажа в лапы иностранцев привела бы к исчезновению наших продуктов с континентального рынка."
BOI_nationalise_gdsg:0 "Национализировать GDSG"
BOI_nationalise_gdsg_desc:0 "Гриффкингдампфшиффартсгесельшафт стала настолько важной частью экономики, что её статус частного предприятия стал очень опасен для нас. Покупка контрольного пакета акций государством фактически национализирует её и сделает так, что сотрудники компании будут нести ответственность напрямую перед правительством."
BOI_redevelop_steam_engines:0 "Перенять паровые двигатели GDSG"
BOI_redevelop_steam_engines_desc:0 "Упорство GDSG в использовании паровых двигателей может быть не так уж глупо. Хотя их выработка невысока, а обслуживание дороговато, они простые и дешёвые в изготовлении, что может позволить нам быстро создать значительный флот, когда мы получим доступ к океану."

## News Events ##
griffonstone_news.01.t:0 "Переворот в Грифонстоуне"
griffonstone_news.01.d:0 "[This.GetNewspaperHeader]Королевство Грифонстоун десятилетиями находилось в упадке, Регентский совет не смог решить многие проблемы некогда важного города. Сегодня политический тупик, терзавший совет, был преодолен благодаря перевороту, организованному лордом Голдстоуном. Хотя новостей из Грифонстоуна мало, похоже, что Голдстоун, возглавляя отряд наёмников, захватил столицу и, разгромив соперничающую знать, установил шаткую власть над страной. Трудно сказать, что ждёт Дом Грифонов в будущем..."
griffonstone_news.01.a:0 "Всё как и планировалось..."
griffonstone_news.01.b:0 "Тревожно..."
griffonstone_news.01.c:0 "Больше хаоса..."
griffonstone_news.02.t:0 "Переворот в Грифонстоуне"
griffonstone_news.02.d:0 "[This.GetNewspaperHeader]Королевство Грифонстоун десятилетиями находилось в упадке, Регентский совет не смог решить многие проблемы некогда важного города. Сегодня политический тупик, терзавший совет, был преодолен благодаря перевороту, организованному лордом Голдстоуном. Предатель-дворянин был быстро побеждён лордом Гесталом, который теперь правит городом. Гестал, верный императору, наверняка попытается сотрудничать с герцландской знатью, но остаётся один вопрос: сможет ли он восстановить стабильность в своей неспокойной стране?"
griffonstone_news.02.a:0 "Грифонстоун спасён!"
griffonstone_news.02.b:0 "Спасёт ли он Грифонстоун?"
griffonstone_news.02.c:0 "Новый день, новый переворот..."
griffonstone_news.03.t:0 "Возвращение короля"
griffonstone_news.03.d:0 "[This.GetNewspaperHeader]Невероятная новость облетела весь мир: давно утерянный Идол Борея был возвращен потомком, как казалось, павшей династии Гуто – Галлусом Грифонстоунским. Бастард принца Гуто Седьмого, Галлус каким-то образом сумел вернуть Идол из глубин Бездны и, вернувшись с ним в Грифонстоун, был коронован, положив конец вечному регентству. Жители Грифонстоуна ликуют, видя в этом событии начало возрождения своей нации. Однако многие правители Грифонии объявили Галлуса обманщиком, а Идол – очевидной фальсификацией. Многие также опасаются, что, если слухи правдивы, новый король Грифонстоуна действительно сможет управлять силой Идола..."
griffonstone_news.03.a:0 "Ура! Ура! Ура!"
griffonstone_news.03.b:0 "Что же произойдёт дальше?"
griffonstone_news.03.c:0 "Интересно..."
griffonstone_news.04.t:0 "Рассвет нового королевства"
griffonstone_news.04.d:0 "[This.GetNewspaperHeader]Завоевав Герцланд, король Грифонстоуна Галлус, вопреки ожиданиям многих, решил не претендовать на императорский трон. Вместо этого он провозгласил создание Королевства Грифонстоун-Герцланд. В своей речи молодой правитель пообещал принести мир, демократию и гармонию в неспокойное Сердце Империи. Время покажет, какое будущее ждёт новое королевство..."
griffonstone_news.04.a:0 "Слава Грифонстоуну! Слава Герцланду!"
griffonstone_news.04.b:0 "Стоит ли нам волноваться?"
griffonstone_news.04.c:0 "Удачи, наверное..."
griffonstone_news.05.t:0 "Диархия грифонов"
griffonstone_news.05.d:0 "[This.GetNewspaperHeader]После завоевания Герцланда Грифонстоуном многие подозревали, что король Галлус просто коронует себя новым Императором Грифонов. Однако сегодня Империя Грифонов была официально распущена её последним императором – Гровером Шестым. На её месте было создано новое политическое образование – Королевство Герцланд. Бывший император стал её первым королём. Однако, к ещё большему удивлению иностранных лидеров, Гровер и Галлус, король Грифонстоуна, провозгласили создание "Королевства Грифонстоун-Герцланд", которым будут править оба короля, действуя подобно эквестрийской диархии. Время покажет, выживет ли это новое государство."
griffonstone_news.05.a:0 "Да начнётся новая эпоха!"
griffonstone_news.05.b:0 "Что?!"
griffonstone_news.05.c:0 "Старая Империя пала..."
griffonstone_news.06.t:0 "Рассвет новой Империи"
griffonstone_news.06.d:0 "[This.GetNewspaperHeader]Последние тридцать лет королевство Грифонстоун медленно разрушалось, страдая от экономического, политического и социального упадка. Однако после жестокого переворота новый регент, лорд Голдстоун, взял страну под свой полный контроль и, стабилизировав её, напал на Герцланд. Теперь, после завоевания Имперского города, он объявил о роспуске Империи Грифонов и создании нового государства – Империи Грифонстоуна. В Грифонстоуне прошла пышная церемония коронации нового правителя, но очевидно, что Голдстоун станет серым кардиналом, фактически управляющим страной."
griffonstone_news.06.a:0 "Слава мне!"
griffonstone_news.06.b:0 "Возмутительно!"
griffonstone_news.06.c:0 "Интересно..."

