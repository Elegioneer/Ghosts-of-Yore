BOI_local_democracies_idea:0 "Власть провинциям"
BOI_local_democracies_idea_desc:0 "С тех пор как региональные власти взяли на себя больше обязанностей, верховная власть может сконцентрировать свои усилия на самых важных вопросах."
BOI_idol_loss_healed:0 "Утрата Идола Борея"
BOI_idol_loss_healed_desc:0 "Хотя сила Идола была подвластна только Гроверу Первому, после его смерти он остался важнейшим источником легитимности для имперской династии. Находясь во владениях ветви Гуто, Идол был столпом грифонстоунской идентичности и символом народной гордости. Потеря Идола после нападения циклопа Аримаспи лишила грифонов надежды на лучшее будущее."
BOI_modern_communal_agriculture:0 "Современное коммунальное хозяйство"
BOI_modern_communal_agriculture_desc:0 "Фермерские объединения способны покупать дорогую сельскохозяйственную технику и добиваться более выгодных закупочных цен от торговых домов."
BOI_pro_republican_media:0 "Республиканские пропагандисты"
BOI_pro_republican_media_desc:0 "Государственные СМИ пропагандируют свободу и демократию."
BOI_liberty_or_death:0 "Свобода или смерть"
BOI_liberty_or_death_desc:0 "Свободу необходимо защищать от тех, кто желает создать мир тирании и деспотизма."
BOI_reformed_bureaucracy:0 "Реформированная бюрократия"
BOI_reformed_bureaucracy_desc:0 "Меньше бумажной волокиты, больше эффективности."
BOI_neutral_foreign_policy:0 "Нейтральная внешняя политика"
BOI_neutral_foreign_policy_desc:0 "Грифонстоунский нейтралитет обеспечивает мир и процветание для населения Центральной Грифонии."
BOI_fortification_effort:0 "Укрепление обороны"
BOI_fortification_effort_desc:0 "Зачем вы тратите время на чтение? Копайте траншеи! И побыстрее!"
BOI_scientist_haven:0 "Безудержное научное развитие"
BOI_scientist_haven_desc:0 "Либеральная политика способствует развитию науки."
BOI_hope_for_the_future:0 "Надежда на будущее"
BOI_hope_for_the_future_desc:0 "Мы больше не живём прошлым – мы идём вперёд, единые и сильные! Грифонстоун выстоит!"
BOI_social_welfare_idea:0 "Социальное обеспечение"
BOI_social_welfare_idea_desc:0 "Не все грифоны живут хорошо. Мы должны помочь всем нуждающимся."
BOI_refugee_haven:0 "Пристанище для беженцев"
BOI_refugee_haven_desc:0 "Грифонию разоряют безумцы. Они развязывают войны и подавляют простых грифонов. В этих условиях мы должны помогать тем, кто спасается от войны в поисках лучшего будущего."
BOI_griff_cmc_2:0 "Грифонские Искатели знаков отличия"
BOI_griff_cmc_2_desc:0 "Хоть у нас и не могут появиться знаки отличия, наши молодёжные организации, вдохновлённые эквестрийским примером, воспитывают новое, добродетельное поколение."
BOI_expeditionary_corps:0 "Грифонстоунский экспедиционный корпус"
BOI_expeditionary_corps_desc:0 "ГЭК борется за свободу всех существ! Присоединяйся, чтобы помогать нам распространять дружбу и свободу по всему миру!"
BOI_liberal_economy:0 "Либеральная экономика"
BOI_liberal_economy_desc:0 "Реформы президента Гарнера укрепили нашу экономику, так что теперь мы можем заниматься тем, что любят все грифонстоунцы – любоваться денежными потоками."
BOI_GAW_home_of_griffons:0 "Дом грифонов"
BOI_GAW_home_of_griffons_desc:0 "Грифонстоун, некогда прозванный Домом Богов, – один из старейших городов на континенте. Даже сегодня он считается культурной и религиозной столицей грифоньего рода."
BOI_GAW_idol_lost:0 "Утрата Идола Борея"
BOI_GAW_idol_lost_desc:0 "Хотя сила Идола была подвластна только Гроверу Первому, после его смерти он остался важнейшим источником легитимности для имперской династии. Находясь во владениях ветви Гуто, Идол был столпом грифонстоунской идентичности и символом народной гордости. Потеря Идола после нападения циклопа Аримаспи лишила грифонов надежды на лучшее будущее."
BOI_GAW_kingdom_with_no_king:0 "Королевство без Короля"
BOI_GAW_kingdom_with_no_king_desc:0 "После смерти короля Гуто Шестого страна погрузилась в глубокий политический кризис. Без короля во главе правительство чуть не пало, и дворяне начали рвать страну на кусочки. Вечное регентство ведёт к тому, что многие начинают сомневаться в легитимности нашего правительства. Грифоны вспоминают королевскую власть с ностальгией и возмущаются сложившимися обстоятельствами. Нам необходимо сформировать новое правительство и восстановить общественную поддержку."
BOI_home_of_the_griffons_2:0 "Дом грифонов"
BOI_home_of_the_griffons_2_desc:0 "Грифонстоун, некогда прозванный Домом Богов, – один из старейших городов на континенте. Даже сегодня он считается культурной и религиозной столицей грифоньего рода."
BOI_foreign_legions:0 "Иностранные легионы"
BOI_foreign_legions_desc:0 "Слухи о том, что это беглые военные преступники, преувеличены."
BOI_knives_in_the_dark:0 "Ножи во тьме"
BOI_knives_in_the_dark_desc:0 "Вместо открытого боя, порой легче бывает побеждать врагов только с помощью наших разведывательных служб."
BOI_indentured_servitude_idea_1:0 "Долговое рабство"
BOI_indentured_servitude_idea_1_desc:0 "Технически, мы платим этим грифонам, – но конечно же, еда, одежда и жильё создают дополнительные расходы, которые следует вычитать из их зарплат! Повторяйте за мной: "Это не рабство, а погашение долга"."
BOI_indentured_servitude_idea_2:0 "Неофеодализм"
BOI_indentured_servitude_idea_2_desc:0 "С полным восстановлением крепостного права мы свободны эксплуатировать крестьян и получать с этого доходы."
BOI_narrow_minds:0 "Ограниченное мышление"
BOI_narrow_minds_desc:0 "Глупое население, которое не задаёт лишних вопросов – это великое благо для любого правителя."
BOI_local_collaborators:0 "Местные коллаборационисты"
BOI_local_collaborators_desc:0 "Пушечное мясо и наилучшие козлы отпущения: два блага в обмен на небольшую взятку."
BOI_no_industrial_regulations_1:0 "Отсутствие промышленных ограничений"
BOI_no_industrial_regulations_1_desc:0 "Главное в бизнесе – это повышение прибыли, а не улучшение жизней трудящихся!"
BOI_no_industrial_regulations_2:0 "Олигархи Грифонстоуна"
BOI_no_industrial_regulations_2_desc:0 "Заводы работают, социалисты сидят в тюрьмах, бизнесмены богатеют. Жизнь в Грифонстоуне хороша!"
BOI_rumareans_quelled:0 "Подавление румейрцев"
BOI_rumareans_quelled_desc:0 "Нам удалось подавить сепаратистские движения в Грифонстоуне, но не удалось их полностью искоренить."
BOI_imperial_clique:0 "Имперская клика"
BOI_imperial_clique_desc:0 "Они могут быть предателями, но они хорошо работают – только нельзя забывать о том, что их окружение должно подчиняться только нам."
BOI_idol_loss_forgotten:0 "Утрата Идола Борея"
BOI_idol_loss_forgotten_desc:0 "Хотя сила Идола была подвластна только Гроверу Первому, после его смерти он остался важнейшим источником легитимности для имперской династии. Находясь во владениях ветви Гуто, Идол был столпом грифонстоунской идентичности и символом народной гордости. Потеря Идола после нападения циклопа Аримаспи лишила грифонов надежды на лучшее будущее."
BOI_piracy_profits:0 "Доходы от пиратства"
BOI_piracy_profits_desc:0 "Многочисленные каперы разоряют эквестрийские суда. По договору с нами они обязаны делиться награбленным с правительством. К сожалению, вместе с экономическим бумом это привело к доселе невиданному росту преступной активности в наших портовых городах."
BOI_resistance_to_reforms:0 "Сопротивление реформам"
BOI_resistance_to_reforms_desc:0 "Дворяне Грифонстоуна пользуются всем своим влиянием, чтобы саботировать наши преобразования."
BOI_exodus_of_wealth:0 "Исход богатства"
BOI_exodus_of_wealth_desc:0 "Наша экономика сильно страдает оттого, что дворяне вывозят свои капиталы из страны."
BOI_equestrian_advisors:0 "Эквестрийские советники"
BOI_equestrian_advisors_desc:0 "Эквестрия прислала нам в поддержку группу экономических и политических экспертов."
BOI_grover_I:0 "Гровер I"
BOI_grover_I_desc:0 "Гровер, первый Император Грифонстоуна, защитник Герцланда... Лишь марионетка Голдстоуна, но важный символ легитимности нашего режима."
BOI_cyrille_I:0 "Цирилла I"
BOI_cyrille_I_desc:0 "Цирилла Блюкрест, первая Императрица Грифонстоуна, защитница Герцланда... Мелкая дворянка с сомнительными претензиями на трон, посаженная на него Голдстоуном."
BOI_widespread_piracy:0 "Разгул пиратства"
BOI_widespread_piracy_desc:0 "Пираты! Они повсюду! Яррр!"
BOI_deal_with_goldstone:0 "Сделка с Голдстоуном"
BOI_deal_with_goldstone_desc:0 "Хотя нам следует быть осторожными с новым "деловым партнёром", невозможно отрицать, что прибыль от сделки с ним невероятна."
BOI_zebrica_smuggling:0 "Контрабанда в Зебрике"
BOI_zebrica_smuggling_desc:0 "С поддержкой корсаров наши контрабандисты могут свободно бороздить южные моря и беспрепятственно действовать в портах Зебрики."
BOI_griffonstonian_assistance:0 "Помощь Грифонстоуна"
BOI_griffonstonian_assistance_desc:0 "Элитные наёмники и советники помогают нашей армии."
BOI_griffonstonian_military_assistance:0 "Помощь Грифонстоуна"
BOI_griffonstonian_military_assistance_desc:0 "Элитные наёмники и советники помогают нашей армии."
BOI_payment:0 "Оплата сделки"
BOI_payment_desc:0 "Война полезна для бизнеса."
BOI_republicans_in_council:0 "Республиканцы в Совете"
BOI_republicans_in_council_desc:0 "Компромисс с республиканцами предотвращает народные волнения, но с нашими новыми союзники порой тяжело вести дела."
BOI_republicans_supressed:0 "Подавленные республиканцы"
BOI_republicans_supressed_desc:0 "Республиканское движение не удалось полностью искоренить, но теперь они хотя бы не представляют опасности."
BOI_lord_gestal:0 "Лорд Гестал"
BOI_lord_gestal_desc:0 "Опытный государственный деятель Лорд Гестал – ключевой советник при имперском дворе."
BOI_idol_of_boreas:0 "Идол Борея"
BOI_idol_of_boreas_desc:0 "Силы Идола дремлют, но даже без них, он служит мощным символом единства и божественного благословения." #O Boreas, \n\nVeniat regnum tuum, \n\nSanctificetur nomen tuum, \n\nIn caelo et in terra... #BASADO
BOI_new_trade_agreement:0 "Новое торговое соглашение"
BOI_new_trade_agreement_desc:0 "Недавно заключённое торговое соглашение между Эквестрией и Грифонией приносит огромную прибыль жителям обоих континентов."
BOI_generous_funding_giver:0 "Щедрое финансирование ЭОФ"
BOI_generous_funding_giver_desc:0 "Мы отправляем снаряжение, технику и советников Эквестрийскому Освободительному Фронту, неся из-за этого большие финансовые потери."
BOI_generous_funding_recipient:0 "Щедрое финансирование от Грифонстоуна"
BOI_generous_funding_recipient_desc:0 "Грифонстоун шлёт нам огромные поставки снаряжения, техники, снарядов и пайков. Их советники помогают нам тренировать бойцов за свободу, а отряды грифонстоунских волонтёров прибывают с юга почти каждый день"
BOI_development_loans:0 "Промышленные кредиты"
BOI_development_loans_desc:0 "Внешние инвестиции дали толчок к развитию нашей промышленности."
BOI_tax_breaks_idea:0 "Налоговые льготы"
BOI_tax_breaks_idea_desc:0 "Длительные налоговые каникулы позволяют местным предпринимателям тратить сэкономленные деньги на развитие промышленности и привлекают бизнесгрифов из других стран. Это создаёт мощные основания для настоящего экономического бума. Скоро мы озолотимся! Если раньше мы не обанкротимся от резкого сокращения налоговых поступлений в казну."
BOI_griffonstone_reconstruction:0 "Реконструкция Грифонстоуна"
BOI_griffonstone_reconstruction_desc:0 "Восстановление потребует много времени и усилий, чтобы восстановить Грифонстоун."
BOI_griffonstone_expansion:0 "Расширение Грифонстоуна"
BOI_griffonstone_expansion_desc:0 "Обширные строительные работы ведутся повсюду вокруг нашей столицы – жилье, фабрики и бесконечные дороги – правительство приказало построить десятки новых районов! Пришло время Дому Грифонов вернуть свое законное звание величайшего города на континенте!"
BOI_land_compensation:0 "Компенсация за земли дворян"
BOI_land_compensation_desc:0 "Чтобы умиротворить дворян, мы компенсируем им землю, отданную крестьянам в результате нашей последней реформы."
BOI_volunteers_for_equestria:0 "Добровольцы для Эквестрии"
BOI_volunteers_for_equestria_desc:0 "Толпы смелых борцов за свободу ждут своего часа, чтобы сесть на неприметные лодки и отправиться помогать своим эквестрийским товарищам из ЭОФ."
BOI_weather_manipulation:0 "Управление погодой"
BOI_weather_manipulation_desc:0 "Используя магитехнические установки, мы получили способность манипулировать погодой, чтобы обеспечить нашим солдатам и пилотам благоприятные условия. Однако эти устройства потребляют невероятное количество энергии, запасных частей и магических кристаллов, что создает нагрузку на нашу экономику."
BOI_supernatural_foresight:0 "Сверхъестественное предвидение"
BOI_supernatural_foresight_desc:0 "Предсказание движений врага с помощью магии гораздо лучше военной разведки. Однако неясная природа многих видений и необходимость в определении самой вероятной временной линии из предвиденных значительно ограничивают возможности, которые дарует нам Великое Дерево. Тем не менее, пользование ими дает нам существенное преимущество над врагами."
BOI_legitimate_businessgriffs:0 "Чистые бизнесгрифы"
BOI_legitimate_businessgriffs_desc:0 "Жадные, но эффективные эксплуататоры..."
BOI_smuggling_in_zebrica:0 "Контрабанда в Зебрике"
BOI_smuggling_in_zebrica_desc:0 "С поддержкой корсаров наши контрабандисты могут свободно бороздить южные моря и беспрепятственно действовать в портах Зебрики."
BOI_smugglers_activity:0 "Разгул контрабандистов"
BOI_smugglers_activity_desc:0 "Проклятые контрабандисты привозят в наши земли запрещенные вещества, наркотики и оружие!"
BOI_opium_trade:0 "Торговля опиумом"
BOI_opium_trade_desc:0 "Его курят богатые, его колют бедные: опиум – лучший источник дохода в бизнесе наркоторговли."
BOI_sixth_family:0 "Шестая семья"
BOI_sixth_family_desc:0 "Наш союз с Пятью Семьями дает нам почти неограниченный доступ к южным рынкам."
BOI_rampant_crime:0 "Разгул преступности"
BOI_rampant_crime_desc:0 "За многие годы мы научились сосуществовали с мафией, но их недавний союз с иностранцами привел к тому, что наша страна дестабилизирована растущей волной преступной деятельности."
BOI_manehattan_profits:0 "Доходы от Мэйнхэттена"
BOI_manehattan_profits_desc:0 "Контрабанда запрещенных товаров в Мэйнхэттен – самый богатый протекторат чейнджлингов в землях Эквестрии – приносит нам большую прибыль."
BOI_gestal:0 "Лорд Гестал"
BOI_gestal_desc:0 "Опытный государственный деятель Лорд Гестал – ключевой советник при имперском дворе."
BOI_griffonstone_military_assistance:0 "Грифонстоунская военная помощь"
BOI_griffonstone_military_assistance_desc:0 "Элитная группа наемников и советников оказывает ценную помощь нашим вооруженным силам."
BOI_gratitude:0 "Благодарность Герцландцев"
BOI_gratitude_desc:0 "С уходом ненавистного Лорда-протектора и должным погребением Птенца-императора, Герцландцы чувствуют облегчение. Для них наступает лучшее, более спокойное время, и они знают, кого благодарить за это, – Короля Галлуса!"
BOI_demob_efforts:0 "Меры по демобилизации"
BOI_demob_efforts_desc:0 "Восстановление от того состояния, в котором оказался Герцланд после милитаризации, введенной Лордом-протектором, обходится дорого, но необходимо его провести, если мы не хотим, чтобы герцландцы презирали нас."
BOI_reformed_archonates:0 "Реформированные архонства"
BOI_reformed_archonates_desc:0 "Отныне архонты больше не имеют права влиять на политику и вместо этого обязаны сосредоточиться на строго духовных вопросах."
BOI_goldmines:0 "Иссякающие золотые рудники"
BOI_goldmines_desc:0 "Золотые рудники Грифонстоуна иссякают. Осталось не так много золота, но мы должны использовать его по максимуму!"
BOI_last_stand:0 "Последний рубеж Грифонстоуна"
BOI_last_stand_desc:0 "Больше нет императоров, больше нет диктаторов! Мы боремся за Грифонстоун!"
BOI_grif_advisors:0 "Советники из Грифонстоуна"
BOI_grif_advisors_desc:0 ""
BOI_dogs_of_war:0 "Псы войны"
BOI_dogs_of_war_desc:0 "Алмазные Псы Бронзхила признали Галлуса законным со-правителем Герцланда. Обоих королей-диархов теперь защищает прославленная, недавно расширенная Баркгинская Гвардия."
BOI_yale_support:0 "Покровитель науки"
BOI_yale_support_desc:0 "С нашей помощью университеты Йеля вернули себе былую славу и престиж самых влиятельных образовательных учреждений Грифонии."
BOI_noble_obligations:0 "Благонамеренное правительство"
BOI_noble_obligations_desc:0 "Мы приняли серию реформ, направленных на улучшение жизни обычных грифонов и борьбу с коррупцией в рядах дворянства и имперской бюрократии."
BOI_imperial_parliament:0 "Имперский Парламент"
BOI_imperial_parliament_desc:0 "Учреждение нового Имперского Парламента привело к разрядке многих существующих напряженностей и приблизило Имперское Правительство к его грифонам."

