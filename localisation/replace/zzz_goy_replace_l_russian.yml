# ARA guns
ARA_infantry_equipment_0:0 "Garcano Modelle 91 (Арантийская)"
ARA_infantry_equipment_0_short:0 "Garcano M91 (A)"
ARA_infantry_equipment_0_desc:0 "Старая-добрая винтовка Гаркано была принята на вооружение преждевременно из-за войны с Фалькором – и оказалась инновационной, но ненадежной. После окончания войны, улучшенная версия винтовки стала основным оружием Карфинского пакта благодаря очень выгодным лицензионным соглашениям. В результате, каждое государство быстро создали свои версии, которые решали проблемы ранних моделей и лучше соответствовали потребностям их армий."
ARA_infantry_equipment_1:0 "Garcano Modelle 07 (Арантийская)"
ARA_infantry_equipment_1_short:0 "Garcano M07 (A)"
ARA_infantry_equipment_1_desc:0 "В отличие от предыдущей модели, M07 прошла множество испытаний, а уроки войны с Фалькором помогли избежать многих проблем её предшественницы. Кроме того, винтовка проектировалась сразу для всех армий союза, а потому была лёгка в модификации под их потребности. Ко времени кризисов 1007-го серийное производство M07 осуществлялось только в Вингбардии, но прототипы и документация уже были доставлены в другие южные страны, что позволило даже тем, кто разорвал связи с Вингбардией, ввести её в строй."
ARA_infantry_equipment_2:0 "Moschetto Automatico Xiphos 10"
ARA_infantry_equipment_2_short:0 "MAX-10"
ARA_infantry_equipment_2_desc:0 "Компания Ксифос Армс начала свою деятельность с производства вингбардийских винтовок по лицензии. Ее первой самостоятельной разработкой стал пистолет-пулемет для боя в городских условиях, где винтовки Гаркано оказались неудобными. Опыт Ксифос Армс в адаптации зарубежного оружия стал преимуществом, поскольку к своему дебюту конструкторы уже научились на чужих ошибках и сумели избежать большинства недостатков современных пистолетов-пулеметов."
ARA_infantry_equipment_3_short:0 "MLX-13"
ARA_infantry_equipment_3_desc:0 "Первоначально задуманный и разработанный как вспомогательное оружие, MLX-13 появился в результате требований командиров Легиона о "срочном повышении огневой мощи" и в результате, Ксифос Армс просто уменьшили тяжёлый пулемет, сделав его более удобным. Получившееся оружие по-прежнему имело сильную отдачу и большой вес, но быстро стало излюбленным оружием рыцарей, чья интенсивная физическая подготовка позволяла им легко обращаться с ним."
ARA_infantry_equipment_x:0 "Fucile de Battaglia 19 "Виктория""
ARA_infantry_equipment_x_short:0 "FB-19 "Виктория""
ARA_infantry_equipment_x_desc:0 "Хотя первые версии "Виктории" были разработаны и испытаны на поздних этапах Войн за объединение Грифонии, её массовое производство и дальнейшее перевооружение легионов началось только когда войны стихли. В результате "Виктория" использовалась в основном во время колониальных конфликтов за пределами Грифонии, где её прочная конструкция подверглась серьёзным испытаниям в самых суровых условиях — и винтовка с отличием прошла их. Эта надёжная и простая винтовка пользовалась популярностью, даже когда на вооружение поступили более современные образцы."
ARA_infantry_equipment_x_2:0 "Fucile de Battaglia 25 "Арпи""
ARA_infantry_equipment_x_2_short:0 "FB-25 "Арпи""
ARA_infantry_equipment_x_2_desc:0 "Названная в честь мифического меча Спарлоса, "Арпи" на момент своего появления считалася вершиной оружейного дизайна. Однако улучшенные характеристики и более компактная конструкция привели к увеличению производственных затрат, что из-за сокращения численности Легионов в то время привело к ее сосуществованию с "Викторией", пока та не была полностью снята с производства в 1030-х годах."