 ## Manifests ##
 goy_first_and_final_empire_goal_name:0 "First and Final Empire"
 goy_first_and_final_empire_goal_desc:0 "Ours is the heritage of great Arantigos. Ours is a future of glorious conquest and dominion over Griffonia."
 goy_griffonian_hegemony_goal_name:0 "Harmony in Griffonia"
 goy_griffonian_hegemony_goal_desc:0 "No longer shall griffons be united by sword. There is a better future for Griffonia: one of friendship and harmony, one we shall bring!"
 goy_protect_the_north_goal_name:0 "Protectors of the North"
 goy_protect_the_north_goal_desc:0 "The Griffonian North is our home by birthright, and we shall guard it from anyone who dares to take it from us."
 goy_triumph_of_the_revolution_goal_name:0 "Triumph of the Revolution"
 goy_triumph_of_the_revolution_goal_desc:0 "All reactionaries across the globe must be crushed in order for our Revolution to succeed – starting with Griffonia."
 goy_eternal_vigil_goal_name:0 "Eternal Vigil"
 goy_eternal_vigil_goal_desc:0 "We live in an age of war and strife, and only by staying vigilant we can safeguard our future."
 goy_safe_future_name:0 "Protection of Pomovarra"
 goy_safe_future_desc:0 "Pomovarra will never be lost again. We will fight anyone who dares to threaten our freedom."
 goy_continent_domination_goal_name:0 "Continental Domination"
 goy_continent_domination_goal_desc:0 "Time has come for Pomovarra to establish itself as the greatest – and only – power in Griffonia. We will succeed or die trying!"
 goy_new_griffonia_goal_name:0 "New Griffonia"
 goy_new_griffonia_goal_desc:0 "The Aetian dream is one all griffons can share: a dream of unity, peace and prosperity, where all griffons – and all races – are equals, and work together to better themselves and the world around them."
 
 ## Goals ##
 
 # Arantigan Hegemony
 faction_goal_goy_expand_legions_name:0 "Expand the Legions"
 faction_goal_goy_expand_legions_desc:0 "To conquer Griffonia we must create an army greater than any ever seen on the continent."
 faction_goal_goy_titanomachy_name:0 "Gigantomachy"
 faction_goal_goy_titanomachy_desc:0 "Three giants – Wingbardy, Aquileia, and the Empire – stand between us and rule over Griffonia. Conflict is inevitable."
 faction_goal_goy_destroy_old_empire_name:0 "Destroy the Old Empire"
 faction_goal_goy_destroy_old_empire_desc:0 ""
 faction_goal_goy_reclaim_arantigan_homelands_name:0 "Reclaim Karthin"
 faction_goal_goy_reclaim_arantigan_homelands_desc:0 "Seat of the Karthinian Empire, the Eternal City: Karthin is the jewel of the South, and its conquest will serve as a powerful symbol of our return to prominence."
 faction_goal_goy_crush_aquileia_name:0 "Crush Aquileian Ambitions"
 faction_goal_goy_crush_aquileia_desc:0 "Aquileians always tried to become a new hegemon of Griffonia – and each time they failed. This time, we will be the ones to crush their hopes and dreams."
 faction_goal_goy_tame_riverlands_name:0 "Tame the Riverlands"
 faction_goal_goy_tame_riverlands_desc:0 "Even the great conqueror Grover II couldn't manage to subjugate the Riverlands. One way or another, if we want to secure our dominion over the continent, ponies of the East must bow to us."
 faction_goal_goy_colthago_delenda_est_name:0 "Colthago Delenda Est"
 faction_goal_goy_colthago_delenda_est_desc:0 "Just by existing, Colthage taunts us, reminding about the failure of our ancestors in destroying it. Conquering it now will both let us establish control of the southern seas and let us fix the mistake of our Karthinian ancestors."
 faction_goal_goy_humiliate_equestria_name:0 "Humiliate Equestria"
 faction_goal_goy_humiliate_equestria_desc:0 "Equestria stands as the most powerful nation in the world, a continental hegemon and the beacon of harmony. By defeating it, we will prove once and for all that we are one and only superpower."

 # Griffonian Union
 faction_goal_goy_expand_union_name:0 "Expand the Union"
 faction_goal_goy_expand_union_desc:0 ""
 faction_goal_goy_burying_the_hatchet_name:0 "Burying the Hatchet"
 faction_goal_goy_burying_the_hatchet_desc:0 "For too long have wars between the great powers of Griffonia been tearing the continent apart. Only by working together can we create a better future - one based on cooperation, not dominion of one of claimants to the accursed imperial throne. "
 faction_goal_goy_save_pony_friends_name:0 "Save Our Pony Friends"
 faction_goal_goy_save_pony_friends_desc:0 "Equestria has fallen! Vile changelings managed to overcome it, despite brave resistance, and now ponies suffer under the bugs' yoke. It is our moral duty to help our friends beyond the sea reclaim their freedom."
 
 # Northern League/Boreal Alliance
 faction_goal_goy_southern_detente_name:0 "Southern Detente"
 faction_goal_goy_southern_detente_desc:0 "To the south looms the ever-growing danger of the Griffonian Empire's resurgence. We can’t fight them head-on – at least for now. So it seems that we should try to achieve some sort of a deal with griffons – even if only to delay their invasion."
 faction_goal_goy_northern_triangle_name:0 "Northern Triangle"
 faction_goal_goy_northern_triangle_desc:0 "Nations of the North must stand together if they want to remain free!"
 faction_goal_goy_red_sunset_name:0 "The Red Sun Sets"
 faction_goal_goy_red_sunset_desc:0 "Communism is a threat to our freedom and way of life! We must eradicate this taint before it has had the chance to set roots in the North."
 faction_goal_goy_north_endures_name:0 "The North Endures!"
 faction_goal_goy_north_endures_desc:0 "Through hardship and struggle we will persist! The road ahead is long and rocky, but we must push on and secure a future for all of the North."
 
 # Revolucia Avangardo
 faction_goal_goy_swords_of_the_revolution_name:0 "Swords of the Revolution"
 faction_goal_goy_swords_of_the_revolution_desc:0 "Political power grows out of the barrel of a gun!"
 faction_goal_goy_expand_revolutionary_guard_name:0 "Expand the Revolutionary Guard"
 faction_goal_goy_expand_revolutionary_guard_desc:0 "Many will die for the Revolution. Yet, even more will rise to fight for its inevitable triumph!"
 faction_goal_goy_triumph_over_imperialism_name:0 "Triumph Over Imperialism"
 faction_goal_goy_triumph_over_imperialism_desc:0 ""
 faction_goal_goy_red_tide_rising_name:0 "Red Tide Rising"
 faction_goal_goy_red_tide_rising_desc:0 "Every day we are closer to the triumph of the Revolution. Every day reactionary regimes of Griffonia fall. Yet, there is still much to be done! Onwards, comrades! To the next conquest – and to the next victory! "
 
 # Pact of Bronze/Pomovarran Pact
 faction_goal_goy_shield_of_bronze_name:0 "Shield of Bronze"
 faction_goal_goy_shield_of_bronze_desc:0 "We must expand our armed forces if we want to safeguard our freedom."
 faction_goal_goy_bronze_citadel_name:0 "The Bronze Citadel"
 faction_goal_goy_bronze_citadel_desc:0 "There is no such thing as too many fortifications! We must build even more!"
 faction_goal_goy_reforged_blade_name:0 "The Reforged Blade"
 faction_goal_goy_reforged_blade_desc:0 "Weapons! This is what we need. More weapons equals more security. Get me more weapons!"
 faction_goal_goy_griffonian_hegemon_name:0 "Griffonian Hegemony"
 faction_goal_goy_griffonian_hegemon_desc:0 "Establishing ourselves as the clear leading power of the continent will allow us to safeguard our interests and intimidate our foes."
 faction_goal_goy_sea_boars_name:0 "Sea Boars"
 faction_goal_goy_sea_boars_desc:0 "A large navy will both allow us to protect our shores and safeguard our commercial and political interests beyond the seas."
 
 # Pomovarran Dominion
 faction_goal_goy_slay_great_maar_name:0 "Slay the Great Maar"
 faction_goal_goy_slay_great_maar_desc:0 "Aquileia must fall for Pomovarra to rise! "
 faction_goal_goy_reclaim_our_past_name:0 "Reclaim Our Past"
 faction_goal_goy_reclaim_our_past_desc:0 "Much was lost to time... But we shall reclaim all secrets of Old Pomovarra and use them to vanquish our foes."
 faction_goal_goy_gather_our_kin_name:0 "Gather Our Kin"
 faction_goal_goy_gather_our_kin_desc:0 "It is our duty to liberate all old territories of Pomovarra – and griffons living there."
 faction_goal_goy_dominion_over_griffonia_name:0 "Dominion Over Griffonia"
 faction_goal_goy_dominion_over_griffonia_desc:0 "Pomovarra will be an empire, or will cease to exist. Only the mighty can decide the fate of Griffonia – and we shall be the mightiest empire of all."
 
 # Aetian League
 faction_goal_goy_ploughs_into_swords_name:0 "Swords into Ploughs"
 faction_goal_goy_ploughs_into_swords_desc:0 "Time has come to bring an age of peace and prosperity to our people. To turn foundries of war into factories which will produce goods that make lives of griffons easier."
 faction_goal_goy_city_of_desire_name:0 "The City of Griffonia's Desire"
 faction_goal_goy_city_of_desire_desc:0 "We need a powerful symbol to show all griffons that our way is the only correct one. We need a city that will be a beacon of hope and prosperity, a showcase of the future we dream of."
 faction_goal_goy_workshop_of_griffonia_name:0 "Workshop of Griffonia"
 faction_goal_goy_workshop_of_griffonia_desc:0 "We live in an era of industry – as well as the Aetian era, of course. We must fit the concept of highly efficient and modern industry into the Aetian dream."
 faction_goal_goy_light_in_the_west_name:0 "A Light in the West"
 faction_goal_goy_light_in_the_west_desc:0 ""
 
 # Griffonian Union + Aetian League
 faction_goal_goy_beacons_of_progress_name:0 "Beacons of Progress"
 faction_goal_goy_beacons_of_progress_desc:0 "Much remains to be done? but a good start would be to continue expanding our industrial regions to ensure economic growth for a bright future for the next generation of griffons."